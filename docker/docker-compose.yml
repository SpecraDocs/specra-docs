version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: specra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-specra_dev}
      POSTGRES_DB: specra
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U specra"]
      interval: 5s
      timeout: 3s
      retries: 5

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "2019:2019"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    environment:
      CF_API_TOKEN: ${CF_API_TOKEN:-}

  specra-docs:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://specra:${POSTGRES_PASSWORD:-specra_dev}@postgres:5432/specra
      DOCKER_SOCKET_PATH: /var/run/docker.sock
      CADDY_ADMIN_URL: http://caddy:2019
      DOCS_BASE_DOMAIN: docs.specra.dev
      PROJECTS_DATA_DIR: /data/specra/projects
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - projects_data:/data/specra/projects
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  projects_data:
