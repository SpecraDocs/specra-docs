d\"\n/\u003e\n```\n\n## Ejemplos en vivo\n\n### Tarjeta básica\n\n\u003cCard \n  title=\"Documentación\" \n  description=\"Lea la documentación completa para guías detalladas y referencias de API.\"\n/\u003e\n\n### Tarjeta vinculada\n\n\u003cCard \n  title=\"Empezando\" \n  description=\"Comience su viaje con nuestra guía de inicio rápido\"\n  href=\"/docs/v1.0.0/getting-started\"\n/\u003e\n\n### Tarjeta con icono\n\n\u003cCard \n  icon=\"book-open\"\n  title=\"Guías\" \n  description=\"Tutoriales paso a paso y mejores prácticas\"\n/\u003e\n\n### Enlace externo\n\n\u003cCard \n  title=\"Repositorio GitHub\" \n  description=\"Ver el código fuente y contribuir\"\n  href=\"https://github.com\"\n  external\n/\u003e\n\n## Cuadrícula de tarjetas\n\nUse `CardGrid` para mostrar varias tarjetas en un diseño de cuadrícula adaptable:\n\n```mdx\n\u003cCardGrid cols={2}\u003e\n  \u003cCard title=\"Tarjeta 1\" description=\"Primera tarjeta\" /\u003e\n  \u003cCard title=\"Tarjeta 2\" description=\"Segunda tarjeta\" /\u003e\n\u003c/CardGrid\u003e\n```\n\n\u003cCardGrid cols={2}\u003e\n  \u003cCard icon=\"rocket\" title=\"Inicio rápido\" description=\"Póngase en marcha en 5 minutos\" href=\"/docs/v1.0.0/getting-started/quickstart\" /\u003e\n  \u003cCard icon=\"book\" title=\"Guías\" description=\"Tutoriales detallados y recorridos\" href=\"/docs/v1.0.0/guides\" /\u003e\n  \u003cCard icon=\"code\" title=\"Referencia API\" description=\"Documentación completa de la API\" /\u003e\n  \u003cCard icon=\"github\" title=\"GitHub\" description=\"Contribuir al proyecto\" href=\"https://github.com\" external /\u003e\n\u003c/CardGrid\u003e\n\n## Props\n\n### Card\n\n| Propiedad | Tipo | Predeterminado | Descripción |\n|-----------|------|----------------|-------------|\n| `title` | `string` | requerido | Título de la tarjeta |\n| `description` | `string` | - | Texto de descripción de la tarjeta |\n| `href` | `string` | - | URL del enlace (hace que la tarjeta sea clicable) |\n| `icon` | `string \\| ReactNode` | - | Nombre del icono Lucide o icono personalizado |\n| `external` | `boolean` | `false` | Abre el enlace en una nueva pestaña |\n| `children` | `ReactNode` | - | Contenido personalizado |\n\n### CardGrid\n\n| Propiedad | Tipo | Predeterminado | Descripción |\n|-----------|------|----------------|-------------|\n| `children` | `ReactNode` | requerido | Componentes de tarjeta |\n| `cols` | `1 \\| 2 \\| 3` | `2` | Número de columnas |\n"])</script><script>self.__next_f.push([1,"43:T2f67,"])</script><script>self.__next_f.push([1,"\n# Configuración Avanzada\n\nMás allá de lo básico, Specra ofrece características potentes como análisis, búsqueda, pies de página personalizados, banners y variables de entorno. Esta guía cubre todas las opciones de configuración avanzada.\n\n## Análisis\n\nRastree cómo los usuarios interactúan con su documentación.\n\n### Google Analytics\n\n```json\n{\n  \"analytics\": {\n    \"googleAnalytics\": \"G-XXXXXXXXXX\"\n  }\n}\n```\n\nObtenga su ID de medición de [Google Analytics](https://analytics.google.com).\n\n### Google Tag Manager\n\n```json\n{\n  \"analytics\": {\n    \"googleTagManager\": \"GTM-XXXXXXX\"\n  }\n}\n```\n\nMás flexible que Google Analytics, permite un seguimiento personalizado sin cambios de código.\n\n### Plausible Analytics\n\nAlternativa compatible con la privacidad a Google Analytics:\n\n```json\n{\n  \"analytics\": {\n    \"plausible\": \"docs.example.com\"\n  }\n}\n```\n\nRegístrese en [plausible.io](https://plausible.io).\n\n### Análisis Múltiples\n\nUse varios proveedores simultáneamente:\n\n```json\n{\n  \"analytics\": {\n    \"googleAnalytics\": \"G-XXXXXXXXXX\",\n    \"plausible\": \"docs.example.com\"\n  }\n}\n```\n\n## Configuración de Búsqueda\n\nHabilite una búsqueda potente para su documentación.\n\n### Configuración Básica de Búsqueda\n\n```json\n{\n  \"search\": {\n    \"enabled\": true,\n    \"placeholder\": \"Buscar documentación...\",\n    \"provider\": \"meilisearch\"\n  }\n}\n```\n\n### MeiliSearch\n\nBúsqueda con todas las funciones con tolerancia a errores tipográficos:\n\n```json\n{\n  \"search\": {\n    \"enabled\": true,\n    \"provider\": \"meilisearch\",\n    \"meilisearch\": {\n      \"host\": \"https://search.example.com\",\n      \"apiKey\": \"su-clave-de-busqueda\",\n      \"indexName\": \"docs\"\n    }\n  }\n}\n```\n\nConsulte [Configuración de Búsqueda](/docs/v1.0.0/search-setup) para la configuración completa de MeiliSearch.\n\n### Búsqueda Local\n\nBúsqueda simple sin dependencias externas:\n\n```json\n{\n  \"search\": {\n    \"enabled\": true,\n    \"provider\": \"local\",\n    \"placeholder\": \"Buscar...\"\n  }\n}\n```\n\n**Pros:**\n- No requiere configuración\n- Funciona sin conexión\n- Gratis\n\n**Contras:**\n- Menos potente que MeiliSearch\n- Sin tolerancia a errores tipográficos\n- Más lento para sitios grandes\n\n## Configuración del Pie de Página\n\nPersonalice el pie de página de su documentación.\n\n### Pie de Página Básico\n\n```json\n{\n  \"footer\": {\n    \"copyright\": \"© 2024 Mi Empresa. Todos los derechos reservados.\"\n  }\n}\n```\n\n### Pie de Página Completo\n\n```json\n{\n  \"footer\": {\n    \"copyright\": \"© 2024 Acme Corp. Todos los derechos reservados.\",\n    \"customContent\": \"\u003cp\u003e¿Necesita ayuda? \u003ca href='/support'\u003eContactar soporte\u003c/a\u003e\u003c/p\u003e\",\n    \"links\": [\n      {\n        \"title\": \"Producto\",\n        \"items\": [\n          { \"label\": \"Características\", \"href\": \"/features\" },\n          { \"label\": \"Precios\", \"href\": \"/pricing\" },\n          { \"label\": \"Registro de cambios\", \"href\": \"/changelog\" }\n        ]\n      },\n      {\n        \"title\": \"Recursos\",\n        \"items\": [\n          { \"label\": \"Documentación\", \"href\": \"/docs\" },\n          { \"label\": \"Referencia API\", \"href\": \"/api\" },\n          { \"label\": \"Ejemplos\", \"href\": \"/examples\" }\n        ]\n      },\n      {\n        \"title\": \"Empresa\",\n        \"items\": [\n          { \"label\": \"Acerca de\", \"href\": \"/about\" },\n          { \"label\": \"Blog\", \"href\": \"/blog\" },\n          { \"label\": \"Carreras\", \"href\": \"/careers\" }\n        ]\n      }\n    ],\n    \"branding\": {\n      \"showBranding\": true,\n      \"logo\": \"/brand-logo.svg\",\n      \"title\": \"Desarrollado por Specra\",\n      \"url\": \"https://specra.dev\"\n    }\n  }\n}\n```\n\n### Opciones del Pie de Página\n\n**copyright**\n- Aviso de derechos de autor mostrado en la parte inferior\n- Admite HTML\n\n**customContent**\n- HTML personalizado insertado en el pie de página\n- Úselo para mensajes o enlaces adicionales\n\n**links**\n- Columnas de enlaces organizadas\n- Cada columna tiene un título y elementos\n- Los elementos tienen etiqueta y href\n\n**branding**\n- Muestra la marca \"Desarrollado por\"\n- Personalice el logotipo, el título y la URL\n- Establezca `showBranding: false` para ocultar\n\n## Configuración del Banner\n\nMuestre mensajes importantes en la parte superior de su sitio.\n\n### Banner Básico\n\n```json\n{\n  \"banner\": {\n    \"enabled\": true,\n    \"message\": \"📢 ¡La versión 2.0 ya está disponible!\",\n    \"type\": \"info\"\n  }\n}\n```\n\n### Opciones del Banner\n\n```json\n{\n  \"banner\": {\n    \"enabled\": true,\n    \"message\": \"⚠️ Mantenimiento programado el domingo a las 2 AM UTC\",\n    \"type\": \"warning\",\n    \"dismissible\": true\n  }\n}\n```\n\n**Propiedades:**\n\n| Propiedad | Tipo | Descripción |\n|-----------|------|-------------|\n| `enabled` | boolean | Mostrar u ocultar banner |\n| `message` | string | Texto del banner (admite emojis y HTML) |\n| `type` | string | Estilo: `info`, `warning`, `success`, `error` |\n| `dismissible` | boolean | Permitir a los usuarios descartar el banner |\n\n### Tipos de Banners\n\n**Info (azul):**\n```json\n{\n  \"banner\": {\n    \"message\": \"📢 Nueva característica: ¡El modo oscuro está aquí!\",\n    \"type\": \"info\"\n  }\n}\n```\n\n**Advertencia (amarillo):**\n```json\n{\n  \"banner\": {\n    \"message\": \"⚠️ La API v1 quedará obsoleta el 1 de enero de 2025\",\n    \"type\": \"warning\"\n  }\n}\n```\n\n**Éxito (verde):**\n```json\n{\n  \"banner\": {\n    \"message\": \"✅ Todos los sistemas operativos\",\n    \"type\": \"success\"\n  }\n}\n```\n\n**Error (rojo):**\n```json\n{\n  \"banner\": {\n    \"message\": \"🚨 Actualización de seguridad crítica disponible\",\n    \"type\": \"error\"\n  }\n}\n```\n\n## Configuración de Características\n\nHabilite o deshabilite varias características de documentación.\n\n```json\n{\n  \"features\": {\n    \"editUrl\": \"https://github.com/username/repo/edit/main/docs\",\n    \"showLastUpdated\": true,\n    \"showReadingTime\": true,\n    \"showAuthors\": false,\n    \"showTags\": true,\n    \"versioning\": true,\n    \"i18n\": false\n  }\n}\n```\n\n### Opciones de Características\n\n**editUrl**\n- Enlace para editar la fuente de la página\n- Aparece en la parte inferior de cada página\n- Use GitHub, GitLab o cualquier URL de alojamiento de Git\n- Establezca en `false` para deshabilitar\n\n**showLastUpdated**\n- Mostrar cuándo se modificó la página por última vez\n- Usa marcas de tiempo de commit de git\n- Aparece en la parte inferior de la página\n\n**showReadingTime**\n- Estimación del tiempo de lectura (palabras por minuto)\n- Muestra \"5 min de lectura\" en la parte superior de la página\n\n**showAuthors**\n- Mostrar autores de la página\n- Requiere información del autor en el frontmatter\n\n**showTags**\n- Mostrar etiquetas en las páginas\n- Requiere etiquetas en el frontmatter\n\n**versioning**\n- Habilitar control de versiones de documentación\n- Admite múltiples versiones de doc (v1.0.0, v2.0.0)\n\n**i18n**\n- Habilitar internacionalización\n- Admite múltiples idiomas\n\n## Enlaces Sociales\n\nAgregue enlaces de redes sociales a su encabezado.\n\n```json\n{\n  \"social\": {\n    \"github\": \"https://github.com/username/repo\",\n    \"twitter\": \"https://twitter.com/username\",\n    \"discord\": \"https://discord.gg/invite\",\n    \"linkedin\": \"https://linkedin.com/company/name\",\n    \"youtube\": \"https://youtube.com/@channel\"\n  }\n}\n```\n\n### Enlaces Sociales Personalizados\n\nAgregue enlaces a plataformas no integradas:\n\n```json\n{\n  \"social\": {\n    \"github\": \"https://github.com/username\",\n    \"custom\": [\n      {\n        \"label\": \"Slack\",\n        \"url\": \"https://slack.com/invite\",\n        \"icon\": \"slack\"\n      },\n      {\n        \"label\": \"Sitio web\",\n        \"url\": \"https://example.com\",\n        \"icon\": \"globe\"\n      }\n    ]\n  }\n}\n```\n\n## Variables de Entorno\n\nUse variables de entorno en su configuración y contenido MDX.\n\n### En Configuración\n\n```json\n{\n  \"env\": {\n    \"API_BASE_URL\": \"https://api.example.com\",\n    \"API_VERSION\": \"v1\",\n    \"CDN_URL\": \"https://cdn.example.com\",\n    \"SUPPORT_EMAIL\": \"support@example.com\"\n  }\n}\n```\n\nAcceso en MDX:\n\n```mdx\nPunto final de API: {process.env.API_BASE_URL}\nVersión actual: {process.env.API_VERSION}\n```\n\n### Desde Archivos .env\n\nEstablecer valores a través de archivos de entorno:\n\n```bash\n# .env.local\nAPI_BASE_URL=https://api.example.com\nMEILISEARCH_HOST=https://search.example.com\nMEILISEARCH_API_KEY=your-key\n```\n\nReferencia en configuración:\n\n```json\n{\n  \"env\": {\n    \"API_BASE_URL\": \"${API_BASE_URL}\"\n  },\n  \"search\": {\n    \"meilisearch\": {\n      \"host\": \"${MEILISEARCH_HOST}\",\n      \"apiKey\": \"${MEILISEARCH_API_KEY}\"\n    }\n  }\n}\n```\n\n\u003cCallout type=\"warning\"\u003e\nNunca confirme claves confidenciales en el control de versiones. Use variables de entorno y agregue `.env.local` a `.gitignore`.\n\u003c/Callout\u003e\n\n### Variables Públicas vs Privadas\n\n**Privado (solo servidor):**\n```\nMEILISEARCH_API_KEY=secret-key\nDATABASE_URL=postgres://...\n```\n\n**Público (expuesto al navegador):**\n```\nNEXT_PUBLIC_GA_ID=G-XXXXXXXXXX\nNEXT_PUBLIC_API_URL=https://api.example.com\n```\n\nPrefije con `NEXT_PUBLIC_` para que las variables estén disponibles en el navegador.\n\n## Configuración del Tema\n\nPersonalice la apariencia visual.\n\n```json\n{\n  \"theme\": {\n    \"defaultMode\": \"system\",\n    \"respectPrefersColorScheme\": true,\n    \"primaryColor\": \"#3b82f6\",\n    \"customCss\": \"/custom.css\"\n  }\n}\n```\n\n**defaultMode**\n- `\"system\"` - Coincidir con la preferencia del sistema operativo\n- `\"light\"` - Siempre modo claro\n- `\"dark\"` - Siempre modo oscuro\n\n**respectPrefersColorScheme**\n- Respetar la preferencia de esquema de color del sistema operativo\n- Establezca en `false` para ignorar la configuración del sistema operativo\n\n**primaryColor**\n- Color principal de la marca (código hexadecimal)\n- Usado para enlaces, botones, acentos\n\n**customCss**\n- Ruta al archivo CSS personalizado\n- Agregue en la carpeta `public/`\n\nConsulte [Personalización](/docs/v1.0.0/customization) para obtener una guía detallada de temas.\n\n## Ejemplo Completo\n\nAquí hay una configuración de Specra completamente configurada:\n\n```json\n{\n  \"site\": {\n    \"title\": \"Documentación Acme\",\n    \"description\": \"Docs completos para la plataforma Acme\",\n    \"url\": \"https://docs.acme.com\"\n  },\n  \"theme\": {\n    \"defaultMode\": \"system\",\n    \"primaryColor\": \"#6366f1\"\n  },\n  \"navigation\": {\n    \"showSidebar\": true,\n    \"showTableOfContents\": true,\n    \"tocPosition\": \"right\",\n    \"tabGroups\": [\n      { \"id\": \"guides\", \"label\": \"Guías\", \"icon\": \"book-open\" },\n      { \"id\": \"api\", \"label\": \"API\", \"icon\": \"zap\" }\n    ]\n  },\n  \"search\": {\n    \"enabled\": true,\n    \"provider\": \"meilisearch\",\n    \"meilisearch\": {\n      \"host\": \"${MEILISEARCH_HOST}\",\n      \"apiKey\": \"${MEILISEARCH_API_KEY}\",\n      \"indexName\": \"docs\"\n    }\n  },\n  \"analytics\": {\n    \"googleAnalytics\": \"G-XXXXXXXXXX\",\n    \"plausible\": \"docs.acme.com\"\n  },\n  \"social\": {\n    \"github\": \"https://github.com/acme/platform\",\n    \"twitter\": \"https://twitter.com/acme\",\n    \"discord\": \"https://discord.gg/acme\"\n  },\n  \"footer\": {\n    \"copyright\": \"© 2024 Acme Corp. Todos los derechos reservados.\",\n    \"links\": [\n      {\n        \"title\": \"Producto\",\n        \"items\": [\n          { \"label\": \"Características\", \"href\": \"/features\" },\n          { \"label\": \"Precios\", \"href\": \"/pricing\" }\n        ]\n      }\n    ]\n  },\n  \"banner\": {\n    \"enabled\": true,\n    \"message\": \"📢 ¡La versión 2.0 ya está disponible!\",\n    \"type\": \"info\",\n    \"dismissible\": true\n  },\n  \"features\": {\n    \"editUrl\": \"https://github.com/acme/platform/edit/main/docs\",\n    \"showLastUpdated\": true,\n    \"showReadingTime\": true,\n    \"showTags\": true,\n    \"versioning\": true\n  },\n  \"deployment\": {\n    \"target\": \"vercel\"\n  }\n}\n```\n\n## Próximos pasos\n\n\u003cCardGrid cols={2}\u003e\n  \u003cCard\n    icon=\"search\"\n    title=\"Configuración de Búsqueda\"\n    description=\"Configure MeiliSearch para sus docs\"\n    href=\"/docs/v1.0.0/search-setup\"\n  /\u003e\n  \u003cCard\n    icon=\"palette\"\n    title=\"Personalización\"\n    description=\"Tema y estilo de su documentación\"\n    href=\"/docs/v1.0.0/customization\"\n  /\u003e\n  \u003cCard\n    icon=\"rocket\"\n    title=\"Implementación\"\n    description=\"Desplegar a producción\"\n    href=\"/docs/v1.0.0/deployment/overview\"\n  /\u003e\n  \u003cCard\n    icon=\"arrow-left\"\n    title=\"Descripción general de la configuración\"\n    description=\"Volver a la descripción general de la configuración\"\n    href=\"/docs/v1.0.0/configuration/overview\"\n  /\u003e\n\u003c/CardGrid\u003e\n"])</script><script>self.__next_f.push([1,"44:T2f67,"])</script><script>self.__next_f.push([1,"\n# Configuración Avanzada\n\nMás allá de lo básico, Specra ofrece características potentes como análisis, búsqueda, pies de página personalizados, banners y variables de entorno. Esta guía cubre todas las opciones de configuración avanzada.\n\n## Análisis\n\nRastree cómo los usuarios interactúan con su documentación.\n\n### Google Analytics\n\n```json\n{\n  \"analytics\": {\n    \"googleAnalytics\": \"G-XXXXXXXXXX\"\n  }\n}\n```\n\nObtenga su ID de medición de [Google Analytics](https://analytics.google.com).\n\n### Google Tag Manager\n\n```json\n{\n  \"analytics\": {\n    \"googleTagManager\": \"GTM-XXXXXXX\"\n  }\n}\n```\n\nMás flexible que Google Analytics, permite un seguimiento personalizado sin cambios de código.\n\n### Plausible Analytics\n\nAlternativa compatible con la privacidad a Google Analytics:\n\n```json\n{\n  \"analytics\": {\n    \"plausible\": \"docs.example.com\"\n  }\n}\n```\n\nRegístrese en [plausible.io](https://plausible.io).\n\n### Análisis Múltiples\n\nUse varios proveedores simultáneamente:\n\n```json\n{\n  \"analytics\": {\n    \"googleAnalytics\": \"G-XXXXXXXXXX\",\n    \"plausible\": \"docs.example.com\"\n  }\n}\n```\n\n## Configuración de Búsqueda\n\nHabilite una búsqueda potente para su documentación.\n\n### Configuración Básica de Búsqueda\n\n```json\n{\n  \"search\": {\n    \"enabled\": true,\n    \"placeholder\": \"Buscar documentación...\",\n    \"provider\": \"meilisearch\"\n  }\n}\n```\n\n### MeiliSearch\n\nBúsqueda con todas las funciones con tolerancia a errores tipográficos:\n\n```json\n{\n  \"search\": {\n    \"enabled\": true,\n    \"provider\": \"meilisearch\",\n    \"meilisearch\": {\n      \"host\": \"https://search.example.com\",\n      \"apiKey\": \"su-clave-de-busqueda\",\n      \"indexName\": \"docs\"\n    }\n  }\n}\n```\n\nConsulte [Configuración de Búsqueda](/docs/v1.0.0/search-setup) para la configuración completa de MeiliSearch.\n\n### Búsqueda Local\n\nBúsqueda simple sin dependencias externas:\n\n```json\n{\n  \"search\": {\n    \"enabled\": true,\n    \"provider\": \"local\",\n    \"placeholder\": \"Buscar...\"\n  }\n}\n```\n\n**Pros:**\n- No requiere configuración\n- Funciona sin conexión\n- Gratis\n\n**Contras:**\n- Menos potente que MeiliSearch\n- Sin tolerancia a errores tipográficos\n- Más lento para sitios grandes\n\n## Configuración del Pie de Página\n\nPersonalice el pie de página de su documentación.\n\n### Pie de Página Básico\n\n```json\n{\n  \"footer\": {\n    \"copyright\": \"© 2024 Mi Empresa. Todos los derechos reservados.\"\n  }\n}\n```\n\n### Pie de Página Completo\n\n```json\n{\n  \"footer\": {\n    \"copyright\": \"© 2024 Acme Corp. Todos los derechos reservados.\",\n    \"customContent\": \"\u003cp\u003e¿Necesita ayuda? \u003ca href='/support'\u003eContactar soporte\u003c/a\u003e\u003c/p\u003e\",\n    \"links\": [\n      {\n        \"title\": \"Producto\",\n        \"items\": [\n          { \"label\": \"Características\", \"href\": \"/features\" },\n          { \"label\": \"Precios\", \"href\": \"/pricing\" },\n          { \"label\": \"Registro de cambios\", \"href\": \"/changelog\" }\n        ]\n      },\n      {\n        \"title\": \"Recursos\",\n        \"items\": [\n          { \"label\": \"Documentación\", \"href\": \"/docs\" },\n          { \"label\": \"Referencia API\", \"href\": \"/api\" },\n          { \"label\": \"Ejemplos\", \"href\": \"/examples\" }\n        ]\n      },\n      {\n        \"title\": \"Empresa\",\n        \"items\": [\n          { \"label\": \"Acerca de\", \"href\": \"/about\" },\n          { \"label\": \"Blog\", \"href\": \"/blog\" },\n          { \"label\": \"Carreras\", \"href\": \"/careers\" }\n        ]\n      }\n    ],\n    \"branding\": {\n      \"showBranding\": true,\n      \"logo\": \"/brand-logo.svg\",\n      \"title\": \"Desarrollado por Specra\",\n      \"url\": \"https://specra.dev\"\n    }\n  }\n}\n```\n\n### Opciones del Pie de Página\n\n**copyright**\n- Aviso de derechos de autor mostrado en la parte inferior\n- Admite HTML\n\n**customContent**\n- HTML personalizado insertado en el pie de página\n- Úselo para mensajes o enlaces adicionales\n\n**links**\n- Columnas de enlaces organizadas\n- Cada columna tiene un título y elementos\n- Los elementos tienen etiqueta y href\n\n**branding**\n- Muestra la marca \"Desarrollado por\"\n- Personalice el logotipo, el título y la URL\n- Establezca `showBranding: false` para ocultar\n\n## Configuración del Banner\n\nMuestre mensajes importantes en la parte superior de su sitio.\n\n### Banner Básico\n\n```json\n{\n  \"banner\": {\n    \"enabled\": true,\n    \"message\": \"📢 ¡La versión 2.0 ya está disponible!\",\n    \"type\": \"info\"\n  }\n}\n```\n\n### Opciones del Banner\n\n```json\n{\n  \"banner\": {\n    \"enabled\": true,\n    \"message\": \"⚠️ Mantenimiento programado el domingo a las 2 AM UTC\",\n    \"type\": \"warning\",\n    \"dismissible\": true\n  }\n}\n```\n\n**Propiedades:**\n\n| Propiedad | Tipo | Descripción |\n|-----------|------|-------------|\n| `enabled` | boolean | Mostrar u ocultar banner |\n| `message` | string | Texto del banner (admite emojis y HTML) |\n| `type` | string | Estilo: `info`, `warning`, `success`, `error` |\n| `dismissible` | boolean | Permitir a los usuarios descartar el banner |\n\n### Tipos de Banners\n\n**Info (azul):**\n```json\n{\n  \"banner\": {\n    \"message\": \"📢 Nueva característica: ¡El modo oscuro está aquí!\",\n    \"type\": \"info\"\n  }\n}\n```\n\n**Advertencia (amarillo):**\n```json\n{\n  \"banner\": {\n    \"message\": \"⚠️ La API v1 quedará obsoleta el 1 de enero de 2025\",\n    \"type\": \"warning\"\n  }\n}\n```\n\n**Éxito (verde):**\n```json\n{\n  \"banner\": {\n    \"message\": \"✅ Todos los sistemas operativos\",\n    \"type\": \"success\"\n  }\n}\n```\n\n**Error (rojo):**\n```json\n{\n  \"banner\": {\n    \"message\": \"🚨 Actualización de seguridad crítica disponible\",\n    \"type\": \"error\"\n  }\n}\n```\n\n## Configuración de Características\n\nHabilite o deshabilite varias características de documentación.\n\n```json\n{\n  \"features\": {\n    \"editUrl\": \"https://github.com/username/repo/edit/main/docs\",\n    \"showLastUpdated\": true,\n    \"showReadingTime\": true,\n    \"showAuthors\": false,\n    \"showTags\": true,\n    \"versioning\": true,\n    \"i18n\": false\n  }\n}\n```\n\n### Opciones de Características\n\n**editUrl**\n- Enlace para editar la fuente de la página\n- Aparece en la parte inferior de cada página\n- Use GitHub, GitLab o cualquier URL de alojamiento de Git\n- Establezca en `false` para deshabilitar\n\n**showLastUpdated**\n- Mostrar cuándo se modificó la página por última vez\n- Usa marcas de tiempo de commit de git\n- Aparece en la parte inferior de la página\n\n**showReadingTime**\n- Estimación del tiempo de lectura (palabras por minuto)\n- Muestra \"5 min de lectura\" en la parte superior de la página\n\n**showAuthors**\n- Mostrar autores de la página\n- Requiere información del autor en el frontmatter\n\n**showTags**\n- Mostrar etiquetas en las páginas\n- Requiere etiquetas en el frontmatter\n\n**versioning**\n- Habilitar control de versiones de documentación\n- Admite múltiples versiones de doc (v1.0.0, v2.0.0)\n\n**i18n**\n- Habilitar internacionalización\n- Admite múltiples idiomas\n\n## Enlaces Sociales\n\nAgregue enlaces de redes sociales a su encabezado.\n\n```json\n{\n  \"social\": {\n    \"github\": \"https://github.com/username/repo\",\n    \"twitter\": \"https://twitter.com/username\",\n    \"discord\": \"https://discord.gg/invite\",\n    \"linkedin\": \"https://linkedin.com/company/name\",\n    \"youtube\": \"https://youtube.com/@channel\"\n  }\n}\n```\n\n### Enlaces Sociales Personalizados\n\nAgregue enlaces a plataformas no integradas:\n\n```json\n{\n  \"social\": {\n    \"github\": \"https://github.com/username\",\n    \"custom\": [\n      {\n        \"label\": \"Slack\",\n        \"url\": \"https://slack.com/invite\",\n        \"icon\": \"slack\"\n      },\n      {\n        \"label\": \"Sitio web\",\n        \"url\": \"https://example.com\",\n        \"icon\": \"globe\"\n      }\n    ]\n  }\n}\n```\n\n## Variables de Entorno\n\nUse variables de entorno en su configuración y contenido MDX.\n\n### En Configuración\n\n```json\n{\n  \"env\": {\n    \"API_BASE_URL\": \"https://api.example.com\",\n    \"API_VERSION\": \"v1\",\n    \"CDN_URL\": \"https://cdn.example.com\",\n    \"SUPPORT_EMAIL\": \"support@example.com\"\n  }\n}\n```\n\nAcceso en MDX:\n\n```mdx\nPunto final de API: {process.env.API_BASE_URL}\nVersión actual: {process.env.API_VERSION}\n```\n\n### Desde Archivos .env\n\nEstablecer valores a través de archivos de entorno:\n\n```bash\n# .env.local\nAPI_BASE_URL=https://api.example.com\nMEILISEARCH_HOST=https://search.example.com\nMEILISEARCH_API_KEY=your-key\n```\n\nReferencia en configuración:\n\n```json\n{\n  \"env\": {\n    \"API_BASE_URL\": \"${API_BASE_URL}\"\n  },\n  \"search\": {\n    \"meilisearch\": {\n      \"host\": \"${MEILISEARCH_HOST}\",\n      \"apiKey\": \"${MEILISEARCH_API_KEY}\"\n    }\n  }\n}\n```\n\n\u003cCallout type=\"warning\"\u003e\nNunca confirme claves confidenciales en el control de versiones. Use variables de entorno y agregue `.env.local` a `.gitignore`.\n\u003c/Callout\u003e\n\n### Variables Públicas vs Privadas\n\n**Privado (solo servidor):**\n```\nMEILISEARCH_API_KEY=secret-key\nDATABASE_URL=postgres://...\n```\n\n**Público (expuesto al navegador):**\n```\nNEXT_PUBLIC_GA_ID=G-XXXXXXXXXX\nNEXT_PUBLIC_API_URL=https://api.example.com\n```\n\nPrefije con `NEXT_PUBLIC_` para que las variables estén disponibles en el navegador.\n\n## Configuración del Tema\n\nPersonalice la apariencia visual.\n\n```json\n{\n  \"theme\": {\n    \"defaultMode\": \"system\",\n    \"respectPrefersColorScheme\": true,\n    \"primaryColor\": \"#3b82f6\",\n    \"customCss\": \"/custom.css\"\n  }\n}\n```\n\n**defaultMode**\n- `\"system\"` - Coincidir con la preferencia del sistema operativo\n- `\"light\"` - Siempre modo claro\n- `\"dark\"` - Siempre modo oscuro\n\n**respectPrefersColorScheme**\n- Respetar la preferencia de esquema de color del sistema operativo\n- Establezca en `false` para ignorar la configuración del sistema operativo\n\n**primaryColor**\n- Color principal de la marca (código hexadecimal)\n- Usado para enlaces, botones, acentos\n\n**customCss**\n- Ruta al archivo CSS personalizado\n- Agregue en la carpeta `public/`\n\nConsulte [Personalización](/docs/v1.0.0/customization) para obtener una guía detallada de temas.\n\n## Ejemplo Completo\n\nAquí hay una configuración de Specra completamente configurada:\n\n```json\n{\n  \"site\": {\n    \"title\": \"Documentación Acme\",\n    \"description\": \"Docs completos para la plataforma Acme\",\n    \"url\": \"https://docs.acme.com\"\n  },\n  \"theme\": {\n    \"defaultMode\": \"system\",\n    \"primaryColor\": \"#6366f1\"\n  },\n  \"navigation\": {\n    \"showSidebar\": true,\n    \"showTableOfContents\": true,\n    \"tocPosition\": \"right\",\n    \"tabGroups\": [\n      { \"id\": \"guides\", \"label\": \"Guías\", \"icon\": \"book-open\" },\n      { \"id\": \"api\", \"label\": \"API\", \"icon\": \"zap\" }\n    ]\n  },\n  \"search\": {\n    \"enabled\": true,\n    \"provider\": \"meilisearch\",\n    \"meilisearch\": {\n      \"host\": \"${MEILISEARCH_HOST}\",\n      \"apiKey\": \"${MEILISEARCH_API_KEY}\",\n      \"indexName\": \"docs\"\n    }\n  },\n  \"analytics\": {\n    \"googleAnalytics\": \"G-XXXXXXXXXX\",\n    \"plausible\": \"docs.acme.com\"\n  },\n  \"social\": {\n    \"github\": \"https://github.com/acme/platform\",\n    \"twitter\": \"https://twitter.com/acme\",\n    \"discord\": \"https://discord.gg/acme\"\n  },\n  \"footer\": {\n    \"copyright\": \"© 2024 Acme Corp. Todos los derechos reservados.\",\n    \"links\": [\n      {\n        \"title\": \"Producto\",\n        \"items\": [\n          { \"label\": \"Características\", \"href\": \"/features\" },\n          { \"label\": \"Precios\", \"href\": \"/pricing\" }\n        ]\n      }\n    ]\n  },\n  \"banner\": {\n    \"enabled\": true,\n    \"message\": \"📢 ¡La versión 2.0 ya está disponible!\",\n    \"type\": \"info\",\n    \"dismissible\": true\n  },\n  \"features\": {\n    \"editUrl\": \"https://github.com/acme/platform/edit/main/docs\",\n    \"showLastUpdated\": true,\n    \"showReadingTime\": true,\n    \"showTags\": true,\n    \"versioning\": true\n  },\n  \"deployment\": {\n    \"target\": \"vercel\"\n  }\n}\n```\n\n## Próximos pasos\n\n\u003cCardGrid cols={2}\u003e\n  \u003cCard\n    icon=\"search\"\n    title=\"Configuración de Búsqueda\"\n    description=\"Configure MeiliSearch para sus docs\"\n    href=\"/docs/v1.0.0/search-setup\"\n  /\u003e\n  \u003cCard\n    icon=\"palette\"\n    title=\"Personalización\"\n    description=\"Tema y estilo de su documentación\"\n    href=\"/docs/v1.0.0/customization\"\n  /\u003e\n  \u003cCard\n    icon=\"rocket\"\n    title=\"Implementación\"\n    description=\"Desplegar a producción\"\n    href=\"/docs/v1.0.0/deployment/overview\"\n  /\u003e\n  \u003cCard\n    icon=\"arrow-left\"\n    title=\"Descripción general de la configuración\"\n    description=\"Volver a la descripción general de la configuración\"\n    href=\"/docs/v1.0.0/configuration/overview\"\n  /\u003e\n\u003c/CardGrid\u003e\n"])</script><script>self.__next_f.push([1,"45:T11ae,"])</script><script>self.__next_f.push([1,"\n# Temas y personalización\n\nHaga que Specra sea suyo. Esta guía cubre todo, desde simples cambios de color hasta estilos personalizados completos.\n\n## Personalización rápida\n\nLa forma más rápida de personalizar sus documentos es a través de `specra.config.json`.\n\n### Colores de la marca\n\nEstablezca su color primario para que coincida con su marca:\n\n```json\n{\n  \"theme\": {\n    \"primaryColor\": \"#3b82f6\"\n  }\n}\n```\n\nSpecra genera automáticamente todas las variaciones de color (estados al pasar el mouse, anillos de enfoque, etc.) a partir de este valor único.\n\n### Configuración del modo oscuro\n\nControle cómo funciona el modo oscuro:\n\n```json\n{\n  \"theme\": {\n    \"defaultMode\": \"system\",\n    \"respectPrefersColorScheme\": true\n  }\n}\n```\n\n**Opciones para `defaultMode`:**\n- `\"system\"` - Respetar la preferencia del sistema operativo (recomendado)\n- `\"light\"` - Siempre iniciar en modo claro\n- `\"dark\"` - Siempre iniciar en modo oscuro\n\nEstablezca `respectPrefersColorScheme` en `false` para ignorar la configuración del sistema operativo y usar solo su valor predeterminado.\n\n### Logotipos\n\nAgregue su logotipo para los modos claro y oscuro:\n\n```json\n{\n  \"site\": {\n    \"logo\": {\n      \"light\": \"/logo-light.svg\",\n      \"dark\": \"/logo-dark.svg\"\n    }\n  }\n}\n```\n\nO use un solo logotipo para ambos:\n\n```json\n{\n  \"site\": {\n    \"logo\": \"/logo.svg\"\n  }\n}\n```\n\nColoque los archivos de logotipo en el directorio `public/`.\n\n## CSS personalizado\n\nPara una personalización más profunda, agregue CSS personalizado.\n\n### Método 1: Archivo CSS personalizado\n\nCree un archivo CSS y referéncielo en la configuración:\n\n**1. Cree `/public/custom.css`:**\n\n```css\n:root {\n  --font-heading: 'Inter', system-ui, sans-serif;\n  --border-radius: 12px;\n}\n\n.doc-content h1 {\n  font-size: 3rem;\n  color: var(--color-primary);\n}\n\n.sidebar {\n  background: linear-gradient(to bottom, #f8f9fa, #ffffff);\n}\n```\n\n**2. Referéncielo en la configuración:**\n\n```json\n{\n  \"theme\": {\n    \"customCss\": \"/custom.css\"\n  }\n}\n```\n\n### Método 2: Estilos globales\n\nEdite `app/globals.css` directamente para tener más control:\n\n```css\n@tailwind base;\n@tailwind components;\n@tailwind utilities;\n\n@layer base {\n  :root {\n    /* Sus propiedades personalizadas */\n    --radius: 0.75rem;\n  }\n}\n\n@layer components {\n  /* Sus estilos de componentes personalizados */\n  .custom-card {\n    @apply rounded-lg border border-gray-200 p-4;\n  }\n}\n```\n\n## Referencia de variables CSS\n\nSpecra usa variables CSS para los temas. Sobrescríbalas para personalizar la apariencia:\n\n### Colores\n\n```css\n:root {\n  /* Color primario de la marca */\n  --color-primary: #3b82f6;\n  --color-primary-hover: #2563eb;\n  --color-primary-light: #dbeafe;\n\n  /* Colores de fondo */\n  --color-bg: #ffffff;\n  --color-bg-secondary: #f9fafb;\n  --color-bg-tertiary: #f3f4f6;\n\n  /* Colores de texto */\n  --color-text: #111827;\n  --color-text-secondary: #6b7280;\n  --color-text-tertiary: #9ca3af;\n\n  /* Colores de borde */\n  --color-border: #e5e7eb;\n  --color-border-hover: #d1d5db;\n\n  /* Colores de bloque de código */\n  --color-code-bg: #f3f4f6;\n  --color-code-text: #1f2937;\n}\n```\n\n### Tipografía\n\n```css\n:root {\n  /* Familias de fuentes */\n  --font-sans: system-ui, -apple-system, sans-serif;\n  --font-mono: 'JetBrains Mono', 'Fira Code', monospace;\n  --font-heading: var(--font-sans);\n\n  /* Tamaños de fuente */\n  --text-xs: 0.75rem;\n  --text-sm: 0.875rem;\n  --text-base: 1rem;\n}\n```\n\n### Espaciado\n\n```css\n:root {\n  /* Radio de borde */\n  --radius-sm: 0.25rem;\n  --radius: 0.5rem;\n  --radius-md: 0.75rem;\n  --radius-lg: 1rem;\n  --radius-xl: 1.5rem;\n}\n```\n\n## Fuentes personalizadas\n\n### Usando Google Fonts\n\n**1. Agregue la fuente a su diseño:**\n\n```tsx\n// app/layout.tsx\nimport { Inter, JetBrains_Mono } from 'next/font/google'\n\nconst inter = Inter({ subsets: ['latin'] })\nconst jetbrainsMono = JetBrains_Mono({ subsets: ['latin'] })\n\nexport default function RootLayout({ children }) {\n  return (\n    \u003chtml lang=\"en\" className={`${inter.className}`}\u003e\n      \u003cbody\u003e{children}\u003c/body\u003e\n    \u003c/html\u003e\n  )\n}\n```\n\n**2. Actualice las variables CSS:**\n\n```css\n:root {\n  --font-sans: 'Inter', system-ui, sans-serif;\n  --font-mono: 'JetBrains Mono', monospace;\n}\n```\n\n### Usando fuentes locales\n\nColoque los archivos de fuentes en `public/fonts/` y cárguelos:\n\n```css\n@font-face {\n  font-family: 'CustomFont';\n  src: url('/fonts/custom-font.woff2') format('woff2');\n  font-weight: 400;\n  font-style: normal;\n  font-display: swap;\n}\n\n:root {\n  --font-sans: 'CustomFont', system-ui, sans-serif;\n}\n```\n"])</script><script>self.__next_f.push([1,"46:T11ae,"])</script><script>self.__next_f.push([1,"\n# Temas y personalización\n\nHaga que Specra sea suyo. Esta guía cubre todo, desde simples cambios de color hasta estilos personalizados completos.\n\n## Personalización rápida\n\nLa forma más rápida de personalizar sus documentos es a través de `specra.config.json`.\n\n### Colores de la marca\n\nEstablezca su color primario para que coincida con su marca:\n\n```json\n{\n  \"theme\": {\n    \"primaryColor\": \"#3b82f6\"\n  }\n}\n```\n\nSpecra genera automáticamente todas las variaciones de color (estados al pasar el mouse, anillos de enfoque, etc.) a partir de este valor único.\n\n### Configuración del modo oscuro\n\nControle cómo funciona el modo oscuro:\n\n```json\n{\n  \"theme\": {\n    \"defaultMode\": \"system\",\n    \"respectPrefersColorScheme\": true\n  }\n}\n```\n\n**Opciones para `defaultMode`:**\n- `\"system\"` - Respetar la preferencia del sistema operativo (recomendado)\n- `\"light\"` - Siempre iniciar en modo claro\n- `\"dark\"` - Siempre iniciar en modo oscuro\n\nEstablezca `respectPrefersColorScheme` en `false` para ignorar la configuración del sistema operativo y usar solo su valor predeterminado.\n\n### Logotipos\n\nAgregue su logotipo para los modos claro y oscuro:\n\n```json\n{\n  \"site\": {\n    \"logo\": {\n      \"light\": \"/logo-light.svg\",\n      \"dark\": \"/logo-dark.svg\"\n    }\n  }\n}\n```\n\nO use un solo logotipo para ambos:\n\n```json\n{\n  \"site\": {\n    \"logo\": \"/logo.svg\"\n  }\n}\n```\n\nColoque los archivos de logotipo en el directorio `public/`.\n\n## CSS personalizado\n\nPara una personalización más profunda, agregue CSS personalizado.\n\n### Método 1: Archivo CSS personalizado\n\nCree un archivo CSS y referéncielo en la configuración:\n\n**1. Cree `/public/custom.css`:**\n\n```css\n:root {\n a de caché\n\n### Caché en memoria\n\nEl sistema utiliza una capa de caché inteligente para operaciones costosas del sistema de archivos:\n\n- **Caché de lista de versiones**: En caché por 5 segundos en dev, 60 segundos en producción\n- **Caché de lista de documentos**: Caché por versión con invalidación automática\n- **Caché de documento individual**: Clave por versión y slug\n\nLa caché se invalida automáticamente cuando los archivos MDX o de configuración cambian en modo de desarrollo.\n\n### Estadísticas de caché\n\nEn modo de desarrollo, las operaciones de caché se registran en la consola:\n\n```\n✅ [Cache] hit: getAllDocs:v1.0.0\n❌ [Cache] miss: getDocBySlug:v1.0.0:configuration\n⏱️  getDocBySlug(configuration): 45.23ms\n```\n\n## Recarga en caliente\n\n### Actualizaciones en tiempo real\n\nEl sistema monitorea su directorio `docs/` en busca de cambios y actualiza automáticamente la página cuando guarda:\n\n- Observa archivos `.mdx` para cambios de contenido\n- Observa archivos `_category_.json` para actualizaciones de navegación\n- Utiliza eventos enviados por el servidor (SSE) para una comunicación eficiente\n- Solo activo en modo de desarrollo\n\n### Cómo funciona\n\n1. El observador de archivos monitorea el directorio `docs/` recursivamente\n2. Cuando un archivo cambia, la API envía un evento al navegador\n3. El navegador activa una actualización suave para recargar el contenido\n4. La caché se invalida para los archivos afectados\n\n## Generación estática\n\n### Proceso de construcción optimizado\n\nEl proceso de construcción utiliza datos en caché para acelerar `generateStaticParams`:\n\n```typescript\nexport async function generateStaticParams() {\n  const versions = getCachedVersions()  // En caché\n  const params = []\n\n  for (const version of versions) {\n    const docs = await getCachedAllDocs(version)  // En caché\n    for (const doc of docs) {\n      params.push({\n        version,\n        slug: doc.slug.split(\"/\").filter(Boolean),\n      })\n    }\n  }\n\n  return params\n}\n```\n\n### Consejos de rendimiento\n\nPara sitios de documentación grandes (1000+ archivos):\n\n1. **Use organización de carpetas**: Organice los documentos en carpetas lógicas para mejorar la localidad de la caché\n2. **Habilite el modo borrador**: Marque los documentos en progreso con `draft: true` para excluirlos de las compilaciones de producción\n3. **Optimice imágenes**: Use la optimización de imágenes de Next.js para capturas de pantalla y diagramas\n4. **Monitoree tiempos de compilación**: Observe los registros de rendimiento durante el desarrollo\n\n## Características del modo de desarrollo\n\n### Registro de rendimiento\n\nCuando ejecuta `npm run dev`, verá métricas de rendimiento detalladas:\n\n```\n⏱️  getAllDocs(v1.0.0): 234.56ms\n⏱️  getDocBySlug(getting-started): 12.34ms\n💾 Memory Usage: { rss: '156MB', heapTotal: '89MB', heapUsed: '67MB' }\n```\n\n### Utilidades de depuración\n\nEl sistema incluye herramientas de depuración útiles (solo modo dev):\n\n- **PerfTimer**: Medir duración de operación\n- **logCacheOperation**: Rostrear aciertos/fallos de caché\n- **logMemoryUsage**: Monitorear consumo de memoria\n- **debugLog**: Imprimir objetos complejos de forma bonita\n\n## Optimizaciones de producción\n\n### Generación de sitio estático (SSG)\n\nTodas las páginas de documentación se pre-renderizan en tiempo de compilación:\n\n- Cero sobrecarga de renderizado del lado del servidor\n- Cargas de página instantáneas\n- Excelente rendimiento SEO\n- Activos estáticos aptos para CDN\n\n### Optimización de bundle\n\n- Componentes de servidor por defecto (JavaScript mínimo)\n- Componentes de cliente solo donde sea necesario (pestañas, selector de tema)\n- División de código automática por ruta\n- Tree-shaking de dependencias no utilizadas\n\n## Monitoreo de rendimiento\n\n### Análisis de compilación\n\nMonitoree su salida de compilación para obtener información sobre el rendimiento:\n\n```bash\nnpm run build\n```\n\nBusque:\n- Tiempo de generación de página estática\n- Número de páginas generadas\n- Advertencias de tamaño de bundle\n\n### Métricas de desarrollo\n\nDurante el desarrollo, observe la consola para:\n- Ratios de acierto/fallo de caché (deberían mejorar con el tiempo)\n- Tiempos de operación de archivos (identificar operaciones lentas)\n- Patrones de uso de memoria (detectar fugas de memoria)\n\n## Mejores prácticas\n\n1. **Mantenga los archivos organizados**: La estructura de carpetas lógica mejora el almacenamiento en caché\n2. **Use frontmatter sabiamente**: Agregue solo los metadatos necesarios\n3. **Optimice el contenido**: Los archivos grandes (\u003e1MB) deben dividirse\n4. **Monitoree la caché**: Las altas tasas de fallos indican problemas de almacenamiento en caché\n5. **Compilaciones limpias**: Ocasionalmente borre `.next/` para compilaciones frescas\n\n## Solución de problemas\n\n### Tiempos de compilación lentos\n\nSi las compilaciones son lentas:\n\n1. Verifique si hay archivos MDX extremadamente grandes (\u003e5MB)\n2. Reduzca el número de páginas generadas simultáneamente\n3. Borre la caché: Elimine `.next/` y `node_modules/.cache/`\n4. Actualice las dependencias a las últimas versiones\n\n### La recarga en caliente no funciona\n\nSi los cambios no se reflejan:\n\n1. Verifique que está en modo de desarrollo (`npm run dev`)\n2. Busque errores en la consola del navegador\n3. Verifique que el punto final `/api/mdx-watch` está respondiendo\n4. Refresco fuerte del navegador (Cmd+Shift+R o Ctrl+Shift+R)\n\n### Problemas de memoria\n\nSi experimenta un alto uso de memoria:\n\n1. Verifique referencias circulares en la documentación\n2. Monitoree el tamaño de la caché con `getCacheStats()`\n3. Reduzca `CACHE_TTL` en `lib/mdx-cache.ts`\n4. Borre cachés manualmente con `clearAllCaches()`\n"])</script><script>self.__next_f.push([1,"4e:T167c,"])</script><script>self.__next_f.push([1,"\n## Sistema de caché\n\n### Caché en memoria\n\nEl sistema utiliza una capa de caché intelige ------------|-------------|\n| `children` | `string` | requerido | Expresión matemática LaTeX |\n| `block` | `boolean` | `false` | Mostrar como bloque (centrado) |\n\n## Sintaxis LaTeX\n\n\u003cCallout type=\"tip\"\u003e\nRecuerde escapar las barras invertidas en JSX. Use `\\\\` en lugar de `\\` para comandos LaTeX.\n\u003c/Callout\u003e\n\n### Símbolos comunes\n\n| Símbolo | LaTeX | Resultado |\n|---------|-------|-----------|\n| Letras griegas | `\\alpha, \\beta, \\gamma` | \u003cMath\u003e{\"\\\\alpha, \\\\beta, \\\\gamma\"}\u003c/Math\u003e |\n| Fracciones | `\\frac{a}{b}` | \u003cMath\u003e{\"\\\\frac{a}{b}\"}\u003c/Math\u003e |\n| Raíz cuadrada | `\\sqrt{x}` | \u003cMath\u003e{\"\\\\sqrt{x}\"}\u003c/Math\u003e |\n| Exponentes | `x^{n}` | \u003cMath\u003e{\"x^{n}\"}\u003c/Math\u003e |\n| Subíndices | `x_{i}` | \u003cMath\u003e{\"x_{i}\"}\u003c/Math\u003e |\n| Infinito | `\\infty` | \u003cMath\u003e{\"\\\\infty\"}\u003c/Math\u003e |\n| Suma | `\\sum` | \u003cMath\u003e{\"\\\\sum\"}\u003c/Math\u003e |\n| Integral | `\\int` | \u003cMath\u003e{\"\\\\int\"}\u003c/Math\u003e |\n\n## Recursos\n\n- [Documentación de KaTeX](https://katex.org/docs/supported.html)\n- [Símbolos matemáticos LaTeX](https://oeis.org/wiki/List_of_LaTeX_mathematical_symbols)\n"])</script><script>self.__next_f.push([1,"58:T832,"])</script><script>self.__next_f.push([1,"\nEl componente Math renderiza ecuaciones matemáticas con KaTeX, admitiendo matemáticas tanto en línea como en bloque.\n\n## Uso\n\n### Matemáticas en línea\n\n```mdx\nLa ecuación \u003cMath\u003e{\"E = mc^2\"}\u003c/Math\u003e es famosa.\n```\n\n### Matemáticas en bloque\n\n```mdx\n\u003cMath block\u003e\n  {\"\\\\int_{-\\\\infty}^{\\\\infty} e^{-x^2} dx = \\\\sqrt{\\\\pi}\"}\n\u003c/Math\u003e\n```\n\n## Ejemplos en vivo\n\n### Matemáticas en línea\n\nLa famosa ecuación de Einstein \u003cMath\u003e{\"E = mc^2\"}\u003c/Math\u003e relaciona energía y masa.\n\nLa fórmula cuadrática es \u003cMath\u003e{\"x = \\\\frac{-b \\\\pm \\\\s e\n```\n\n### Video local\n\n```mdx\n\u003cVideo \n  src=\"/videos/demo.mp4\"\n  caption=\"Demostración de producto\"\n  controls\n  poster=\"/videos/poster.jpg\"\n/\u003e\n```\n\n## Ejemplos en vivo\n\n### Incrustación de YouTube\n\n\u003cVideo \n  src=\"https://youtu.be/puRFmqfVlLk\"\n  caption=\"Ejemplo de incrustación de video de YouTube\"\n  muted\n  autoplay\n/\u003e\n\n## Props\n\n| Propiedad | Tipo | Predeterminado | Descripción |\n|-----------|------|----------------|-------------|\n| `src` | `string` | requerido | URL del video (YouTube, Vimeo o ruta local) |\n| `caption` | `string` | - | Leyenda debajo del video |\n| `autoplay` | `boolean` | `false` | Reproducción automática al cargar |\n| `loop` | `boolean` | `false` | Reproducción en bucle |\n| `muted` | `boolean` | `false` | Silenciar audio del video |\n| `controls` | `boolean` | `true` | Mostrar controles de video |\n| `poster` | `string` | - | URL de la imagen del póster (solo videos locales) |\n\n## Plataformas admitidas\n\n### YouTube\n\nAdmite varios formatos de URL de YouTube:\n- `https://www.youtube.com/watch?v=VIDEO_ID`\n- `https://youtu.be/VIDEO_ID`\n\n### Vimeo\n\nAdmite URL de Vimeo:\n- `https://vimeo.com/VIDEO_ID`\n\n### Archivos locales\n\nAdmite formatos de video estándar:\n- MP4 (`.mp4`)\n- WebM (`.webm`)\n- Ogg (`.ogg`)\n\n## Consejos\n\n\u003cCallout type=\"warning\"\u003e\nLa reproducción automática a menudo es bloqueada por los navegadores a menos que el video también esté silenciado. Para videos de reproducción automática, use tanto `autoplay` como `muted`:\n\n```mdx\n\u003cVideo src=\"/videos/animation.mp4\" autoplay muted loop /\u003e\n```\n\u003c/Callout\u003e\n\n\u003cCallout type=\"tip\"\u003e\nUse la propiedad `poster` para videos locales para mostrar una imagen de vista previa antes de que se cargue el video.\n\u003c/Callout\u003e\n"])</script><script>self.__next_f.push([1,"62:T798,"])</script><script>self.__next_f.push([1,"\nEl componente Video incrusta videos de archivos locales o plataformas populares como YouTube y Vimeo.\n\n## Uso\n\n### Video de YouTube\n\n```mdx\n\u003cVideo \n  src=\"https://www.youtube.com/watch?v=dQw4w9WgXcQ\"\n  caption=\"Video de ejemplo\"\n/\u003e\n```\n\n### Video local\n\n```mdx\n\u003cVideo \n  src=\"/videos/demo.mp4\"\n  caption=\"Demostración de producto\"\n  controls\n  poster=\"/videos/poster.jpg\"\n/\u003e\n```\n\n## Ejemplos en vivo\n\n### Incrustación de YouTube\n\n\u003cVideo \n  src=\"https://youtu.be/puRFmqfVlLk\"\n  caption=\"Ejemplo de incrustación de video de YouTube\"\n  muted\n  autoplay\n/\u003e\n\n## Props\n\n| Propiedad | Tipo | Predeterminado | Descripción |\n|-----------|------|----------------|-------------|\n| `src` | `string` | requerido | URL del video (YouTube, Vimeo o ruta local) |\n| `caption` | `string` | - | Leyenda debajo del video |\n| `autoplay` | `boolean` | `false` | Reproducción automática al cargar |\n| `loop` | `boolean` | `false` | Reproducción en bucle |\n| `muted` | `boolean` | `false` | Silenciar audio del video |\n| `controls` | `boolean` | `true` | Mostrar controles de video |\n| `poster` | `string` | - | URL de la imagen del póster (solo videos locales) |\n\n## Plataformas admitidas\n\n### YouTube\n\nAdmite varios formatos de URL de YouTube:\n- `https://www.youtube.com/watch?v=VIDEO_ID`\n- `https://youtu.be/VIDEO_ID`\n\n### Vimeo\n\nAdmite URL de Vimeo:\n- `https://vimeo.com/VIDEO_ID`\n\n### Archivos locales\n\nAdmite formatos de video estándar:\n- MP4 (`.mp4`)\n- WebM (`.webm`)\n- Ogg (`.ogg`)\n\n## Consejos\n\n\u003cCallout type=\"warning\"\u003e\nLa reproducción automática a menudo es bloqueada por los navegadores a menos que el video también esté silenciado. Para videos de reproducción automática, use tanto `autoplay` como `muted`:\n\n```mdx\n\u003cVideo src=\"/videos/animation.mp4\" autoplay muted loop /\u003e\n```\n\u003c/Callout\u003e\n\n\u003cCallout type=\"tip\"\u003e\nUse la propiedad `poster` para videos locales para mostrar una imagen de vista previa antes de que se cargue el video.\n\u003c/Callout\u003e\n"])</script><script>self.__next_f.push([1,"63:T1b2a,"])</script><script>self.__next_f.push([1,"\nLos grupos de pestañas le permiten organizar su documentación en diferentes secciones accesibles a través de pestañas en la parte superior de sus páginas de documentación. Esto es particularmente útil para separar diferentes tipos de contenido como documentos de SDK, referencias de API y guías.\n\n## Descripción general\n\nLos grupos de pestañas proporcionan una barra de navegación fija que:\n- Se encuentra debajo del encabezado\n- Filtra el contenido de la barra lateral según la pestaña activa\n- Persiste a través de la navegación de la página\n- Soporta iconos de Lucide React\n- Mantiene la estructura de la barra lateral generada automáticamente\n\n## Configuración\n\nDefina grupos de pestañas en su `specra.config.json`:\n\n```json\n{\n  \"navigation\": {\n    \"tabGroups\": [\n      {\n        \"id\": \"sdk\",\n        \"label\": \"Documentación SDK\",\n        \"icon\": \"code\"\n      },\n      {\n        \"id\": \"api\",\n        \"label\": \"Referencia API\",\n        \"icon\": \"zap\"\n      },\n      {\n        \"id\": \"guides\",\n        \"label\": \"Guías\",\n        \"icon\": \"book-open\"\n      }\n    ]\n  }\n}\n```\n\n### Propiedades del grupo de pestañas\n\n| Propiedad | Tipo | Requerido | Descripción |\n|-----------|------|-----------|-------------|\n| `id` | string | Sí | Identificador único para el grupo de pestañas |\n| `label` | string | Sí | Texto de visualización para la pestaña |\n| `icon` | string | No | Nombre del icono Lucide (por ejemplo, \"code\", \"zap\", \"book-open\") |\n\n## Asignación de contenido a pestañas\n\nHay dos formas de asignar contenido a grupos de pestañas:\n\n### 1. Asignación a nivel de archivo\n\nAgregue `tab_group` al frontmatter de sus archivos MDX:\n\n```mdx\n---\ntitle: Empezando\ndescription: Guía de inicio rápido\ntab_group: guides\n---\n\n# Empezando\n\nSu contenido aquí...\n```\n\n### 2. Asignación a nivel de carpeta\n\nAgregue `tab_group` a su archivo `_category_.json` para asignar todos los archivos en esa carpeta:\n\n```json\n{\n  \"label\": \"Componentes\",\n  \"position\": 2,\n  \"collapsible\": true,\n  \"collapsed\": false,\n  \"icon\": \"grid\",\n  \"tab_group\": \"sdk\"\n}\n```\n\nTodos los archivos dentro de esta carpeta heredarán automáticamente el grupo de pestañas `sdk`.\n\n## Comportamiento y reglas\n\n### Asignación de pestaña predeterminada\n\nLos archivos sin un `tab_group` especificado aparecerán automáticamente en el **primer grupo de pestañas** definido en su configuración.\n\n### Prioridad\n\n`tab_group` a nivel de archivo en frontmatter tiene prioridad sobre la asignación a nivel de carpeta de `_category_.json`.\n\n### Persistencia de pestañas\n\nLa pestaña activa persiste cuando:\n- Navega entre páginas dentro del mismo grupo de pestañas\n- Cambia manualmente de pestañas\n- Hace clic en enlaces a páginas en diferentes grupos de pestañas (la pestaña cambia automáticamente)\n\n### Selección inicial de pestaña\n\nCuando aterriza en una página:\n- La pestaña cambia automáticamente para coincidir con el grupo de la página\n- Al recargar la página, la pestaña refleja el grupo de la página actual\n- La selección manual de pestañas se conserva al navegar dentro del mismo grupo\n\n## Mejores prácticas\n\n### 1. Agrupación lógica\n\nAgrupe el contenido relacionado junto:\n- **Documentos de SDK/Biblioteca**: Instalación, configuración, referencia de API\n- **Documentos de API**: Puntos finales REST, esquemas GraphQL, webhooks\n- **Guías**: Tutoriales, instrucciones, mejores prácticas\n\n### 2. Nomenclatura consistente\n\nUse etiquetas claras y concisas:\n- ✅ \"Documentación SDK\", \"Referencia API\", \"Guías\"\n- ❌ \"Docs1\", \"Sección A\", \"Varios\"\n\n### 3. Iconos significativos\n\nElija iconos que representen el contenido:\n- `code` para documentación de SDK/biblioteca\n- `zap` para referencias de API\n- `book-open` para guías y tutoriales\n- `rocket` para contenido de inicio\n\n### 4. Limitar el recuento de pestañas\n\nMantenga el número de pestañas manejable:\n- **Recomendado**: 2-4 pestañas\n- **Máximo**: 5-6 pestañas\n- Demasiadas pestañas pueden abrumar a los usuarios\n\n## Ejemplos\n\n### Ejemplo 1: División simple SDK + API\n\n```json\n{\n  \"navigation\": {\n    \"tabGroups\": [\n      {\n        \"id\": \"sdk\",\n        \"label\": \"SDK\",\n        \"icon\": \"code\"\n      },\n      {\n        \"id\": \"api\",\n        \"label\": \"API\",\n        \"icon\": \"zap\"\n      }\n    ]\n  }\n}\n```\n\n### Ejemplo 2: Documentación completa\n\n```json\n{\n  \"navigation\": {\n    \"tabGroups\": [\n      {\n        \"id\": \"getting-started\",\n        \"label\": \"Empezando\",\n        \"icon\": \"rocket\"\n      },\n      {\n        \"id\": \"sdk\",\n        \"label\": \"Referencia SDK\",\n        \"icon\": \"code\"\n      },\n      {\n        \"id\": \"api\",\n        \"label\": \"Referencia API\",\n        \"icon\": \"server\"\n      },\n      {\n        \"id\": \"guides\",\n        \"label\": \"Guías\",\n        \"icon\": \"book-open\"\n      }\n    ]\n  }\n}\n```\n\n## Uso avanzado\n\n### Carpetas anidadas\n\nLos grupos de pestañas funcionan a la perfección con estructuras de carpetas anidadas:\n\n```txt\ndocs/v1.0.0/\n├── components/              # tab_group: sdk\n│   ├── _category_.json\n│   ├── button.mdx\n│   └── input.mdx\n├── api/                     # tab_group: api\n│   ├── _category_.json\n│   ├── authentication.mdx\n│   └── endpoints.mdx\n└── guides/                  # tab_group: guides\n    ├── _category_.json\n    └── quickstart.mdx       # Puede sobrescribir con tab_group a nivel de archivo\n```\n\n### Grupos de pestañas mixtos en la misma carpeta\n\nPuede tener archivos en la misma carpeta que pertenezcan a diferentes pestañas:\n\n```txt\ndocs/v1.0.0/\n├── _category_.json          # Predeterminado: tab_group: sdk\n├── overview.mdx             # Hereda: sdk\n├── api-overview.mdx         # Sobrescribir: tab_group: api\n└── tutorial.mdx             # Sobrescribir: tab_group: guides\n```\n\n## Solución de problemas\n\n### La pestaña no se muestra\n\n**Problema**: Grupo de pestañas definido pero no visible\n\n**Soluciones**:\n- Asegúrese de que al menos un archivo esté asignado a ese grupo de pestañas\n- Verifique que el `id` del grupo de pestañas coincida exactamente tanto en la configuración como en el frontmatter\n- Verifique que `navigation.tabGroups` esté definido en `specra.config.json`\n\n### Contenido que aparece en la pestaña incorrecta\n\n**Problema**: La página aparece bajo la pestaña incorrecta\n\n**Soluciones**:\n- Verifique el frontmatter a nivel de archivo para anulación de `tab_group`\n- Verifique que `_category_.json` a nivel de carpeta tenga el `tab_group` correcto\n- Recuerde: el frontmatter tiene prioridad sobre `_category_.json`\n\n### La pestaña no persiste\n\n**Problema**: La pestaña se restablece al navegar\n\n**Soluciones**:\n- Este es el comportamiento esperado al navegar a una página en un grupo de pestañas diferente\n- La pestaña cambia automáticamente para coincidir con el grupo de la página actual\n- La selección manual persiste solo cuando se navega dentro del mismo grupo de pestañas\n"])</script><script>self.__next_f.push([1,"64:T1b2a,"])</script><script>self.__next_f.push([1,"\nLos grupos de pestañas le permiten organizar su documentación en diferentes secciones accesibles a través de pestañas en la parte superior de sus páginas de documentación. Esto es particularmente útil para separar diferentes tipos de contenido como documentos de SDK, referencias de API y guías.\n\n## Descripción general\n\nLos grupos de pestañas proporcionan una barra de navegación fija que:\n- Se encuentra debajo del encabezado\n- Filtra el contenido de la barra lateral según la pestaña activa\n- Persiste a través de la navegación de la página\n- Soporta iconos de Lucide React\n- Mantiene la estruct
