03e\n    Actualice `specra.config.json`:\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"github-pages\",\n    \"basePath\": \"su-nombre-repo\",\n    \"customDomain\": false\n  }\n}\n```\n\nReemplace `su-nombre-repo` con el nombre real de su repositorio.\n\n\u003cCallout type=\"info\"\u003e\n  Si usa un dominio personalizado (como `docs.susitio.com`), establezca `customDomain: true` y deje `basePath` vacío.\n\u003c/Callout\u003e\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Construir Sitio Estático\"\u003e\n```bash\nnpm run build:export\n```\n\nEsto crea un directorio `out/` con su sitio estático.\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Implementar con GitHub Actions\"\u003e\n    Cree `.github/workflows/deploy.yml`:\n\n```yaml\nname: Deploy to GitHub Pages\n\non:\n  push:\n    branches: [main]\n\npermissions:\n  contents: read\n  pages: write\n  id-token: write\n\njobs:\n  build:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n\n      - name: Setup Node.js\n        uses: actions/setup-node@v4\n        with:\n          node-version: '20'\n          cache: 'npm'\n\n      - name: Install dependencies\n        run: npm ci\n\n      - name: Build site\n        run: npm run build:export\n\n      - name: Upload artifact\n        uses: actions/upload-pages-artifact@v3\n        with:\n          path: ./out\n\n  deploy:\n    needs: build\n    runs-on: ubuntu-latest\n    environment:\n      name: github-pages\n      url: ${{ steps.deployment.outputs.page_url }}\n    steps:\n      - name: Deploy to GitHub Pages\n        id: deployment\n        uses: actions/deploy-pages@v4\n```\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Habilitar GitHub Pages\"\u003e\n    1. Vaya a la configuración de su repositorio\n    2. Navegue a **Pages**\n    3. Fuente: **GitHub Actions**\n    4. Guardar\n\n    Sus documentos estarán en vivo en `https://username.github.io/su-nombre-repo`\n  \u003c/Step\u003e\n\u003c/Steps\u003e\n\n### Netlify\n\nOtra gran opción de alojamiento estático:\n\n\u003cSteps\u003e\n  \u003cStep title=\"Configurar\"\u003e\n```json\n{\n  \"deployment\": {\n    \"target\": \"static\"\n  }\n}\n```\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Crear netlify.toml\"\u003e\n```toml\n[build]\n  command = \"npm run build:export\"\n  publish = \"out\"\n\n[[redirects]]\n  from = \"/*\"\n  to = \"/index.html\"\n  status = 200\n```\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Implementar\"\u003e\n    Conecte su repositorio en [netlify.com](https://netlify.com) o use la CLI:\n\n```bash\nnpm install -g netlify-cli\nnetlify deploy --prod\n```\n  \u003c/Step\u003e\n\u003c/Steps\u003e\n\n## Comandos de Compilación\n\nDiferentes plataformas necesitan diferentes comandos de compilación:\n\n| Plataforma | Comando de Compilación | Directorio de Salida |\n|------------|------------------------|----------------------|\n| Vercel, Railway | `npm run build` | `.next` |\n| GitHub Pages | `npm run build:export` | `out` |\n| Netlify, Cloudflare Pages | `npm run build:export` | `out` |\n| Docker, VPS | `npm run build` + `npm start` | `.next` |\n\n## Configuración por Plataforma\n\n### Vercel\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"vercel\"\n  }\n}\n```\n\n**Variables de entorno** (opcional):\n- Ninguna requerida para la configuración básica\n- Agregue claves de búsqueda/análisis en el panel de Vercel\n\n### GitHub Pages (Sin Dominio Personalizado)\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"github-pages\",\n    \"basePath\": \"nombre-repo\"\n  }\n}\n```\n\n**¿Por qué basePath?** GitHub Pages sirve desde `username.github.io/nombre-repo`, por lo que todos los activos necesitan el prefijo `/nombre-repo`.\n\n### GitHub Pages (Con Dominio Personalizado)\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"custom-domain-static\",\n    \"customDomain\": true\n  }\n}\n```\n\nAgregue un archivo `CNAME` a `public/`:\n\n```\ndocs.susitio.com\n```\n\n### Netlify / Cloudflare Pages\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"static\"\n  }\n}\n```\n\nNo se necesita basePath: sirven desde la raíz.\n\n## Tuberías CI/CD\n\n### GitHub Actions (Avanzado)\n\nEjemplo completo con almacenamiento en caché e indexación de MeiliSearch:\n\n```yaml\nname: Build and Deploy\n\non:\n  push:\n    branches: [main]\n  pull_request:\n    branches: [main]\n\njobs:\n  build:\n    runs-on: ubuntu-latest\n\n    steps:\n      - uses: actions/checkout@v4\n\n      - name: Setup Node.js\n        uses: actions/setup-node@v4\n        with:\n          node-version: '20'\n          cache: 'npm'\n\n      - name: Cache dependencies\n        uses: actions/cache@v4\n        with:\n          path: ~/.npm\n          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}\n          restore-keys: |\n            ${{ runner.os }}-node-\n\n      - name: Install dependencies\n        run: npm ci\n\n      - name: Run linter\n        run: npm run lint\n\n      - name: Build site\n        run: npm run build:export\n        env:\n          NODE_ENV: production\n\n      - name: Index search content\n        if: github.ref == 'refs/heads/main'\n        run: npm run index:search\n        env:\n          MEILISEARCH_HOST: ${{ secrets.MEILISEARCH_HOST }}\n          MEILISEARCH_API_KEY: ${{ secrets.MEILISEARCH_MASTER_KEY }}\n\n      - name: Upload artifact\n        uses: actions/upload-pages-artifact@v3\n        with:\n          path: ./out\n\n  deploy:\n    if: github.ref == 'refs/heads/main'\n    needs: build\n    runs-on: ubuntu-latest\n    environment:\n      name: github-pages\n      url: ${{ steps.deployment.outputs.page_url }}\n    permissions:\n      pages: write\n      id-token: write\n    steps:\n      - name: Deploy to GitHub Pages\n        id: deployment\n        uses: actions/deploy-pages@v4\n```\n\n### GitLab CI/CD\n\n```yaml\n# .gitlab-ci.yml\nimage: node:20\n\ncache:\n  paths:\n    - node_modules/\n\nstages:\n  - build\n  - deploy\n\nbuild:\n  stage: build\n  script:\n    - npm ci\n    - npm run build:export\n  artifacts:\n    paths:\n      - out/\n  only:\n    - main\n\npages:\n  stage: deploy\n  dependencies:\n    - build\n  script:\n    - mkdir -p public\n    - cp -r out/* public/\n  artifacts:\n    paths:\n      - public\n  only:\n    - main\n```\n\n### Docker\n\nCree un `Dockerfile`:\n\n```dockerfile\nFROM node:20-alpine AS builder\n\nWORKDIR /app\n\nCOPY package*.json ./\nRUN npm ci\n\nCOPY . .\nRUN npm run build\n\nFROM node:20-alpine AS runner\n\nWORKDIR /app\n\nENV NODE_ENV=production\n\nCOPY --from=builder /app/public ./public\nCOPY --from=builder /app/.next/standalone ./\nCOPY --from=builder /app/.next/static ./.next/static\n\nEXPOSE 3000\n\nCMD [\"node\", \"server.js\"]\n```\n\nConstruir y ejecutar:\n\n```bash\ndocker build -t my-docs .\ndocker run -p 3000:3000 my-docs\n```\n\n## Variables de Entorno\n\nEstablezca estas en su plataforma de implementación:\n\n**Búsqueda (si usa MeiliSearch):**\n```bash\nMEILISEARCH_HOST=https://search.example.com\nMEILISEARCH_API_KEY=su-clave-de-busqueda\n```\n\n**Análisis (opcional):**\n```bash\nNEXT_PUBLIC_GA_ID=G-XXXXXXXXXX\nNEXT_PUBLIC_PLAUSIBLE_DOMAIN=docs.example.com\n```\n\n**Variables env personalizadas:**\nAcceda a ellas en sus documentos a través de frontmatter o MDX:\n\n```json\n{\n  \"env\": {\n    \"API_BASE_URL\": \"${API_URL}\"\n  }\n}\n```\n\n## Dominios Personalizados\n\n### Vercel\n\n1. Vaya a la configuración de su proyecto\n2. Navegue a Dominios\n3. Agregue su dominio personalizado\n4. Actualice los registros DNS como se muestra\n\n### GitHub Pages\n\n1. Agregue el archivo `CNAME` a `public/`:\n```\ndocs.susitio.com\n```\n\n2. Actualice `specra.config.json`:\n```json\n{\n  \"deployment\": {\n    \"customDomain\": true\n  }\n}\n```\n\n3. Configure DNS:\n```\nTipo: CNAME\nNombre: docs\nValor: username.github.io\n```\n\n### Netlify\n\n1. Vaya a la configuración de Dominio\n2. Agregue dominio personalizado\n3. Siga las instrucciones DNS\n\n## Optimización de Rendimiento\n\n### Habilitar Almacenamiento en Caché\n\nAgregue encabezados de caché en `next.config.mjs`:\n\n```javascript\nasync headers() {\n  return [\n    {\n      source: '/docs/:path*',\n      headers: [\n        {\n          key: 'Cache-Control',\n          value: 'public, max-age=3600, must-revalidate',\n        },\n      ],\n    },\n  ]\n}\n```\n\n### Optimización de Imágenes\n\nUse el componente Image de Next.js:\n\n```mdx\n\u003cImage\n  src=\"/images/diagram.png\"\n  alt=\"Diagrama de arquitectura\"\n  width={800}\n  height={600}\n/\u003e\n```\n\n### Análisis de Paquetes\n\nVerifique el tamaño del paquete:\n\n```bash\nnpm install --save-dev @next/bundle-analyzer\n```\n\n```javascript\n// next.config.mjs\nimport bundleAnalyzer from '@next/bundle-analyzer'\n\nconst withBundleAnalyzer = bundleAnalyzer({\n  enabled: process.env.ANALYZE === 'true',\n})\n\nexport default withBundleAnalyzer(nextConfig)\n```\n\nEjecutar con:\n```bash\nANALYZE=true npm run build\n```\n\n## Solución de Problemas\n\n### 404 al Actualizar la Página (Exportación Estática)\n\nAgregue redirecciones/reescrituras en la configuración de la plataforma:\n\n**Netlify:**\n```toml\n[[redirects]]\n  from = \"/*\"\n  to = \"/index.html\"\n  status = 200\n```\n\n**Vercel (vercel.json):**\n```json\n{\n  \"rewrites\": [\n    { \"source\": \"/(.*)\", \"destination\": \"/index.html\" }\n  ]\n}\n```\n\n### Los Activos No Se Cargan (GitHub Pages)\n\nVerifique que su `basePath` coincida exactamente con el nombre de su repositorio:\n\n```json\n{\n  \"deployment\": {\n    \"basePath\": \"nombre-repo-exacto\"\n  }\n}\n```\n\n### La Compilación Falla\n\nCorrecciones comunes:\n\n1. Borre las carpetas `.next` y `out`:\n```bash\nrm -rf .next out node_modules\nnpm install\nnpm run build\n```\n\n2. Verifique la versión de Node.js:\n```bash\nnode --version  # Debería ser 18+\n```\n\n3. Revise los registros de compilación para ver errores específicos\n\n## Guías Específicas de la Plataforma\n\nProfundice en la implementación específica de la plataforma:\n\n\u003cCardGrid cols={3}\u003e\n  \u003cCard\n    icon=\"triangle\"\n    title=\"Vercel\"\n    description=\"Implementar sin configuración\"\n    href=\"/docs/v1.0.0/deployment/vercel\"\n  /\u003e\n  \u003cCard\n    icon=\"github\"\n    title=\"GitHub Pages\"\n    description=\"Alojamiento gratuito para código abierto\"\n    href=\"/docs/v1.0.0/deployment/github-pages\"\n  /\u003e\n  \u003cCard\n    icon=\"globe\"\n    title=\"Netlify\"\n    description=\"Alojamiento estático con funciones perimetrales\"\n    href=\"/docs/v1.0.0/deployment/netlify\"\n  /\u003e\n\u003c/CardGrid\u003e\n\n## Próximos Pasos\n\n\u003cCardGrid cols={2}\u003e\n  \u003cCard\n    icon=\"settings\"\n    title=\"Configuración\"\n    description=\"Ajustar su configuración de implementación\"\n    href=\"/docs/v1.0.0/configuration/deployment-config\"\n  /\u003e\n  \u003cCard\n    icon=\"zap\"\n    title=\"Rendimiento\"\n    description=\"Optimizar sus documentos para velocidad\"\n    href=\"/docs/v1.0.0/performance\"\n  /\u003e\n\u003c/CardGrid\u003e\n"])</script><script>self.__next_f.push([1,"21:T1d87,"])</script><script>self.__next_f.push([1,"\nEl sistema de documentación de API de Specra soporta múltiples formatos estándar de la industria, permitiéndole usar sus especificaciones de API existentes sin conversión.\n\n## Resumen rápido\n\n\u003cdiv className=\"grid grid-cols-1 md:grid-cols-3 gap-4 not-prose my-6\"\u003e\n  \u003cdiv className=\"border border-border rounded-lg p-4\"\u003e\n    \u003ch3 className=\"text-lg font-semibold mb-2\"\u003eFormato Specra\u003c/h3\u003e\n    \u003cp className=\"text-sm text-muted-foreground mb-3\"\u003eFormato nativo diseñado para la simplicidad\u003c/p\u003e\n    \u003cdiv className=\"flex items-center gap-2 text-xs\"\u003e\n      \u003cspan className=\"px-2 py-1 bg-green-500/10 text-green-600 dark:text-green-400 rounded\"\u003eSimple\u003c/span\u003e\n      \u003cspan className=\"px-2 py-1 bg-blue-500/10 text-blue-600 dark:text-blue-400 rounded\"\u003eLegible\u003c/span\u003e\n    \u003c/div\u003e\n  \u003c/div\u003e\n\n  \u003cdiv className=\"border border-border rounded-lg p-4\"\u003e\n    \u003ch3 className=\"text-lg font-semibold mb-2\"\u003eOpenAPI 3.x\u003c/h3\u003e\n    \u003cp className=\"text-sm text-muted-foreground mb-3\"\u003eFormato API REST estándar de la industria\u003c/p\u003e\n    \u003cdiv className=\"flex items-center gap-2 text-xs\"\u003e\n      \u003cspan className=\"px-2 py-1 bg-purple-500/10 text-purple-600 dark:text-purple-400 rounded\"\u003eEstándar\u003c/span\u003e\n      \u003cspan className=\"px-2 py-1 bg-orange-500/10 text-orange-600 dark:text-orange-400 rounded\"\u003ePotente\u003c/span\u003e\n    \u003c/div\u003e\n  \u003c/div\u003e\n\n  \u003cdiv className=\"border border-border rounded-lg p-4\"\u003e\n    \u003ch3 className=\"text-lg font-semibold mb-2\"\u003ePostman v2.x\u003c/h3\u003e\n    \u003cp className=\"text-sm text-muted-foreground mb-3\"\u003eExportar directamente desde Postman\u003c/p\u003e\n    \u003cdiv className=\"flex items-center gap-2 text-xs\"\u003e\n      \u003cspan className=\"px-2 py-1 bg-pink-500/10 text-pink-600 dark:text-pink-400 rounded\"\u003ePopular\u003c/span\u003e\n      \u003cspan className=\"px-2 py-1 bg-cyan-500/10 text-cyan-600 dark:text-cyan-400 rounded\"\u003eFácil\u003c/span\u003e\n    \u003c/div\u003e\n  \u003c/div\u003e\n\u003c/div\u003e\n\n## Cómo funciona\n\nEl sistema de documentación de API utiliza **auto-detección** por defecto. Simplemente haga referencia a su archivo de especificación y el sistema determina automáticamente el formato:\n\n```mdx\n\u003cApiReference spec=\"/api-specs/my-api.json\" /\u003e\n```\n\nEl analizador detectará si su archivo es:\n- ✅ Formato Specra (nativo)\n- ✅ OpenAPI 3.x o Swagger 2.0\n- ✅ Colección Postman v2.0 o v2.1\n\n## Comparación de formatos\n\n| Característica | Specra | OpenAPI | Postman |\n|---------|--------|---------|---------|\n| **Fácil de escribir** | ⭐⭐⭐⭐⭐ | ⭐⭐⭐ | ⭐⭐⭐⭐ |\n| **Estándar de industria** | ⭐⭐ | ⭐⭐⭐⭐⭐ | ⭐⭐⭐⭐ |\n| **Validación de esquema** | ⭐⭐⭐ | ⭐⭐⭐⭐⭐ | ⭐⭐ |\n| **Generación de código** | ⭐⭐ | ⭐⭐⭐⭐⭐ | ⭐⭐⭐ |\n| **Ejemplos** | ⭐⭐⭐⭐⭐ | ⭐⭐⭐⭐ | ⭐⭐⭐⭐⭐ |\n| **Auto-generación** | ⭐⭐ | ⭐⭐⭐⭐⭐ | ⭐⭐⭐⭐ |\n\n## Elegir un formato\n\n### Use el formato Specra cuando:\n\n- 📝 Escriba documentos desde cero\n- 🎯 Necesite un formato simple y mínimo\n- 🚀 Quiera empezar rápidamente\n- 📖 Documente \u003c 20 endpoints\n\n**Ejemplo:**\n```json\n{\n  \"title\": \"My API\",\n  \"baseUrl\": \"https://api.example.com\",\n  \"endpoints\": [...]\n}\n```\n\n[Ver ejemplo de Specra →](/docs/v1.0.0/api-test)\n\n---\n\n### Use OpenAPI cuando:\n\n- 🏢 Siga estándares empresariales\n- 🔧 Genere especificaciones desde código\n- 🔄 Comparta especificaciones entre herramientas\n- 📊 Necesite validación de esquema detallada\n- 🌐 Trabaje con puertas de enlace API\n\n**Ejemplo:**\n```json\n{\n  \"openapi\": \"3.0.0\",\n  \"info\": {...},\n  \"paths\": {...}\n}\n```\n\n[Ver ejemplo de OpenAPI →](/docs/v1.0.0/api-openapi)\n\n---\n\n### Use Postman cuando:\n\n- 🧪 Su equipo use Postman para pruebas\n- 💾 Tenga colecciones de Postman existentes\n- 🔁 Quiera mantener los documentos sincronizados con las pruebas\n- 📸 Necesite ejemplos de respuestas guardados\n- ⚡ Quiera un flujo de trabajo de exportación rápido\n\n**Ejemplo:**\n```json\n{\n  \"info\": {\n    \"schema\": \"https://schema.getpostman.com/...\"\n  },\n  \"item\": [...]\n}\n```\n\n[Ver ejemplo de Postman →](/docs/v1.0.0/api-postman)\n\n## Ejemplos de flujo de trabajo\n\n### Flujo de trabajo 1: Empezar simple (Specra)\n\nPerfecto para nuevos proyectos o APIs pequeñas:\n\n1. **Cree un archivo JSON Specra** en `/public/api-specs/`\n2. **Añada sus endpoints** con ejemplos\n3. **Referencie en MDX**:\n   ```mdx\n   \u003cApiReference spec=\"/api-specs/my-api.json\" /\u003e\n   ```\n4. **¡Listo!** Los documentos interactivos están activos\n\n---\n\n### Flujo de trabajo 2: Usar OpenAPI existente (OpenAPI)\n\nGenial si ya está usando OpenAPI:\n\n1. **Genere la especificación OpenAPI** desde su código (ej. FastAPI, Swagger, etc.)\n2. **Colóquela en `/public/api-specs/`**\n3. **Referencie en MDX**:\n   ```mdx\n   \u003cApiReference spec=\"/api-specs/openapi.json\" /\u003e\n   ```\n4. **Mantenga sincronizado** regenerando cuando el código cambie\n\n---\n\n### Flujo de trabajo 3: Exportar desde Postman (Postman)\n\nIdeal para equipos que usan Postman:\n\n1. **Desarrolle y pruebe** su API en Postman\n2. **Añada ejemplos de respuestas** en Postman\n3. **Exporte la colección** (formato v2.1)\n4. **Colóquela en `/public/api-specs/`**\n5. **Referencie en MDX**:\n   ```mdx\n   \u003cApiReference spec=\"/api-specs/collection.json\" /\u003e\n   ```\n6. **Re-exporte** cuando actualice su colección\n\n## Enfoque mixto\n\nPuede usar múltiples formatos en el mismo proyecto:\n\n```mdx\n\u003c!-- OpenAPI generado automáticamente para API principal --\u003e\n\u003cApiReference spec=\"/api-specs/main-api-openapi.json\" /\u003e\n\n\u003c!-- Colección Postman para API externa --\u003e\n\u003cApiReference spec=\"/api-specs/third-party-postman.json\" /\u003e\n\n\u003c!-- Specra para herramientas internas --\u003e\n\u003cApiReference spec=\"/api-specs/internal-tools-specra.json\" /\u003e\n```\n\n## Uso avanzado\n\n### Selección explícita de analizador\n\nAunque la auto-detección funciona bien, puede especificar explícitamente el analizador:\n\n```mdx\n\u003cApiReference spec=\"/api-specs/my-api.json\" parser=\"openapi\" /\u003e\n\u003cApiReference spec=\"/api-specs/my-api.json\" parser=\"postman\" /\u003e\n\u003cApiReference spec=\"/api-specs/my-api.json\" parser=\"specra\" /\u003e\n```\n\n### Deshabilitar Playground\n\nApague el área de juegos interactiva si no la necesita:\n\n```mdx\n\u003cApiReference spec=\"/api-specs/my-api.json\" showPlayground={false} /\u003e\n```\n\n### Versiones múltiples\n\nDocumente múltiples versiones de API:\n\n```mdx\n## Versión 2.0 (Actual)\n\n\u003cApiReference spec=\"/api-specs/api-v2.json\" /\u003e\n\n## Versión 1.0 (Desaprobada)\n\n\u003cCallout type=\"warning\"\u003e\nEsta versión será descontinuada el 1 de junio de 2024\n\u003c/Callout\u003e\n\n\u003cApiReference spec=\"/api-specs/api-v1.json\" showPlayground={false} /\u003e\n```\n\n## Características comunes\n\nIndependientemente del formato que elija, todas las especificaciones soportan:\n\n✅ **Parámetros de ruta** - Segmentos de URL dinámicos (`:id`, `{id}`)\n\n✅ **Parámetros de consulta** - Cadenas de consulta de URL\n\n✅ **Encabezados de solicitud** - Encabezados personalizados\n\n✅ **Cuerpos de solicitud** - Cargas útiles JSON\n\n✅ **Ejemplos de respuesta** - Respuestas de muestra\n\n✅ **Múltiples códigos de respuesta** - 200, 404, 500, etc.\n\n✅ **Autenticación** - Bearer, API Key, Basic\n\n✅ **Playground interactivo** - Pruebe APIs en vivo\n\n## Próximos pasos\n\n¿Listo para documentar su API? Elija un formato y sumérjase:\n\n- [Ver ejemplo de formato Specra →](/docs/v1.0.0/api-test)\n- [Ver ejemplo de OpenAPI →](/docs/v1.0.0/api-openapi)\n- [Ver ejemplo de Postman →](/docs/v1.0.0/api-postman)\n- [Aprender sobre componentes manuales →](/docs/v1.0.0/api-example)\n\n\u003cCallout type=\"tip\" title=\"¿Necesita ayuda?\"\u003e\nConsulte [API_PARSERS.md](/API_PARSERS.md) para documentación técnica detallada sobre el sistema de analizador.\n\u003c/Callout\u003e\n"])</script><script>self.__next_f.push([1,"22:T1d87,"])</script><script>self.__next_f.push([1,"\nEl sistema de documentación de API de Specra soporta múltiples formatos estándar de la industria, permitiéndole usar sus especificaciones de API existentes sin conversión.\n\n## Resumen rápido\n\n\u003cdiv className=\"grid grid-cols-1 md:grid-cols-3 gap-4 not-prose my-6\"\u003e\n  \u003cdiv className=\"border border-border rounded-lg p-4\"\u003e\n    \u003ch3 className=\"text-lg font-semibold mb-2\"\u003eFormato Specra\u003c/h3\u003e\n    \u003cp className=\"text-sm text-muted-foreground mb-3\"\u003eFormato nativo diseñado para la simplicidad\u003c/p\u003e\n    \u003cdiv className=\"flex items-center gap-2 text-xs\"\u003e\n      \u003cspan className=\"px-2 py-1 bg-green-500/10 text-green-600 dark:text-green-400 rounded\"\u003eSimple\u003c/span\u003e\n      \u003cspan className=\"px-2 py-1 bg-blue-500/10 text-blue-600 dark:text-blue-400 rounded\"\u003eLegible\u003c/span\u003e\n    \u003c/div\u003e\n  \u003c/div\u003e\n\n  \u003cdiv className=\"border border-border rounded-lg p-4\"\u003e\n    \u003ch3 className=\"text-lg font-semibold mb-2\"\u003eOpenAPI 3.x\u003c/h3\u003e\n    \u003cp className=\"text-sm text-muted-foreground mb-3\"\u003eFormato API REST estándar de la industria\u003c/p\u003e\n    \u003cdiv className=\"flex items-center gap-2 text-xs\"\u003e\n      \u003cspan className=\"px-2 py-1 bg-purple-500/10 text-purple-600 dark:text-purple-400 rounded\"\u003eEstándar\u003c/span\u003e\n      \u003cspan className=\"px-2 py-1 bg-orange-500/10 text-orange-600 dark:text-orange-400 rounded\"\u003ePotente\u003c/span\u003e\n    \u003c/div\u003e\n  \u003c/div\u003e\n\n  \u003cdiv className=\"border border-border rounded-lg p-4\"\u003e\n    \u003ch3 className=\"text-lg font-semibold mb-2\"\u003ePostman v2.x\u003c/h3\u003e\n    \u003cp className=\"text-sm text-muted-foreground mb-3\"\u003eExportar directamente desde Postman\u003c/p\u003e\n    \u003cdiv className=\"flex items-center gap-2 text-xs\"\u003e\n      \u003cspan className=\"px-2 py-1 bg-pink-500/10 text-pink-600 dark:text-pink-400 rounded\"\u003ePopular\u003c/span\u003e\n      \u003cspan className=\"px-2 py-1 bg-cyan-500/10 text-cyan-600 dark:text-cyan-400 rounded\"\u003eFácil\u003c/span\u003e\n    \u003c/div\u003e\n  \u003c/div\u003e\n\u003c/div\u003e\n\n## Cómo funciona\n\nEl sistema de documentación de API utiliza **auto-detección** por defecto. Simplemente haga referencia a su archivo de especificación y el sistema determina automáticamente el formato:\n\n```mdx\n\u003cApiReference spec=\"/api-specs/my-api.json\" /\u003e\n```\n\nEl analizador detectará si su archivo es:\n- ✅ Formato Specra (nativo)\n- ✅ OpenAPI 3.x o Swagger 2.0\n- ✅ Colección Postman v2.0 o v2.1\n\n## Comparación de formatos\n\n| Característica | Specra | OpenAPI | Postman |\n|---------|--------|---------|---------|\n| **Fácil de escribir** | ⭐⭐⭐⭐⭐ | ⭐⭐⭐ | ⭐⭐⭐⭐ |\n| **Estándar de industria** | ⭐⭐ | ⭐⭐⭐⭐⭐ | ⭐⭐⭐⭐ |\n| **Validación de esquema** | ⭐⭐⭐ | ⭐⭐⭐⭐⭐ | ⭐⭐ |\n| **Generación de código** | ⭐⭐ | ⭐⭐⭐⭐⭐ | ⭐⭐⭐ |\n| **Ejemplos** | ⭐⭐⭐⭐⭐ | ⭐⭐⭐⭐ | ⭐⭐⭐⭐⭐ |\n| **Auto-generación** | ⭐⭐ | ⭐⭐⭐⭐⭐ | ⭐⭐⭐⭐ |\n\n## Elegir un formato\n\n### Use el formato Specra cuando:\n\n- 📝 Escriba documentos desde cero\n- 🎯 Necesite un formato simple y mínimo\n- 🚀 Quiera empezar rápidamente\n- 📖 Documente \u003c 20 endpoints\n\n**Ejemplo:**\n```json\n{\n  \"title\": \"My API\",\n  \"baseUrl\": \"https://api.example.com\",\n  \"endpoints\": [...]\n}\n```\n\n[Ver ejemplo de Specra →](/docs/v1.0.0/api-test)\n\n---\n\n### Use OpenAPI cuando:\n\n- 🏢 Siga estándares empresariales\n- 🔧 Genere especificaciones desde código\n- 🔄 Comparta especificaciones entre herramientas\n- 📊 Necesite validación de esquema detallada\n- 🌐 Trabaje con puertas de enlace API\n\n**Ejemplo:**\n```json\n{\n  \"openapi\": \"3.0.0\",\n  \"info\": {...},\n  \"paths\": {...}\n}\n```\n\n[Ver ejemplo de OpenAPI →](/docs/v1.0.0/api-openapi)\n\n---\n\n### Use Postman cuando:\n\n- 🧪 Su equipo use Postman para pruebas\n- 💾 Tenga colecciones de Postman existentes\n- 🔁 Quiera mantener los documentos sincronizados con las pruebas\n- 📸 Necesite ejemplos de respuestas guardados\n- ⚡ Quiera un flujo de trabajo de exportación rápido\n\n**Ejemplo:**\n```json\n{\n  \"info\": {\n    \"schema\": \"https://schema.getpostman.com/...\"\n  },\n  \"item\": [...]\n}\n```\n\n[Ver ejemplo de Postman →](/docs/v1.0.0/api-postman)\n\n## Ejemplos de flujo de trabajo\n\n### Flujo de trabajo 1: Empezar simple (Specra)\n\nPerfecto para nuevos proyectos o APIs pequeñas:\n\n1. **Cree un archivo JSON Specra** en `/public/api-specs/`\n2. **Añada sus endpoints** con ejemplos\n3. **Referencie en MDX**:\n   ```mdx\n   \u003cApiReference spec=\"/api-specs/my-api.json\" /\u003e\n   ```\n4. **¡Listo!** Los documentos interactivos están activos\n\n---\n\n### Flujo de trabajo 2: Usar OpenAPI existente (OpenAPI)\n\nGenial si ya está usando OpenAPI:\n\n1. **Genere la especificación OpenAPI** desde su código (ej. FastAPI, Swagger, etc.)\n2. **Colóquela en `/public/api-specs/`**\n3. **Referencie en MDX**:\n   ```mdx\n   \u003cApiReference spec=\"/api-specs/openapi.json\" /\u003e\n   ```\n4. **Mantenga sincronizado** regenerando cuando el código cambie\n\n---\n\n### Flujo de trabajo 3: Exportar desde Postman (Postman)\n\nIdeal para equipos que usan Postman:\n\n1. **Desarrolle y pruebe** su API en Postman\n2. **Añada ejemplos de respuestas** en Postman\n3. **Exporte la colección** (formato v2.1)\n4. **Colóquela en `/public/api-specs/`**\n5. **Referencie en MDX**:\n   ```mdx\n   \u003cApiReference spec=\"/api-specs/collection.json\" /\u003e\n   ```\n6. **Re-exporte** cuando actualice su colección\n\n## Enfoque mixto\n\nPuede usar múltiples formatos en el mismo proyecto:\n\n```mdx\n\u003c!-- OpenAPI generado automáticamente para API principal --\u003e\n\u003cApiReference spec=\"/api-specs/main-api-openapi.json\" /\u003e\n\n\u003c!-- Colección Postman para API externa --\u003e\n\u003cApiReference spec=\"/api-specs/third-party-postman.json\" /\u003e\n\n\u003c!-- Specra para herramientas internas --\u003e\n\u003cApiReference spec=\"/api-specs/internal-tools-specra.json\" /\u003e\n```\n\n## Uso avanzado\n\n### Selección explícita de analizador\n\nAunque la auto-detección funciona bien, puede especificar explícitamente el analizador:\n\n```mdx\n\u003cApiReference spec=\"/api-specs/my-api.json\" parser=\"openapi\" /\u003e\n\u003cApiReference spec=\"/api-specs/my-api.json\" parser=\"postman\" /\u003e\n\u003cApiReference spec=\"/api-specs/my-api.json\" parser=\"specra\" /\u003e\n```\n\n### Deshabilitar Playground\n\nApague el área de juegos interactiva si no la necesita:\n\n```mdx\n\u003cApiReference spec=\"/api-specs/my-api.json\" showPlayground={false} /\u003e\n```\n\n### Versiones múltiples\n\nDocumente múltiples versiones de API:\n\n```mdx\n## Versión 2.0 (Actual)\n\n\u003cApiReference spec=\"/api-specs/api-v2.json\" /\u003e\n\n## Versión 1.0 (Desaprobada)\n\n\u003cCallout type=\"warning\"\u003e\nEsta versión será descontinuada el 1 de junio de 2024\n\u003c/Callout\u003e\n\n\u003cApiReference spec=\"/api-specs/api-v1.json\" showPlayground={false} /\u003e\n```\n\n## Características comunes\n\nIndependientemente del formato que elija, todas las especificaciones soportan:\n\n✅ **Parámetros de ruta** - Segmentos de URL dinámicos (`:id`, `{id}`)\n\n✅ **Parámetros de consulta** - Cadenas de consulta de URL\n\n✅ **Encabezados de solicitud** - Encabezados personalizados\n\n✅ **Cuerpos de solicitud** - Cargas útiles JSON\n\n✅ **Ejemplos de respuesta** - Respuestas de muestra\n\n✅ **Múltiples códigos de respuesta** - 200, 404, 500, etc.\n\n✅ **Autenticación** - Bearer, API Key, Basic\n\n✅ **Playground interactivo** - Pruebe APIs en vivo\n\n## Próximos pasos\n\n¿Listo para documentar su API? Elija un formato y sumérjase:\n\n- [Ver ejemplo de formato Specra →](/docs/v1.0.0/api-test)\n- [Ver ejemplo de OpenAPI →](/docs/v1.0.0/api-openapi)\n- [Ver ejemplo de Postman →](/docs/v1.0.0/api-postman)\n- [Aprender sobre componentes manuales →](/docs/v1.0.0/api-example)\n\n\u003cCallout type=\"tip\" title=\"¿Necesita ayuda?\"\u003e\nConsulte [API_PARSERS.md](/API_PARSERS.md) para documentación técnica detallada sobre el sistema de analizador.\n\u003c/Callout\u003e\n"])</script><script>self.__next_f.push([1,"23:T6c5,"])</script><script>self.__next_f.push([1,"\nLas insignias son pequeños indicadores de estado que resaltan información importante, categorías o estados.\n\n## Uso\n\n```mdx\n\u003cBadge\u003ePredeterminado\u003c/Badge\u003e\n\u003cBadge variant=\"success\"\u003eÉxito\u003c/Badge\u003e\n\u003cBadge variant=\"warning\"\u003eAdvertencia\u003c/Badge\u003e\n\u003cBadge variant=\"error\"\u003eError\u003c/Badge\u003e\n\u003cBadge variant=\"info\"\u003eInfo\u003c/Badge\u003e\n```\n\n## Ejemplo en vivo\n\n\u003cBadge\u003ePredeterminado\u003c/Badge\u003e \u003cBadge variant=\"success\"\u003eÉxito\u003c/Badge\u003e \u003cBadge variant=\"warning\"\u003eAdvertencia\u003c/Badge\u003e \u003cBadge variant=\"error\"\u003eError\u003c/Badge\u003e \u003cBadge variant=\"info\"\u003eInfo\u003c/Badge\u003e\n\n## Variantes\n\n### Predeterminado\n\u003cBadge\u003eInsignia predeterminada\u003c/Badge\u003e\n\nSe usa para información neutral o etiquetas generales.\n\n### Éxito\n\u003cBadge variant=\"success\"\u003eCompletado\u003c/Badge\u003e\n\nIndica operaciones exitosas, estado activo o resultados positivos.\n\n### Advertencia\n\u003cBadge variant=\"warning\"\u003ePendiente\u003c/Badge\u003e\n\nResalta elementos que necesitan atención o están en un estado de transición.\n\n### Error\n\u003cBadge variant=\"error\"\u003eFallido\u003c/Badge\u003e\n\nMuestra errores, problemas críticos o estado negativo.\n\n### Info\n\u003cBadge variant=\"info\"\u003eNuevo\u003c/Badge\u003e\n\nProporciona contexto informativo o resalta nuevas características.\n\n## Props\n\n| Propiedad | Tipo | Predeterminado | Descripción |\n|-----------|------|----------------|-------------|\n| `children` | `ReactNode` | requerido | Contenido de texto de la insignia |\n| `variant` | `\"default\" \\| \"success\" \\| \"warning\" \\| \"error\" \\| \"info\"` | `\"default\"` | Variante de color |\n\n## Patrones comunes\n\nUse insignias en línea con texto para indicar el estado:\n\n```mdx\nEsta característica es \u003cBadge variant=\"success\"\u003eEstable\u003c/Badge\u003e y está lista para producción.\n```\n\nEsta característica es \u003cBadge variant=\"success\"\u003eEstable\u003c/Badge\u003e y está lista para producción.\n"])</script><script>self.__next_f.push([1,"24:T6c5,"])</script><script>self.__next_f.push([1,"\nLas insignias son pequeños indicadores de estado que resaltan información importante, categorías o estados.\n\n## Uso\n\n```mdx\n\u003cBadge\u003ePredeterminado\u003c/Badge\u003e\n\u003cBadge variant=\"success\"\u003eÉxito\u003c/Badge\u003e\n\u003cBadge variant=\"warning\"\u003eAdvertencia\u003c/Badge\u003e\n\u003cBadge variant=\"error\"\u003eError\u003c/Badge\u003e\n\u003cBadge variant=\"info\"\u003eInfo\u003c/Badge\u003e\n```\n\n## Ejemplo en vivo\n\n\u003cBadge\u003ePredeterminado\u003c/Badge\u003e \u003cBadge variant=\"success\"\u003eÉxito\u003c/Badge\u003e \u003cBadge variant=\"warning\"\u003eAdvertencia\u003c/Badge\u003e \u003cBadge variant=\"error\"\u003eError\u003c/Badge\u003e \u003cBadge variant=\"info\"\u003eInfo\u003c/Badge\u003e\n\n## Variantes\n\n### Predeterminado\n\u003cBadge\u003eInsignia predeterminada\u003c/Badge\u003e\n\nSe usa para información neutral o etiquetas generales.\n\n### Éxito\n\u003cBadge variant=\"success\"\u003eCompletado\u003c/Badge\u003e\n\nIndica operaciones exitosas, estado activo o resultados positivos.\n\n### Advertencia\n\u003cBadge variant=\"warning\"\u003ePendiente\u003c/Badge\u003e\n\nResalta elementos que necesitan atención o están en un estado de transición.\n\n### Error\n\u003cBadge variant=\"error\"\u003eFallido\u003c/Badge\u003e\n\nMuestra errores, problemas críticos o estado negativo.\n\n### Info\n\u003cBadge variant=\"info\"\u003eNuevo\u003c/Badge\u003e\n\nProporciona contexto informativo o resalta nuevas características.\n\n## Props\n\n| Propiedad | Tipo | Predeterminado | Descripción |\n|-----------|------|----------------|-------------|\n| `children` | `ReactNode` | requerido | Contenido de texto de la insignia |\n| `variant` | `\"default\" \\| \"success\" \\| \"warning\" \\| \"error\" \\| \"info\"` | `\"default\"` | Variante de color |\n\n## Patrones comunes\n\nUse insignias en línea con texto para indicar el estado:\n\n```mdx\nEsta característica es \u003cBadge variant=\"success\"\u003eEstable\u003c/Badge\u003e y e a\"\n  }\n}\n```\n\n\u003cCallout type=\"tip\"\u003e\nManténgalo corto y claro. Esto aparece en muchos lugares, incluidas las pestañas del navegador donde el espacio es limitado.\n\u003c/Callout\u003e\n\n### description\n\n**Tipo:** `string`\n\nBreve descripción de su documentación. Usado en metaetiquetas SEO y vistas previas de redes sociales.\n\n```json\n{\n  \"site\": {\n    \"description\": \"Guía completa para construir documentación con Specra\"\n  }\n}\n```\n\n**Mejores prácticas:**\n- Manténgalo por debajo de 160 caracteres\n- Incluya palabras clave relevantes\n- Sea descriptivo y específico\n- Concéntrese en lo que los usuarios aprenderán\n\n### url\n\n**Tipo:** `string`\n\nLa URL completa donde se aloja su documentación. Usado para generar URL canónicas y vistas previas de redes sociales.\n\n```json\n{\n  \"site\": {\n    \"url\": \"https://docs.ejemplo.com\"\n  }\n}\n```\n\n\u003cCallout type=\"warning\"\u003e\nIncluya el protocolo (`https://`) pero no la barra diagonal final.\n\u003c/Callout\u003e\n\n### baseUrl\n\n**Tipo:** `string`\n**Predeterminado:** `\"/\"`\n\nRuta base para su sitio. Generalmente solo necesaria para GitHub Pages sin un dominio personalizado.\n\n```json\n{\n  \"site\": {\n    \"baseUrl\": \"/\"\n  }\n}\n```\n\nPara GitHub Pages en `nombreusuario.github.io/nombre-repo`:\n\n```json\n{\n  \"site\": {\n    \"baseUrl\": \"/nombre-repo/\"\n  }\n}\n```\n\n\u003cCallout type=\"info\"\u003e\nPara la mayoría de las implementaciones (Vercel, Netlify, dominios personalizados), mantenga esto como `\"/\"`.\n\u003c/Callout\u003e\n\n### language\n\n**Tipo:** `string`\n**Predeterminado:** `\"en\"`\n\nEl idioma principal de su documentación. Usado en el atributo HTML `lang`.\n\n```json\n{\n  \"site\": {\n    \"language\": \"en\"\n  }\n}\n```\n\nValores comunes: `en`, `es`, `fr`, `de`, `ja`, `zh`, `pt`, `ru`\n\n### organizationName\n\n**Tipo:** `string`\n\nEl nombre de su empresa u organización. Usado en el pie de página y metadatos.\n\n```json\n{\n  \"site\": {\n    \"organizationName\": \"Acme Corporation\"\n  }\n}\n```\n\n### projectName\n\n**Tipo:** `string`\n\nEl nombre de su proyecto o producto. Usado en metadatos y puede ser referenciado en el contenido.\n\n```json\n{\n  \"site\": {\n    \"projectName\": \"specra\"\n  }\n}\n```\n\n### activeVersion\n\n**Tipo:** `string`\n**Predeterminado:** Primera versión encontrada en la carpeta `docs/`\n\nQué versión de documentación mostrar por defecto.\n\n```json\n{\n  \"site\": {\n    \"activeVersion\": \"v2.0.0\"\n  }\n}\n```\n\nLos usuarios pueden cambiar de versión usando el menú desplegable de versiones, pero esto establece el valor predeterminado.\n\n### logo\n\n**Tipo:** `string` o `object`\n\nRuta a su imagen de logotipo. Puede ser un solo logotipo o logotipos separados para modos claro y oscuro.\n\n**Logotipo único:**\n```json\n{\n  \"site\": {\n    \"logo\": \"/logo.svg\"\n  }\n}\n```\n\n**Logotipos separados para temas:**\n```json\n{\n  \"site\": {\n    \"logo\": {\n      \"light\": \"/logo-light.svg\",\n      \"dark\": \"/logo-dark.svg\"\n    }\n  }\n}\n```\n\n**Mejores prácticas:**\n- Use SVG para una representación nítida en cualquier tamaño\n- Mantenga las dimensiones alrededor de 150px de ancho × 40px de alto\n- Optimice archivos (use SVGO o similar)\n- Coloque en la carpeta `public/`\n\n### favicon\n\n**Tipo:** `string`\n\nRuta a su favicon. Aparece en pestañas del navegador y marcadores.\n\n```json\n{\n  \"site\": {\n    \"favicon\": \"/favicon.ico\"\n  }\n}\n```\n\n**Configuración recomendada:**\n```\npublic/\n├── favicon.ico          # 32×32 ICO para navegadores antiguos\n├── favicon-16x16.png    # 16×16 PNG\n├── favicon-32x32.png    # 32×32 PNG\n└── apple-touch-icon.png # 180×180 PNG para iOS\n```\n\nLuego haga referencia al principal:\n```json\n{\n  \"site\": {\n    \"favicon\": \"/favicon-32x32.png\"\n  }\n}\n```\n\n### hideTitle\n\n**Tipo:** `boolean`\n**Predeterminado:** `false`\n\nOcultar el título del sitio en la navegación del encabezado.\n\n```json\n{\n  \"site\": {\n    \"hideTitle\": true\n  }\n}\n```\n\nÚtil cuando su logotipo incluye texto y no desea duplicar el título.\n\n### hideLogo\n\n**Tipo:** `boolean`\n**Predeterminado:** `false`\n\nOcultar el logotipo en la navegación del encabezado.\n\n```json\n{\n  \"site\": {\n    \"hideLogo\": true\n  }\n}\n```\n\nUse esto si solo desea mostrar el texto del título sin un logotipo.\n\n## Ejemplos\n\n### Configuración Mínima\n\nPerfecto para comenzar:\n\n```json\n{\n  \"site\": {\n    \"title\": \"Mis Docs\",\n    \"description\": \"Documentación para mi proyecto\"\n  }\n}\n```\n\n### Proyecto de Código Abierto\n\nPara un proyecto de código abierto en GitHub:\n\n```json\n{\n  \"site\": {\n    \"title\": \"Documentación MyLib\",\n    \"description\": \"Una biblioteca potente para construir cosas increíbles\",\n    \"url\": \"https://mylib.dev\",\n    \"organizationName\": \"Colaboradores MyLib\",\n    \"projectName\": \"mylib\",\n    \"logo\": \"/logo.svg\",\n    \"favicon\": \"/favicon.ico\"\n  }\n}\n```\n\n### Producto de Empresa\n\nPara un producto comercial:\n\n```json\n{\n  \"site\": {\n    \"title\": \"Docs API Acme\",\n    \"description\": \"Referencia API completa y guías para Acme Platform\",\n    \"url\": \"https://docs.acme.com\",\n    \"organizationName\": \"Acme Corporation\",\n    \"projectName\": \"acme-platform\",\n    \"activeVersion\": \"v2.0.0\",\n    \"logo\": {\n      \"light\": \"/acme-logo-light.svg\",\n      \"dark\": \"/acme-logo-dark.svg\"\n    },\n    \"favicon\": \"/favicon-32x32.png\"\n  }\n}\n```\n\n### Sitio Multilingüe\n\nPara documentación en múltiples idiomas:\n\n```json\n{\n  \"site\": {\n    \"title\": \"Documentación\",\n    \"language\": \"es\",\n    \"url\": \"https://docs.ejemplo.com/es\",\n    \"logo\": \"/logo.svg\"\n  }\n}\n```\n\n## Patrones Comunes\n\n### Configuración de GitHub Pages\n\nPara GitHub Pages sin dominio personalizado:\n\n```json\n{\n  \"site\": {\n    \"title\": \"Mis Docs\",\n    \"url\": \"https://username.github.io/nombre-repo\",\n    \"baseUrl\": \"/nombre-repo/\"\n  }\n}\n```\n\n### Mejores Prácticas de Logotipo\n\n**Para fondo en modo claro:**\nUse un logotipo oscuro o logotipo con color\n\n**Para fondo en modo oscuro:**\nUse un logotipo claro/blanco o invierta los colores\n\n**Configuración de ejemplo:**\n```json\n{\n  \"site\": {\n    \"logo\": {\n      \"light\": \"/logo-dark.svg\",\n      \"dark\": \"/logo-white.svg\"\n    }\n  }\n}\n```\n\n## Validación\n\nSpecra valida la configuración de su sitio al inicio. Errores comunes:\n\n**Falta título:**\n```\n❌ Error: site.title es obligatorio\n```\n\n**URL no válida:**\n```\n❌ Error: site.url debe ser una URL válida (incluya https://)\n```\n\n**Archivo de logotipo no encontrado:**\n```\n⚠️ Advertencia: Archivo de logotipo no encontrado en /logo.svg\n```\n\n## Variables de Entorno\n\nUse variables de entorno para diferentes entornos:\n\n```json\n{\n  \"site\": {\n    \"url\": \"${SITE_URL}\",\n    \"logo\": \"${LOGO_PATH}\"\n  }\n}\n```\n\nLuego establézcalas:\n```bash\n# .env.local\nSITE_URL=https://docs.ejemplo.com\nLOGO_PATH=/logo.svg\n```\n\n## Próximos Pasos\n\n\u003cCardGrid cols={2}\u003e\n  \u003cCard\n    icon=\"layout\"\n    title=\"Navegación\"\n    description=\"Configurar barra lateral, migas de pan y grupos de pestañas\"\n    href=\"/docs/v1.0.0/configuration/navigation\"\n  /\u003e\n  \u003cCard\n    icon=\"rocket\"\n    title=\"Implementación\"\n    description=\"Configurar ajustes de implementación\"\n    href=\"/docs/v1.0.0/configuration/deployment-config\"\n  /\u003e\n  \u003cCard\n    icon=\"sliders\"\n    title=\"Avanzado\"\n    description=\"Análisis, búsqueda y más\"\n    href=\"/docs/v1.0.0/configuration/advanced\"\n  /\u003e\n  \u003cCard\n    icon=\"arrow-left\"\n    title=\"Descripción General\"\n    description=\"Volver a la descripción general de configuración\"\n    href=\"/docs/v1.0.0/configuration/overview\"\n  /\u003e\n\u003c/CardGrid\u003e\n"])</script><script>self.__n  por los creadores de Next.js, por lo que todo funciona perfectamente desde el primer momento.\n\n## ¿Por qué Vercel?\n\n- **Cero configuración** - Detección y configuración automáticas\n- **Implementaciones instantáneas** - En vivo en menos de 60 segundos\n- **HTTPS automático** - Certificados SSL incluidos\n- **Red perimetral** - Carga rápida en todo el mundo\n- **Implementaciones de vista previa** - Cada envío de git obtiene una URL\n- **Nivel gratuito** - Límites generosos para sitios de documentación\n\n## Implementación Rápida\n\n\u003cSteps\u003e\n  \u003cStep title=\"Enviar a GitHub\"\u003e\n    Si aún no lo ha hecho, envíe su proyecto a GitHub:\n\n```bash\ngit init\ngit add .\ngit commit -m \"Commit inicial\"\ngit remote add origin https://github.com/username/repo.git\ngit push -u origin main\n```\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Importar a Vercel\"\u003e\n    1. Vaya a [vercel.com/new](https://vercel.com/new)\n    2. Haga clic en \"Import Git Repository\" (Importar Repositorio Git)\n    3. Seleccione su repositorio de documentación\n    4. Vercel detecta automáticamente Next.js y configura todo\n\n    ¡No se necesita configuración manual!\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Implementar\"\u003e\n    Haga clic en \"Deploy\" (Implementar) y espere unos 30-60 segundos.\n\n    Obtendrá una URL de producción como `su-proyecto.vercel.app`\n  \u003c/Step\u003e\n\u003c/Steps\u003e\n\n\u003cCallout type=\"success\"\u003e\n¡Eso es todo! Su documentación ahora está en vivo con HTTPS automático y CDN global.\n\u003c/Callout\u003e\n\n## Configuración\n\nVercel utiliza automáticamente esta configuración para proyectos Next.js:\n\n| Configuración | Valor |\n|---------------|-------|\n| Comando de Compilación | `npm run build` |\n| Directorio de Salida | `.next` |\n| Comando de Instalación | `npm install` |\n| Versión de Node | 20.x (última LTS) |\n\n### Anular Configuración (Opcional)\n\nSi necesita configuraciones personalizadas, cree `vercel.json`:\n\n```json\n{\n  \"buildCommand\": \"npm run build\",\n  \"outputDirectory\": \".next\",\n  \"installCommand\": \"npm ci\",\n  \"framework\": \"nextjs\",\n  \"regions\": [\"iad1\"]\n}\n```\n\n## Variables de Entorno\n\nAgregue variables de entorno en el panel de Vercel:\n\n\u003cSteps\u003e\n  \u003cStep title=\"Ir a Configuración del Proyecto\"\u003e\n    Haga clic en su proyecto → Settings → Environment Variables\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Agregar Variables\"\u003e\n    Agregue sus variables una por una:\n\n```\nMEILISEARCH_HOST=https://search.example.com\nMEILISEARCH_API_KEY=su-clave-de-busqueda\nNEXT_PUBLIC_GA_ID=G-XXXXXXXXXX\n```\n\n\u003cCallout type=\"tip\"\u003e\nLas variables que comienzan con `NEXT_PUBLIC_` están expuestas al navegador. Mantenga las claves confidenciales sin este prefijo.\n\u003c/Callout\u003e\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Volver a Implementar\"\u003e\n    Los cambios de entorno requieren una nueva implementación. Vaya a Deployments → Haga clic en los tres puntos → Redeploy.\n  \u003c/Step\u003e\n\u003c/Steps\u003e\n\n## Dominio Personalizado\n\nAgregue su propio dominio a su proyecto Vercel:\n\n\u003cSteps\u003e\n  \u003cStep title=\"Agregar Dominio\"\u003e\n    1. Vaya a Project Settings → Domains\n    2. Ingrese su dominio (por ejemplo, `docs.ejemplo.com`)\n    3. Haga clic en \"Add\" (Agregar)\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Configurar DNS\"\u003e\n    Vercel le muestra los registros DNS para agregar. Típicamente:\n\n**Para subdominio (docs.ejemplo.com):**\n```\nTipo: CNAME\nNombre: docs\nValor: cname.vercel-dns.com\n```\n\n**Para dominio ápice (ejemplo.com):**\n```\nTipo: A\nNombre: @\nValor: 76.76.21.21\n```\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Esperar Verificación\"\u003e\n    La propagación de DNS tarda de 5 minutos a 48 horas (generalmente menos de una hora).\n\n    Vercel aprovisiona automáticamente un certificado SSL una vez que se verifica el DNS.\n  \u003c/Step\u003e\n\u003c/Steps\u003e\n\n## Implementaciones Automáticas\n\nCada envío de git activa una implementación:\n\n**Implementaciones de Producción:**\n- Los commits a la rama `main` se implementan en producción\n- Actualiza su sitio en vivo automáticamente\n\n**Implementaciones de Vista Previa:**\n- Los commits a otras ramas obtienen URL de vista previa\n- Las solicitudes de extracción obtienen URL únicas para pruebas\n- Perfecto para revisar cambios antes de fusionar\n\n### URL de Vista Previa\n\nCada implementación de vista previa obtiene una URL única:\n\n```\nsu-proyecto-git-feature-branch-username.vercel.app\n```\n\nComparta esto con su equipo para revisar los cambios antes de salir en vivo.\n\n## Configuración de Implementación\n\n### Configuración de Rama\n\nControle qué ramas se implementan:\n\n1. Vaya a Settings → Git\n2. Establezca Production Branch (generalmente `main`)\n3. Habilite/deshabilite las implementaciones de vista previa para otras ramas\n\n### Protección de Implementación\n\nProteja las implementaciones de producción:\n\n```json\n{\n  \"git\": {\n    \"deploymentEnabled\": {\n      \"main\": true,\n      \"staging\": \"preview\"\n    }\n  }\n}\n```\n\n## Optimización de Rendimiento\n\nVercel optimiza automáticamente su implementación:\n\n- **Almacenamiento en caché perimetral** - Archivos estáticos almacenados en caché globalmente\n- **Optimización de imagen** - Componente Image de Next.js optimizado automáticamente\n- **Compresión** - Compresión Gzip/Brotli habilitada\n- **HTTP/2** - Conexiones multiplexadas más rápidas\n\n### Análisis\n\nHabilite Vercel Analytics gratis:\n\n1. Vaya a la pestaña Analytics\n2. Haga clic en \"Enable Analytics\" (Habilitar Análisis)\n3. Agregue el componente Analytics a su diseño\n\n```tsx\n// app/layout.tsx\nimport { Analytics } from '@vercel/analytics/react'\n\nexport default function RootLayout({ children }) {\n  return (\n    \u003chtml\u003e\n      \u003cbody\u003e\n        {children}\n        \u003cAnalytics /\u003e\n      \u003c/body\u003e\n    \u003c/html\u003e\n  )\n}\n```\n\n## Integración CI/CD\n\nVercel actúa como su tubería CI/CD:\n\n**Qué se ejecuta en cada implementación:**\n- `npm install` (dependencias)\n- `npm run build` (compilación Next.js)\n- Comprobaciones y validaciones automáticas\n- Implementar en la red perimetral\n\n### Integración GitHub\n\nVercel comenta en las solicitudes de extracción con:\n- URL de implementación de vista previa\n- Registros de compilación\n- Información de rendimiento\n\n### Registros de Compilación\n\nVer registros de compilación detallados:\n1. Vaya a Deployments\n2. Haga clic en cualquier implementación\n3. Vea la sección Building para ver los registros\n\n## Solución de Problemas\n\n### La Compilación Falla\n\n**Verificar Versión de Node:**\nAsegúrese de estar usando Node 18+. Agregue a `package.json`:\n\n```json\n{\n  \"engines\": {\n    \"node\": \"\u003e=18.0.0\"\n  }\n}\n```\n\n**Borrar caché de compilación:**\n1. Vaya a Settings → General\n2. Desplácese a Build \u0026 Development Settings\n3. Clear build cache (Borrar caché de compilación)\n\n### Las Variables de Entorno No Funcionan\n\n- Verifique los nombres de las variables (distinguen mayúsculas de minúsculas)\n- Prefije las variables del lado del cliente con `NEXT_PUBLIC_`\n- Vuelva a implementar después de cambiar las variables\n\n### El Dominio Personalizado No Funciona\n\n- Verifique que los registros DNS sean correctos\n- Espere la propagación de DNS (verifique con `dig` o `nslookup`)\n- Asegúrese de que CNAME apunte a `cname.vercel-dns.com`\n- Verifique el estado de verificación del dominio en el panel de Vercel\n\n## Implementación de Monorepo\n\nSi sus documentos están en un monorepo:\n\n1. Establezca Root Directory en la configuración del proyecto\n2. Apunte a su carpeta de documentos (por ejemplo, `apps/docs`)\n3. Vercel compila solo ese directorio\n\n```json\n{\n  \"buildCommand\": \"cd ../.. \u0026\u0026 npm run build:docs\",\n  \"outputDirectory\": \".next\"\n}\n```\n\n## Mejores Prácticas\n\n**Usar implementaciones de vista previa** - Probar cambios antes de fusionar a main\n\n**Habilitar protección de rama** - Requerir éxito de implementación de vista previa antes de fusionar\n\n**Configurar notificaciones** - Obtener alertas de Slack/correo electrónico para el estado de implementación\n\n**Monitorear análisis** - Rastrear vistas de página y rendimiento\n\n**Usar configuración perimetral** - Almacenar indicadores de características y configuración en el perímetro para actualizaciones instantáneas\n\n## Precios\n\nEl nivel gratuito de Vercel incluye:\n- Implementaciones ilimitadas\n- 100GB de ancho de banda/mes\n- HTTPS automático\n- Implementaciones de vista previa\n- Análisis (básico)\n\nEsto generalmente es suficiente para sitios de documentación. Actualice a Pro si necesita:\n- Más ancho de banda\n- Análisis avanzado\n- Protección con contraseña\n- Soporte empresarial\n\n## Próximos Pasos\n\n\u003cCardGrid cols={2}\u003e\n  \u003cCard\n    icon=\"github\"\n    title=\"GitHub Pages\"\n    description=\"Implementar como sitio estático en GitHub Pages\"\n    href=\"/docs/v1.0.0/deployment/github-pages\"\n  /\u003e\n  \u003cCard\n    icon=\"globe\"\n    title=\"Netlify\"\n    description=\"Plataforma de alojamiento estático alternativa\"\n    href=\"/docs/v1.0.0/deployment/netlify\"\n  /\u003e\n  \u003cCard\n    icon=\"arrow-left\"\n    title=\"Descripción General de Implementación\"\n    description=\"Volver a opciones de implementación\"\n    href=\"/docs/v1.0.0/deployment/overview\"\n  /\u003e\n  \u003cCard\n    icon=\"zap\"\n    title=\"Rendimiento\"\n    description=\"Optimizar su documentación\"\n    href=\"/docs/v1.0.0/performance\"\n  /\u003e\n\u003c/CardGrid\u003e\n"])</script><script>self.__next_f.push([1,"28:T23c0,"])</script><script>self.__next_f.push([1,"\n# Implementar en Vercel\n\nVercel es la forma más fácil de implementar su documentación Specra. Está construido por los creadores de Next.js, por lo que tod   )\n}\n```\n\n## Integración CI/CD\n\nVercel actúa como su tubería CI/CD:\n\n**Qué se ejecuta en cada implementación:**\n- `npm install` (dependencias)\n- `npm run build` (compilación Next.js)\n- Comprobaciones y validaciones automáticas\n- Implementar en la red perimetral\n\n### Integración GitHub\n\nVercel comenta en las solicitudes de extracción con:\n- URL de implementación de vista previa\n- Registros de compilación\n- Información de rendimiento\n\n### Registros de Compilación\n\nVer registros de compilación detallados:\n1. Vaya a Deployments\n2. Haga clic en cualquier implementación\n3. Vea la sección Building para ver los registros\n\n## Solución de Problemas\n\n### La Compilación Falla\n\n**Verificar Versión de Node:**\nAsegúrese de estar usando Node 18+. Agregue a `package.json`:\n\n```json\n{\n  \"engines\": {\n    \"node\": \"\u003e=18.0.0\"\n  }\n}\n```\n\n**Borrar caché de compilación:**\n1. Vaya a Settings → General\n2. Desplácese a Build \u0026 Development Settings\n3. Clear build cache (Borrar caché de compilación)\n\n### Las Variables de Entorno No Funcionan\n\n- Verifique los nombres de las variables (distinguen mayúsculas de minúsculas)\n- Prefije las variables del lado del cliente con `NEXT_PUBLIC_`\n- Vuelva a implementar después de cambiar las variables\n\n### El Dominio Personalizado No Funciona\n\n- Verifique que los registros DNS sean correctos\n- Espere la propagación de DNS (verifique con `dig` o `nslookup`)\n- Asegúrese de que CNAME apunte a `cname.vercel-dns.com`\n- Verifique el estado de verificación del dominio en el panel de Vercel\n\n## Implementación de Monorepo\n\nSi sus documentos están en un monorepo:\n\n1. Establezca Root Directory en la configuración del proyecto\n2. Apunte a su carpeta de documentos (por ejemplo, `apps/docs`)\n3. Vercel compila solo ese directorio\n\n```json\n{\n  \"buildCommand\": \"cd ../.. \u0026\u0026 npm run build:docs\",\n  \"outputDirectory\": \".next\"\n}\n```\n\n## Mejores Prácticas\n\n**Usar implementaciones de vista previa** - Probar cambios antes de fusionar a main\n\n**Habilitar protección de rama** - Requerir éxito de implementación de vista previa antes de fusionar\n\n**Configurar notificaciones** - Obtener alertas de Slack/correo electrónico para el estado de implementación\n\n**Monitorear análisis** - Rastrear vistas de página y rendimiento\n\n**Usar configuración perimetral** - Almacenar indicadores de características y configuración en el perímetro para actualizaciones instantáneas\n\n## Precios\n\nEl nivel gratuito de Vercel incluye:\n- Implementaciones ilimitadas\n- 100GB de ancho de banda/mes\n- HTTPS automático\n- Implementaciones de vista previa\n- Análisis (básico)\n\nEsto generalmente es suficiente para sitios de documentación. Actualice a Pro si necesita:\n- Más ancho de banda\n- Análisis avanzado\n- Protección con contraseña\n- Soporte empresarial\n\n## Próximos Pasos\n\n\u003cCardGrid cols={2}\u003e\n  \u003cCard\n    icon=\"github\"\n    title=\"GitHub Pages\"\n    description=\"Implementar como sitio estático en GitHub Pages\"\n    href=\"/docs/v1.0.0/deployment/github-pages\"\n  /\u003e\n  \u003cCard\n    icon=\"globe\"\n    title=\"Netlify\"\n    description=\"Plataforma de alojamiento estático alternativa\"\n    href=\"/docs/v1.0.0/deployment/netlify\"\n  /\u003e\n  \u003cCard\n    icon=\"arrow-left\"\n    title=\"Descripción General de Implementación\"\n    description=\"Volver a opciones de implementación\"\n    href=\"/docs/v1.0.0/deployment/overview\"\n  /\u003e\n  \u003cCard\n    icon=\"zap\"\n    title=\"Rendimiento\"\n    description=\"Optimizar su documentación\"\n    href=\"/docs/v1.0.0/performance\"\n  /\u003e\n\u003c/CardGrid\u003e\n"])</script><script>self.__next_f.push([1,"29:T1779,"])</script><script>self.__next_f.push([1,"\n# Empezando con Specra\n\nEsta guía lo llevará de cero a un sitio de documentación completamente funcional en menos de 5 minutos. Cubriremos la instalación, la configuración básica y la escritura de su primera página.\n\n## Requisitos previos\n\nAntes de comenzar, asegúrese de tener:\n- **Node.js 18 o superior** (verifique con `node --version`)\n- Un gestor de paquetes: **npm** (viene con Node.js), **yarn**, o **pnpm**\n- Un editor de código (se recomienda VS Code para soporte MDX)\n\n## Instalación\n\nLa forma más rápida de comenzar es usar `create-specra`, nuestra herramienta de andamiaje que configura todo por usted.\n\n\u003cSteps\u003e\n  \u003cStep title=\"Cree su proyecto\"\u003e\n    Ejecute el comando de creación con el nombre de su proyecto:\n\n    \u003cTabs defaultValue=\"npm\"\u003e\n      \u003cTab label=\"npm\"\u003e\n```bash\nnpx create-specra@latest my-docs\n```\n      \u003c/Tab\u003e\n      \u003cTab label=\"yarn\"\u003e\n```bash\nyarn create specra my-docs\n```\n      \u003c/Tab\u003e\n      \u003cTab label=\"pnpm\"\u003e\n```bash\npnpm create specra my-docs\n```\n      \u003c/Tab\u003e\n    \u003c/Tabs\u003e\n\n    Esto crea un nuevo directorio llamado `my-docs` con todos los archivos que necesita para comenzar.\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Navegar e instalar\"\u003e\n    Muévase a su nuevo proyecto e instale las dependencias:\n\n    \u003cTabs defaultValue=\"npm\"\u003e\n      \u003cTab label=\"npm\"\u003e\n```bash\ncd my-docs\nnpm install\n```\n      \u003c/Tab\u003e\n      \u003cTab label=\"yarn\"\u003e\n```bash\ncd my-docs\nyarn install\n```\n      \u003c/Tab\u003e\n      \u003cTab label=\"pnpm\"\u003e\n```bash\ncd my-docs\npnpm install\n```\n      \u003c/Tab\u003e\n    \u003c/Tabs\u003e\n\n    La instalación generalmente toma de 30 a 60 segundos dependiendo de su conexión a Internet.\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Inicie el servidor de desarrollo\"\u003e\n    Encienda el servidor de desarrollo:\n\n    \u003cTabs defaultValue=\"npm\"\u003e\n      \u003cTab label=\"npm\"\u003e\n```bash\nnpm run dev\n```\n      \u003c/Tab\u003e\n      \u003cTab label=\"yarn\"\u003e\n```bash\nyarn dev\n```\n      \u003c/Tab\u003e\n      \u003cTab label=\"pnpm\"\u003e\n```bash\npnpm dev\n```\n      \u003c/Tab\u003e\n    \u003c/Tabs\u003e\n\n    Abra [http://localhost:3000](http://localhost:3000) en su navegador. ¡Debería ver su sitio de documentación con contenido de muestra!\n\n    \u003cCallout type=\"success\"\u003e\n    El servidor de desarrollo incluye recarga en caliente. Edite cualquier archivo MDX y vea cómo sus cambios aparecen instantáneamente.\n    \u003c/Callout\u003e\n  \u003c/Step\u003e\n\u003c/Steps\u003e\n\n## Estructura del proyecto\n\nDespués de ejecutar `create-specra`, esto es lo que obtiene:\n\n```txt\nmy-docs/\n├── app/                     # Next.js App Router\n│   ├── layout.tsx           # Diseño raíz con proveedores de Specra\n│   ├── page.tsx             # Página de inicio\n│   └── docs/                # Rutas de documentación\n│       └── [...slug]/       # Ruta dinámica general\n│           └── page.tsx     # Renderizador de páginas de doc\n├── docs/                    # Su contenido de documentación\n│   └── v1.0.0/             # Carpeta de versión\n│       ├── about.mdx\n│       ├── getting-started.mdx\n│       └── guides/         # Agrupación de carpetas\n│           ├── _category_.json\n│           └── writing.mdx\n├── public/                  # Activos estáticos (imágenes, iconos)\n├── specra.config.json      # Configuración de Specra\n├── package.json\n├── next.config.mjs         # Configuración de Next.js\n└── tailwind.config.ts      # Configuración de Tailwind\n```\n\n\u003cCallout type=\"info\"\u003e\n**Importante:** Todos los archivos de documentación deben usar la extensión `.mdx`, no `.md`. MDX le permite usar componentes React junto con Markdown.\n\u003c/Callout\u003e\n\n## Su primera página de documentación\n\nVamos a crear su primera página de documentación personalizada.\n\n\u003cSteps\u003e\n  \u003cStep title=\"Crear un nuevo archivo\"\u003e\n    Dentro de `docs/v1.0.0/`, cree un archivo llamado `hello.mdx`:\n\n```mdx\n---\ntitle: Hola Specra\ndescription: Mi primera página de documentación\nsidebar_position: 3\n---\n\n# ¡Hola Specra!\n\nEsta es mi primera página de documentación. Puedo usar **texto en negrita**,\n*texto en cursiva*, e incluso [enlaces](https://specra.dev).\n\n## Características que amo\n\n- Recarga en caliente rápida\n- Hermosos componentes\n- Estructura de archivos simple\n- Cero configuración necesaria\n```\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Ver su página\"\u003e\n    Guarde el archivo y visite [http://localhost:3000/docs/v1.0.0/hello](http://localhost:3000/docs/v1.0.0/hello)\n\n    Debería ver su nueva página en la barra lateral y renderizada bellamente en el área de contenido principal.\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Agregar un componente\"\u003e\n    Hagámoslo más interesante con un componente Callout:\n\n```mdx\n---\ntitle: Hola Specra\ndescription: Mi primera página de documentación\nsidebar_position: 3\n---\n\n# ¡Hola Specra!\n\nEsta es mi primera página de documentación.\n\n\u003cCallout type=\"success\"\u003e\n  ¡Acabo de agregar un componente interactivo a mi Markdown! No se necesitan importaciones.\n\u003c/Callout\u003e\n\n## Próximos pasos\n\n¿Listo para aprender más? Eche un vistazo a la sección [Componentes](/docs/v1.0.0/components).\n```\n\n    Guarde y observe cómo se actualiza instantáneamente. Note cómo no necesitó importar el componente Callout - está disponible automáticamente en todos sus archivos MDX.\n  \u003c/Step\u003e\n\u003c/Steps\u003e\n\n## Próximos pasos\n\nAhora tiene un sitio Specra funcionando y conoce los conceptos básicos de creación de páginas. Aquí es a dónde ir desde aquí:\n\n\u003cCardGrid cols={2}\u003e\n  \u003cCard icon=\"settings\" title=\"Configure su sitio\" description=\"Personalice la marca, navegación y características\" href=\"/docs/v1.0.0/configuration/overview\" /\u003e\n  \u003cCard icon=\"palette\" title=\"Explore componentes\" description=\"Aprenda sobre todos los componentes de UI disponibles\" href=\"/docs/v1
