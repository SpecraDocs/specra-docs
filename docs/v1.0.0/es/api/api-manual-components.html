ks/39f2b4ef802b0a18.js\",\"/_next/static/chunks/f99a41e049349196.js\",\"/_next/static/chunks/4faefc5fed54611f.js\"],\"Header\"]\n15:T18ee,"])</script><script>self.__next_f.push([1,"\n# ¿Qué es Specra?\n\nSpecra es un marco de documentación moderno que hace que escribir y publicar documentación técnica sea realmente agradable. Construido sobre Next.js, MDX y Tailwind CSS, le ofrece el aspecto y la sensación pulidos de las plataformas de documentación premium como Mintlify, pero usted mismo lo aloja.\n\nSi alguna vez ha luchado con herramientas de documentación torpes o ha pagado demasiado por soluciones alojadas, Specra está aquí para cambiar eso. Escriba sus documentos en Markdown, agregue componentes interactivos cuando los necesite y despliegue donde quiera.\n\n## Por qué construimos Specra\n\nLa documentación no debería ser difícil. Debería poder concentrarse en escribir gran contenido, no luchar con archivos de configuración o pelear contra sus herramientas. Esto es lo que creemos:\n\n**El contenido es lo primero.** Suelte sus archivos MDX en una carpeta, y Specra se encarga del resto. Sin enrutamiento manual, sin configuración de navegación, sin dolores de cabeza de configuración de compilación.\n\n**La experiencia del desarrollador importa.** La recarga en caliente significa que ve los cambios al instante. TypeScript lo mantiene seguro. La biblioteca de componentes está ahí cuando la necesita, invisible cuando no.\n\n**El rendimiento no es negociable.** Páginas pre-renderizadas, almacenamiento en caché en el borde, imágenes optimizadas. Sus documentos cargan rápido, siempre.\n\n**Flexibilidad sobre bloqueo.** Despliegue en Vercel, GitHub Pages, Netlify, o en cualquier lugar que ejecute Node.js o sirva archivos estáticos. Usted es dueño de su contenido y su infraestructura.\n\n## Características clave\n\n\u003cCardGrid cols={2}\u003e\n  \u003cCard icon=\"zap\" title=\"Rápido como el rayo\" description=\"Generación de sitios estáticos con almacenamiento en caché en el borde. Sus documentos cargan en milisegundos, no segundos.\" /\u003e\n  \u003cCard icon=\"search\" title=\"Búsqueda potente\" description=\"La integración de MeiliSearch le ofrece una búsqueda instantánea y tolerante a errores tipográficos que realmente funciona.\" /\u003e\n  \u003cCard icon=\"git-branch\" title=\"Gestión de versiones\" description=\"Envíe múltiples versiones de documentos una al lado de la otra. Perfecto para APIs y bibliotecas con cambios importantes.\" /\u003e\n  \u003cCard icon=\"palette\" title=\"Hermosos temas\" description=\"Modo oscuro listo para usar. Personalice colores, fuentes y estilos para que coincidan con su marca.\" /\u003e\n  \u003cCard icon=\"code\" title=\"Componentes MDX\" description=\"Use Markdown para contenido, componentes React para interactividad. Lo mejor de ambos mundos.\" /\u003e\n  \u003cCard icon=\"layout\" title=\"Navegación inteligente\" description=\"Barra lateral generada automáticamente a partir de su estructura de archivos. Secciones plegables, migas de pan, tabla de contenidos.\" /\u003e\n\u003c/CardGrid\u003e\n\n## La pila tecnológica\n\nConstruimos Specra sobre tecnologías probadas y modernas:\n\n- **Next.js 15+** con App Router para un rendimiento y experiencia de desarrollador óptimos\n- **MDX** para que pueda mezclar Markdown con componentes React\n- **Tailwind CSS** para un estilo que es tanto potente como mantenible\n- **MeiliSearch** para una búsqueda que es rápida y tolerante a errores tipográficos\n- **TypeScript** porque la seguridad de tipos ahorra tiempo y cordura\n\n## Lo que obtiene\n\nCuando usa Specra, obtiene un sistema de documentación completo:\n\n**Componentes de contenido ricos**\nCallouts, pestañas, bloques de código con resaltado de sintaxis, tarjetas, acordeones, pasos, diagramas con Mermaid, ecuaciones matemáticas con KaTeX, y más.\n\n**Navegación automática**\nSu estructura de carpetas se convierte en su barra lateral. Agregue un archivo `_category_.json` para personalizar secciones. Eso es todo.\n\n**Características inteligentes**\nEstimaciones de tiempo de lectura, marcas de tiempo de última actualización, soporte de etiquetas, migas de pan, tabla de contenidos receptiva con seguimiento de desplazamiento.\n\n**Documentación de API**\nGenere hermosas referencias de API a partir de especificaciones OpenAPI, colecciones Postman o el propio formato de Specra. Patio de juegos interactivo incluido.\n\n**Soporte multi-versión**\nMantenga documentos para v1, v2, v3 simultáneamente. El selector de versiones permite a los usuarios saltar entre ellos al instante.\n\n**Búsqueda que funciona**\nBúsqueda de texto completo con atajos de teclado (⌘K o Ctrl+K). Funciona sin conexión con búsqueda local o escala con MeiliSearch.\n\n**Sistema de temas**\nRespeta las preferencias del sistema, admite alternancia manual oscuro/claro, personalizable a través de variables CSS.\n\n**Listo para producción**\nOptimización SEO, accesibilidad integrada, encabezados de seguridad, monitoreo de rendimiento, ejemplos de CI/CD.\n\n## Cómo funciona\n\nSpecra sigue una filosofía simple: usted escribe, nosotros nos encargamos del resto.\n\n\u003cSteps\u003e\n  \u003cStep title=\"Escribir en MDX\"\u003e\n    Cree archivos `.mdx` en su carpeta `docs/`. Use frontmatter para metadatos. Escriba Markdown para contenido. Mezcle componentes React cuando sea necesario.\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Generación automática\"\u003e\n    Specra escanea sus archivos, genera navegación, extrae encabezados para la tabla de contenidos y configura el enrutamiento automáticamente.\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Vista previa instantánea\"\u003e\n    Ejecute el servidor de desarrollo y vea los cambios en vivo mientras escribe. La recarga en caliente lo mantiene en el flujo.\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Desplegar en cualquier lugar\"\u003e\n    Construya para alojamiento Node.js (Vercel, Railway) o exporte como archivos estáticos (GitHub Pages, Netlify, Cloudflare Pages). Una base de código, múltiples objetivos de despliegue.\n  \u003c/Step\u003e\n\u003c/Steps\u003e\n\n## ¿Quién debería usar Specra?\n\nSpecra es perfecto para:\n\n- **Mantenedores de código abierto** que necesitan documentos profesionales sin las tarifas de alojamiento\n- **Startups** que quieren gran documentación sin precios empresariales\n- **Desarrolladores de API** que necesitan documentos versionados y referencias de API interactivas\n- **Escritores técnicos** que prefieren Markdown sobre editores WYSIWYG\n- **Equipos** que quieren que los documentos vivan en el mismo repositorio que su código\n\n## ¿Listo para empezar?\n\nSalte a la guía de [Primeros pasos](/docs/v1.0.0/getting-started) y tenga su primer sitio de documentación funcionando en menos de 5 minutos.\n"])</script><script>self.__next_f.push([1,"16:T18ee,"])</script><script>self.__next_f.push([1,"\n# ¿Qué es Specra?\n\nSpecra es un marco de documentación moderno que hace que escribir y publicar documentación técnica sea realmente agradable. Construido sobre Next.js, MDX y Tailwind CSS, le ofrece el aspecto y la sensación pulidos de las plataformas de documentación premium como Mintlify, pero usted mismo lo aloja.\n\nSi alguna vez ha luchado con herramientas de documentación torpes o ha pagado demasiado por soluciones alojadas, Specra está aquí para cambiar eso. Escriba sus documentos en Markdown, agregue componentes interactivos cuando los necesite y despliegue donde quiera.\n\n## Por qué construimos Specra\n\nLa documentación no debería ser difícil. Debería poder concentrarse en escribir gran contenido, no luchar con archivos de configuración o pelear contra sus herramientas. Esto es lo que creemos:\n\n**El contenido es lo primero.** Suelte sus archivos MDX en una carpeta, y Specra se encarga del resto. Sin enrutamiento manual, sin configuración de navegación, sin dolores de cabeza de configuración de compilación.\n\n**La experiencia del desarrollador importa.** La recarga en cali que pueda mezclar Markdown con componentes React\n- **Tailwind CSS** para un estilo que es tanto potente como mantenible\n- **MeiliSearch** para una búsqueda que es rápida y tolerante a errores tipográficos\n- **TypeScript** porque la seguridad de tipos ahorra tiempo y cordura\n\n## Lo que obtiene\n\nCuando usa Specra, obtiene un sistema de documentación completo:\n\n**Componentes de contenido ricos**\nCallouts, pestañas, bloques de código con resaltado de sintaxis, tarjetas, acordeones, pasos, diagramas con Mermaid, ecuaciones matemáticas con KaTeX, y más.\n\n**Navegación automática**\nSu estructura de carpetas se convierte en su barra lateral. Agregue un archivo `_category_.json` para personalizar secciones. Eso es todo.\n\n**Características inteligentes**\nEstimaciones de tiempo de lectura, marcas de tiempo de última actualización, soporte de etiquetas, migas de pan, tabla de contenidos receptiva con seguimiento de desplazamiento.\n\n**Documentación de API**\nGenere hermosas referencias de API a partir de especificaciones OpenAPI, colecciones Postman o el propio formato de Specra. Patio de juegos interactivo incluido.\n\n**Soporte multi-versión**\nMantenga documentos para v1, v2, v3 simultáneamente. El selector de versiones permite a los usuarios saltar entre ellos al instante.\n\n**Búsqueda que funciona**\nBúsqueda de texto completo con atajos de teclado (⌘K o Ctrl+K). Funciona sin conexión con búsqueda local o escala con MeiliSearch.\n\n**Sistema de temas**\nRespeta las preferencias del sistema, admite alternancia manual oscuro/claro, personalizable a través de variables CSS.\n\n**Listo para producción**\nOptimización SEO, accesibilidad integrada, encabezados de seguridad, monitoreo de rendimiento, ejemplos de CI/CD.\n\n## Cómo funciona\n\nSpecra sigue una filosofía simple: usted escribe, nosotros nos encargamos del resto.\n\n\u003cSteps\u003e\n  \u003cStep title=\"Escribir en MDX\"\u003e\n    Cree archivos `.mdx` en su carpeta `docs/`. Use frontmatter para metadatos. Escriba Markdown para contenido. Mezcle componentes React cuando sea necesario.\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Generación automática\"\u003e\n    Specra escanea sus archivos, genera navegación, extrae encabezados para la tabla de contenidos y configura el enrutamiento automáticamente.\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Vista previa instantánea\"\u003e\n    Ejecute el servidor de desarrollo y vea los cambios en vivo mientras escribe. La recarga en caliente lo mantiene en el flujo.\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Desplegar en cualquier lugar\"\u003e\n    Construya para alojamiento Node.js (Vercel, Railway) o exporte como archivos estáticos (GitHub Pages, Netlify, Cloudflare Pages). Una base de código, múltiples objetivos de despliegue.\n  \u003c/Step\u003e\n\u003c/Steps\u003e\n\n## ¿Quién debería usar Specra?\n\nSpecra es perfecto para:\n\n- **Mantenedores de código abierto** que necesitan documentos profesionales sin las tarifas de alojamiento\n- **Startups** que quieren gran documentación sin precios empresariales\n- **Desarrolladores de API** que necesitan documentos versionados y referencias de API interactivas\n- **Escritores técnicos** que prefieren Markdown sobre editores WYSIWYG\n- **Equipos** que quieren que los documentos vivan en el mismo repositorio que su código\n\n## ¿Listo para empezar?\n\nSalte a la guía de [Primeros pasos](/docs/v1.0.0/getting-started) y tenga su primer sitio de documentación funcionando en menos de 5 minutos.\n"])</script><script>self.__next_f.push([1,"17:T22b6,"])</script><script>self.__next_f.push([1,"\nSpecra proporciona un sistema potente pero flexible para documentar APIs REST. Ya sea que tenga 5 puntos finales o 500, lo tenemos cubierto.\n\n## Dos enfoques\n\n### 1. Documentación generada automáticamente\n\nPerfecto para APIs grandes o cuando ya tiene especificaciones.\n\n\u003cdiv className=\"grid grid-cols-1 md:grid-cols-3 gap-4 not-prose my-6\"\u003e\n  \u003cdiv className=\"border border-border rounded-lg p-4\"\u003e\n    \u003cdiv className=\"text-2xl mb-2\"\u003e📋\u003c/div\u003e\n    \u003ch4 className=\"font-semibold mb-1\"\u003eFormato Specra\u003c/h4\u003e\n    \u003cp className=\"text-sm text-muted-foreground\"\u003eFormato JSON simple\u003c/p\u003e\n  \u003c/div\u003e\n  \u003cdiv className=\"border border-border rounded-lg p-4\"\u003e\n    \u003cdiv className=\"text-2xl mb-2\"\u003e🔧\u003c/div\u003e\n    \u003ch4 className=\"font-semibold mb-1\"\u003eOpenAPI 3.x\u003c/h4\u003e\n    \u003cp className=\"text-sm text-muted-foreground\"\u003eEstándar de la industria\u003c/p\u003e\n  \u003c/div\u003e\n  \u003cdiv className=\"border border-border rounded-lg p-4\"\u003e\n    \u003cdiv className=\"text-2xl mb-2\"\u003e📮\u003c/div\u003e\n    \u003ch4 className=\"font-semibold mb-1\"\u003ePostman v2.x\u003c/h4\u003e\n    \u003cp className=\"text-sm text-muted-foreground\"\u003eExportar desde Postman\u003c/p\u003e\n  \u003c/div\u003e\n\u003c/div\u003e\n\nSimplemente cree o exporte su archivo de especificación y referéncielo:\n\n```mdx\n\u003cApiReference spec=\"/api-specs/my-api.json\" /\u003e\n```\n\nEl sistema **detecta automáticamente** el formato y genera una documentación hermosa e interactiva.\n\n**Ejemplos:**\n- [Formato Specra (JSONPlaceholder) →](/docs/v1.0.0/api-test)\n- [Formato OpenAPI 3.0 →](/docs/v1.0.0/api-openapi)\n- [Colección Postman →](/docs/v1.0.0/api-postman)\n\n[Aprender más sobre formatos →](/docs/v1.0.0/api-formats)\n\n---\n\n### 2. Componentes MDX manuales\n\nPerfecto para APIs pequeñas o cuando necesita diseños personalizados.\n\nUse componentes individuales para crear su documentación:\n\n```mdx\n\u003cApiEndpoint\n  method=\"GET\"\n  path=\"/api/users/:id\"\n  summary=\"Obtener usuario por ID\"\n\u003e\n  \u003cApiParams params={[...]} /\u003e\n  \u003cApiResponse status={200} example={{...}} /\u003e\n  \u003cApiPlayground method=\"GET\" path=\"/api/users/123\" /\u003e\n\u003c/ApiEndpoint\u003e\n```\n\n**Ejemplo:**\n- [Ejemplo de componente manual →](/docs/v1.0.0/api-example)\n\n---\n\n## Inicio rápido\n\n### Generado automáticamente (Recomendado)\n\n1. **Cree su archivo de especificación** (Specra, OpenAPI o Postman)\n2. **Colóquelo en** `/public/api-specs/my-api.json`\n3. **Añada a su MDX**:\n\n```mdx\n---\ntitle: Referencia de API\n---\n\n# Mi Documentación de API\n\n\u003cApiReference spec=\"/api-specs/my-api.json\" /\u003e\n```\n\n¡Eso es todo! Ahora tiene:\n- ✅ Documentación de punto final generada automáticamente\n- ✅ Playground de API interactivo\n- ✅ Interfaz de usuario de acordeón plegable\n- ✅ Ejemplos con resaltado de sintaxis\n- ✅ Esquemas de solicitud/respuesta\n\n### Componentes manuales\n\n1. **Cree un archivo MDX** en `docs/`\n2. **Use componentes de API**:\n\n```mdx\n---\ntitle: Referencia de API\n---\n\n# Mi API\n\n\u003cApiEndpoint method=\"GET\" path=\"/users\" summary=\"Listar usuarios\"\u003e\n  \u003cApiParams\n    title=\"Parámetros de consulta\"\n    params={[\n      { name: \"page\", type: \"number\", description: \"Número de página\" }\n    ]}\n  /\u003e\n\n  \u003cApiResponse\n    status={200}\n    description=\"Éxito\"\n    example={[{ id: 1, name: \"John\" }]}\n  /\u003e\n\n  \u003cApiPlayground\n    method=\"GET\"\n    path=\"/users\"\n    baseUrl=\"https://api.example.com\"\n  /\u003e\n\u003c/ApiEndpoint\u003e\n```\n\n## Componentes disponibles\n\n### `\u003cApiReference\u003e`\n\nGenerar documentos automáticamente desde archivos de especificación.\n\n```tsx\n\u003cApiReference\n  spec=\"/api-specs/my-api.json\"  // Ruta al archivo de especificación\n  parser=\"auto\"                   // auto | specra | openapi | postman\n  showPlayground={true}           // Mostrar playground interactivo\n/\u003e\n```\n\n### `\u003cApiEndpoint\u003e`\n\nDocumentar un solo punto final (estilo acordeón).\n\n```tsx\n\u003cApiEndpoint\n  method=\"GET\"              // GET | POST | PUT | PATCH | DELETE\n  path=\"/api/users/:id\"     // Ruta de API\n  summary=\"Obtener usuario por ID\"  // Descripción corta\n  defaultOpen={false}       // ¿Empezar expandido?\n\u003e\n  {/* Componentes hijos */}\n\u003c/ApiEndpoint\u003e\n```\n\n### `\u003cApiParams\u003e`\n\nMostrar parámetros (ruta, consulta, cuerpo).\n\n```tsx\n\u003cApiParams\n  title=\"Parámetros de ruta\"\n  params={[\n    {\n      name: \"id\",\n      type: \"string\",\n      required: true,\n      description: \"ID de usuario\",\n      example: \"user_123\"\n    }\n  ]}\n/\u003e\n```\n\n### `\u003cApiResponse\u003e`\n\nMostrar ejemplos de respuesta.\n\n```tsx\n\u003cApiResponse\n  status={200}\n  description=\"Usuario encontrado\"\n  example={{\n    id: \"user_123\",\n    name: \"John Doe\",\n    email: \"john@example.com\"\n  }}\n/\u003e\n```\n\n### `\u003cApiPlayground\u003e`\n\nPruebas de API interactivas.\n\n```tsx\n\u003cApiPlayground\n  method=\"GET\"\n  path=\"/users/:id\"\n  baseUrl=\"https://api.example.com\"\n  headers={{ \"Authorization\": \"Bearer ...\" }}\n  pathParams={[\n    { name: \"id\", type: \"string\", example: \"user_123\" }\n  ]}\n  defaultBody='{\"key\": \"value\"}'\n/\u003e\n```\n\n## Características\n\n### Playground interactivo\n\nCada punto final incluye un área de juegos integrada donde los usuarios pueden:\n- ✅ Editar parámetros de ruta\n- ✅ Modificar encabezados de solicitud\n- ✅ Actualizar cuerpo de solicitud\n- ✅ Enviar solicitudes de API reales\n- ✅ Ver respuestas formateadas\n\n### Interfaz de usuario de acordeón\n\nLos puntos finales son plegables por defecto, lo que facilita:\n- Explorar muchos puntos finales rápidamente\n- Expandir solo lo que necesita\n- Mantener la página limpia y organizada\n\n### Resaltado de sintaxis\n\nTodos los ejemplos de código incluyen:\n- Resaltado de sintaxis JSON\n- Números de línea\n- Botón de copia\n- Soporte de modo oscuro\n\n### Autenticación\n\nDocumente sus requisitos de autenticación:\n- Tokens Bearer\n- Claves de API\n- Autenticación básica\n- Encabezados personalizados\n\n## Soporte de formato\n\n| Formato | Versión | Caso de uso |\n|--------|---------|-------------|\n| **Specra** | 1.0 | Formato simple y personalizado para cualquier API |\n| **OpenAPI** | 3.x, Swagger 2.0 | Estándar de la industria, generación de código |\n| **Postman** | Colección v2.x | Usuarios de Postman, exportación rápida |\n\n[Comparar formatos →](/docs/v1.0.0/api-formats)\n\n## Ejemplos\n\n### API completa (Generada automáticamente)\n\nUsando JSONPlaceholder como un ejemplo de trabajo real:\n\n[Ver ejemplo en vivo →](/docs/v1.0.0/api-test)\n\n### Especificación OpenAPI\n\nDocumentación de API de grado empresarial:\n\n[Ver ejemplo OpenAPI →](/docs/v1.0.0/api-openapi)\n\n### Colección Postman\n\nExportado directamente desde Postman:\n\n[Ver ejemplo Postman →](/docs/v1.0.0/api-postman)\n\n### Componentes manuales\n\nHecho a mano para necesidades personalizadas:\n\n[Ver ejemplo manual →](/docs/v1.0.0/api-example)\n\n## Mejores prácticas\n\n### 1. Elija el enfoque correcto\n\n**Use generado automáticamente** cuando:\n- Tenga \u003e 10 puntos finales\n- Ya tenga un archivo de especificación\n- Quiera consistencia\n- Necesite generación de código\n\n**Use componentes manuales** cuando:\n- Tenga \u003c 10 puntos finales\n- Necesite diseños personalizados\n- Quiera control total\n- Esté documentando gradualmente\n\n### 2. Proporcione ejemplos\n\nIncluya siempre ejemplos realistas:\n- Cuerpos de solicitud con datos reales\n- Ejemplos de respuesta que coincidan con la realidad\n- Casos extremos y errores\n- Ejemplos de autenticación\n\n### 3. Manténgalo actualizado\n\n**Para documentos generados automáticamente:**\n- Regenere especificaciones cuando cambie el código\n- Re-exporte colecciones de Postman regularmente\n- Versione sus archivos de especificación\n\n**Para documentos manuales:**\n- Revise cuando cambie la API\n- Pruebe el playground regularmente\n- Actualice los ejemplos\n\n### 4. Organizar por característica\n\nAgrupe puntos finales relacionados:\n\n```mdx\n## Gestión de usuarios\n\n\u003cApiReference spec=\"/api-specs/users.json\" /\u003e\n\n## Catálogo de productos\n\n\u003cApiReference spec=\"/api-specs/products.json\" /\u003e\n\n## Pedidos\n\n\u003cApiReference spec=\"/api-specs/orders.json\" /\u003e\n```\n\n### 5. Añadir contexto\n\nMejore con texto explicativo:\n\n```mdx\n## Autenticación\n\nTodos los puntos finales requieren un token JWT válido.\n\n\u003cCallout type=\"info\"\u003e\nObtenga su clave de API desde el [panel de desarrollador](https://example.com/dashboard).\n\u003c/Callout\u003e\n\n\u003cApiReference spec=\"/api-specs/my-api.json\" /\u003e\n```\n\n## Próximos pasos\n\n¿Listo para documentar su API?\n\n1. **Elija su formato** - [Comparar formatos →](/docs/v1.0.0/api-formats)\n2. **Ver ejemplos** - [Ver ejemplos →](/docs/v1.0.0/api-test)\n3. **Empezar a construir** - Cree su primer archivo de especificación\n4. **Ir a vivo** - Despliegue su documentación\n\n\u003cCallout type=\"success\" title=\"Victoria rápida\"\u003e\n¿Tiene una colección de Postman? ¡Expórtela y habrá terminado en 2 minutos!\n\u003c/Callout\u003e\n\n## Recursos\n\n- [Guía de formatos soportados](/docs/v1.0.0/api-formats)\n- [Ejemplo de formato Specra](/docs/v1.0.0/api-test)\n- [Ejemplo OpenAPI](/docs/v1.0.0/api-openapi)\n- [Ejemplo Postman](/docs/v1.0.0/api-postman)\n- [Ejemplo de componentes manuales](/docs/v1.0.0/api-example)\n- [Documentos técnicos del analizador](/API_PARSERS.md)\n"])</script><script>self.__next_f.push([1,"18:T22b6,"])</script><script>self.__next_f.push([1,"\nSpecra proporciona un sistema potente pero flexible para documentar APIs REST. Ya sea que tenga 5 puntos finales o 500, lo tenemos cubierto.\n\n## Dos enfoques\n\n### 1. Documentación generada automáticamente\n\nPerfecto para APIs grandes o cuando ya tiene especificaciones.\n\n\u003cdiv className=\"grid grid-cols-1 md:grid-cols-3 gap-4 not-prose my-6\"\u003e\n  \u003cdiv className=\"border border-border rounded-lg p-4\"\u003e\n    \u003cdiv className=\"text-2xl mb-2\"\u003e📋\u003c/div\u003e\n    \u003ch4 className=\"font-semibold mb-1\"\u003eFormato Specra\u003c/h4\u003e\n    \u003cp className=\"text-sm text-muted-foreground\"\u003eFormato JSON simple\u003c/p\u003e\n  \u003c/div\u003e\n  \u003cdiv className=\"border border-border rounded-lg p-4\"\u003e\n    \u003cdiv className=\"text-2xl mb-2\"\u003e🔧\u003c/div\u003e\n    \u003ch4 className=\"font-semibold mb-1\"\u003eOpenAPI 3.x\u003c/h4\u003e\n    \u003cp className=\"text-sm text-muted-foreground\"\u003eEstándar de la industria\u003c/p\u003e\n  \u003c/div\u003e\n  \u003cdiv className=\"border border-border rounded-lg p-4\"\u003e\n    \u003cdiv className=\"text-2xl mb-2\"\u003e📮\u003c/div\u003e\n    \u003ch4 className=\"font-semibold mb-1\"\u003ePostman v2.x\u003c/h4\u003e\n    \u003cp className=\"text-sm text-muted-foreground\"\u003eExportar desde Postman\u003c/p\u003e\n  \u003c/div\u003e\n\u003c/div\u003e\n\nSimplemente cree o exporte su archivo de especificación y referéncielo:\n\n```mdx\n\u003cApiReference spec=\"/api-specs/my-api.json\" /\u003e\n```\n\nEl sistema **detecta automáticamente** el formato y genera una documentación hermosa e interactiva.\n\n**Ejemplos:**\n- [Formato Specra (JSONPlaceholder) →](/docs/v1.0.0/api-test)\n- [Formato OpenAPI 3.0 →](/docs/v1.0.0/api-openapi)\n- [Colección Postman →](/docs/v1.0.0/api-postman)\n\n[Aprender más sobre formatos →](/docs/v1.0.0/api-formats)\n\n---\n\n### 2. Componentes MDX manuales\n\nPerfecto para APIs pequeñas o cuando necesita diseños personalizados.\n\nUse componentes individuales para crear su documentación:\n\n```mdx\n\u003cApiEndpoint\n  method=\"GET\"\n  path=\"/api/users/:id\"\n  summary=\"Obtener usuario por ID\"\n\u003e\n  \u003cApiParams params={[...]} /\u003e\n  \u003cApiResponse status={200} example={{...}} /\u003e\n  \u003cApiPlayground method=\"GET\" path=\"/api/users/123\" /\u003e\n\u003c/ApiEndpoint\u003e\n```\n\n**Ejemplo:**\n- [Ejemplo de componente manual →](/docs/v1.0.0/api-example)\n\n---\n\n## Inicio rápido\n\n### Generado automáticamente (Recomendado)\n\n1. **Cree su archivo de especificación** (Specra, OpenAPI o Postman)\n2. **Colóquelo en** `/public/api-specs/my-api.json`\n3. **Añada a su MDX**:\n\n```mdx\n---\ntitle: Referencia de API\n---\n\n# Mi Documentación de API\n\n\u003cApiReference spec=\"/api-specs/my-api.json\" /\u003e\n```\n\n¡Eso es todo! Ahora tiene:\n- ✅ Documentación de punto final generada automáticamente\n- ✅ Playground de API interactivo\n- ✅ Interfaz de usuario de acordeón plegable\n- ✅ Ejemplos con resaltado de sintaxis\n- ✅ Esquemas de solicitud/respuesta\n\n### Componentes manuales\n\n1. **Cree un archivo MDX** en `docs/`\n2. **Use componentes de API**:\n\n```mdx\n---\ntitle: Referencia de API\n---\n\n# Mi API\n\n\u003cApiEndpoint method=\"GET\" path=\"/users\" summary=\"Listar usuarios\"\u003e\n  \u003cApiParams\n    title=\"Parámetros de consulta\"\n    params={[\n      { name: \"page\", type: \"number\", description: \"Número de página\" }\n    ]}\n  /\u003e\n\n  \u003cApiResponse\n    status={200}\n    description=\"Éxito\"\n    example={[{ id: 1, name: \"John\" }]}\n  /\u003e\n\n  \u003cApiPlayground\n    method=\"GET\"\n    path=\"/users\"\n    baseUrl=\"https://api.example.com\"\n  /\u003e\n\u003c/ApiEndpoint\u003e\n```\n\n## Componentes disponibles\n\n### `\u003cApiReference\u003e`\n\nGenerar documentos automáticamente desde archivos de especificación.\n\n```tsx\n\u003cApiReference\n  spec=\"/api-specs/my-api.json\"  // Ruta al archivo de especificación\n  parser=\"auto\"                   // auto | specra | openapi | postman\n  showPlayground={true}           // Mostrar playground interactivo\n/\u003e\n```\n\n### `\u003cApiEndpoint\u003e`\n\nDocumentar un solo punto final (estilo acordeón).\n\n```tsx\n\u003cApiEndpoint\n  method=\"GET\"              // GET | POST | PUT | PATCH | DELETE\n  path=\"/api/users/:id\"     // Ruta de API\n  summary=\"Obtener usuario por ID\"  // Descripción corta\n  defaultOpen={false}       // ¿Empezar expandido?\n\u003e\n  {/* Componentes hijos */}\n\u003c/ApiEndpoint\u003e\n```\n\n### `\u003cApiParams\u003e`\n\nMostrar parámetros (ruta, consulta, cuerpo).\n\n```tsx\n\u003cApiParams\n  title=\"Parámetros de ruta\"\n  params={[\n    {\n      name: \"id\",\n      type: \"string\",\n      required: true,\n      description: \"ID de usuario\",\n      example: \"user_123\"\n    }\n  ]}\n/\u003e\n```\n\n### `\u003cApiResponse\u003e`\n\nMostrar ejemplos de respuesta.\n\n```tsx\n\u003cApiResponse\n  status={200}\n  description=\"Usuario encontrado\"\n  example={{\n    id: \"user_123\",\n    name: \"John Doe\",\n    email: \"john@example.com\"\n  }}\n/\u003e\n```\n\n### `\u003cApiPlayground\u003e`\n\nPruebas de API interactivas.\n\n```tsx\n\u003cApiPlayground\n  method=\"GET\"\n  path=\"/users/:id\"\n  baseUrl=\"https://api.example.com\"\n  headers={{ \"Authorization\": \"Bearer ...\" }}\n  pathParams={[\n    { name: \"id\", type: \"string\", example: \"user_123\" }\n  ]}\n  defaultBody='{\"key\": \"value\"}'\n/\u003e\n```\n\n## Características\n\n### Playground interactivo\n\nCada punto final incluye un área de juegos integrada donde los usuarios pueden:\n- ✅ Editar parámetros de ruta\n- ✅ Modificar encabezados de solicitud\n- ✅ Actualizar cuerpo de solicitud\n- ✅ Enviar solicitudes de API reales\n- ✅ Ver respuestas formateadas\n\n### Interfaz de usuario de acordeón\n\nLos puntos finales son plegables por defecto, lo que facilita:\n- Explorar muchos puntos finales rápidamente\n- Expandir solo lo que necesita\n- Mantener la página limpia y organizada\n\n### Resaltado de sintaxis\n\nTodos los ejemplos de código incluyen:\n- Resaltado de sintaxis JSON\n- Números de línea\n- Botón de copia\n- Soporte de modo oscuro\n\n### Autenticación\n\nDocumente sus requisitos de autenticación:\n- Tokens Bearer\n- Claves de API\n- Autenticación básica\n- Encabezados personalizados\n\n## Soporte de formato\n\n| Formato | Versión | Caso de uso |\n|--------|---------|-------------|\n| **Specra** | 1.0 | Formato simple y personalizado para cualquier API |\n| **OpenAPI** | 3.x, Swagger 2.0 | Estándar de la industria, generación de código |\n| **Postman** | Colección v2.x | Usuarios de Postman, exportación rápida |\n\n[Comparar formatos →](/docs/v1.0.0/api-formats)\n\n## Ejemplos\n\n### API completa (Generada automáticamente)\n\nUsando JSONPlaceholder como un ejemplo de trabajo real:\n\n[Ver ejemplo en vivo →](/docs/v1.0.0/api-test)\n\n### Especificación OpenAPI\n\nDocumentación de API de grado empresarial:\n\n[Ver ejemplo OpenAPI →](/docs/v1.0.0/api-openapi)\n\n### Colección Postman\n\nExportado directamente desde Postman:\n\n[Ver ejemplo Postman →](/docs/v1.0.0/api-postman)\n\n### Componentes manuales\n\nHecho a mano para necesidades personalizadas:\n\n[Ver ejemplo manual →](/docs/v1.0.0/api-example)\n\n## Mejores prácticas\n\n### 1. Elija el enfoque correcto\n\n**Use generado automáticamente** cuando:\n- Tenga \u003e 10 puntos finales\n- Ya tenga un archivo de especificación\n- Quiera consistencia\n- Necesite generación de código\n\n**Use componentes manuales** cuando:\n- Tenga \u003c 10 puntos finales\n- Necesite diseños personalizados\n- Quiera control total\n- Esté documentando gradualmente\n\n### 2. Proporcione ejemplos\n\nIncluya siempre ejemplos realistas:\n- Cuerpos de solicitud con datos reales\n- Ejemplos de respuesta que coincidan con la realidad\n- Casos extremos y errores\n- Ejemplos de autenticación\n\n### 3. Manténgalo actualizado\n\n**Para documentos generados automáticamente:**\n- Regenere especificaciones cuando cambie el código\n- Re-exporte colecciones de Postman regularmente\n- Versione sus archivos de especificación\n\n**Para documentos manuales:**\n- Revise cuando cambie la API\n- Pruebe el playground regularmente\n- Actualice los ejemplos\n\n### 4. Organizar por característica\n\nAgrupe puntos finales relacionados:\n\n```mdx\n## Gestión de usuarios\n\n\u003cApiReference spec=\"/api-specs/users.json\" /\u003e\n\n## Catálogo de productos\n\n\u003cApiReference spec=\"/api-specs/products.json\" /\u003e\n\n## Pedidos\n\n\u003cApiReference spec=\"/api-specs/orders.json\" /\u003e\n```\n\n### 5. Añadir contexto\n\nMejore con texto explicativo:\n\n```mdx\n## Autenticación\n\nTodos los puntos finales requieren un token JWT válido.\n\n\u003cCallout type=\"info\"\u003e\nObtenga su clave de API desde el [panel de desarrollador](https://example.com/dashboard).\n\u003c/Callout\u003e\n\n\u003cApiReference spec=\"/api-specs/my-api.json\" /\u003e\n```\n\n## Próximos pasos\n\n¿Listo para documentar su API?\n\n1. **Elija su formato** - [Comparar formatos →](/docs/v1.0.0/api-formats)\n2. **Ver ejemplos** - [Ver ejemplos →](/docs/v1.0.0/api-test)\n3. **Empezar a construir** - Cree su primer archivo de especificación\n4. **Ir a vivo** - Despliegue su documentación\n\n\u003cCallout type=\"success\" title=\"Victoria rápida\"\u003e\n¿Tiene una colección de Postman? ¡Expórtela y habrá terminado en 2 minutos!\n\u003c/Callout\u003e\n\n## Recursos\n\n- [Guía de formatos soportados](/docs/v1.0.0/api-formats)\n- [Ejemplo de formato Specra](/docs/v1.0.0/api-test)\n- [Ejemplo OpenAPI](/docs/v1.0.0/api-openapi)\n- [Ejemplo Postman](/docs/v1.0.0/api-postman)\n- [Ejemplo de componentes manuales](/docs/v1.0.0/api-example)\n- [Documentos técnicos del analizador](/API_PARSERS.md)\n"])</script><script>self.__next_f.push([1,"19:T8a9,"])</script><script>self.__next_f.push([1,"\nEl componente Acordeón crea secciones de contenido plegables, perfecto para preguntas frecuentes, menús expandibles u organizar grandes cantidades de contenido.\n\n## Uso\n\n```mdx\n\u003cAccordion\u003e\n  \u003cAccordionItem title=\"Primera pregunta\" defaultOpen\u003e\n    Este contenido es visible por defecto debido a `defaultOpen`.\n  \u003c/AccordionItem\u003e\n  \n  \u003cAccordionItem title=\"Segunda pregunta\"\u003e\n    Este contenido está colapsado por defecto.\n  \u003c/AccordionItem\u003e\n\u003c/Accordion\u003e\n```\n\n## Ejemplo en vivo\n\n\u003cAccordion\u003e\n  \u003cAccordionItem title=\"¿Qué es un acordeón?\" defaultOpen\u003e\n    Un acordeón es un patrón de interfaz de usuario que permite a los usuarios expandir y colapsar secciones de contenido. Es útil para organizar información en un formato compacto y escaneable.\n  \u003c/AccordionItem\u003e\n  \n  \u003cAccordionItem title=\"¿Cuándo debo usar acordeones?\"\u003e\n    Use acordeones cuando tenga múltiples secciones de contenido que los usuarios puedan querer explorar sin desplazarse por todo. Los casos de uso comunes incluyen preguntas frecuentes, listas de características y opciones de configuración.\n  \u003c/AccordionItem\u003e\n  \n  \u003cAccordionItem title=\"¿Puedo tener varios elementos abiertos?\"\u003e\n    ¡Sí! Por defecto, el Acordeón permite que varios elementos estén abiertos simultáneamente. Cada AccordionItem funciona de forma independiente.\n  \u003c/AccordionItem\u003e\n\u003c/Accordion\u003e\n\n## Props\n\n### Accordion\n\n| Propiedad | Tipo | Predeterminado | Descripción |\n|-----------|------|----------------|-------------|\n| `children` | `ReactNode` | requerido | Componentes AccordionItem para renderizar |\n| `type` | `\"single\" \\| \"multiple\"` | `\"multiple\"` | Si uno o varios elementos pueden estar abiertos |\n\n### AccordionItem\n\n| Propiedad | Tipo | Predeterminado | Descripción |\n|-----------|------|----------------|-------------|\n| `title` | `string` | requerido | El texto del encabezado en el que se puede hacer clic |\n| `children` | `ReactNode` | requerido | Contenido mostrado cuando se expande |\n| `defaultOpen` | `boolean` | `false` | Si el elemento comienza expandido |\n\n## Consejos\n\n\u003cCallout type=\"tip\"\u003e\nUse la propiedad `defaultOpen` en el primer AccordionItem para dar a los usuarios una vista previa del formato del contenido.\n\u003c/Callout\u003e\n"])</script><script>self.__next_f.push([1,"1a:T8a9,"])</script><script>self.__next_f.push([1,"\nEl componente Acordeón crea secciones de contenido plegables, perfecto para preguntas frecuentes, menús expandibles u organizar grandes cantidades de contenido.\n\n## Uso\n\n```mdx\n\u003cAccordion\u003e\n  \u003cAccordionItem title=\"Primera pregunta\" defaultOpen\u003e\n    Este contenido es visible por defecto debido a `defaultOpen`.\n  \u003c/AccordionItem\u003e\n  \n  \u003cAccordionItem title=\"Segunda pregunta\"\u003e\n    Este contenido está colapsado por defecto.\n  \u003c/AccordionItem\u003e\n\u003c/Accordion\u003e\n```\n\n## Ejemplo en vivo\n\n\u003cAccordion\u003e\n  \u003cAccordionItem title=\"¿Qué es un acordeón?\" defaultOpen\u003e\n    Un acordeón es un patrón de interfaz de usuario que permite a los usuarios expandir y colapsar secciones de contenido. Es útil para organizar información en un formato compacto y escaneable.\n  \u003c/AccordionItem\u003e\n  \n  \u003cAccordionItem title=\"¿Cuándo debo usar acordeones?\"\u003e\n    Use acordeones cuando tenga múltiples secciones de contenido que los usuarios puedan querer explorar sin desplazarse por todo. Los casos de uso comunes incluyen preguntas frecuentes, listas de características y opciones de configuración.\n  \u003c/AccordionItem\u003e\n  \n  \u003cAccordionItem title=\"¿Puedo tener varios elementos abiertos?\"\u003e\n    ¡Sí! Por defecto, el Acordeón permite que varios elementos estén abiertos simultáneamente. Cada AccordionItem funciona de forma independiente.\n  \u003c/AccordionItem\u003e\n\u003c/Accordion\u003e\n\n## Props\n\n### Accordion\n\n| Propiedad | Tipo | Predeterminado | Descripción |\n|-----------|------|----------------|-------------|\n| `children` | `ReactNode` | requerido | Componentes AccordionItem para renderizar |\n| `type` | `\"single\" \\| \"multiple\"` | `\"multiple\"` | Si uno o varios elementos pueden estar abiertos |\n\n### AccordionItem\n\n| Propiedad | Tipo | Predeterminado | Descripción |\n|-----------|------|----------------|-------------|\n| `title` | `string` | requerido | El texto del encabezado en el que se puede hacer clic |\n| `children` | `ReactNode` | requerido | Contenido mostrado cuando se expande |\n| `defaultOpen` | `boolean` | `false` | Si el elemento comienza expandido |\n\n## Consejos\n\n\u003cCallout type=\"tip\"\u003e\nUse la propiedad `defaultOpen` en el primer AccordionItem para dar a los usuarios una vista previa del formato del contenido.\n\u003c/Callout\u003e\n"])</script><script>self.__next_f.push([1,"1b:T1e95,"])</script><script>self.__next_f.push([1,"\n# Descripción General de la Configuración\n\nSpecra utiliza un único archivo de configuración, `specra.config.json`, ubicado en la raíz de su proyecto. Este archivo controla todo, desde los metadatos del sitio hasta la navegación, los temas y la configuración de implementación.\n\n## Inicio Rápido\n\nAquí hay una configuración mínima para comenzar:\n\n```json\n{\n  \"site\": {\n    \"title\": \"Mi Documentación\",\n    \"description\": \"Documentación para mi proyecto\",\n    \"url\": \"https://docs.ejemplo.com\"\n  }\n}\n```\n\n¡Eso es todo! Specra completa los valores predeterminados sensatos para todo lo demás.\n\n## Estructura de Configuración\n\nEl archivo de configuración está organizado en secciones lógicas:\n\n\u003cCardGrid cols={2}\u003e\n  \u003cCard\n    icon=\"globe\"\n    title=\"Configuración del Sitio\"\n    description=\"Metadatos básicos del sitio, marca y URL\"\n    href=\"/docs/v1.0.0/configuration/site-config\"\n  /\u003e\n  \u003cCard\n    icon=\"layout\"\n    title=\"Navegación\"\n    description=\"Barra lateral, migas de pan, tabla de contenido y grupos de pestañas\"\n    href=\"/docs/v1.0.0/configuration/navigation\"\n  /\u003e\n  \u003cCard\n    icon=\"rocket\"\n    title=\"Implementación\"\n    description=\"Configuraciones de implementación específicas de la plataforma\"\n    href=\"/docs/v1.0.0/configuration/deployment-config\"\n  /\u003e\n  \u003cCard\n    icon=\"sliders\"\n    title=\"Opciones Avanzadas\"\n    description=\"Análisis, búsqueda, características y variables de entorno\"\n    href=\"/docs/v1.0.0/configuration/advanced\"\n  /\u003e\n\u003c/CardGrid\u003e\n\n## Ejemplo Completo\n\nAquí hay una configuración completa que muestra todas las opciones disponibles:\n\n```json\n{\n  \"$schema\": \"./node_modules/specra/config/specra.config.schema.json\",\n  \"site\": {\n    \"title\": \"Mis Docs\",\n    \"description\": \"Documentación completa\",\n    \"url\": \"https://docs.ejemplo.com\",\n    \"baseUrl\": \"/\",\n    \"language\": \"es\",\n    \"organizationName\": \"Mi Empresa\",\n    \"projectName\": \"mi-proyecto\",\n    \"activeVersion\": \"v1.0.0\",\n    \"logo\": \"/logo.svg\",\n    \"favicon\": \"/favicon.ico\",\n    \"hideTitle\": false,\n    \"hideLogo\": false\n  },\n  \"theme\": {\n    \"defaultMode\": \"system\",\n    \"respectPrefersColorScheme\": true,\n    \"primaryColor\": \"#3b82f6\",\n    \"customCss\": \"/custom.css\"\n  },\n  \"navigation\": {\n    \"showSidebar\": true,\n    \"collapsibleSidebar\": true,\n    \"showBreadcrumbs\": true,\n    \"showTableOfContents\": true,\n    \"tocPosition\": \"right\",\n    \"tocMaxDepth\": 3,\n    \"tabGroups\": [\n      {\n        \"id\": \"guides\",\n        \"label\": \"Guías\",\n        \"icon\": \"book-open\"\n      },\n      {\n        \"id\": \"api\",\n        \"label\": \"Referencia API\",\n        \"icon\": \"zap\"\n      }\n    ]\n  },\n  \"social\": {\n    \"github\": \"https://github.com/username/repo\",\n    \"twitter\": \"https://twitter.com/username\",\n    \"discord\": \"https://discord.gg/invite\",\n    \"linkedin\": \"https://linkedin.com/company/name\",\n    \"youtube\": \"https://youtube.com/@channel\",\n    \"custom\": [\n      {\n        \"label\": \"Sitio web\",\n        \"url\": \"https://example.com\",\n        \"icon\": \"globe\"\n      }\n    ]\n  },\n  \"search\": {\n    \"enabled\": true,\n    \"placeholder\": \"Buscar documentación...\",\n    \"provider\": \"meilisearch\",\n    \"meilisearch\": {\n      \"host\": \"https://search.example.com\",\n      \"apiKey\": \"search-key\",\n      \"indexName\": \"docs\"\n    }\n  },\n  \"analytics\": {\n    \"googleAnalytics\": \"G-XXXXXXXXXX\",\n    \"googleTagManager\": \"GTM-XXXXXXX\",\n    \"plausible\": \"docs.example.com\"\n  },\n  \"footer\": {\n    \"copyright\": \"© 2024 Mi Empresa. Todos los derechos reservados.\",\n    \"customContent\": \"\u003cp\u003eHTML personalizado aquí\u003c/p\u003e\",\n    \"links\": [\n      {\n        \"title\": \"Producto\",\n        \"items\": [\n          { \"label\": \"Características\", \"href\": \"/features\" },\n          { \"label\": \"Precios\", \"href\": \"/pricing\" }\n        ]\n      }\n    ]\n  },\n  \"banner\": {\n    \"enabled\": true,\n    \"message\": \"📢 ¡La versión 2.0 llegará pronto!\",\n    \"type\": \"info\",\n    \"dismissible\": true\n  },\n  \"features\": {\n    \"editUrl\": \"https://github.com/username/repo/edit/main/docs\",\n    \"showLastUpdated\": true,\n    \"showReadingTime\": true,\n    \"showAuthors\": false,\n    \"showTags\": true,\n    \"versioning\": true,\n    \"i18n\": false\n  },\n  \"env\": {\n    \"API_BASE_URL\": \"https://api.example.com\",\n    \"API_VERSION\": \"v1\",\n    \"CDN_URL\": \"https://cdn.example.com\"\n  },\n  \"deployment\": {\n    \"target\": \"vercel\",\n    \"basePath\": \"\",\n    \"customDomain\": false\n  }\n}\n```\n\n## Soporte TypeScript\n\nPara proyectos TypeScript, puede usar archivos de configuración `.ts` o `.mts`:\n\n```typescript\n// specra.config.ts\nimport type { SpecraConfig } from 'specra'\n\nconst config: SpecraConfig = {\n  site: {\n    title: 'Mi Documentación',\n    description: 'Construido con Specra',\n  },\n  // ... resto de la config\n}\n\nexport default config\n```\n\n## Autocompletado IDE\n\nEl archivo de configuración incluye una propiedad `$schema` que habilita el autocompletado en VS Code y otros editores:\n\n```json\n{\n  \"$schema\": \"./node_modules/specra/config/specra.config.schema.json\",\n  \"site\": {\n    // ¡El autocompletado funciona aquí!\n  }\n}\n```\n\nCuando escribe, su editor sugerirá las opciones disponibles y mostrará descripciones.\n\n## Variables de Entorno\n\nPuede usar variables de entorno en su configuración:\n\n```json\n{\n  \"search\": {\n    \"meilisearch\": {\n      \"host\": \"${MEILISEARCH_HOST}\",\n      \"apiKey\": \"${MEILISEARCH_API_KEY}\"\n    }\n  }\n}\n```\n\nLuego establézcalas:\n\n```bash\n# .env.local\nMEILISEARCH_HOST=https://search.example.com\nMEILISEARCH_API_KEY=your-key\n```\n\n\u003cCallout type=\"warning\"\u003e\nNunca confirme claves API confidenciales en el control de versiones. Use variables de entorno en su lugar.\n\u003c/Callout\u003e\n\n## Validación de Configuración\n\nSpecra valida su configuración al inicio y muestra errores útiles si algo está mal:\n\n```\n❌ Error de configuración en specra.config.json:\n   - site.url debe ser una URL válida\n   - navigation.tocMaxDepth debe estar entre 1 y 6\n```\n\nCorrija los errores y reinicie su servidor de desarrollo.\n\n## Valores Predeterminados\n\nSi omite campos opcionales, Specra usa estos valores predeterminados:\n\n| Campo | Valor Predeterminado |\n|-------|----------------------|\n| `site.baseUrl` | `\"/\"` |\n| `site.language` | `\"en\"` |\n| `theme.defaultMode` | `\"system\"` |\n| `theme.respectPrefersColorScheme` | `true` |\n| `navigation.showSidebar` | `true` |\n| `navigation.collapsibleSidebar` | `true` |\n| `navigation.showBreadcrumbs` | `true` |\n| `navigation.showTableOfContents` | `true` |\n| `navigation.tocPosition` | `\"right\"` |\n| `navigation.tocMaxDepth` | `3` |\n| `search.enabled` | `false` |\n| `features.showLastUpdated` | `true` |\n| `features.showReadingTime` | `true` |\n| `features.versioning` | `true` |\n| `deployment.target` | `\"vercel\"` |\n\n## Múltiples Entornos\n\nCree configuraciones específicas del entorno:\n\n```txt\n├── specra.config.json          # Config base\n├── specra.config.development.json\n├── specra.config.staging.json\n└── specra.config.production.json\n```\n\nCargue la correcta según `NODE_ENV`:\n\n```javascript\n// Cargar config según el entorno\nconst config = require(`./specra.config.${process.env.NODE_ENV}.json`)\n```\n\n## Próximos Pasos\n\nSumérjase en secciones de configuración específicas:\n\n\u003cCardGrid cols={2}\u003e\n  \u003cCard\n    icon=\"globe\"\n    title=\"Configuración del Sitio\"\n    description=\"Configurar metadatos del sitio y marca\"\n    href=\"/docs/v1.0.0/configuration/site-config\"\n  /\u003e\n  \u003cCard\n    icon=\"layout\"\n    title=\"Navegación\"\n    description=\"Configurar navegación y grupos de pestañas\"\n    href=\"/docs/v1.0.0/configuration/navigation\"\n  /\u003e\n  \u003cCard\n    icon=\"rocket\"\n    title=\"Implementación\"\n    description=\"Configurar ajustes de implementación\"\n    href=\"/docs/v1.0.0/configuration/deployment-config\"\n  /\u003e\n  \u003cCard\n    icon=\"sliders\"\n    title=\"Avanzado\"\n    description=\"Análisis, búsqueda y más\"\n    href=\"/docs/v1.0.0/configuration/advanced\"\n  /\u003e\n\u003c/CardGrid\u003e\n"])</script><script>self.__next_f.push([1,"1c:T1e95,"])</script><script>self.__next_f.push([1,"\n# Descripción General de la Configuración\n\nSpecra utiliza un único archivo de configuración, `specra.config.json`, ubicado en la raíz de su proyecto. Este archivo controla todo, desde los metadatos del sitio hasta la navegación, los temas y la configuración de implementación.\n\n## Inicio Rápido\n\nAquí hay una configuración mínima para comenzar:\n\n```json\n{\n  \"site\": {\n    \"title\": \"Mi Documentación\",\n    \"description\": \"Documentación para mi proyecto\",\n    \"url\": \"https://docs.ejemplo.com\"\n  }\n}\n```\n\n¡Eso es todo! Specra completa los valores predeterminados sensatos para todo lo demás.\n\n## Estructura de Configuración\n\nEl archivo de configuración está organizado en secciones lógicas:\n\n\u003cCardGrid cols={2}\u003e\n  \u003cCard\n    icon=\"globe\"\n    title=\"Configuración del Sitio\"\n    descript ra del proyecto, dependencias, configuración y contenido de muestra.\n\n## Inicio rápido\n\nLa forma más rápida de crear un nuevo sitio de documentación:\n\n\u003cTabs defaultValue=\"npm\"\u003e\n  \u003cTab label=\"npm\"\u003e\n```bash\nnpx create-specra@latest my-docs\n```\n  \u003c/Tab\u003e\n  \u003cTab label=\"yarn\"\u003e\n```bash\nyarn create specra my-docs\n```\n  \u003c/Tab\u003e\n  \u003cTab label=\"pnpm\"\u003e\n```bash\npnpm create specra my-docs\n```\n  \u003c/Tab\u003e\n\u003c/Tabs\u003e\n\nEsto crea un nuevo directorio llamado `my-docs` con todo configurado y listo para usar.\n\n## Qué se crea\n\nCuando ejecuta `create-specra`, esto es lo que obtiene:\n\n```txt\nmy-docs/\n├── app/\n│   ├── layout.tsx              # Diseño raíz con configuración de Specra\n│   ├── page.tsx                # Página de inicio\n│   ├── globals.css             # Estilos globales\n│   └── docs/\n│       └── [...slug]/\n│           └── page.tsx        # Renderizador de páginas de documentación\n├── docs/\n│   └── v1.0.0/\n│       ├── about.mdx           # Página de ejemplo acerca de\n│       ├── getting-started.mdx # Guía de inicio de ejemplo\n│       └── components/         # Ejemplos de componentes\n├── public/\n│   ├── icon-light-32x32.png   # Favicon (modo claro)\n│   └── icon-dark-32x32.png    # Favicon (modo oscuro)\n├── specra.config.json          # Configuración de Specra\n├── package.json                # Dependencias y scripts\n├── next.config.mjs             # Configuración de Next.js\n├── tailwind.config.ts          # Config de Tailwind CSS\n├── tsconfig.json               # Config de TypeScript\n├── .gitignore\n└── README.md\n```\n\n## Configuración interactiva\n\nCuando ejecuta `create-specra`, puede pedirle:\n\n**Nombre del proyecto** (si no se proporciona como argumento)\n```bash\nnpx create-specra@latest\n# Pregunta: What is your project named?\n```\n\n**Preferencia de gestor de paquetes** (si se detectan múltiples)\n```bash\n# Preguntará: Which package manager do you want to use?\n# Opciones: npm, yarn, pnpm\n```\n\nLa CLI detecta lo que está disponible en su sistema y sugiere la mejor opción.\n\n## Opciones de comando\n\n### Uso básico\n\n```bash\nnpx create-specra@latest [project-name] [options]\n```\n\n### Ejemplos\n\n**Crear con un nombre específico:**\n```bash\nnpx create-specra@latest my-awesome-docs\n```\n\n**Crear en el directorio actual:**\n```bash\nnpx create-specra@latest .\n```\n\n**Usar un gestor de paquetes específico:**\n```bash\nnpx create-specra@latest my-docs --use-npm\nnpx create-specra@latest my-docs --use-yarn\nnpx create-specra@latest my-docs --use-pnpm\n```\n\n## Qué sucede después\n\nDespués de completar el andamiaje, siga estos pasos:\n\n\u003cSteps\u003e\n  \u003cStep title=\"Navegue a su proyecto\"\u003e\n```bash\ncd my-docs\n```\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Instalar dependencias\"\u003e\n    La CLI no instala dependencias automáticamente. Ejecute:\n\n\u003cTabs defaultValue=\"npm\"\u003e\n  \u003cTab label=\"npm\"\u003e\n```bash\nnpm install\n```\n  \u003c/Tab\u003e\n  \u003cTab label=\"yarn\"\u003e\n```bash\nyarn install\n```\n  \u003c/Tab\u003e\n  \u003cTab label=\"pnpm\"\u003e\n```bash\npnpm install\n```\n  \u003c/Tab\u003e\n\u003c/Tabs\u003e\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Inicie el servidor de desarrollo\"\u003e\n\u003cTabs defaultValue=\"npm\"\u003e\n  \u003cTab label=\"npm\"\u003e\n```bash\nnpm run dev\n```\n  \u003c/Tab\u003e\n  \u003cTab label=\"yarn\"\u003e\n```bash\nyarn dev\n```\n  \u003c/Tab\u003e\n  \u003cTab label=\"pnpm\"\u003e\n```bash\npnpm dev\n```\n  \u003c/Tab\u003e\n\u003c/Tabs\u003e\n\n    Abra [http://localhost:3000](http://localhost:3000) para ver su sitio.\n  \u003c/Step\u003e\n\u003c/Steps\u003e\n\n## Configuración predeterminada\n\nEl `specra.config.json` generado incluye valores predeterminados sensatos:\n\n```json\n{\n  \"site\": {\n    \"title\": \"My Documentation\",\n    \"description\": \"Documentation site built with Specra\",\n h\nyarn upgrade specra@latest\n```\n  \u003c/Tab\u003e\n  \u003cTab label=\"pnpm\"\u003e\n```bash\npnpm update specra@latest\n```\n  \u003c/Tab\u003e\n\u003c/Tabs\u003e\n\n\u003cCallout type=\"info\"\u003e\nConsulte el [registro de cambios](https://github.com/yourusername/specra/releases) para ver cambios importantes antes de actualizar versiones mayores.\n\u003c/Callout\u003e\n\n## Solución de problemas\n\n### Comando no encontrado\n\nSi obtiene errores de \"command not found\":\n\n**Verifique la versión de Node.js:**\n```bash\nnode --version\n# Debería ser 18.0.0 o superior\n```\n\n**Intente con la ruta completa de npx:**\n```bash\nnpx create-specra@latest my-docs\n```\n\n### Errores de permiso\n\nEn Linux/macOS, es posible que necesite ajustar los permisos de npm:\n\n```bash\nsudo chown -R $USER ~/.npm\n```\n\nO use un administrador de versiones de nodo como [nvm](https://github.com/nvm-sh/nvm).\n\n### La instalación falla\n\nSi la instalación de dependencias falla:\n\n1. Elimine `node_modules` y el archivo de bloqueo\n2. Limpie la caché del gestor de paquetes\n3. Intente de nuevo\n\n```bash\nrm -rf node_modules package-lock.json\nnpm cache clean --force\nnpm install\n```\n\n## Próximos pasos\n\nAhora que tiene un sitio Specra configurado:\n\n\u003cCardGrid cols={2}\u003e\n  \u003cCard\n    icon=\"book\"\n    title=\"Escriba su primera página\"\n    description=\"Aprenda cómo crear y organizar documentación\"\n    href=\"/docs/v1.0.0/getting-started\"\n  /\u003e\n  \u003cCard\n    icon=\"settings\"\n    title=\"Configure su sitio\"\n    description=\"Personalice la marca, navegación y características\"\n    href=\"/docs/v1.0.0/configuration/overview\"\n  /\u003e\n  \u003cCard\n    icon=\"palette\"\n    title=\"Explore componentes\"\n    description=\"Descubra todos los componentes MDX disponibles\"\n    href=\"/docs/v1.0.0/components\"\n  /\u003e\n  \u003cCard\n    icon=\"rocket\"\n    title=\"Desplegar a producción\"\n    description=\"Envíe sus documentos a Ver sticas\"\n    href=\"/docs/v1.0.0/configuration/overview\"\n  /\u003e\n  \u003cCard\n    icon=\"palette\"\n    title=\"Explore componentes\"\n    description=\"Descubra todos los componentes MDX disponibles\"\n    href=\"/docs/v1.0.0/components\"\n  /\u003e\n  \u003cCard\n    icon=\"rocket\"\n    title=\"Desplegar a producción\"\n    description=\"Envíe sus documentos a Vercel, GitHub Pages o Netlify\"\n    href=\"/docs/v1.0.0/deployment/overview\"\n  /\u003e\n\u003c/CardGrid\u003e\n"])</script><script>self.__next_f.push([1,"1f:T2f36,"])</script><script>self.__next_f.push([1,"\n# Descripción General de Implementación\n\nSpecra está construido sobre Next.js, lo que significa que puede implementarlo en casi cualquier lugar. Esta guía cubre las opciones de implementación más populares y cómo configurar Specra para cada una.\n\n## Objetivos de Implementación\n\nSpecra admite dos modos de implementación:\n\n**Modo Independiente** (Alojamiento Node.js)\n- Vercel, Railway, Render, Fly.io, AWS, Google Cloud\n- Características dinámicas del lado del servidor\n- Mejor rendimiento con almacenamiento en caché perimetral\n- Configuración predeterminada\n\n**Exportación Estática** (Alojamiento estático)\n- GitHub Pages, Netlify, Cloudflare Pages\n- HTML/CSS/JS pre-renderizado\n- No se requiere servidor\n- Ideal para documentos de código abierto\n\n## Implementación Rápida\n\n### Vercel (Recomendado)\n\nLa opción de implementación más fácil. Un clic y está en vivo:\n\n\u003cSteps\u003e\n  \u003cStep title=\"Enviar a GitHub\"\u003e\n    Envíe su proyecto a un repositorio de GitHub:\n\n```bash\ngit init\ngit add .\ngit commit -m \"Commit inicial\"\ngit remote add origin https://github.com/username/repo.git\ngit push -u origin main\n```\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Implementar en Vercel\"\u003e\n    Visite [vercel.com/new](https://vercel.com/new) e importe su repositorio.\n\n    Vercel detecta automáticamente Next.js y usa la configuración correcta:\n    - Comando de compilación: `npm run build`\n    - Directorio de salida: `.next`\n    - Comando de instalación: `npm install`\n  \u003c/Step\u003e\n\n  \u003cStep title=\"¡Listo!\"\u003e\n    Su sitio se implementa en menos de un minuto. Vercel le da una URL como `su-proyecto.vercel.app`.\n\n    Cada envío de git a main activa una nueva implementación automáticamente.\n  \u003c/Step\u003e\n\u003c/Steps\u003e\n\n\u003cCallout type=\"success\"\u003e\n  ¡No se necesita configuración! La configuración predeterminada de Specra funciona perfectamente con Vercel.\n\u003c/Callout\u003e\n\n### GitHub Pages\n\nPerfecto para documentación de código abierto:\n\n\u003cSteps\u003e\n  \u003cStep title=\"Configurar para Exportación Estática\"\u003e\n    Actualice `specra.config.json`:\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"github-pages\",\n    \"basePath\": \"su-nombre-repo\",\n    \"customDomain\": false\n  }\n}\n```\n\nReemplace `su-nombre-repo` con el nombre real de su repositorio.\n\n\u003cCallout type=\"info\"\u003e\n  Si usa un dominio personalizado (como `docs.susitio.com`), establezca `customDomain: true` y deje `basePath` vacío.\n\u003c/Callout\u003e\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Construir Sitio Estático\"\u003e\n```bash\nnpm run build:export\n```\n\nEsto crea un directorio `out/` con su sitio estático.\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Implementar con GitHub Actions\"\u003e\n    Cree `.github/workflows/deploy.yml`:\n\n```yaml\nname: Deploy to GitHub Pages\n\non:\n  push:\n    branches: [main]\n\npermissions:\n  contents: read\n  pages: write\n  id-token: write\n\njobs:\n  build:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n\n      - name: Setup Node.js\n        uses: actions/setup-node@v4\n        with:\n          node-version: '20'\n          cache: 'npm'\n\n      - name: Install dependencies\n        run: npm ci\n\n      - name: Build site\n        run: npm run build:export\n\n      - name: Upload artifact\n        uses: actions/upload-pages-artifact@v3\n        with:\n          path: ./out\n\n  deploy:\n    needs: build\n    runs-on: ubuntu-latest\n    environment:\n      name: github-pages\n      url: ${{ steps.deployment.outputs.page_url }}\n    steps:\n      - name: Deploy to GitHub Pages\n        id: deployment\n        uses: actions/deploy-pages@v4\n```\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Habilitar GitHub Pages\"\u003e\n    1. Vaya a la configuración de su repositorio\n    2. Navegue a **Pages**\n    3. Fuente: **GitHub Actions**\n    4. Guardar\n\n    Sus documentos estarán en vivo en `https://username.github.io/su-nombre-repo`\n  \u003c/Step\u003e\n\u003c/Steps\u003e\n\n### Netlify\n\nOtra gran opción de alojamiento estático:\n\n\u003cSteps\u003e\n  \u003cStep title=\"Configurar\"\u003e\n```json\n{\n  \"deployment\": {\n    \"target\": \"static\"\n  }\n}\n```\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Crear netlify.toml\"\u003e\n```toml\n[build]\n  command = \"npm run build:export\"\n  publish = \"out\"\n\n[[redirects]]\n  from = \"/*\"\n  to = \"/index.html\"\n  status = 200\n```\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Implementar\"\u003e\n    Conecte su repositorio en [netlify.com](https://netlify.com) o use la CLI:\n\n```bash\nnpm install -g netlify-cli\nnetlify deploy --prod\n```\n  \u003c/Step\u003e\n\u003c/Steps\u003e\n\n## Comandos de Compilación\n\nDiferentes plataformas necesitan diferentes comandos de compilación:\n\n| Plataforma | Comando de Compilación | Directorio de Salida |\n|------------|------------------------|----------------------|\n| Vercel, Railway | `npm run build` | `.next` |\n| GitHub Pages | `npm run build:export` | `out` |\n| Netlify, Cloudflare Pages | `npm run build:export` | `out` |\n| Docker, VPS | `npm run build` + `npm start` | `.next` |\n\n## Configuración por Plataforma\n\n### Vercel\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"vercel\"\n  }\n}\n```\n\n**Variables de entorno** (opcional):\n- Ninguna requerida para la configuración básica\n- Agregue claves de búsqueda/análisis en el panel de Vercel\n\n### GitHub Pages (Sin Dominio Personalizado)\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"github-pages\",\n    \"basePath\": \"nombre-repo\"\n  }\n}\n```\n\n**¿Por qué basePath?** GitHub Pages sirve desde `username.github.io/nombre-repo`, por lo que todos los activos necesitan el prefijo `/nombre-repo`.\n\n### GitHub Pages (Con Dominio Personalizado)\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"custom-domain-static\",\n    \"customDomain\": true\n  }\n}\n```\n\nAgregue un archivo `CNAME` a `public/`:\n\n```\ndocs.susitio.com\n```\n\n### Netlify / Cloudflare Pages\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"static\"\n  }\n}\n```\n\nNo se necesita basePath: sirven desde la raíz.\n\n## Tuberías CI/CD\n\n### GitHub Actions (Avanzado)\n\nEjemplo completo con almacenamiento en caché e indexación de MeiliSearch:\n\n```yaml\nname: Build and Deploy\n\non:\n  push:\n    branches: [main]\n  pull_request:\n    branches: [main]\n\njobs:\n  build:\n    runs-on: ubuntu-latest\n\n    steps:\n      - uses: actions/checkout@v4\n\n      - name: Setup Node.js\n        uses: actions/setup-node@v4\n        with:\n          node-version: '20'\n          cache: 'npm'\n\n      - name: Cache dependencies\n        uses: actions/cache@v4\n        with:\n          path: ~/.npm\n          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}\n          restore-keys: |\n            ${{ runner.os }}-node-\n\n      - name: Install dependencies\n        run: npm ci\n\n      - name: Run linter\n        run: npm run lint\n\n      - name: Build site\n        run: npm run build:export\n        env:\n          NODE_ENV: production\n\n      - name: Index search content\n        if: github.ref == 'refs/heads/main'\n        run: npm run index:search\n        env:\n          MEILISEARCH_HOST: ${{ secrets.MEILISEARCH_HOST }}\n          MEILISEARCH_API_KEY: ${{ secrets.MEILISEARCH_MASTER_KEY }}\n\n      - name: Upload artifact\n        uses: actions/upload-pages-artifact@v3\n        with:\n          path: ./out\n\n  deploy:\n    if: github.ref == 'refs/heads/main'\n    needs: build\n    runs-on: ubuntu-latest\n    environment:\n      name: github-pages\n      url: ${{ steps.deployment.outputs.page_url }}\n    permissions:\n      pages: write\n      id-token: write\n    steps:\n      - name: Deploy to GitHub Pages\n        id: deployment\n        uses: actions/deploy-pages@v4\n```\n\n### GitLab CI/CD\n\n```yaml\n# .gitlab-ci.yml\nimage: node:20\n\ncache:\n  paths:\n    - node_modules/\n\nstages:\n  - build\n  - deploy\n\nbuild:\n  stage: build\n  script:\n    - npm ci\n    - npm run build:export\n  artifacts:\n    paths:\n      - out/\n  only:\n    - main\n\npages:\n  stage: deploy\n  dependencies:\n    - build\n  script:\n    - mkdir -p public\n    - cp -r out/* public/\n  artifacts:\n    paths:\n      - public\n  only:\n    - main\n```\n\n### Docker\n\nCree un `Dockerfile`:\n\n```dockerfile\nFROM node:20-alpine AS builder\n\nWORKDIR /app\n\nCOPY package*.json ./\nRUN npm ci\n\nCOPY . .\nRUN npm run build\n\nFROM node:20-alpine AS runner\n\nWORKDIR /app\n\nENV NODE_ENV=production\n\nCOPY --from=builder /app/public ./public\nCOPY --from=builder /app/.next/standalone ./\nCOPY --from=builder /app/.next/static ./.next/static\n\nEXPOSE 3000\n\nCMD [\"node\", \"server.js\"]\n```\n\nConstruir y ejecutar:\n\n```bash\ndocker build -t my-docs .\ndocker run -p 3000:3000 my-docs\n```\n\n## Variables de Entorno\n\nEstablezca estas en su plataforma de implementación:\n\n**Búsqueda (si usa MeiliSearch):**\n```bash\nMEILISEARCH_HOST=https://search.example.com\nMEILISEARCH_API_KEY=su-clave-de-busqueda\n```\n\n**Análisis (opcional):**\n```bash\nNEXT_PUBLIC_GA_ID=G-XXXXXXXXXX\nNEXT_PUBLIC_PLAUSIBLE_DOMAIN=docs.example.com\n```\n\n**Variables env personalizadas:**\nAcceda a ellas en sus documentos a través de frontmatter o MDX:\n\n```json\n{\n  \"env\": {\n    \"API_BASE_URL\": \"${API_URL}\"\n  }\n}\n```\n\n## Dominios Personalizados\n\n### Vercel\n\n1. Vaya a la configuración de su proyecto\n2. Navegue a Dominios\n3. Agregue su dominio personalizado\n4. Actualice los registros DNS como se muestra\n\n### GitHub Pages\n\n1. Agregue el archivo `CNAME` a `public/`:\n```\ndocs.susitio.com\n```\n\n2. Actualice `specra.config.json`:\n```json\n{\n  \"deployment\": {\n    \"customDomain\": true\n  }\n}\n```\n\n3. Configure DNS:\n```\nTipo: CNAME\nNombre: docs\nValor: username.github.io\n```\n\n### Netlify\n\n1. Vaya a la configuración de Dominio\n2. Agregue dominio personalizado\n3. Siga las instrucciones DNS\n\n## Optimización de Rendimiento\n\n### Habilitar Almacenamiento en Caché\n\nAgregue encabezados de caché en `next.config.mjs`:\n\n```javascript\nasync headers() {\n  return [\n    {\n      source: '/docs/:path*',\n      headers: [\n        {\n          key: 'Cache-Control',\n          value: 'public, max-age=3600, must-revalidate',\n        },\n      ],\n    },\n  ]\n}\n```\n\n### Optimización de Imágenes\n\nUse el componente Image de Next.js:\n\n```mdx\n\u003cImage\n  src=\"/images/diagram.png\"\n  alt=\"Diagrama de arquitectura\"\n  width={800}\n  height={600}\n/\u003e\n```\n\n### Análisis de Paquetes\n\nVerifique el tamaño del paquete:\n\n```bash\nnpm install --save-dev @next/bundle-analyzer\n```\n\n```javascript\n// next.config.mjs\nimport bundleAnalyzer from '@next/bundle-analyzer'\n\nconst withBundleAnalyzer = bundleAnalyzer({\n  enabled: process.env.ANALYZE === 'true',\n})\n\nexport default withBundleAnalyzer(nextConfig)\n```\n\nEjecutar con:\n```bash\nANALYZE=true npm run build\n```\n\n## Solución de Problemas\n\n### 404 al Actualizar la Página (Exportación Estática)\n\nAgregue redirecciones/reescrituras en la configuración de la plataforma:\n\n**Netlify:**\n```toml\n[[redirects]]\n  from = \"/*\"\n  to = \"/index.html\"\n  status = 200\n```\n\n**Vercel (vercel.json):**\n```json\n{\n  \"rewrites\": [\n    { \"source\": \"/(.*)\", \"destination\": \"/index.html\" }\n  ]\n}\n```\n\n### Los Activos No Se Cargan (GitHub Pages)\n\nVerifique que su `basePath` coincida exactamente con el nombre de su repositorio:\n\n```json\n{\n  \"deployment\": {\n    \"basePath\": \"nombre-repo-exacto\"\n  }\n}\n```\n\n### La Compilación Falla\n\nCorrecciones comunes:\n\n1. Borre las carpetas `.next` y `out`:\n```bash\nrm -rf .next out node_modules\nnpm install\nnpm run build\n```\n\n2. Verifique la versión de Node.js:\n```bash\nnode --version  # Debería ser 18+\n```\n\n3. Revise los registros de compilación para ver errores específicos\n\n## Guías Específicas de la Plataforma\n\nProfundice en la implementación específica de la plataforma:\n\n\u003cCardGrid cols={3}\u003e\n  \u003cCard\n    icon=\"triangle\"\n    title=\"Vercel\"\n    description=\"Implementar sin configuración\"\n    href=\"/docs/v1.0.0/deployment/vercel\"\n  /\u003e\n  \u003cCard\n    icon=\"github\"\n    title=\"GitHub Pages\"\n    description=\"Alojamiento gratuito para código abierto\"\n    href=\"/docs/v1.0.0/deployment/github-pages\"\n  /\u003e\n  \u003cCard\n    icon=\"globe\"\n    title=\"Netlify\"\n    description=\"Alojamiento estático con funciones perimetrales\"\n    href=\"/docs/v1.0.0/deployment/netlify\"\n  /\u003e\n\u003c/CardGrid\u003e\n\n## Próximos Pasos\n\n\u003cCardGrid cols={2}\u003e\n  \u003cCard\n    icon=\"settings\"\n    title=\"Configuración\"\n    description=\"Ajustar su configuración de implementación\"\n    href=\"/docs/v1.0.0/configuration/deployment-config\"\n  /\u003e\n  \u003cCard\n    icon=\"zap\"\n    title=\"Rendimiento\"\n    description=\"Optimizar sus documentos para velocidad\"\n    href=\"/docs/v1.0.0/performance\"\n  /\u003e\n\u003c/CardGrid\u003e\n"])</script><script>self.__next_f.push([1,"20:T2f36,"])</script><script>self.__next_f.push([1,"\n# Descripción General de Implementación\n\nSpecra está construido sobre Next.js, lo que significa que puede implementarlo en casi cualquier
