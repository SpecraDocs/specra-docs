ultValue=\"Preview\"\u003e\n  \u003cTab label=\"Vista previa\"\u003e\n\u003cCallout type=\"info\"\u003e\n  Proporciona contexto adicional o información útil que mejora la comprensión.\n\u003c/Callout\u003e\n  \u003c/Tab\u003e\n  \u003cTab label=\"Código\"\u003e\n```mdx\n\u003cCallout type=\"info\"\u003e\n  Proporciona contexto adicional o información útil.\n\u003c/Callout\u003e\n```\n  \u003c/Tab\u003e\n\u003c/Tabs\u003e\n\n### Nota (Note)\n\n\u003cTabs defaultValue=\"Preview\"\u003e\n  \u003cTab label=\"Vista previa\"\u003e\n\u003cCallout type=\"note\"\u003e\n  Resalta detalles importantes que el lector debe conocer.\n\u003c/Callout\u003e\n  \u003c/Tab\u003e\n  \u003cTab label=\"Código\"\u003e\n```mdx\n\u003cCallout type=\"note\"\u003e\n  Resalta detalles importantes que el lector debe conocer.\n\u003c/Callout\u003e\n```\n  \u003c/Tab\u003e\n\u003c/Tabs\u003e\n\n### Consejo (Tip)\n\n\u003cTabs defaultValue=\"Preview\"\u003e\n  \u003cTab label=\"Vista previa\"\u003e\n\u003cCallout type=\"tip\"\u003e\n  Ofrece sugerencias para un mejor uso o mejores prácticas.\n\u003c/Callout\u003e\n  \u003c/Tab\u003e\n  \u003cTab label=\"Código\"\u003e\n```mdx\n\u003cCallout type=\"tip\"\u003e\n  Ofrece sugerencias para un mejor uso o mejores prácticas.\n\u003c/Callout\u003e\n```\n  \u003c/Tab\u003e\n\u003c/Tabs\u003e\n\n### Advertencia (Warning)\n\n\u003cTabs defaultValue=\"Preview\"\u003e\n  \u003cTab label=\"Vista previa\"\u003e\n\u003cCallout type=\"warning\"\u003e\n  Alerta a los usuarios sobre posibles problemas o cambios importantes.\n\u003c/Callout\u003e\n  \u003c/Tab\u003e\n  \u003cTab label=\"Código\"\u003e\n```mdx\n\u003cCallout type=\"warning\"\u003e\n  Alerta a los usuarios sobre posibles problemas o cambios importantes.\n\u003c/Callout\u003e\n```\n  \u003c/Tab\u003e\n\u003c/Tabs\u003e\n\n### Éxito (Success)\n\n\u003cTabs defaultValue=\"Preview\"\u003e\n  \u003cTab label=\"Vista previa\"\u003e\n\u003cCallout type=\"success\"\u003e\n  Confirma resultados positivos o acciones completadas con éxito.\n\u003c/Callout\u003e\n  \u003c/Tab\u003e\n  \u003cTab label=\"Código\"\u003e\n```mdx\n\u003cCallout type=\"success\"\u003e\n  Confirma resultados positivos o acciones completadas con éxito.\n\u003c/Callout\u003e\n```\n  \u003c/Tab\u003e\n\u003c/Tabs\u003e\n\n### Error\n\n\u003cTabs defaultValue=\"Preview\"\u003e\n  \u003cTab label=\"Vista previa\"\u003e\n\u003cCallout type=\"error\"\u003e\n  Resalta problemas críticos o cosas que los usuarios deben evitar.\n\u003c/Callout\u003e\n  \u003c/Tab\u003e\n  \u003cTab label=\"Código\"\u003e\n```mdx\n\u003cCallout type=\"error\"\u003e\n  Resalta problemas críticos o cosas que los usuarios deben evitar.\n\u003c/Callout\u003e\n```\n  \u003c/Tab\u003e\n\u003c/Tabs\u003e\n\n### Peligro (Danger)\n\n\u003cTabs defaultValue=\"Preview\"\u003e\n  \u003cTab label=\"Vista previa\"\u003e\n\u003cCallout type=\"danger\"\u003e\n  Advierte sobre acciones potencialmente destructivas o irreversibles.\n\u003c/Callout\u003e\n  \u003c/Tab\u003e\n  \u003cTab label=\"Código\"\u003e\n```mdx\n\u003cCallout type=\"danger\"\u003e\n  Advierte sobre acciones potencialmente destructivas o irreversibles.\n\u003c/Callout\u003e\n```\n  \u003c/Tab\u003e\n\u003c/Tabs\u003e\n\n## Props\n\n| Propiedad | Tipo | Predeterminado | Descripción |\n|-----------|------|----------------|-------------|\n| `type` | `string` | `\"info\"` | Estilo de callout: `info`, `note`, `tip`, `warning`, `success`, `error`, o `danger` |\n| `children` | `ReactNode` | Requerido | El contenido dentro del callout |\n\n## Ejemplos avanzados\n\n### Contenido de varias líneas\n\nLos callouts pueden contener cualquier contenido MDX, incluido texto formateado, listas y código:\n\n\u003cTabs defaultValue=\"Preview\"\u003e\n  \u003cTab label=\"Vista previa\"\u003e\n\u003cCallout type=\"warning\"\u003e\n  **Consideraciones importantes antes de implementar:**\n\n  - Respalde su base de datos\n  - Pruebe primero en el entorno de staging\n  - Notifique a su equipo sobre el tiempo de inactividad\n\n  Ejecute `npm run db:backup` para crear una copia de seguridad.\n\u003c/Callout\u003e\n  \u003c/Tab\u003e\n  \u003cTab label=\"Código\"\u003e\n```mdx\n\u003cCallout type=\"warning\"\u003e\n  **Consideraciones importantes antes de implementar:**\n\n  - Respalde su base de datos\n  - Pruebe primero en el entorno de staging\n  - Notifique a su equipo sobre el tiempo de inactividad\n\n  Ejecute `npm run db:backup` para crear una copia de seguridad.\n\u003c/Callout\u003e\n```\n  \u003c/Tab\u003e\n\u003c/Tabs\u003e\n\n### Componentes anidados\n\nPuede anidar otros componentes dentro de los callouts:\n\n\u003cTabs defaultValue=\"Preview\"\u003e\n  \u003cTab label=\"Vista previa\"\u003e\n\u003cCallout type=\"info\"\u003e\n  **Consejo profesional:** Use bloques de código para mostrar ejemplos\n\n  \u003cTabs defaultValue=\"js\"\u003e\n    \u003cTab label=\"JavaScript\"\u003e\n      console.log(\"¡Hola!\")\n    \u003c/Tab\u003e\n    \u003cTab label=\"Python\"\u003e\n      print(\"¡Hola!\")\n    \u003c/Tab\u003e\n  \u003c/Tabs\u003e\n\u003c/Callout\u003e\n  \u003c/Tab\u003e\n  \u003cTab label=\"Código\"\u003e\n```mdx\n\u003cCallout type=\"info\"\u003e\n  **Consejo profesional:** Use bloques de código para mostrar ejemplos\n\n  \u003cTabs defaultValue=\"js\"\u003e\n    \u003cTab label=\"JavaScript\"\u003e\n      console.log(\"¡Hola!\")\n    \u003c/Tab\u003e\n    \u003cTab label=\"Python\"\u003e\n      print(\"¡Hola!\")\n    \u003c/Tab\u003e\n  \u003c/Tabs\u003e\n\u003c/Callout\u003e\n```\n  \u003c/Tab\u003e\n\u003c/Tabs\u003e\n\n## Alertas estilo GitHub\n\n¿Prefiere la sintaxis Markdown? Specra también admite la sintaxis de alerta estilo GitHub usando blockquotes:\n\n\u003cTabs defaultValue=\"Preview\"\u003e\n  \u003cTab label=\"Vista previa\"\u003e\n\u003e [!NOTE]\n\u003e Esta es una nota usando sintaxis estilo GitHub.\n\n\u003e [!TIP]\n\u003e Este es un consejo usando sintaxis de blockquote.\n\n\u003e [!WARNING]\n\u003e Esta es una alerta de advertencia.\n  \u003c/Tab\u003e\n  \u003cTab label=\"Código\"\u003e\n```markdown\n\u003e [!NOTE]\n\u003e Esta es una nota usando sintaxis estilo GitHub.\n\n\u003e [!TIP]\n\u003e Este es un consejo usando sintaxis de blockquote.\n\n\u003e [!WARNING]\n\u003e Esta es una alerta de advertencia.\n```\n  \u003c/Tab\u003e\n\u003c/Tabs\u003e\n\n**Tipos de alerta admitidos:**\n- `[!NOTE]` - Igual que type=\"note\"\n- `[!TIP]` - Igual que type=\"tip\"\n- `[!IMPORTANT]` - Igual que type=\"warning\"\n- `[!WARNING]` - Igual que type=\"warning\"\n- `[!CAUTION]` - Igual que type=\"danger\"\n\n## Cuándo usar cada tipo\n\n**Info** - Contexto adicional que mejora la comprensión\n- \"También puede lograr esto usando la CLI\"\n- \"Esta característica está disponible en v2.0 y posteriores\"\n\n**Note** - Información importante que no debe omitirse\n- \"Esta configuración afecta a todos los usuarios de su organización\"\n- \"Los cambios surten efecto después del reinicio del servidor\"\n\n**Tip** - Mejores prácticas y sugerencias útiles\n- \"Para un mejor rendimiento, habilite el almacenamiento en caché\"\n- \"Use TypeScript para un mejor autocompletado\"\n\n**Warning** - Problemas potenciales o cambios importantes\n- \"Esto modificará el esquema de su base de datos\"\n- \"Obsoleto en v3.0, use newMethod() en su lugar\"\n\n**Success** - Confirmaciones positivas\n- \"¡Configuración completa! Su sitio está listo\"\n- \"Todas las pruebas pasaron con éxito\"\n\n**Error** - Problemas críticos a evitar\n- \"No exponga su clave API en el código del cliente\"\n- \"Esta operación no se puede deshacer\"\n\n**Danger** - Acciones destructivas o irreversibles\n- \"Esto eliminará permanentemente todos los datos\"\n- \"Continuar revocará todos los tokens de acceso\"\n\n## Accesibilidad\n\nLos callouts son semánticos y accesibles:\n\n- Utiliza roles ARIA apropiados\n- Amigable para lectores de pantalla\n- Navegable por teclado\n- Cumple con contraste de color (WCAG AA)\n- Los iconos son decorativos con texto alternativo adecuado\n\n## Componentes relacionados\n\n\u003cCardGrid cols={3}\u003e\n  \u003cCard icon=\"square\" title=\"Card\" href=\"/docs/v1.0.0/components/card\" /\u003e\n  \u003cCard icon=\"message-square\" title=\"Badge\" href=\"/docs/v1.0.0/components/badge\" /\u003e\n  \u003cCard icon=\"layers\" title=\"Acordeón\" href=\"/docs/v1.0.0/components/accordion\" /\u003e\n\u003c/CardGrid\u003e\n"])</script><script>self.__next_f.push([1,"36:T1d20,"])</script><script>self.__next_f.push([1,"\n# Callout\n\nLos callouts llaman la atención sobre información importante en su documentación. Vienen en diferentes estilos para transmitir diferentes tipos de mensajes, desde consejos útiles hasta advertencias críticas.\n\n## Uso básico\n\n\u003cTabs defaultValue=\"Preview\"\u003e\n  \u003cTab label=\"Vista previa\"\u003e\n\u003cCallout type=\"info\"\u003e\n  Esta es información útil para el lector.\n\u003c/Callout\u003e\n  \u003c/Tab\u003e\n  \u003cTab label=\"Código\"\u003e\n```mdx\n\u003cCallout type=\"info\"\u003e\n  Esta es información útil para el lector.\n\u003c/Callout\u003e\n```\n  \u003c/Tab\u003e\n\u003c/Tabs\u003e\n\n## Tipos de Callout\n\nSpecra incluye siete tipos de callout, cada uno con un estilo distinto:\n\n### Info\n\n\u003cTabs defaultValue=\"Preview\"\u003e\n  \u003cTab label=\"Vista previa\"\u003e\n\u003cCallout type=\"info\"\u003e\n  Proporciona contexto adicional o información útil que mejora la comprensión.\n\u003c/Callout\u003e\n  \u003c/Tab\u003e\n  \u003cTab label=\"Código\"\u003e\n```mdx\n\u003cCallout type=\"info\"\u003e\n  Proporciona contexto adicional o información útil.\n\u003c/Callout\u003e\n```\n  \u003c/Tab\u003e\n\u003c/Tabs\u003e\n\n### Nota (Note)\n\n\u003cTabs defaultValue=\"Preview\"\u003e\n  \u003cTab label=\"Vista previa\"\u003e\n\u003cCallout type=\"note\"\u003e\n  Resalta detalles importantes que el lector debe conocer.\n\u003c/Callout\u003e\n  \u003c/Tab\u003e\n  \u003cTab label=\"Código\"\u003e\n```mdx\n\u003cCallout type=\"note\"\u003e\n  Resalta detalles importantes que el lector debe conocer.\n\u003c/Callout\u003e\n```\n  \u003c/Tab\u003e\n\u003c/Tabs\u003e\n\n### Consejo (Tip)\n\n\u003cTabs defaultValue=\"Preview\"\u003e\n  \u003cTab label=\"Vista previa\"\u003e\n\u003cCallout type=\"tip\"\u003e\n  Ofrece sugerencias para un mejor uso o mejores prácticas.\n\u003c/Callout\u003e\n  \u003c/Tab\u003e\n  \u003cTab label=\"Código\"\u003e\n```mdx\n\u003cCallout type=\"tip\"\u003e\n  Ofrece sugerencias para un mejor uso o mejores prácticas.\n\u003c/Callout\u003e\n```\n  \u003c/Tab\u003e\n\u003c/Tabs\u003e\n\n### Advertencia (Warning)\n\n\u003cTabs defaultValue=\"Preview\"\u003e\n  \u003cTab label=\"Vista previa\"\u003e\n\u003cCallout type=\"warning\"\u003e\n  Alerta a los usuarios sobre posibles problemas o cambios importantes.\n\u003c/Callout\u003e\n  \u003c/Tab\u003e\n  \u003cTab label=\"Código\"\u003e\n```mdx\n\u003cCallout type=\"warning\"\u003e\n  Alerta a los usuarios sobre posibles problemas o cambios importantes.\n\u003c/Callout\u003e\n```\n  \u003c/Tab\u003e\n\u003c/Tabs\u003e\n\n### Éxito (Success)\n\n\u003cTabs defaultValue=\"Preview\"\u003e\n  \u003cTab label=\"Vista previa\"\u003e\n\u003cCallout type=\"success\"\u003e\n  Confirma resultados positivos o acciones completadas con éxito.\n\u003c/Callout\u003e\n  \u003c/Tab\u003e\n  \u003cTab label=\"Código\"\u003e\n```mdx\n\u003cCallout type=\"success\"\u003e\n  Confirma resultados positivos o acciones completadas con éxito.\n\u003c/Callout\u003e\n```\n  \u003c/Tab\u003e\n\u003c/Tabs\u003e\n\n### Error\n\n\u003cTabs defaultValue=\"Preview\"\u003e\n  \u003cTab label=\"Vista previa\"\u003e\n\u003cCallout type=\"error\"\u003e\n  Resalta problemas críticos o cosas que los usuarios deben evitar.\n\u003c/Callout\u003e\n  \u003c/Tab\u003e\n  \u003cTab label=\"Código\"\u003e\n```mdx\n\u003cCallout type=\"error\"\u003e\n  Resalta problemas críticos o cosas que los usuarios deben evitar.\n\u003c/Callout\u003e\n```\n  \u003c/Tab\u003e\n\u003c/Tabs\u003e\n\n### Peligro (Danger)\n\n\u003cTabs defaultValue=\"Preview\"\u003e\n  \u003cTab label=\"Vista previa\"\u003e\n\u003cCallout type=\"danger\"\u003e\n  Advierte sobre acciones potencialmente destructivas o irreversibles.\n\u003c/Callout\u003e\n  \u003c/Tab\u003e\n  \u003cTab label=\"Código\"\u003e\n```mdx\n\u003cCallout type=\"danger\"\u003e\n  Advierte sobre acciones potencialmente destructivas o irreversibles.\n\u003c/Callout\u003e\n```\n  \u003c/Tab\u003e\n\u003c/Tabs\u003e\n\n## Props\n\n| Propiedad | Tipo | Predeterminado | Descripción |\n|-----------|------|----------------|-------------|\n| `type` | `string` | `\"info\"` | Estilo de callout: `info`, `note`, `tip`, `warning`, `success`, `error`, o `danger` |\n| `children` | `ReactNode` | Requerido | El contenido dentro del callout |\n\n## Ejemplos avanzados\n\n### Contenido de varias líneas\n\nLos callouts pueden contener cualquier contenido MDX, incluido texto formateado, listas y código:\n\n\u003cTabs defaultValue=\"Preview\"\u003e\n  \u003cTab label=\"Vista previa\"\u003e\n\u003cCallout type=\"warning\"\u003e\n  **Consideraciones importantes antes de implementar:**\n\n  - Respalde su base de datos\n  - Pruebe primero en el entorno de staging\n  - Notifique a su equipo sobre el tiempo de inactividad\n\n  Ejecute `npm run db:backup` para crear una copia de seguridad.\n\u003c/Callout\u003e\n  \u003c/Tab\u003e\n  \u003cTab label=\"Código\"\u003e\n```mdx\n\u003cCallout type=\"warning\"\u003e\n  **Consideraciones importantes antes de implementar:**\n\n  - Respalde su base de datos\n  - Pruebe primero en el entorno de staging\n  - Notifique a su equipo sobre el tiempo de inactividad\n\n  Ejecute `npm run db:backup` para crear una copia de seguridad.\n\u003c/Callout\u003e\n```\n  \u003c/Tab\u003e\n\u003c/Tabs\u003e\n\n### Componentes anidados\n\nPuede anidar otros componentes dentro de los callouts:\n\n\u003cTabs defaultValue=\"Preview\"\u003e\n  \u003cTab label=\"Vista previa\"\u003e\n\u003cCallout type=\"info\"\u003e\n  **Consejo profesional:** Use bloques de código para mostrar ejemplos\n\n  \u003cTabs defaultValue=\"js\"\u003e\n    \u003cTab label=\"JavaScript\"\u003e\n      console.log(\"¡Hola!\")\n    \u003c/Tab\u003e\n    \u003cTab label=\"Python\"\u003e\n      print(\"¡Hola!\")\n    \u003c/Tab\u003e\n  \u003c/Tabs\u003e\n\u003c/Callout\u003e\n  \u003c/Tab\u003e\n  \u003cTab label=\"Código\"\u003e\n```mdx\n\u003cCallout type=\"info\"\u003e\n  **Consejo profesional:** Use bloques de código para mostrar ejemplos\n\n  \u003cTabs defaultValue=\"js\"\u003e\n    \u003cTab label=\"JavaScript\"\u003e\n      console.log(\"¡Hola!\")\n    \u003c/Tab\u003e\n    \u003cTab label=\"Python\"\u003e\n      print(\"¡Hola!\")\n    \u003c/Tab\u003e\n  \u003c/Tabs\u003e\n\u003c/Callout\u003e\n```\n  \u003c/Tab\u003e\n\u003c/Tabs\u003e\n\n## Alertas estilo GitHub\n\n¿Prefiere la sintaxis Markdown? Specra también admite la sintaxis de alerta estilo GitHub usando blockquotes:\n\n\u003cTabs defaultValue=\"Preview\"\u003e\n  \u003cTab label=\"Vista previa\"\u003e\n\u003e [!NOTE]\n\u003e Esta es una nota usando sintaxis estilo GitHub.\n\n\u003e [!TIP]\n\u003e Este es un consejo usando sintaxis de blockquote.\n\n\u003e [!WARNING]\n\u003e Esta es una alerta de advertencia.\n  \u003c/Tab\u003e\n  \u003cTab label=\"Código\"\u003e\n```markdown\n\u003e [!NOTE]\n\u003e Esta es una nota usando sintaxis estilo GitHub.\n\n\u003e [!TIP]\n\u003e Este es un consejo usando sintaxis de blockquote.\n\n\u003e [!WARNING]\n\u003e Esta es una alerta de advertencia.\n```\n  \u003c/Tab\u003e\n\u003c/Tabs\u003e\n\n**Tipos de alerta admitidos:**\n- `[!NOTE]` - Igual que type=\"note\"\n- `[!TIP]` - Igual que type=\"tip\"\n- `[!IMPORTANT]` - Igual que type=\"warning\"\n- `[!WARNING]` - Igual que type=\"warning\"\n- `[!CAUTION]` - Igual que type=\"danger\"\n\n## Cuándo usar cada tipo\n\n**Info** - Contexto adicional que mejora la comprensión\n- \"También puede lograr esto usando la CLI\"\n- \"Esta característica está disponible en v2.0 y posteriores\"\n\n**Note** - Información importante que no debe omitirse\n- \"Esta configuración afecta a todos los usuarios de su organización\"\n- \"Los cambios surten efecto después del reinicio del servidor\"\n\n**Tip** - Mejores prácticas y sugerencias útiles\n- \"Para un mejor rendimiento, habilite el almacenamiento en caché\"\n- \"Use TypeScript para un mejor autocompletado\"\n\n**Warning** - Problemas potenciales o cambios importantes\n- \"Esto modificará el esquema de su base de datos\"\n- \"Obsoleto en v3.0, use newMethod() en su lugar\"\n\n**Success** - Confirmaciones positivas\n- \"¡Configuración completa! Su sitio está listo\"\n- \"Todas las pruebas pasaron con éxito\"\n\n**Error** - Problemas críticos a evitar\n- \"No exponga su clave API en el código del cliente\"\n- \"Esta operación no se puede deshacer\"\n\n**Danger** - Acciones destructivas o irreversibles\n- \"Esto eliminará permanentemente todos los datos\"\n- \"Continuar revocará todos los tokens de acceso\"\n\n## Accesibilidad\n\nLos callouts son semánticos y accesibles:\n\n- Utiliza roles ARIA apropiados\n- Amigable para lectores de pantalla\n- Navegable por teclado\n- Cumple con contraste de color (WCAG AA)\n- Los iconos son decorativos con texto alternativo adecuado\n\n## Componentes relacionados\n\n\u003cCardGrid cols={3}\u003e\n  \u003cCard icon=\"square\" title=\"Card\" href=\"/docs/v1.0.0/components/card\" /\u003e\n  \u003cCard icon=\"message-square\" title=\"Badge\" href=\"/docs/v1.0.0/components/badge\" /\u003e\n  \u003cCard icon=\"layers\" title=\"Acordeón\" href=\"/docs/v1.0.0/components/accordion\" /\u003e\n\u003c/CardGrid\u003e\n"])</script><script>self.__next_f.push([1,"37:T21f0,"])</script><script>self.__next_f.push([1,"\n# Configuración de Implementación\n\nLa sección `deployment` le dice a Specra cómo construir su documentación para diferentes plataformas de alojamiento. Esto asegura que los activos se carguen correctamente y su sitio funcione donde sea que lo implemente.\n\n## Por qué importa la configuración de implementación\n\nDiferentes plataformas sirven su sitio desde diferentes URL:\n\n- **Vercel:** `susitio.vercel.app` (sirve desde la raíz `/`)\n- **GitHub Pages (sin dominio personalizado):** `nombreusuario.github.io/nombre-repo` (sirve desde `/nombre-repo/`)\n- **Netlify:** `susitio.netlify.app` (sirve desde la raíz `/`)\n\nSpecra necesita conocer su objetivo de implementación para configurar las rutas de los activos correctamente.\n\n## Configuración Básica\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"vercel\"\n  }\n}\n```\n\nEso es todo lo que necesita para la mayoría de las implementaciones. Specra maneja el resto automáticamente.\n\n## Configuración Completa\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"vercel\",\n    \"basePath\": \"\",\n    \"customDomain\": false\n  }\n}\n```\n\n## Opciones de Configuración\n\n### target\n\n**Tipo:** `string`\n**Predeterminado:** `\"vercel\"`\n\nSu plataforma de implementación. Esto determina qué proceso de compilación utiliza Specra.\n\n**Objetivos disponibles:**\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"vercel\"\n  }\n}\n```\n\n**Opciones:**\n- `\"vercel\"` - Vercel, Railway, Render, o cualquier alojamiento Node.js\n- `\"github-pages\"` - GitHub Pages sin dominio personalizado\n- `\"static\"` - Alojamiento estático (Netlify, Cloudflare Pages)\n- `\"custom-domain-static\"` - GitHub Pages con dominio personalizado\n\n### basePath\n\n**Tipo:** `string`\n**Predeterminado:** `\"\"`\n\nRuta base para su sitio. Solo necesaria para GitHub Pages sin un dominio personalizado.\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"github-pages\",\n    \"basePath\": \"mi-repo\"\n  }\n}\n```\n\n**Cuándo usar basePath:**\n\n✅ **GitHub Pages sin dominio personalizado**\n```\nURL: nombreusuario.github.io/mi-repo\nConfig: \"basePath\": \"mi-repo\"\n```\n\n❌ **GitHub Pages con dominio personalizado**\n```\nURL: docs.ejemplo.com\nConfig: \"basePath\": \"\"\n```\n\n❌ **Vercel, Netlify, etc.**\n```\nURL: susitio.vercel.app\nConfig: \"basePath\": \"\"\n```\n\n\u003cCallout type=\"warning\"\u003e\nEl basePath debe coincidir exactamente con el nombre de su repositorio. Si no coinciden, los activos devolverán errores 404.\n\u003c/Callout\u003e\n\n### customDomain\n\n**Tipo:** `boolean`\n**Predeterminado:** `false`\n\nEstablezca en `true` cuando use un dominio personalizado con GitHub Pages.\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"github-pages\",\n    \"customDomain\": true,\n    \"basePath\": \"\"\n  }\n}\n```\n\nEsto le dice a Specra que sirva los activos desde la raíz `/` en lugar de `/nombre-repo/`.\n\n## Configuraciones Específicas de la Plataforma\n\n### Vercel\n\nLa configuración predeterminada funciona perfectamente:\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"vercel\"\n  }\n}\n```\n\n**Comando de compilación:** `npm run build`\n**Salida:** directorio `.next`\n**No se necesita basePath**\n\n### GitHub Pages (Sin Dominio Personalizado)\n\nPara `nombreusuario.github.io/nombre-repo`:\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"github-pages\",\n    \"basePath\": \"nombre-repo\",\n    \"customDomain\": false\n  }\n}\n```\n\n**Comando de compilación:** `npm run build:export`\n**Salida:** directorio `out`\n**Los activos se cargan de:** `/nombre-repo/_next/...`\n\n### GitHub Pages (Con Dominio Personalizado)\n\nPara `docs.ejemplo.com`:\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"custom-domain-static\",\n    \"basePath\": \"\",\n    \"customDomain\": true\n  }\n}\n```\n\nTambién agregue `public/CNAME`:\n```\ndocs.ejemplo.com\n```\n\n**Comando de compilación:** `npm run build:export`\n**Salida:** directorio `out`\n**Los activos se cargan de:** `/_next/...`\n\n### Netlify\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"static\"\n  }\n}\n```\n\n**Comando de compilación:** `npm run build:export`\n**Salida:** directorio `out`\n**No se necesita basePath**\n\n### Cloudflare Pages\n\nIgual que Netlify:\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"static\"\n  }\n}\n```\n\n## Cómo Funciona\n\n### Modos de Compilación\n\nSpecra tiene dos modos de compilación:\n\n**1. Independiente (Alojamiento Node.js)**\n- Usado para: Vercel, Railway, Render\n- Comando: `npm run build`\n- Salida: directorio `.next`\n- Se ejecuta como servidor Node.js\n- Admite características dinámicas\n\n**2. Exportación Estática (Alojamiento estático)**\n- Usado para: GitHub Pages, Netlify, Cloudflare Pages\n- Comando: `npm run build:export`\n- Salida: directorio `out`\n- Archivos HTML/CSS/JS puros\n- No se requiere servidor\n\nEl `deployment.target` determina qué modo usar.\n\n### Resolución de Ruta de Activos\n\nSpecra usa la utilidad `getAssetPath()` para manejar las URL de activos:\n\n```typescript\n// Se ajusta automáticamente según la configuración de implementación\ngetAssetPath('/images/logo.png')\n\n// Vercel: /images/logo.png\n// GitHub Pages (sin dominio personalizado): /nombre-repo/images/logo.png\n// GitHub Pages (dominio personalizado): /images/logo.png\n```\n\nNo necesita preocuparse por esto: Specra lo maneja automáticamente según su configuración.\n\n## Cambiar de Plataforma\n\n### De Vercel a GitHub Pages\n\n1. Actualizar configuración:\n```json\n{\n  \"deployment\": {\n    \"target\": \"github-pages\",\n    \"basePath\": \"su-nombre-repo\"\n  }\n}\n```\n\n2. Cambiar comando de compilación:\n```bash\nnpm run build:export  # en lugar de npm run build\n```\n\n3. Implementar carpeta `out/` en lugar de `.next/`\n\n### De GitHub Pages a Netlify\n\n1. Actualizar configuración:\n```json\n{\n  \"deployment\": {\n    \"target\": \"static\",\n    \"basePath\": \"\"\n  }\n}\n```\n\n2. Seguir usando `npm run build:export`\n\n3. Netlify sirve desde la raíz, así que elimine basePath\n\n## Pruebas Locales\n\n### Probar Exportación Estática\n\n```bash\nnpm run build:export\nnpx serve out\n```\n\nAbra la URL mostrada (generalmente `http://localhost:3000`). Verifique:\n- Las páginas se cargan correctamente\n- Las imágenes aparecen\n- Los enlaces funcionan\n- La navegación funciona\n\n### Probar con basePath\n\nSi usa basePath, pruebe localmente con un servidor que lo respete:\n\n```bash\nnpm run build:export\nnpx serve out -s -p 3000\n```\n\nLuego visite `http://localhost:3000/su-nombre-repo` para simular GitHub Pages.\n\n## Solución de Problemas\n\n### Los Activos Devuelven 404\n\n**Verifique que basePath coincida con el nombre del repositorio:**\n```json\n{\n  \"deployment\": {\n    \"basePath\": \"nombre-repo-exacto\"  // Debe coincidir exactamente\n  }\n}\n```\n\n**Verifique que está usando el comando de compilación correcto:**\n- GitHub Pages: `npm run build:export` (no `npm run build`)\n- Vercel: `npm run build` (no `npm run build:export`)\n\n### Página en Blanco Después de Implementar\n\n**Verifique que el objetivo sea correcto:**\n- GitHub Pages necesita `\"target\": \"github-pages\"`\n- Netlify necesita `\"target\": \"static\"`\n- Vercel necesita `\"target\": \"vercel\"`\n\n**Verifique que los ajustes de implementación coincidan con la configuración:**\n- El directorio de salida debe coincidir con el modo de compilación\n- El comando de compilación debe coincidir con el objetivo\n\n### Dominio Personalizado No Funciona\n\n**Asegúrese de que customDomain sea true:**\n```json\n{\n  \"deployment\": {\n    \"customDomain\": true,\n    \"basePath\": \"\"\n  }\n}\n```\n\n**Verifique que el archivo CNAME exista:**\n- Debe estar en `public/CNAME`\n- Contiene solo su dominio\n- Sin protocolo, sin barra diagonal final\n\n## Mejores Prácticas\n\n**Mantenga la configuración en control de versiones** - Confirme `specra.config.json` para que las implementaciones sean consistentes\n\n**Pruebe localmente antes de implementar** - Use `npx serve out` para probar exportaciones estáticas\n\n**Use configuraciones específicas del entorno** - Diferentes configuraciones para ensayo y producción si es necesario\n\n**Documente su configuración** - Agregue instrucciones de implementación a su README\n\n**Verifique después de cambiar de plataforma** - Pruebe que todo funcione al cambiar los objetivos de implementación\n\n## Próximos Pasos\n\n\u003cCardGrid cols={2}\u003e\n  \u003cCard\n    icon=\"triangle\"\n    title=\"Implementar en Vercel\"\n    description=\"Implementación paso a paso en Vercel\"\n    href=\"/docs/v1.0.0/deployment/vercel\"\n  /\u003e\n  \u003cCard\n    icon=\"github\"\n    title=\"Implementar en GitHub Pages\"\n    description=\"GitHub Pages con Actions\"\n    href=\"/docs/v1.0.0/deployment/github-pages\"\n  /\u003e\n  \u003cCard\n    icon=\"globe\"\n    title=\"Implementar en Netlify\"\n    description=\"Guía de implementación de Netlify\"\n    href=\"/docs/v1.0.0/deployment/netlify\"\n  /\u003e\n  \u003cCard\n    icon=\"arrow-left\"\n    title=\"Descripción general de la implementación\"\n    description=\"Todas las opciones de implementación\"\n    href=\"/docs/v1.0.0/deployment/overview\"\n  /\u003e\n\u003c/CardGrid\u003e\n"])</script><script>self.__next_f.push([1,"38:T21f0,"])</script><script>self.__next_f.push([1,"\n# Configuración de Implementación\n\nLa sección `deployment` le dice a Specra cómo construir su documentación para diferentes plataformas de alojamiento. Esto asegura que los activos se carguen correctamente y su sitio funcione donde sea que lo implemente.\n\n## Por qué importa la configuración de implementación\n\nDiferentes plataformas sirven su sitio desde diferentes URL:\n\n- **Vercel:** `susitio.vercel.app` (sirve desde la raíz `/`)\n- **GitHub Pages (sin dominio personalizado):** `nombreusuario.github.io/nombre-repo` (sirve desde `/nombre-repo/`)\n- **Netlify:** `susitio.netlify.app` (sirve desde la raíz `/`)\n\nSpecra necesita conocer su objetivo de implementación para configurar las rutas de los activos correctamente.\n\n## Configuración Básica\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"vercel\"\n  }\n}\n```\n\nEso es todo lo que necesita para la mayoría de las implementaciones. Specra maneja el resto automáticamente.\n\n## Configuración Completa\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"vercel\",\n    \"basePath\": \"\",\n    \"customDomain\": false\n  }\n}\n```\n\n## Opciones de Configuración\n\n### target\n\n**Tipo:** `string`\n**Predeterminado:** `\"vercel\"`\n\nSu plataforma de implementación. Esto determina qué proceso de compilación utiliza Specra.\n\n**Objetivos disponibles:**\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"vercel\"\n  }\n}\n```\n\n**Opciones:**\n- `\"vercel\"` - Vercel, Railway, Render, o cualquier alojamiento Node.js\n- `\"github-pages\"` - GitHub Pages sin dominio personalizado\n- `\"static\"` - Alojamiento estático (Netlify, Cloudflare Pages)\n- `\"custom-domain-static\"` - GitHub Pages con dominio personalizado\n\n### basePath\n\n**Tipo:** `string`\n**Predeterminado:** `\"\"`\n\nRuta base para su sitio. Solo necesaria para GitHub Pages sin un dominio personalizado.\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"github-pages\",\n    \"basePath\": \"mi-repo\"\n  }\n}\n```\n\n**Cuándo usar basePath:**\n\n✅ **GitHub Pages sin dominio personalizado**\n```\nURL: nombreusuario.github.io/mi-repo\nConfig: \"basePath\": \"mi-repo\"\n```\n\n❌ **GitHub Pages con dominio personalizado**\n```\nURL: docs.ejemplo.com\nConfig: \"basePath\": \"\"\n```\n\n❌ **Vercel, Netlify, etc.**\n```\nURL: susitio.vercel.app\nConfig: \"basePath\": \"\"\n```\n\n\u003cCallout type=\"warning\"\u003e\nEl basePath debe coincidir exactamente con el nombre de su repositorio. Si no coinciden, los activos devolverán errores 404.\n\u003c/Callout\u003e\n\n### customDomain\n\n**Tipo:** `boolean`\n**Predeterminado:** `false`\n\nEstablezca en `true` cuando use un dominio personalizado con GitHub Pages.\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"github-pages\",\n    \"customDomain\": true,\n    \"basePath\": \"\"\n  }\n}\n```\n\nEsto le dice a Specra que sirva los activos desde la raíz `/` en lugar de `/nombre-repo/`.\n\n## Configuraciones Específicas de la Plataforma\n\n### Vercel\n\nLa configuración predeterminada funciona perfectamente:\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"vercel\"\n  }\n}\n```\n\n**Comando de compilación:** `npm run build`\n**Salida:** directorio `.next`\n**No se necesita basePath**\n\n### GitHub Pages (Sin Dominio Personalizado)\n\nPara `nombreusuario.github.io/nombre-repo`:\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"github-pages\",\n    \"basePath\": \"nombre-repo\",\n    \"customDomain\": false\n  }\n}\n```\n\n**Comando de compilación:** `npm run build:export`\n**Salida:** directorio `out`\n**Los activos se cargan de:** `/nombre-repo/_next/...`\n\n### GitHub Pages (Con Dominio Personalizado)\n\nPara `docs.ejemplo.com`:\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"custom-domain-static\",\n    \"basePath\": \"\",\n    \"customDomain\": true\n  }\n}\n```\n\nTambién agregue `public/CNAME`:\n```\ndocs.ejemplo.com\n```\n\n**Comando de compilación:** `npm run build:export`\n**Salida:** directorio `out`\n**Los activos se cargan de:** `/_next/...`\n\n### Netlify\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"static\"\n  }\n}\n```\n\n**Comando de compilación:** `npm run build:export`\n**Salida:** directorio `out`\n**No se necesita basePath**\n\n### Cloudflare Pages\n\nIgual que Netlify:\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"static\"\n  }\n}\n```\n\n## Cómo Funciona\n\n### Modos de Compilación\n\nSpecra tiene dos modos de compilación:\n\n**1. Independiente (Alojamiento Node.js)**\n- Usado para: Vercel, Railway, Render\n- Comando: `npm run build`\n- Salida: directorio `.next`\n- Se ejecuta como servidor Node.js\n- Admite características dinámicas\n\n**2. Exportación Estática (Alojamiento estático)**\n- Usado para: GitHub Pages, Netlify, Cloudflare Pages\n- Comando: `npm run build:export`\n- Salida: directorio `out`\n- Archivos HTML/CSS/JS puros\n- No se requiere servidor\n\nEl `deployment.target` determina qué modo usar.\n\n### Resolución de Ruta de Activos\n\nSpecra usa la utilidad `getAssetPath()` para manejar las URL de activos:\n\n```typescript\n// Se ajusta automáticamente según la configuración de implementación\ngetAssetPath('/images/logo.png')\n\n// Vercel: /images/logo.png\n// GitHub Pages (sin dominio personalizado): /nombre-repo/images/logo.png\n// GitHub Pages (dominio personalizado): /images/logo.png\n```\n\nNo necesita preocuparse por esto: Specra lo maneja automáticamente según su configuración.\n\n## Cambiar de Plataforma\n\n### De Vercel a GitHub Pages\n\n1. Actualizar configuración:\n```json\n{\n  \"deployment\": {\n    \"target\": \"github-pages\",\n    \"basePath\": \"su-nombre-repo\"\n  }\n}\n```\n\n2. Cambiar comando de compilación:\n```bash\nnpm run build:export  # en lugar de npm run build\n```\n\n3. Implementar carpeta `out/` en lugar de `.next/`\n\n### De GitHub Pages a Netlify\n\n1. Actualizar configuración:\n```json\n{\n  \"deployment\": {\n    \"target\": \"static\",\n    \"basePath\": \"\"\n  }\n}\n```\n\n2. Seguir usando `npm run build:export`\n\n3. Netlify sirve desde la raíz, así que elimine basePath\n\n## Pruebas Locales\n\n### Probar Exportación Estática\n\n```bash\nnpm run build:export\nnpx serve out\n```\n\nAbra la URL mostrada (generalmente `http://localhost:3000`). Verifique:\n- Las páginas se cargan correctamente\n- Las imágenes aparecen\n- Los enlaces funcionan\n- La navegación funciona\n\n### Probar con basePath\n\nSi usa basePath, pruebe localmente con un servidor que lo respete:\n\n```bash\nnpm run build:export\nnpx serve out -s -p 3000\n```\n\nLuego visite `http://localhost:3000/su-nombre-repo` para simular GitHub Pages.\n\n## Solución de Problemas\n\n### Los Activos Devuelven 404\n\n**Verifique que basePath coincida con el nombre del repositorio:**\n```json\n{\n  \"deployment\": {\n    \"basePath\": \"nombre-repo-exacto\"  // Debe coincidir exactamente\n  }\n}\n```\n\n**Verifique que está usando el comando de compilación correcto:**\n- GitHub Pages: `npm run build:export` (no `npm run build`)\n- Vercel: `npm run build` (no `npm run build:export`)\n\n### Página en Blanco Después de Implementar\n\n**Verifique que el objetivo sea correcto:**\n- GitHub Pages necesita `\"target\": \"github-pages\"`\n- Netlify necesita `\"target\": \"static\"`\n- Vercel necesita `\"target\": \"vercel\"`\n\n**Verifique que los ajustes de implementación coincidan con la configuración:**\n- El directorio de salida debe coincidir con el modo de compilación\n- El comando de compilación debe coincidir con el objetivo\n\n### Dominio Personalizado No Funciona\n\n**Asegúrese de que customDomain sea true:**\n```json\n{\n  \"deployment\": {\n    \"customDomain\": true,\n    \"basePath\": \"\"\n  }\n}\n```\n\n**Verifique que el archivo CNAME exista:**\n- Debe estar en `public/CNAME`\n- Contiene solo su dominio\n- Sin protocolo, sin barra diagonal final\n\n## Mejores Prácticas\n\n**Mantenga la configuración en control de versiones** - Confirme `specra.config.json` para que las implementaciones sean consistentes\n\n**Pruebe localmente antes de implementar** - Use `npx serve out` para probar exportaciones estáticas\n\n**Use configuraciones específicas del entorno** - Diferentes configuraciones para ensayo y producción si es necesario\n\n**Documente su configuración** - Agregue instrucciones de implementación a su README\n\n**Verifique después de cambiar de plataforma** - Pruebe que todo funcione al cambiar los objetivos de implementación\n\n## Próximos Pasos\n\n\u003cCardGrid cols={2}\u003e\n  \u003cCard\n    icon=\"triangle\"\n    title=\"Implementar en Vercel\"\n    description=\"Implementación paso a paso en Vercel\"\n    href=\"/docs/v1.0.0/deployment/vercel\"\n  /\u003e\n  \u003cCard\n    icon=\"github\"\n    title=\"Implementar en GitHub Pages\"\n    description=\"GitHub Pages con Actions\"\n    href=\"/docs/v1.0.0/deployment/github-pages\"\n  /\u003e\n  \u003cCard\n    icon=\"globe\"\n    title=\"Implementar en Netlify\"\n    description=\"Guía de implementación de Netlify\"\n    href=\"/docs/v1.0.0/deployment/netlify\"\n  /\u003e\n  \u003cCard\n    icon=\"arrow-left\"\n    title=\"Descripción general de la implementación\"\n    description=\"Todas las opciones de implementación\"\n    href=\"/docs/v1.0.0/deployment/overview\"\n  /\u003e\n\u003c/CardGrid\u003e\n"])</script><script>self.__next_f.push([1,"39:T2f20,"])</script><script>self.__next_f.push([1,"\n# Implementar en Netlify\n\nNetlify proporciona un potente alojamiento estático con características como reversiones instantáneas, pruebas divididas y funciones perimetrales. Es una gran opción para sitios de documentación.\n\n## ¿Por qué Netlify?\n\n- **Implementación con un clic** - Conectar e implementar en minutos\n- **Implementación continua** - Implementación automática en el envío de git\n- **Reversiones instantáneas** - Restaurar versiones anteriores al instante\n- **Funciones perimetrales** - Ejecutar código en el perímetro\n- **Formularios e identidad** - Manejo de formularios y autenticación integrados\n- **Nivel gratuito** - Límites generosos para documentación\n\n## Implementación Rápida\n\n\u003cSteps\u003e\n  \u003cStep title=\"Configurar para Exportación Estática\"\u003e\n    Actualice `specra.config.json`:\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"static\",\n    \"basePath\": \"\",\n    \"customDomain\": false\n  }\n}\n```\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Crear netlify.toml\"\u003e\n    Agregue la configuración de compilación en la raíz del proyecto:\n\n```toml\n[build]\n  command = \"npm run build:export\"\n  publish = \"out\"\n\n[build.environment]\n  NODE_VERSION = \"20\"\n\n[[redirects]]\n  from = \"/*\"\n  to = \"/index.html\"\n  status = 200\n```\n\nEsto le dice a Netlify cómo construir y qué publicar.\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Implementar\"\u003e\n    **Opción 1: Interfaz Web**\n    1. Vaya a [netlify.com](https://netlify.com)\n    2. Haga clic en \"Add new site\" → \"Import an existing project\"\n    3. Conecte su proveedor de Git\n    4. Seleccione su repositorio\n    5. Haga clic en \"Deploy site\"\n\n**Opción 2: CLI Netlify**\n```bash\nnpm install -g netlify-cli\nnetlify deploy --prod\n```\n  \u003c/Step\u003e\n\u003c/Steps\u003e\n\n\u003cCallout type=\"success\"\u003e\nSu sitio ahora está en vivo en una URL de Netlify como `nombre-aleatorio-123.netlify.app`\n\u003c/Callout\u003e\n\n## Configuración\n\n### Configuración de Compilación\n\nNetlify detecta automáticamente la configuración, pero puede personalizarla:\n\n| Configuración | Valor |\n|---------------|-------|\n| Comando de compilación | `npm run build:export` |\n| Directorio de publicación | `out` |\n| Versión de Node | 20 (establecida en `netlify.toml`) |\n\n### Variables de Entorno\n\nAgregue variables de entorno en el panel de Netlify:\n\n\u003cSteps\u003e\n  \u003cStep title=\"Ir a Configuración del Sitio\"\u003e\n    Haga clic en su sitio → Site settings → Environment variables\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Agregar Variables\"\u003e\n```\nMEILISEARCH_HOST=https://search.example.com\nMEILISEARCH_API_KEY=su-clave-de-busqueda\nNEXT_PUBLIC_GA_ID=G-XXXXXXXXXX\n```\n\n\u003cCallout type=\"tip\"\u003e\nLas variables que comienzan con `NEXT_PUBLIC_` están expuestas al navegador. Mantenga las claves confidenciales sin este prefijo.\n\u003c/Callout\u003e\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Volver a Implementar\"\u003e\n    Vaya a Deploys → Trigger deploy → Deploy site\n  \u003c/Step\u003e\n\u003c/Steps\u003e\n\n## Dominio Personalizado\n\nAgregue su propio dominio a su sitio Netlify:\n\n\u003cSteps\u003e\n  \u003cStep title=\"Agregar Dominio\"\u003e\n    1. Vaya a Domain settings\n    2. Haga clic en \"Add custom domain\"\n    3. Ingrese su dominio (por ejemplo, `docs.ejemplo.com`)\n    4. Haga clic en \"Verify\"\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Configurar DNS\"\u003e\n    **Opción 1: Usar DNS de Netlify (Recomendado)**\n    - Apunte los servidores de nombres de su dominio a Netlify\n    - Netlify administra todos los registros DNS\n    - Certificado SSL automático\n\n**Opción 2: Usar DNS Externo**\n\nPara subdominio:\n```\nTipo: CNAME\nNombre: docs\nValor: su-sitio.netlify.app\n```\n\nPara dominio ápice:\n```\nTipo: A\nNombre: @\nValor: 75.2.60.5\n```\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Habilitar HTTPS\"\u003e\n    Netlify aprovisiona automáticamente un certificado SSL de Let's Encrypt.\n\n    Verifique Domain settings → HTTPS para ver el estado.\n  \u003c/Step\u003e\n\u003c/Steps\u003e\n\n## Vistas Previas de Implementación\n\nNetlify crea implementaciones de vista previa para cada solicitud de extracción:\n\n**Lo que obtiene:**\n- URL única para cada PR\n- Actualizaciones automáticas cuando envía\n- Enlace de vista previa de implementación en comentarios de PR\n- Perfecto para revisar cambios\n\n### Configurar Vistas Previas de Implementación\n\nControle cuándo se crean las vistas previas:\n\n```toml\n[context.deploy-preview]\n  command = \"npm run build:export\"\n\n[context.branch-deploy]\n  command = \"npm run build:export\"\n```\n\n## Características Avanzadas\n\n### Reglas de Redirección\n\nAgregue redirecciones en `netlify.toml`:\n\n```toml\n# Redirigir URL antiguas\n[[redirects]]\n  from = \"/old-page\"\n  to = \"/new-page\"\n  status = 301\n\n# Reserva SPA\n[[redirects]]\n  from = \"/*\"\n  to = \"/index.html\"\n  status = 200\n\n# Redirecciones basadas en el país\n[[redirects]]\n  from = \"/docs\"\n  to = \"/en/docs\"\n  status = 302\n  conditions = {Country = [\"US\"]}\n```\n\n### Encabezados\n\nAgregue encabezados personalizados:\n\n```toml\n[[headers]]\n  for = \"/*\"\n  [headers.values]\n    X-Frame-Options = \"DENY\"\n    X-XSS-Protection = \"1; mode=block\"\n    Content-Security-Policy = \"default-src 'self'\"\n\n[[headers]]\n  for = \"/assets/*\"\n  [headers.values]\n    Cache-Control = \"public, max-age=31536000, immutable\"\n```\n\n### Funciones Perimetrales\n\nEjecute código en el perímetro para funcionalidad dinámica:\n\nCree `netlify/edge-functions/hello.ts`:\n\n```typescript\nexport default async (request: Request) =\u003e {\n  return new Response(\"¡Hola desde el borde!\")\n}\n\nexport const config = {\n  path: \"/api/hello\"\n}\n```\n\n### Pruebas Divididas\n\nPruebe diferentes versiones de sus documentos:\n\n1. Vaya a Split testing\n2. Haga clic en \"Start a test\"\n3. Seleccione ramas para comparar\n4. Establezca la división de tráfico (por ejemplo, 50/50)\n\nGenial para probar nuevos diseños o contenido de documentación.\n\n## Complementos de Compilación\n\nAmplíe su compilación con complementos de Netlify:\n\n```toml\n[[plugins]]\n  package = \"@netlify/plugin-lighthouse\"\n\n[[plugins]]\n  package = \"netlify-plugin-checklinks\"\n```\n\nInstalar complementos:\n\n```bash\nnpm install -D @netlify/plugin-lighthouse netlify-plugin-checklinks\n```\n\n## Contextos de Implementación\n\nDiferentes configuraciones para diferentes ramas:\n\n```toml\n# Producción (rama main)\n[context.production]\n  command = \"npm run build:export\"\n  [context.production.environment]\n    NODE_ENV = \"production\"\n\n# Rama de staging\n[context.staging]\n  command = \"npm run build:export\"\n  [context.staging.environment]\n    NODE_ENV = \"staging\"\n\n# Vistas previas de implementación (PRs)\n[context.deploy-preview]\n  command = \"npm run build:export -- --debug\"\n```\n\n## Optimización de Rendimiento\n\n### Optimización de Activos\n\nNetlify optimiza automáticamente:\n- Compresión de imagen\n- Minificación de paquetes\n- Compresión Brotli\n\nHabilite esto en Build \u0026 deploy → Post processing.\n\n### Almacenamiento en Caché\n\nConfigure encabezados de caché:\n\n```toml\n[[headers]]\n  for = \"/_next/static/*\"\n  [headers.values]\n    Cache-Control = \"public, max-age=31536000, immutable\"\n\n[[headers]]\n  for = \"/images/*\"\n  [headers.values]\n    Cache-Control = \"public, max-age=604800\"\n```\n\n### Pre-renderizado\n\nPara un mejor SEO, habilite el pre-renderizado:\n\n```toml\n[[plugins]]\n  package = \"@netlify/plugin-nextjs\"\n```\n\n## Formularios\n\nAgregue formularios a su documentación:\n\n```html\n\u003cform name=\"contact\" method=\"POST\" data-netlify=\"true\"\u003e\n  \u003cinput type=\"text\" name=\"name\" /\u003e\n  \u003cinput type=\"email\" name=\"email\" /\u003e\n  \u003ctextarea name=\"message\"\u003e\u003c/textarea\u003e\n  \u003cbutton type=\"submit\"\u003eEnviar\u003c/button\u003e\n\u003c/form\u003e\n```\n\nNetlify maneja automáticamente los envíos de formularios. Vea las respuestas en la pestaña Forms.\n\n## Análisis\n\nHabilite Netlify Analytics para obtener información sobre los visitantes:\n\n1. Vaya a la pestaña Analytics\n2. Haga clic en \"Enable Analytics\"\n3. Cuesta $9/mes (opcional)\n\nMuestra:\n- Vistas de página\n- Páginas principales\n- Fuentes de tráfico\n- Datos geográficos\n\n## Integración CI/CD\n\n### GitHub Actions + Netlify\n\nImplemente desde GitHub Actions para tener más control:\n\n```yaml\nname: Deploy to Netlify\n\non:\n  push:\n    branches: [main]\n\njobs:\n  deploy:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n\n      - name: Setup Node\n        uses: actions/setup-node@v4\n        with:\n          node-version: '20'\n\n      - name: Install dependencies\n        run: npm ci\n\n      - name: Build\n        run: npm run build:export\n\n      - name: Deploy to Netlify\n        uses: nwtgck/actions-netlify@v2\n        with:\n          publish-dir: './out'\n          production-deploy: true\n        env:\n          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}\n          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}\n```\n\nObtenga su token de autenticación y su ID de sitio desde el panel de Netlify.\n\n## Solución de Problemas\n\n### La Compilación Falla\n\n**Ver registros de compilación:**\n- Vaya a Deploys\n- Haga clic en implementación fallida\n- Ver registro de implementación\n\n**Problemas comunes:**\n- Falta de coincidencia de versión de Node (establecer en `netlify.toml`)\n- Dependencias faltantes (use `npm ci` no `npm install`)\n- Variables de entorno no establecidas\n\n### Activos 404\n\nAsegúrese de que `netlify.toml` tenga la redirección SPA:\n\n```toml\n[[redirects]]\n  from = \"/*\"\n  to = \"/index.html\"\n  status = 200\n```\n\n### Las Funciones No Funcionan\n\nVerifique los registros de funciones:\n1. Vaya a la pestaña Functions\n2. Haga clic en su función\n3. Ver registros\n\nAsegúrese de que la ruta de la función coincida con la configuración:\n\n```typescript\nexport const config = {\n  path: \"/api/hello\"  // Debe coincidir con su ruta\n}\n```\n\n### Problemas de SSL de Dominio Personalizado\n\n- Espere 24 horas para la propagación de DNS\n- Verifique los registros DNS con `dig` o `nslookup`\n- Verifique el estado HTTPS en Domain settings\n- Intente volver a aprovisionar el certificado\n\n## Reversiones\n\nRevierta instantáneamente a una implementación anterior:\n\n1. Vaya a Deploys\n2. Encuentre la versión que funciona\n3. Haga clic en \"Publish deploy\"\n\nSu sitio se revierte inmediatamente. Sin esperar compilaciones.\n\n## Monitoreo\n\n### Notificaciones de Implementación\n\nReciba notificaciones cuando las implementaciones tengan éxito o fallen:\n\n1. Vaya a Site settings → Build \u0026 deploy → Deploy notifications\n2. Agregue notificación (Correo electrónico, Slack, webhook)\n3. Elija eventos (implementación iniciada, exitosa, fallida)\n\n### Insignia de Estado\n\nAgregue una insignia de estado de implementación a su README:\n\n```markdown\n[![Netlify Status](https://api.netlify.com/api/v1/badges/SITE_ID/deploy-status)](https://app.netlify.com/sites/SITE_NAME/deploys)\n```\n\n## Precios\n\nEl nivel gratuito de Netlify incluye:\n- 300 minutos de compilación/mes\n- 100GB de ancho de banda/mes\n- Sitios ilimitados\n- Vistas previas de implementación\n- HTTPS\n- Formularios (100 envíos/mes)\n\nActualice a Pro ($19/mes) para:\n- Más ancho de banda y minutos de compilación\n- Análisis\n- Colaboración en equipo\n- Soporte prioritario\n\n## Mejores Prácticas\n\n**Usar `netlify.toml`** - Control de versiones de su configuración de compilación\n\n**Habilitar vistas previas de implementación** - Revisar cambios antes de fusionar\n\n**Configurar notificaciones** - Saber inmediatamente cuando fallan las implementaciones\n\n**Usar variables de entorno** - Mantener secretos fuera del código\n\n**Configurar redirecciones** - Manejar cambios de URL correctamente\n\n**Monitorear análisis** - Comprender cómo los usuarios navegan por sus documentos\n\n**Probar localmente** - Ejecutar `npm run build:export \u0026\u0026 npx serve out` primero\n\n## Próximos Pasos\n\n\u003cCardGrid cols={2}\u003e\n  \u003cCard\n    icon=\"triangle\"\n    title=\"Vercel\"\n    description=\"Implementar en Vercel en su lugar\"\n    href=\"/docs/v1.0.0/deployment/vercel\"\n  /\u003e\n  \u003cCard\n    icon=\"github\"\n    title=\"GitHub Pages\"\n    description=\"Alojamiento gratuito con GitHub Pages\"\n    href=\"/docs/v1.0.0/deployment/github-pages\"\n  /\u003e\n  \u003cCard\n    icon=\"arrow-left\"\n    title=\"Descripción General de Implementación\"\n    description=\"Ver todas las opciones de implementación\"\n    href=\"/docs/v1.0.0/deployment/overview\"\n  /\u003e\n  \u003cCard\n    icon=\"zap\"\n    title=\"Rendimiento\"\n    description=\"Optimizar su documentación\"\n    href=\"/docs/v1.0.0/performance\"\n  /\u003e\n\u003c/CardGrid\u003e\n"])</script><script>self.__next_f.push([1,"3a:T2f20,"])</script><script>self.__next_f.push([1,"\n# Implementar en Netlify\n\nNetlify proporciona un potente alojamiento estático con características como reversiones instantáneas, pruebas divididas y funciones perimetrales. Es una gran opción para sitios de documentación.\n\n## ¿Por qué Netlify?\n\n- **Implementación con un clic** - Conectar e implementar en minutos\n- **Implementación continua** - Implementación automática en el envío de git\n- **Reversiones instantáneas** - Restaurar versiones anteriores al instante\n- **Funciones perimetrales** - Ejecutar código en el perímetro\n- **Formularios e identidad** - Manejo de formularios y autenticación integrados\n- **Nivel gratuito** - Límites generosos para documentación\n\n## Implementación Rápida\n\n\u003cSteps\u003e\n  \u003cStep title=\"Configurar para Exportación Estática\"\u003e\n    Actualice `specra.config.json`:\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"static\",\n    \"basePath\": \"\",\n    \"customDomain\": false\n  }\n}\n```\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Crear netlify.toml\"\u003e\n    Agregue la configuración de compilación en la raíz del proyecto:\n\n```toml\n[build]\n  command = \"npm run build:export\"\n  publish = \"out\"\n\n[build.environment]\n  NODE_VERSION = \"20\"\n\n[[redirects]]\n  from = \"/*\"\n  to = \"/index.html\"\n  status = 200\n```\n\nEsto le dice a Netlify cómo construir y qué publicar.\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Implementar\"\u003e\n    **Opción 1: Interfaz Web**\n    1. Vaya a [netlify.com](https://netlify.com)\n    2. Haga clic en \"Add new site\" → \"Import an existing project\"\n    3. Conecte su proveedor de Git\n    4. Seleccione su repositorio\n    5. Haga clic en \"Deploy site\"\n\n**Opción 2: CLI Netlify**\n```bash\nnpm install -g netlify-cli\nnetlify deploy --prod\n```\n  \u003c/Step\u003e\n\u003c/Steps\u003e\n\n\u003cCallout type=\"success\"\u003e\nSu sitio ahora está en vivo en una URL de Netlify como `nombre-aleatorio-123.netlify.app`\n\u003c/Callout\u003e\n\n## Configuración\n\n### Configuración de Compilación\n\nNetlify detecta automáticamente la configuración, pero puede personalizarla:\n\n| Configuración | Valor |\n|---------------|-------|\n| Comando de compilación | `npm run build:export` |\n| Directorio de publicación | `out` |\n| Versión de Node | 20 (establecida en `netlify.toml`) |\n\n### Variables de Entorno\n\nAgregue variables de entorno en el panel de Netlify:\n\n\u003cSteps\u003e\n  \u003cStep title=\"Ir a Configuración del Sitio\"\u003e\n    Haga clic en su sitio → Site settings → Environment variables\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Agregar Variables\"\u003e\n```\nMEILISEARCH_HOST=https://search.example.com\nMEILISEARCH_API_KEY=su-clave-de-busqueda\nNEXT_PUBLIC_GA_ID=G-XXXXXXXXXX\n```\n\n\u003cCallout type=\"tip\"\u003e\nLas variables que comienzan con `NEXT_PUBLIC_` están expuestas al navegador. Mantenga las claves confidenciales sin este prefijo.\n\u003c/Callout\u003e\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Volver a Implementar\"\u003e\n    Vaya a Deploys → Trigger deploy → Deploy site\n  \u003c/Step\u003e\n\u003c/Steps\u003e\n\n## Dominio Personalizado\n\nAgregue su propio dominio a su sitio Netlify:\n\n\u003cSteps\u003e\n  \u003cStep title=\"Agregar Dominio\"\u003e\n    1. Vaya a Domain settings\n    2. Haga clic en \"Add custom domain\"\n    3. Ingrese su dominio (por ejemplo, `docs.ejemplo.com`)\n    4. Haga clic en \"Verify\"\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Configurar DNS\"\u003e\n    **Opción 1: Usar DNS de Netlify (Recomendado)**\n    - Apunte los servidores de nombres de su dominio a Netlify\n    - Netlify administra todos los registros DNS\n    - Certificado SSL automático\n\n**Opción 2: Usar DNS Externo**\n\nPara subdominio:\n```\nTipo: CNAME\nNombre: docs\nValor: su-sitio.netlify.app\n```\n\nPara dominio ápice:\n```\nTipo: A\nNombre: @\nValor: 75.2.60.5\n```\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Habilitar HTTPS\"\u003e\n    Netlify aprovisiona automáticamente un certificado SSL de Let's Encrypt.\n\n    Verifique Domain settings → HTTPS para ver el estado.\n  \u003c/Step\u003e\n\u003c/Steps\u003e\n\n## Vistas Previas de Implementación\n\nNetlify crea implementaciones de vista previa para cada solicitud de extracción:\n\n**Lo que obtiene:**\n- URL única para cada PR\n- Actualizaciones automáticas cuando envía\n- Enlace de vista previa de implementación en comentarios de PR\n- Perfecto para revisar cambios\n\n### Configurar Vistas Previas de Implementación\n\nControle cuándo se crean las vistas previas:\n\n```toml\n[context.deploy-preview]\n  command = \"npm run build:export\"\n\n[context.branch-deploy]\n  command = \"npm run build:export\"\n```\n\n## Características Avanzadas\n\n### Reglas de Redirección\n\nAgregue redirecciones en `netlify.toml`:\n\n```toml\n# Redirigir URL antiguas\n[[redirects]]\n  from = \"/old-page\"\n  to = \"/new-page\"\n  status = 301\n\n# Reserva SPA\n[[redirects]]\n  from = \"/*\"\n  to = \"/index.html\"\n  status = 200\n\n# Redirecciones basadas en el país\n[[redirects]]\n  from = \"/docs\"\n  to = \"/en/docs\"\n  status = 302\n  conditions = {Country = [\"US\"]}\n```\n\n### Encabezados\n\nAgregue encabezados personalizados:\n\n```toml\n[[headers]]\n  for = \"/*\"\n  [headers.values]\n    X-Frame-Options = \"DENY\"\n    X-XSS-Protection = \"1; mode=block\"\n    Content-Security-Policy = \"default-src 'self'\"\n\n[[headers]]\n  for = \"/assets/*\"\n  [headers.values]\n    Cache-Control = \"public, max-age=31536000, immutable\"\n```\n\n### Funciones Perimetrales\n\nEjecute código en el perímetro para funcionalidad dinámica:\n\nCree `netlify/edge-functions/hello.ts`:\n\n```typescript\nexport default async (request: Request) =\u003e {\n  return new Response(\"¡Hola desde el borde!\")\n}\n\nexport const config = {\n  path: \"/api/hello\"\n}\n```\n\n### Pruebas Divididas\n\nPruebe diferentes versiones de sus documentos:\n\n1. Vaya a Split testing\n2. Haga clic en \"Start a test\"\n3. Seleccione ramas para comparar\n4. Establezca la división de tráfico (por ejemplo, 50/50)\n\nGenial para probar nuevos diseños o contenido de documentación.\n\n## Complementos de Compilación\n\nAmplíe su compilación con complementos de Netlify:\n\n```toml\n[[plugins]]\n  package = \"@netlify/plugin-lighthouse\"\n\n[[plugins]]\n  package = \"netlify-plugin-checklinks\"\n```\n\nInstalar complementos:\n\n```bash\nnpm install -D @netlify/plugin-lighthouse netlify-plugin-checklinks\n```\n\n## Contextos de Implementación\n\nDiferentes configuraciones para diferentes ramas:\n\n```toml\n# Producción (rama main)\n[context.production]\n  command = \"npm run build:export\"\n  [context.production.environment]\n    NODE_ENV = \"production\"\n\n# Rama de staging\n[context.staging]\n  command = \"npm run build:export\"\n  [context.staging.environment]\n    NODE_ENV = \"staging\"\n\n# Vistas previas de implementación (PRs)\n[context.deploy-preview]\n  command = \"npm run build:export -- --debug\"\n```\n\n## Optimización de Rendimiento\n\n### Optimización de Activos\n\nNetlify optimiza automáticamente:\n- Compresión de imagen\n- Minificación de paquetes\n- Compresión Brotli\n\nHabilite esto en Build \u0026 deploy → Post processing.\n\n### Almacenamiento en Caché\n\nConfigure encabezados de caché:\n\n```toml\n[[headers]]\n  for = \"/_next/static/*\"\n  [headers.values]\n    Cache-Control = \"public, max-age=31536000, immutable\"\n\n[[headers]]\n  for = \"/images/*\"\n  [headers.values]\n    Cache-Control = \"public, max-age=604800\"\n```\n\n### Pre-renderizado\n\nPara un mejor SEO, habilite el pre-renderizado:\n\n```toml\n[[plugins]]\n  package = \"@netlify/plugin-nextjs\"\n```\n\n## Formularios\n\nAgregue formularios a su documentación:\n\n```html\n\u003cform name=\"contact\" method=\"POST\" data-netlify=\"true\"\u003e\n  \u003cinput type=\"text\" name=\"name\" /\u003e\n  \u003cinput type=\"email\" name=\"email\" /\u003e\n  \u003ctextarea name=\"message\"\u003e\u003c/textarea\u003e\n  \u003cbutton type=\"submit\"\u003eEnviar\u003c/button\u003e\n\u003c/form\u003e\n```\n\nNetlify maneja automáticamente los envíos de formularios. Vea las respuestas en la pestaña Forms.\n\n## Análisis\n\nHabilite Netlify Analytics para obtener información sobre los visitantes:\n\n1. Vaya a la pestaña Analytics\n2. Haga clic en \"Enable Analytics\"\n3. Cuesta $9/mes (opcional)\n\nMuestra:\n- Vistas de página\n- Páginas principales\n- Fuentes de tráfico\n- Datos geográficos\n\n## Integración CI/CD\n\n### GitHub Actions + Netlify\n\nImplemente desde GitHub Actions para tener más control:\n\n```yaml\nname: Deploy to Netlify\n\non:\n  push:\n    branches: [main]\n\njobs:\n  deploy:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n\n      - name: Setup Node\n        uses: actions/setup-node@v4\n        with:\n          node-version: '20'\n\n      - name: Install dependencies\n        run: npm ci\n\n      - name: Build\n        run: npm run build:export\n\n      - name: Deploy to Netlify\n        uses: nwtgck/actions-netlify@v2\n        with:\n          publish-dir: './out'\n          production-deploy: true\n        env:\n          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}\n          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}\n```\n\nObtenga su token de autenticación y su ID de sitio desde el panel de Netlify.\n\n## Solución de Problemas\n\n### La Compilación Falla\n\n**Ver registros de compilación:**\n- Vaya a Deploys\n- Haga clic en implementación fallida\n- Ver registro de implementación\n\n**Problemas comunes:**\n- Falta de coincidencia de versión de Node (establecer en `netlify.toml`)\n- Dependencias faltantes (use `npm ci` no `npm install`)\n- Variables de entorno no establecidas\n\n### Activos 404\n\nAsegúrese de que `netlify.toml` tenga la redirección SPA:\n\n```toml\n[[redirects]]\n  from = \"/*\"\n  to = \"/index.html\"\n  status = 200\n```\n\n### Las Funciones No Funcionan\n\nVerifique los registros de funciones:\n1. Vaya a la pestaña Functions\n2. Haga clic en su función\n3. Ver registros\n\nAsegúrese de que la ruta de la función coincida con la configuración:\n\n```typescript\nexport const config = {\n  path: \"/api/hello\"  // Debe coincidir con su ruta\n}\n```\n\n### Problemas de SSL de Dominio Personalizado\n\n- Espere 24 horas para la propagación de DNS\n- Verifique los registros DNS con `dig` o `nslookup`\n- Verifique el estado HTTPS en Domain settings\n- Intente volver a aprovisionar el certificado\n\n## Reversiones\n\nRevierta instantáneamente a una implementación anterior:\n\n1. Vaya a Deploys\n2. Encuentre la versión que funciona\n3. Haga clic en \"Publish deploy\"\n\nSu sitio se revierte inmediatamente. Sin esperar compilaciones.\n\n## Monitoreo\n\n### Notificaciones de Implementación\n\nReciba notificaciones cuando las implementaciones tengan éxito o fallen:\n\n1. Vaya a Site settings → Build \u0026 deploy → Deploy notifications\n2. Agregue notificación (Correo electrónico, Slack, webhook)\n3. Elija eventos (implementación iniciada, exitosa, fallida)\n\n### Insignia de Estado\n\nAgregue una insignia de estado de implementación a su README:\n\n```markdown\n[![Netlify Status](https://api.netlify.com/api/v1/badges/SITE_ID/deploy-status)](https://app.netlify.com/sites/SITE_NAME/deploys)\n```\n\n## Precios\n\nEl nivel gratuito de Netlify incluye:\n- 300 minutos de compilación/mes\n- 100GB de ancho de banda/mes\n- Sitios ilimitados\n- Vistas previas de implementación\n- HTTPS\n- Formularios (100 envíos/mes)\n\nActualice a Pro ($19/mes) para:\n- Más ancho de banda y minutos de compilación\n- Análisis\n- Colaboración en equipo\n- Soporte prioritario\n\n## Mejores Prácticas\n\n**Usar `netlify.toml`** - Control de versiones de su configuración de compilación\n\n**Habilitar vistas previas de implementación** - Revisar cambios antes de fusionar\n\n**Configurar notificaciones** - Saber inmediatamente cuando fallan las implementaciones\n\n**Usar variables de entorno** - Mantener secretos fuera del código\n\n**Configurar redirecciones** - Manejar cambios de URL correctamente\n\n**Monitorear análisis** - Comprender cómo los usuarios navegan por sus documentos\n\n**Probar localmente** - Ejecutar `npm run build:export \u0026\u0026 npx serve out` primero\n\n## Próximos Pasos\n\n\u003cCardGrid cols={2}\u003e\n  \u003cCard\n    icon=\"triangle\"\n    title=\"Vercel\"\n    description=\"Implementar en Vercel en su lugar\"\n    href=\"/docs/v1.0.0/deployment/vercel\"\n  /\u003e\n  \u003cCard\n    icon=\"github\"\n    title=\"GitHub Pages\"\n    description=\"Alojamiento gratuito con GitHub Pages\"\n    href=\"/docs/v1.0.0/deployment/github-pages\"\n  /\u003e\n  \u003cCard\n    icon=\"arrow-left\"\n    title=\"Descripción General de Implementación\"\n    description=\"Ver todas las opciones de implementación\"\n    href=\"/docs/v1.0.0/deployment/overview\"\n  /\u003e\n  \u003cCard\n    icon=\"zap\"\n    title=\"Rendimiento\"\n    description=\"Optimizar su documentación\"\n    href=\"/docs/v1.0.0/performance\"\n  /\u003e\n\u003c/CardGrid\u003e\n"])</script><script>self.__next_f.push([1,"3b:T139a,"])</script><script>self.__next_f.push([1,"\n## Características de contenido\n\n### Soporte MDX\n\nEscriba documentación en MDX: Markdown con componentes React integrados.\n\n```mdx\n# Hola Mundo\n\n¡Esto es **Markdown** con un \u003cBadge variant=\"success\"\u003ecomponente React\u003c/Badge\u003e!\n```\n\n\u003cCallout type=\"tip\"\u003e\nMDX le permite crear documentación interactiva y dinámica que va más allá del texto estático.\n\u003c/Callout\u003e\n\n### Resaltado de sintaxis\n\nLos bloques de código obtienen automáticamente resaltado de sintaxis con números de línea:\n\n```typescript\ninterface User {\n  id: string;\n  name: string;\n  email: string;\n}\n\nfunction greetUser(user: User): string {\n  return `Hello, ${user.name}!`;\n}\n```\n\nLos lenguajes admitidos incluyen JavaScript, TypeScript, Python, Bash, JSON, CSS y muchos más.\n\n### Ecuaciones matemáticas\n\nRenderice ecuaciones matemáticas usando KaTeX:\n\nEn línea: \u003cMath\u003e{\"E = mc^2\"}\u003c/Math\u003e\n\nBloque:\n\u003cMath block\u003e\n  {\"\\\\int_{-\\\\infty}^{\\\\infty} e^{-x^2} dx = \\\\sqrt{\\\\pi}\"}\n\u003c/Math\u003e\n\n### Diagramas Mermaid\n\nCree diagramas a partir de texto usando Mermaid:\n\n\u003cMermaid\n  chart={`\n    graph LR\n      A[Escribir MDX] --\u003e B[Construir]\n      B --\u003e C[Desplegar]\n      C --\u003e D[Usuarios leen Docs]\n  `}\n  caption=\"Flujo de trabajo de documentación\"\n/\u003e\n\n## Características de navegación\n\n### Barra lateral automática\n\nLa barra lateral se genera automáticamente a partir de su estructura de carpetas. Use `_category_.json` para personalizar:\n\n```json\n{\n  \"label\": \"Guías\",\n  \"position\": 2,\n  \"collapsible\": true,\n  \"collapsed\": false\n}\n```\n\n### Tabla de contenidos\n\nSe genera automáticamente una tabla de contenidos flotante a partir de sus encabezados. Resalta la sección actual a medida que se desplaza.\n\n### Migas de pan\n\nLa navegación por migas de pan ayuda a los usuarios a comprender su ubicación en la jerarquía de documentación.\n\n### Selector de versiones\n\nSoporte para múltiples versiones de documentación con cambio fácil:\n\n- `/docs/v1.0.0/getting-started`\n- `/docs/v2.0.0/getting-started`\n- `/docs/next/getting-started` (no publicado)\n\n## Búsqueda\n\n### Búsqueda de texto completo\n\nImpulsado por Meilisearch para resultados de búsqueda instantáneos y tolerantes a errores tipográficos.\n\n- **Atajo de teclado**: Presione `⌘K` o `Ctrl+K` para abrir la búsqueda\n- **Tolerancia a errores tipográficos**: Encuentra resultados incluso con errores ortográficos\n- **Resultados resaltados**: Vea dónde coincide su consulta\n\n### Indexación de búsqueda\n\nLa documentación se indexa automáticamente en tiempo de compilación para una búsqueda rápida.\n\n## Tema y estilo\n\n### Modo oscuro\n\nModo oscuro automático que respeta las preferencias del sistema:\n\n- Modo claro\n- Modo oscuro\n- Preferencia del sistema (auto)\n\nCambie con el botón en el encabezado.\n\n### Diseño personalizable\n\nTodo el estilo se basa en variables CSS y Tailwind, lo que facilita la personalización:\n\n```css\n:root {\n  --primary: oklch(0.55 0.22 264.376);\n  --background: oklch(1 0 0);\n  --foreground: oklch(0.145 0 0);\n}\n```\n\n## Componentes\n\n### Biblioteca rica de componentes\n\nComponentes integrados para patrones de documentación comunes:\n\n\u003cCardGrid cols={3}\u003e\n  \u003cCard icon=\"message-square\" title=\"Callouts\" description=\"Alertas de información, advertencia, consejo, error\" /\u003e\n  \u003cCard icon=\"layers\" title=\"Pestañas\" description=\"Secciones de contenido con pestañas\" /\u003e\n  \u003cCard icon=\"list\" title=\"Pasos\" description=\"Guías paso a paso\" /\u003e\n  \u003cCard icon=\"chevrons-up-down\" title=\"Acordeón\" description=\"Contenido plegable\" /\u003e\n  \u003cCard icon=\"grid\" title=\"Tarjetas\" description=\"Tarjetas de características con iconos\" /\u003e\n  \u003cCard icon=\"code\" title=\"Bloques de código\" description=\"Código con resaltado de sintaxis\" /\u003e\n\u003c/CardGrid\u003e\n\nVea la sección [Componentes](/docs/v1.0.0/components) para documentación sobre cada componente.\n\n## Experiencia del desarrollador\n\n### Recarga en caliente\n\nLos cambios en los archivos MDX se reflejan instantáneamente sin una actualización completa de la página.\n\n### Validación de Frontmatter\n\nLos campos de Frontmatter se validan en tiempo de compilación para detectar errores temprano.\n\n### Optimización SEO\n\nEtiquetas meta automáticas, imágenes OpenGraph y datos estructurados de frontmatter:\n\n- Etiquetas de título y descripción\n- Tarjetas OpenGraph y Twitter\n- URLs canónicas\n- Generación de mapa del sitio\n\n### Tiempo de lectura\n\nCálculo automático y visualización del tiempo de lectura estimado para cada página.\n\n## Características de producción\n\n### Generación estática\n\nTodas las páginas se pre-renderizan en tiempo de compilación para un rendimiento máximo:\n\n- Cero JavaScript requerido para contenido\n- Compatible con almacenamiento en caché en el borde\n- Rápido tiempo hasta el primer byte (TTFB)\n\n### Rendimiento\n\n- Puntuación Lighthouse: 90+ (escritorio)\n- Imágenes cargadas de forma diferida con Next.js Image\n- División de código para componentes\n\n### Accesibilidad\n\n- Navegación por teclado\n- Soporte para lectores de pantalla\n- Soporte de alto contraste\n- Gestión de foco\n"])</script><script>self.__next_f.push([1,"3c:T139a,"])</script><script>self.__next_f.push([1,"\n## Características de contenido\n\n### Soporte MDX\n\nEscriba documentación en MDX: Markdown con componentes React integrados.\n\n```mdx\n# Hola Mundo\n\n¡Esto es **Markdown** con un \u003cBadge variant=\"success\"\u003ecomponente React\u003c/Badge\u003e!\n```\n\n\u003cCallout type=\"tip\"\u003e\nMDX le permite crear documentación interactiva y dinámica que va más allá del texto estático.\n\u003c/Callout\u003e\n\n### Resaltado de sintaxis\n\nLos bloques de código obtienen automáticamente resaltado de sintaxis con números de línea:\n\n```typescript\ninterface User {\n  id: string;\n  name: string;\n  email: string;\n}\n\nfunction greetUser(user: User): string {\n  return `Hello, ${user.name}!`;\n}\n```\n\nLos lenguajes admitidos incluyen JavaScript, TypeScript, Python, Bash, JSON, CSS y muchos más.\n\n### Ecuaciones matemáticas\n\nRenderice ecuaciones matemáticas usando KaTeX:\n\nEn línea: \u003cMath\u003e{\"E = mc^2\"}\u003c/Math\u003e\n\nBloque:\n\u003cMath block\u003e\n  {\"\\\\int_{-\\\\infty}^{\\\\infty} e^{-x^2} dx = \\\\sqrt{\\\\pi}\"}\n\u003c/Math\u003e\n\n### Diagramas Mermaid\n\nCree diagramas a partir de texto usando Mermaid:\n\n\u003cMermaid\n  chart={`\n    graph LR\n      A[Escribir MDX] --\u003e B[Construir]\n      B --\u003e C[Desplegar]\n      C --\u003e D[Usuarios leen Docs]\n  `}\n  caption=\"Flujo de trabajo de documentación\"\n/\u003e\n\n## Características de navegación\n\n### Barra lateral automática\n\nLa barra lateral se genera automáticamente a partir de su estructura de carpetas. Use `_category_.json` para personalizar:\n\n```json\n{\n  \"label\": \"Guías\",\n  \"position\": 2,\n  \"collapsible\": true,\n  \"collapsed\": false\n}\n```\n\n### Tabla de contenidos\n\nSe genera automáticamente una tabla de co edeterminada)\n- Funciona de inmediato\n- Sin dependencias externas\n- Bueno para sitios de documentación pequeños a medianos\n- Busca en el navegador\n\n**MeiliSearch** (Recomendado para producción)\n- Motor de búsqueda ultrarrápido\n- Tolerancia a errores tipográficos\n- Resultados instantáneos\n- Mejor para sitios de documentación grandes\n- Requiere servidor separado\n\n## Inicio rápido con MeiliSearch\n\n### Requisitos previos\n\n- Docker (configuración más fácil) o capacidad para ejecutar un servidor MeiliSearch\n- Su sitio de documentación ya configurado con Specra\n\n### Instalación\n\n\u003cSteps\u003e\n  \u003cStep title=\"Ejecutar MeiliSearch con Docker\"\u003e\n    La forma más fácil de ejecutar MeiliSearch localmente:\n\n```bash\ndocker run -d \\\n  --name meilisearch \\\n  -p 7700:7700 \\\n  -e MEILI_MASTER_KEY=\"aSampleMasterKey\" \\\n  -v $(pwd)/meili_data:/meili_data \\\n  getmeili/meilisearch:latest\n```\n\nEsto inicia MeiliSearch en `http://localhost:7700` con una clave maestra para autenticación.\n\n\u003cCallout type=\"warning\"\u003e\n  ¡Use una clave maestra fuerte en producción! Esta clave de ejemplo es solo para desarrollo.\n\u003c/Callout\u003e\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Configurar Specra\"\u003e\n    Actualice su `specra.config.json`:\n\n```json\n{\n  \"search\": {\n    \"enabled\": true,\n    \"provider\": \"meilisearch\",\n    \"placeholder\": \"Buscar documentación...\",\n    \"meilisearch\": {\n      \"host\": \"http://localhost:7700\",\n      \"apiKey\": \"aSampleMasterKey\",\n      \"indexName\": \"docs\"\n    }\n  }\n}\n```\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Indexar su contenido\"\u003e\n    Specra incluye utilidades de indexación. Ejecute esto desde la raíz de su proyecto:\n\n```bash\nnpm run index:search\n```\n\nEsto escanea su carpeta `docs/` y envía todo el contenido a MeiliSearch para indexación.\n\n\u003cCallout type=\"info\"\u003e\n  Vuelva a ejecutar el comando de indexación cada vez que agregue o actualice documentación.\n\u003c/Callout\u003e\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Probar búsqueda\"\u003e\n    Inicie su servidor de desarrollo:\n\n```bash\nnpm run dev\n```\n\nPresione **⌘K** (Mac) o **Ctrl+K** (Windows/Linux) para abrir el modal de búsqueda. ¡Comience a escribir para ver resultados instantáneos!\n  \u003c/Step\u003e\n\u003c/Steps\u003e\n\n## Configuración de MeiliSearch\n\n### Opciones de configuración\n\nTodas las configuraciones de MeiliSearch van en `specra.config.json` bajo la sección `search`:\n\n```json\n{\n  \"search\": {\n    \"enabled\": true,\n    \"provider\": \"meilisearch\",\n    \"placeholder\": \"Buscar docs...\",\n    \"meilisearch\": {\n      \"host\": \"http://localhost:7700\",\n      \"apiKey\": \"your-api-key\",\n      \"indexName\": \"docs\"\n    }\n  }\n}\n```\n\n**Referencia de campos:**\n\n| Campo | Tipo | Descripción |\n|-------|------|-------------|\n| `enabled` | boolean | Habilitar/deshabilitar función de búsqueda |\n| `provider` | string | \"meilisearch\" o \"local\" |\n| `placeholder` | string | Texto de marcador de posición en cuadro de búsqueda |\n| `meilisearch.host` | string | URL del servidor MeiliSearch |\n| `meilisearch.apiKey` | string | Clave API para autenticación |\n| `meilisearch.indexName` | string | Nombre del índice para sus documentos |\n\n### Clave de búsqueda vs Clave maestra\n\nMeiliSearch usa dos tipos de claves:\n\n**Clave maestra** (desarrollo)\n- Acceso completo a todas las operaciones\n- Usado para indexar contenido\n- Nunca exponer en código del lado del cliente en producción\n\n**Clave de búsqueda** (producción)\n- Acceso de solo lectura\n- Seguro para usar en el navegador\n- Generar desde clave maestra\n\nGenere una clave de búsqueda:\n\n```bash\ncurl -X POST 'http://localhost:7700/keys' \\\n  -H 'Authorization: Bearer aSampleMasterKey' \\\n  -H 'Content-Type: application/json' \\\n  --data-binary '{\n    \"description\": \"Clave de búsqueda para documentación\",\n    \"actions\": [\"search\"],\n    \"indexes\": [\"docs\"],\n    \"expiresAt\": null\n  }'\n```\n\nUse la clave devuelta en su configuración de producción.\n\n## Despliegue de producción\n\n### Alojamiento de MeiliSearch\n\nPara producción, necesita alojar MeiliSearch por separado de sus documentos. Opciones:\n\n**MeiliSearch Cloud** (Más fácil)\n- Alojamiento gestionado oficial\n- Comienza en $0.02/hora\n- Copias de seguridad y actualizaciones automáticas\n- Visite [meilisearch.com/cloud](https://www.meilisearch.com/cloud)\n\n**Autoalojado en VPS**\n- DigitalOcean, AWS, Google Cloud, etc.\n- Más control, requiere mantenimiento\n- Use Docker o instalación binaria\n\n**Railway / Render / Fly.io**\n- Opciones de despliegue de un clic disponibles\n- Bueno para proyectos pequeños a medianos\n\n### Configuración de producción\n\nActualice `specra.config.json` para producción:\n\n```json\n{\n  \"search\": {\n    \"enabled\": true,\n    \"provider\": \"meilisearch\",\n    \"meilisearch\": {\n      \"host\": \"https://your-meilisearch-domain.com\",\n      \"apiKey\": \"your-public-search-key\",\n      \"indexName\": \"docs\"\n    }\n  }\n}\n```\n\n\u003cCallout type=\"warning\"\u003e\n  ¡Use siempre una clave API de solo búsqueda en producción, nunca su clave maestra!\n\u003c/Callout\u003e\n\n### Indexación en CI/CD\n\nAutomatice la indexación cuando despliegue. Ejemplo de GitHub Action:\n\n```yaml\nname: Index Documentation\n\non:\n  push:\n    branches: [main]\n    paths:\n      - 'docs/**'\n\njobs:\n  index:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v3\n\n      - name: Setup Node.js\n        uses: actions/setup-node@v3\n        with:\n          node-version: '18'\n\n      - name: Install dependencies\n        run: npm ci\n\n      - name: Index documentation\n        env:\n          MEILISEARCH_HOST: ${{ secrets.MEILISEARCH_HOST }}\n          MEILISEARCH_API_KEY: ${{ secrets.MEILISEARCH_MASTER_KEY }}\n        run: npm run index:search\n```\n\nAlmacene sus credenciales de MeiliSearch como secretos de GitHub.\n\n## Personalización del comportamiento de búsqueda\n\n### Configuración de búsqueda\n\nConfigure cómo MeiliSearch maneja las búsquedas:\n\n```javascript\n// En su script de indexación\nconst settings = {\n  searchableAttributes: [\n    'title',\n    'description',\n    'content',\n    'headings'\n  ],\n  displayedAttributes: [\n    'title',\n    'description',\n    'url',\n    'breadcrumb'\n  ],\n  rankingRules: [\n    'words',\n    'typo',\n    'proximity',\n    'attribute',\n    'sort',\n    'exactness'\n  ],\n  stopWords: ['the', 'a', 'an'],\n  synonyms: {\n    'js': ['javascript'],\n    'ts': ['typescript']\n  }\n}\n```\n\n### Filtros\n\nAgregue filtros para reducir resultados de búsqueda:\n\n```json\n{\n  \"search\": {\n    \"meilisearch\": {\n      \"filters\": \"version = 'v1.0.0'\"\n    }\n  }\n}\n```\n\nEsto solo muestra resultados de una versión específica.\n\n## Búsqueda local (Alternativa)\n\nSi no desea ejecutar MeiliSearch, use búsqueda local:\n\n```json\n{\n  \"search\": {\n    \"enabled\": true,\n    \"provider\": \"local\",\n    \"placeholder\": \"Buscar documentación...\"\n  }\n}\n```\n\nBúsqueda local:\n- ✅ Funciona inmediatamente, sin configuración\n- ✅ Sin dependencias externas\n- ✅ Gratis\n- ❌ Menos potente que MeiliSearch\n- ❌ Sin tolerancia a errores tipográficos\n- ❌ Más lento para sitios de documentación grandes\n\nLa búsqueda local se genera automáticamente durante `npm run build`.\n\n## Atajos de teclado\n\nLos usuarios pueden activar la búsqueda con:\n\n- **⌘K** o **Ctrl+K** - Abrir búsqueda\n- **Escape** - Cerrar búsqueda\n- **↑↓** - Navegar resultados\n- **Enter** - Ir al resultado seleccionado\n\nEstos funcionan con ambas opciones, local y MeiliSearch.\n\n## Solución de problemas\n\n### La búsqueda no aparece\n\n**Verifique configuración:**\n```json\n{\n  \"search\": {\n    \"enabled\": true  // ← Debe ser true\n  }\n}\n```\n\n**Verifique que MeiliSearch esté ejecutándose:**\n```bash\ncurl http://localhost:7700/health\n```\n\nDebería devolver `{\"status\":\"available\"}`.\n\n### Sin resultados de búsqueda\n\n**Reindexe su contenido:**\n```bash\nnpm run index:search\n```\n\n**Verifique que el índice existe:**\n```bash\ncurl -X GET 'http://localhost:7700/indexes' \\\n  -H 'Authorization: Bearer aSampleMasterKey'\n```\n\n### Errores CORS\n\nSi obtiene errores CORS en la consola del navegador, configure MeiliSearch para permitir su dominio:\n\n```bash\ndocker run -d \\\n  --name meilisearch \\\n  -p 7700:7700 \\\n  -e MEILI_MASTER_KEY=\"aSampleMasterKey\" \\\n  -e MEILI_HTTP_ADDR=\"0.0.0.0:7700\" \\\n  -e MEILI_NO_ANALYTICS=true \\\n  getmeili/meilisearch:latest\n```\n\nO establezca encabezados CORS en su proxy inverso.\n\n### Indexación lenta\n\nPara sitios de documentación grandes (1000+ páginas):\n\n- Indexe incrementalmente (solo archivos cambiados)\n- Use solicitudes por lotes\n- Aumente la asignación de memoria de MeiliSearch\n- Ejecute indexación en trabajos en segundo plano\n"])</script><script>self.__next_f.push([1,"3e:T2237,"])</script><script>self.__next_f.push([1,"\n# Configuración de la búsqueda\n\nSpecra admite una potente búsqueda de texto completo a través de la integración de MeiliSearch. Esta guía le muestra cómo configurar la búsqueda para su documentación.\n\n## Opciones de búsqueda\n\nSpecra ofrece dos soluciones de búsqueda:\n\n**Búsqueda local** (Predeterminada)\n- Funciona de inmediato\n- Sin dependencias externas\n- Bueno para sitios de documentación pequeños a medianos\n- Busca en el navegador\n\n**MeiliSearch** (Recomendado para producción)\n- Motor de búsqueda ultrarrápido\n- Tolerancia a errores tipográficos\n- Resultados instantáneos\n- Mejor para sitios de documentación grandes\n- Requiere servidor separado\n\n## Inicio rápido con MeiliSearch\n\n### Requisitos previos\n\n- Docker (configuración más fácil) o capacidad para ejecutar un servidor MeiliSearch\n- Su sitio de documentación ya configurado con Specra\n\n###
