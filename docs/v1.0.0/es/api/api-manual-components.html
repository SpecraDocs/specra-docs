ps://jsonplaceholder.typicode.com/) es una API REST falsa gratuita para pruebas y creación de prototipos. Es perfecto para:\n\n- Probar herramientas de documentación de API (¡como esta!)\n- Desarrollo frontend\n- Aprender métodos HTTP\n- Prototipar aplicaciones\n\n\u003cCallout type=\"success\" title=\"Consejo Pro\"\u003e\n¡Intente modificar el cuerpo de la solicitud en los puntos finales POST/PUT/PATCH y vea cambiar la respuesta!\n\u003c/Callout\u003e\n\n## Ejemplo de integración\n\nAsí es como podría usar esta API en una aplicación real:\n\n```javascript\n// Obtener todas las publicaciones\nasync function getPosts() {\n  const response = await fetch('https://jsonplaceholder.typicode.com/posts?_limit=5');\n  const posts = await response.json();\n  return posts;\n}\n\n// Crear una nueva publicación\nasync function createPost(title, body) {\n  const response = await fetch('https://jsonplaceholder.typicode.com/posts', {\n    method: 'POST',\n    headers: { 'Content-Type': 'application/json' },\n    body: JSON.stringify({\n      title,\n      body,\n      userId: 1\n    })\n  });\n  return await response.json();\n}\n\n// Uso\nconst posts = await getPosts();\nconsole.log(posts);\n\nconst newPost = await createPost('My Title', 'My Content');\nconsole.log(newPost);\n```\n\n## Próximos pasos\n\n- Eche un vistazo al [ejemplo de documentación de API manual](/docs/v1.0.0/api-example)\n- Aprenda sobre [crear su propia especificación de API](/docs/v1.0.0/api-auto-generated)\n- Lea la [Guía completa de documentación de API](/API_DOCUMENTATION.md)\n"])</script><script>self.__next_f.push([1,"2c:T8ed,"])</script><script>self.__next_f.push([1,"\nEsta página demuestra el componente `\u003cApiReference\u003e` usando una API pública real ([JSONPlaceholder](https://jsonplaceholder.typicode.com/)).\n\n¡Todos los puntos finales a continuación son **totalmente funcionales** y se pueden probar usando el playground interactivo!\n\n\u003cCallout type=\"info\"\u003e\nEsta API es gratuita y no requiere autenticación. ¡Perfecto para probar!\n\u003c/Callout\u003e\n\n---\n\n\u003cApiReference spec=\"/api-specs/test-api.json\" showPlayground={true} /\u003e\n\n---\n\n## Pruébelo usted mismo\n\n1. **Expanda cualquier punto final** haciendo clic en él\n2. **Desplácese hasta el playground** en la parte inferior de cada punto final\n3. **Haga clic en \"Enviar solicitud\"** para probar la API en vivo\n4. **Ver la respuesta** en el visor JSON\n\n## Sobre JSONPlaceholder\n\n[JSONPlaceholder](https://jsonplaceholder.typicode.com/) es una API REST falsa gratuita para pruebas y creación de prototipos. Es perfecto para:\n\n- Probar herramientas de documentación de API (¡como esta!)\n- Desarrollo frontend\n- Aprender métodos HTTP\n- Prototipar aplicaciones\n\n\u003cCallout type=\"success\" title=\"Consejo Pro\"\u003e\n¡Intente modificar el cuerpo de la solicitud en los puntos finales POST/PUT/PATCH y vea cambiar la respuesta!\n\u003c/Callout\u003e\n\n## Ejemplo de integración\n\nAsí es como podría usar esta API en una aplicación real:\n\n```javascript\n// Obtener todas las publicaciones\nasync function getPosts() {\n  const response = await fetch('https://jsonplaceholder.typicode.com/posts?_limit=5');\n  const posts = await response.json();\n  return posts;\n}\n\n// Crear una nueva publicación\nasync function createPost(title, body) {\n  const response = await fetch('https://jsonplaceholder.typicode.com/posts', {\n    method: 'POST',\n    headers: { 'Content-Type': 'application/json' },\n    body: JSON.stringify({\n      title,\n      body,\n      userId: 1\n    })\n  });\n  return await response.json();\n}\n\n// Uso\nconst posts = await getPosts();\nconsole.log(posts);\n\nconst newPost = await createPost('My Title', 'My Content');\nconsole.log(newPost);\n```\n\n## Próximos pasos\n\n- Eche un vistazo al [ejemplo de documentación de API manual](/docs/v1.0.0/api-example)\n- Aprenda sobre [crear su propia especificación de API](/docs/v1.0.0/api-auto-generated)\n- Lea la [Guía completa de documentación de API](/API_DOCUMENTATION.md)\n"])</script><script>self.__next_f.push([1,"2d:T2883,"])</script><script>self.__next_f.push([1,"\n# Configuración de Navegación\n\nLa sección `navigation` controla cómo los usuarios se mueven a través de su documentación. Configure la barra lateral, las migas de pan, la tabla de contenido y los grupos de pestañas para crear una experiencia de navegación intuitiva.\n\n## Configuración Básica\n\nAquí hay una configuración de navegación mínima:\n\n```json\n{\n  \"navigation\": {\n    \"showSidebar\": true,\n    \"showBreadcrumbs\": true,\n    \"showTableOfContents\": true\n  }\n}\n```\n\nSpecra proporciona valores predeterminados sensatos, por lo que solo necesita configurar lo que desea cambiar.\n\n## Configuración Completa\n\n```json\n{\n  \"navigation\": {\n    \"showSidebar\": true,\n    \"collapsibleSidebar\": true,\n    \"showBreadcrumbs\": true,\n    \"showTableOfContents\": true,\n    \"tocPosition\": \"right\",\n    \"tocMaxDepth\": 3,\n    \"tabGroups\": [\n      {\n        \"id\": \"guides\",\n        \"label\": \"Guías\",\n        \"icon\": \"book-open\"\n      },\n      {\n        \"id\": \"api\",\n        \"label\": \"Referencia API\",\n        \"icon\": \"zap\"\n      },\n      {\n        \"id\": \"components\",\n        \"label\": \"Componentes\",\n        \"icon\": \"layers\"\n      }\n    ]\n  }\n}\n```\n\n## Configuración de la Barra Lateral\n\n### showSidebar\n\n**Tipo:** `boolean`\n**Predeterminado:** `true`\n\nMostrar u ocultar la navegación de la barra lateral.\n\n```json\n{\n  \"navigation\": {\n    \"showSidebar\": true\n  }\n}\n```\n\nEstablezca en `false` para ocultar la barra lateral completamente. Útil para páginas de destino o sitios de marketing.\n\n### collapsibleSidebar\n\n**Tipo:** `boolean`\n**Predeterminado:** `true`\n\nPermitir a los usuarios contraer y expandir secciones de la barra lateral.\n\n```json\n{\n  \"navigation\": {\n    \"collapsibleSidebar\": true\n  }\n}\n```\n\nCuando es `true`, las secciones de carpeta tienen flechas para contraer/expandir. Cuando es `false`, todas las secciones están siempre expandidas.\n\n## Migas de Pan (Breadcrumbs)\n\n### showBreadcrumbs\n\n**Tipo:** `boolean`\n**Predeterminado:** `true`\n\nMostrar la navegación de migas de pan en la parte superior de cada página.\n\n```json\n{\n  \"navigation\": {\n    \"showBreadcrumbs\": true\n  }\n}\n```\n\nLas migas de pan muestran la ubicación de la página en la jerarquía de documentación:\n\n```\nInicio \u003e Guías \u003e Introducción\n```\n\n\u003cCallout type=\"tip\"\u003e\nLas migas de pan ayudan a los usuarios a comprender dónde se encuentran y navegar de regreso a las secciones principales.\n\u003c/Callout\u003e\n\n## Tabla de Contenido (Table of Contents)\n\n### showTableOfContents\n\n**Tipo:** `boolean`\n**Predeterminado:** `true`\n\nMostrar la tabla de contenido (TOC) en las páginas de documentación.\n\n```json\n{\n  \"navigation\": {\n    \"showTableOfContents\": true\n  }\n}\n```\n\nLa TOC muestra todos los encabezados de la página actual con enlaces para desplazarse a cada sección.\n\n### tocPosition\n\n**Tipo:** `\"left\"` o `\"right\"`\n**Predeterminado:** `\"right\"`\n\nColoque la tabla de contenido en el lado izquierdo o derecho de la página.\n\n```json\n{\n  \"navigation\": {\n    \"tocPosition\": \"right\"\n  }\n}\n```\n\n**Posición derecha (predeterminado):**\n- La TOC aparece en la barra lateral derecha\n- Diseño de documentación tradicional\n- Más espacio de lectura para el contenido\n\n**Posición izquierda:**\n- La TOC aparece en la barra lateral izquierda debajo de la navegación principal\n- Diseño compacto\n- Menos desplazamiento horizontal en pantallas más pequeñas\n\n### tocMaxDepth\n\n**Tipo:** `number` (1-6)\n**Predeterminado:** `3`\n\nNivel máximo de encabezado para mostrar en la tabla de contenido.\n\n```json\n{\n  \"navigation\": {\n    \"tocMaxDepth\": 3\n  }\n}\n```\n\n**Opciones:**\n- `1` - Solo encabezados H1\n- `2` - Encabezados H1 y H2\n- `3` - Encabezados H1, H2 y H3 (recomendado)\n- `4` - Hasta H4\n- `5` - Hasta H5\n- `6` - Todos los encabezados\n\n\u003cCallout type=\"warning\"\u003e\nEstablecer esto demasiado alto (5 o 6) puede hacer que la TOC se vea abarrotada. La mayoría de los documentos funcionan mejor con 2 o 3.\n\u003c/Callout\u003e\n\n## Grupos de Pestañas (Tab Groups)\n\nLos grupos de pestañas organizan su documentación en secciones lógicas con pestañas de navegación separadas.\n\n### Grupos de Pestañas Básicos\n\n```json\n{\n  \"navigation\": {\n    \"tabGroups\": [\n      {\n        \"id\": \"guides\",\n        \"label\": \"Guías\",\n        \"icon\": \"book-open\"\n      },\n      {\n        \"id\": \"api\",\n        \"label\": \"Referencia API\",\n        \"icon\": \"zap\"\n      }\n    ]\n  }\n}\n```\n\n### Propiedades del Grupo de Pestañas\n\nCada grupo de pestañas tiene tres propiedades:\n\n**id** (requerido)\n- Identificador único para el grupo de pestañas\n- Usado en el frontmatter de la página: `tab_group: \"guides\"`\n- Minúsculas, sin espacios\n\n**label** (requerido)\n- Nombre para mostrar en la pestaña\n- Puede incluir espacios y mayúsculas\n\n**icon** (opcional)\n- Nombre del icono Lucide para mostrar junto a la etiqueta\n- Hace que las pestañas sean más visuales y fáciles de escanear\n\n### Asignar Páginas a Grupos de Pestañas\n\nEn su frontmatter MDX, especifique a qué grupo de pestañas pertenece una página:\n\n```mdx\n---\ntitle: Introducción\ntab_group: guides\n---\n```\n\nLas páginas con el mismo valor `tab_group` aparecen juntas bajo esa pestaña.\n\n### Configuraciones Comunes de Grupos de Pestañas\n\n**Documentación + API:**\n```json\n{\n  \"tabGroups\": [\n    {\n      \"id\": \"docs\",\n      \"label\": \"Documentación\",\n      \"icon\": \"book\"\n    },\n    {\n      \"id\": \"api\",\n      \"label\": \"Referencia API\",\n      \"icon\": \"code\"\n    }\n  ]\n}\n```\n\n**Guías + Componentes + API:**\n```json\n{\n  \"tabGroups\": [\n    {\n      \"id\": \"guides\",\n      \"label\": \"Guías\",\n      \"icon\": \"book-open\"\n    },\n    {\n      \"id\": \"components\",\n      \"label\": \"Componentes\",\n      \"icon\": \"layers\"\n    },\n    {\n      \"id\": \"api\",\n      \"label\": \"API\",\n      \"icon\": \"zap\"\n    }\n  ]\n}\n```\n\n**Documentación multiproducto:**\n```json\n{\n  \"tabGroups\": [\n    {\n      \"id\": \"platform\",\n      \"label\": \"Plataforma\",\n      \"icon\": \"box\"\n    },\n    {\n      \"id\": \"mobile\",\n      \"label\": \"SDK Móvil\",\n      \"icon\": \"smartphone\"\n    },\n    {\n      \"id\": \"web\",\n      \"label\": \"SDK Web\",\n      \"icon\": \"monitor\"\n    }\n  ]\n}\n```\n\n## Iconos Disponibles\n\nSpecra usa iconos Lucide. Opciones populares para documentación:\n\n**General:**\n- `book` - Libros, documentación\n- `book-open` - Libro abierto, lectura\n- `file-text` - Documentos, páginas\n- `layout` - Diseño, estructura\n\n**Técnico:**\n- `code` - Código, programación\n- `zap` - API, rápido, dinámico\n- `terminal` - CLI, línea de comandos\n- `database` - Base de datos, datos\n\n**UI:**\n- `layers` - Componentes, pila\n- `palette` - Diseño, temas\n- `settings` - Configuración\n- `grid` - Cuadrícula de diseño\n\n**Acciones:**\n- `rocket` - Lanzamiento, implementación\n- `wrench` - Herramientas, utilidades\n- `shield` - Seguridad\n- `search` - Búsqueda, encontrar\n\nExplore todos los iconos en [lucide.dev](https://lucide.dev/icons/)\n\n## Organización de la Barra Lateral\n\n### Generación Automática\n\nSpecra genera automáticamente su barra lateral a partir de su estructura de archivos:\n\n```txt\ndocs/v1.0.0/\n├── getting-started.mdx        → Introducción\n├── installation.mdx           → Instalación\n└── guides/                    → Guías (carpeta)\n    ├── basics.mdx            →   Básicos\n    └── advanced.mdx          →   Avanzado\n```\n\n### Controlar el Orden\n\nUse `sidebar_position` en el frontmatter para controlar el orden de la página:\n\n```mdx\n---\ntitle: Introducción\nsidebar_position: 1\n---\n```\n\nLos números más bajos aparecen primero. Las páginas sin posiciones se ordenan alfabéticamente.\n\n### Configuración de Categoría\n\nPersonalice la apariencia de la carpeta con `_category_.json`:\n\n```json\n{\n  \"label\": \"Guías de Usuario\",\n  \"position\": 2,\n  \"collapsible\": true,\n  \"collapsed\": false,\n  \"icon\": \"book-open\"\n}\n```\n\nConsulte [Escribir Contenido](/docs/v1.0.0/writing-content) para obtener más información sobre cómo organizar el contenido.\n\n## Ejemplos\n\n### Configuración Mínima\n\nSimplemente habilite lo básico:\n\n```json\n{\n  \"navigation\": {\n    \"showSidebar\": true,\n    \"showBreadcrumbs\": true,\n    \"showTableOfContents\": true\n  }\n}\n```\n\n### Diseño Limpio\n\nTOC a la izquierda, encabezados más profundos:\n\n```json\n{\n  \"navigation\": {\n    \"showSidebar\": true,\n    \"collapsibleSidebar\": true,\n    \"showBreadcrumbs\": true,\n    \"showTableOfContents\": true,\n    \"tocPosition\": \"left\",\n    \"tocMaxDepth\": 4\n  }\n}\n```\n\n### Documentación Multisección\n\nCon grupos de pestañas para diferentes audiencias:\n\n```json\n{\n  \"navigation\": {\n    \"showSidebar\": true,\n    \"collapsibleSidebar\": true,\n    \"showBreadcrumbs\": true,\n    \"showTableOfContents\": true,\n    \"tocPosition\": \"right\",\n    \"tocMaxDepth\": 3,\n    \"tabGroups\": [\n      {\n        \"id\": \"getting-started\",\n        \"label\": \"Introducción\",\n        \"icon\": \"rocket\"\n      },\n      {\n        \"id\": \"developers\",\n        \"label\": \"Desarrolladores\",\n        \"icon\": \"code\"\n      },\n      {\n        \"id\": \"designers\",\n        \"label\": \"Diseñadores\",\n        \"icon\": \"palette\"\n      }\n    ]\n  }\n}\n```\n\n## Mejores Prácticas\n\n**Use los grupos de pestañas sabiamente** - No cree demasiados. 3-5 pestañas como máximo funcionan mejor.\n\n**Elija etiquetas descriptivas** - Haga obvio lo que hay en cada pestaña o sección.\n\n**Elija iconos apropiados** - Los iconos deben reforzar el propósito de la pestaña.\n\n**Establezca tocMaxDepth apropiadamente** - La mayoría de los documentos funcionan mejor con 2 o 3 niveles.\n\n**Mantenga la barra lateral contraíble** - Permita a los usuarios ocultar secciones que no necesitan.\n\n**Mostrar migas de pan** - Ayudan a los usuarios a navegar por documentación compleja.\n\n## Próximos Pasos\n\n\u003cCardGrid cols={2}\u003e\n  \u003cCard\n    icon=\"globe\"\n    title=\"Configuración del Sitio\"\n    description=\"Configure metadatos y marca del sitio\"\n    href=\"/docs/v1.0.0/configuration/site-config\"\n  /\u003e\n  \u003cCard\n    icon=\"rocket\"\n    title=\"Config de Implementación\"\n    description=\"Configurar ajustes de implementación\"\n    href=\"/docs/v1.0.0/configuration/deployment-config\"\n  /\u003e\n  \u003cCard\n    icon=\"sliders\"\n    title=\"Configuración Avanzada\"\n    description=\"Análisis, búsqueda, características y más\"\n    href=\"/docs/v1.0.0/configuration/advanced\"\n  /\u003e\n  \u003cCard\n    icon=\"arrow-left\"\n    title=\"Descripción General de Configuración\"\n    description=\"Volver a la descripción general de configuración\"\n    href=\"/docs/v1.0.0/configuration/overview\"\n  /\u003e\n\u003c/CardGrid\u003e\n"])</script><script>self.__next_f.push([1,"2e:T2883,"])</script><script>self.__next_f.push([1,"\n# Configuración de Navegación\n\nLa sección `navigation` controla cómo los usuarios se mueven a través de su documentación. Configure la barra lateral, las migas de pan, la tabla de contenido y los grupos de pestañas para crear una experiencia de navegación intuitiva.\n\n## Configuración Básica\n\nAquí hay una configuración de navegación mínima:\n\n```json\n{\n  \"navigation\": {\n    \"showSidebar\": true,\n    \"showBreadcrumbs\": true,\n    \"showTableOfContents\": true\n  }\n}\n```\n\nSpecra proporciona valores predeterminados sensatos, por lo que solo necesita configurar lo que desea cambiar.\n\n## Configuración Completa\n\n```json\n{\n  \"navigation\": {\n    \"showSidebar\": true,\n    \"collapsibleSidebar\": true,\n    \"showBreadcrumbs\": true,\n    \"showTableOfContents\": true,\n    \"tocPosition\": \"right\",\n    \"tocMaxDepth\": 3,\n    \"tabGroups\": [\n      {\n        \"id\": \"guides\",\n        \"label\": \"Guías\",\n        \"icon\": \"book-open\"\n      },\n      {\n        \"id\": \"api\",\n        \"label\": \"Referencia API\",\n        \"icon\": \"zap\"\n      },\n      {\n        \"id\": \"components\",\n        \"label\": \"Componentes\",\n        \"icon\": \"layers\"\n      }\n    ]\n  }\n}\n```\n\n## Configuración de la Barra Lateral\n\n### showSidebar\n\n**Tipo:** `boolean`\n**Predeterminado:** `true`\n\nMostrar u ocultar la navegación de la barra lateral.\n\n```json\n{\n  \"navigation\": {\n    \"showSidebar\": true\n  }\n}\n```\n\nEstablezca en `false` para ocultar la barra lateral completamente. Útil para páginas de destino o sitios de marketing.\n\n### collapsibleSidebar\n\n**Tipo:** `boolean`\n**Predeterminado:** `true`\n\nPermitir a los usuarios contraer y expandir secciones de la barra lateral.\n\n```json\n{\n  \"navigation\": {\n    \"collapsibleSidebar\": true\n  }\n}\n```\n\nCuando es `true`, las secciones de carpeta tienen flechas para contraer/expandir. Cuando es `false`, todas las secciones están siempre expandidas.\n\n## Migas de Pan (Breadcrumbs)\n\n### showBreadcrumbs\n\n**Tipo:** `boolean`\n**Predeterminado:** `true`\n\nMostrar la navegación de migas de pan en la parte superior de cada página.\n\n```json\n{\n  \"navigation\": {\n    \"showBreadcrumbs\": true\n  }\n}\n```\n\nLas migas de pan muestran la ubicación de la página en la jerarquía de documentación:\n\n```\nInicio \u003e Guías \u003e Introducción\n```\n\n\u003cCallout type=\"tip\"\u003e\nLas migas de pan ayudan a los usuarios a comprender dónde se encuentran y navegar de regreso a las secciones principales.\n\u003c/Callout\u003e\n\n## Tabla de Contenido (Table of Contents)\n\n### showTableOfContents\n\n**Tipo:** `boolean`\n**Predeterminado:** `true`\n\nMostrar la tabla de contenido (TOC) en las páginas de documentación.\n\n```json\n{\n  \"navigation\": {\n    \"showTableOfContents\": true\n  }\n}\n```\n\nLa TOC muestra todos los encabezados de la página actual con enlaces para desplazarse a cada sección.\n\n### tocPosition\n\n**Tipo:** `\"left\"` o `\"right\"`\n**Predeterminado:** `\"right\"`\n\nColoque la tabla de contenido en el lado izquierdo o derecho de la página.\n\n```json\n{\n  \"navigation\": {\n    \"tocPosition\": \"right\"\n  }\n}\n```\n\n**Posición derecha (predeterminado):**\n- La TOC aparece en la barra lateral derecha\n- Diseño de documentación tradicional\n- Más espacio de lectura para el contenido\n\n**Posición izquierda:**\n- La TOC aparece en la barra lateral izquierda debajo de la navegación principal\n- Diseño compacto\n- Menos desplazamiento horizontal en pantallas más pequeñas\n\n### tocMaxDepth\n\n**Tipo:** `number` (1-6)\n**Predeterminado:** `3`\n\nNivel máximo de encabezado para mostrar en la tabla de contenido.\n\n```json\n{\n  \"navigation\": {\n    \"tocMaxDepth\": 3\n  }\n}\n```\n\n**Opciones:**\n- `1` - Solo encabezados H1\n- `2` - Encabezados H1 y H2\n- `3` - Encabezados H1, H2 y H3 (recomendado)\n- `4` - Hasta H4\n- `5` - Hasta H5\n- `6` - Todos los encabezados\n\n\u003cCallout type=\"warning\"\u003e\nEstablecer esto demasiado alto (5 o 6) puede hacer que la TOC se vea abarrotada. La mayoría de los documentos funcionan mejor con 2 o 3.\n\u003c/Callout\u003e\n\n## Grupos de Pestañas (Tab Groups)\n\nLos grupos de pestañas organizan su documentación en secciones lógicas con pestañas de navegación separadas.\n\n### Grupos de Pestañas Básicos\n\n```json\n{\n  \"navigation\": {\n    \"tabGroups\": [\n      {\n        \"id\": \"guides\",\n        \"label\": \"Guías\",\n        \"icon\": \"book-open\"\n      },\n      {\n        \"id\": \"api\",\n        \"label\": \"Referencia API\",\n        \"icon\": \"zap\"\n      }\n    ]\n  }\n}\n```\n\n### Propiedades del Grupo de Pestañas\n\nCada grupo de pestañas tiene tres propiedades:\n\n**id** (requerido)\n- Identificador único para el grupo de pestañas\n- Usado en el frontmatter de la página: `tab_group: \"guides\"`\n- Minúsculas, sin espacios\n\n**label** (requerido)\n- Nombre para mostrar en la pestaña\n- Puede incluir espacios y mayúsculas\n\n**icon** (opcional)\n- Nombre del icono Lucide para mostrar junto a la etiqueta\n- Hace que las pestañas sean más visuales y fáciles de escanear\n\n### Asignar Páginas a Grupos de Pestañas\n\nEn su frontmatter MDX, especifique a qué grupo de pestañas pertenece una página:\n\n```mdx\n---\ntitle: Introducción\ntab_group: guides\n---\n```\n\nLas páginas con el mismo valor `tab_group` aparecen juntas bajo esa pestaña.\n\n### Configuraciones Comunes de Grupos de Pestañas\n\n**Documentación + API:**\n```json\n{\n  \"tabGroups\": [\n    {\n      \"id\": \"docs\",\n      \"label\": \"Documentación\",\n      \"icon\": \"book\"\n    },\n    {\n      \"id\": \"api\",\n      \"label\": \"Referencia API\",\n      \"icon\": \"code\"\n    }\n  ]\n}\n```\n\n**Guías + Componentes + API:**\n```json\n{\n  \"tabGroups\": [\n    {\n      \"id\": \"guides\",\n      \"label\": \"Guías\",\n      \"icon\": \"book-open\"\n    },\n    {\n      \"id\": \"components\",\n      \"label\": \"Componentes\",\n      \"icon\": \"layers\"\n    },\n    {\n      \"id\": \"api\",\n      \"label\": \"API\",\n      \"icon\": \"zap\"\n    }\n  ]\n}\n```\n\n**Documentación multiproducto:**\n```json\n{\n  \"tabGroups\": [\n    {\n      \"id\": \"platform\",\n      \"label\": \"Plataforma\",\n      \"icon\": \"box\"\n    },\n    {\n      \"id\": \"mobile\",\n      \"label\": \"SDK Móvil\",\n      \"icon\": \"smartphone\"\n    },\n    {\n      \"id\": \"web\",\n      \"label\": \"SDK Web\",\n      \"icon\": \"monitor\"\n    }\n  ]\n}\n```\n\n## Iconos Disponibles\n\nSpecra usa iconos Lucide. Opciones populares para documentación:\n\n**General:**\n- `book` - Libros, documentación\n- `book-open` - Libro abierto, lectura\n- `file-text` - Documentos, páginas\n- `layout` - Diseño, estructura\n\n**Técnico:**\n- `code` - Código, programación\n- `zap` - API, rápido, dinámico\n- `terminal` - CLI, línea de comandos\n- `database` - Base de datos, datos\n\n**UI:**\n- `layers` - Componentes, pila\n- `palette` - Diseño, temas\n- `settings` - Configuración\n- `grid` - Cuadrícula de diseño\n\n**Acciones:**\n- `rocket` - Lanzamiento, implementación\n- `wrench` - Herramientas, utilidades\n- `shield` - Seguridad\n- `search` - Búsqueda, encontrar\n\nExplore todos los iconos en [lucide.dev](https://lucide.dev/icons/)\n\n## Organización de la Barra Lateral\n\n### Generación Automática\n\nSpecra genera automáticamente su barra lateral a partir de su estructura de archivos:\n\n```txt\ndocs/v1.0.0/\n├── getting-started.mdx        → Introducción\n├── installation.mdx           → Instalación\n└── guides/                    → Guías (carpeta)\n    ├── basics.mdx            →   Básicos\n    └── advanced.mdx          →   Avanzado\n```\n\n### Controlar el Orden\n\nUse `sidebar_position` en el frontmatter para controlar el orden de la página:\n\n```mdx\n---\ntitle: Introducción\nsidebar_position: 1\n---\n```\n\nLos números más bajos aparecen primero. Las páginas sin posiciones se ordenan alfabéticamente.\n\n### Configuración de Categoría\n\nPersonalice la apariencia de la carpeta con `_category_.json`:\n\n```json\n{\n  \"label\": \"Guías de Usuario\",\n  \"position\": 2,\n  \"collapsible\": true,\n  \"collapsed\": false,\n  \"icon\": \"book-open\"\n}\n```\n\nConsulte [Escribir Contenido](/docs/v1.0.0/writing-content) para obtener más información sobre cómo organizar el contenido.\n\n## Ejemplos\n\n### Configuración Mínima\n\nSimplemente habilite lo básico:\n\n```json\n{\n  \"navigation\": {\n    \"showSidebar\": true,\n    \"showBreadcrumbs\": true,\n    \"showTableOfContents\": true\n  }\n}\n```\n\n### Diseño Limpio\n\nTOC a la izquierda, encabezados más profundos:\n\n```json\n{\n  \"navigation\": {\n    \"showSidebar\": true,\n    \"collapsibleSidebar\": true,\n    \"showBreadcrumbs\": true,\n    \"showTableOfContents\": true,\n    \"tocPosition\": \"left\",\n    \"tocMaxDepth\": 4\n  }\n}\n```\n\n### Documentación Multisección\n\nCon grupos de pestañas para diferentes audiencias:\n\n```json\n{\n  \"navigation\": {\n    \"showSidebar\": true,\n    \"collapsibleSidebar\": true,\n    \"showBreadcrumbs\": true,\n    \"showTableOfContents\": true,\n    \"tocPosition\": \"right\",\n    \"tocMaxDepth\": 3,\n    \"tabGroups\": [\n      {\n        \"id\": \"getting-started\",\n        \"label\": \"Introducción\",\n        \"icon\": \"rocket\"\n      },\n      {\n        \"id\": \"developers\",\n        \"label\": \"Desarrolladores\",\n        \"icon\": \"code\"\n      },\n      {\n        \"id\": \"designers\",\n        \"label\": \"Diseñadores\",\n        \"icon\": \"palette\"\n      }\n    ]\n  }\n}\n```\n\n## Mejores Prácticas\n\n**Use los grupos de pestañas sabiamente** - No cree demasiados. 3-5 pestañas como máximo funcionan mejor.\n\n**Elija etiquetas descriptivas** - Haga obvio lo que hay en cada pestaña o sección.\n\n**Elija iconos apropiados** - Los iconos deben reforzar el propósito de la pestaña.\n\n**Establezca tocMaxDepth apropiadamente** - La mayoría de los documentos funcionan mejor con 2 o 3 niveles.\n\n**Mantenga la barra lateral contraíble** - Permita a los usuarios ocultar secciones que no necesitan.\n\n**Mostrar migas de pan** - Ayudan a los usuarios a navegar por documentación compleja.\n\n## Próximos Pasos\n\n\u003cCardGrid cols={2}\u003e\n  \u003cCard\n    icon=\"globe\"\n    title=\"Configuración del Sitio\"\n    description=\"Configure metadatos y marca del sitio\"\n    href=\"/docs/v1.0.0/configuration/site-config\"\n  /\u003e\n  \u003cCard\n    icon=\"rocket\"\n    title=\"Config de Implementación\"\n    description=\"Configurar ajustes de implementación\"\n    href=\"/docs/v1.0.0/configuration/deployment-config\"\n  /\u003e\n  \u003cCard\n    icon=\"sliders\"\n    title=\"Configuración Avanzada\"\n    description=\"Análisis, búsqueda, características y más\"\n    href=\"/docs/v1.0.0/configuration/advanced\"\n  /\u003e\n  \u003cCard\n    icon=\"arrow-left\"\n    title=\"Descripción General de Configuración\"\n    description=\"Volver a la descripción general de configuración\"\n    href=\"/docs/v1.0.0/configuration/overview\"\n  /\u003e\n\u003c/CardGrid\u003e\n"])</script><script>self.__next_f.push([1,"2f:T2a39,"])</script><script>self.__next_f.push([1,"\n# Implementar en GitHub Pages\n\nGitHub Pages ofrece alojamiento gratuito para sitios estáticos, lo que lo hace perfecto para documentación de código abierto. Implemente directamente desde su repositorio con GitHub Actions.\n\n## ¿Por qué GitHub Pages?\n\n- **Alojamiento gratuito** - Sin costo para repositorios públicos\n- **Dominios personalizados** - Use su propio dominio\n- **HTTPS incluido** - Certificados SSL automáticos\n- **Basado en Git** - Implemente desde su repositorio\n- **Control de versiones** - Historial completo de sus documentos\n- **Confianza de la comunidad** - Plataforma familiar para desarrolladores\n\n## Requisitos Previos\n\n- Repositorio de GitHub (público o privado)\n- Proyecto de documentación Specra\n- Git instalado localmente\n\n## Configuración\n\nPrimero, configure Specra para exportación estática.\n\n### Sin Dominio Personalizado\n\nPara URL como `username.github.io/nombre-repo`:\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"github-pages\",\n    \"basePath\": \"nombre-repo\",\n    \"customDomain\": false\n  }\n}\n```\n\n\u003cCallout type=\"warning\" title=\"Importante\"\u003e\nEl `basePath` debe coincidir exactamente con el nombre de su repositorio. GitHub Pages sirve desde `username.github.io/nombre-repo`, por lo que todos los activos necesitan este prefijo.\n\u003c/Callout\u003e\n\n### Con Dominio Personalizado\n\nPara dominios personalizados como `docs.ejemplo.com`:\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"custom-domain-static\",\n    \"basePath\": \"\",\n    \"customDomain\": true\n  }\n}\n```\n\nTambién cree `public/CNAME` con su dominio:\n\n```txt\ndocs.ejemplo.com\n```\n\n## Métodos de Implementación\n\nElija su método de implementación preferido:\n\n### Método 1: GitHub Actions (Recomendado)\n\nImplementación automática en cada envío a main.\n\n\u003cSteps\u003e\n  \u003cStep title=\"Crear Archivo de Flujo de Trabajo\"\u003e\n    Cree `.github/workflows/deploy.yml`:\n\n```yaml\nname: Deploy to GitHub Pages\n\non:\n  push:\n    branches: [main]\n\npermissions:\n  contents: read\n  pages: write\n  id-token: write\n\nconcurrency:\n  group: \"pages\"\n  cancel-in-progress: false\n\njobs:\n  build:\n    runs-on: ubuntu-latest\n    steps:\n      - name: Checkout\n        uses: actions/checkout@v4\n\n      - name: Setup Node\n        uses: actions/setup-node@v4\n        with:\n          node-version: '20'\n          cache: 'npm'\n\n      - name: Install dependencies\n        run: npm ci\n\n      - name: Build site\n        run: npm run build:export\n        env:\n          NODE_ENV: production\n\n      - name: Upload artifact\n        uses: actions/upload-pages-artifact@v3\n        with:\n          path: ./out\n\n  deploy:\n    needs: build\n    runs-on: ubuntu-latest\n    environment:\n      name: github-pages\n      url: ${{ steps.deployment.outputs.page_url }}\n    steps:\n      - name: Deploy to GitHub Pages\n        id: deployment\n        uses: actions/deploy-pages@v4\n```\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Habilitar GitHub Pages\"\u003e\n    1. Vaya a Configuración del repositorio → Pages\n    2. Fuente: **GitHub Actions**\n    3. Guardar\n\n    No es necesario seleccionar una rama: el flujo de trabajo maneja la implementación.\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Enviar e Implementar\"\u003e\n```bash\ngit add .\ngit commit -m \"Add GitHub Pages deployment\"\ngit push\n```\n\n¡Su sitio se implementa automáticamente! Verifique la pestaña Actions para ver el progreso.\n  \u003c/Step\u003e\n\u003c/Steps\u003e\n\n### Método 2: Implementación Manual\n\nImplemente manualmente utilizando el paquete `gh-pages`.\n\n\u003cSteps\u003e\n  \u003cStep title=\"Instalar gh-pages\"\u003e\n```bash\nnpm install --save-dev gh-pages\n```\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Agregar Script de Implementación\"\u003e\n    Actualice `package.json`:\n\n```json\n{\n  \"scripts\": {\n    \"deploy\": \"npm run build:export \u0026\u0026 gh-pages -d out\"\n  }\n}\n```\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Implementar\"\u003e\n```bash\nnpm run deploy\n```\n\nEsto construye su sitio y envía la carpeta `out` a la rama `gh-pages`.\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Habilitar GitHub Pages\"\u003e\n    1. Vaya a Configuración → Pages\n    2. Fuente: Deploy from a branch\n    3. Rama: `gh-pages` / `/ (root)`\n    4. Guardar\n  \u003c/Step\u003e\n\u003c/Steps\u003e\n\n## Configuración de Dominio Personalizado\n\nUse su propio dominio con GitHub Pages:\n\n\u003cSteps\u003e\n  \u003cStep title=\"Agregar Archivo CNAME\"\u003e\n    Cree `public/CNAME`:\n\n```\ndocs.ejemplo.com\n```\n\nActualizar configuración:\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"custom-domain-static\",\n    \"customDomain\": true,\n    \"basePath\": \"\"\n  }\n}\n```\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Configurar DNS\"\u003e\n    Agregue registros DNS en su proveedor de dominios:\n\n**Para subdominio (docs.ejemplo.com):**\n```\nTipo: CNAME\nNombre: docs\nValor: username.github.io\n```\n\n**Para dominio ápice (ejemplo.com):**\n```\nTipo: A\nNombre: @\nValor: 185.199.108.153\nValor: 185.199.109.153\nValor: 185.199.110.153\nValor: 185.199.111.153\n```\n\n\u003cCallout type=\"tip\"\u003e\nUse un subdominio como `docs.ejemplo.com` - es más simple que la configuración de dominio ápice.\n\u003c/Callout\u003e\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Habilitar HTTPS\"\u003e\n    Después de que se propague el DNS (puede tardar hasta 24 horas):\n\n1. Vaya a Configuración → Pages\n2. Marque \"Enforce HTTPS\"\n3. GitHub aprovisiona automáticamente un certificado SSL\n  \u003c/Step\u003e\n\u003c/Steps\u003e\n\n## GitHub Actions Avanzadas\n\n### Con Indexación de Búsqueda\n\nIndexe sus documentos en MeiliSearch durante la implementación:\n\n```yaml\njobs:\n  build:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n\n      - name: Setup Node\n        uses: actions/setup-node@v4\n        with:\n          node-version: '20'\n          cache: 'npm'\n\n      - name: Install dependencies\n        run: npm ci\n\n      - name: Build site\n        run: npm run build:export\n\n      - name: Index search\n        run: npm run index:search\n        env:\n          MEILISEARCH_HOST: ${{ secrets.MEILISEARCH_HOST }}\n          MEILISEARCH_API_KEY: ${{ secrets.MEILISEARCH_MASTER_KEY }}\n\n      - name: Upload artifact\n        uses: actions/upload-pages-artifact@v3\n        with:\n          path: ./out\n```\n\nAgregue secretos en Configuración → Secrets and variables → Actions.\n\n### Implementar en Etiqueta\n\nSolo implementar cuando cree una etiqueta de lanzamiento:\n\n```yaml\non:\n  push:\n    tags:\n      - 'v*'\n```\n\nCree y envíe una etiqueta para implementar:\n\n```bash\ngit tag v1.0.0\ngit push origin v1.0.0\n```\n\n### Múltiples Entornos\n\nImplemente diferentes ramas en diferentes sitios de GitHub Pages:\n\n```yaml\non:\n  push:\n    branches:\n      - main\n      - staging\n\njobs:\n  build:\n    runs-on: ubuntu-latest\n    steps:\n      # ... pasos de construcción ...\n\n      - name: Deploy to production\n        if: github.ref == 'refs/heads/main'\n        uses: actions/deploy-pages@v4\n\n      - name: Deploy to staging\n        if: github.ref == 'refs/heads/staging'\n        # Implementar en un repositorio o rama diferente\n```\n\n## Solución de Problemas\n\n### Errores 404 en Rutas\n\nLas exportaciones estáticas no admiten el enrutamiento dinámico de la misma manera. Asegúrese de que todas las rutas estén pre-renderizadas.\n\n**Solución:** Agregue un 404.html que redirija al índice:\n\n```html\n\u003c!DOCTYPE html\u003e\n\u003chtml\u003e\n  \u003chead\u003e\n    \u003cmeta http-equiv=\"refresh\" content=\"0;url=/\" /\u003e\n  \u003c/head\u003e\n  \u003cbody\u003e\n    Redirigiendo...\n  \u003c/body\u003e\n\u003c/html\u003e\n```\n\n### Los Activos No Se Cargan\n\nVerifique su configuración `basePath`:\n\n```bash\n# Ver su sitio\nopen https://username.github.io/nombre-repo\n\n# Comprobar si los activos se cargan desde\nhttps://username.github.io/nombre-repo/_next/...\n```\n\nSi los activos devuelven 404, verifique:\n- `basePath` en la configuración coincide exactamente con el nombre del repositorio\n- Está utilizando `npm run build:export` no `npm run build`\n\n### El Dominio Personalizado No Funciona\n\n**Verificar propagación DNS:**\n```bash\ndig docs.ejemplo.com\n# Debería mostrar CNAME a username.github.io\n```\n\n**Verificar archivo CNAME:**\n- Debe estar en la carpeta `public/`\n- Contiene solo su dominio, sin protocolo\n- Sin barra diagonal final\n\n**Problemas comunes:**\n- DNS aún no propagado (espere hasta 24 horas)\n- Archivo CNAME faltante o incorrecto\n- Error en la verificación del dominio en la configuración de GitHub\n\n### La Compilación Falla en Actions\n\n**Ver registros:**\n1. Vaya a la pestaña Actions\n2. Haga clic en el flujo de trabajo fallido\n3. Expanda el paso de compilación para ver errores\n\n**Correcciones comunes:**\n- Aumentar la versión de Node en el flujo de trabajo\n- Borrar caché de npm: `npm ci --cache .npm`\n- Verificar dependencias faltantes\n\n## Consejos de Rendimiento\n\n### Habilitar Almacenamiento en Caché\n\nAlmacene en caché node_modules para compilaciones más rápidas:\n\n```yaml\n- name: Setup Node\n  uses: actions/setup-node@v4\n  with:\n    node-version: '20'\n    cache: 'npm'\n```\n\n### Optimizar Imágenes\n\nOptimice previamente las imágenes antes de confirmar:\n\n```bash\nnpm install -D imagemin-cli\n\n# Optimizar todas las imágenes\nnpx imagemin public/images/* --out-dir=public/images\n```\n\n### Reducir Tamaño del Paquete\n\nVerifique qué hay en su paquete:\n\n```bash\nnpm install -D @next/bundle-analyzer\n\nANALYZE=true npm run build:export\n```\n\n## Límites\n\nGitHub Pages tiene algunos límites:\n\n- **Tamaño del repositorio:** 1GB recomendado\n- **Tamaño del sitio:** 1GB sitio publicado\n- **Ancho de banda:** 100GB/mes límite suave\n- **Compilaciones:** 10 por hora\n\nEstos límites son generosos para sitios de documentación.\n\n## Migración desde Otras Plataformas\n\n### Desde Vercel\n\n1. Actualice la sección `deployment` de `specra.config.json`\n2. Ejecute `npm run build:export` localmente para probar\n3. Configure el flujo de trabajo de GitHub Actions\n4. Envíe para activar la implementación\n\n### Desde Netlify\n\nEl mismo proceso que Vercel. La salida estática funciona en ambas plataformas.\n\n## Mejores Prácticas\n\n**Usar GitHub Actions** - Implementación automática en cada envío\n\n**Versionar sus documentos** - Use etiquetas git para versiones de documentación\n\n**Probar localmente** - Ejecute `npm run build:export \u0026\u0026 npx serve out` antes de enviar\n\n**Monitorear compilaciones** - Configure notificaciones para implementaciones fallidas\n\n**Usar dominio personalizado** - Apariencia profesional y URL estables\n\n**Habilitar HTTPS** - Siempre aplicar HTTPS por seguridad\n\n## Próximos Pasos\n\n\u003cCardGrid cols={2}\u003e\n  \u003cCard\n    icon=\"triangle\"\n    title=\"Vercel\"\n    description=\"Implementar en Vercel para funciones dinámicas\"\n    href=\"/docs/v1.0.0/deployment/vercel\"\n  /\u003e\n  \u003cCard\n    icon=\"globe\"\n    title=\"Netlify\"\n    description=\"Plataforma de alojamiento estático alternativa\"\n    href=\"/docs/v1.0.0/deployment/netlify\"\n  /\u003e\n  \u003cCard\n    icon=\"arrow-left\"\n    title=\"Descripción General de Implementación\"\n    description=\"Ver todas las opciones de implementación\"\n    href=\"/docs/v1.0.0/deployment/overview\"\n  /\u003e\n  \u003cCard\n    icon=\"settings\"\n    title=\"Configuración\"\n    description=\"Configurar ajustes de implementación\"\n    href=\"/docs/v1.0.0/configuration/overview\"\n  /\u003e\n\u003c/CardGrid\u003e\n"])</script><script>self.__next_f.push([1,"30:T2a39,"])</script><script>self.__next_f.push([1,"\n# Implementar en GitHub Pages\n\nGitHub Pages ofrece alojamiento gratuito para sitios estáticos, lo que lo hace perfecto para documentación de código abierto. Implemente directamente desde su repositorio con GitHub Actions.\n\n## ¿Por qué GitHub Pages?\n\n- **Alojamiento gratuito** - Sin costo para repositorios públicos\n- **Dominios personalizados** - Use su propio dominio\n- **HTTPS incluido** - Certificados SSL automáticos\n- **Basado en Git** - Implemente desde su repositorio\n- **Control de versiones** - Historial completo de sus documentos\n- **Confianza de la comunidad** - Plataforma familiar para desarrolladores\n\n## Requisitos Previos\n\n- Repositorio de GitHub (público o privado)\n- Proyecto de documentación Specra\n- Git instalado localmente\n\n## Configuración\n\nPrimero, configure Specra para exportación estática.\n\n### Sin Dominio Personalizado\n\nPara URL como `username.github.io/nombre-repo`:\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"github-pages\",\n    \"basePath\": \"nombre-repo\",\n    \"customDomain\": false\n  }\n}\n```\n\n\u003cCallout type=\"warning\" title=\"Importante\"\u003e\nEl `basePath` debe coincidir exactamente con el nombre de su repositorio. GitHub Pages sirve desde `username.github.io/nombre-repo`, por lo que todos los activos necesitan este prefijo.\n\u003c/Callout\u003e\n\n### Con Dominio Personalizado\n\nPara dominios personalizados como `docs.ejemplo.com`:\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"custom-domain-static\",\n    \"basePath\": \"\",\n    \"customDomain\": true\n  }\n}\n```\n\nTambién cree `public/CNAME` con su dominio:\n\n```txt\ndocs.ejemplo.com\n```\n\n## Métodos de Implementación\n\nElija su método de implementación preferido:\n\n### Método 1: GitHub Actions (Recomendado)\n\nImplementación automática en cada envío a main.\n\n\u003cSteps\u003e\n  \u003cStep title=\"Crear Archivo de Flujo de Trabajo\"\u003e\n    Cree `.github/workflows/deploy.yml`:\n\n```yaml\nname: Deploy to GitHub Pages\n\non:\n  push:\n    branches: [main]\n\npermissions:\n  contents: read\n  pages: write\n  id-token: write\n\nconcurrency:\n  group: \"pages\"\n  cancel-in-progress: false\n\njobs:\n  build:\n    runs-on: ubuntu-latest\n    steps:\n      - name: Checkout\n        uses: actions/checkout@v4\n\n      - name: Setup Node\n        uses: actions/setup-node@v4\n        with:\n          node-version: '20'\n          cache: 'npm'\n\n      - name: Install dependencies\n        run: npm ci\n\n      - name: Build site\n        run: npm run build:export\n        env:\n          NODE_ENV: production\n\n      - name: Upload artifact\n        uses: actions/upload-pages-artifact@v3\n        with:\n          path: ./out\n\n  deploy:\n    needs: build\n    runs-on: ubuntu-latest\n    environment:\n      name: github-pages\n      url: ${{ steps.deployment.outputs.page_url }}\n    steps:\n      - name: Deploy to GitHub Pages\n        id: deployment\n        uses: actions/deploy-pages@v4\n```\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Habilitar GitHub Pages\"\u003e\n    1. Vaya a Configuración del repositorio → Pages\n    2. Fuente: **GitHub Actions**\n    3. Guardar\n\n    No es necesario seleccionar una rama: el flujo de trabajo maneja la implementación.\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Enviar e Implementar\"\u003e\n```bash\ngit add .\ngit commit -m \"Add GitHub Pages deployment\"\ngit push\n```\n\n¡Su sitio se implementa automáticamente! Verifique la pestaña Actions para ver el progreso.\n  \u003c/Step\u003e\n\u003c/Steps\u003e\n\n### Método 2: Implementación Manual\n\nImplemente manualmente utilizando el paquete `gh-pages`.\n\n\u003cSteps\u003e\n  \u003cStep title=\"Instalar gh-pages\"\u003e\n```bash\nnpm install --save-dev gh-pages\n```\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Agregar Script de Implementación\"\u003e\n    Actualice `package.json`:\n\n```json\n{\n  \"scripts\": {\n    \"deploy\": \"npm run build:export \u0026\u0026 gh-pages -d out\"\n  }\n}\n```\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Implementar\"\u003e\n```bash\nnpm run deploy\n```\n\nEsto construye su sitio y envía la carpeta `out` a la rama `gh-pages`.\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Habilitar GitHub Pages\"\u003e\n    1. Vaya a Configuración → Pages\n    2. Fuente: Deploy from a branch\n    3. Rama: `gh-pages` / `/ (root)`\n    4. Guardar\n  \u003c/Step\u003e\n\u003c/Steps\u003e\n\n## Configuración de Dominio Personalizado\n\nUse su propio dominio con GitHub Pages:\n\n\u003cSteps\u003e\n  \u003cStep title=\"Agregar Archivo CNAME\"\u003e\n    Cree `public/CNAME`:\n\n```\ndocs.ejemplo.com\n```\n\nActualizar configuración:\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"custom-domain-static\",\n    \"customDomain\": true,\n    \"basePath\": \"\"\n  }\n}\n```\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Configurar DNS\"\u003e\n    Agregue registros DNS en su proveedor de dominios:\n\n**Para subdominio (docs.ejemplo.com):**\n```\nTipo: CNAME\nNombre: docs\nValor: username.github.io\n```\n\n**Para dominio ápice (ejemplo.com):**\n```\nTipo: A\nNombre: @\nValor: 185.199.108.153\nValor: 185.199.109.153\nValor: 185.199.110.153\nValor: 185.199.111.153\n```\n\n\u003cCallout type=\"tip\"\u003e\nUse un subdominio como `docs.ejemplo.com` - es más simple que la configuración de dominio ápice.\n\u003c/Callout\u003e\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Habilitar HTTPS\"\u003e\n    Después de que se propague el DNS (puede tardar hasta 24 horas):\n\n1. Vaya a Configuración → Pages\n2. Marque \"Enforce HTTPS\"\n3. GitHub aprovisiona automáticamente un certificado SSL\n  \u003c/Step\u003e\n\u003c/Steps\u003e\n\n## GitHub Actions Avanzadas\n\n### Con Indexación de Búsqueda\n\nIndexe sus documentos en MeiliSearch durante la implementación:\n\n```yaml\njobs:\n  build:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n\n      - name: Setup Node\n        uses: actions/setup-node@v4\n        with:\n          node-version: '20'\n          cache: 'npm'\n\n      - name: Install dependencies\n        run: npm ci\n\n      - name: Build site\n        run: npm run build:export\n\n      - name: Index search\n        run: npm run index:search\n        env:\n          MEILISEARCH_HOST: ${{ secrets.MEILISEARCH_HOST }}\n          MEILISEARCH_API_KEY: ${{ secrets.MEILISEARCH_MASTER_KEY }}\n\n      - name: Upload artifact\n        uses: actions/upload-pages-artifact@v3\n        with:\n          path: ./out\n```\n\nAgregue secretos en Configuración → Secrets and variables → Actions.\n\n### Implementar en Etiqueta\n\nSolo implementar cuando cree una etiqueta de lanzamiento:\n\n```yaml\non:\n  push:\n    tags:\n      - 'v*'\n```\n\nCree y envíe una etiqueta para implementar:\n\n```bash\ngit tag v1.0.0\ngit push origin v1.0.0\n```\n\n### Múltiples Entornos\n\nImplemente diferentes ramas en diferentes sitios de GitHub Pages:\n\n```yaml\non:\n  push:\n    branches:\n      - main\n      - staging\n\njobs:\n  build:\n    runs-on: ubuntu-latest\n    steps:\n      # ... pasos de construcción ...\n\n      - name: Deploy to production\n        if: github.ref == 'refs/heads/main'\n        uses: actions/deploy-pages@v4\n\n      - name: Deploy to staging\n        if: github.ref == 'refs/heads/staging'\n        # Implementar en un repositorio o rama diferente\n```\n\n## Solución de Problemas\n\n### Errores 404 en Rutas\n\nLas exportaciones estáticas no admiten el enrutamiento dinámico de la misma manera. Asegúrese de que todas las rutas estén pre-renderizadas.\n\n**Solución:** Agregue un 404.html que redirija al índice:\n\n```html\n\u003c!DOCTYPE html\u003e\n\u003chtml\u003e\n  \u003chead\u003e\n    \u003cmeta http-equiv=\"refresh\" content=\"0;url=/\" /\u003e\n  \u003c/head\u003e\n  \u003cbody\u003e\n    Redirigiendo...\n  \u003c/body\u003e\n\u003c/html\u003e\n```\n\n### Los Activos No Se Cargan\n\nVerifique su configuración `basePath`:\n\n```bash\n# Ver su sitio\nopen https://username.github.io/nombre-repo\n\n# Comprobar si los activos se cargan desde\nhttps://username.github.io/nombre-repo/_next/...\n```\n\nSi los activos devuelven 404, verifique:\n- `basePath` en la configuración coincide exactamente con el nombre del repositorio\n- Está utilizando `npm run build:export` no `npm run build`\n\n### El Dominio Personalizado No Funciona\n\n**Verificar propagación DNS:**\n```bash\ndig docs.ejemplo.com\n# Debería mostrar CNAME a username.github.io\n```\n\n**Verificar archivo CNAME:**\n- Debe estar en la carpeta `public/`\n- Contiene solo su dominio, sin protocolo\n- Sin barra diagonal final\n\n**Problemas comunes:**\n- DNS aún no propagado (espere hasta 24 horas)\n- Archivo CNAME faltante o incorrecto\n- Error en la verificación del dominio en la configuración de GitHub\n\n### La Compilación Falla en Actions\n\n**Ver registros:**\n1. Vaya a la pestaña Actions\n2. Haga clic en el flujo de trabajo fallido\n3. Expanda el paso de compilación para ver errores\n\n**Correcciones comunes:**\n- Aumentar la versión de Node en el flujo de trabajo\n- Borrar caché de npm: `npm ci --cache .npm`\n- Verificar dependencias faltantes\n\n## Consejos de Rendimiento\n\n### Habilitar Almacenamiento en Caché\n\nAlmacene en caché node_modules para compilaciones más rápidas:\n\n```yaml\n- name: Setup Node\n  uses: actions/setup-node@v4\n  with:\n    node-version: '20'\n    cache: 'npm'\n```\n\n### Optimizar Imágenes\n\nOptimice previamente las imágenes antes de confirmar:\n\n```bash\nnpm install -D imagemin-cli\n\n# Optimizar todas las imágenes\nnpx imagemin public/images/* --out-dir=public/images\n```\n\n### Reducir Tamaño del Paquete\n\nVerifique qué hay en su paquete:\n\n```bash\nnpm install -D @next/bundle-analyzer\n\nANALYZE=true npm run build:export\n```\n\n## Límites\n\nGitHub Pages tiene algunos límites:\n\n- **Tamaño del repositorio:** 1GB recomendado\n- **Tamaño del sitio:** 1GB sitio publicado\n- **Ancho de banda:** 100GB/mes límite suave\n- **Compilaciones:** 10 por hora\n\nEstos límites son generosos para sitios de documentación.\n\n## Migración desde Otras Plataformas\n\n### Desde Vercel\n\n1. Actualice la sección `deployment` de `specra.config.json`\n2. Ejecute `npm run build:export` localmente para probar\n3. Configure el flujo de trabajo de GitHub Actions\n4. Envíe para activar la implementación\n\n### Desde Netlify\n\nEl mismo proceso que Vercel. La salida estática funciona en ambas plataformas.\n\n## Mejores Prácticas\n\n**Usar GitHub Actions** - Implementación automática en cada envío\n\n**Versionar sus documentos** - Use etiquetas git para versiones de documentación\n\n**Probar localmente** - Ejecute `npm run build:export \u0026\u0026 npx serve out` antes de enviar\n\n**Monitorear compilaciones** - Configure notificaciones para implementaciones fallidas\n\n**Usar dominio personalizado** - Apariencia profesional y URL estables\n\n**Habilitar HTTPS** - Siempre aplicar HTTPS por seguridad\n\n## Próximos Pasos\n\n\u003cCardGrid cols={2}\u003e\n  \u003cCard\n    icon=\"triangle\"\n    title=\"Vercel\"\n    description=\"Implementar en Vercel para funciones dinámicas\"\n    href=\"/docs/v1.0.0/deployment/vercel\"\n  /\u003e\n  \u003cCard\n    icon=\"globe\"\n    title=\"Netlify\"\n    description=\"Plataforma de alojamiento estático alternativa\"\n    href=\"/docs/v1.0.0/deployment/netlify\"\n  /\u003e\n  \u003cCard\n    icon=\"arrow-left\"\n    title=\"Descripción General de Implementación\"\n    description=\"Ver todas las opciones de implementación\"\n    href=\"/docs/v1.0.0/deployment/overview\"\n  /\u003e\n  \u003cCard\n    icon=\"settings\"\n    title=\"Configuración\"\n    description=\"Configurar ajustes de implementación\"\n    href=\"/docs/v1.0.0/configuration/overview\"\n  /\u003e\n\u003c/CardGrid\u003e\n"])</script><script>self.__next_f.push([1,"31:T2a68,"])</script><script>self.__next_f.push([1,"\n# Writing Content in Specra\n\nSpecra uses MDX (Markdown + JSX) for documentation, giving you the simplicity of Markdown with the power of React components. This guide covers everything you need to write great documentation.\n\n## MDX Basics\n\nMDX files look like regular Markdown but let you use React components anywhere in your content.\n\n### Standard Markdown\n\nAll standard Markdown syntax works as expected:\n\n**Headings:**\n```markdown\n# Heading 1\n## Heading 2\n### Heading 3\n```\n\n**Text formatting:**\n```markdown\n**Bold text**\n*Italic text*\n~~Strikethrough~~\n`Inline code`\n```\n\n**Lists:**\n```markdown\n- Unordered list\n- Another item\n  - Nested item\n\n1. Ordered list\n2. Second item\n   1. Nested ordered item\n```\n\n**Links and images:**\n```markdown\n[Link text](https://example.com)\n![Alt text](/images/photo.png)\n```\n\n**Code blocks:**\n````markdown\n```javascript\nfunction hello() {\n  console.log(\"Hello, world!\")\n}\n```\n````\n\n**Tables:**\n```markdown\n| Column 1 | Column 2 | Column 3 |\n|----------|----------|----------|\n| Data 1   | Data 2   | Data 3   |\n| More     | Info     | Here     |\n```\n\n**Blockquotes:**\n```markdown\n\u003e This is a quote.\n\u003e It can span multiple lines.\n```\n\n**Horizontal rules:**\n```markdown\n---\n```\n\n## Using Components\n\nComponents are used with JSX syntax directly in your MDX:\n\n```mdx\n\u003cCallout type=\"info\"\u003e\n  This is a callout component!\n\u003c/Callout\u003e\n```\n\nAll components are automatically available - no imports needed.\n\n### Component Examples\n\n**Alert readers to important information:**\n```mdx\n\u003cCallout type=\"warning\"\u003e\n  Make sure to backup your data before proceeding.\n\u003c/Callout\u003e\n```\n\n**Create tabbed content:**\n```mdx\n\u003cTabs defaultValue=\"option1\"\u003e\n  \u003cTab label=\"Option 1\"\u003e\n    Content for the first tab\n  \u003c/Tab\u003e\n  \u003cTab label=\"Option 2\"\u003e\n    Content for the second tab\n  \u003c/Tab\u003e\n\u003c/Tabs\u003e\n```\n\n**Guide users through steps:**\n```mdx\n\u003cSteps\u003e\n  \u003cStep title=\"Install dependencies\"\u003e\n    Run `npm install` to get started.\n  \u003c/Step\u003e\n  \u003cStep title=\"Configure your app\"\u003e\n    Edit the config file with your settings.\n  \u003c/Step\u003e\n\u003c/Steps\u003e\n```\n\nSee the [Components](/docs/v1.0.0/components) section for all available components.\n\n## Content Organization\n\n### File Structure Best Practices\n\nOrganize files logically to make content easy to find:\n\n```txt\ndocs/v1.0.0/\n├── getting-started.mdx         # Top level: essential pages\n├── installation.mdx\n├── guides/                     # Group related content\n│   ├── _category_.json\n│   ├── basics.mdx\n│   ├── advanced.mdx\n│   └── examples/              # Further nesting for sub-topics\n│       ├── _category_.json\n│       ├── example-1.mdx\n│       └── example-2.mdx\n└── api/\n    ├── _category_.json\n    └── reference.mdx\n```\n\n**Tips:**\n- Keep the top level for critical pages users need first\n- Use folders to group related content\n- Limit nesting to 2-3 levels max\n- Name files descriptively (`authentication.mdx` not `auth.mdx`)\n\n### Controlling Page Order\n\nUse `sidebar_position` in frontmatter to control ordering:\n\n```mdx\n---\ntitle: Installation\nsidebar_position: 1\n---\n```\n\nLower numbers appear first. Pages without a position are sorted alphabetically.\n\nFor folders, use `_category_.json`:\n\n```json\n{\n  \"label\": \"Getting Started\",\n  \"position\": 1\n}\n```\n\n## Writing Style Tips\n\nGood documentation is clear, concise, and helpful. Here are some tips:\n\n### Be Clear and Direct\n\n**Good:**\n\u003e Click the \"Save\" button to save your changes.\n\n**Bad:**\n\u003e You might want to consider clicking on the button labeled \"Save\" if you would like to persist your modifications to storage.\n\n### Use Active Voice\n\n**Good:**\n\u003e The system validates your input.\n\n**Bad:**\n\u003e Your input is validated by the system.\n\n### Show, Don't Just Tell\n\nInclude examples with every concept:\n\n```mdx\n## Using Environment Variables\n\nAccess environment variables in your config:\n\n```json\n{\n  \"env\": {\n    \"API_URL\": \"https://api.example.com\"\n  }\n}\n```\n\nThen reference them in your MDX:\n\n```mdx\nThe API is available at {process.env.API_URL}\n```\n```\n\n### Break Up Long Content\n\nUse headings, lists, callouts, and components to create visual breaks:\n\n```mdx\n## Configuration Options\n\nThere are several ways to configure authentication:\n\n### API Keys\n\nAPI keys are simple but less secure.\n\n\u003cCallout type=\"warning\"\u003e\n  Never commit API keys to version control.\n\u003c/Callout\u003e\n\n### OAuth 2.0\n\nOAuth provides better security for user-facing apps.\n\n\u003cSteps\u003e\n  \u003cStep title=\"Register your app\"\u003e\n    Create an app in the provider dashboard.\n  \u003c/Step\u003e\n  \u003cStep title=\"Configure callback URL\"\u003e\n    Set your redirect URI in the app settings.\n  \u003c/Step\u003e\n\u003c/Steps\u003e\n```\n\n## Working with Images\n\n### Adding Images\n\nPlace images in the `public/` folder:\n\n```txt\npublic/\n├── images/\n│   ├── screenshot.png\n│   └── diagram.svg\n```\n\nReference them in MDX:\n\n```mdx\n![Dashboard screenshot](/images/screenshot.png)\n```\n\n### Image Best Practices\n\n**Use descriptive alt text:**\n```mdx\n![Login form showing email and password fields](/images/login.png)\n```\n\n**Optimize image sizes:**\n- Use WebP format when possible\n- Compress images before adding to repo\n- Keep images under 500KB\n\n**Use the Image component for advanced features:**\n```mdx\n\u003cImage\n  src=\"/images/hero.png\"\n  alt=\"Hero image\"\n  caption=\"The main dashboard view\"\n  width={800}\n  height={400}\n/\u003e\n```\n\n## Code Examples\n\n### Syntax Highlighting\n\nSpecify the language after the opening backticks:\n\n````markdown\n```javascript\nconst greeting = \"Hello, world!\"\nconsole.log(greeting)\n```\n\n```python\ndef greet():\n    print(\"Hello, world!\")\n```\n\n```bash\nnpm install specra\n```\n````\n\nSupported languages include: javascript, typescript, python, bash, json, yaml, markdown, html, css, and many more.\n\n### Highlighting Lines\n\nHighlight specific lines to draw attention:\n\n````markdown\n```javascript {2,4-6}\nfunction calculateTotal(items) {\n  const subtotal = items.reduce((sum, item) =\u003e sum + item.price, 0)\n  const tax = subtotal * 0.1\n  const shipping = 5.99\n  const total = subtotal + tax + shipping\n  return total\n}\n```\n````\n\n### File Names\n\nShow which file the code belongs to:\n\n````markdown\n```javascript title=\"src/utils.js\"\nexport function formatDate(date) {\n  return date.toLocaleDateString()\n}\n```\n````\n\n### Use the CodeBlock Component\n\nFor more control:\n\n```mdx\n\u003cCodeBlock\n  language=\"javascript\"\n  title=\"src/app.js\"\n  highlightLines={[3, 5]}\n  showLineNumbers={true}\n\u003e\n{`function app() {\n  const config = loadConfig()\n  const server = createServer(config)\n  server.listen(3000)\n  console.log(\"Server running\")\n}`}\n\u003c/CodeBlock\u003e\n```\n\n## Links and Navigation\n\n### Internal Links\n\nLink to other pages in your docs:\n\n```mdx\nSee the [Configuration guide](/docs/v1.0.0/configuration/overview) for details.\n```\n\nUse relative paths from the site root, including the version.\n\n### External Links\n\nExternal links open in a new tab automatically:\n\n```mdx\nCheck out the [Next.js documentation](https://nextjs.org/docs).\n```\n\n### Anchor Links\n\nLink to headings on the same page:\n\n```mdx\nJump to [Installation](#installation) below.\n```\n\nHeading anchors are auto-generated from the heading text in lowercase with hyphens.\n\n## Frontmatter Reference\n\nEvery MDX file needs frontmatter. Here's a complete example:\n\n```mdx\n---\ntitle: Advanced Topics\ndescription: Deep dive into advanced Specra features\nsidebar_position: 10\ntab_group: guides\nicon: zap\ntags: [advanced, configuration, optimization]\ndraft: false\n---\n\n# Your content starts here\n```\n\n**Required fields:**\n- `title`: Page title\n\n**Recommended fields:**\n- `description`: SEO description (150-160 characters)\n\n**Optional fields:**\n- `sidebar_position`: Number for sidebar ordering\n- `tab_group`: Assign to a tab group\n- `icon`: Lucide icon name\n- `tags`: Array of tags\n- `draft`: Hide in production if true\n\n## Advanced MDX Features\n\n### Importing Components\n\nWhile built-in components work automatically, you can import custom ones:\n\n```mdx\nimport { MyCustomComponent } from '@/components/custom'\n\n\u003cMyCustomComponent data=\"example\" /\u003e\n```\n\n### Using JavaScript Expressions\n\nEmbed JavaScript expressions:\n\n```mdx\nThe current year is {new Date().getFullYear()}.\n```\n\n### Conditional Content\n\nUse JavaScript for conditional rendering:\n\n```mdx\n{process.env.NODE_ENV === 'development' \u0026\u0026 (\n  \u003cCallout type=\"info\"\u003e\n    You're viewing the development version.\n  \u003c/Callout\u003e\n)}\n```\n\n## Version Management\n\nWhen you need multiple doc versions:\n\n```txt\ndocs/\n├── v1.0.0/\n│   └── getting-started.mdx\n├── v2.0.0/\n│   └── getting-started.mdx\n└── next/\n    └── getting-started.mdx\n```\n\nSet the active version in `specra.config.json`:\n\n```json\n{\n  \"site\": {\n    \"activeVersion\": \"v2.0.0\"\n  }\n}\n```\n\nUsers can switch versions with the version dropdown in the UI.\n\n## SEO Best Practices\n\n### Page Titles and Descriptions\n\nAlways include both in frontmatter:\n\n```mdx\n---\ntitle: Getting Started with Specra\ndescription: Learn how to install and configure Specra for your documentation needs\n---\n```\n\n### Descriptive Headings\n\nUse clear, descriptive headings that include keywords:\n\n**Good:**\n```markdown\n## Installing Specra with npm\n```\n\n**Bad:**\n```markdown\n## Installation\n```\n\n### Structured Content\n\nUse proper heading hierarchy (h1 → h2 → h3). Never skip levels.\n\n## Common Patterns\n\n### Prerequisites Section\n\nStart tutorials with prerequisites:\n\n```mdx\n## Prerequisites\n\nBefore you begin, ensure you have:\n\n- Node.js 18 or higher\n- A text editor\n- Basic knowledge of Markdown\n```\n\n### Step-by-Step Tutorials\n\nUse the Steps component:\n\n```mdx\n\u003cSteps\u003e\n  \u003cStep title=\"Install the package\"\u003e\n    Run npm install specra\n  \u003c/Step\u003e\n  \u003cStep title=\"Configure\"\u003e\n    Create a specra.config.json file\n  \u003c/Step\u003e\n  \u003cStep title=\"Start the server\"\u003e\n    Run npm run dev\n  \u003c/Step\u003e\n\u003c/Steps\u003e\n```\n\n### Code with Explanation\n\nPair code examples with explanations:\n\n```mdx\nConfigure your site title and description:\n\n```json\n{\n  \"site\": {\n    \"title\": \"My Docs\",\n    \"description\": \"Documentation for my project\"\n  }\n}\n```\n\nThe `title` appears in the browser tab and navigation. The `description` is used for SEO meta tags.\n```\n\n### Quick Reference Cards\n\nUse CardGrid for scannable reference sections:\n\n```mdx\n\u003cCardGrid cols={3}\u003e\n  \u003cCard icon=\"terminal\" title=\"CLI\" description=\"Command line tools\" href=\"/cli\" /\u003e\n  \u003cCard icon=\"book\" title=\"Guides\" description=\"Step-by-step tutorials\" href=\"/guides\" /\u003e\n  \u003cCard icon=\"code\" title=\"API\" description=\"API reference docs\" href=\"/api\" /\u003e\n\u003c/CardGrid\u003e\n```\n\n## Next Steps\n\n\u003cCardGrid cols={2}\u003e\n  \u003cCard\n    icon=\"palette\"\n    title=\"Components\"\n    description=\"Explore all available MDX components\"\n    href=\"/docs/v1.0.0/components\"\n  /\u003e\n  \u003cCard\n    icon=\"settings\"\n    title=\"Configuration\"\n    description=\"Customize your documentation site\"\n    href=\"/docs/v1.0.0/configuration/overview\"\n  /\u003e\n\u003c/CardGrid\u003e\n"])</script><script>self.__next_f.push([1,"32:T2a68,"])</script><script>self.__next_f.push([1,"\n# Writing Content in Specra\n\nSpecra uses MDX (Markdown + JSX) for documentation, giving you the simplicity of Markdown with the power of React components. This guide covers everything you need to write great documentation.\n\n## MDX Basics\n\nMDX files look like regular Markdown but let you use React components anywhere in your content.\n\n### Standard Markdown\n\nAll standard Markdown syntax works as expected:\n\n**Headings:**\n```markdown\n# Heading 1\n## Heading 2\n### Heading 3\n```\n\n**Text formatting:**\n```markdown\n**Bold text**\n*Italic text*\n~~Strikethrough~~\n`Inline code`\n```\n\n**Lists:**\n```markdown\n- Unordered list\n- Another item\n  - Nested item\n\n1. Ordered list\n2. Second item\n   1. Nested ordered item\n```\n\n**Links and images:**\n```markdown\n[Link text](https://example.com)\n![Alt text](/images/photo.png)\n```\n\n**Code blocks:**\n````markdown\n```javascript\nfunction hello() {\n  console.log(\"Hello, world!\")\n}\n```\n````\n\n**Tables:**\n```markdown\n| Column 1 | Column 2 | Column 3 |\n|----------|----------|----------|\n| Data 1   | Data 2   | Data 3   |\n| More     | Info     | Here     |\n```\n\n**Blockquotes:**\n```markdown\n\u003e This is a quote.\n\u003e It can span multiple lines.\n```\n\n**Horizontal rules:**\n```markdown\n---\n```\n\n## Using Components\n\nComponents are used with JSX syntax directly in your MDX:\n\n```mdx\n\u003cCallout type=\"info\"\u003e\n  This is a callout component!\n\u003c/Callout\u003e\n```\n\nAll components are automatically available - no imports needed.\n\n### Component Examples\n\n**Alert readers to important information:**\n```mdx\n\u003cCallou  Started with Specra\ndescription: Learn how to install and configure Specra for your documentation needs\n---\n```\n\n### Descriptive Headings\n\nUse clear, descriptive headings that include keywords:\n\n**Good:**\n```markdown\n## Installing Specra with npm\n```\n\n**Bad:**\n```markdown\n## Installation\n```\n\n### Structured Content\n\nUse proper heading hierarchy (h1 → h2 → h3). Never skip levels.\n\n## Common Patterns\n\n### Prerequisites Section\n\nStart tutorials with prerequisites:\n\n```mdx\n## Prerequisites\n\nBefore you begin, ensure you have:\n\n- Node.js 18 or higher\n- A text editor\n- Basic knowledge of Markdown\n```\n\n### Step-by-Step Tutorials\n\nUse the Steps component:\n\n```mdx\n\u003cSteps\u003e\n  \u003cStep title=\"Install the package\"\u003e\n    Run npm install specra\n  \u003c/Step\u003e\n  \u003cStep title=\"Configure\"\u003e\n    Create a specra.config.json file\n  \u003c/Step\u003e\n  \u003cStep title=\"Start the server\"\u003e\n    Run npm run dev\n  \u003c/Step\u003e\n\u003c/Steps\u003e\n```\n\n### Code with Explanation\n\nPair code examples with explanations:\n\n```mdx\nConfigure your site title and description:\n\n```json\n{\n  \"site\": {\n    \"title\": \"My Docs\",\n    \"description\": \"Documentation for my project\"\n  }\n}\n```\n\nThe `title` appears in the browser tab and navigation. The `description` is used for SEO meta tags.\n```\n\n### Quick Reference Cards\n\nUse CardGrid for scannable reference sections:\n\n```mdx\n\u003cCardGrid cols={3}\u003e\n  \u003cCard icon=\"terminal\" title=\"CLI\" description=\"Command line tools\" href=\"/cli\" /\u003e\n  \u003cCard icon=\"book\" title=\"Guides\" description=\"Step-by-step tutorials\" href=\"/guides\" /\u003e\n  \u003cCard icon=\"code\" title=\"API\" description=\"API reference docs\" href=\"/api\" /\u003e\n\u003c/CardGrid\u003e\n```\n\n## Next Steps\n\n\u003cCardGrid cols={2}\u003e\n  \u003cCard\n    icon=\"palette\"\n    title=\"Components\"\n    description=\"Explore all available MDX components\"\n    href=\"/docs/v1.0.0/components\"\n  /\u003e\n  \u003cCard\n    icon=\"settings\"\n    title=\"Configuration\"\n    description=\"Customize your documentation site\"\n    href=\"/docs/v1.0.0/configuration/overview\"\n  /\u003e\n\u003c/CardGrid\u003e\n"])</script><script>self.__next_f.push([1,"33:T543,\nEsta página demuestra la generación automática de documentación de API a partir de una especificación **OpenAPI 3.0**.\n\nEl componente detecta automáticamente el formato y lo analiza en nuestro sistema de documentación.\n\n\u003cCallout type=\"info\" title=\"Auto-detección\"\u003e\nEl componente `ApiReference` detecta automáticamente el formato OpenAPI cuando usa `parser=\"auto\"` (el valor predeterminado).\n\u003c/Callout\u003e\n\n---\n\n\u003cApiReference spec=\"/api-specs/openapi-example.json\" /\u003e\n\n---\n\n## Sobre este ejemplo\n\nEste ejemplo muestra cómo el analizador maneja:\n\n- ✅ Detección del **formato OpenAPI 3.0**\n- ✅ Resolución de **referencias de esquema** (`$ref`)\n- ✅ **Parámetros de ruta** (`{id}` convertido a `:id`)\n- ✅ **Esquemas de solicitud/respuesta** con ejemplos\n- ✅ **Esquemas de seguridad** (Tokens Bearer, claves API)\n- ✅ **Múltiples códigos de respuesta** (éxito y errores)\n\n## Usar su propia especificación OpenAPI\n\nPara usar su propia especificación OpenAPI:\n\n1. **Coloque su archivo de especificación** en el directorio `/public/api-specs/`\n2. **Referéncielo en su archivo MDX**:\n\n```mdx\n\u003cApiReference spec=\"/api-specs/your-api.json\" parser=\"openapi\" /\u003e\n```\n\nO deje que detecte automáticamente:\n\n```mdx\n\u003cApiReference spec=\"/api-specs/your-api.json\" /\u003e\n```\n\nEl analizador soporta formatos **OpenAPI 3.x** y **Swagger 2.0**.\n34:T543,\nEsta página demuestra la generación automática de documentación de API a partir de una especificación **OpenAPI 3.0**.\n\nEl componente detecta automáticamente el formato y lo analiza en nuestro sistema de documentación.\n\n\u003cCallout
