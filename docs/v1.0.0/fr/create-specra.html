xt/static/chunks/4faefc5fed54611f.js\"],\"Header\"]\n15:T1a5b,"])</script><script>self.__next_f.push([1,"\n# Qu'est-ce que Specra ?\n\nSpecra est un cadre de documentation moderne qui rend la rédaction et la publication de documentation technique réellement agréables. Construit sur Next.js, MDX et Tailwind CSS, il vous offre l'apparence et la convivialité des plateformes de documentation premium comme Mintlify, mais vous l'hébergez vous-même.\n\nSi vous avez déjà lutté avec des outils de documentation maladroits ou payé beaucoup trop cher pour des solutions hébergées, Specra est là pour changer cela. Rédigez vos documents en Markdown, ajoutez des composants interactifs lorsque vous en avez besoin, et déployez où vous le souhaitez.\n\n## Pourquoi nous avons construit Specra\n\nLa documentation ne devrait pas être difficile. Vous devriez pouvoir vous concentrer sur la rédaction d'un excellent contenu, pas vous battre avec des fichiers de configuration ou lutter contre vos outils. Voici ce que nous croyons :\n\n**Le contenu passe avant tout.** Déposez vos fichiers MDX dans un dossier, et Specra s'occupe du reste. Pas de routage manuel, pas de configuration de navigation, pas de maux de tête de configuration de build.\n\n**L'expérience développeur compte.** Le rechargement à chaud signifie que vous voyez les changements instantanément. TypeScript vous garde en sécurité. La bibliothèque de composants est là quand vous en avez besoin, invisible quand vous n'en avez pas besoin.\n\n**La performance n'est pas négociable.** Pages pré-rendues, mise en cache en périphérie, images optimisées. Vos documents se chargent rapidement, toujours.\n\n**Flexibilité plutôt que verrouillage.** Déployez sur Vercel, GitHub Pages, Netlify, ou n'importe où qui exécute Node.js ou sert des fichiers statiques. Vous possédez votre contenu et votre infrastructure.\n\n## Fonctionnalités clés\n\n\u003cCardGrid cols={2}\u003e\n  \u003cCard icon=\"zap\" title=\"Rapide comme l'éclair\" description=\"Génération de site statique avec mise en cache en périphérie. Vos documents se chargent en millisecondes, pas en secondes.\" /\u003e\n  \u003cCard icon=\"search\" title=\"Recherche puissante\" description=\"L'intégration MeiliSearch vous offre une recherche instantanée, tolérante aux fautes de frappe, qui fonctionne réellement.\" /\u003e\n  \u003cCard icon=\"git-branch\" title=\"Gestion des versions\" description=\"Livrez plusieurs versions de documents côte à côte. Parfait pour les API et les bibliothèques avec des changements de rupture.\" /\u003e\n  \u003cCard icon=\"palette\" title=\"Thèmes magnifiques\" description=\"Mode sombre prêt à l'emploi. Personnalisez les couleurs, les polices et les styles pour correspondre à votre marque.\" /\u003e\n  \u003cCard icon=\"code\" title=\"Composants MDX\" description=\"Utilisez Markdown pour le contenu, les composants React pour l'interactivité. Le meilleur des deux mondes.\" /\u003e\n  \u003cCard icon=\"layout\" title=\"Navigation intelligente\" description=\"Barre latérale générée automatiquement à partir de votre structure de fichiers. Sections pliables, fil d'Ariane, table des matières.\" /\u003e\n\u003c/CardGrid\u003e\n\n## La pile technique\n\nNous avons construit Specra sur des technologies modernes et éprouvées :\n\n- **Next.js 15+** avec l'App Router pour une performance et une expérience développeur optimales\n- **MDX** pour que vous puissiez mélanger Markdown avec des composants React\n- **Tailwind CSS** pour un style à la fois puissant et maintenable\n- **MeiliSearch** pour une recherche rapide et tolérante aux fautes de frappe\n- **TypeScript** parce que la sécurité de type gagne du temps et de la santé mentale\n\n## Ce que vous obtenez\n\nLorsque vous utilisez Specra, vous obtenez un système de documentation complet :\n\n**Composants de contenu riches**\nCallouts, onglets, blocs de code avec coloration syntaxique, cartes, accordéons, étapes, diagrammes avec Mermaid, équations mathématiques avec KaTeX, et plus encore.\n\n**Navigation automatique**\nVotre structure de dossiers devient votre barre latérale. Ajoutez un fichier `_category_.json` pour personnaliser les sections. C'est tout.\n\n**Fonctionnalités intelligentes**\nEstimations du temps de lecture, horodatages de dernière mise à jour, prise en charge des étiquettes, fil d'Ariane, table des matières réactive avec suivi du défilement.\n\n**Documentation API**\nGénérez de magnifiques références API à partir de spécifications OpenAPI, de collections Postman ou du propre format de Specra. Playground interactif inclus.\n\n**Support multi-version**\nMaintenez des documents pour v1, v2, v3 simultanément. Le sélecteur de version permet aux utilisateurs de passer de l'un à l'autre instantanément.\n\n**Recherche qui fonctionne**\nRecherche en texte intégral avec raccourcis clavier (⌘K ou Ctrl+K). Fonctionne hors ligne avec la recherche locale ou s'adapte avec MeiliSearch.\n\n**Système de thème**\nRespecte les préférences du système, prend en charge le basculement manuel sombre/clair, personnalisable via des variables CSS.\n\n**Prêt pour la production**\nOptimisation SEO, accessibilité intégrée, en-têtes de sécurité, surveillance des performances, exemples CI/CD.\n\n## Comment ça marche\n\nSpecra suit une philosophie simple : vous écrivez, nous nous occupons du reste.\n\n\u003cSteps\u003e\n  \u003cStep title=\"Écrire en MDX\"\u003e\n    Créez des fichiers `.mdx` dans votre dossier `docs/`. Utilisez le frontmatter pour les métadonnées. Écrivez en Markdown pour le contenu. Mélangez des composants React si nécessaire.\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Génération automatique\"\u003e\n    Specra analyse vos fichiers, génère la navigation, extrait les titres pour la table des matières et configure le routage automatiquement.\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Aperçu instantané\"\u003e\n    Lancez le serveur de développement et voyez les changements en direct pendant que vous tapez. Le rechargement à chaud vous garde dans le flux.\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Déployer n'importe où\"\u003e\n    Construisez pour l'hébergement Node.js (Vercel, Railway) ou exportez en tant que fichiers statiques (GitHub Pages, Netlify, Cloudflare Pages). Une base de code, plusieurs cibles de déploiement.\n  \u003c/Step\u003e\n\u003c/Steps\u003e\n\n## Qui devrait utiliser Specra ?\n\nSpecra est parfait pour :\n\n- **Les mainteneurs open source** qui ont besoin de documents professionnels sans les frais d'hébergement\n- **Les startups** qui veulent une excellente documentation sans prix d'entreprise\n- **Les développeurs API** qui ont besoin de documents versionnés et de références API interactives\n- **Les rédacteurs techniques** qui préfèrent Markdown aux éditeurs WYSIWYG\n- **Les équipes** qui veulent que les documents vivent dans le même dépôt que leur code\n\n## Prêt à commencer ?\n\nPlongez dans le guide [Commencer](/docs/v1.0.0/getting-started) et ayez votre premier site de documentation fonctionnel en moins de 5 minutes.\n"])</script><script>self.__next_f.push([1,"16:T1a5b,"])</script><script>self.__next_f.push([1,"\n# Qu'est-ce que Specra ?\n\nSpecra est un cadre de documentation moderne qui rend la rédaction et la publication de documentation technique réellement agréables. Construit sur Next.js, MDX et Tailwind CSS, il vous offre l'apparence et la convivialité des plateformes de documentation premium comme Mintlify, mais vous l'hébergez vous-même.\n\nSi vous avez déjà lutté avec des outils de documentation maladroits ou payé beaucoup trop cher pour des solutions hébergées, Specra est là pour changer cela. Rédigez vos documents en Markdown, ajoutez des composants interactifs lorsque vous en avez besoin, et déployez où vous le souhaitez.\n\n## Pourquoi nous avons construit Specra\n\nLa documentation ne devrait pas être difficile. Vous devriez pouvoir vous concentrer sur la rédaction d'un excellent contenu, pas vous battre avec des fichiers de configuration ou lutter contre ation intelligente\" description=\"Barre latérale générée automatiquement à partir de votre structure de fichiers. Sections pliables, fil d'Ariane, table des matières.\" /\u003e\n\u003c/CardGrid\u003e\n\n## La pile technique\n\nNous avons construit Specra sur des technologies modernes et éprouvées :\n\n- **Next.js 15+** avec l'App Router pour une performance et une expérience développeur optimales\n- **MDX** pour que vous puissiez mélanger Markdown avec des composants React\n- **Tailwind CSS** pour un style à la fois puissant et maintenable\n- **MeiliSearch** pour une recherche rapide et tolérante aux fautes de frappe\n- **TypeScript** parce que la sécurité de type gagne du temps et de la santé mentale\n\n## Ce que vous obtenez\n\nLorsque vous utilisez Specra, vous obtenez un système de documentation complet :\n\n**Composants de contenu riches**\nCallouts, onglets, blocs de code avec coloration syntaxique, cartes, accordéons, étapes, diagrammes avec Mermaid, équations mathématiques avec KaTeX, et plus encore.\n\n**Navigation automatique**\nVotre structure de dossiers devient votre barre latérale. Ajoutez un fichier `_category_.json` pour personnaliser les sections. C'est tout.\n\n**Fonctionnalités intelligentes**\nEstimations du temps de lecture, horodatages de dernière mise à jour, prise en charge des étiquettes, fil d'Ariane, table des matières réactive avec suivi du défilement.\n\n**Documentation API**\nGénérez de magnifiques références API à partir de spécifications OpenAPI, de collections Postman ou du propre format de Specra. Playground interactif inclus.\n\n**Support multi-version**\nMaintenez des documents pour v1, v2, v3 simultanément. Le sélecteur de version permet aux utilisateurs de passer de l'un à l'autre instantanément.\n\n**Recherche qui fonctionne**\nRecherche en texte intégral avec raccourcis clavier (⌘K ou Ctrl+K). Fonctionne hors ligne avec la recherche locale ou s'adapte avec MeiliSearch.\n\n**Système de thème**\nRespecte les préférences du système, prend en charge le basculement manuel sombre/clair, personnalisable via des variables CSS.\n\n**Prêt pour la production**\nOptimisation SEO, accessibilité intégrée, en-têtes de sécurité, surveillance des performances, exemples CI/CD.\n\n## Comment ça marche\n\nSpecra suit une philosophie simple : vous écrivez, nous nous occupons du reste.\n\n\u003cSteps\u003e\n  \u003cStep title=\"Écrire en MDX\"\u003e\n    Créez des fichiers `.mdx` dans votre dossier `docs/`. Utilisez le frontmatter pour les métadonnées. Écrivez en Markdown pour le contenu. Mélangez des composants React si nécessaire.\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Génération automatique\"\u003e\n    Specra analyse vos fichiers, génère la navigation, extrait les titres pour la table des matières et configure le routage automatiquement.\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Aperçu instantané\"\u003e\n    Lancez le serveur de développement et voyez les changements en direct pendant que vous tapez. Le rechargement à chaud vous garde dans le flux.\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Déployer n'importe où\"\u003e\n    Construisez pour l'hébergement Node.js (Vercel, Railway) ou exportez en tant que fichiers statiques (GitHub Pages, Netlify, Cloudflare Pages). Une base de code, plusieurs cibles de déploiement.\n  \u003c/Step\u003e\n\u003c/Steps\u003e\n\n## Qui devrait utiliser Specra ?\n\nSpecra est parfait pour :\n\n- **Les mainteneurs open source** qui ont besoin de documents professionnels sans les frais d'hébergement\n- **Les startups** qui veulent une excellente documentation sans prix d'entreprise\n- **Les développeurs API** qui ont besoin de documents versionnés et de références API interactives\n- **Les rédacteurs techniques** qui préfèrent Markdown aux éditeurs WYSIWYG\n- **Les équipes** qui veulent que les documents vivent dans le même dépôt que leur code\n\n## Prêt à commencer ?\n\nPlongez dans le guide [Commencer](/docs/v1.0.0/getting-started) et ayez votre premier site de documentation fonctionnel en moins de 5 minutes.\n"])</script><script>self.__next_f.push([1,"17:T2487,"])</script><script>self.__next_f.push([1,"\nSpecra fournit un système puissant mais flexible pour documenter les API REST. Que vous ayez 5 ou 500 points de terminaison, nous avons ce qu'il vous faut.\n\n## Deux approches\n\n### 1. Documentation générée automatiquement\n\nParfait pour les grandes API ou lorsque vous avez déjà des spécifications.\n\n\u003cdiv className=\"grid grid-cols-1 md:grid-cols-3 gap-4 not-prose my-6\"\u003e\n  \u003cdiv className=\"border border-border rounded-lg p-4\"\u003e\n    \u003cdiv className=\"text-2xl mb-2\"\u003e📋\u003c/div\u003e\n    \u003ch4 className=\"font-semibold mb-1\"\u003eFormat Specra\u003c/h4\u003e\n    \u003cp className=\"text-sm text-muted-foreground\"\u003eFormat JSON simple\u003c/p\u003e\n  \u003c/div\u003e\n  \u003cdiv className=\"border border-border rounded-lg p-4\"\u003e\n    \u003cdiv className=\"text-2xl mb-2\"\u003e🔧\u003c/div\u003e\n    \u003ch4 className=\"font-semibold mb-1\"\u003eOpenAPI 3.x\u003c/h4\u003e\n    \u003cp className=\"text-sm text-muted-foreground\"\u003eStandard industriel\u003c/p\u003e\n  \u003c/div\u003e\n  \u003cdiv className=\"border border-border rounded-lg p-4\"\u003e\n    \u003cdiv className=\"text-2xl mb-2\"\u003e📮\u003c/div\u003e\n    \u003ch4 className=\"font-semibold mb-1\"\u003ePostman v2.x\u003c/h4\u003e\n    \u003cp className=\"text-sm text-muted-foreground\"\u003eExporter depuis Postman\u003c/p\u003e\n  \u003c/div\u003e\n\u003c/div\u003e\n\nCréez ou exportez simplement votre fichier de spécification et référencez-le :\n\n```mdx\n\u003cApiReference spec=\"/api-specs/my-api.json\" /\u003e\n```\n\nLe système **détecte automatiquement** le format et génère une belle documentation interactive.\n\n**Exemples :**\n- [Format Specra (JSONPlaceholder) →](/docs/v1.0.0/api-test)\n- [Format OpenAPI 3.0 →](/docs/v1.0.0/api-openapi)\n- [Collection Postman →](/docs/v1.0.0/api-postman)\n\n[En savoir plus sur les formats →](/docs/v1.0.0/api-formats)\n\n---\n\n### 2. Composants MDX manuels\n\nParfait pour les petites API ou lorsque vous avez besoin de mises en page personnalisées.\n\nUtilisez des composants individuels pour élaborer votre documentation :\n\n```mdx\n\u003cApiEndpoint\n  method=\"GET\"\n  path=\"/api/users/:id\"\n  summary=\"Obtenir un utilisateur par ID\"\n\u003e\n  \u003cApiParams params={[...]} /\u003e\n  \u003cApiResponse status={200} example={{...}} /\u003e\n  \u003cApiPlayground method=\"GET\" path=\"/api/users/123\" /\u003e\n\u003c/ApiEndpoint\u003e\n```\n\n**Exemple :**\n- [Exemple de composant manuel →](/docs/v1.0.0/api-example)\n\n---\n\n## Démarrage rapide\n\n### Généré automatiquement (Recommandé)\n\n1. **Créez votre fichier de spécification** (Specra, OpenAPI ou Postman)\n2. **Placez-le dans** `/public/api-specs/my-api.json`\n3. **Ajoutez à votre MDX** :\n\n```mdx\n---\ntitle: Référence API\n---\n\n# Ma documentation API\n\n\u003cApiReference spec=\"/api-specs/my-api.json\" /\u003e\n```\n\nC'est tout ! Vous avez maintenant :\n- ✅ Documentation des points de terminaison générée automatiquement\n- ✅ Playground API interactif\n- ✅ Interface utilisateur en accordéon pliable\n- ✅ Exemples avec coloration syntaxique\n- ✅ Schémas de requête/réponse\n\n### Composants manuels\n\n1. **Créez un fichier MDX** dans `docs/`\n2. **Utilisez les composants API** :\n\n```mdx\n---\ntitle: Référence API\n---\n\n# Mon API\n\n\u003cApiEndpoint method=\"GET\" path=\"/users\" summary=\"Lister les utilisateurs\"\u003e\n  \u003cApiParams\n    title=\"Paramètres de requête\"\n    params={[\n      { name: \"page\", type: \"number\", description: \"Numéro de page\" }\n    ]}\n  /\u003e\n\n  \u003cApiResponse\n    status={200}\n    description=\"Succès\"\n    example={[{ id: 1, name: \"John\" }]}\n  /\u003e\n\n  \u003cApiPlayground\n    method=\"GET\"\n    path=\"/users\"\n    baseUrl=\"https://api.example.com\"\n  /\u003e\n\u003c/ApiEndpoint\u003e\n```\n\n## Composants disponibles\n\n### `\u003cApiReference\u003e`\n\nGénérer automatiquement des documents à partir de fichiers de spécification.\n\n```tsx\n\u003cApiReference\n  spec=\"/api-specs/my-api.json\"  // Chemin vers le fichier de spécification\n  parser=\"auto\"                   // auto | specra | openapi | postman\n  showPlayground={true}           // Afficher le playground interactif\n/\u003e\n```\n\n### `\u003cApiEndpoint\u003e`\n\nDocumenter un seul point de terminaison (style accordéon).\n\n```tsx\n\u003cApiEndpoint\n  method=\"GET\"              // GET | POST | PUT | PATCH | DELETE\n  path=\"/api/users/:id\"     // Chemin API\n  summary=\"Obtenir un utilisateur par ID\"  // Courte description\n  defaultOpen={false}       // Démarrer développé ?\n\u003e\n  {/* Composants enfants */}\n\u003c/ApiEndpoint\u003e\n```\n\n### `\u003cApiParams\u003e`\n\nAfficher les paramètres (chemin, requête, corps).\n\n```tsx\n\u003cApiParams\n  title=\"Paramètres de chemin\"\n  params={[\n    {\n      name: \"id\",\n      type: \"string\",\n      required: true,\n      description: \"ID Utilisateur\",\n      example: \"user_123\"\n    }\n  ]}\n/\u003e\n```\n\n### `\u003cApiResponse\u003e`\n\nAfficher des exemples de réponse.\n\n```tsx\n\u003cApiResponse\n  status={200}\n  description=\"Utilisateur trouvé\"\n  example={{\n    id: \"user_123\",\n    name: \"John Doe\",\n    email: \"john@example.com\"\n  }}\n/\u003e\n```\n\n### `\u003cApiPlayground\u003e`\n\nTest d'API interactif.\n\n```tsx\n\u003cApiPlayground\n  method=\"GET\"\n  path=\"/users/:id\"\n  baseUrl=\"https://api.example.com\"\n  headers={{ \"Authorization\": \"Bearer ...\" }}\n  pathParams={[\n    { name: \"id\", type: \"string\", example: \"user_123\" }\n  ]}\n  defaultBody='{\"key\": \"value\"}'\n/\u003e\n```\n\n## Fonctionnalités\n\n### Playground interactif\n\nChaque point de terminaison comprend un terrain de jeu intégré où les utilisateurs peuvent :\n- ✅ Modifier les paramètres de chemin\n- ✅ Modifier les en-têtes de requête\n- ✅ Mettre à jour le corps de la requête\n- ✅ Envoyer de vraies requêtes API\n- ✅ Voir les réponses formatées\n\n### Interface utilisateur en accordéon\n\nLes points de terminaison sont pliables par défaut, ce qui permet de :\n- Parcourir rapidement de nombreux points de terminaison\n- Développer uniquement ce dont vous avez besoin\n- Garder la page propre et organisée\n\n### Coloration syntaxique\n\nTous les exemples de code incluent :\n- Coloration syntaxique JSON\n- Numéros de ligne\n- Bouton de copie\n- Prise en charge du mode sombre\n\n### Authentification\n\nDocumentez vos exigences d'authentification :\n- Jetons Bearer\n- Clés API\n- Authentification Basic\n- En-têtes personnalisés\n\n## Prise en charge des formats\n\n| Format | Version | Cas d'utilisation |\n|--------|---------|-------------------|\n| **Specra** | 1.0 | Format simple et personnalisé pour toute API |\n| **OpenAPI** | 3.x, Swagger 2.0 | Standard industriel, génération de code |\n| **Postman** | Collection v2.x | Utilisateurs Postman, exportation rapide |\n\n[Comparer les formats →](/docs/v1.0.0/api-formats)\n\n## Exemples\n\n### API complète (Générée automatiquement)\n\nUtilisation de JSONPlaceholder comme exemple réel :\n\n[Voir l'exemple en direct →](/docs/v1.0.0/api-test)\n\n### Spécification OpenAPI\n\nDocumentation API de niveau entreprise :\n\n[Voir l'exemple OpenAPI →](/docs/v1.0.0/api-openapi)\n\n### Collection Postman\n\nExporté directement depuis Postman :\n\n[Voir l'exemple Postman →](/docs/v1.0.0/api-postman)\n\n### Composants manuels\n\nFabriqué à la main pour des besoins personnalisés :\n\n[Voir l'exemple manuel →](/docs/v1.0.0/api-example)\n\n## Meilleures pratiques\n\n### 1. Choisissez la bonne approche\n\n**Utilisez généré automatiquement** lorsque :\n- Vous avez \u003e 10 points de terminaison\n- Vous avez déjà un fichier de spécification\n- Vous voulez de la cohérence\n- Vous avez besoin de génération de code\n\n**Utilisez des composants manuels** lorsque :\n- Vous avez \u003c 10 points de terminaison\n- Vous avez besoin de mises en page personnalisées\n- Vous voulez un contrôle total\n- Vous documentez progressivement\n\n### 2. Fournissez des exemples\n\nIncluez toujours des exemples réalistes :\n- Corps de requête avec des données réelles\n- Exemples de réponse qui correspondent à la réalité\n- Cas limites et erreurs\n- Exemples d'authentification\n\n### 3. Gardez-le à jour\n\n**Pour les documents générés automatiquement :**\n- Régénérez les spécifications lorsque le code change\n- Réexportez régulièrement les collections Postman\n- Versionnez vos fichiers de spécification\n\n**Pour les documents manuels :**\n- Vérifiez lorsque l'API change\n- Testez le playground régulièrement\n- Mettez à jour les exemples\n\n### 4. Organiser par fonctionnalité\n\nGroupez les points de terminaison associés :\n\n```mdx\n## Gestion des utilisateurs\n\n\u003cApiReference spec=\"/api-specs/users.json\" /\u003e\n\n## Catalogue de produits\n\n\u003cApiReference spec=\"/api-specs/products.json\" /\u003e\n\n## Commandes\n\n\u003cApiReference spec=\"/api-specs/orders.json\" /\u003e\n```\n\n### 5. Ajouter du contexte\n\nAméliorez avec un texte explicatif :\n\n```mdx\n## Authentification\n\nTous les points de terminaison nécessitent un jeton JWT valide.\n\n\u003cCallout type=\"info\"\u003e\nObtenez votre clé API depuis le [tableau de bord développeur](https://example.com/dashboard).\n\u003c/Callout\u003e\n\n\u003cApiReference spec=\"/api-specs/my-api.json\" /\u003e\n```\n\n## Prochaines étapes\n\nPrêt à documenter votre API ?\n\n1. **Choisissez votre format** - [Comparer les formats →](/docs/v1.0.0/api-formats)\n2. **Voir les exemples** - [Voir les exemples →](/docs/v1.0.0/api-test)\n3. **Commencer à construire** - Créez votre premier fichier de spécification\n4. **Mettre en ligne** - Déployez votre documentation\n\n\u003cCallout type=\"success\" title=\"Victoire rapide\"\u003e\nVous avez une collection Postman ? Exportez-la et vous avez terminé en 2 minutes !\n\u003c/Callout\u003e\n\n## Ressources\n\n- [Guide des formats pris en charge](/docs/v1.0.0/api-formats)\n- [Exemple de format Specra](/docs/v1.0.0/api-test)\n- [Exemple OpenAPI](/docs/v1.0.0/api-openapi)\n- [Exemple Postman](/docs/v1.0.0/api-postman)\n- [Exemple de composants manuels](/docs/v1.0.0/api-example)\n- [Docs techniques du parseur](/API_PARSERS.md)\n"])</script><script>self.__next_f.push([1,"18:T2487,"])</script><script>self.__next_f.push([1,"\nSpecra fournit un système puissant mais flexible pour documenter les API REST. Que vous ayez 5 ou 500 points de terminaison, nous avons ce qu'il vous faut.\n\n## Deux approches\n\n### 1. Documentation générée automatiquement\n\nParfait pour les grandes API ou lorsque vous avez déjà des spécifications.\n\n\u003cdiv className=\"grid grid-cols-1 md:grid-cols-3 gap-4 not-prose my-6\"\u003e\n  \u003cdiv className=\"border border-border rounded-lg p-4\"\u003e\n    \u003cdiv className=\"text-2xl mb-2\"\u003e📋\u003c/div\u003e\n    \u003ch4 className=\"font-semibold mb-1\"\u003eFormat Specra\u003c/h4\u003e\n    \u003cp className=\"text-sm text-muted-foreground\"\u003eFormat JSON simple\u003c/p\u003e\n  \u003c/div\u003e\n  \u003cdiv className=\"border border-border rounded-lg p-4\"\u003e\n    \u003cdiv className=\"text-2xl mb-2\"\u003e🔧\u003c/div\u003e\n    \u003ch4 className=\"font-semibold mb-1\"\u003eOpenAPI 3.x\u003c/h4\u003e\n    \u003cp className=\"text-sm text-muted-foreground\"\u003eStandard industriel\u003c/p\u003e\n  \u003c/div\u003e\n  \u003cdiv className=\"border border-border rounded-lg p-4\"\u003e\n    \u003cdiv className=\"text-2xl mb-2\"\u003e📮\u003c/div\u003e\n    \u003ch4 className=\"font-semibold mb-1\"\u003ePostman v2.x\u003c/h4\u003e\n    \u003cp className=\"text-sm text-muted-foreground\"\u003eExporter depuis Postman\u003c/p\u003e\n  \u003c/div\u003e\n\u003c/div\u003e\n\nCréez ou exportez simplement votre fichier de spécification et référencez-le :\n\n```mdx\n\u003cApiReference spec=\"/api-specs/my-api.json\" /\u003e\n```\n\nLe système **détecte automatiquement** le format et génère une belle documentation interactive.\n\n**Exemples :**\n- [Format Specra (JSONPlaceholder) →](/docs/v1.0.0/api-test)\n- [Format OpenAPI 3.0 →](/docs/v1.0.0/api-openapi)\n- [Collection Postman →](/docs/v1.0.0/api-postman)\n\n[En savoir plus sur les formats →](/docs/v1.0.0/api-formats)\n\n---\n\n### 2. Composants MDX manuels\n\nParfait pour les petites API ou lorsque vous avez besoin de mises en page personnalisées.\n\nUtilisez des composants individuels pour élaborer votre documentation :\n\n```mdx\n\u003cApiEndpoint\n  method=\"GET\"\n  path=\"/api/users/:id\"\n  summary=\"Obtenir un utilisateur par ID\"\n\u003e\n  \u003cApiParams params={[...]} /\u003e\n  \u003cApiResponse status={200} example={{...}} /\u003e\n  \u003cApiPlayground method=\"GET\" path=\"/api/users/123\" /\u003e\n\u003c/ApiEndpoint\u003e\n```\n\n**Exemple :**\n- [Exemple de composant manuel →](/docs/v1.0.0/api-example)\n\n---\n\n## Démarrage rapide\n\n### Généré automatiquement (Recommandé)\n\n1. **Créez votre fichier de spécification** (Specra, OpenAPI ou Postman)\n2. **Placez-le dans** `/public/api-specs/my-api.json`\n3. **Ajoutez à votre MDX** :\n\n```mdx\n---\ntitle: Référence API\n---\n\n# Ma documentation API\n\n\u003cApiReference spec=\"/api-specs/my-api.json\" /\u003e\n```\n\nC'est tout ! Vous avez maintenant :\n- ✅ Documentation des points de terminaison générée automatiquement\n- ✅ Playground API interactif\n- ✅ Interface utilisateur en accordéon pliable\n- ✅ Exemples avec coloration syntaxique\n- ✅ Schémas de requête/réponse\n\n### Composants manuels\n\n1. **Créez un fichier MDX** dans `docs/`\n2. **Utilisez les composants API** :\n\n```mdx\n---\ntitle: Référence API\n---\n\n# Mon API\n\n\u003cApiEndpoint method=\"GET\" path=\"/users\" summary=\"Lister les utilisateurs\"\u003e\n  \u003cApiParams\n    title=\"Paramètres de requête\"\n    params={[\n      { name: \"page\", type: \"number\", description: \"Numéro de page\" }\n    ]}\n  /\u003e\n\n  \u003cApiResponse\n    status={200}\n    description=\"Succès\"\n    example={[{ id: 1, name: \"John\" }]}\n  /\u003e\n\n  \u003cApiPlayground\n    method=\"GET\"\n    path=\"/users\"\n    baseUrl=\"https://api.example.com\"\n  /\u003e\n\u003c/ApiEndpoint\u003e\n```\n\n## Composants disponibles\n\n### `\u003cApiReference\u003e`\n\nGénérer automatiquement des documents à partir de fichiers de spécification.\n\n```tsx\n\u003cApiReference\n  spec=\"/api-specs/my-api.json\"  // Chemin vers le fichier de spécification\n  parser=\"auto\"                   // auto | specra | openapi | postman\n  showPlayground={true}           // Afficher le playground interactif\n/\u003e\n```\n\n### `\u003cApiEndpoint\u003e`\n\nDocumenter un seul point de terminaison (style accordéon).\n\n```tsx\n\u003cApiEndpoint\n  method=\"GET\"              // GET | POST | PUT | PATCH | DELETE\n  path=\"/api/users/:id\"     // Chemin API\n  summary=\"Obtenir un utilisateur par ID\"  // Courte description\n  defaultOpen={false}       // Démarrer développé ?\n\u003e\n  {/* Composants enfants */}\n\u003c/ApiEndpoint\u003e\n```\n\n### `\u003cApiParams\u003e`\n\nAfficher les paramètres (chemin, requête, corps).\n\n```tsx\n\u003cApiParams\n  title=\"Paramètres de chemin\"\n  params={[\n    {\n      name: \"id\",\n      type: \"string\",\n      required: true,\n      description: \"ID Utilisateur\",\n      example: \"user_123\"\n    }\n  ]}\n/\u003e\n```\n\n### `\u003cApiResponse\u003e`\n\nAfficher des exemples de réponse.\n\n```tsx\n\u003cApiResponse\n  status={200}\n  description=\"Utilisateur trouvé\"\n  example={{\n    id: \"user_123\",\n    name: \"John Doe\",\n    email: \"john@example.com\"\n  }}\n/\u003e\n```\n\n### `\u003cApiPlayground\u003e`\n\nTest d'API interactif.\n\n```tsx\n\u003cApiPlayground\n  method=\"GET\"\n  path=\"/users/:id\"\n  baseUrl=\"https://api.example.com\"\n  headers={{ \"Authorization\": \"Bearer ...\" }}\n  pathParams={[\n    { name: \"id\", type: \"string\", example: \"user_123\" }\n  ]}\n  defaultBody='{\"key\": \"value\"}'\n/\u003e\n```\n\n## Fonctionnalités\n\n### Playground interactif\n\nChaque point de terminaison comprend un terrain de jeu intégré où les utilisateurs peuvent :\n- ✅ Modifier les paramètres de chemin\n- ✅ Modifier les en-têtes de requête\n- ✅ Mettre à jour le corps de la requête\n- ✅ Envoyer de vraies requêtes API\n- ✅ Voir les réponses formatées\n\n### Interface utilisateur en accordéon\n\nLes points de terminaison sont pliables par défaut, ce qui permet de :\n- Parcourir rapidement de nombreux points de terminaison\n- Développer uniquement ce dont vous avez besoin\n- Garder la page propre et organisée\n\n### Coloration syntaxique\n\nTous les exemples de code incluent :\n- Coloration syntaxique JSON\n- Numéros de ligne\n- Bouton de copie\n- Prise en charge du mode sombre\n\n### Authentification\n\nDocumentez vos exigences d'authentification :\n- Jetons Bearer\n- Clés API\n- Authentification Basic\n- En-têtes personnalisés\n\n## Prise en charge des formats\n\n| Format | Version | Cas d'utilisation |\n|--------|---------|-------------------|\n| **Specra** | 1.0 | Format simple et personnalisé pour toute API |\n| **OpenAPI** | 3.x, Swagger 2.0 | Standard industriel, génération de code |\n| **Postman** | Collection v2.x | Utilisateurs Postman, exportation rapide |\n\n[Comparer les formats →](/docs/v1.0.0/api-formats)\n\n## Exemples\n\n### API complète (Générée automatiquement)\n\nUtilisation de JSONPlaceholder comme exemple réel :\n\n[Voir l'exemple en direct →](/docs/v1.0.0/api-test)\n\n### Spécification OpenAPI\n\nDocumentation API de niveau entreprise :\n\n[Voir l'exemple OpenAPI →](/docs/v1.0.0/api-openapi)\n\n### Collection Postman\n\nExporté directement depuis Postman :\n\n[Voir l'exemple Postman →](/docs/v1.0.0/api-postman)\n\n### Composants manuels\n\nFabriqué à la main pour des besoins personnalisés :\n\n[Voir l'exemple manuel →](/docs/v1.0.0/api-example)\n\n## Meilleures pratiques\n\n### 1. Choisissez la bonne approche\n\n**Utilisez généré automatiquement** lorsque :\n- Vous avez \u003e 10 points de terminaison\n- Vous avez déjà un fichier de spécification\n- Vous voulez de la cohérence\n- Vous avez besoin de génération de code\n\n**Utilisez des composants manuels** lorsque :\n- Vous avez \u003c 10 points de terminaison\n- Vous avez besoin de mises en page personnalisées\n- Vous voulez un contrôle total\n- Vous documentez progressivement\n\n### 2. Fournissez des exemples\n\nIncluez toujours des exemples réalistes :\n- Corps de requête avec des données réelles\n- Exemples de réponse qui correspondent à la réalité\n- Cas limites et erreurs\n- Exemples d'authentification\n\n### 3. Gardez-le à jour\n\n**Pour les documents générés automatiquement :**\n- Régénérez les spécifications lorsque le code change\n- Réexportez régulièrement les collections Postman\n- Versionnez vos fichiers de spécification\n\n**Pour les documents manuels :**\n- Vérifiez lorsque l'API change\n- Testez le playground régulièrement\n- Mettez à jour les exemples\n\n### 4. Organiser par fonctionnalité\n\nGroupez les points de terminaison associés :\n\n```mdx\n## Gestion des utilisateurs\n\n\u003cApiReference spec=\"/api-specs/users.json\" /\u003e\n\n## Catalogue de produits\n\n\u003cApiReference spec=\"/api-specs/products.json\" /\u003e\n\n## Commandes\n\n\u003cApiReference spec=\"/api-specs/orders.json\" /\u003e\n```\n\n### 5. Ajouter du contexte\n\nAméliorez avec un texte explicatif :\n\n```mdx\n## Authentification\n\nTous les points de terminaison nécessitent un jeton JWT valide.\n\n\u003cCallout type=\"info\"\u003e\nObtenez votre clé API depuis le [tableau de bord développeur](https://example.com/dashboard).\n\u003c/Callout\u003e\n\n\u003cApiReference spec=\"/api-specs/my-api.json\" /\u003e\n```\n\n## Prochaines étapes\n\nPrêt à documenter votre API ?\n\n1. **Choisissez votre format** - [Comparer les formats →](/docs/v1.0.0/api-formats)\n2. **Voir les exemples** - [Voir les exemples →](/docs/v1.0.0/api-test)\n3. **Commencer à construire** - Créez votre premier fichier de spécification\n4. **Mettre en ligne** - Déployez votre documentation\n\n\u003cCallout type=\"success\" title=\"Victoire rapide\"\u003e\nVous avez une collection Postman ? Exportez-la et vous avez terminé en 2 minutes !\n\u003c/Callout\u003e\n\n## Ressources\n\n- [Guide des formats pris en charge](/docs/v1.0.0/api-formats)\n- [Exemple de format Specra](/docs/v1.0.0/api-test)\n- [Exemple OpenAPI](/docs/v1.0.0/api-openapi)\n- [Exemple Postman](/docs/v1.0.0/api-postman)\n- [Exemple de composants manuels](/docs/v1.0.0/api-example)\n- [Docs techniques du parseur](/API_PARSERS.md)\n"])</script><script>self.__next_f.push([1,"19:T890,"])</script><script>self.__next_f.push([1,"\nLe composant Accordéon crée des sections de contenu pliables, parfait pour les FAQ, les menus extensibles ou l'organisation de grandes quantités de contenu.\n\n## Utilisation\n\n```mdx\n\u003cAccordion\u003e\n  \u003cAccordionItem title=\"Première question\" defaultOpen\u003e\n    Ce contenu est visible par défaut grâce à `defaultOpen`.\n  \u003c/AccordionItem\u003e\n  \n  \u003cAccordionItem title=\"Deuxième question\"\u003e\n    Ce contenu est replié par défaut.\n  \u003c/AccordionItem\u003e\n\u003c/Accordion\u003e\n```\n\n## Exemple en direct\n\n\u003cAccordion\u003e\n  \u003cAccordionItem title=\"Qu'est-ce qu'un accordéon ?\" defaultOpen\u003e\n    Un accordéon est un modèle d'interface utilisateur qui permet aux utilisateurs de développer et de réduire des sections de contenu. Il est utile pour organiser les informations dans un format compact et scannable.\n  \u003c/AccordionItem\u003e\n  \n  \u003cAccordionItem title=\"Quand devrais-je utiliser des accordéons ?\"\u003e\n    Utilisez des accordéons lorsque vous avez plusieurs sections de contenu que les utilisateurs peuvent vouloir parcourir sans tout faire défiler. Les cas d'utilisation courants incluent les FAQ, les listes de fonctionnalités et les options de configuration.\n  \u003c/AccordionItem\u003e\n  \n  \u003cAccordionItem title=\"Puis-je avoir plusieurs éléments ouverts ?\"\u003e\n    Oui ! Par défaut, l'Accordéon permet à plusieurs éléments d'être ouverts simultanément. Chaque AccordionItem fonctionne indépendamment.\n  \u003c/AccordionItem\u003e\n\u003c/Accordion\u003e\n\n## Props\n\n### Accordion\n\n| Prop | Type | Défaut | Description |\n|------|------|--------|-------------|\n| `children` | `ReactNode` | requis | Composants AccordionItem à rendre |\n| `type` | `\"single\" \\| \"multiple\"` | `\"multiple\"` | Si un ou plusieurs éléments peuvent être ouverts |\n\n### AccordionItem\n\n| Prop | Type | Défaut | Description |\n|------|------|--------|-------------|\n| `title` | `string` | requis | Le texte d'en-tête cliquable |\n| `children` | `ReactNode` | requis | Contenu affiché lorsqu'il est développé |\n| `defaultOpen` | `boolean` | `false` | Si l'élément démarre développé |\n\n## Conseils\n\n\u003cCallout type=\"tip\"\u003e\nUtilisez la prop `defaultOpen` sur le premier AccordionItem pour donner aux utilisateurs un aperçu du format du contenu.\n\u003c/Callout\u003e\n"])</script><script>self.__next_f.push([1,"1a:T890,"])</script><script>self.__next_f.push([1,"\nLe composant Accordéon crée des sections de contenu pliables, parfait pour les FAQ, les menus extensibles ou l'organisation de grandes quantités de contenu.\n\n## Utilisation\n\n```mdx\n\u003cAccordion\u003e\n  \u003cAccordionItem title=\"Première question\" defaultOpen\u003e\n    Ce contenu est visible par défaut grâce à `defaultOpen`.\n  \u003c/AccordionItem\u003e\n  \n  \u003cAccordionItem title=\"Deuxième question\"\u003e\n    Ce contenu est replié par défaut.\n  \u003c/AccordionItem\u003e\n\u003c/Accordion\u003e\n```\n\n## Exemple en direct\n\n\u003cAccordion\u003e\n  \u003cAccordionItem title=\"Qu'est-ce qu'un accordéon ?\" defaultOpen\u003e\n    Un accordéon est un modèle d'interface utilisateur qui permet aux utilisateurs de développer et de réduire des sections de contenu. Il est utile pour organiser les informations dans un format compact et scannable.\n  \u003c/AccordionItem\u003e\n  \n  \u003cAccordionItem title=\"Quand devrais-je utiliser des accordéons ?\"\u003e\n    Utilisez des accordéons lorsque vous avez plusieurs sections de contenu que les utilisateurs peuvent vouloir parcourir sans tout faire défiler. Les cas d'utilisation courants incluent les FAQ, les listes de fonctionnalités et les options de configuration.\n  \u003c/AccordionItem\u003e\n  \n  \u003cAccordionItem title=\"Puis-je avoir plusieurs éléments ouverts ?\"\u003e\n    Oui ! Par défaut, l'Accordéon permet à plusieurs éléments d'être ouverts simultanément. Chaque AccordionItem fonctionne indépendamment.\n  \u003c/AccordionItem\u003e\n\u003c/Accordion\u003e\n\n## Props\n\n### Accordion\n\n| Prop | Type | Défaut | Description |\n|------|------|--------|-------------|\n| `children` | `ReactNode` | requis | Composants AccordionItem à rendre |\n| `type` | `\"single\" \\| \"multiple\"` | `\"multiple\"` | Si un ou plusieurs éléments peuvent être ouverts |\n\n### AccordionItem\n\n| Prop | Type | Défaut | Description |\n|------|------|--------|-------------|\n| `title` | `string` | requis | Le texte d'en-tête cliquable |\n| `children` | `ReactNode` | requis | Contenu affiché lorsqu'il est développé |\n| `defaultOpen` | `boolean` | `false` | Si l'élément démarre développé |\n\n## Conseils\n\n\u003cCallout type=\"tip\"\u003e\nUtilisez la prop `defaultOpen` sur le premier AccordionItem pour donner aux utilisateurs un aperçu du format du contenu.\n\u003c/Callout\u003e\n"])</script><script>self.__next_f.push([1,"1b:T1f1b,"])</script><script>self.__next_f.push([1,"\n# Aperçu de la configuration\n\nSpecra utilise un seul fichier de configuration, `specra.config.json`, situé à la racine de votre projet. Ce fichier contrôle tout, des métadonnées du site aux paramètres de navigation, de thème et de déploiement.\n\n## Démarrage rapide\n\nVoici une configuration minimale pour commencer :\n\n```json\n{\n  \"site\": {\n    \"title\": \"Ma Documentation\",\n    \"description\": \"Documentation pour mon projet\",\n    \"url\": \"https://docs.example.com\"\n  }\n}\n```\n\nC'est tout ! Specra remplit des valeurs par défaut judicieuses pour tout le reste.\n\n## Structure de la configuration\n\nLe fichier de configuration est organisé en sections logiques :\n\n\u003cCardGrid cols={2}\u003e\n  \u003cCard\n    icon=\"globe\"\n    title=\"Configuration du site\"\n    description=\"Métadonnées de base du site, marque et URL\"\n    href=\"/docs/v1.0.0/configuration/site-config\"\n  /\u003e\n  \u003cCard\n    icon=\"layout\"\n    title=\"Navigation\"\n    description=\"Barre latérale, fil d'Ariane, table des matières et groupes d'onglets\"\n    href=\"/docs/v1.0.0/configuration/navigation\"\n  /\u003e\n  \u003cCard\n    icon=\"rocket\"\n    title=\"Déploiement\"\n    description=\"Paramètres de déploiement spécifiques à la plateforme\"\n    href=\"/docs/v1.0.0/configuration/deployment-config\"\n  /\u003e\n  \u003cCard\n    icon=\"sliders\"\n    title=\"Options avancées\"\n    description=\"Analytique, recherche, fonctionnalités et variables d'environnement\"\n    href=\"/docs/v1.0.0/configuration/advanced\"\n  /\u003e\n\u003c/CardGrid\u003e\n\n## Exemple complet\n\nVoici une configuration complète montrant toutes les options disponibles :\n\n```json\n{\n  \"$schema\": \"./node_modules/specra/config/specra.config.schema.json\",\n  \"site\": {\n    \"title\": \"Mes Docs\",\n    \"description\": \"Documentation complète\",\n    \"url\": \"https://docs.example.com\",\n    \"baseUrl\": \"/\",\n    \"language\": \"fr\",\n    \"organizationName\": \"Ma Société\",\n    \"projectName\": \"mon-projet\",\n    \"activeVersion\": \"v1.0.0\",\n    \"logo\": \"/logo.svg\",\n    \"favicon\": \"/favicon.ico\",\n    \"hideTitle\": false,\n    \"hideLogo\": false\n  },\n  \"theme\": {\n    \"defaultMode\": \"system\",\n    \"respectPrefersColorScheme\": true,\n    \"primaryColor\": \"#3b82f6\",\n    \"customCss\": \"/custom.css\"\n  },\n  \"navigation\": {\n    \"showSidebar\": true,\n    \"collapsibleSidebar\": true,\n    \"showBreadcrumbs\": true,\n    \"showTableOfContents\": true,\n    \"tocPosition\": \"right\",\n    \"tocMaxDepth\": 3,\n    \"tabGroups\": [\n      {\n        \"id\": \"guides\",\n        \"label\": \"Guides\",\n        \"icon\": \"book-open\"\n      },\n      {\n        \"id\": \"api\",\n        \"label\": \"Référence API\",\n        \"icon\": \"zap\"\n      }\n    ]\n  },\n  \"social\": {\n    \"github\": \"https://github.com/username/repo\",\n    \"twitter\": \"https://twitter.com/username\",\n    \"discord\": \"https://discord.gg/invite\",\n    \"linkedin\": \"https://linkedin.com/company/name\",\n    \"youtube\": \"https://youtube.com/@channel\",\n    \"custom\": [\n      {\n        \"label\": \"Site web\",\n        \"url\": \"https://example.com\",\n        \"icon\": \"globe\"\n      }\n    ]\n  },\n  \"search\": {\n    \"enabled\": true,\n    \"placeholder\": \"Rechercher dans la documentation...\",\n    \"provider\": \"meilisearch\",\n    \"meilisearch\": {\n      \"host\": \"https://search.example.com\",\n      \"apiKey\": \"search-key\",\n      \"indexName\": \"docs\"\n    }\n  },\n  \"analytics\": {\n    \"googleAnalytics\": \"G-XXXXXXXXXX\",\n    \"googleTagManager\": \"GTM-XXXXXXX\",\n    \"plausible\": \"docs.example.com\"\n  },\n  \"footer\": {\n    \"copyright\": \"© 2024 Ma Société. Tous droits réservés.\",\n    \"customContent\": \"\u003cp\u003eHTML personnalisé ici\u003c/p\u003e\",\n    \"links\": [\n      {\n        \"title\": \"Produit\",\n        \"items\": [\n          { \"label\": \"Fonctionnalités\", \"href\": \"/features\" },\n          { \"label\": \"Tarifs\", \"href\": \"/pricing\" }\n        ]\n      }\n    ]\n  },\n  \"banner\": {\n    \"enabled\": true,\n    \"message\": \"📢 La version 2.0 arrive bientôt !\",\n    \"type\": \"info\",\n    \"dismissible\": true\n  },\n  \"features\": {\n    \"editUrl\": \"https://github.com/username/repo/edit/main/docs\",\n    \"showLastUpdated\": true,\n    \"showReadingTime\": true,\n    \"showAuthors\": false,\n    \"showTags\": true,\n    \"versioning\": true,\n    \"i18n\": false\n  },\n  \"env\": {\n    \"API_BASE_URL\": \"https://api.example.com\",\n    \"API_VERSION\": \"v1\",\n    \"CDN_URL\": \"https://cdn.example.com\"\n  },\n  \"deployment\": {\n    \"target\": \"vercel\",\n    \"basePath\": \"\",\n    \"customDomain\": false\n  }\n}\n```\n\n## Support TypeScript\n\nPour les projets TypeScript, vous pouvez utiliser des fichiers de configuration `.ts` ou `.mts` :\n\n```typescript\n// specra.config.ts\nimport type { SpecraConfig } from 'specra'\n\nconst config: SpecraConfig = {\n  site: {\n    title: 'Ma Documentation',\n    description: 'Construit avec Specra',\n  },\n  // ... reste de la config\n}\n\nexport default config\n```\n\n## Autocomplétion IDE\n\nLe fichier de configuration inclut une propriété `$schema` qui active l'autocomplétion dans VS Code et d'autres éditeurs :\n\n```json\n{\n  \"$schema\": \"./node_modules/specra/config/specra.config.schema.json\",\n  \"site\": {\n    // L'autocomplétion fonctionne ici !\n  }\n}\n```\n\nLorsque vous tapez, votre éditeur suggérera les options disponibles et affichera des descriptions.\n\n## Variables d'environnement\n\nVous pouvez utiliser des variables d'environnement dans votre configuration :\n\n```json\n{\n  \"search\": {\n    \"meilisearch\": {\n      \"host\": \"${MEILISEARCH_HOST}\",\n      \"apiKey\": \"${MEILISEARCH_API_KEY}\"\n    }\n  }\n}\n```\n\nEnsuite, définissez-les :\n\n```bash\n# .env.local\nMEILISEARCH_HOST=https://search.example.com\nMEILISEARCH_API_KEY=your-key\n```\n\n\u003cCallout type=\"warning\"\u003e\nNe commitez jamais de clés API sensibles dans le contrôle de version. Utilisez plutôt des variables d'environnement.\n\u003c/Callout\u003e\n\n## Validation de la configuration\n\nSpecra valide votre configuration au démarrage et affiche des erreurs utiles si quelque chose ne va pas :\n\n```\n❌ Erreur de configuration dans specra.config.json :\n   - site.url doit être une URL valide\n   - navigation.tocMaxDepth doit être entre 1 et 6\n```\n\nCorrigez les erreurs et redémarrez votre serveur de développement.\n\n## Valeurs par défaut\n\nSi vous omettez des champs optionnels, Specra utilise ces valeurs par défaut :\n\n| Champ | Valeur par défaut |\n|-------|-------------------|\n| `site.baseUrl` | `\"/\"` |\n| `site.language` | `\"en\"` |\n| `theme.defaultMode` | `\"system\"` |\n| `theme.respectPrefersColorScheme` | `true` |\n| `navigation.showSidebar` | `true` |\n| `navigation.collapsibleSidebar` | `true` |\n| `navigation.showBreadcrumbs` | `true` |\n| `navigation.showTableOfContents` | `true` |\n| `navigation.tocPosition` | `\"right\"` |\n| `navigation.tocMaxDepth` | `3` |\n| `search.enabled` | `false` |\n| `features.showLastUpdated` | `true` |\n| `features.showReadingTime` | `true` |\n| `features.versioning` | `true` |\n| `deployment.target` | `\"vercel\"` |\n\n## Environnements multiples\n\nCréez des configurations spécifiques à l'environnement :\n\n```txt\n├── specra.config.json          # Config de base\n├── specra.config.development.json\n├── specra.config.staging.json\n└── specra.config.production.json\n```\n\nChargez la bonne en fonction de `NODE_ENV` :\n\n```javascript\n// Charger la config en fonction de l'environnement\nconst config = require(`./specra.config.${process.env.NODE_ENV}.json`)\n```\n\n## Prochaines étapes\n\nPlongez dans des sections de configuration spécifiques :\n\n\u003cCardGrid cols={2}\u003e\n  \u003cCard\n    icon=\"globe\"\n    title=\"Configuration du site\"\n    description=\"Configurer les métadonnées et la marque du site\"\n    href=\"/docs/v1.0.0/configuration/site-config\"\n  /\u003e\n  \u003cCard\n    icon=\"layout\"\n    title=\"Navigation\"\n    description=\"Configurer la navigation et u003e\n```bash\npnpm create specra my-docs\n```\n  \u003c/Tab\u003e\n\u003c/Tabs\u003e\n\nCela crée un nouveau répertoire appelé `my-docs` avec tout configuré et prêt à l'emploi.\n\n## Ce qui est créé\n\nLorsque vous exécutez `create-specra`, voici ce que vous obtenez :\n\n```txt\nmy-docs/\n├── app/\n│   ├── layout.tsx              # Mise en page racine avec configuration Specra\n│   ├── page.tsx                # Page d'accueil\n│   ├── globals.css             # Styles globaux\n│   └── docs/\n│       └── [...slug]/\n│           └── page.tsx        # Moteur de rendu des pages de documentation\n├── docs/\n│   └── v1.0.0/\n│       ├── about.mdx           # Exemple de page à propos\n│       ├── getting-started.mdx # Exemple de guide de démarrage\n│       └── components/         # Exemples de composants\n├── public/\n│   ├── icon-light-32x32.png   # Favicon (mode clair)\n│   └── icon-dark-32x32.png    # Favicon (mode sombre)\n├── specra.config.json          # Configuration Specra\n├── package.json                # Dépendances et scripts\n├── next.config.mjs             # Configuration Next.js\n├── tailwind.config.ts          # Config Tailwind CSS\n├── tsconfig.json               # Config TypeScript\n├── .gitignore\n└── README.md\n```\n\n## Configuration interactive\n\nLorsque vous exécutez `create-specra`, il peut vous demander :\n\n**Nom du projet** (si non fourni comme argument)\n```bash\nnpx create-specra@latest\n# Invite : What is your project named?\n```\n\n**Préférence de gestionnaire de paquets** (si plusieurs sont détectés)\n```bash\n# Demandera : Which package manager do you want to use?\n# Options : npm, yarn, pnpm\n```\n\nLe CLI détecte ce qui est disponible sur votre système et suggère la meilleure option.\n\n## Options de commande\n\n### Utilisation de base\n\n```bash\nnpx create-specra@latest [project-name] [options]\n```\n\n### Exemples\n\n**Créer avec un nom spécifique :**\n```bash\nnpx create-specra@latest my-awesome-docs\n```\n\n**Créer dans le répertoire courant :**\n```bash\nnpx create-specra@latest .\n```\n\n**Utiliser un gestionnaire de paquets spécifique :**\n```bash\nnpx create-specra@latest my-docs --use-npm\nnpx create-specra@latest my-docs --use-yarn\nnpx create-specra@latest my-docs --use-pnpm\n```\n\n## Étapes suivantes\n\nUne fois l'échafaudage terminé, suivez ces étapes :\n\n\u003cSteps\u003e\n  \u003cStep title=\"Naviguez vers votre projet\"\u003e\n```bash\ncd my-docs\n```\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Installer les dépendances\"\u003e\n    Le CLI n'installe pas automatiquement les dépendances. Exécutez :\n\n\u003cTabs defaultValue=\"npm\"\u003e\n  \u003cTab label=\"npm\"\u003e\n```bash\nnpm install\n```\n  \u003c/Tab\u003e\n  \u003cTab label=\"yarn\"\u003e\n```bash\nyarn install\n```\n  \u003c/Tab\u003e\n  \u003cTab label=\"pnpm\"\u003e\n```bash\npnpm install\n```\n  \u003c/Tab\u003e\n\u003c/Tabs\u003e\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Démarrez le serveur de développement\"\u003e\n\u003cTabs defaultValue=\"npm\"\u003e\n  \u003cTab label=\"npm\"\u003e\n```bash\nnpm run dev\n```\n  \u003c/Tab\u003e\n  \u003cTab label=\"yarn\"\u003e\n```bash\nyarn dev\n```\n  \u003c/Tab\u003e\n  \u003cTab label=\"pnpm\"\u003e\n```bash\npnpm dev\n```\n  \u003c/Tab\u003e\n\u003c/Tabs\u003e\n\n    Ouvrez [http://localhost:3000](http://localhost:3000) pour voir votre site.\n  \u003c/Step\u003e\n\u003c/Steps\u003e\n\n## Configuration par défaut\n\nLe fichier `specra.config.json` généré inclut des valeurs par défaut sensées :\n\n```json\n{\n  \"site\": {\n    \"title\": \"My Documentation\",\n    \"description\": \"Documentation site built with Specra\",\n    \"url\": \"https://example.com\",\n    \"baseUrl\": \"/\",\n    \"activeVersion\": \"v1.0.0\"\n  },\n  \"theme\": {\n    \"defaultMode\": \"system\",\n    \"respectPrefersColorScheme\": true\n  },\n  \"navigation\": {\n    \"showSidebar\": true,\n    \"collapsibleSidebar\": true,\n    \"showBreadcrumbs\": true,\n    \"showTableOfContents\": true,\n    \"tocPosition\": \"right\"\n  },\n  \"features\": {\n    \"showLastUpdated\": true,\n    \"showReadingTime\": true,\n    \"versioning\": true\n  },\n  \"deployment\": {\n    \"target\": \"vercel\"\n  }\n}\n```\n\nVous pouvez personnaliser n'importe lequel de ces paramètres. Voir [Configuration](/docs/v1.0.0/configuration/overview) pour toutes les options disponibles.\n\n## Exemple de contenu\n\nLe projet échafaudé comprend une documentation d'exemple pour vous aider à démarrer :\n\n**Page À propos** - Exemple d'une page d'information simple\n**Guide de démarrage** - Montre comment structurer des tutoriels avec des étapes\n**Exemples de composants** - Démontre tous les composants MDX disponibles\n\nN'hésitez pas à supprimer ou modifier ces pages. Elles sont juste là pour vous montrer ce qui est possible.\n\n## Scripts disponibles\n\nLe `package.json` généré inclut ces scripts :\n\n| Script | Commande | Description |\n|--------|---------|-------------|\n| `dev` | `next dev` | Démarre le serveur de développement avec rechargement à chaud |\n| `build` | `next build` | Construit pour la production (Vercel, hébergement Node.js) |\n| `start` | `next start` | Démarre le serveur de production (après `build`) |\n| `build:export` | `next build \u0026\u0026 next export` | Construit un site statique (GitHub Pages, Netlify) |\n| `lint` | `next lint` | Exécute ESLint pour vérifier la qualité du code |\n\n## Mise à jour de Specra\n\nPour mettre à jour vers la dernière version de Specra dans votre projet :\n\n\u003cTabs defaultValue=\"npm\"\u003e\n  \u003cTab label=\"npm\"\u003e\n```bash\nnpm install specra@latest\n```\n  \u003c/Tab\u003e\n  \u003cTab label=\"yarn\"\u003e\n```bash\nyarn upgrade specra@latest\n```\n  \u003c/Tab\u003e\n  \u003cTab label=\"pnpm\"\u003e\n```bash\npnpm update specra@latest\n```\n  \u003c/Tab\u003e\n\u003c/Tabs\u003e\n\n\u003cCallout type=\"info\"\u003e\nConsultez le [journal des modifications](https://github.com/yourusername/specra/releases) pour nfiguration/overview\"\n  /\u003e\n  \u003cCard\n    icon=\"palette\"\n    title=\"Explorez les composants\"\n    description=\"Découvrez tous les composants MDX disponibles\"\n    href=\"/docs/v1.0.0/components\"\n  /\u003e\n  \u003cCard\n    icon=\"rocket\"\n    title=\"Déployer en production\"\n    description=\"Expédiez vos documents sur Vercel, GitHub Pages ou Netlify\"\n    href=\"/docs/v1.0.0/deployment/overview\"\n  /\u003e\n\u003c/CardGrid\u003e\n"])</script><script>self.__next_f.push([1,"1f:T2f5b,"])</script><script>self.__next_f.push([1,"\n# Aperçu du déploiement\n\nSpecra est construit sur Next.js, ce qui signifie que vous pouvez le déployer presque partout. Ce guide couvre les options de déploiement les plus populaires et comment configurer Specra pour chacune.\n\n## Cibles de déploiement\n\nSpecra prend en charge deux modes de déploiement :\n\n**Mode Autonome** (Hébergement Node.js)\n- Vercel, Railway, Render, Fly.io, AWS, Google Cloud\n- Fonctionnalités dynamiques côté serveur\n- Meilleures performances avec la mise en cache edge\n- Configuration par défaut\n\n**Export Statique** (Hébergement statique)\n- GitHub Pages, Netlify, Cloudflare Pages\n- HTML/CSS/JS pré-rendu\n- Aucun serveur requis\n- Idéal pour la documentation open source\n\n## Déploiement rapide\n\n### Vercel (Recommandé)\n\nL'option de déploiement la plus simple. Un clic et vous êtes en ligne :\n\n\u003cSteps\u003e\n  \u003cStep title=\"Pousser sur GitHub\"\u003e\n    Poussez votre projet vers un dépôt GitHub :\n\n```bash\ngit init\ngit add .\ngit commit -m \"Commit initial\"\ngit remote add origin https://github.com/username/repo.git\ngit push -u origin main\n```\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Déployer sur Vercel\"\u003e\n    Visitez [vercel.com/new](https://vercel.com/new) et importez votre dépôt.\n\n    Vercel détecte automatiquement Next.js et utilise les bons paramètres :\n    - Commande de build : `npm run build`\n    - Répertoire de sortie : `.next`\n    - Commande d'installation : `npm install`\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Terminé !\"\u003e\n    Votre site se déploie en moins d'une minute. Vercel vous donne une URL comme `votre-projet.vercel.app`.\n\n    Chaque push git sur main déclenche automatiquement un nouveau déploiement.\n  \u003c/Step\u003e\n\u003c/Steps\u003e\n\n\u003cCallout type=\"success\"\u003e\n  Aucune configuration nécessaire ! Les paramètres par défaut de Specra fonctionnent parfaitement avec Vercel.\n\u003c/Callout\u003e\n\n### GitHub Pages\n\nParfait pour la documentation open source :\n\n\u003cSteps\u003e\n  \u003cStep title=\"Configurer pour l'export statique\"\u003e\n    Mettez à jour `specra.config.json` :\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"github-pages\",\n    \"basePath\": \"nom-votre-repo\",\n    \"customDomain\": false\n  }\n}\n```\n\nRemplacez `nom-votre-repo` par le nom réel de votre dépôt.\n\n\u003cCallout type=\"info\"\u003e\n  Si vous utilisez un domaine personnalisé (comme `docs.votresite.com`), définissez `customDomain: true` et laissez `basePath` vide.\n\u003c/Callout\u003e\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Construire le site statique\"\u003e\n```bash\nnpm run build:export\n```\n\nCela crée un répertoire `out/` avec votre site statique.\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Déployer avec GitHub Actions\"\u003e\n    Créez `.github/workflows/deploy.yml` :\n\n```yaml\nname: Deploy to GitHub Pages\n\non:\n  push:\n    branches: [main]\n\npermissions:\n  contents: read\n  pages: write\n  id-token: write\n\njobs:\n  build:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n\n      - name: Setup Node.js\n        uses: actions/setup-node@v4\n        with:\n          node-version: '20'\n          cache: 'npm'\n\n      - name: Install dependencies\n        run: npm ci\n\n      - name: Build site\n        run: npm run build:export\n\n      - name: Upload artifact\n        uses: actions/upload-pages-artifact@v3\n        with:\n          path: ./out\n\n  deploy:\n    needs: build\n    runs-on: ubuntu-latest\n    environment:\n      name: github-pages\n      url: ${{ steps.deployment.outputs.page_url }}\n    steps:\n      - name: Deploy to GitHub Pages\n        id: deployment\n        uses: actions/deploy-pages@v4\n```\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Activer GitHub Pages\"\u003e\n    1. Allez dans les paramètres de votre repo\n    2. Naviguez vers **Pages**\n    3. Source : **GitHub Actions**\n    4. Enregistrer\n\n    Vos docs seront en ligne à `https://username.github.io/nom-votre-repo`\n  \u003c/Step\u003e\n\u003c/Steps\u003e\n\n### Netlify\n\nUne autre excellente option d'hébergement statique :\n\n\u003cSteps\u003e\n  \u003cStep title=\"Configurer\"\u003e\n```json\n{\n  \"deployment\": {\n    \"target\": \"static\"\n  }\n}\n```\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Créer netlify.toml\"\u003e\n```toml\n[build]\n  command = \"npm run build:export\"\n  publish = \"out\"\n\n[[redirects]]\n  from = \"/*\"\n  to = \"/index.html\"\n  status = 200\n```\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Déployer\"\u003e\n    Connectez votre repo sur [netlify.com](https://netlify.com) ou utilisez la CLI :\n\n```bash\nnpm install -g netlify-cli\nnetlify deploy --prod\n```\n  \u003c/Step\u003e\n\u003c/Steps\u003e\n\n## Commandes de build\n\nDifférentes plateformes nécessitent différentes commandes de build :\n\n| Plateforme | Commande de build | Répertoire de sortie |\n|------------|-------------------|----------------------|\n| Vercel, Railway | `npm run build` | `.next` |\n| GitHub Pages | `npm run build:export` | `out` |\n| Netlify, Cloudflare Pages | `npm run build:export` | `out` |\n| Docker, VPS | `npm run build` + `npm start` | `.next` |\n\n## Configuration par plateforme\n\n### Vercel\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"vercel\"\n  }\n}\n```\n\n**Variables d'environnement** (optionnel) :\n- Aucune requise pour la configuration de base\n- Ajoutez les clés de recherche/analytique dans le tableau de bord Vercel\n\n### GitHub Pages (Pas de domaine personnalisé)\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"github-pages\",\n    \"basePath\": \"nom-repo\"\n  }\n}\n```\n\n**Pourquoi basePath ?** GitHub Pages sert depuis `username.github.io/nom-repo`, donc toutes les ressources ont besoin du préfixe `/nom-repo`.\n\n### GitHub Pages (Avec domaine personnalisé)\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"custom-domain-static\",\n    \"customDomain\": true\n  }\n}\n```\n\nAjoutez un fichier `CNAME` à `public/` :\n\n```\ndocs.votresite.com\n```\n\n### Netlify / Cloudflare Pages\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"static\"\n  }\n}\n```\n\nAucun basePath nécessaire - ils servent depuis la racine.\n\n## Pipelines CI/CD\n\n### GitHub Actions (Avancé)\n\nExemple complet avec mise en cache et indexation MeiliSearch :\n\n```yaml\nname: Build and Deploy\n\non:\n  push:\n    branches: [main]\n  pull_request:\n    branches: [main]\n\njobs:\n  build:\n    runs-on: ubuntu-latest\n\n    steps:\n      - uses: actions/checkout@v4\n\n      - name: Setup Node.js\n        uses: actions/setup-node@v4\n        with:\n          node-version: '20'\n          cache: 'npm'\n\n      - name: Cache dependencies\n        uses: actions/cache@v4\n        with:\n          path: ~/.npm\n          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}\n          restore-keys: |\n            ${{ runner.os }}-node-\n\n      - name: Install dependencies\n        run: npm ci\n\n      - name: Run linter\n        run: npm run lint\n\n      - name: Build site\n        run: npm run build:export\n        env:\n          NODE_ENV: production\n\n      - name: Index search content\n        if: github.ref == 'refs/heads/main'\n        run: npm run index:search\n        env:\n          MEILISEARCH_HOST: ${{ secrets.MEILISEARCH_HOST }}\n          MEILISEARCH_API_KEY: ${{ secrets.MEILISEARCH_MASTER_KEY }}\n\n      - name: Upload artifact\n        uses: actions/upload-pages-artifact@v3\n        with:\n          path: ./out\n\n  deploy:\n    if: github.ref == 'refs/heads/main'\n    needs: build\n    runs-on: ubuntu-latest\n    environment:\n      name: github-pages\n      url: ${{ steps.deployment.outputs.page_url }}\n    permissions:\n      pages: write\n      id-token: write\n    steps:\n      - name: Deploy to GitHub Pages\n        id: deployment\n        uses: actions/deploy-pages@v4\n```\n\n### GitLab CI/CD\n\n```yaml\n# .gitlab-ci.yml\nimage: node:20\n\ncache:\n  paths:\n    - node_modules/\n\nstages:\n  - build\n  - deploy\n\nbuild:\n  stage: build\n  script:\n    - npm ci\n    - npm run build:export\n  artifacts:\n    paths:\n      - out/\n  only:\n    - main\n\npages:\n  stage: deploy\n  dependencies:\n    - build\n  script:\n    - mkdir -p public\n    - cp -r out/* public/\n  artifacts:\n    paths:\n      - public\n  only:\n    - main\n```\n\n### Docker\n\nCréez un `Dockerfile` :\n\n```dockerfile\nFROM node:20-alpine AS builder\n\nWORKDIR /app\n\nCOPY package*.json ./\nRUN npm ci\n\nCOPY . .\nRUN npm run build\n\nFROM node:20-alpine AS runner\n\nWORKDIR /app\n\nENV NODE_ENV=production\n\nCOPY --from=builder /app/public ./public\nCOPY --from=builder /app/.next/standalone ./\nCOPY --from=builder /app/.next/static ./.next/static\n\nEXPOSE 3000\n\nCMD [\"node\", \"server.js\"]\n```\n\nConstruire et exécuter :\n\n```bash\ndocker build -t my-docs .\ndocker run -p 3000:3000 my-docs\n```\n\n## Variables d'environnement\n\nDéfinissez-les dans votre plateforme de déploiement :\n\n**Recherche (si utilisation de MeiliSearch) :**\n```bash\nMEILISEARCH_HOST=https://search.example.com\nMEILISEARCH_API_KEY=votre-clé-de-recherche\n```\n\n**Analytique (optionnel) :**\n```bash\nNEXT_PUBLIC_GA_ID=G-XXXXXXXXXX\nNEXT_PUBLIC_PLAUSIBLE_DOMAIN=docs.example.com\n```\n\n**Variables d'environnement personnalisées :**\nAccédez-y dans vos docs via le frontmatter ou MDX :\n\n```json\n{\n  \"env\": {\n    \"API_BASE_URL\": \"${API_URL}\"\n  }\n}\n```\n\n## Domaines personnalisés\n\n### Vercel\n\n1. Allez dans les paramètres de votre projet\n2. Naviguez vers Domaines\n3. Ajoutez votre domaine personnalisé\n4. Mettez à jour les enregistrements DNS comme indiqué\n\n### GitHub Pages\n\n1. Ajoutez le fichier `CNAME` à `public/` :\n```\ndocs.votresite.com\n```\n\n2. Mettez à jour `specra.config.json` :\n```json\n{\n  \"deployment\": {\n    \"customDomain\": true\n  }\n}\n```\n\n3. Configurez le DNS :\n```\nType: CNAME\nNom: docs\nValeur: username.github.io\n```\n\n### Netlify\n\n1. Allez dans les paramètres de Domaine\n2. Ajoutez un domaine personnalisé\n3. Suivez les instructions DNS\n\n## Optimisation des performances\n\n### Activer la mise en cache\n\nAjoutez des en-têtes de cache dans `next.config.mjs` :\n\n```javascript\nasync headers() {\n  return [\n    {\n      source: '/docs/:path*',\n      headers: [\n        {\n          key: 'Cache-Control',\n          value: 'public, max-age=3600, must-revalidate',\n        },\n      ],\n    },\n  ]\n}\n```\n\n### Optimisation des images\n\nUtilisez le composant Image de Next.js :\n\n```mdx\n\u003cImage\n  src=\"/images/diagram.png\"\n  alt=\"Diagramme d'architecture\"\n  width={800}\n  height={600}\n/\u003e\n```\n\n### Analyse de bundle\n\nVérifiez la taille du bundle :\n\n```bash\nnpm install --save-dev @next/bundle-analyzer\n```\n\n```javascript\n// next.config.mjs\nimport bundleAnalyzer from '@next/bundle-analyzer'\n\nconst withBundleAnalyzer = bundleAnalyzer({\n  enabled: process.env.ANALYZE === 'true',\n})\n\nexport default withBundleAnalyzer(nextConfig)\n```\n\nExécutez avec :\n```bash\nANALYZE=true npm run build\n```\n\n## Dépannage\n\n### 404 lors de l'actualisation de la page (Export Statique)\n\nAjoutez des redirections/réécritures dans la configuration de la plateforme :\n\n**Netlify :**\n```toml\n[[redirects]]\n  from = \"/*\"\n  to = \"/index.html\"\n  status = 200\n```\n\n**Vercel (vercel.json) :**\n```json\n{\n  \"rewrites\": [\n    { \"source\": \"/(.*)\", \"destination\": \"/index.html\" }\n  ]\n}\n```\n\n### Les ressources ne chargent pas (GitHub Pages)\n\nVérifiez que votr `basePath` correspond exactement au nom de votre dépôt :\n\n```json\n{\n  \"deployment\": {\n    \"basePath\": \"nom-repo-exact\"\n  }\n}\n```\n\n### Échec du build\n\nCorrections courantes :\n\n1. Effacez les dossiers `.next` et `out` :\n```bash\nrm -rf .next out node_modules\nnpm install\nnpm run build\n```\n\n2. Vérifiez la version de Node.js :\n```bash\nnode --version  # Devrait être 18+\n```\n\n3. Examinez les journaux de build pour des erreurs spécifiques\n\n## Guides spécifiques à la plateforme\n\nPlongez plus profondément dans le déploiement spécifique à la plateforme :\n\n\u003cCardGrid cols={3}\u003e\n  \u003cCard\n    icon=\"triangle\"\n    title=\"Vercel\"\n    description=\"Déployer sans configuration\"\n    href=\"/docs/v1.0.0/deployment/vercel\"\n  /\u003e\n  \u003cCard\n    icon=\"github\"\n    title=\"GitHub Pages\"\n    description=\"Hébergement gratuit pour l'open source\"\n    href=\"/docs/v1.0.0/deployment/github-pages\"\n  /\u003e\n  \u003cCard\n    icon=\"globe\"\n    title=\"Netlify\"\n    description=\"Hébergement statique avec fonctions edge\"\n    href=\"/docs/v1.0.0/deployment/netlify\"\n  /\u003e\n\u003c/CardGrid\u003e\n\n## Prochaines étapes\n\n\u003cCardGrid cols={2}\u003e\n  \u003cCard\n    icon=\"settings\"\n    title=\"Configuration\"\n    description=\"Affiner vos paramètres de déploiement\"\n    href=\"/docs/v1.0.0/configuration/deployment-config\"\n  /\u003e\n  \u003cCard\n    icon=\"zap\"\n    title=\"Performance\"\n    description=\"Optimiser vos docs pour la vitesse\"\n    href=\"/docs/v1.0.0/performance\"\n  /\u003e\n\u003c/CardGrid\u003e\n"])</script><script>self.__next_f.push([1,"20:T2f5b,"])</script><script>self.__next_f.push([1,"\n# Aperçu du déploiement\n\nSpecra est construit sur Next.js, ce qui signifie que vous pouvez le déployer presque partout. Ce guide couv
