nt :\n\n```yaml\njobs:\n  build:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n\n      - name: Setup Node\n        uses: actions/setup-node@v4\n        with:\n          node-version: '20'\n          cache: 'npm'\n\n      - name: Install dependencies\n        run: npm ci\n\n      - name: Build site\n        run: npm run build:export\n\n      - name: Index search\n        run: npm run index:search\n        env:\n          MEILISEARCH_HOST: ${{ secrets.MEILISEARCH_HOST }}\n          MEILISEARCH_API_KEY: ${{ secrets.MEILISEARCH_MASTER_KEY }}\n\n      - name: Upload artifact\n        uses: actions/upload-pages-artifact@v3\n        with:\n          path: ./out\n```\n\nAjoutez des secrets dans Paramètres → Secrets and variables → Actions.\n\n### Déployer sur Tag\n\nDéployez uniquement lorsque vous créez un tag de version :\n\n```yaml\non:\n  push:\n    tags:\n      - 'v*'\n```\n\nCréez et poussez un tag pour déployer :\n\n```bash\ngit tag v1.0.0\ngit push origin v1.0.0\n```\n\n### Environnements multiples\n\nDéployez différentes branches sur différents sites GitHub Pages :\n\n```yaml\non:\n  push:\n    branches:\n      - main\n      - staging\n\njobs:\n  build:\n    runs-on: ubuntu-latest\n    steps:\n      # ... étapes de build ...\n\n      - name: Deploy to production\n        if: github.ref == 'refs/heads/main'\n        uses: actions/deploy-pages@v4\n\n      - name: Deploy to staging\n        if: github.ref == 'refs/heads/staging'\n        # Déployer sur un autre repo ou branche\n```\n\n## Dépannage\n\n### Erreurs 404 sur les routes\n\nLes exports statiques ne prennent pas en charge le routage dynamique de la même manière. Assurez-vous que toutes les routes sont pré-rendues.\n\n**Solution :** Ajoutez un 404.html qui redirige vers l'index :\n\n```html\n\u003c!DOCTYPE html\u003e\n\u003chtml\u003e\n  \u003chead\u003e\n    \u003cmeta http-equiv=\"refresh\" content=\"0;url=/\" /\u003e\n  \u003c/head\u003e\n  \u003cbody\u003e\n    Redirection...\n  \u003c/body\u003e\n\u003c/html\u003e\n```\n\n### Les ressources ne chargent pas\n\nVérifiez votre configuration `basePath` :\n\n```bash\n# Voir votre site\nopen https://username.github.io/repo-name\n\n# Vérifier si les ressources se chargent depuis\nhttps://username.github.io/repo-name/_next/...\n```\n\nSi les ressources renvoient 404, vérifiez :\n- `basePath` dans la config correspond exactement au nom du repo\n- Vous utilisez `npm run build:export` et non `npm run build`\n\n### Le domaine personnalisé ne fonctionne pas\n\n**Vérifier la propagation DNS :**\n```bash\ndig docs.example.com\n# Devrait montrer CNAME vers username.github.io\n```\n\n**Vérifier le fichier CNAME :**\n- Doit être dans le dossier `public/`\n- Contient uniquement votre domaine, pas de protocole\n- Pas de barre oblique finale\n\n**Problèmes courants :**\n- DNS pas encore propagé (attendez jusqu'à 24 heures)\n- Fichier CNAME manquant ou incorrect\n- Échec de la vérification du domaine dans les paramètres GitHub\n\n### Échec du build dans Actions\n\n**Voir les journaux :**\n1. Allez dans l'onglet Actions\n2. Cliquez sur le workflow échoué\n3. Développez l'étape de build pour voir les erreurs\n\n**Corrections courantes :**\n- Augmenter la version de Node dans le workflow\n- Vider le cache npm : `npm ci --cache .npm`\n- Vérifier les dépendances manquantes\n\n## Conseils de performance\n\n### Activer la mise en cache\n\nMettez en cache node_modules pour des builds plus rapides :\n\n```yaml\n- name: Setup Node\n  uses: actions/setup-node@v4\n  with:\n    node-version: '20'\n    cache: 'npm'\n```\n\n### Optimiser les images\n\nPré-optimisez les images avant de commiter :\n\n```bash\nnpm install -D imagemin-cli\n\n# Optimiser toutes les images\nnpx imagemin public/images/* --out-dir=public/images\n```\n\n### Réduire la taille du bundle\n\nVérifiez ce qui est dans votre bundle :\n\n```bash\nnpm install -D @next/bundle-analyzer\n\nANALYZE=true npm run build:export\n```\n\n## Limites\n\nGitHub Pages a quelques limites :\n\n- **Taille du dépôt :** 1 Go recommandé\n- **Taille du site :** 1 Go site publié\n- **Bande passante :** 100 Go/mois limite douce\n- **Builds :** 10 par heure\n\nCes limites sont généreuses pour les sites de documentation.\n\n## Migration depuis d'autres plateformes\n\n### Depuis Vercel\n\n1. Mettez à jour la section `deployment` de `specra.config.json`\n2. Exécutez `npm run build:export` localement pour tester\n3. Configurez le workflow GitHub Actions\n4. Poussez pour déclencher le déploiement\n\n### Depuis Netlify\n\nMême processus que Vercel. La sortie statique fonctionne sur les deux plateformes.\n\n## Meilleures pratiques\n\n**Utiliser GitHub Actions** - Déploiement automatique à chaque push\n\n**Versionner vos docs** - Utilisez des tags git pour les versions de documentation\n\n**Tester localement** - Exécutez `npm run build:export \u0026\u0026 npx serve out` avant de pousser\n\n**Surveiller les builds** - Configurez des notifications pour les déploiements échoués\n\n**Utiliser un domaine personnalisé** - Apparence professionnelle et URL stables\n\n**Activer HTTPS** - Toujours appliquer HTTPS pour la sécurité\n\n## Prochaines étapes\n\n\u003cCardGrid cols={2}\u003e\n  \u003cCard\n    icon=\"triangle\"\n    title=\"Vercel\"\n    description=\"Déployer sur Vercel pour des fonctionnalités dynamiques\"\n    href=\"/docs/v1.0.0/deployment/vercel\"\n  /\u003e\n  \u003cCard\n    icon=\"globe\"\n    title=\"Netlify\"\n    description=\"Hébergement statique alternatif\"\n    href=\"/docs/v1.0.0/deployment/netlify\"\n  /\u003e\n  \u003cCard\n    icon=\"arrow-left\"\n    title=\"Aperçu du déploiement\"\n    description=\"Voir toutes les options de déploiement\"\n    href=\"/docs/v1.0.0/deployment/overview\"\n  /\u003e\n  \u003cCard\n    icon=\"settings\"\n    title=\"Configuration\"\n    description=\"Configurer les paramètres de déploiement\"\n    href=\"/docs/v1.0.0/configuration/overview\"\n  /\u003e\n\u003c/CardGrid\u003e\n"])</script><script>self.__next_f.push([1,"31:T2abe,"])</script><script>self.__next_f.push([1,"\n# Rédaction de contenu dans Specra\n\nSpecra utilise MDX (Markdown + JSX) pour la documentation, vous offrant la simplicité de Markdown avec la puissance des composants React. Ce guide couvre tout ce dont vous avez besoin pour rédiger une excellente documentation.\n\n## Bases MDX\n\nLes fichiers MDX ressemblent au Markdown ordinaire mais vous permettent d'utiliser des composants React n'importe où dans votre contenu.\n\n### Markdown standard\n\nToute la syntaxe Markdown standard fonctionne comme prévu :\n\n**Titres :**\n```markdown\n# Titre 1\n## Titre 2\n### Titre 3\n```\n\n**Formatage du texte :**\n```markdown\n**Texte en gras**\n*Texte en italique*\n~~Barré~~\n`Code en ligne`\n```\n\n**Listes :**\n```markdown\n- Liste non ordonnée\n- Un autre élément\n  - Élément imbriqué\n\n1. Liste ordonnée\n2. Deuxième élément\n   1. Élément ordonné imbriqué\n```\n\n**Liens et images :**\n```markdown\n[Texte du lien](https://example.com)\n![Texte alternatif](/images/photo.png)\n```\n\n**Blocs de code :**\n````markdown\n```javascript\nfunction hello() {\n  console.log(\"Bonjour le monde !\")\n}\n```\n````\n\n**Tableaux :**\n```markdown\n| Colonne 1 | Colonne 2 | Colonne 3 |\n|-----------|-----------|-----------|\n| Donnée 1  | Donnée 2  | Donnée 3  |\n| Plus      | Info      | Ici       |\n```\n\n**Citations :**\n```markdown\n\u003e Ceci est une citation.\n\u003e Elle peut s'étendre sur plusieurs lignes.\n```\n\n**Règles horizontales :**\n```markdown\n---\n```\n\n## Utilisation des composants\n\nLes composants sont utilisés avec la syntaxe JSX directement dans votre MDX :\n\n```mdx\n\u003cCallout type=\"info\"\u003e\n  Ceci est un composant callout !\n\u003c/Callout\u003e\n```\n\nTous les composants sont automatiquement disponibles - aucune importation nécessaire.\n\n### Exemples de composants\n\n**Alerter les lecteurs d'une information importante :**\n```mdx\n\u003cCallout type=\"warning\"\u003e\n  Assurez-vous de sauvegarder vos données avant de continuer.\n\u003c/Callout\u003e\n```\n\n**Créer du contenu à onglets :**\n```mdx\n\u003cTabs defaultValue=\"option1\"\u003e\n  \u003cTab label=\"Option 1\"\u003e\n    Contenu pour le premier onglet\n  \u003c/Tab\u003e\n  \u003cTab label=\"Option 2\"\u003e\n    Contenu pour le deuxième onglet\n  \u003c/Tab\u003e\n\u003c/Tabs\u003e\n```\n\n**Guider les utilisateurs à travers des étapes :**\n```mdx\n\u003cSteps\u003e\n  \u003cStep title=\"Installer les dépendances\"\u003e\n    Exécutez `npm install` pour commencer.\n  \u003c/Step\u003e\n  \u003cStep title=\"Configurer votre application\"\u003e\n    Modifiez le fichier de configuration avec vos paramètres.\n  \u003c/Step\u003e\n\u003c/Steps\u003e\n```\n\nVoir la section [Composants](/docs/v1.0.0/components) pour tous les composants disponibles.\n\n## Organisation du contenu\n\n### Meilleures pratiques pour la structure des fichiers\n\nOrganisez les fichiers logiquement pour rendre le contenu facile à trouver :\n\n```txt\ndocs/v1.0.0/\n├── getting-started.mdx         # Niveau supérieur : pages essentielles\n├── installation.mdx\n├── guides/                     # Regrouper le contenu connexe\n│   ├── _category_.json\n│   ├── basics.mdx\n│   ├── advanced.mdx\n│   └── examples/              # Imbrication supplémentaire pour les sous-sujets\n│       ├── _category_.json\n│       ├── example-1.mdx\n│       └── example-2.mdx\n└── api/\n    ├── _category_.json\n    └── reference.mdx\n```\n\n**Conseils :**\n- Gardez le niveau supérieur pour les pages critiques dont les utilisateurs ont besoin en premier\n- Utilisez des dossiers pour regrouper le contenu connexe\n- Limitez l'imbrication à 2-3 niveaux maximum\n- Nommez les fichiers de manière descriptive (`authentication.mdx` pas `auth.mdx`)\n\n### Contrôle de l'ordre des pages\n\nUtilisez `sidebar_position` dans le frontmatter pour contrôler l'ordre :\n\n```mdx\n---\ntitle: Installation\nsidebar_position: 1\n---\n```\n\nLes nombres inférieurs apparaissent en premier. Les pages sans position sont triées par ordre alphabétique.\n\nPour les dossiers, utilisez `_category_.json` :\n\n```json\n{\n  \"label\": \"Démarrage\",\n  \"position\": 1\n}\n```\n\n## Conseils de style de rédaction\n\nUne bonne documentation est claire, concise et utile. Voici quelques conseils :\n\n### Soyez clair et direct\n\n**Bon :**\n\u003e Cliquez sur le bouton \"Enregistrer\" pour sauvegarder vos modifications.\n\n**Mauvais :**\n\u003e Vous pourriez envisager de cliquer sur le bouton étiqueté \"Enregistrer\" si vous souhaitez conserver vos modifications dans le stockage.\n\n### Utilisez la voix active\n\n**Bon :**\n\u003e Le système valide votre saisie.\n\n**Mauvais :**\n\u003e Votre saisie est validée par le système.\n\n### Montrez, ne faites pas que dire\n\nIncluez des exemples avec chaque concept :\n\n```mdx\n## Utilisation des variables d'environnement\n\nAccédez aux variables d'environnement dans votre configuration :\n\n```json\n{\n  \"env\": {\n    \"API_URL\": \"https://api.example.com\"\n  }\n}\n```\n\nPuis référencez-les dans votre MDX :\n\n```mdx\nL'API est disponible à {process.env.API_URL}\n```\n```\n\n### Diviser le contenu long\n\nUtilisez des titres, des listes, des callouts et des composants pour créer des pauses visuelles :\n\n```mdx\n## Options de configuration\n\nIl existe plusieurs façons de configurer l'authentification :\n\n### Clés API\n\nLes clés API sont simples mais moins sécurisées.\n\n\u003cCallout type=\"warning\"\u003e\n  Ne commettez jamais de clés API dans le contrôle de version.\n\u003c/Callout\u003e\n\n### OAuth 2.0\n\nOAuth offre une meilleure sécurité pour les applications destinées aux utilisateurs.\n\n\u003cSteps\u003e\n  \u003cStep title=\"Enregistrez votre application\"\u003e\n    Créez une application dans le tableau de bord du fournisseur.\n  \u003c/Step\u003e\n  \u003cStep title=\"Configurer l'URL de rappel\"\u003e\n    Définissez votre URI de redirection dans les paramètres de l'application.\n  \u003c/Step\u003e\n\u003c/Steps\u003e\n```\n\n## Travailler avec des images\n\n### Ajout d'images\n\nPlacez les images dans le dossier `public/` :\n\n```txt\npublic/\n├── images/\n│   ├── screenshot.png\n│   └── diagram.svg\n```\n\nRéférencez-les dans MDX :\n\n```mdx\n![Capture d'écran du tableau de bord](/images/screenshot.png)\n```\n\n### Meilleures pratiques pour les images\n\n**Utilisez un texte alternatif descriptif :**\n```mdx\n![Formulaire de connexion montrant les champs email et mot de passe](/images/login.png)\n```\n\n**Optimisez la taille des images :**\n- Utilisez le format WebP lorsque c'est possible\n- Compressez les images avant de les ajouter au dépôt\n- Gardez les images sous 500Ko\n\n**Utilisez le composant Image pour des fonctionnalités avancées :**\n```mdx\n\u003cImage\n  src=\"/images/hero.png\"\n  alt=\"Image héro\"\n  caption=\"La vue principale du tableau de bord\"\n  width={800}\n  height={400}\n/\u003e\n```\n\n## Exemples de code\n\n### Coloration syntaxique\n\nSpécifiez le langage après les accents graves d'ouverture :\n\n````markdown\n```javascript\nconst greeting = \"Bonjour le monde !\"\nconsole.log(greeting)\n```\n\n```python\ndef greet():\n    print(\"Bonjour le monde !\")\n```\n\n```bash\nnpm install specra\n```\n````\n\nLes langages pris en charge incluent : javascript, typescript, python, bash, json, yaml, markdown, html, css, et bien d'autres.\n\n### Surlignage de lignes\n\nSurlignez des lignes spécifiques pour attirer l'attention :\n\n````markdown\n```javascript {2,4-6}\nfunction calculateTotal(items) {\n  const subtotal = items.reduce((sum, item) =\u003e sum + item.price, 0)\n  const tax = subtotal * 0.1\n  const shipping = 5.99\n  const total = subtotal + tax + shipping\n  return total\n}\n```\n````\n\n### Noms de fichiers\n\nMontrez à quel fichier le code appartient :\n\n````markdown\n```javascript title=\"src/utils.js\"\nexport function formatDate(date) {\n  return date.toLocaleDateString()\n}\n```\n````\n\n### Utilisation du composant CodeBlock\n\nPour plus de contrôle :\n\n```mdx\n\u003cCodeBlock\n  language=\"javascript\"\n  title=\"src/app.js\"\n  highlightLines={[3, 5]}\n  showLineNumbers={true}\n\u003e\n{`function app() {\n  const config = loadConfig()\n  const server = createServer(config)\n  server.listen(3000)\n  console.log(\"Server running\")\n}`}\n\u003c/CodeBlock\u003e\n```\n\n## Liens et navigation\n\n### Liens internes\n\nLien vers d'autres pages dans vos docs :\n\n```mdx\nVoir le [guide de configuration](/docs/v1.0.0/configuration/overview) pour les détails.\n```\n\nUtilisez des chemins relatifs depuis la racine du site, y compris la version.\n\n### Liens externes\n\nLes liens externes s'ouvrent automatiquement dans un nouvel onglet :\n\n```mdx\nConsultez la [documentation Next.js](https://nextjs.org/docs).\n```\n\n### Liens d'ancrage\n\nLien vers des titres sur la même page :\n\n```mdx\nSauter à [Installation](#installation) ci-dessous.\n```\n\nLes ancres de titre sont générées automatiquement à partir du texte du titre en minuscules avec des traits d'union.\n\n## Référence Frontmatter\n\nChaque fichier MDX a besoin de frontmatter. Voici un exemple complet :\n\n```mdx\n---\ntitle: Sujets avancés\ndescription: Plongée profonde dans les fonctionnalités avancées de Specra\nsidebar_position: 10\ntab_group: guides\nicon: zap\ntags: [advanced, configuration, optimization]\ndraft: false\n---\n\n# Votre contenu commence ici\n```\n\n**Champs requis :**\n- `title` : Titre de la page\n\n**Champs recommandés :**\n- `description` : Description SEO (150-160 caractères)\n\n**Champs optionnels :**\n- `sidebar_position` : Numéro pour l'ordre de la barre latérale\n- `tab_group` : Assigner à un groupe d'onglets\n- `icon` : Nom de l'icône Lucide\n- `tags` : Tableau de balises\n- `draft` : Masquer en production si vrai\n\n## Fonctionnalités MDX avancées\n\n### Importation de composants\n\nBien que les composants intégrés fonctionnent automatiquement, vous pouvez importer des composants personnalisés :\n\n```mdx\nimport { MyCustomComponent } from '@/components/custom'\n\n\u003cMyCustomComponent data=\"example\" /\u003e\n```\n\n### Utilisation d'expressions JavaScript\n\nIncorporez des expressions JavaScript :\n\n```mdx\nL'année actuelle est {new Date().getFullYear()}.\n```\n\n### Contenu conditionnel\n\nUtilisez JavaScript pour le rendu conditionnel :\n\n```mdx\n{process.env.NODE_ENV === 'development' \u0026\u0026 (\n  \u003cCallout type=\"info\"\u003e\n    Vous visualisez la version de développement.\n  \u003c/Callout\u003e\n)}\n```\n\n## Gestion des versions\n\nLorsque vous avez besoin de plusieurs versions de doc :\n\n```txt\ndocs/\n├── v1.0.0/\n│   └── getting-started.mdx\n├── v2.0.0/\n│   └── getting-started.mdx\n└── next/\n    └── getting-started.mdx\n```\n\nDéfinissez la version active dans `specra.config.json` :\n\n```json\n{\n  \"site\": {\n    \"activeVersion\": \"v2.0.0\"\n  }\n}\n```\n\nLes utilisateurs peuvent changer de version avec le menu déroulant de version dans l'interface utilisateur.\n\n## Meilleures pratiques SEO\n\n### Titres et descriptions de page\n\nIncluez toujours les deux dans le frontmatter :\n\n```mdx\n---\ntitle: Démarrage avec Specra\ndescription: Apprenez comment installer et configurer Specra pour vos besoins de documentation\n---\n```\n\n### Titres descriptifs\n\nUtilisez des titres clairs et descriptifs qui incluent des mots-clés :\n\n**Bon :**\n```markdown\n## Installation de Specra avec npm\n```\n\n**Mauvais :**\n```markdown\n## Installation\n```\n\n### Contenu structuré\n\nUtilisez une hiérarchie de titres appropriée (h1 → h2 → h3). Ne sautez jamais de niveaux.\n"])</script><script>self.__next_f.push([1,"32:T2abe,"])</script><script>self.__next_f.push([1,"\n# Rédaction de contenu dans Specra\n\nSpecra utilise MDX (Markdown + JSX) pour la documentation, vous offrant la simplicité de Markdown avec la puissance des composants React. Ce guide couvre tout ce dont vous avez besoin pour rédiger une excellente documentation.\n\n## Bases MDX\n\nLes fichiers MDX ressemblent au Markdown ordinaire mais vous permettent d'utiliser des composants React n'importe où dans votre contenu.\n\n### Markdown standard\n\nToute la syntaxe Markdown standard fonctionne comme prévu :\n\n**Titres :**\n```markdown\n# Titre 1\n## Titre 2\n### Titre 3\n```\n\n**Formatage du texte :**\n```markdown\n**Texte en gras**\n*Texte en italique*\n~~Barré~~\n`Code en ligne`\n```\n\n**Listes :**\n```markdown\n- Liste non ordonnée\n- Un autre élément\n  - Élément imbriqué\n\n1. Liste ordonnée\n2. Deuxième élément\n   1. Élément ordonné imbriqué\n```\n\n**Liens et images :**\n```markdown\n[Texte du lien](https://example.com)\n![Texte alternatif](/images/photo.png)\n```\n\n**Blocs de code :**\n````markdown\n```javascript\nfunction hello() {\n  console.log(\"Bonjour le monde !\")\n}\n```\n````\n\n**Tableaux :**\n```markdown\n| Colonne 1 | Colonne 2 | Colonne 3 |\n|-----------|-----------|-----------|\n| Donnée 1  | Donnée 2  | Donnée 3  |\n| Plus      | Info      | Ici       |\n```\n\n**Citations :**\n```markdown\n\u003e Ceci est une citation.\n\u003e Elle peut s'étendre sur plusieurs lignes.\n```\n\n**Règles horizontales :**\n```markdown\n---\n```\n\n## Utilisation des composants\n\nLes composants sont utilisés avec la syntaxe JSX directement dans votre MDX :\n\n```mdx\n\u003cCallout type=\"info\"\u003e\n  Ceci est un composant callout !\n\u003c/Callout\u003e\n```\n\nTous les composants sont automatiquement disponibles - aucune importation nécessaire.\n\n### Exemples de composants\n\n**Alerter les lecteurs d'une information importante :**\n```mdx\n\u003cCallout type=\"warning\"\u003e\n  Assurez-vous de sauvegarder vos données avant de continuer.\n\u003c/Callout\u003e\n```\n\n**Créer du contenu à onglets :**\n```mdx\n\u003cTabs defaultValue=\"option1\"\u003e\n  \u003cTab label=\"Option 1\"\u003e\n    Contenu pour le premier onglet\n  \u003c/Tab\u003e\n  \u003cTab label=\"Option 2\"\u003e\n    Contenu pour le deuxième onglet\n  \u003c/Tab\u003e\n\u003c/Tabs\u003e\n```\n\n**Guider les utilisateurs à travers des étapes :**\n```mdx\n\u003cSteps\u003e\n  \u003cStep title=\"Installer les dépendances\"\u003e\n    Exécutez `npm install` pour commencer.\n  \u003c/Step\u003e\n  \u003cStep title=\"Configurer votre application\"\u003e\n    Modifiez le fichier de configuration avec vos paramètres.\n  \u003c/Step\u003e\n\u003c/Steps\u003e\n```\n\nVoir la section [Composants](/docs/v1.0.0/components) pour tous les composants disponibles.\n\n## Organisation du contenu\n\n### Meilleures pratiques pour la structure des fichiers\n\nOrganisez les fichiers logiquement pour rendre le contenu facile à trouver :\n\n```txt\ndocs/v1.0.0/\n├── getting-started.mdx         # Niveau supérieur : pages essentielles\n├── installation.mdx\n├── guides/                     # Regrouper le contenu connexe\n│   ├── _category_.json\n│   ├── basics.mdx\n│   ├── advanced.mdx\n│   └── examples/              # Imbrication supplémentaire pour les sous-sujets\n│       ├── _category_.json\n│       ├── example-1.mdx\n│       └── example-2.mdx\n└── api/\n    ├── _category_.json\n    └── reference.mdx\n```\n\n**Conseils :**\n- Gardez le niveau supérieur pour les pages critiques dont les utilisateurs ont besoin en premier\n- Utilisez des dossiers pour regrouper le contenu connexe\n- Limitez l'imbrication à 2-3 niveaux maximum\n- Nommez les fichiers de manière descriptive (`authentication.mdx` pas `auth.mdx`)\n\n### Contrôle de l'ordre des pages\n\nUtilisez `sidebar_position` dans le frontmatter pour contrôler l'ordre :\n\n```mdx\n---\ntitle: Installation\nsidebar_position: 1\n---\n```\n\nLes nombres inférieurs apparaissent en premier. Les pages sans position sont triées par ordre alphabétique.\n\nPour les dossiers, utilisez `_category_.json` :\n\n```json\n{\n  \"label\": \"Démarrage\",\n  \"position\": 1\n}\n```\n\n## Conseils de style de rédaction\n\nUne bonne documentation est claire, concise et utile. Voici quelques conseils :\n\n### Soyez clair et direct\n\n**Bon :**\n\u003e Cliquez sur le bouton \"Enregistrer\" pour sauvegarder vos modifications.\n\n**Mauvais :**\n\u003e Vous pourriez envisager de cliquer sur le bouton étiqueté \"Enregistrer\" si vous souhaitez conserver vos modifications dans le stockage.\n\n### Utilisez la voix active\n\n**Bon :**\n\u003e Le système valide votre saisie.\n\n**Mauvais :**\n\u003e Votre saisie est validée par le système.\n\n### Montrez, ne faites pas que dire\n\nIncluez des exemples avec chaque concept :\n\n```mdx\n## Utilisation des variables d'environnement\n\nAccédez aux variables d'environnement dans votre configuration :\n\n```json\n{\n  \"env\": {\n    \"API_URL\": \"https://api.example.com\"\n  }\n}\n```\n\nPuis référencez-les dans votre MDX :\n\n```mdx\nL'API est disponible à {process.env.API_URL}\n```\n```\n\n### Diviser le contenu long\n\nUtilisez des titres, des listes, des callouts et des composants pour créer des pauses visuelles :\n\n```mdx\n## Options de configuration\n\nIl existe plusieurs façons de configurer l'authentification :\n\n### Clés API\n\nLes clés API sont simples mais moins sécurisées.\n\n\u003cCallout type=\"warning\"\u003e\n  Ne commettez jamais de clés API dans le contrôle de version.\n\u003c/Callout\u003e\n\n### OAuth 2.0\n\nOAuth offre une meilleure sécurité pour les applications destinées aux utilisateurs.\n\n\u003cSteps\u003e\n  \u003cStep title=\"Enregistrez votre application\"\u003e\n    Créez une application dans le tableau de bord du fournisseur.\n  \u003c/Step\u003e\n  \u003cStep title=\"Configurer l'URL de rappel\"\u003e\n    Définissez votre URI de redirection dans les paramètres de l'application.\n  \u003c/Step\u003e\n\u003c/Steps\u003e\n```\n\n## Travailler avec des images\n\n### Ajout d'images\n\nPlacez les images dans le dossier `public/` :\n\n```txt\npublic/\n├── images/\n│   ├── screenshot.png\n│   └── diagram.svg\n```\n\nRéférencez-les dans MDX :\n\n```mdx\n![Capture d'écran du tableau de bord](/images/screenshot.png)\n```\n\n### Meilleures pratiques pour les images\n\n**Utilisez un texte alternatif descriptif :**\n```mdx\n![Formulaire de connexion montrant les champs email et mot de passe](/images/login.png)\n```\n\n**Optimisez la taille des images :**\n- Utilisez le format WebP lorsque c'est possible\n- Compressez les images avant de les ajouter au dépôt\n- Gardez les images sous 500Ko\n\n**Utilisez le composant Image pour des fonctionnalités avancées :**\n```mdx\n\u003cImage\n  src=\"/images/hero.png\"\n  alt=\"Image héro\"\n  caption=\"La vue principale du tableau de bord\"\n  width={800}\n  height={400}\n/\u003e\n```\n\n## Exemples de code\n\n### Coloration syntaxique\n\nSpécifiez le langage après les accents graves d'ouverture :\n\n````markdown\n```javascript\nconst greeting = \"Bonjour le monde !\"\nconsole.log(greeting)\n```\n\n```python\ndef greet():\n    print(\"Bonjour le monde !\")\n```\n\n```bash\nnpm install specra\n```\n````\n\nLes langages pris en charge incluent : javascript, typescript, python, bash, json, yaml, markdown, html, css, et bien d'autres.\n\n### Surlignage de lignes\n\nSurlignez des lignes spécifiques pour attirer l'attention :\n\n````markdown\n```javascript {2,4-6}\nfunction calculateTotal(items) {\n  const subtotal = items.reduce((sum, item) =\u003e sum + item.price, 0)\n  const tax = subtotal * 0.1\n  const shipping = 5.99\n  const total = subtotal + tax + shipping\n  return total\n}\n```\n````\n\n### Noms de fichiers\n\nMontrez à quel fichier le code appartient :\n\n````markdown\n```javascript title=\"src/utils.js\"\nexport function formatDate(date) {\n  return date.toLocaleDateString()\n}\n```\n````\n\n### Utilisation du composant CodeBlock\n\nPour plus de contrôle :\n\n```mdx\n\u003cCodeBlock\n  language=\"javascript\"\n  title=\"src/app.js\"\n  highlightLines={[3, 5]}\n  showLineNumbers={true}\n\u003e\n{`function app() {\n  const config = loadConfig()\n  const server = createServer(config)\n  server.listen(3000)\n  console.log(\"Server running\")\n}`}\n\u003c/CodeBlock\u003e\n```\n\n## Liens et navigation\n\n### Liens internes\n\nLien vers d'autres pages dans vos docs :\n\n```mdx\nVoir le [guide de configuration](/docs/v1.0.0/configuration/overview) pour les détails.\n```\n\nUtilisez des chemins relatifs depuis la racine du site, y compris la version.\n\n### Liens externes\n\nLes liens externes s'ouvrent automatiquement dans un nouvel onglet :\n\n```mdx\nConsultez la [documentation Next.js](https://nextjs.org/docs).\n```\n\n### Liens d'ancrage\n\nLien vers des titres sur la même page :\n\n```mdx\nSauter à [Installation](#installation) ci-dessous.\n```\n\nLes ancres de titre sont générées automatiquement à partir du texte du titre en minuscules avec des traits d'union.\n\n## Référence Frontmatter\n\nChaque fichier MDX a besoin de frontmatter. Voici un exemple complet :\n\n```mdx\n---\ntitle: Sujets avancés\ndescription: Plongée profonde dans les fonctionnalités avancées de Specra\nsidebar_position: 10\ntab_group: guides\nicon: zap\ntags: [advanced, configuration, optimization]\ndraft: false\n---\n\n# Votre contenu commence ici\n```\n\n**Champs requis :**\n- `title` : Titre de la page\n\n**Champs recommandés :**\n- `description` : Description SEO (150-160 caractères)\n\n**Champs optionnels :**\n- `sidebar_position` : Numéro pour l'ordre de la barre latérale\n- `tab_group` : Assigner à un groupe d'onglets\n- `icon` : Nom de l'icône Lucide\n- `tags` : Tableau de balises\n- `draft` : Masquer en production si vrai\n\n## Fonctionnalités MDX avancées\n\n### Importation de composants\n\nBien que les composants intégrés fonctionnent automatiquement, vous pouvez importer des composants personnalisés :\n\n```mdx\nimport { MyCustomComponent } from '@/components/custom'\n\n\u003cMyCustomComponent data=\"example\" /\u003e\n```\n\n### Utilisation d'expressions JavaScript\n\nIncorporez des expressions JavaScript :\n\n```mdx\nL'année actuelle est {new Date().getFullYear()}.\n```\n\n### Contenu conditionnel\n\nUtilisez JavaScript pour le rendu conditionnel :\n\n```mdx\n{process.env.NODE_ENV === 'development' \u0026\u0026 (\n  \u003cCallout type=\"info\"\u003e\n    Vous visualisez la version de développement.\n  \u003c/Callout\u003e\n)}\n```\n\n## Gestion des versions\n\nLorsque vous avez besoin de plusieurs versions de doc :\n\n```txt\ndocs/\n├── v1.0.0/\n│   └── getting-started.mdx\n├── v2.0.0/\n│   └── getting-started.mdx\n└── next/\n    └── getting-started.mdx\n```\n\nDéfinissez la version active dans `specra.config.json` :\n\n```json\n{\n  \"site\": {\n    \"activeVersion\": \"v2.0.0\"\n  }\n}\n```\n\nLes utilisateurs peuvent changer de version avec le menu déroulant de version dans l'interface utilisateur.\n\n## Meilleures pratiques SEO\n\n### Titres et descriptions de page\n\nIncluez toujours les deux dans le frontmatter :\n\n```mdx\n---\ntitle: Démarrage avec Specra\ndescription: Apprenez comment installer et configurer Specra pour vos besoins de documentation\n---\n```\n\n### Titres descriptifs\n\nUtilisez des titres clairs et descriptifs qui incluent des mots-clés :\n\n**Bon :**\n```markdown\n## Installation de Specra avec npm\n```\n\n**Mauvais :**\n```markdown\n## Installation\n```\n\n### Contenu structuré\n\nUtilisez une hiérarchie de titres appropriée (h1 → h2 → h3). Ne sautez jamais de niveaux.\n"])</script><script>self.__next_f.push([1,"33:T564,\nCette page montre la génération automatique de documentation API à partir d'une spécification **OpenAPI 3.0**.\n\nLe composant détecte automatiquement le format et l'analyse dans notre système de documentation.\n\n\u003cCallout type=\"info\" title=\"Auto-détection\"\u003e\nLe composant `ApiReference` détecte automatiquement le format OpenAPI lorsque vous utilisez `parser=\"auto\"` (par défaut).\n\u003c/Callout\u003e\n\n---\n\n\u003cApiReference spec=\"/api-specs/openapi-example.json\" /\u003e\n\n---\n\n## À propos de cet exemple\n\nCet exemple montre comment l'analyseur gère :\n\n- ✅ Détection du **format OpenAPI 3.0**\n- ✅ Résolution des **références de schéma** (`$ref`)\n- ✅ **Paramètres de chemin** (`{id}` converti en `:id`)\n- ✅ **Schémas de requête/réponse** avec exemples\n- ✅ **Schémas de sécurité** (Jetons Bearer, clés API)\n- ✅ **Codes de réponse multiples** (succès et erreurs)\n\n## Utilisation de votre propre spécification OpenAPI\n\nPour utiliser votre propre spécification OpenAPI :\n\n1. **Placez votre fichier de spécification** dans le répertoire `/public/api-specs/`\n2. **Référencez-le dans votre fichier MDX** :\n\n```mdx\n\u003cApiReference spec=\"/api-specs/your-api.json\" parser=\"openapi\" /\u003e\n```\n\nOu laissez-le détecter automatiquement :\n\n```mdx\n\u003cApiReference spec=\"/api-specs/your-api.json\" /\u003e\n```\n\nL'analyseur prend en charge les formats **OpenAPI 3.x** et **Swagger 2.0**.\n34:T564,\nCette page montre la génération automatique de documentation API à partir d'une spécification **OpenAPI 3.0**.\n\nLe composant détecte automatiquement le format et l'analyse dans notre système de documentation.\n\n\u003cCallout type=\"info\" title=\"Auto-détection\"\u003e\nLe composant `ApiReference` détecte automatiquement le format OpenAPI lorsque vous utilisez `parser=\"auto\"` (par défaut).\n\u003c/Callout\u003e\n\n---\n\n\u003cApiReference spec=\"/api-specs/openapi-example.json\" /\u003e\n\n---\n\n## À propos de cet exemple\n\nCet exemple montre comment l'analyseur gère :\n\n- ✅ Détection du **format OpenAPI 3.0**\n- ✅ Résolution des **références de schéma** (`$ref`)\n- ✅ **Paramètres de chemin** (`{id}` converti en `:id`)\n- ✅ **Schémas de requête/réponse** avec exemples\n- ✅ **Schémas de sécurité** (Jetons Bearer, clés API)\n- ✅ **Codes de réponse multiples** (succès et erreurs)\n\n## Utilisation de votre propre spécification OpenAPI\n\nPour utiliser votre propre spécification OpenAPI :\n\n1. **Placez votre fichier de spécification** dans le répertoire `/public/api-specs/`\n2. **Référencez-le dans votre fichier MDX** :\n\n```mdx\n\u003cApiReference spec=\"/api-specs/your-api.json\" parser=\"openapi\" /\u003e\n```\n\nOu laissez-le détecter automatiquement :\n\n```mdx\n\u003cApiReference spec=\"/api-specs/your-api.json\" /\u003e\n```\n\nL'analyseur prend en charge les formats **OpenAPI 3.x** et **Swagger 2.0**.\n35:T1e75,"])</script><script>self.__next_f.push([1,"\n# Callout\n\nLes Callouts attirent l'attention sur des informations importantes dans votre documentation. Ils existent en différents styles pour transmettre différents types de messages, des astuces utiles aux avertissements critiques.\n\n## Utilisation de base\n\n\u003cTabs defaultValue=\"Preview\"\u003e\n  \u003cTab label=\"Aperçu\"\u003e\n\u003cCallout type=\"info\"\u003e\n  Ceci est une information utile pour le lecteur.\n\u003c/Callout\u003e\n  \u003c/Tab\u003e\n  \u003cTab label=\"Code\"\u003e\n```mdx\n\u003cCallout type=\"info\"\u003e\n  Ceci est une information utile pour le lecteur.\n\u003c/Callout\u003e\n```\n  \u003c/Tab\u003e\n\u003c/Tabs\u003e\n\n## Types de Callout\n\nSpecra inclut sept types de callout, chacun avec un style distinct :\n\n### Info\n\n\u003cTabs defaultValue=\"Preview\"\u003e\n  \u003cTab label=\"Aperçu\"\u003e\n\u003cCallout type=\"info\"\u003e\n  Fournit un contexte supplémentaire ou des informations utiles qui améliorent la compréhension.\n\u003c/Callout\u003e\n  \u003c/Tab\u003e\n  \u003cTab label=\"Code\"\u003e\n```mdx\n\u003cCallout type=\"info\"\u003e\n  Fournit un contexte supplémentaire ou des informations utiles.\n\u003c/Callout\u003e\n```\n  \u003c/Tab\u003e\n\u003c/Tabs\u003e\n\n### Note\n\n\u003cTabs defaultValue=\"Preview\"\u003e\n  \u003cTab label=\"Aperçu\"\u003e\n\u003cCallout type=\"note\"\u003e\n  Met en évidence des détails importants dont le lecteur doit être conscient.\n\u003c/Callout\u003e\n  \u003c/Tab\u003e\n  \u003cTab label=\"Code\"\u003e\n```mdx\n\u003cCallout type=\"note\"\u003e\n  Met en évidence des détails importants dont le lecteur doit être conscient.\n\u003c/Callout\u003e\n```\n  \u003c/Tab\u003e\n\u003c/Tabs\u003e\n\n### Conseil (Tip)\n\n\u003cTabs defaultValue=\"Preview\"\u003e\n  \u003cTab label=\"Aperçu\"\u003e\n\u003cCallout type=\"tip\"\u003e\n  Offre des suggestions pour une meilleure utilisation ou de meilleures pratiques.\n\u003c/Callout\u003e\n  \u003c/Tab\u003e\n  \u003cTab label=\"Code\"\u003e\n```mdx\n\u003cCallout type=\"tip\"\u003e\n  Offre des suggestions pour une meilleure utilisation ou de meilleures pratiques.\n\u003c/Callout\u003e\n```\n  \u003c/Tab\u003e\n\u003c/Tabs\u003e\n\n### Avertissement (Warning)\n\n\u003cTabs defaultValue=\"Preview\"\u003e\n  \u003cTab label=\"Aperçu\"\u003e\n\u003cCallout type=\"warning\"\u003e\n  Alerte les utilisateurs sur des problèmes potentiels ou des changements de rupture.\n\u003c/Callout\u003e\n  \u003c/Tab\u003e\n  \u003cTab label=\"Code\"\u003e\n```mdx\n\u003cCallout type=\"warning\"\u003e\n  Alerte les utilisateurs sur des problèmes potentiels ou des changements de rupture.\n\u003c/Callout\u003e\n```\n  \u003c/Tab\u003e\n\u003c/Tabs\u003e\n\n### Succès (Success)\n\n\u003cTabs defaultValue=\"Preview\"\u003e\n  \u003cTab label=\"Aperçu\"\u003e\n\u003cCallout type=\"success\"\u003e\n  Confirme des résultats positifs ou des actions terminées avec succès.\n\u003c/Callout\u003e\n  \u003c/Tab\u003e\n  \u003cTab label=\"Code\"\u003e\n```mdx\n\u003cCallout type=\"success\"\u003e\n  Confirme des résultats positifs ou des actions terminées avec succès.\n\u003c/Callout\u003e\n```\n  \u003c/Tab\u003e\n\u003c/Tabs\u003e\n\n### Erreur (Error)\n\n\u003cTabs defaultValue=\"Preview\"\u003e\n  \u003cTab label=\"Aperçu\"\u003e\n\u003cCallout type=\"error\"\u003e\n  Met en évidence des problèmes critiques ou des choses que les utilisateurs doivent éviter.\n\u003c/Callout\u003e\n  \u003c/Tab\u003e\n  \u003cTab label=\"Code\"\u003e\n```mdx\n\u003cCallout type=\"error\"\u003e\n  Met en évidence des problèmes critiques ou des choses que les utilisateurs doivent éviter.\n\u003c/Callout\u003e\n```\n  \u003c/Tab\u003e\n\u003c/Tabs\u003e\n\n### Danger\n\n\u003cTabs defaultValue=\"Preview\"\u003e\n  \u003cTab label=\"Aperçu\"\u003e\n\u003cCallout type=\"danger\"\u003e\n  Avertit d'actions potentiellement destructrices ou irréversibles.\n\u003c/Callout\u003e\n  \u003c/Tab\u003e\n  \u003cTab label=\"Code\"\u003e\n```mdx\n\u003cCallout type=\"danger\"\u003e\n  Avertit d'actions potentiellement destructrices ou irréversibles.\n\u003c/Callout\u003e\n```\n  \u003c/Tab\u003e\n\u003c/Tabs\u003e\n\n## Props\n\n| Prop | Type | Défaut | Description |\n|------|------|--------|-------------|\n| `type` | `string` | `\"info\"` | Style de callout : `info`, `note`, `tip`, `warning`, `success`, `error`, ou `danger` |\n| `children` | `ReactNode` | Requis | Le contenu à l'intérieur du callout |\n\n## Exemples avancés\n\n### Contenu multi-lignes\n\nLes callouts peuvent contenir n'importe quel contenu MDX, y compris du texte formaté, des listes et du code :\n\n\u003cTabs defaultValue=\"Preview\"\u003e\n  \u003cTab label=\"Aperçu\"\u003e\n\u003cCallout type=\"warning\"\u003e\n  **Considérations importantes avant de déployer :**\n\n  - Sauvegardez votre base de données\n  - Testez d'abord dans l'environnement de staging\n  - Informez votre équipe des temps d'arrêt\n\n  Exécutez `npm run db:backup` pour créer une sauvegarde.\n\u003c/Callout\u003e\n  \u003c/Tab\u003e\n  \u003cTab label=\"Code\"\u003e\n```mdx\n\u003cCallout type=\"warning\"\u003e\n  **Considérations importantes avant de déployer :**\n\n  - Sauvegardez votre base de données\n  - Testez d'abord dans l'environnement de staging\n  - Informez votre équipe des temps d'arrêt\n\n  Exécutez `npm run db:backup` pour créer une sauvegarde.\n\u003c/Callout\u003e\n```\n  \u003c/Tab\u003e\n\u003c/Tabs\u003e\n\n### Composants imbriqués\n\nVous pouvez imbriquer d'autres composants à l'intérieur des callouts :\n\n\u003cTabs defaultValue=\"Preview\"\u003e\n  \u003cTab label=\"Aperçu\"\u003e\n\u003cCallout type=\"info\"\u003e\n  **Conseil de pro :** Utilisez des blocs de code pour montrer des exemples\n\n  \u003cTabs defaultValue=\"js\"\u003e\n    \u003cTab label=\"JavaScript\"\u003e\n      console.log(\"Bonjour !\")\n    \u003c/Tab\u003e\n    \u003cTab label=\"Python\"\u003e\n      print(\"Bonjour !\")\n    \u003c/Tab\u003e\n  \u003c/Tabs\u003e\n\u003c/Callout\u003e\n  \u003c/Tab\u003e\n  \u003cTab label=\"Code\"\u003e\n```mdx\n\u003cCallout type=\"info\"\u003e\n  **Conseil de pro :** Utilisez des blocs de code pour montrer des exemples\n\n  \u003cTabs defaultValue=\"js\"\u003e\n    \u003cTab label=\"JavaScript\"\u003e\n      console.log(\"Bonjour !\")\n    \u003c/Tab\u003e\n    \u003cTab label=\"Python\"\u003e\n      print(\"Bonjour !\")\n    \u003c/Tab\u003e\n  \u003c/Tabs\u003e\n\u003c/Callout\u003e\n```\n  \u003c/Tab\u003e\n\u003c/Tabs\u003e\n\n## Alertes de style GitHub\n\nVous préférez la syntaxe Markdown ? Specra prend également en charge la syntaxe d'alerte de style GitHub en utilisant des blockquotes :\n\n\u003cTabs defaultValue=\"Preview\"\u003e\n  \u003cTab label=\"Aperçu\"\u003e\n\u003e [!NOTE]\n\u003e Ceci est une note utilisant la syntaxe de style GitHub.\n\n\u003e [!TIP]\n\u003e Ceci est une astuce utilisant la syntaxe blockquote.\n\n\u003e [!WARNING]\n\u003e Ceci est une alerte d'avertissement.\n  \u003c/Tab\u003e\n  \u003cTab label=\"Code\"\u003e\n```markdown\n\u003e [!NOTE]\n\u003e Ceci est une note utilisant la syntaxe de style GitHub.\n\n\u003e [!TIP]\n\u003e Ceci est une astuce utilisant la syntaxe blockquote.\n\n\u003e [!WARNING]\n\u003e Ceci est une alerte d'avertissement.\n```\n  \u003c/Tab\u003e\n\u003c/Tabs\u003e\n\n**Types d'alertes pris en charge :**\n- `[!NOTE]` - Identique à type=\"note\"\n- `[!TIP]` - Identique à type=\"tip\"\n- `[!IMPORTANT]` - Identique à type=\"warning\"\n- `[!WARNING]` - Identique à type=\"warning\"\n- `[!CAUTION]` - Identique à type=\"danger\"\n\n## Quand utiliser chaque type\n\n**Info** - Contexte supplémentaire qui améliore la compréhension\n- \"Vous pouvez également réaliser cela en utilisant le CLI\"\n- \"Cette fonctionnalité est disponible dans la v2.0 et ultérieure\"\n\n**Note** - Informations importantes qui ne doivent pas être ignorées\n- \"Ce paramètre affecte tous les utilisateurs de votre organisation\"\n- \"Les changements prennent effet après le redémarrage du serveur\"\n\n**Tip** - Meilleures pratiques et suggestions utiles\n- \"Pour de meilleures performances, activez la mise en cache\"\n- \"Utilisez TypeScript pour une meilleure autocomplétion\"\n\n**Warning** - Problèmes potentiels ou changements de rupture\n- \"Cela modifiera votre schéma de base de données\"\n- \"Obsolète dans la v3.0, utilisez newMethod() à la place\"\n\n**Success** - Confirmations positives\n- \"Configuration terminée ! Votre site est prêt\"\n- \"Tous les tests ont réussi\"\n\n**Error** - Problèmes critiques à éviter\n- \"N'exposez pas votre clé API dans le code client\"\n- \"Cette opération ne peut pas être annulée\"\n\n**Danger** - Actions destructrices ou irréversibles\n- \"Cela supprimera définitivement toutes les données\"\n- \"Continuer révoquera tous les jetons d'accès\"\n\n## Accessibilité\n\nLes callouts sont sémantiques et accessibles :\n\n- Utilise les rôles ARIA appropriés\n- Compatible avec les lecteurs d'écran\n- Navigable au clavier\n- Conforme au contraste des couleurs (WCAG AA)\n- Les icônes sont décoratives avec un texte alternatif approprié\n\n## Composants associés\n\n\u003cCardGrid cols={3}\u003e\n  \u003cCard icon=\"square\" title=\"Card\" href=\"/docs/v1.0.0/components/card\" /\u003e\n  \u003cCard icon=\"message-square\" title=\"Badge\" href=\"/docs/v1.0.0/components/badge\" /\u003e\n  \u003cCard icon=\"layers\" title=\"Accordéon\" href=\"/docs/v1.0.0/components/accordion\" /\u003e\n\u003c/CardGrid\u003e\n"])</script><script>self.__next_f.push([1,"36:T1e75,"])</script><script>self.__next_f.push([1,"\n# Callout\n\nLes Callouts attirent l'attention sur des informations importantes dans votre documentatio github.io/nom-repo` (sert depuis `/nom-repo/`)\n- **Netlify :** `votre-site.netlify.app` (sert depuis la racine `/`)\n\nSpecra a besoin de connaître votre cible de déploiement pour configurer correctement les chemins des ressources.\n\n## Configuration de base\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"vercel\"\n  }\n}\n```\n\nC'est tout ce dont vous avez besoin pour la plupart des déploiements. Specra gère le reste automatiquement.\n\n## Configuration complète\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"vercel\",\n    \"basePath\": \"\",\n    \"customDomain\": false\n  }\n}\n```\n\n## Options de configuration\n\n### target\n\n**Type :** `string`\n**Défaut :** `\"vercel\"`\n\nVotre plateforme de déploiement. Cela détermine quel processus de build Specra utilise.\n\n**Cibles disponibles :**\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"vercel\"\n  }\n}\n```\n\n**Options :**\n- `\"vercel\"` - Vercel, Railway, Render, ou tout hébergement Node.js\n- `\"github-pages\"` - GitHub Pages sans domaine personnalisé\n- `\"static\"` - Hébergement statique (Netlify, Cloudflare Pages)\n- `\"custom-domain-static\"` - GitHub Pages avec domaine personnalisé\n\n### basePath\n\n**Type :** `string`\n**Défaut :** `\"\"`\n\nChemin de base pour votre site. Nécessaire uniquement pour GitHub Pages sans domaine personnalisé.\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"github-pages\",\n    \"basePath\": \"mon-repo\"\n  }\n}\n```\n\n**Quand utiliser basePath :**\n\n✅ **GitHub Pages sans domaine personnalisé**\n```\nURL: nom-utilisateur.github.io/mon-repo\nConfig: \"basePath\": \"mon-repo\"\n```\n\n❌ **GitHub Pages avec domaine personnalisé**\n```\nURL: docs.example.com\nConfig: \"basePath\": \"\"\n```\n\n❌ **Vercel, Netlify, etc.**\n```\nURL: votre-site.vercel.app\nConfig: \"basePath\": \"\"\n```\n\n\u003cCallout type=\"warning\"\u003e\nLe basePath doit correspondre exactement au nom de votre dépôt. S'ils ne correspondent pas, les ressources renverront des erreurs 404.\n\u003c/Callout\u003e\n\n### customDomain\n\n**Type :** `boolean`\n**Défaut :** `false`\n\nDéfinissez à `true` lors de l'utilisation d'un domaine personnalisé avec GitHub Pages.\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"github-pages\",\n    \"customDomain\": true,\n    \"basePath\": \"\"\n  }\n}\n```\n\nCela indique à Specra de servir les ressources depuis la racine `/` au lieu de `/nom-repo/`.\n\n## Configurations spécifiques à la plateforme\n\n### Vercel\n\nLa configuration par défaut fonctionne parfaitement :\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"vercel\"\n  }\n}\n```\n\n**Commande de build :** `npm run build`\n**Sortie :** Répertoire `.next`\n**Aucun basePath nécessaire**\n\n### GitHub Pages (Sans domaine personnalisé)\n\nPour `nom-utilisateur.github.io/nom-repo` :\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"github-pages\",\n    \"basePath\": \"nom-repo\",\n    \"customDomain\": false\n  }\n}\n```\n\n**Commande de build :** `npm run build:export`\n**Sortie :** Répertoire `out`\n**Les ressources se chargent depuis :** `/nom-repo/_next/...`\n\n### GitHub Pages (Avec domaine personnalisé)\n\nPour `docs.example.com` :\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"custom-domain-static\",\n    \"basePath\": \"\",\n    \"customDomain\": true\n  }\n}\n```\n\nAjoutez également `public/CNAME` :\n```\ndocs.example.com\n```\n\n**Commande de build :** `npm run build:export`\n**Sortie :** Répertoire `out`\n**Les ressources se chargent depuis :** `/_next/...`\n\n### Netlify\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"static\"\n  }\n}\n```\n\n**Commande de build :** `npm run build:export`\n**Sortie :** Répertoire `out`\n**Aucun basePath nécessaire**\n\n### Cloudflare Pages\n\nMême chose que Netlify :\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"static\"\n  }\n}\n```\n\n## Comment ça marche\n\n### Modes de build\n\nSpecra a deux modes de build :\n\n**1. Autonome (Hébergement Node.js)**\n- Utilisé pour : Vercel, Railway, Render\n- Commande : `npm run build`\n- Sortie : Répertoire `.next`\n- S'exécute comme un serveur Node.js\n- Prend en charge les fonctionnalités dynamiques\n\n**2. Export statique (Hébergement statique)**\n- Utilisé pour : GitHub Pages, Netlify, Cloudflare Pages\n- Commande : `npm run build:export`\n- Sortie : Répertoire `out`\n- Fichiers HTML/CSS/JS purs\n- Aucun serveur requis\n\nLe `deployment.target` détermine quel mode utiliser.\n\n### Résolution du chemin des ressources\n\nSpecra utilise l'utilitaire `getAssetPath()` pour gérer les URL des ressources :\n\n```typescript\n// S'ajuste automatiquement en fonction de la configuration de déploiement\ngetAssetPath('/images/logo.png')\n\n// Vercel : /images/logo.png\n// GitHub Pages (sans domaine personnalisé) : /nom-repo/images/logo.png\n// GitHub Pages (domaine personnalisé) : /images/logo.png\n```\n\nVous n'avez pas à vous en soucier - Specra le gère automatiquement en fonction de votre configuration.\n\n## Changer de plateforme\n\n### De Vercel à GitHub Pages\n\n1. Mettre à jour la configuration :\n```json\n{\n  \"deployment\": {\n    \"target\": \"github-pages\",\n    \"basePath\": \"votre-nom-repo\"\n  }\n}\n```\n\n2. Changer la commande de build :\n```bash\nnpm run build:export  # au lieu de npm run build\n```\n\n3. Déployer le dossier `out/` au lieu de `.next/`\n\n### De GitHub Pages à Netlify\n\n1. Mettre à jour la configuration :\n```json\n{\n  \"deployment\": {\n    \"target\": \"static\",\n    \"basePath\": \"\"\n  }\n}\n```\n\n2. Continuer à utiliser `npm run build:export`\n\n3. Netlify sert depuis la racine, donc supprimer basePath\n\n## Tester localement\n\n### Tester l'export statique\n\n```bash\nnpm run build:export\nnpx serve out\n```\n\nOuvrez l'URL affichée (généralement `http://localhost:3000`). Vérifiez :\n- Les pages se chargent correctement\n- Les images apparaissent\n- Les liens fonctionnent\n- La navigation fonctionne\n\n### Tester avec basePath\n\nSi vous utilisez basePath, testez localement avec un serveur qui le respecte :\n\n```bash\nnpm run build:export\nnpx serve out -s -p 3000\n```\n\nEnsuite, visitez `http://localhost:3000/votre-nom-repo` pour simuler GitHub Pages.\n\n## Dépannage\n\n### Les ressources renvoient 404\n\n**Vérifiez que le basePath correspond au nom du repo :**\n```json\n{\n  \"deployment\": {\n    \"basePath\": \"nom-repo-exact\"  // Doit correspondre exactement\n  }\n}\n```\n\n**Vérifiez que vous utilisez la bonne commande de build :**\n- GitHub Pages : `npm run build:export` (pas `npm run build`)\n- Vercel : `npm run build` (pas `npm run build:export`)\n\n### Page blanche après le déploiement\n\n**Vérifiez que la cible est correcte :**\n- GitHub Pages a besoin de `\"target\": \"github-pages\"`\n- Netlify a besoin de `\"target\": \"static\"`\n- Vercel a besoin de `\"target\": \"vercel\"`\n\n**Vérifiez que les paramètres de déploiement correspondent à la configuration :**\n- Le répertoire de sortie doit correspondre au mode de build\n- La commande de build doit correspondre à la cible\n\n### Domaine personnalisé ne fonctionne pas\n\n**Assurez-vous que customDomain est true :**\n```json\n{\n  \"deployment\": {\n    \"customDomain\": true,\n    \"basePath\": \"\"\n  }\n}\n```\n\n**Vérifiez que le fichier CNAME existe :**\n- Doit être dans `public/CNAME`\n- Contient uniquement votre domaine\n- Pas de protocole, pas de barre oblique finale\n\n## Meilleures pratiques\n\n**Garder la config dans le contrôle de version** - Commitez `specra.config.json` pour que les déploiements soient cohérents\n\n**Tester localement avant de déployer** - Utilisez `npx serve out` pour tester les exports statiques\n\n**Utiliser des configs spécifiques à l'environnement** - Différentes configurations pour le staging et la production si nécessaire\n\n**Documenter votre installation** - Ajoutez des instructions de déploiement à votre README\n\n**Vérifier après avoir changé de plateforme** - Testez que tout fonctionne lors du changement de
