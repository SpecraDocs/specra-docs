p\u003e\n\u003c/Steps\u003e\n\n## Domaine personnalisé\n\nAjoutez votre propre domaine à votre projet Vercel :\n\n\u003cSteps\u003e\n  \u003cStep title=\"Ajouter un domaine\"\u003e\n    1. Allez dans Project Settings → Domains\n    2. Entrez votre domaine (par ex., `docs.example.com`)\n    3. Cliquez sur \"Add\"\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Configurer le DNS\"\u003e\n    Vercel vous montre les enregistrements DNS à ajouter. Typiquement :\n\n**Pour sous-domaine (docs.example.com) :**\n```\nType: CNAME\nNom: docs\nValeur: cname.vercel-dns.com\n```\n\n**Pour domaine apex (example.com) :**\n```\nType: A\nNom: @\nValeur: 76.76.21.21\n```\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Attendre la vérification\"\u003e\n    La propagation DNS prend de 5 minutes à 48 heures (généralement moins d'une heure).\n\n    Vercel provisionne automatiquement un certificat SSL une fois le DNS vérifié.\n  \u003c/Step\u003e\n\u003c/Steps\u003e\n\n## Déploiements automatiques\n\nChaque push git déclenche un déploiement :\n\n**Déploiements de production :**\n- Les commits sur la branche `main` sont déployés en production\n- Met à jour votre site en direct automatiquement\n\n**Déploiements de prévisualisation :**\n- Les commits sur d'autres branches reçoivent des URL de prévisualisation\n- Les pull requests reçoivent des URL uniques pour les tests\n- Parfait pour examiner les changements avant de fusionner\n\n### URL de prévisualisation\n\nChaque déploiement de prévisualisation reçoit une URL unique :\n\n```\nvotre-projet-git-feature-branch-username.vercel.app\n```\n\nPartagez-la avec votre équipe pour examiner les changements avant la mise en ligne.\n\n## Paramètres de déploiement\n\n### Configuration de branche\n\nContrôlez quelles branches sont déployées :\n\n1. Allez dans Settings → Git\n2. Définissez la Production Branch (généralement `main`)\n3. Ectivez/désactivez les déploiements de prévisualisation pour les autres branches\n\n### Protection de déploiement\n\nProtégez les déploiements de production :\n\n```json\n{\n  \"git\": {\n    \"deploymentEnabled\": {\n      \"main\": true,\n      \"staging\": \"preview\"\n    }\n  }\n}\n```\n\n## Optimisation des performances\n\nVercel optimise automatiquement votre déploiement :\n\n- **Mise en cache Edge** - Fichiers statiques mis en cache mondialement\n- **Optimisation d'image** - Composant Image Next.js optimisé automatiquement\n- **Compression** - Compression Gzip/Brotli activée\n- **HTTP/2** - Connexions multiplexées plus rapides\n\n### Analytique\n\nActivez Vercel Analytics gratuitement :\n\n1. Allez dans l'onglet Analytics\n2. Cliquez sur \"Enable Analytics\"\n3. Ajoutez le composant Analytics à votre mise en page\n\n```tsx\n// app/layout.tsx\nimport { Analytics } from '@vercel/analytics/react'\n\nexport default function RootLayout({ children }) {\n  return (\n    \u003chtml\u003e\n      \u003cbody\u003e\n        {children}\n        \u003cAnalytics /\u003e\n      \u003c/body\u003e\n    \u003c/html\u003e\n  )\n}\n```\n\n## Intégration CI/CD\n\nVercel agit comme votre pipeline CI/CD :\n\n**Ce qui s'exécute à chaque déploiement :**\n- `npm install` (dépendances)\n- `npm run build` (build Next.js)\n- Vérifications et validations automatiques\n- Déploiement sur le réseau Edge\n\n### Intégration GitHub\n\nVercel commente les pull requests avec :\n- URL de déploiement de prévisualisation\n- Journaux de build\n- Aperçus de performance\n\n### Journaux de build\n\nVoir les journaux de build détaillés :\n1. Allez dans Deployments\n2. Cliquez sur n'importe quel déploiement\n3. Consultez la section Building pour les journaux\n\n## Dépannage\n\n### Échec du build\n\n**Vérifier la version de Node :**\nAssurez-vous d'utiliser Node 18+. Ajoutez à `package.json` :\n\n```json\n{\n  \"engines\": {\n    \"node\": \"\u003e=18.0.0\"\n  }\n}\n```\n\n**Vider le cache de build :**\n1. Allez dans Settings → General\n2. Faites défiler jusqu'à Build \u0026 Development Settings\n3. Vider le cache de build\n\n### Les variables d'environnement ne fonctionnent pas\n\n- Vérifiez les noms de variables (sensibles à la casse)\n- Préfixez les variables côté client avec `NEXT_PUBLIC_`\n- Redéployez après avoir changé les variables\n\n### Le domaine personnalisé ne fonctionne pas\n\n- Vérifiez que les enregistrements DNS sont corrects\n- Attendez la propagation DNS (vérifiez avec `dig` ou `nslookup`)\n- Assurez-vous que CNAME pointe vers `cname.vercel-dns.com`\n- Vérifiez le statut de vérification du domaine dans le tableau de bord Vercel\n\n## Déploiement Monorepo\n\nSi vos docs sont dans un monorepo :\n\n1. Définissez le Root Directory dans les paramètres du projet\n2. Pointez vers votre dossier docs (par ex., `apps/docs`)\n3. Vercel ne construit que ce répertoire\n\n```json\n{\n  \"buildCommand\": \"cd ../.. \u0026\u0026 npm run build:docs\",\n  \"outputDirectory\": \".next\"\n}\n```\n\n## Meilleures pratiques\n\n**Utiliser les déploiements de prévisualisation** - Tester les changements avant de fusionner vers main\n\n**Activer la protection de branche** - Exiger le succès du déploiement de prévisualisation avant de fusionner\n\n**Configurer les notifications** - Recevoir des alertes Slack/email pour le statut de déploiement\n\n**Surveiller l'analytique** - Suivre les pages vues et les performances\n\n**Utiliser la configuration Edge** - Stocker les drapeaux de fonctionnalité et la configuration en périphérie pour des mises à jour instantanées\n\n## Tarification\n\nLe niveau gratuit de Vercel comprend :\n- Déploiements illimités\n- 100 Go de bande passante/mois\n- HTTPS automatique\n- Déploiements de prévisualisation\n- Analytique (basique)\n\nCela est généralement suffisant pour les sites de documentation. Passez à Pro si vous avez besoin de :\n- Plus de bande passante\n- Analytique avancée\n- Protection par mot de passe\n- Support entreprise\n\n## Prochaines étapes\n\n\u003cCardGrid cols={2}\u003e\n  \u003cCard\n    icon=\"github\"\n    title=\"GitHub Pages\"\n    description=\"Déployer comme site statique sur GitHub Pages\"\n    href=\"/docs/v1.0.0/deployment/github-pages\"\n  /\u003e\n  \u003cCard\n    icon=\"globe\"\n    title=\"Netlify\"\n    description=\"Plateforme d'hébergement statique alternative\"\n    href=\"/docs/v1.0.0/deployment/netlify\"\n  /\u003e\n  \u003cCard\n    icon=\"arrow-left\"\n    title=\"Aperçu du déploiement\"\n    description=\"Retour aux options de déploiement\"\n    href=\"/docs/v1.0.0/deployment/overview\"\n  /\u003e\n  \u003cCard\n    icon=\"zap\"\n    title=\"Performance\"\n    description=\"Optimiser votre documentation\"\n    href=\"/docs/v1.0.0/performance\"\n  /\u003e\n\u003c/CardGrid\u003e\n"])</script><script>self.__next_f.push([1,"29:T1845,"])</script><script>self.__next_f.push([1,"\n# Démarrage avec Specra\n\nCe guide vous mènera de zéro à un site de documentation entièrement fonctionnel en moins de 5 minutes. Nous couvrirons l'installation, la configuration de base et la rédaction de votre première page.\n\n## Prérequis\n\nAvant de commencer, assurez-vous d'avoir :\n- **Node.js 18 ou supérieur** (vérifiez avec `node --version`)\n- Un gestionnaire de paquets : **npm** (fourni avec Node.js), **yarn**, ou **pnpm**\n- Un éditeur de code (VS Code recommandé pour la prise en charge MDX)\n\n## Installation\n\nLe moyen le plus rapide de commencer est d'utiliser `create-specra`, notre outil d'échafaudage qui configure tout pour vous.\n\n\u003cSteps\u003e\n  \u003cStep title=\"Créez votre projet\"\u003e\n    Exécutez la commande de création avec le nom de votre projet :\n\n    \u003cTabs defaultValue=\"npm\"\u003e\n      \u003cTab label=\"npm\"\u003e\n```bash\nnpx create-specra@latest my-docs\n```\n      \u003c/Tab\u003e\n      \u003cTab label=\"yarn\"\u003e\n```bash\nyarn create specra my-docs\n```\n      \u003c/Tab\u003e\n      \u003cTab label=\"pnpm\"\u003e\n```bash\npnpm create specra my-docs\n```\n      \u003c/Tab\u003e\n    \u003c/Tabs\u003e\n\n    Cela crée un nouveau répertoire appelé `my-docs` avec tous les fichiers dont vous avez besoin pour commencer.\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Naviguer et installer\"\u003e\n    Déplacez-vous dans votre nouveau projet et installez les dépendances :\n\n    \u003cTabs defaultValue=\"npm\"\u003e\n      \u003cTab label=\"npm\"\u003e\n```bash\ncd my-docs\nnpm install\n```\n      \u003c/Tab\u003e\n      \u003cTab label=\"yarn\"\u003e\n```bash\ncd my-docs\nyarn install\n```\n      \u003c/Tab\u003e\n      \u003cTab label=\"pnpm\"\u003e\n```bash\ncd my-docs\npnpm install\n```\n      \u003c/Tab\u003e\n    \u003c/Tabs\u003e\n\n    L'installation prend généralement 30 à 60 secondes selon votre connexion Internet.\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Démarrez le serveur de développement\"\u003e\n    Lancez le serveur de développement :\n\n    \u003cTabs defaultValue=\"npm\"\u003e\n      \u003cTab label=\"npm\"\u003e\n```bash\nnpm run dev\n```\n      \u003c/Tab\u003e\n      \u003cTab label=\"yarn\"\u003e\n```bash\nyarn dev\n```\n      \u003c/Tab\u003e\n      \u003cTab label=\"pnpm\"\u003e\n```bash\npnpm dev\n```\n      \u003c/Tab\u003e\n    \u003c/Tabs\u003e\n\n    Ouvrez [http://localhost:3000](http://localhost:3000) dans votre navigateur. Vous devriez voir votre site de documentation avec un exemple de contenu !\n\n    \u003cCallout type=\"success\"\u003e\n    Le serveur de développement inclut le rechargement à chaud. Modifiez n'importe quel fichier MDX et regardez vos changements apparaître instantanément.\n    \u003c/Callout\u003e\n  \u003c/Step\u003e\n\u003c/Steps\u003e\n\n## Structure du projet\n\nAprès avoir exécuté `create-specra`, voici ce que vous obtenez :\n\n```txt\nmy-docs/\n├── app/                     # Routeur d'application Next.js\n│   ├── layout.tsx           # Mise en page racine avec fournisseurs Specra\n│   ├── page.tsx             # Page d'accueil\n│   └── docs/                # Routes de documentation\n│       └── [...slug]/       # Route dynamique fourre-tout\n│           └── page.tsx     # Moteur de rendu de page doc\n├── docs/                    # Votre contenu de documentation\n│   └── v1.0.0/             # Dossier de version\n│       ├── about.mdx\n│       ├── getting-started.mdx\n│       └── guides/         # Regroupement de dossiers\n│           ├── _category_.json\n│           └── writing.mdx\n├── public/                  # Actifs statiques (images, icônes)\n├── specra.config.json      # Configuration Specra\n├── package.json\n├── next.config.mjs         # Configuration Next.js\n└── tailwind.config.ts      # Configuration Tailwind\n```\n\n\u003cCallout type=\"info\"\u003e\n**Important :** Tous les fichiers de documentation doivent utiliser l'extension `.mdx`, et non `.md`. MDX vous permet d'utiliser des composants React aux côtés de Markdown.\n\u003c/Callout\u003e\n\n## Votre première page de documentation\n\nCréons votre première page de documentation personnalisée.\n\n\u003cSteps\u003e\n  \u003cStep title=\"Créer un nouveau fichier\"\u003e\n    Dans `docs/v1.0.0/`, créez un fichier appelé `hello.mdx` :\n\n```mdx\n---\ntitle: Bonjour Specra\ndescription: Ma première page de documentation\nsidebar_position: 3\n---\n\n# Bonjour Specra !\n\nCeci est ma première page de documentation. Je peux utiliser du **texte en gras**,\ndu *texte en italique*, et même des [liens](https://specra.dev).\n\n## Fonctionnalités que j'aime\n\n- Rechargement à chaud rapide\n- Beaux composants\n- Structure de fichiers simple\n- Zéro configuration requise\n```\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Voir votre page\"\u003e\n    Enregistrez le fichier et visitez [http://localhost:3000/docs/v1.0.0/hello](http://localhost:3000/docs/v1.0.0/hello)\n\n    Vous devriez voir votre nouvelle page dans la barre latérale et rendue magnifiquement dans la zone de contenu principale.\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Ajouter un composant\"\u003e\n    Rendons cela plus intéressant avec un composant Callout :\n\n```mdx\n---\ntitle: Bonjour Specra\ndescription: Ma première page de documentation\nsidebar_position: 3\n---\n\n# Bonjour Specra !\n\nCeci est ma première page de documentation.\n\n\u003cCallout type=\"success\"\u003e\n  Je viens d'ajouter un composant interactif à mon Markdown ! Aucune importation nécessaire.\n\u003c/Callout\u003e\n\n## Prochaines étapes\n\nPrêt à en savoir plus ? Consultez la section [Composants](/docs/v1.0.0/components).\n```\n\n    Enregistrez et regardez-le se mettre à jour instantanément. Remarquez comment vous n'avez pas eu besoin d'importer le composant Callout - il est automatiquement disponible dans tous vos fichiers MDX.\n  \u003c/Step\u003e\n\u003c/Steps\u003e\n\n## Prochaines étapes\n\nVous avez maintenant un site Specra fonctionnel et connaissez les bases de la création de pages. Voici où aller à partir d'ici :\n\n\u003cCardGrid cols={2}\u003e\n  \u003cCard icon=\"settings\" title=\"Configurez votre site\" description=\"Personnalisez la marque, la navigation et les fonctionnalités\" href=\"/docs/v1.0.0/configuration/overview\" /\u003e\n  \u003cCard icon=\"palette\" title=\"Explorez les composants\" description=\"Découvrez tous les composants d'interface utilisateur disponibles\" href=\"/docs/v1.0.0/components\" /\u003e\n  \u003cCard icon=\"rocket\" title=\"Déployez vos docs\" description=\"Expédiez votre documentation en production\" href=\"/docs/v1.0.0/deployment/overview\" /\u003e\n  \u003cCard icon=\"zap\" title=\"Fonctionnalités avancées\" description=\"Versionnage, recherche, docs API, et plus\" href=\"/docs/v1.0.0/features\" /\u003e\n\u003c/CardGrid\u003e\n"])</script><script>self.__next_f.push([1,"2a:T1845,"])</script><script>self.__next_f.push([1,"\n# Démarrage avec Specra\n\nCe guide vous mènera de zéro à un site de documentation entièrement fonctionnel en moins de 5 minutes. Nous couvrirons l'installation, la configuration de base et la rédaction de votre première page.\n\n## Prérequis\n\nAvant de commencer, assurez-vous d'avoir :\n- **Node.js 18 ou supérieur** (vérifiez avec `node --version`)\n- Un gestionnaire de paquets : **npm** (fourni avec Node.js), **yarn**, ou **pnpm**\n- Un éditeur de code (VS Code recommandé pour la prise en charge MDX)\n\n## Installation\n\nLe moyen le plus rapide de commencer est d'utiliser `create-specra`, notre outil d'échafaudage qui configure tout pour vous.\n\n\u003cSteps\u003e\n  \u003cStep title=\"Créez votre projet\"\u003e\n    Exécutez la commande de création avec le nom de votre projet :\n\n    \u003cTabs defaultValue=\"npm\"\u003e\n      \u003cTab label=\"npm\"\u003e\n```bash\nnpx create-specra@latest my-docs\n```\n      \u003c/Tab\u003e\n      \u003cTab label=\"yarn\"\u003e\n```bash\nyarn create specra my-docs\n```\n      \u003c/Tab\u003e\n      \u003cTab label=\"pnpm\"\u003e\n```bash\npnpm create specra my-docs\n```\n      \u003c/Tab\u003e\n    \u003c/Tabs\u003e\n\n    Cela crée un nouveau répertoire appelé `my-docs` avec tous les fichiers dont vous avez besoin pour commencer.\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Naviguer et installer\"\u003e\n    Déplacez-vous dans votre nouveau projet et installez les dépendances :\n\n    \u003cTabs defaultValue=\"npm\"\u003e\n      \u003cTab label=\"npm\"\u003e\n```bash\ncd my-docs\nnpm install\n```\n      \u003c/Tab\u003e\n      \u003cTab label=\"yarn\"\u003e\n```bash\ncd my-docs\nyarn install\n```\n      \u003c/Tab\u003e\n      \u003cTab label=\"pnpm\"\u003e\n```bash\ncd my-docs\npnpm install\n```\n      \u003c/Tab\u003e\n    \u003c/Tabs\u003e\n\n    L'installation prend généralement 30 à 60 secondes selon votre connexion Internet.\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Démarrez le serveur de développement\"\u003e\n    Lancez le serveur de développement :\n\n    \u003cTabs defaultValue=\"npm\"\u003e\n      \u003cTab label=\"npm\"\u003e\n```bash\nnpm run dev\n```\n      \u003c/Tab\u003e\n      \u003cTab label=\"yarn\"\u003e\n```bash\nyarn dev\n```\n      \u003c/Tab\u003e\n      \u003cTab label=\"pnpm\"\u003e\n```bash\npnpm dev\n```\n      \u003c/Tab\u003e\n    \u003c/Tabs\u003e\n\n    Ouvrez [http://localhost:3000](http://localhost:3000) dans votre navigateur. Vous devriez voir votre site de documentation avec un exemple de contenu !\n\n    \u003cCallout type=\"success\"\u003e\n    Le serveur de développement inclut le rechargement à chaud. Modifiez n'importe quel fichier MDX et regardez vos changements apparaître instantanément.\n    \u003c/Callout\u003e\n  \u003c/Step\u003e\n\u003c/Steps\u003e\n\n## Structure du projet\n\nAprès avoir exécuté `create-specra`, voici ce que vous obtenez :\n\n```txt\nmy-docs/\n├── app/                     # Routeur d'application Next.js\n│   ├── layout.tsx           # Mise en page racine avec fournisseurs Specra\n│   ├── page.tsx             # Page d'accueil\n│   └── docs/                # Routes de documentation\n│       └── [...slug]/       # Route dynamique fourre-tout\n│           └── page.tsx     # Moteur de rendu de page doc\n├── docs/                    # Votre contenu de documentation\n│   └── v1.0.0/             # Dossier de version\n│       ├── about.mdx\n│       ├── getting-started.mdx\n│       └── guides/         # Regroupement de dossiers\n│           ├── _category_.json\n│           └── writing.mdx\n├── public/                  # Actifs statiques (images, icônes)\n├── specra.config.json      # Configuration Specra\n├── package.json\n├── next.config.mjs         # Configuration Next.js\n└── tailwind.config.ts      # Configuration Tailwind\n```\n\n\u003cCallout type=\"info\"\u003e\n**Important :** Tous les fichiers de documentation doivent utiliser l'extension `.mdx`, et non `.md`. MDX vous permet d'utiliser des composants React aux côtés de Markdown.\n\u003c/Callout\u003e\n\n## Votre première page de documentation\n\nCréons votre première page de documentation personnalisée.\n\n\u003cSteps\u003e\n  \u003cStep title=\"Créer un nouveau fichier\"\u003e\n    Dans `docs/v1.0.0/`, créez un fichier appelé `hello.mdx` :\n\n```mdx\n---\ntitle: Bonjour Specra\ndescription: Ma première page de documentation\nsidebar_position: 3\n---\n\n# Bonjour Specra !\n\nCeci est ma première page de documentation. Je peux utiliser du **texte en gras**,\ndu *texte en italique*, et même des [liens](https://specra.dev).\n\n## Fonctionnalités que j'aime\n\n- Rechargement à chaud rapide\n- Beaux composants\n- Structure de fichiers simple\n- Zéro configuration requise\n```\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Voir votre page\"\u003e\n    Enregistrez le fichier et visitez [http://localhost:3000/docs/v1.0.0/hello](http://localhost:3000/docs/v1.0.0/hello)\n\n    Vous devriez voir votre nouvelle page dans la barre latérale et rendue magnifiquement dans la zone de contenu principale.\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Ajouter un composant\"\u003e\n    Rendons cela plus intéressant avec un composant Callout :\n\n```mdx\n---\ntitle: Bonjour Specra\ndescription: Ma première page de documentation\nsidebar_position: 3\n---\n\n# Bonjour Specra !\n\nCeci est ma première page de documentation.\n\n\u003cCallout type=\"success\"\u003e\n  Je viens d'ajouter un composant interactif à mon Markdown ! Aucune importation nécessaire.\n\u003c/Callout\u003e\n\n## Prochaines étapes\n\nPrêt à en savoir plus ? Consultez la section [Composants](/docs/v1.0.0/components).\n```\n\n    Enregistrez et regardez-le se mettre à jour instantanément. Remarquez comment vous n'avez pas eu besoin d'importer le composant Callout - il est automatiquement disponible dans tous vos fichiers MDX.\n  \u003c/Step\u003e\n\u003c/Steps\u003e\n\n## Prochaines étapes\n\nVous avez maintenant un site Specra fonctionnel et connaissez les bases de la création de pages. Voici où aller à partir d'ici :\n\n\u003cCardGrid cols={2}\u003e\n  \u003cCard icon=\"settings\" title=\"Configurez votre site\" description=\"Personnalisez la marque, la navigation et les fonctionnalités\" href=\"/docs/v1.0.0/configuration/overview\" /\u003e\n  \u003cCard icon=\"palette\" title=\"Explorez les composants\" description=\"Découvrez tous les composants d'interface utilisateur disponibles\" href=\"/docs/v1.0.0/components\" /\u003e\n  \u003cCard icon=\"rocket\" title=\"Déployez vos docs\" description=\"Expédiez votre documentation en production\" href=\"/docs/v1.0.0/deployment/overview\" /\u003e\n  \u003cCard icon=\"zap\" title=\"Fonctionnalités avancées\" description=\"Versionnage, recherche, docs API, et plus\" href=\"/docs/v1.0.0/features\" /\u003e\n\u003c/CardGrid\u003e\n"])</script><script>self.__next_f.push([1,"2b:T957,"])</script><script>self.__next_f.push([1,"\nCette page montre le composant `\u003cApiReference\u003e` utilisant une véritable API publique ([JSONPlaceholder](https://jsonplaceholder.typicode.com/)).\n\nTous les points de terminaison ci-dessous sont **entièrement fonctionnels** et peuvent être testés à l'aide du playground interactif !\n\n\u003cCallout type=\"info\"\u003e\nCette API est gratuite et ne nécessite aucune authentification. Parfait pour tester !\n\u003c/Callout\u003e\n\n---\n\n\u003cApiReference spec=\"/api-specs/test-api.json\" showPlayground={true} /\u003e\n\n---\n\n## Essayez vous-même\n\n1. **Développez n'importe quel point de terminaison** en cliquant dessus\n2. **Faites défiler jusqu'au playground** au bas de chaque point de terminaison\n3. **Cliquez sur \"Envoyer la requête\"** pour tester l'API en direct\n4. **Voir la réponse** dans le visualiseur JSON\n\n## À propos de JSONPlaceholder\n\n[JSONPlaceholder](https://jsonplaceholder.typicode.com/) est une fausse API REST gratuite pour les tests et le prototypage. C'est parfait pour :\n\n- Tester des outils de documentation API (comme celui-ci !)\n- Développement frontend\n- Apprendre les méthodes HTTP\n- Prototyper des applications\n\n\u003cCallout type=\"success\" title=\"Conseil de pro\"\u003e\nEssayez de modifier le corps de la requête dans les points de terminaison POST/PUT/PATCH et voyez la réponse changer !\n\u003c/Callout\u003e\n\n## Exemple d'intégration\n\nVoici comment vous pourriez utiliser cette API dans une application réelle :\n\n```javascript\n// Récupérer tous les articles\nasync function getPosts() {\n  const response = await fetch('https://jsonplaceholder.typicode.com/posts?_limit=5');\n  const posts = await response.json();\n  return posts;\n}\n\n// Créer un nouvel article\nasync function createPost(title, body) {\n  const response = await fetch('https://jsonplaceholder.typicode.com/posts', {\n    method: 'POST',\n    headers: { 'Content-Type': 'application/json' },\n    body: JSON.stringify({\n      title,\n      body,\n      userId: 1\n    })\n  });\n  return await response.json();\n}\n\n// Utilisation\nconst posts = await getPosts();\nconsole.log(posts);\n\nconst newPost = await createPost('My Title', 'My Content');\nconsole.log(newPost);\n```\n\n## Prochaines étapes\n\n- Consultez l'[exemple de documentation API manuelle](/docs/v1.0.0/api-example)\n- En savoir plus sur la [création de votre propre spécification API](/docs/v1.0.0/api-auto-generated)\n- Lire le [Guide complet de documentation API](/API_DOCUMENTATION.md)\n"])</script><script>self.__next_f.push([1,"2c:T957,"])</script><script>self.__next_f.push([1,"\nCette page montre le composant `\u003cApiReference\u003e` utilisant une véritable API publique ([JSONPlaceholder](https://jsonplaceholder.typicode.com/)).\n\nTous les points de terminaison ci-dessous sont **entièrement fonctionnels** et peuvent être testés à l'aide du playground interactif !\n\n\u003cCallout type=\"info\"\u003e\nCette API est gratuite et ne nécessite aucune authentification. Parfait pour tester !\n\u003c/Callout\u003e\n\n---\n\n\u003cApiReference spec=\"/api-specs/test-api.json\" showPlayground={true} /\u003e\n\n---\n\n## Essayez vous-même\n\n1. **Développez n'importe quel point de terminaison** en cliquant dessus\n2. **Faites défiler jusqu'au playground** au bas de chaque point de terminaison\n3. **Cliquez sur \"Envoyer la requête\"** pour tester l'API en direct\n4. **Voir la réponse** dans le visualiseur JSON\n\n## À propos de JSONPlaceholder\n\n[JSONPlaceholder](https://jsonplaceholder.typicode.com/) est une fausse API REST gratuite pour les tests et le prototypage. C'est parfait pour :\n\n- Tester des outils de documentation API (comme celui-ci !)\n- Développement frontend\n- Apprendre les méthodes HTTP\n- Prototyper des applications\n\n\u003cCallout type=\"success\" title=\"Conseil de pro\"\u003e\nEssayez de modifier le corps de la requête dans les points de terminaison POST/PUT/PATCH et voyez la réponse changer !\n\u003c/Callout\u003e\n\n## Exemple d'intégration\n\nVoici comment vous pourriez utiliser cette API dans une application réelle :\n\n```javascript\n// Récupérer tous les articles\nasync function getPosts() {\n  const response = await fetch('https://jsonplaceholder.typicode.com/posts?_limit=5');\n  const posts = await response.json();\n  return posts;\n}\n\n// Créer un nouvel article\nasync function createPost(title, body) {\n  const response = await fetch('https://jsonplaceholder.typicode.com/posts', {\n    method: 'POST',\n    headers: { 'Content-Type': 'application/json' },\n    body: JSON.stringify({\n      title,\n      body,\n      userId: 1\n    })\n  });\n  return await response.json();\n}\n\n// Utilisation\nconst posts = await getPosts();\nconsole.log(posts);\n\nconst newPost = await createPost('My Title', 'My Content');\nconsole.log(newPost);\n```\n\n## Prochaines étapes\n\n- Consultez l'[exemple de documentation API manuelle](/docs/v1.0.0/api-example)\n- En savoir plus sur la [création de votre propre spécification API](/docs/v1.0.0/api-auto-generated)\n- Lire le [Guide complet de documentation API](/API_DOCUMENTATION.md)\n"])</script><script>self.__next_f.push([1,"2d:T28a2,"])</script><script>self.__next_f.push([1,"\n# Configuration de la navigation\n\nLa section `navigation` contrôle la manière dont les utilisateurs se déplacent dans votre documentation. Configurez la barre latérale, le fil d'Ariane, la table des matières et les groupes d'onglets pour créer une expérience de navigation intuitive.\n\n## Configuration de base\n\nVoici une configuration de navigation minimale :\n\n```json\n{\n  \"navigation\": {\n    \"showSidebar\": true,\n    \"showBreadcrumbs\": true,\n    \"showTableOfContents\": true\n  }\n}\n```\n\nSpecra fournit des valeurs par défaut judicieuses, vous n'avez donc qu'à configurer ce que vous souhaitez modifier.\n\n## Configuration complète\n\n```json\n{\n  \"navigation\": {\n    \"showSidebar\": true,\n    \"collapsibleSidebar\": true,\n    \"showBreadcrumbs\": true,\n    \"showTableOfContents\": true,\n    \"tocPosition\": \"right\",\n    \"tocMaxDepth\": 3,\n    \"tabGroups\": [\n      {\n        \"id\": \"guides\",\n        \"label\": \"Guides\",\n        \"icon\": \"book-open\"\n      },\n      {\n        \"id\": \"api\",\n        \"label\": \"Référence API\",\n        \"icon\": \"zap\"\n      },\n      {\n        \"id\": \"components\",\n        \"label\": \"Composants\",\n        \"icon\": \"layers\"\n      }\n    ]\n  }\n}\n```\n\n## Configuration de la barre latérale\n\n### showSidebar\n\n**Type :** `boolean`\n**Défaut :** `true`\n\nAfficher ou masquer la navigation de la barre latérale.\n\n```json\n{\n  \"navigation\": {\n    \"showSidebar\": true\n  }\n}\n```\n\nDéfinissez à `false` pour masquer complètement la barre latérale. Utile pour les pages de destination ou les sites marketing.\n\n### collapsibleSidebar\n\n**Type :** `boolean`\n**Défaut :** `true`\n\nPermettre aux utilisateurs de réduire et d'agrandir les sections de la barre latérale.\n\n```json\n{\n  \"navigation\": {\n    \"collapsibleSidebar\": true\n  }\n}\n```\n\nLorsque `true`, les sections de dossier ont des flèches pour réduire/agrandir. Lorsque `false`, toutes les sections sont toujours agrandies.\n\n## Fil d'Ariane (Breadcrumbs)\n\n### showBreadcrumbs\n\n**Type :** `boolean`\n**Défaut :** `true`\n\nAfficher la navigation par fil d'Ariane en haut de chaque page.\n\n```json\n{\n  \"navigation\": {\n    \"showBreadcrumbs\": true\n  }\n}\n```\n\nLe fil d'Ariane montre l'emplacement de la page dans la hiérarchie de la documentation :\n\n```\nAccueil \u003e Guides \u003e Démarrage\n```\n\n\u003cCallout type=\"tip\"\u003e\nLe fil d'Ariane aide les utilisateurs à comprendre où ils se trouvent et à revenir aux sections parentes.\n\u003c/Callout\u003e\n\n## Table des matières (Table of Contents)\n\n### showTableOfContents\n\n**Type :** `boolean`\n**Défaut :** `true`\n\nAfficher la table des matières (TOC) sur les pages de documentation.\n\n```json\n{\n  \"navigation\": {\n    \"showTableOfContents\": true\n  }\n}\n```\n\nLa TOC affiche tous les titres de la page actuelle avec des liens pour faire défiler vers chaque section.\n\n### tocPosition\n\n**Type :** `\"left\"` ou `\"right\"`\n**Défaut :** `\"right\"`\n\nPositionnez la table des matières sur le côté gauche ou droit de la page.\n\n```json\n{\n  \"navigation\": {\n    \"tocPosition\": \"right\"\n  }\n}\n```\n\n**Position droite (par défaut) :**\n- La TOC apparaît dans la barre latérale droite\n- Mise en page de documentation traditionnelle\n- Plus d'espace de lecture pour le contenu\n\n**Position gauche :**\n- La TOC apparaît dans la barre latérale gauche sous la navigation principale\n- Mise en page compacte\n- Moins de défilement horizontal sur les petits écrans\n\n### tocMaxDepth\n\n**Type :** `number` (1-6)\n**Défaut :** `3`\n\nNiveau de titre maximum à afficher dans la table des matières.\n\n```json\n{\n  \"navigation\": {\n    \"tocMaxDepth\": 3\n  }\n}\n```\n\n**Options :**\n- `1` - Titres H1 uniquement\n- `2` - Titres H1 et H2\n- `3` - Titres H1, H2 et H3 (recommandé)\n- `4` - Jusqu'à H4\n- `5` - Jusqu'à H5\n- `6` - Tous les titres\n\n\u003cCallout type=\"warning\"\u003e\nSi cette valeur est trop élevée (5 ou 6), la TOC peut sembler encombrée. La plupart des docs fonctionnent mieux avec 2 ou 3.\n\u003c/Callout\u003e\n\n## Groupes d'onglets (Tab Groups)\n\nLes groupes d'onglets organisent votre documentation en sections logiques avec des onglets de navigation séparés.\n\n### Groupes d'onglets basiques\n\n```json\n{\n  \"navigation\": {\n    \"tabGroups\": [\n      {\n        \"id\": \"guides\",\n        \"label\": \"Guides\",\n        \"icon\": \"book-open\"\n      },\n      {\n        \"id\": \"api\",\n        \"label\": \"Référence API\",\n        \"icon\": \"zap\"\n      }\n    ]\n  }\n}\n```\n\n### Propriétés du groupe d'onglets\n\nChaque groupe d'onglets a trois propriétés :\n\n**id** (requis)\n- Identifiant unique pour le groupe d'onglets\n- Utilisé dans le frontmatter de la page : `tab_group: \"guides\"`\n- Minuscule, pas d'espaces\n\n**label** (requis)\n- Nom d'affichage montré dans l'onglet\n- Peut inclure des espaces et des majuscules\n\n**icon** (optionnel)\n- Nom de l'icône Lucide à afficher à côté de l'étiquette\n- Rend les onglets plus visuels et faciles à parcourir\n\n### Assigner des pages aux groupes d'onglets\n\nDans votre frontmatter MDX, spécifiez à quel groupe d'onglets une page appartient :\n\n```mdx\n---\ntitle: Démarrage\ntab_group: guides\n---\n```\n\nLes pages avec la même valeur `tab_group` apparaissent ensemble sous cet onglet.\n\n### Configurations courantes de groupes d'onglets\n\n**Documentation + API :**\n```json\n{\n  \"tabGroups\": [\n    {\n      \"id\": \"docs\",\n      \"label\": \"Documentation\",\n      \"icon\": \"book\"\n    },\n    {\n      \"id\": \"api\",\n      \"label\": \"Référence API\",\n      \"icon\": \"code\"\n    }\n  ]\n}\n```\n\n**Guides + Composants + API :**\n```json\n{\n  \"tabGroups\": [\n    {\n      \"id\": \"guides\",\n      \"label\": \"Guides\",\n      \"icon\": \"book-open\"\n    },\n    {\n      \"id\": \"components\",\n      \"label\": \"Composants\",\n      \"icon\": \"layers\"\n    },\n    {\n      \"id\": \"api\",\n      \"label\": \"API\",\n      \"icon\": \"zap\"\n    }\n  ]\n}\n```\n\n**Documentation multi-produits :**\n```json\n{\n  \"tabGroups\": [\n    {\n      \"id\": \"platform\",\n      \"label\": \"Plateforme\",\n      \"icon\": \"box\"\n    },\n    {\n      \"id\": \"mobile\",\n      \"label\": \"SDK Mobile\",\n      \"icon\": \"smartphone\"\n    },\n    {\n      \"id\": \"web\",\n      \"label\": \"SDK Web\",\n      \"icon\": \"monitor\"\n    }\n  ]\n}\n```\n\n## Icônes disponibles\n\nSpecra utilise les icônes Lucide. Choix populaires pour la documentation :\n\n**Général :**\n- `book` - Livres, documentation\n- `book-open` - Livre ouvert, lecture\n- `file-text` - Documents, pages\n- `layout` - Mise en page, structure\n\n**Technique :**\n- `code` - Code, programmation\n- `zap` - API, rapide, dynamique\n- `terminal` - CLI, ligne de commande\n- `database` - Base de données, données\n\n**UI :**\n- `layers` - Composants, pile\n- `palette` - Design, thèmes\n- `settings` - Configuration\n- `grid` - Grille de mise en page\n\n**Actions :**\n- `rocket` - Lancement, déploiement\n- `wrench` - Outils, utilitaires\n- `shield` - Sécurité\n- `search` - Recherche, trouver\n\nParcourez toutes les icônes sur [lucide.dev](https://lucide.dev/icons/)\n\n## Organisation de la barre latérale\n\n### Génération automatique\n\nSpecra génère automatiquement votre barre latérale à partir de votre structure de fichiers :\n\n```txt\ndocs/v1.0.0/\n├── getting-started.mdx        → Démarrage\n├── installation.mdx           → Installation\n└── guides/                    → Guides (dossier)\n    ├── basics.mdx            →   Bases\n    └── advanced.mdx          →   Avancé\n```\n\n### Contrôler l'ordre\n\nUtilisez `sidebar_position` dans le frontmatter pour contrôler l'ordre des pages :\n\n```mdx\n---\ntitle: Démarrage\nsidebar_position: 1\n---\n```\n\nLes nombres inférieurs apparaissent en premier. Les pages sans position sont triées par ordre alphabétique.\n\n### Configuration de catégorie\n\nPersonnalisez l'apparence des dossiers avec `_category_.json` :\n\n```json\n{\n  \"label\": \"Guides utilisateur\",\n  \"position\": 2,\n  \"collapsible\": true,\n  \"collapsed\": false,\n  \"icon\": \"book-open\"\n}\n```\n\nVoir [Rédaction de contenu](/docs/v1.0.0/writing-content) pour en savoir plus sur l'organisation du contenu.\n\n## Exemples\n\n### Configuration minimale\n\nActivez simplement les bases :\n\n```json\n{\n  \"navigation\": {\n    \"showSidebar\": true,\n    \"showBreadcrumbs\": true,\n    \"showTableOfContents\": true\n  }\n}\n```\n\n### Mise en page épurée\n\nTOC à gauche, titres plus profonds :\n\n```json\n{\n  \"navigation\": {\n    \"showSidebar\": true,\n    \"collapsibleSidebar\": true,\n    \"showBreadcrumbs\": true,\n    \"showTableOfContents\": true,\n    \"tocPosition\": \"left\",\n    \"tocMaxDepth\": 4\n  }\n}\n```\n\n### Documentation multi-sections\n\nAvec des groupes d'onglets pour différents publics :\n\n```json\n{\n  \"navigation\": {\n    \"showSidebar\": true,\n    \"collapsibleSidebar\": true,\n    \"showBreadcrumbs\": true,\n    \"showTableOfContents\": true,\n    \"tocPosition\": \"right\",\n    \"tocMaxDepth\": 3,\n    \"tabGroups\": [\n      {\n        \"id\": \"getting-started\",\n        \"label\": \"Démarrage\",\n        \"icon\": \"rocket\"\n      },\n      {\n        \"id\": \"developers\",\n        \"label\": \"Développeurs\",\n        \"icon\": \"code\"\n      },\n      {\n        \"id\": \"designers\",\n        \"label\": \"Designers\",\n        \"icon\": \"palette\"\n      }\n    ]\n  }\n}\n```\n\n## Meilleures pratiques\n\n**Utiliser les groupes d'onglets judicieusement** - N'en créez pas trop. 3-5 onglets maximum fonctionnent le mieux.\n\n**Choisir des étiquettes descriptives** - Rendez évident ce qui se trouve dans chaque onglet ou section.\n\n**Choisir des icônes appropriées** - Les icônes doivent renforcer l'objectif de l'onglet.\n\n**Définir tocMaxDepth de manière appropriée** - La plupart des docs fonctionnent le mieux avec 2 ou 3 niveaux.\n\n**Garder la barre latérale réductible** - Permettez aux utilisateurs de masquer les sections dont ils n'ont pas besoin.\n\n**Afficher le fil d'Ariane** - Il aide les utilisateurs à naviguer dans une documentation complexe.\n\n## Prochaines étapes\n\n\u003cCardGrid cols={2}\u003e\n  \u003cCard\n    icon=\"globe\"\n    title=\"Configuration du site\"\n    description=\"Configurer les métadonnées et la marque du site\"\n    href=\"/docs/v1.0.0/configuration/site-config\"\n  /\u003e\n  \u003cCard\n    icon=\"rocket\"\n    title=\"Config de déploiement\"\n    description=\"Configurer les paramètres de déploiement\"\n    href=\"/docs/v1.0.0/configuration/deployment-config\"\n  /\u003e\n  \u003cCard\n    icon=\"sliders\"\n    title=\"Configuration avancée\"\n    description=\"Analytique, recherche, fonctionnalités et plus\"\n    href=\"/docs/v1.0.0/configuration/advanced\"\n  /\u003e\n  \u003cCard\n    icon=\"arrow-left\"\n    title=\"Aperçu de la configuration\"\n    description=\"Retour à l'aperçu de la configuration\"\n    href=\"/docs/v1.0.0/configuration/overview\"\n  /\u003e\n\u003c/CardGrid\u003e\n"])</script><script>self.__next_f.push([1,"2e:T28a2,"])</script><script>self.__next_f.push([1,"\n# Configuration de la navigation\n\nLa section `navigation` contrôle la manière dont les utilisateurs se déplacent dans votre documentation. Configurez la barre latérale, le fil d'Ariane, la table des matières et les groupes d'onglets pour créer une expérience de navigation intuitive.\n\n## Configuration de base\n\nVoici une configuration de navigation minimale :\n\n```json\n{\n  \"navigation\": {\n    \"showSidebar\": true,\n    \"showBreadcrumbs\": true,\n    \"showTableOfContents\": true\n  }\n}\n```\n\nSpecra fournit des valeurs par défaut judicieuses, vous n'avez donc qu'à configurer ce que vous souhaitez modifier.\n\n## Configuration complète\n\n```json\n{\n  \"navigation\": {\n    \"showSidebar\": true,\n    \"collapsibleSidebar\": true,\n    \"showBreadcrumbs\": true,\n    \"showTableOfContents\": true,\n    \"tocPosition\": \"right\",\n    \"tocMaxDepth\": 3,\n    \"tabGroups\": [\n      {\n        \"id\": \"guides\",\n        \"label\": \"Guides\",\n        \"icon\": \"book-open\"\n      },\n      {\n        \"id\": \"api\",\n        \"label\": \"Référence API\",\n        \"icon\": \"zap\"\n      },\n      {\n        \"id\": \"components\",\n        \"label\": \"Composants\",\n        \"icon\": \"layers\"\n      }\n    ]\n  }\n}\n```\n\n## Configuration de la barre latérale\n\n### showSidebar\n\n**Type :** `boolean`\n**Défaut :** `true`\n\nAfficher ou masquer la navigation de la barre latérale.\n\n```json\n{\n  \"navigation\": {\n    \"showSidebar\": true\n  }\n}\n```\n\nDéfinissez à `false` pour masquer complètement la barre latérale. Utile pour les pages de destination ou les sites marketing.\n\n### collapsibleSidebar\n\n**Type :** `boolean`\n**Défaut :** `true`\n\nPermettre aux utilisateurs de réduire et d'agrandir les sections de la barre latérale.\n\n```json\n{\n  \"navigation\": {\n    \"collapsibleSidebar\": true\n  }\n}\n```\n\nLorsque `true`, les sections de dossier ont des flèches pour réduire/agrandir. Lorsque `false`, toutes les sections sont toujours agrandies.\n\n## Fil d'Ariane (Breadcrumbs)\n\n### showBreadcrumbs\n\n**Type :** `boolean`\n**Défaut :** `true`\n\nAfficher la navigation par fil d'Ariane en haut de chaque page.\n\n```json\n{\n  \"navigation\": {\n    \"showBreadcrumbs\": true\n  }\n}\n```\n\nLe fil d'Ariane montre l'emplacement de la page dans la hiérarchie de la documentation :\n\n```\nAccueil \u003e Guides \u003e Démarrage\n```\n\n\u003cCallout type=\"tip\"\u003e\nLe fil d'Ariane aide les utilisateurs à comprendre où ils se trouvent et à revenir aux sections parentes.\n\u003c/Callout\u003e\n\n## Table des matières (Table of Contents)\n\n### showTableOfContents\n\n**Type :** `boolean`\n**Défaut :** `true`\n\nAfficher la table des matières (TOC) sur les pages de documentation.\n\n```json\n{\n  \"navigation\": {\n    \"showTableOfContents\": true\n  }\n}\n```\n\nLa TOC affiche tous les titres de la page actuelle avec des liens pour faire défiler vers chaque section.\n\n### tocPosition\n\n**Type :** `\"left\"` ou `\"right\"`\n**Défaut :** `\"right\"`\n\nPositionnez la table des matières sur le côté gauche ou droit de la page.\n\n```json\n{\n  \"navigation\": {\n    \"tocPosition\": \"right\"\n  }\n}\n```\n\n**Position droite (par défaut) :**\n- La TOC apparaît dans la barre latérale droite\n- Mise en page de documentation traditionnelle\n- Plus d'espace de lecture pour le contenu\n\n**Position gauche :**\n- La TOC apparaît dans la barre latérale gauche sous la navigation principale\n- Mise en page compacte\n- Moins de défilement horizontal sur les petits écrans\n\n### tocMaxDepth\n\n**Type :** `number` (1-6)\n**Défaut :** `3`\n\nNiveau de titre maximum à afficher dans la table des matières.\n\n```json\n{\n  \"navigation\": {\n    \"tocMaxDepth\": 3\n  }\n}\n```\n\n**Options :**\n- `1` - Titres H1 uniquement\n- `2` - Titres H1 et H2\n- `3` - Titres H1, H2 et H3 (recommandé)\n- `4` - Jusqu'à H4\n- `5` - Jusqu'à H5\n- `6` - Tous les titres\n\n\u003cCallout type=\"warning\"\u003e\nSi cette valeur est trop élevée (5 ou 6), la TOC peut sembler encombrée. La plupart des docs fonctionnent mieux avec 2 ou 3.\n\u003c/Callout\u003e\n\n## Groupes d'onglets (Tab Groups)\n\nLes groupes d'onglets organisent votre documentation en sections logiques avec des onglets de navigation séparés.\n\n### Groupes d'onglets basiques\n\n```json\n{\n  \"navigation\": {\n    \"tabGroups\": [\n      {\n        \"id\": \"guides\",\n        \"label\": \"Guides\",\n        \"icon\": \"book-open\"\n      },\n      {\n        \"id\": \"api\",\n        \"label\": \"Référence API\",\n        \"icon\": \"zap\"\n      }\n    ]\n  }\n}\n```\n\n### Propriétés du groupe d'onglets\n\nChaque groupe d'onglets a trois propriétés :\n\n**id** (requis)\n- Identifiant unique pour le groupe d'onglets\n- Utilisé dans le frontmatter de la page : `tab_group: \"guides\"`\n- Minuscule, pas d'espaces\n\n**label** (requis)\n- Nom d'affichage montré dans l'onglet\n- Peut inclure des espaces et des majuscules\n\n**icon** (optionnel)\n- Nom de l'icône Lucide à afficher à côté de l'étiquette\n- Rend les onglets plus visuels et faciles à parcourir\n\n### Assigner des pages aux groupes d'onglets\n\nDans votre frontmatter MDX, spécifiez à quel groupe d'onglets une page appartient :\n\n```mdx\n---\ntitle: Démarrage\ntab_group: guides\n---\n```\n\nLes pages avec la même valeur `tab_group` apparaissent ensemble sous cet onglet.\n\n### Configurations courantes de groupes d'onglets\n\n**Documentation + API :**\n```json\n{\n  \"tabGroups\": [\n    {\n      \"id\": \"docs\",\n      \"label\": \"Documentation\",\n      \"icon\": \"book\"\n    },\n    {\n      \"id\": \"api\",\n      \"label\": \"Référence API\",\n      \"icon\": \"code\"\n    }\n  ]\n}\n```\n\n**Guides + Composants + API :**\n```json\n{\n  \"tabGroups\": [\n    {\n      \"id\": \"guides\",\n      \"label\": \"Guides\",\n      \"icon\": \"book-open\"\n    },\n    {\n      \"id\": \"components\",\n      \"label\": \"Composants\",\n      \"icon\": \"layers\"\n    },\n    {\n      \"id\": \"api\",\n      \"label\": \"API\",\n      \"icon\": \"zap\"\n    }\n  ]\n}\n```\n\n**Documentation multi-produits :**\n```json\n{\n  \"tabGroups\": [\n    {\n      \"id\": \"platform\",\n      \"label\": \"Plateforme\",\n      \"icon\": \"box\"\n    },\n    {\n      \"id\": \"mobile\",\n      \"label\": \"SDK Mobile\",\n      \"icon\": \"smartphone\"\n    },\n    {\n      \"id\": \"web\",\n      \"label\": \"SDK Web\",\n      \"icon\": \"monitor\"\n    }\n  ]\n}\n```\n\n## Icônes disponibles\n\nSpecra utilise les icônes Lucide. Choix populaires pour la documentation :\n\n**Général :**\n- `book` - Livres, documentation\n- `book-open` - Livre ouvert, lecture\n- `file-text` - Documents, pages\n- `layout` - Mise en page, structure\n\n**Technique :**\n- `code` - Code, programmation\n- `zap` - API, rapide, dynamique\n- `terminal` - CLI, ligne de commande\n- `database` - Base de données, données\n\n**UI :**\n- `layers` - Composants, pile\n- `palette` - Design, thèmes\n- `settings` - Configuration\n- `grid` - Grille de mise en page\n\n**Actions :**\n- `rocket` - Lancement, déploiement\n- `wrench` - Outils, utilitaires\n- `shield` - Sécurité\n- `search` - Recherche, trouver\n\nParcourez toutes les icônes sur [lucide.dev](https://lucide.dev/icons/)\n\n## Organisation de la barre latérale\n\n### Génération automatique\n\nSpecra génère automatiquement votre barre latérale à partir de votre structure de fichiers :\n\n```txt\ndocs/v1.0.0/\n├── getting-started.mdx        → Démarrage\n├── installation.mdx           → Installation\n└── guides/                    → Guides (dossier)\n    ├── basics.mdx            →   Bases\n    └── advanced.mdx          →   Avancé\n```\n\n### Contrôler l'ordre\n\nUtilisez `sidebar_position` dans le frontmatter pour contrôler l'ordre des pages :\n\n```mdx\n---\ntitle: Démarrage\nsidebar_position: 1\n---\n```\n\nLes nombres inférieurs apparaissent en premier. Les pages sans position sont triées par ordre alphabétique.\n\n### Configuration de catégorie\n\nPersonnalisez l'apparence des dossiers avec `_category_.json` :\n\n```json\n{\n  \"label\": \"Guides utilisateur\",\n  \"position\": 2,\n  \"collapsible\": true,\n  \"collapsed\": false,\n  \"icon\": \"book-open\"\n}\n```\n\nVoir [Rédaction de contenu](/docs/v1.0.0/writing-content) pour en savoir plus sur l'organisation du contenu.\n\n## Exemples\n\n### Configuration minimale\n\nActivez simplement les bases :\n\n```json\n{\n  \"navigation\": {\n    \"showSidebar\": true,\n    \"showBreadcrumbs\": true,\n    \"showTableOfContents\": true\n  }\n}\n```\n\n### Mise en page épurée\n\nTOC à gauche, titres plus profonds :\n\n```json\n{\n  \"navigation\": {\n    \"showSidebar\": true,\n    \"collapsibleSidebar\": true,\n    \"showBreadcrumbs\": true,\n    \"showTableOfContents\": true,\n    \"tocPosition\": \"left\",\n    \"tocMaxDepth\": 4\n  }\n}\n```\n\n### Documentation multi-sections\n\nAvec des groupes d'onglets pour différents publics :\n\n```json\n{\n  \"navigation\": {\n    \"showSidebar\": true,\n    \"collapsibleSidebar\": true,\n    \"showBreadcrumbs\": true,\n    \"showTableOfContents\": true,\n    \"tocPosition\": \"right\",\n    \"tocMaxDepth\": 3,\n    \"tabGroups\": [\n      {\n        \"id\": \"getting-started\",\n        \"label\": \"Démarrage\",\n        \"icon\": \"rocket\"\n      },\n      {\n        \"id\": \"developers\",\n        \"label\": \"Développeurs\",\n        \"icon\": \"code\"\n      },\n      {\n        \"id\": \"designers\",\n        \"label\": \"Designers\",\n        \"icon\": \"palette\"\n      }\n    ]\n  }\n}\n```\n\n## Meilleures pratiques\n\n**Utiliser les groupes d'onglets judicieusement** - N'en créez pas trop. 3-5 onglets maximum fonctionnent le mieux.\n\n**Choisir des étiquettes descriptives** - Rendez évident ce qui se trouve dans chaque onglet ou section.\n\n**Choisir des icônes appropriées** - Les icônes doivent renforcer l'objectif de l'onglet.\n\n**Définir tocMaxDepth de manière appropriée** - La plupart des docs fonctionnent le mieux avec 2 ou 3 niveaux.\n\n**Garder la barre latérale réductible** - Permettez aux utilisateurs de masquer les sections dont ils n'ont pas besoin.\n\n**Afficher le fil d'Ariane** - Il aide les utilisateurs à naviguer dans une documentation complexe.\n\n## Prochaines étapes\n\n\u003cCardGrid cols={2}\u003e\n  \u003cCard\n    icon=\"globe\"\n    title=\"Configuration du site\"\n    description=\"Configurer les métadonnées et la marque du site\"\n    href=\"/docs/v1.0.0/configuration/site-config\"\n  /\u003e\n  \u003cCard\n    icon=\"rocket\"\n    title=\"Config de déploiement\"\n    description=\"Configurer les paramètres de déploiement\"\n    href=\"/docs/v1.0.0/configuration/deployment-config\"\n  /\u003e\n  \u003cCard\n    icon=\"sliders\"\n    title=\"Configuration avancée\"\n    description=\"Analytique, recherche, fonctionnalités et plus\"\n    href=\"/docs/v1.0.0/configuration/advanced\"\n  /\u003e\n  \u003cCard\n    icon=\"arrow-left\"\n    title=\"Aperçu de la configuration\"\n    description=\"Retour à l'aperçu de la configuration\"\n    href=\"/docs/v1.0.0/configuration/overview\"\n  /\u003e\n\u003c/CardGrid\u003e\n"])</script><script>self.__next_f.push([1,"2f:T2a6a,"])</script><script>self.__next_f.push([1,"\n# Déployer sur GitHub Pages\n\nGitHub Pages offre un hébergement gratuit pour les sites statiques, ce qui le rend parfait pour la documentation open source. Déployez directement depuis votre dépôt avec GitHub Actions.\n\n## Pourquoi GitHub Pages ?\n\n- **Hébergement gratuit** - Aucun coût pour les dépôts publics\n- **Domaines personnalisés** - Utilisez votre propre domaine\n- **HTTPS inclus** - Certificats SSL automatiques\n- **Basé sur Git** - Déployez depuis votre dépôt\n- **Contrôle de version** - Historique complet de vos docs\n- **Confiance de la communauté** - Plateforme familière pour les développeurs\n\n## Prérequis\n\n- Dépôt GitHub (public ou privé)\n- Projet de documentation Specra\n- Git installé localement\n\n## Configuration\n\nD'abord, configurez Specra pour l'export statique.\n\n### Sans domaine personnalisé\n\nPour les URL comme `username.github.io/repo-name` :\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"github-pages\",\n    \"basePath\": \"repo-name\",\n    \"customDomain\": false\n  }\n}\n```\n\n\u003cCallout type=\"warning\" title=\"Important\"\u003e\nLe `basePath` doit correspondre exactement au nom de votre dépôt. GitHub Pages sert depuis `username.github.io/repo-name`, donc toutes les ressources ont besoin de ce préfixe.\n\u003c/Callout\u003e\n\n### Avec domaine personnalisé\n\nPour les domaines personnalisés comme `docs.example.com` :\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"custom-domain-static\",\n    \"basePath\": \"\",\n    \"customDomain\": true\n  }\n}\n```\n\nCréez également `public/CNAME` avec votre domaine :\n\n```txt\ndocs.example.com\n```\n\n## Méthodes de déploiement\n\nChoisissez votre méthode de déploiement préférée :\n\n### Méthode 1 : GitHub Actions (Recommandé)\n\nDéploiement automatique à chaque push sur main.\n\n\u003cSteps\u003e\n  \u003cStep title=\"Créer le fichier de workflow\"\u003e\n    Créez `.github/workflows/deploy.yml` :\n\n```yaml\nname: Deploy to GitHub Pages\n\non:\n  push:\n    branches: [main]\n\npermissions:\n  contents: read\n  pages: write\n  id-token: write\n\nconcurrency:\n  group: \"pages\"\n  cancel-in-progress: false\n\njobs:\n  build:\n    runs-on: ubuntu-latest\n    steps:\n      - name: Checkout\n        uses: actions/checkout@v4\n\n      - name: Setup Node\n        uses: actions/setup-node@v4\n        with:\n          node-version: '20'\n          cache: 'npm'\n\n      - name: Install dependencies\n        run: npm ci\n\n      - name: Build site\n        run: npm run build:export\n        env:\n          NODE_ENV: production\n\n      - name: Upload artifact\n        uses: actions/upload-pages-artifact@v3\n        with:\n          path: ./out\n\n  deploy:\n    needs: build\n    runs-on: ubuntu-latest\n    environment:\n      name: github-pages\n      url: ${{ steps.deployment.outputs.page_url }}\n    steps:\n      - name: Deploy to GitHub Pages\n        id: deployment\n        uses: actions/deploy-pages@v4\n```\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Activer GitHub Pages\"\u003e\n    1. Allez dans les paramètres du dépôt → Pages\n    2. Source : **GitHub Actions**\n    3. Enregistrer\n\n    Pas besoin de sélectionner une branche - le workflow gère le déploiement.\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Pousser et déployer\"\u003e\n```bash\ngit add .\ngit commit -m \"Add GitHub Pages deployment\"\ngit push\n```\n\nVotre site se déploie automatiquement ! Vérifiez l'onglet Actions pour la progression.\n  \u003c/Step\u003e\n\u003c/Steps\u003e\n\n### Méthode 2 : Déploiement manuel\n\nDéployez manuellement en utilisant le paquet `gh-pages`.\n\n\u003cSteps\u003e\n  \u003cStep title=\"Installer gh-pages\"\u003e\n```bash\nnpm install --save-dev gh-pages\n```\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Ajouter le script de déploiement\"\u003e\n    Mettez à jour `package.json` :\n\n```json\n{\n  \"scripts\": {\n    \"deploy\": \"npm run build:export \u0026\u0026 gh-pages -d out\"\n  }\n}\n```\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Déployer\"\u003e\n```bash\nnpm run deploy\n```\n\nCela construit votre site et pousse le dossier `out` vers la branche `gh-pages`.\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Activer GitHub Pages\"\u003e\n    1. Allez dans les paramètres → Pages\n    2. Source : Deploy from a branch\n    3. Branche : `gh-pages` / `/ (root)`\n    4. Enregistrer\n  \u003c/Step\u003e\n\u003c/Steps\u003e\n\n## Configuration de domaine personnalisé\n\nUtilisez votre propre domaine avec GitHub Pages :\n\n\u003cSteps\u003e\n  \u003cStep title=\"Ajouter le fichier CNAME\"\u003e\n    Créez `public/CNAME` :\n\n```\ndocs.example.com\n```\n\nMise à jour de la config :\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"custom-domain-static\",\n    \"customDomain\": true,\n    \"basePath\": \"\"\n  }\n}\n```\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Configurer le DNS\"\u003e\n    Ajoutez des enregistrements DNS chez votre fournisseur de domaine :\n\n**Pour sous-domaine (docs.example.com) :**\n```\nType: CNAME\nNom: docs\nValeur: username.github.io\n```\n\n**Pour domaine apex (example.com) :**\n```\nType: A\nNom: @\nValeur: 185.199.108.153\nValeur: 185.199.109.153\nValeur: 185.199.110.153\nValeur: 185.199.111.153\n```\n\n\u003cCallout type=\"tip\"\u003e\nUtilisez un sous-domaine comme `docs.example.com` - c'est plus simple que la configuration de domaine apex.\n\u003c/Callout\u003e\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Activer HTTPS\"\u003e\n    Après la propagation DNS (peut prendre jusqu'à 24 heures) :\n\n1. Allez dans Paramètres → Pages\n2. Cochez \"Enforce HTTPS\"\n3. GitHub provisionne automatiquement un certificat SSL\n  \u003c/Step\u003e\n\u003c/Steps\u003e\n\n## GitHub Actions avancées\n\n### Avec indexation de recherche\n\nIndexez vos docs dans MeiliSearch pendant le déploiement :\n\n```yaml\njobs:\n  build:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n\n      - name: Setup Node\n        uses: actions/setup-node@v4\n        with:\n          node-version: '20'\n          cache: 'npm'\n\n      - name: Install dependencies\n        run: npm ci\n\n      - name: Build site\n        run: npm run build:export\n\n      - name: Index search\n        run: npm run index:search\n        env:\n          MEILISEARCH_HOST: ${{ secrets.MEILISEARCH_HOST }}\n          MEILISEARCH_API_KEY: ${{ secrets.MEILISEARCH_MASTER_KEY }}\n\n      - name: Upload artifact\n        uses: actions/upload-pages-artifact@v3\n        with:\n          path: ./out\n```\n\nAjoutez des secrets dans Paramètres → Secrets and variables → Actions.\n\n### Déployer sur Tag\n\nDéployez uniquement lorsque vous créez un tag de version :\n\n```yaml\non:\n  push:\n    tags:\n      - 'v*'\n```\n\nCréez et poussez un tag pour déployer :\n\n```bash\ngit tag v1.0.0\ngit push origin v1.0.0\n```\n\n### Environnements multiples\n\nDéployez différentes branches sur différents sites GitHub Pages :\n\n```yaml\non:\n  push:\n    branches:\n      - main\n      - staging\n\njobs:\n  build:\n    runs-on: ubuntu-latest\n    steps:\n      # ... étapes de build ...\n\n      - name: Deploy to production\n        if: github.ref == 'refs/heads/main'\n        uses: actions/deploy-pages@v4\n\n      - name: Deploy to staging\n        if: github.ref == 'refs/heads/staging'\n        # Déployer sur un autre repo ou branche\n```\n\n## Dépannage\n\n### Erreurs 404 sur les routes\n\nLes exports statiques ne prennent pas en charge le routage dynamique de la même manière. Assurez-vous que toutes les routes sont pré-rendues.\n\n**Solution :** Ajoutez un 404.html qui redirige vers l'index :\n\n```html\n\u003c!DOCTYPE html\u003e\n\u003chtml\u003e\n  \u003chead\u003e\n    \u003cmeta http-equiv=\"refresh\" content=\"0;url=/\" /\u003e\n  \u003c/head\u003e\n  \u003cbody\u003e\n    Redirection...\n  \u003c/body\u003e\n\u003c/html\u003e\n```\n\n### Les ressources ne chargent pas\n\nVérifiez votre configuration `basePath` :\n\n```bash\n# Voir votre site\nopen https://username.github.io/repo-name\n\n# Vérifier si les ressources se chargent depuis\nhttps://username.github.io/repo-name/_next/...\n```\n\nSi les ressources renvoient 404, vérifiez :\n- `basePath` dans la config correspond exactement au nom du repo\n- Vous utilisez `npm run build:export` et non `npm run build`\n\n### Le domaine personnalisé ne fonctionne pas\n\n**Vérifier la propagation DNS :**\n```bash\ndig docs.example.com\n# Devrait montrer CNAME vers username.github.io\n```\n\n**Vérifier le fichier CNAME :**\n- Doit être dans le dossier `public/`\n- Contient uniquement votre domaine, pas de protocole\n- Pas de barre oblique finale\n\n**Problèmes courants :**\n- DNS pas encore propagé (attendez jusqu'à 24 heures)\n- Fichier CNAME manquant ou incorrect\n- Échec de la vérification du domaine dans les paramètres GitHub\n\n### Échec du build dans Actions\n\n**Voir les journaux :**\n1. Allez dans l'onglet Actions\n2. Cliquez sur le workflow échoué\n3. Développez l'étape de build pour voir les erreurs\n\n**Corrections courantes :**\n- Augmenter la version de Node dans le workflow\n- Vider le cache npm : `npm ci --cache .npm`\n- Vérifier les dépendances manquantes\n\n## Conseils de performance\n\n### Activer la mise en cache\n\nMettez en cache node_modules pour des builds plus rapides :\n\n```yaml\n- name: Setup Node\n  uses: actions/setup-node@v4\n  with:\n    node-version: '20'\n    cache: 'npm'\n```\n\n### Optimiser les images\n\nPré-optimisez les images avant de commiter :\n\n```bash\nnpm install -D imagemin-cli\n\n# Optimiser toutes les images\nnpx imagemin public/images/* --out-dir=public/images\n```\n\n### Réduire la taille du bundle\n\nVérifiez ce qui est dans votre bundle :\n\n```bash\nnpm install -D @next/bundle-analyzer\n\nANALYZE=true npm run build:export\n```\n\n## Limites\n\nGitHub Pages a quelques limites :\n\n- **Taille du dépôt :** 1 Go recommandé\n- **Taille du site :** 1 Go site publié\n- **Bande passante :** 100 Go/mois limite douce\n- **Builds :** 10 par heure\n\nCes limites sont généreuses pour les sites de documentation.\n\n## Migration depuis d'autres plateformes\n\n### Depuis Vercel\n\n1. Mettez à jour la section `deployment` de `specra.config.json`\n2. Exécutez `npm run build:export` localement pour tester\n3. Configurez le workflow GitHub Actions\n4. Poussez pour déclencher le déploiement\n\n### Depuis Netlify\n\nMême processus que Vercel. La sortie statique fonctionne sur les deux plateformes.\n\n## Meilleures pratiques\n\n**Utiliser GitHub Actions** - Déploiement automatique à chaque push\n\n**Versionner vos docs** - Utilisez des tags git pour les versions de documentation\n\n**Tester localement** - Exécutez `npm run build:export \u0026\u0026 npx serve out` avant de pousser\n\n**Surveiller les builds** - Configurez des notifications pour les déploiements échoués\n\n**Utiliser un domaine personnalisé** - Apparence professionnelle et URL stables\n\n**Activer HTTPS** - Toujours appliquer HTTPS pour la sécurité\n\n## Prochaines étapes\n\n\u003cCardGrid cols={2}\u003e\n  \u003cCard\n    icon=\"triangle\"\n    title=\"Vercel\"\n    description=\"Déployer sur Vercel pour des fonctionnalités dynamiques\"\n    href=\"/docs/v1.0.0/deployment/vercel\"\n  /\u003e\n  \u003cCard\n    icon=\"globe\"\n    title=\"Netlify\"\n    description=\"Hébergement statique alternatif\"\n    href=\"/docs/v1.0.0/deployment/netlify\"\n  /\u003e\n  \u003cCard\n    icon=\"arrow-left\"\n    title=\"Aperçu du déploiement\"\n    description=\"Voir toutes les options de déploiement\"\n    href=\"/docs/v1.0.0/deployment/overview\"\n  /\u003e\n  \u003cCard\n    icon=\"settings\"\n    title=\"Configuration\"\n    description=\"Configurer les paramètres de déploiement\"\n    href=\"/docs/v1.0.0/configuration/overview\"\n  /\u003e\n\u003c/CardGrid\u003e\n"])</script><script>self.__next_f.push([1,"30:T2a6a,"])</script><script>self.__next_f.push([1,"\n# Déployer sur GitHub Pages\n\nGitHub Pages offre un hébergement gratuit pour les sites statiques, ce qui le rend parfait pour la documentation open source. Déployez directement depuis votre dépôt avec GitHub Actions.\n\n## Pourquoi GitHub Pages ?\n\n- **Hébergement gratuit** - Aucun coût pour les dépôts publics\n- **Domaines personnalisés** - Utilisez votre propre domaine\n- **HTTPS inclus** - Certificats SSL automatiques\n- **Basé sur Git** - Déployez depuis votre dépôt\n- **Contrôle de version** - Historique complet de vos docs\n- **Confiance de la communauté** - Plateforme familière pour les développeurs\n\n## Prérequis\n\n- Dépôt GitHub (public ou privé)\n- Projet de documentation Specra\n- Git installé localement\n\n## Configuration\n\nD'abord, configurez Specra pour l'export statique.\n\n### Sans domaine personnalisé\n\nPour les URL comme `username.github.io/repo-name` :\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"github-pages\",\n    \"basePath\": \"repo-name\",\n    \"customDomain\": false\n  }\n}\n```\n\n\u003cCallout type=\"warning\" title=\"Important\"\u003e\nLe `basePath` doit correspondre exactement au nom de votre dépôt. GitHub Pages sert depuis `username.github.io/repo-name`, donc toutes les ressources ont besoin de ce préfixe.\n\u003c/Callout\u003e\n\n### Avec domaine personnalisé\n\nPour les domaines personnalisés comme `docs.example.com` :\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"custom-domain-static\",\n    \"basePath\": \"\",\n    \"customDomain\": true\n  }\n}\n```\n\nCréez également `public/CNAME` avec votre domaine :\n\n```txt\ndocs.example.com\n```\n\n## Méthodes de déploiement\n\nChoisissez votre méthode de déploiement préférée :\n\n### Méthode 1 : GitHub Actions (Recommandé)\n\nDéploiement automatique à chaque push sur
