``json\n{\n  \"banner\": {\n    \"enabled\": true,\n    \"message\": \"⚠️ Maintenance planifiée dimanche à 2h UTC\",\n    \"type\": \"warning\",\n    \"dismissible\": true\n  }\n}\n```\n\n**Propriétés :**\n\n| Propriété | Type | Description |\n|-----------|------|-------------|\n| `enabled` | boolean | Afficher ou masquer la bannière |\n| `message` | string | Texte de la bannière (prend en charge les émojis et le HTML) |\n| `type` | string | Style : `info`, `warning`, `success`, `error` |\n| `dismissible` | boolean | Permettre aux utilisateurs de fermer la bannière |\n\n### Types de bannières\n\n**Info (bleu) :**\n```json\n{\n  \"banner\": {\n    \"message\": \"📢 Nouvelle fonctionnalité : Le mode sombre est là !\",\n    \"type\": \"info\"\n  }\n}\n```\n\n**Avertissement (jaune) :**\n```json\n{\n  \"banner\": {\n    \"message\": \"⚠️ L'API v1 sera obsolète le 1er janv. 2025\",\n    \"type\": \"warning\"\n  }\n}\n```\n\n**Succès (vert) :**\n```json\n{\n  \"banner\": {\n    \"message\": \"✅ Tous les systèmes opérationnels\",\n    \"type\": \"success\"\n  }\n}\n```\n\n**Erreur (rouge) :**\n```json\n{\n  \"banner\": {\n    \"message\": \"🚨 Mise à jour de sécurité critique disponible\",\n    \"type\": \"error\"\n  }\n}\n```\n\n## Configuration des fonctionnalités\n\nActivez ou désactivez diverses fonctionnalités de documentation.\n\n```json\n{\n  \"features\": {\n    \"editUrl\": \"https://github.com/username/repo/edit/main/docs\",\n    \"showLastUpdated\": true,\n    \"showReadingTime\": true,\n    \"showAuthors\": false,\n    \"showTags\": true,\n    \"versioning\": true,\n    \"i18n\": false\n  }\n}\n```\n\n### Options de fonctionnalité\n\n**editUrl**\n- Lien pour modifier la source de la page\n- Apparaît en bas de chaque page\n- Utilisez GitHub, GitLab ou toute URL d'hébergement Git\n- Définissez à `false` pour désactiver\n\n**showLastUpdated**\n- Afficher quand la page a été modifiée pour la dernière fois\n- Utilise les horodatages de commit git\n- Apparaît en bas de la page\n\n**showReadingTime**\n- Estimer le temps de lecture (mots par minute)\n- Affiche \"5 min de lecture\" en haut de la page\n\n**showAuthors**\n- Afficher les auteurs de la page\n- Nécessite des informations sur l'auteur dans le frontmatter\n\n**showTags**\n- Afficher les étiquettes sur les pages\n- Nécessite des étiquettes dans le frontmatter\n\n**versioning**\n- Activer la gestion des versions de la documentation\n- Prend en charge plusieurs versions de doc (v1.0.0, v2.0.0)\n\n**i18n**\n- Activer l'internationalisation\n- Prend en charge plusieurs langues\n\n## Liens sociaux (Social Links)\n\nAjoutez des liens de réseaux sociaux à votre en-tête.\n\n```json\n{\n  \"social\": {\n    \"github\": \"https://github.com/username/repo\",\n    \"twitter\": \"https://twitter.com/username\",\n    \"discord\": \"https://discord.gg/invite\",\n    \"linkedin\": \"https://linkedin.com/company/name\",\n    \"youtube\": \"https://youtube.com/@channel\"\n  }\n}\n```\n\n### Liens sociaux personnalisés\n\nAjoutez des liens vers des plateformes non intégrées :\n\n```json\n{\n  \"social\": {\n    \"github\": \"https://github.com/username\",\n    \"custom\": [\n      {\n        \"label\": \"Slack\",\n        \"url\": \"https://slack.com/invite\",\n        \"icon\": \"slack\"\n      },\n      {\n        \"label\": \"Site web\",\n        \"url\": \"https://example.com\",\n        \"icon\": \"globe\"\n      }\n    ]\n  }\n}\n```\n\n## Variables d'environnement\n\nUtilisez des variables d'environnement dans votre configuration et le contenu MDX.\n\n### Dans la configuration\n\n```json\n{\n  \"env\": {\n    \"API_BASE_URL\": \"https://api.example.com\",\n    \"API_VERSION\": \"v1\",\n    \"CDN_URL\": \"https://cdn.example.com\",\n    \"SUPPORT_EMAIL\": \"support@example.com\"\n  }\n}\n```\n\nAccès dans MDX :\n\n```mdx\nPoint de terminaison API : {process.env.API_BASE_URL}\nVersion actuelle : {process.env.API_VERSION}\n```\n\n### Depuis les fichiers .env\n\nDéfinir les valeurs via des fichiers d'environnement :\n\n```bash\n# .env.local\nAPI_BASE_URL=https://api.example.com\nMEILISEARCH_HOST=https://search.example.com\nMEILISEARCH_API_KEY=your-key\n```\n\nRéférence dans la configuration :\n\n```json\n{\n  \"env\": {\n    \"API_BASE_URL\": \"${API_BASE_URL}\"\n  },\n  \"search\": {\n    \"meilisearch\": {\n      \"host\": \"${MEILISEARCH_HOST}\",\n      \"apiKey\": \"${MEILISEARCH_API_KEY}\"\n    }\n  }\n}\n```\n\n\u003cCallout type=\"warning\"\u003e\nNe commitez jamais de clés sensibles dans le contrôle de version. Utilisez des variables d'environnement et ajoutez `.env.local` à `.gitignore`.\n\u003c/Callout\u003e\n\n### Variables publiques vs privées\n\n**Privé (serveur uniquement) :**\n```\nMEILISEARCH_API_KEY=secret-key\nDATABASE_URL=postgres://...\n```\n\n**Public (exposé au navigateur) :**\n```\nNEXT_PUBLIC_GA_ID=G-XXXXXXXXXX\nNEXT_PUBLIC_API_URL=https://api.example.com\n```\n\nPréfixez avec `NEXT_PUBLIC_` pour rendre les variables disponibles dans le navigateur.\n\n## Configuration du thème\n\nPersonnalisez l'apparence visuelle.\n\n```json\n{\n  \"theme\": {\n    \"defaultMode\": \"system\",\n    \"respectPrefersColorScheme\": true,\n    \"primaryColor\": \"#3b82f6\",\n    \"customCss\": \"/custom.css\"\n  }\n}\n```\n\n**defaultMode**\n- `\"system\"` - Correspondre à la préférence du système d'exploitation\n- `\"light\"` - Toujours en mode clair\n- `\"dark\"` - Toujours en mode sombre\n\n**respectPrefersColorScheme**\n- Respecter la préférence de schéma de couleurs du système d'exploitation\n- Définissez à `false` pour ignorer les paramètres du système d'exploitation\n\n**primaryColor**\n- Couleur principale de la marque (code hexadécimal)\n- Utilisé pour les liens, boutons, accents\n\n**customCss**\n- Chemin vers le fichier CSS personnalisé\n- Ajoutez dans le dossier `public/`\n\nVoir [Personnalisation](/docs/v1.0.0/customization) pour un guide détaillé sur les thèmes.\n\n## Exemple complet\n\nVoici une configuration Specra entièrement configurée :\n\n```json\n{\n  \"site\": {\n    \"title\": \"Documentation Acme\",\n    \"description\": \"Docs complètes pour la plateforme Acme\",\n    \"url\": \"https://docs.acme.com\"\n  },\n  \"theme\": {\n    \"defaultMode\": \"system\",\n    \"primaryColor\": \"#6366f1\"\n  },\n  \"navigation\": {\n    \"showSidebar\": true,\n    \"showTableOfContents\": true,\n    \"tocPosition\": \"right\",\n    \"tabGroups\": [\n      { \"id\": \"guides\", \"label\": \"Guides\", \"icon\": \"book-open\" },\n      { \"id\": \"api\", \"label\": \"API\", \"icon\": \"zap\" }\n    ]\n  },\n  \"search\": {\n    \"enabled\": true,\n    \"provider\": \"meilisearch\",\n    \"meilisearch\": {\n      \"host\": \"${MEILISEARCH_HOST}\",\n      \"apiKey\": \"${MEILISEARCH_API_KEY}\",\n      \"indexName\": \"docs\"\n    }\n  },\n  \"analytics\": {\n    \"googleAnalytics\": \"G-XXXXXXXXXX\",\n    \"plausible\": \"docs.acme.com\"\n  },\n  \"social\": {\n    \"github\": \"https://github.com/acme/platform\",\n    \"twitter\": \"https://twitter.com/acme\",\n    \"discord\": \"https://discord.gg/acme\"\n  },\n  \"footer\": {\n    \"copyright\": \"© 2024 Acme Corp. Tous droits réservés.\",\n    \"links\": [\n      {\n        \"title\": \"Produit\",\n        \"items\": [\n          { \"label\": \"Fonctionnalités\", \"href\": \"/features\" },\n          { \"label\": \"Tarifs\", \"href\": \"/pricing\" }\n        ]\n      }\n    ]\n  },\n  \"banner\": {\n    \"enabled\": true,\n    \"message\": \"📢 La version 2.0 est maintenant disponible !\",\n    \"type\": \"info\",\n    \"dismissible\": true\n  },\n  \"features\": {\n    \"editUrl\": \"https://github.com/acme/platform/edit/main/docs\",\n    \"showLastUpdated\": true,\n    \"showReadingTime\": true,\n    \"showTags\": true,\n    \"versioning\": true\n  },\n  \"deployment\": {\n    \"target\": \"vercel\"\n  }\n}\n```\n\n## Prochaines étapes\n\n\u003cCardGrid cols={2}\u003e\n  \u003cCard\n    icon=\"search\"\n    title=\"Configuration de la recherche\"\n    description=\"Configurer MeiliSearch pour vos docs\"\n    href=\"/docs/v1.0.0/search-setup\"\n  /\u003e\n  \u003cCard\n    icon=\"palette\"\n    title=\"Personnalisation\"\n    description=\"Thème et style de votre documentation\"\n    href=\"/docs/v1.0.0/customization\"\n  /\u003e\n  \u003cCard\n    icon=\"rocket\"\n    title=\"Déploiement\"\n    description=\"Déployer en production\"\n    href=\"/docs/v1.0.0/deployment/overview\"\n  /\u003e\n  \u003cCard\n    icon=\"arrow-left\"\n    title=\"Aperçu de la configuration\"\n    description=\"Retour à l'aperçu de la configuration\"\n    href=\"/docs/v1.0.0/configuration/overview\"\n  /\u003e\n\u003c/CardGrid\u003e\n"])</script><script>self.__next_f.push([1,"45:T1224,"])</script><script>self.__next_f.push([1,"\n# Thèmes et personnalisation\n\nFaites de Specra le vôtre. Ce guide couvre tout, des simples changements de couleur au style personnalisé complet.\n\n## Personnalisation rapide\n\nLe moyen le plus rapide de personnaliser vos documents est via `specra.config.json`.\n\n### Couleurs de la marque\n\nDéfinissez votre couleur principale pour correspondre à votre marque :\n\n```json\n{\n  \"theme\": {\n    \"primaryColor\": \"#3b82f6\"\n  }\n}\n```\n\nSpecra génère automatiquement toutes les variations de couleur (états de survol, anneaux de focus, etc.) à partir de cette valeur unique.\n\n### Paramètres du mode sombre\n\nContrôlez le fonctionnement du mode sombre :\n\n```json\n{\n  \"theme\": {\n    \"defaultMode\": \"system\",\n    \"respectPrefersColorScheme\": true\n  }\n}\n```\n\n**Options pour `defaultMode` :**\n- `\"system\"` - Respecter les préférences du système d'exploitation (recommandé)\n- `\"light\"` - Toujours démarrer en mode clair\n- `\"dark\"` - Toujours démarrer en mode sombre\n\nDéfinissez `respectPrefersColorScheme` sur `false` pour ignorer les paramètres du système d'exploitation et utiliser uniquement votre valeur par défaut.\n\n### Logos\n\nAjoutez votre logo pour les modes clair et sombre :\n\n```json\n{\n  \"site\": {\n    \"logo\": {\n      \"light\": \"/logo-light.svg\",\n      \"dark\": \"/logo-dark.svg\"\n    }\n  }\n}\n```\n\nOu utilisez un seul logo pour les deux :\n\n```json\n{\n  \"site\": {\n    \"logo\": \"/logo.svg\"\n  }\n}\n```\n\nPlacez les fichiers de logo dans le répertoire `public/`.\n\n## CSS personnalisé\n\nPour une personnalisation plus approfondie, ajoutez du CSS personnalisé.\n\n### Méthode 1 : Fichier CSS personnalisé\n\nCréez un fichier CSS et référencez-le dans la configuration :\n\n**1. Créez `/public/custom.css` :**\n\n```css\n:root {\n  --font-heading: 'Inter', system-ui, sans-serif;\n  --border-radius: 12px;\n}\n\n.doc-content h1 {\n  font-size: 3rem;\n  color: var(--color-primary);\n}\n\n.sidebar {\n  background: linear-gradient(to bottom, #f8f9fa, #ffffff);\n}\n```\n\n**2. Référencez-le dans la configuration :**\n\n```json\n{\n  \"theme\": {\n    \"customCss\": \"/custom.css\"\n  }\n}\n```\n\n### Méthode 2 : Styles globaux\n\nModifiez directement `app/globals.css` pour plus de contrôle :\n\n```css\n@tailwind base;\n@tailwind components;\n@tailwind utilities;\n\n@layer base {\n  :root {\n    /* Vos propriétés personnalisées */\n    --radius: 0.75rem;\n  }\n}\n\n@layer components {\n  /* Vos styles de composants personnalisés */\n  .custom-card {\n    @apply rounded-lg border border-gray-200 p-4;\n  }\n}\n```\n\n## Référence des variables CSS\n\nSpecra utilise des variables CSS pour les thèmes. Surchargez-les pour personnaliser l'apparence :\n\n### Couleurs\n\n```css\n:root {\n  /* Couleur principale de la marque */\n  --color-primary: #3b82f6;\n  --color-primary-hover: #2563eb;\n  --color-primary-light: #dbeafe;\n\n  /* Couleurs de fond */\n  --color-bg: #ffffff;\n  --color-bg-secondary: #f9fafb;\n  --color-bg-tertiary: #f3f4f6;\n\n  /* Couleurs de texte */\n  --color-text: #111827;\n  --color-text-secondary: #6b7280;\n  --color-text-tertiary: #9ca3af;\n\n  /* Couleurs de bordure */\n  --color-border: #e5e7eb;\n  --color-border-hover: #d1d5db;\n\n  /* Couleurs des blocs de code */\n  --color-code-bg: #f3f4f6;\n  --color-code-text: #1f2937;\n}\n```\n\n### Typographie\n\n```css\n:root {\n  /* Familles de polices */\n  --font-sans: system-ui, -apple-system, sans-serif;\n  --font-mono: 'JetBrains Mono', 'Fira Code', monospace;\n  --font-heading: var(--font-sans);\n\n  /* Tailles de police */\n  --text-xs: 0.75rem;\n  --text-sm: 0.875rem;\n  --text-base: 1rem;\n}\n```\n\n### Espacement\n\n```css\n:root {\n  /* Rayon de bordure */\n  --radius-sm: 0.25rem;\n  --radius: 0.5rem;\n  --radius-md: 0.75rem;\n  --radius-lg: 1rem;\n  --radius-xl: 1.5rem;\n}\n```\n\n## Polices personnalisées\n\n### Utilisation de Google Fonts\n\n**1. Ajoutez la police à votre mise en page :**\n\n```tsx\n// app/layout.tsx\nimport { Inter, JetBrains_Mono } from 'next/font/google'\n\nconst inter = Inter({ subsets: ['latin'] })\nconst jetbrainsMono = JetBrains_Mono({ subsets: ['latin'] })\n\nexport default function RootLayout({ children }) {\n  return (\n    \u003chtml lang=\"en\" className={`${inter.className}`}\u003e\n      \u003cbody\u003e{children}\u003c/body\u003e\n    \u003c/html\u003e\n  )\n}\n```\n\n**2. Mettez à jour les variables CSS :**\n\n```css\n:root {\n  --font-sans: 'Inter', system-ui, sans-serif;\n  --font-mono: 'JetBrains Mono', monospace;\n}\n```\n\n### Utilisation de polices locales\n\nPlacez les fichiers de police dans `public/fonts/` et chargez-les :\n\n```css\n@font-face {\n  font-family: 'CustomFont';\n  src: url('/fonts/custom-font.woff2') format('woff2');\n  font-weight: 400;\n  font-style: normal;\n  font-display: swap;\n}\n\n:root {\n  --font-sans: 'CustomFont', system-ui, sans-serif;\n}\n```\n"])</script><script>self.__next_f.push([1,"46:T1224,"])</script><script>self.__next_f.push([1,"\n# Thèmes et personnalisation\n\nFaites de Specra le vôtre. Ce guide couvre tout, des simples changements de couleur au style personnalisé complet.\n\n## Personnalisation rapide\n\nLe moyen le plus rapide d: string;\n  name: string;\n  email: string;\n}\n\nfunction greetUser(user: User): string {\n  return `Bonjour, ${user.name}!`;\n}\n```\n\n### Python\n\n```python\ndef quicksort(arr):\n    if len(arr) \u003c= 1:\n        return arr\n    pivot = arr[len(arr) // 2]\n    left = [x for x in arr if x \u003c pivot]\n    middle = [x for x in arr if x == pivot]\n    right = [x for x in arr if x \u003e pivot]\n    return quicksort(left) + middle + quicksort(right)\n```\n\n### Bash\n\n```bash\n# Installer les dépendances\nnpm install\n\n# Démarrer le serveur de développement\nnpm run dev\n```\n\n### JSON\n\n```json\n{\n  \"name\": \"my-project\",\n  \"version\": \"1.0.0\",\n  \"dependencies\": {\n    \"react\": \"^19.0.0\",\n    \"next\": \"^16.0.0\"\n  }\n}\n```\n\n## Fonctionnalités\n\n\u003cCallout type=\"info\"\u003e\nLes blocs de code incluent une coloration syntaxique automatique pour de nombreux langages, y compris JavaScript, TypeScript, Python, Bash, JSON, CSS, et plus encore.\n\u003c/Callout\u003e\n\n- **Coloration syntaxique** - Détection et coloration automatiques du langage\n- **Numéros de ligne** - Référence facile pour des lignes spécifiques\n- **Bouton Copier** - Copie du code en un clic\n- **En-tête de nom de fichier** - Affichage optionnel du nom de fichier\n\n## Langages pris en charge\n\nLes langages courants incluent :\n- `javascript`, `typescript`, `jsx`, `tsx`\n- `python`, `ruby`, `go`, `rust`\n- `bash`, `shell`, `powershell`\n- `html`, `css`, `scss`\n- `json`, `yaml`, `toml`\n- `sql`, `graphql`\n- `markdown`, `mdx`\n"])</script><script>self.__next_f.push([1,"4a:T828,"])</script><script>self.__next_f.push([1,"\nLes blocs de code affichent du code avec une coloration syntaxique, des numéros de ligne, un bouton de copie et des en-têtes de nom de fichier optionnels.\n\n## Utilisation\n\nLes blocs de code sont créés automatiquement lors de l'utilisation de blocs de code délimités avec un spécificateur de langage :\n\n````mdx\n```javascript\nconst greeting n}\n```\n\n### Conseils de performance\n\nPour les grands sites de documentation (1000+ fichiers) :\n\n1. **Utiliser l'organisation des dossiers** : Organisez les documents dans des dossiers logiques pour améliorer la localité du cache\n2. **Activer le mode brouillon** : marquez les documents en cours de rédaction avec `draft: true` pour les exclure des builds de production\n3. **Optimiser les images** : Utilisez l'optimisation d'image Next.js pour les captures d'écran et les diagrammes\n4. **Surveiller les temps de construction** : Surveillez les journaux de performance pendant le développement\n\n## Fonctionnalités du mode développement\n\n### Journalisation des performances\n\nLors de l'exécution de `npm run dev`, vous verrez des métriques de performance détaillées :\n\n```\n⏱️  getAllDocs(v1.0.0): 234.56ms\n⏱️  getDocBySlug(getting-started): 12.34ms\n💾 Memory Usage: { rss: '156MB', heapTotal: '89MB', heapUsed: '67MB' }\n```\n\n### Utilitaires de débogage\n\nLe système comprend des outils de débogage utiles (mode dev uniquement) :\n\n- **PerfTimer** : Mesurer la durée des opérations\n- **logCacheOperation** : Suivre les succès/échecs du cache\n- **logMemoryUsage** : Surveiller la consommation de mémoire\n- **debugLog** : Imprimer proprement des objets complexes\n\n## Optimisations de production\n\n### Génération de site statique (SSG)\n\nToutes les pages de documentation sont pré-rendues au moment de la construction :\n\n- Zéro surcharge de rendu côté serveur\n- Chargements de page instantanés\n- Excellente performance SEO\n- Actifs statiques compatibles CDN\n\n### Optimisation du bundle\n\n- Composants serveur par défaut (JavaScript minimal)\n- Composants client uniquement là où nécessaire (onglets, sélecteur de thème)\n- Découpage de code automatique par route\n- Tree-shaking des dépendances inutilisées\n\n## Surveillance des performances\n\n### Analyse de construction\n\nSurveillez votre sortie de construction pour des informations sur les performances :\n\n`` ={600}\n  height={400}\n/\u003e\n\n\u003cImage \n  src=\"/images/image.png\" \n  alt=\"Image de remplacement\"\n  caption=\"Image de remplacement locale\"\n  width={600}\n  height={400}\n/\u003e\n\n## Props\n\n| Prop | Type | Défaut | Description |\n|------|------|--------|-------------|\n| `src` | `string` | requis | URL source de l'image |\n| `alt` | `string` | requis | Texte alternatif accessible |\n| `caption` | `string` | - | Légende affichée sous l'image |\n| `width` | `number` | `1200` | Largeur de l'image |\n| `height` | `number` | `675` | Hauteur de l'image |\n| `zoom` | `boolean` | `true` | Activer le zoom au clic |\n\n## Fonctionnalités\n\n### Fonctionnalité de zoom\n\n\u003cCallout type=\"info\"\u003e\nCliquez sur n'importe quelle image pour la voir dans une lightbox plein écran. Une icône de zoom apparaît au survol.\n\u003c/Callout\u003e\n\n### Légendes\n\nAjoutez du contexte aux images avec la prop `caption`. Les légendes sont stylisées en italique et centrées sous l'image.\n\n### Optimisation\n\nLes images sont automatiquement optimisées à l'aide du composant Image de Next.js pour :\n- Chargement différé\n- Dimensionnement réactif\n- Formats modernes (WebP)\n- Mise en cache\n\n## Meilleures pratiques\n\n- Fournissez toujours un texte `alt` descriptif pour l'accessibilité\n- Utilisez `width` et `height` appropriés pour éviter les décalages de mise en page\n- Ajoutez `caption` pour les diagrammes complexes ou les captures d'écran qui nécessitent une explication\n- Définissez `zoom={false}` pour les images décoratives ou petites\n"])</script><script>self.__next_f.push([1,"54:T7df,"])</script><script>self.__next_f.push([1,"\nLe composant Image affiche des images optimisées avec des légendes optionnelles et une fonctionnalité de zoom au clic.\n\n## Utilisation\n\n```mdx\n\u003cImage \n  src=\"/images/screenshot.png\" \n  alt=\"Capture d'écran de l'application\"\n  caption=\"Aperçu du tableau de bord\"\n/\u003e\n```\n\n## Exemple en direct\n\n\u003cImage \n \u003cMath block\u003e\n  {\"\\\\begin{pmatrix} a \u0026 b \\\\\\\\ c \u0026 d \\\\end{pmatrix}\"}\n\u003c/Math\u003e\n\n### Sommation\n\n\u003cMath block\u003e\n  {\"\\\\sum_{n=1}^{\\\\infty} \\\\frac{1}{n^2} = \\\\frac{\\\\pi^2}{6}\"}\n\u003c/Math\u003e\n\n## Props\n\n| Prop | Type | Défaut | Description |\n|------|------|--------|-------------|\n| `children` | `string` | requis | Expression mathématique LaTeX |\n| `block` | `boolean` | `false` | Afficher en bloc (centré) |\n\n## Syntaxe LaTeX\n\n\u003cCallout type=\"tip\"\u003e\nN'oubliez pas d'échapper les barres obliques inverses dans JSX. Utilisez `\\\\` au lieu de `\\` pour les commandes LaTeX.\n\u003c/Callout\u003e\n\n### Symboles courants\n\n| Symbole | LaTeX | Résultat |\n|---------|-------|----------|\n| Lettres grecques | `\\alpha, \\beta, \\gamma` | \u003cMath\u003e{\"\\\\alpha, \\\\beta, \\\\gamma\"}\u003c/Math\u003e |\n| Fractions | `\\frac{a}{b}` | \u003cMath\u003e{\"\\\\frac{a}{b}\"}\u003c/Math\u003e |\n| Racine carrée | `\\sqrt{x}` | \u003cMath\u003e{\"\\\\sqrt{x}\"}\u003c/Math\u003e |\n| Exposants | `x^{n}` | \u003cMath\u003e{\"x^{n}\"}\u003c/Math\u003e |\n| Indices | `x_{i}` | \u003cMath\u003e{\"x_{i}\"}\u003c/Math\u003e |\n| Infini | `\\infty` | \u003cMath\u003e{\"\\\\infty\"}\u003c/Math\u003e |\n| Somme | `\\sum` | \u003cMath\u003e{\"\\\\sum\"}\u003c/Math\u003e |\n| Intégrale | `\\int` | \u003cMath\u003e{\"\\\\int\"}\u003c/Math\u003e |\n\n## Ressources\n\n- [Documentation KaTeX](https://katex.org/docs/supported.html)\n- [Symboles mathématiques LaTeX](https://oeis.org/wiki/List_of_LaTeX_mathematical_symbols)\n"])</script><script>self.__next_f.push([1,"58:T83f,"])</script><script>self.__next_f.push([1,"\nLe composant Math rend des équations mathématiques avec KaTeX, prenant en charge les mathématiques en ligne et en bloc.\n\n## Utilisation\n\n### Mathématiques en ligne\n\n```mdx\nL'équation \u003cMath\u003e{\"E = mc^2\"}\u003c/Math\u003e est célèbre.\n```\n\n### Mathématiques en bloc\n\n```mdx\n\ pant Browser\n          participant Server\n          User-\u003e\u003eBrowser: Clic bouton\n          Browser-\u003e\u003eServer: Requête API\n          Server--\u003e\u003eBrowser: Réponse\n          Browser--\u003e\u003eUser: Mettre à jour UI\n      `}\n      caption=\"Séquence de requête API\"\n    /\u003e\n  \u003c/Tab\u003e\n\n  \u003cTab label=\"Code\"\u003e\n```mdx\n\u003cMermaid\n  chart={`\n    sequenceDiagram\n      participant User\n      participant Browser\n      participant Server\n      User-\u003e\u003eBrowser: Clic bouton\n      Browser-\u003e\u003eServer: Requête API\n      Server--\u003e\u003eBrowser: Réponse\n      Browser--\u003e\u003eUser: Mettre à jour UI\n  `}\n  caption=\"Séquence de requête API\"\n/\u003e\n```\n  \u003c/Tab\u003e\n\u003c/Tabs\u003e\n\n### Diagramme de classe\n\n\u003cTabs defaultValue=\"Aperçu\"\u003e\n  \u003cTab label=\"Aperçu\"\u003e\n    \u003cMermaid\n      chart={`\n        classDiagram\n          class Document {\n            +string titre\n            +string contenu\n            +Date creeLe\n            +render()\n          }\n          class MDXDocument {\n            +Object frontmatter\n            +compile()\n          }\n          Document \u003c|-- MDXDocument\n      `}\n      caption=\"Hiérarchie des classes de documents\"\n    /\u003e\n  \u003c/Tab\u003e\n\n  \u003cTab label=\"Code\"\u003e\n```mdx\n\u003cMermaid\n  chart={`\n    classDiagram\n      class Document {\n        +string titre\n        +string contenu\n        +Date creeLe\n        +render()\n      }\n      class MDXDocument {\n        +Object frontmatter\n        +compile()\n      }\n      Document \u003c|-- MDXDocument\n  `}\n  caption=\"Hiérarchie des classes de documents\"\n/\u003e\n```\n  \u003c/Tab\u003e\n\u003c/Tabs\u003e\n\n## Props\n\n| Prop | Type | Défaut | Description |\n|------|------|--------|-------------|\n| `chart` | `string` | requis | Définition du diagramme Mermaid |\n| `caption` | `string` | - | Légende sous le diagramme |\ sections accessibles via des onglets en haut de vos pages de documentation. Ceci est particulièrement utile pour séparer différents types de contenu comme la documentation SDK, les références API et les guides.\n\n## Aperçu\n\nLes groupes d'onglets fournissent une barre de navigation persistante qui :\n- Se place sous l'en-tête\n- Filtre le contenu de la barre latérale en fonction de l'onglet actif\n- Persiste à travers la navigation de page\n- Prend en charge les icônes de Lucide React\n- Maintient la structure de la barre latérale générée automatiquement\n\n## Configuration\n\nDéfinissez des groupes d'onglets dans votre `specra.config.json` :\n\n```json\n{\n  \"navigation\": {\n    \"tabGroups\": [\n      {\n        \"id\": \"sdk\",\n        \"label\": \"Documentation SDK\",\n        \"icon\": \"code\"\n      },\n      {\n        \"id\": \"api\",\n        \"label\": \"Référence API\",\n        \"icon\": \"zap\"\n      },\n      {\n        \"id\": \"guides\",\n        \"label\": \"Guides\",\n        \"icon\": \"book-open\"\n      }\n    ]\n  }\n}\n```\n\n### Propriétés du groupe d'onglets\n\n| Propriété | Type | Requis | Description |\n|-----------|------|--------|-------------|\n| `id` | string | Oui | Identifiant unique pour le groupe d'onglets |\n| `label` | string | Oui | Texte d'affichage pour l'onglet |\n| `icon` | string | Non | Nom de l'icône Lucide (par ex., \"code\", \"zap\", \"book-open\") |\n\n## Attribution de contenu aux onglets\n\nIl existe deux façons d'attribuer du contenu aux groupes d'onglets :\n\n### 1. Attribution au niveau du fichier\n\nAjoutez `tab_group` au frontmatter de vos fichiers MDX :\n\n```mdx\n---\ntitle: Démarrage\ndescription: Guide de démarrage rapide\ntab_group: guides\n---\n\n# Démarrage\n\nVotre contenu ici...\n```\n\n### 2. Attribution au niveau du dossier\n\nAjoutez `tab_group` à votre fichier `_category_.json` pour attribuer tous les fichiers de ce dossier :\n\n```json\n{\n  \"label\": \"Composants\",\n  \"position\": 2,\n  \"collapsible\": true,\n  \"collapsed\": false,\n  \"icon\": \"grid\",\n  \"tab_group\": \"sdk\"\n}\n```\n\nTous les fichiers dans ce dossier hériteront automatiquement du groupe d'onglets `sdk`.\n\n## Comportement et règles\n\n### Attribution d'onglet par défaut\n\nLes fichiers sans `tab_group` spécifié apparaîtront automatiquement dans le **premier groupe d'onglets** défini dans votre configuration.\n\n### Priorité\n\n`tab_group` au niveau du fichier dans le frontmatter a la priorité sur l'attribution au niveau du dossier de `_category_.json`.\n\n### Persistance des onglets\n\nL'onglet actif persiste lorsque :\n- Vous naviguez entre les pages au sein du même groupe d'onglets\n- Vous changez manuellement d'onglets\n- Vous cliquez sur des liens vers des pages dans différents groupes d'onglets (l'onglet change automatiquement)\n\n### Sélection initiale de l'onglet\n\nLorsque vous arrivez sur une page :\n- L'onglet change automatiquement pour correspondre au groupe de la page\n- Lors du rechargement de la page, l'onglet reflète le groupe de la page actuelle\n- La sélection manuelle de l'onglet est préservée lors de la navigation au sein du même groupe\n\n## Meilleures pratiques\n\n### 1. Regroupement logique\n\nRegroupez le contenu connexe ensemble :\n- **Docs SDK/Bibliothèque** : Installation, configuration, référence API\n- **Docs API** : Points de terminaison REST, schémas GraphQL, webhooks\n- **Guides** : Tutoriels, modes d'emploi, meilleures pratiques\n\n### 2. Nommage cohérent\n\nUtilisez des étiquettes claires et concises :\n- ✅ \"Documentation SDK\", \"Référence API\", \"Guides\"\n- ❌ \"Docs1\", \"Section A\", \"Divers\"\n\n### 3. Icônes significatives\n\nChoisissez des icônes qui représentent le contenu :\n- `code` pour la documentation SDK/bibliothèque\n- `zap` pour les références API\n- `book-open` pour les guides et tutoriels\n- `rocket` pour le contenu de démarrage\n\n### 4. Limiter le nombre d'onglets\n\nGardez le nombre d'onglets gérable :\n- **Recommandé** : 2-4 onglets\n- **Maximum** : 5-6 onglets\n- Trop d'onglets peuvent submerger les utilisateurs\n\n## Exemples\n\n### Exemple 1 : Simple séparation SDK + API\n\n```json\n{\n  \"navigation\": {\n    \"tabGroups\": [\n      {\n        \"id\": \"sdk\",\n        \"label\": \"SDK\",\n        \"icon\": \"code\"\n      },\n      {\n        \"id\": \"api\",\n        \"label\": \"API\",\n        \"icon\": \"zap\"\n      }\n    ]\n  }\n}\n```\n\n### Exemple 2 : Documentation complète\n\n```json\n{\n  \"navigation\": {\n    \"tabGroups\": [\n      {\n        \"id\": \"getting-started\",\n        \"label\": \"Démarrage\",\n        \"icon\": \"rocket\"\n      },\n      {\n        \"id\": \"sdk\",\n        \"label\": \"Référence SDK\",\n        \"icon\": \"code\"\n      },\n      {\n        \"id\": \"api\",\n        \"label\": \"Référence API\",\n        \"icon\": \"server\"\n      },\n      {\n        \"id\": \"guides\",\n        \"label\": \"Guides\",\n        \"icon\": \"book-open\"\n      }\n    ]\n  }\n}\n```\n\n## Utilisation avancée\n\n### Dossiers imbriqués\n\nLes groupes d'onglets fonctionnent de manière transparente avec des structures de dossiers imbriquées :\n\n```txt\ndocs/v1.0.0/\n├── components/              # tab_group: sdk\n│   ├── _category_.json\n│   ├── button.mdx\n│   └── input.mdx\n├── api/                     # tab_group: api\n│   ├── _category_.json\n│   ├── authentication.mdx\n│   └── endpoints.mdx\n└── guides/                  # tab_group: guides\n    ├── _category_.json\n    └── quickstart.mdx       # Peut remplacer avec tab_group au niveau du fichier\n```\n\n### Groupes d'onglets mixtes dans le même dossier\n\nVous pouvez avoir des fichiers dans le même dossier appartenant à différents onglets :\n\n```txt\ndocs/v1.0.0/\n├── _category_.json          # Par défaut : tab_group: sdk\n├── overview.mdx             # Hérite : sdk\n├── api-overview.mdx         # Remplacement : tab_group: api\n└── tutorial.mdx             # Remplacement : tab_group: guides\n```\n\n## Dépannage\n\n### L'onglet ne s'affiche pas\n\n**Problème** : Groupe d'onglets défini mais non visible\n\n**Solutions** :\n- Assurez-vous qu'au moins un fichier est attribué à ce groupe d'onglets\n- Vérifiez que l'`id` du groupe d'onglets correspond exactement dans la configuration et le frontmatter\n- Vérifiez que `navigation.tabGroups` est défini dans `specra.config.json`\n\n### Le contenu apparaît dans le mauvais onglet\n\n**Problème** : La page apparaît sous l'onglet incorrect\n\n**Solutions** :\n- Vérifiez le frontmatter au niveau du fichier pour le remplacement de `tab_group`\n- Vérifiez que `_category_.json` au niveau du dossier a le bon `tab_group`\n- Rappelez-vous : le frontmatter a la priorité sur `_category_.json`\n\n### L'onglet ne persiste pas\n\n**Problème** : L'onglet se réinitialise lors de la navigation\n\n**Solutions** :\n- C'est le comportement attendu lors de la navigation vers une page dans un groupe d'onglets différent\n- L'onglet change automatiquement pour correspondre au groupe de la page actuelle\n- La sélection manuelle persiste uniquement lors de la navigation au sein du même groupe d'onglets\n"])</script><script>self.__next_f.push([1,"64:T1b76,"])</script><script>self.__next_f.push([1,"\nLes groupes d'onglets vous permettent d'organiser votre documentation en différentes sections accessibles via des onglets en haut de vos pages de documentation. Ceci est particulièrement utile pour séparer différents types de contenu comme la documentation SDK, les références API et les guides.\n\n## Aperçu\n\nLes groupes d'onglets fournissent une barre de navigation persistante qui :\n- Se place sous l'en-tête\n- Filtre le contenu de la barre latérale en fonction de l'onglet actif\n- Persiste à travers la navigation de page\n- Prend en charge les icônes de Lucide React\n- Maintient la structure de la barre latérale générée automatiquement\n\n## Configuration\n\nDéfinissez des groupes d'onglets dans votre `specra.config.json` :\n\n```json\n{\n groupe d'onglets\n- Vous changez manuellement d'onglets\n- Vous cliquez sur des liens vers des pages dans différents groupes d'onglets (l'onglet change automatiquement)\n\n### Sélection initiale de l'onglet\n\nLorsque vous arrivez sur une page :\n- L'onglet change automatiquement pour correspondre au groupe de la page\n- Lors du rechargement de la page, l'onglet reflète le groupe de la page actuelle\n- La sélection manuelle de l'onglet est préservée lors de la navigation au sein du même groupe\n\n## Meilleures pratiques\n\n### 1. Regroupement logique\n\nRegroupez le contenu connexe ensemble :\n- **Docs SDK/Bibliothèque** : Installation, configuration, référence API\n- **Docs API** : Points de terminaison REST, schémas GraphQL, webhooks\n- **Guides** : Tutoriels, modes d'emploi, meilleures pratiques\n\n### 2. Nommage cohérent\n\nUtilisez des étiquettes claires et concises :\n- ✅ \"Documentation SDK\", \"Référence API\", \"Guides\"\n- ❌ \"Docs1\", \"Section A\", \"Divers\"\n\n### 3. Icônes significatives\n\nChoisissez des icônes qui représentent le contenu :\n- `code` pour la documentation SDK/bibliothèque\n- `zap` pour les références API\n- `book-open` pour les guides et tutoriels\n- `rocket` pour le contenu de démarrage\n\n### 4. Limiter le nombre d'onglets\n\nGardez le nombre d'onglets gérable :\n- **Recommandé** : 2-4 onglets\n- **Maximum** : 5-6 onglets\n- Trop d'onglets peuvent submerger les utilisateurs\n\n## Exemples\n\n### Exemple 1 : Simple séparation SDK + API\n\n```json\n{\n  \"navigation\": {\n    \"tabGroups\": [\n      {\n        \"id\": \"sdk\",\n        \"label\": \"SDK\",\n        \"icon\": \"code\"\n      },\n      {\n        \"id\": \"api\",\n        \"label\": \"API\",\n        \"icon\": \"zap\"\n      }\n    ]\n  }\n}\n```\n\n### Exemple 2 : Documentation complète\n\n```json\n{\n  \"navigation\": {\n    \"tabGroups\": [\n      {\n        \"id\": \"getting-started\",\n        \"label\": \"Démarrage\",\n        \"icon\": \"rocket\"\n      },\n      {\n        \"id\": \"sdk\",\n        \"label\": \"Référence SDK\",\n        \"icon\": \"code\"\n      },\n      {\n        \"id\": \"api\",\n        \"label\": \"Référence API\",\n        \"icon\": \"server\"\n      },\n      {\n        \"id\": \"guides\",\n        \"label\": \"Guides\",\n        \"icon\": \"book-open\"\n      }\n    ]\n  }\n}\n```\n\n## Utilisation avancée\n\n### Dossiers imbriqués\n\nLes groupes d'onglets fonctionnent de manière transparente avec des structures de dossiers imbriquées :\n\n```txt\ndocs/v1.0.0/\n├── components/              # tab_group: sdk\n│   ├── _category_.json\n│   ├── button.mdx\n│   └── input.mdx\n├── api/                     # tab_group: api\n│   ├── _category_.json\n│   ├── authentication.mdx\n│   └── endpoints.mdx\n└── guides/                  # tab_group: guides\n    ├── _category_.json\n    └── quickstart.mdx       # Peut remplacer avec tab_group au niveau du fichier\n```\n\n### Groupes d'onglets mixtes dans le même dossier\n\nVous pouvez avoir des fichiers dans le même dossier appartenant à différents onglets :\n\n```txt\ndocs/v1.0.0/\n├── _category_.json          # Par défaut : tab_group: sdk\n├── overview.mdx             # Hérite : sdk\n├── api-overview.mdx         # Remplacement : tab_group: api\n└── tutorial.mdx             # Remplacement : tab_group: guides\n```\n\n## Dépannage\n\n### L'onglet ne s'affiche pas\n\n**Problème** : Groupe d'onglets défini mais non visible\n\n**Solutions** :\n- Assurez-vous qu'au moins un fichier est attribué à ce groupe d'onglets\n- Vérifiez que l'`id` du groupe d'onglets correspond exactement dans la configuration et le frontmatter\n- Vérifiez que `navigation.tabGroups` est défini dans `specra.config.json`\n\n### Le contenu apparaît dans le mauvais onglet\n\n**Problème** : La page apparaît sous l'onglet incorrect\n\n**Solutions** :\n- Vérifiez le frontmatter au niveau du fichier pour le remplacement de `tab_group`\n- Vérifiez que `_category_.json` au niveau du dossier a le bon `tab_group`\n- Rappelez-vous : le frontmatter a la priorité sur `_category_.json`\n\n### L'onglet ne persiste pas\n\n**Problème** : L'onglet se réinitialise lors de la navigation\n\n**Solutions** :\n- C'est le comportement attendu lors de la navigation vers une page dans un groupe d'onglets différent\n- L'onglet change automatiquement pour correspondre au groupe de la page actuelle\n- La sélection manuelle persiste uniquement lors de la navigation au sein du même groupe d'onglets\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$9\",null,{\"fallback\":[\"$\",\"$L12\",null,{}],\"children\":[[\"$\",\"$L13\",null,{\"header\":[\"$\",\"$L14\",null,{\"currentVersion\":\"v1.0.0\",\"versions\":[\"v1.0.0\"],\"config\":\"$0:f:0:1:0:props:children:1:props:children:props:children:props:config\"}],\"docs\":[{\"slug\":\"fr/about\",\"filePath\":\"about\",\"title\":\"À propos de Specra\",\"meta\":{\"title\":\"À propos de Specra\",\"sidebar_position\":1,\"icon\":\"info\",\"tab_group\":\"guides\",\"content\":\"$15\",\"reading_time\":5,\"word_count\":914,\"locale\":\"fr\"},\"content\":\"$16\"},{\"slug\":\"fr/api/api-overview\",\"filePath\":\"api/api-overview\",\"title\":\"Documentation API\",\"meta\":{\"title\":\"Documentation API\",\"description\":\"Guide complet pour documenter les API REST dans Specra\",\"icon\":\"book-open\",\"sidebar_position\":1,\"content\":\"$17\",\"reading_time\":6,\"word_count\":1134,\"locale\":\"fr\"},\"content\":\"$18\",\"categoryLabel\":\"Api\",\"categoryPosition\":2,\"categoryCollapsible\":true,\"categoryCollapsed\":false,\"categoryIcon\":\"zap\",\"categoryTabGroup\":\"api\"},{\"slug\":\"fr/components/accordion\",\"filePath\":\"components/accordion\",\"title\":\"Accordéon\",\"meta\":{\"title\":\"Accordéon\",\"description\":\"Créez des sections de contenu pliables avec les composants Accordion et AccordionItem\",\"sidebar_position\":1,\"content\":\"$19\",\"reading_time\":2,\"word_count\":283,\"locale\":\"fr\"},\"content\":\"$1a\",\"categoryLabel\":\"Compon
