run build:export` (pas `npm run build`)\n- Vercel : `npm run build` (pas `npm run build:export`)\n\n### Page blanche après le déploiement\n\n**Vérifiez que la cible est correcte :**\n- GitHub Pages a besoin de `\"target\": \"github-pages\"`\n- Netlify a besoin de `\"target\": \"static\"`\n- Vercel a besoin de `\"target\": \"vercel\"`\n\n**Vérifiez que les paramètres de déploiement correspondent à la configuration :**\n- Le répertoire de sortie doit correspondre au mode de build\n- La commande de build doit correspondre à la cible\n\n### Domaine personnalisé ne fonctionne pas\n\n**Assurez-vous que customDomain est true :**\n```json\n{\n  \"deployment\": {\n    \"customDomain\": true,\n    \"basePath\": \"\"\n  }\n}\n```\n\n**Vérifiez que le fichier CNAME existe :**\n- Doit être dans `public/CNAME`\n- Contient uniquement votre domaine\n- Pas de protocole, pas de barre oblique finale\n\n## Meilleures pratiques\n\n**Garder la config dans le contrôle de version** - Commitez `specra.config.json` pour que les déploiements soient cohérents\n\n**Tester localement avant de déployer** - Utilisez `npx serve out` pour tester les exports statiques\n\n**Utiliser des configs spécifiques à l'environnement** - Différentes configurations pour le staging et la production si nécessaire\n\n**Documenter votre installation** - Ajoutez des instructions de déploiement à votre README\n\n**Vérifier après avoir changé de plateforme** - Testez que tout fonctionne lors du changement de cibles de déploiement\n\n## Prochaines étapes\n\n\u003cCardGrid cols={2}\u003e\n  \u003cCard\n    icon=\"triangle\"\n    title=\"Déployer sur Vercel\"\n    description=\"Déploiement Vercel étape par étape\"\n    href=\"/docs/v1.0.0/deployment/vercel\"\n  /\u003e\n  \u003cCard\n    icon=\"github\"\n    title=\"Déployer sur GitHub Pages\"\n    description=\"GitHub Pages avec Actions\"\n    href=\"/docs/v1.0.0/deployment/github-pages\"\n  /\u003e\n  \u003cCard\n    icon=\"globe\"\n    title=\"Déployer sur Netlify\"\n    description=\"Guide de déploiement Netlify\"\n    href=\"/docs/v1.0.0/deployment/netlify\"\n  /\u003e\n  \u003cCard\n    icon=\"arrow-left\"\n    title=\"Aperçu du déploiement\"\n    description=\"Toutes les options de déploiement\"\n    href=\"/docs/v1.0.0/deployment/overview\"\n  /\u003e\n\u003c/CardGrid\u003e\n"])</script><script>self.__next_f.push([1,"39:T2f7a,"])</script><script>self.__next_f.push([1,"\n# Déployer sur Netlify\n\nNetlify fournit un hébergement statique puissant avec des fonctionnalités telles que les restaurations instantanées, les tests fractionnés et les fonctions edge. C'est un excellent choix pour les sites de documentation.\n\n## Pourquoi Netlify ?\n\n- **Déploiement en un clic** - Connectez et déployez en quelques minutes\n- **Déploiement continu** - Déploiement automatique lors du push git\n- **Restaurations instantanées** - Restaurez les versions précédentes instantanément\n- **Fonctions Edge** - Exécutez du code en périphérie\n- **Formulaires \u0026 identité** - Gestion de formulaires et authentification intégrées\n- **Niveau gratuit** - Limites généreuses pour la documentation\n\n## Déploiement rapide\n\n\u003cSteps\u003e\n  \u003cStep title=\"Configurer pour l'export statique\"\u003e\n    Mettez à jour `specra.config.json` :\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"static\",\n    \"basePath\": \"\",\n    \"customDomain\": false\n  }\n}\n```\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Créer netlify.toml\"\u003e\n    Ajoutez la configuration de build à la racine du projet :\n\n```toml\n[build]\n  command = \"npm run build:export\"\n  publish = \"out\"\n\n[build.environment]\n  NODE_VERSION = \"20\"\n\n[[redirects]]\n  from = \"/*\"\n  to = \"/index.html\"\n  status = 200\n```\n\nCela indique à Netlify comment construire et ce qu'il faut publier.\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Déployer\"\u003e\n    **Option 1 : Interface Web**\n    1. Allez sur [netlify.com](https://netlify.com)\n    2. Cliquez sur \"Add new site\" → \"Import an existing project\"\n    3. Connectez votre fournisseur Git\n    4. Sélectionnez votre dépôt\n    5. Cliquez sur \"Deploy site\"\n\n**Option 2 : CLI Netlify**\n```bash\nnpm install -g netlify-cli\nnetlify deploy --prod\n```\n  \u003c/Step\u003e\n\u003c/Steps\u003e\n\n\u003cCallout type=\"success\"\u003e\nVotre site est maintenant en ligne à une URL Netlify comme `random-name-123.netlify.app`\n\u003c/Callout\u003e\n\n## Configuration\n\n### Paramètres de build\n\nNetlify détecte automatiquement les paramètres, mais vous pouvez les personnaliser :\n\n| Paramètre | Valeur |\n|-----------|--------|\n| Commande de build | `npm run build:export` |\n| Répertoire de publication | `out` |\n| Version de Node | 20 (définie dans `netlify.toml`) |\n\n### Variables d'environnement\n\nAjoutez des variables d'environnement dans le tableau de bord Netlify :\n\n\u003cSteps\u003e\n  \u003cStep title=\"Aller aux paramètres du site\"\u003e\n    Cliquez sur votre site → Site settings → Environment variables\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Ajouter des variables\"\u003e\n```\nMEILISEARCH_HOST=https://search.example.com\nMEILISEARCH_API_KEY=votre-clé-de-recherche\nNEXT_PUBLIC_GA_ID=G-XXXXXXXXXX\n```\n\n\u003cCallout type=\"tip\"\u003e\nLes variables commençant par `NEXT_PUBLIC_` sont exposées au navigateur. Gardez les clés sensibles sans ce préfixe.\n\u003c/Callout\u003e\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Redéployer\"\u003e\n    Allez dans Deploys → Trigger deploy → Deploy site\n  \u003c/Step\u003e\n\u003c/Steps\u003e\n\n## Domaine personnalisé\n\nAjoutez votre propre domaine à votre site Netlify :\n\n\u003cSteps\u003e\n  \u003cStep title=\"Ajouter un domaine\"\u003e\n    1. Allez dans Domain settings\n    2. Cliquez sur \"Add custom domain\"\n    3. Entrez votre domaine (par ex., `docs.example.com`)\n    4. Cliquez sur \"Verify\"\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Configurer le DNS\"\u003e\n    **Option 1 : Utiliser le DNS Netlify (Recommandé)**\n    - Faites pointer les serveurs de noms de votre domaine vers Netlify\n    - Netlify gère tous les enregistrements DNS\n    - Certificat SSL automatique\n\n**Option 2 : Utiliser un DNS externe**\n\nPour sous-domaine :\n```\nType: CNAME\nNom: docs\nValeur: votre-site.netlify.app\n```\n\nPour domaine apex :\n```\nType: A\nNom: @\nValeur: 75.2.60.5\n```\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Activer HTTPS\"\u003e\n    Netlify provisionne automatiquement un certificat SSL de Let's Encrypt.\n\n    Vérifiez Domain settings → HTTPS pour le statut.\n  \u003c/Step\u003e\n\u003c/Steps\u003e\n\n## Aperçus de déploiement\n\nNetlify crée des déploiements d'aperçu pour chaque pull request :\n\n**Ce que vous obtenez :**\n- URL unique pour chaque PR\n- Mises à jour automatiques lorsque vous poussez\n- Lien d'aperçu de déploiement dans les commentaires PR\n- Parfait pour examiner les changements\n\n### Configurer les aperçus de déploiement\n\nContrôlez quand les aperçus sont créés :\n\n```toml\n[context.deploy-preview]\n  command = \"npm run build:export\"\n\n[context.branch-deploy]\n  command = \"npm run build:export\"\n```\n\n## Fonctionnalités avancées\n\n### Règles de redirection\n\nAjoutez des redirections dans `netlify.toml` :\n\n```toml\n# Rediriger les anciennes URL\n[[redirects]]\n  from = \"/old-page\"\n  to = \"/new-page\"\n  status = 301\n\n# Fallback SPA\n[[redirects]]\n  from = \"/*\"\n  to = \"/index.html\"\n  status = 200\n\n# Redirections basées sur le pays\n[[redirects]]\n  from = \"/docs\"\n  to = \"/en/docs\"\n  status = 302\n  conditions = {Country = [\"US\"]}\n```\n\n### En-têtes\n\nAjoutez des en-têtes personnalisés :\n\n```toml\n[[headers]]\n  for = \"/*\"\n  [headers.values]\n    X-Frame-Options = \"DENY\"\n    X-XSS-Protection = \"1; mode=block\"\n    Content-Security-Policy = \"default-src 'self'\"\n\n[[headers]]\n  for = \"/assets/*\"\n  [headers.values]\n    Cache-Control = \"public, max-age=31536000, immutable\"\n```\n\n### Fonctions Edge\n\nExécutez du code en périphérie pour une fonctionnalité dynamique :\n\nCréez `netlify/edge-functions/hello.ts` :\n\n```typescript\nexport default async (request: Request) =\u003e {\n  return new Response(\"Bonjour depuis le bord !\")\n}\n\nexport const config = {\n  path: \"/api/hello\"\n}\n```\n\n### Tests fractionnés\n\nTestez différentes versions de vos docs :\n\n1. Allez dans Split testing\n2. Cliquez sur \"Start a test\"\n3. Sélectionnez les branches à comparer\n4. Définissez la répartition du trafic (par ex., 50/50)\n\nIdéal pour tester de nouvelles mises en page ou contenus de documentation.\n\n## Plugins de build\n\nÉtendez votre build avec des plugins Netlify :\n\n```toml\n[[plugins]]\n  package = \"@netlify/plugin-lighthouse\"\n\n[[plugins]]\n  package = \"netlify-plugin-checklinks\"\n```\n\nInstaller les plugins :\n\n```bash\nnpm install -D @netlify/plugin-lighthouse netlify-plugin-checklinks\n```\n\n## Contextes de déploiement\n\nDifférentes configurations pour différentes branches :\n\n```toml\n# Production (branche main)\n[context.production]\n  command = \"npm run build:export\"\n  [context.production.environment]\n    NODE_ENV = \"production\"\n\n# Branche de staging\n[context.staging]\n  command = \"npm run build:export\"\n  [context.staging.environment]\n    NODE_ENV = \"staging\"\n\n# Aperçus de déploiement (PRs)\n[context.deploy-preview]\n  command = \"npm run build:export -- --debug\"\n```\n\n## Optimisation des performances\n\n### Optimisation des actifs\n\nNetlify optimise automatiquement :\n- Compression d'image\n- Minification de bundle\n- Compression Brotli\n\nActivez ceci dans Build \u0026 deploy → Post processing.\n\n### Mise en cache\n\nConfigurez les en-têtes de cache :\n\n```toml\n[[headers]]\n  for = \"/_next/static/*\"\n  [headers.values]\n    Cache-Control = \"public, max-age=31536000, immutable\"\n\n[[headers]]\n  for = \"/images/*\"\n  [headers.values]\n    Cache-Control = \"public, max-age=604800\"\n```\n\n### Pré-rendu\n\nPour un meilleur SEO, activez le pré-rendu :\n\n```toml\n[[plugins]]\n  package = \"@netlify/plugin-nextjs\"\n```\n\n## Formulaires\n\nAjoutez des formulaires à votre documentation :\n\n```html\n\u003cform name=\"contact\" method=\"POST\" data-netlify=\"true\"\u003e\n  \u003cinput type=\"text\" name=\"name\" /\u003e\n  \u003cinput type=\"email\" name=\"email\" /\u003e\n  \u003ctextarea name=\"message\"\u003e\u003c/textarea\u003e\n  \u003cbutton type=\"submit\"\u003eEnvoyer\u003c/button\u003e\n\u003c/form\u003e\n```\n\nNetlify gère automatiquement les soumissions de formulaires. Voir les réponses dans l'onglet Forms.\n\n## Analytique\n\nActivez Netlify Analytics pour des informations sur les visiteurs :\n\n1. Allez dans l'onglet Analytics\n2. Cliquez sur \"Enable Analytics\"\n3. Coûte 9 $/mois (optionnel)\n\nAffiche :\n- Vues de page\n- Pages principales\n- Sources de trafic\n- Données géographiques\n\n## Intégration CI/CD\n\n### GitHub Actions + Netlify\n\nDéployez depuis GitHub Actions pour plus de contrôle :\n\n```yaml\nname: Deploy to Netlify\n\non:\n  push:\n    branches: [main]\n\njobs:\n  deploy:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n\n      - name: Setup Node\n        uses: actions/setup-node@v4\n        with:\n          node-version: '20'\n\n      - name: Install dependencies\n        run: npm ci\n\n      - name: Build\n        run: npm run build:export\n\n      - name: Deploy to Netlify\n        uses: nwtgck/actions-netlify@v2\n        with:\n          publish-dir: './out'\n          production-deploy: true\n        env:\n          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}\n          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}\n```\n\nObtenez votre jeton d'authentification et votre ID de site depuis le tableau de bord Netlify.\n\n## Dépannage\n\n### Échec du build\n\n**Vérifier les journaux de build :**\n- Allez dans Deploys\n- Cliquez sur le déploiement échoué\n- Voir le journal de déploiement\n\n**Problèmes courants :**\n- Incompatibilité de version Node (définir dans `netlify.toml`)\n- Dépendances manquantes (utilisez `npm ci` pas `npm install`)\n- Variables d'environnement non définies\n\n### Actifs 404\n\nAssurez-vous que `netlify.toml` a la redirection SPA :\n\n```toml\n[[redirects]]\n  from = \"/*\"\n  to = \"/index.html\"\n  status = 200\n```\n\n### Les fonctions ne fonctionnent pas\n\nVérifiez les journaux de fonction :\n1. Allez dans l'onglet Functions\n2. Cliquez sur votre fonction\n3. Voir les journaux\n\nAssurez-vous que le chemin de la fonction correspond à la configuration :\n\n```typescript\nexport const config = {\n  path: \"/api/hello\"  // Doit correspondre à votre route\n}\n```\n\n### Problèmes SSL de domaine personnalisé\n\n- Attendez 24 heures pour la propagation DNS\n- Vérifiez les enregistrements DNS avec `dig` ou `nslookup`\n- Vérifiez le statut HTTPS dans Domain settings\n- Essayez de re-provisionner le certificat\n\n## Restaurations\n\nRestaurez instantanément à un déploiement précédent :\n\n1. Allez dans Deploys\n2. Trouvez la version fonctionnelle\n3. Cliquez sur \"Publish deploy\"\n\nVotre site revient immédiatement. Pas d'attente pour les builds.\n\n## Surveillance\n\n### Notifications de déploiement\n\nSoyez notifié lorsque les déploiements réussissent ou échouent :\n\n1. Allez dans Site settings → Build \u0026 deploy → Deploy notifications\n2. Ajoutez une notification (Email, Slack, webhook)\n3. Choisissez les événements (déploiement commencé, réussi, échoué)\n\n### Badge de statut\n\nAjoutez un badge de statut de déploiement à votre README :\n\n```markdown\n[![Netlify Status](https://api.netlify.com/api/v1/badges/SITE_ID/deploy-status)](https://app.netlify.com/sites/SITE_NAME/deploys)\n```\n\n## Tarification\n\nLe niveau gratuit de Netlify comprend :\n- 300 minutes de build/mois\n- 100 Go de bande passante/mois\n- Sites illimités\n- Aperçus de déploiement\n- HTTPS\n- Formulaires (100 soumissions/mois)\n\nPassez à Pro (19 $/mois) pour :\n- Plus de bande passante et de minutes de build\n- Analytique\n- Collaboration d'équipe\n- Support prioritaire\n\n## Meilleures pratiques\n\n**Utiliser `netlify.toml`** - Contrôlez la version de votre configuration de build\n\n**Activer les aperçus de déploiement** - Examinez les changements avant de fusionner\n\n**Configurer les notifications** - Sachez immédiatement quand les déploiements échouent\n\n**Utiliser des variables d'environnement** - Gardez les secrets hors du code\n\n**Configurer les redirections** - Gérez correctement les changements d'URL\n\n**Surveiller l'analytique** - Comprenez comment les utilisateurs naviguent dans vos docs\n\n**Tester localement** - Exécutez `npm run build:export \u0026\u0026 npx serve out` d'abord\n\n## Prochaines étapes\n\n\u003cCardGrid cols={2}\u003e\n  \u003cCard\n    icon=\"triangle\"\n    title=\"Vercel\"\n    description=\"Déployer sur Vercel à la place\"\n    href=\"/docs/v1.0.0/deployment/vercel\"\n  /\u003e\n  \u003cCard\n    icon=\"github\"\n    title=\"GitHub Pages\"\n    description=\"Hébergement gratuit avec GitHub Pages\"\n    href=\"/docs/v1.0.0/deployment/github-pages\"\n  /\u003e\n  \u003cCard\n    icon=\"arrow-left\"\n    title=\"Aperçu du déploiement\"\n    description=\"Voir toutes les options de déploiement\"\n    href=\"/docs/v1.0.0/deployment/overview\"\n  /\u003e\n  \u003cCard\n    icon=\"zap\"\n    title=\"Performance\"\n    description=\"Optimiser votre documentation\"\n    href=\"/docs/v1.0.0/performance\"\n  /\u003e\n\u003c/CardGrid\u003e\n"])</script><script>self.__next_f.push([1,"3a:T2f7a,"])</script><script>self.__next_f.push([1,"\n# Déployer sur Netlify\n\nNetlify fournit un hébergement statique puissant avec des fonctionnalités telles que les restaurations instantanées, les tests fractionnés et les fonctions edge. C'est un excellent choix pour les sites de documentation.\n\n## Pourquoi Netlify ?\n\n- **Déploiement en un clic** - Connectez et déployez en quelques minutes\n- **Déploiement continu** - Déploiement automatique lors du push git\n- **Restaurations instantanées** - Restaurez les versions précédentes instantanément\n- **Fonctions Edge** - Exécutez du code en périphérie\n- **Formulaires \u0026 identité** - Gestion de formulaires et authentification intégrées\n- **Niveau gratuit** - Limites généreuses pour la documentation\n\n## Déploiement rapide\n\n\u003cSteps\u003e\n  \u003cStep title=\"Configurer pour l'export statique\"\u003e\n    Mettez à jour `specra.config.json` :\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"static\",\n    \"basePath\": \"\",\n    \"customDomain\": false\n  }\n}\n```\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Créer netlify.toml\"\u003e\n    Ajoutez la configuration de build à la racine du projet :\n\n```toml\n[build]\n  command = \"npm run build:export\"\n  publish = \"out\"\n\n[build.environment]\n  NODE_VERSION = \"20\"\n\n[[redirects]]\n  from = \"/*\"\n  to = \"/index.html\"\n  status = 200\n```\n\nCela indique à Netlify comment construire et ce qu'il faut publier.\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Déployer\"\u003e\n    **Option 1 : Interface Web**\n    1. Allez sur [netlify.com](https://netlify.com)\n    2. Cliquez sur \"Add new site\" → \"Import an existing project\"\n    3. Connectez votre fournisseur Git\n    4. Sélectionnez votre dépôt\n    5. Cliquez sur \"Deploy site\"\n\n**Option 2 : CLI Netlify**\n```bash\nnpm install -g netlify-cli\nnetlify deploy --prod\n```\n  \u003c/Step\u003e\n\u003c/Steps\u003e\n\n\u003cCallout type=\"success\"\u003e\nVotre site est maintenant en ligne à une URL Netlify comme `random-name-123.netlify.app`\n\u003c/Callout\u003e\n\n## Configuration\n\n### Paramètres de build\n\nNetlify détecte automatiquement les paramètres, mais vous pouvez les personnaliser :\n\n| Paramètre | Valeur |\n|-----------|--------|\n| Commande de build | `npm run build:export` |\n| Répertoire de publication | `out` |\n| Version de Node | 20 (définie dans `netlify.toml`) |\n\n### Variables d'environnement\n\nAjoutez des variables d'environnement dans le tableau de bord Netlify :\n\n\u003cSteps\u003e\n  \u003cStep title=\"Aller aux paramètres du site\"\u003e\n    Cliquez sur votre site → Site settings → Environment variables\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Ajouter des variables\"\u003e\n```\nMEILISEARCH_HOST=https://search.example.com\nMEILISEARCH_API_KEY=votre-clé-de-recherche\nNEXT_PUBLIC_GA_ID=G-XXXXXXXXXX\n```\n\n\u003cCallout type=\"tip\"\u003e\nLes variables commençant par `NEXT_PUBLIC_` sont exposées au navigateur. Gardez les clés sensibles sans ce préfixe.\n\u003c/Callout\u003e\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Redéployer\"\u003e\n    Allez dans Deploys → Trigger deploy → Deploy site\n  \u003c/Step\u003e\n\u003c/Steps\u003e\n\n## Domaine personnalisé\n\nAjoutez votre propre domaine à votre site Netlify :\n\n\u003cSteps\u003e\n  \u003cStep title=\"Ajouter un domaine\"\u003e\n    1. Allez dans Domain settings\n    2. Cliquez sur \"Add custom domain\"\n    3. Entrez votre domaine (par ex., `docs.example.com`)\n    4. Cliquez sur \"Verify\"\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Configurer le DNS\"\u003e\n    **Option 1 : Utiliser le DNS Netlify (Recommandé)**\n    - Faites pointer les serveurs de noms de votre domaine vers Netlify\n    - Netlify gère tous les enregistrements DNS\n    - Certificat SSL automatique\n\n**Option 2 : Utiliser un DNS externe**\n\nPour sous-domaine :\n```\nType: CNAME\nNom: docs\nValeur: votre-site.netlify.app\n```\n\nPour domaine apex :\n```\nType: A\nNom: @\nValeur: 75.2.60.5\n```\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Activer HTTPS\"\u003e\n    Netlify provisionne automatiquement un certificat SSL de Let's Encrypt.\n\n    Vérifiez Domain settings → HTTPS pour le statut.\n  \u003c/Step\u003e\n\u003c/Steps\u003e\n\n## Aperçus de déploiement\n\nNetlify crée des déploiements d'aperçu pour chaque pull request :\n\n**Ce que vous obtenez :**\n- URL unique pour chaque PR\n- Mises à jour automatiques lorsque vous poussez\n- Lien d'aperçu de déploiement dans les commentaires PR\n- Parfait pour examiner les changements\n\n### Configurer les aperçus de déploiement\n\nContrôlez quand les aperçus sont créés :\n\n```toml\n[context.deploy-preview]\n  command = \"npm run build:export\"\n\n[context.branch-deploy]\n  command = \"npm run build:export\"\n```\n\n## Fonctionnalités avancées\n\n### Règles de redirection\n\nAjoutez des redirections dans `netlify.toml` :\n\n```toml\n# Rediriger les anciennes URL\n[[redirects]]\n  from = \"/old-page\"\n  to = \"/new-page\"\n  status = 301\n\n# Fallback SPA\n[[redirects]]\n  from = \"/*\"\n  to = \"/index.html\"\n  status = 200\n\n# Redirections basées sur le pays\n[[redirects]]\n  from = \"/docs\"\n  to = \"/en/docs\"\n  status = 302\n  conditions = {Country = [\"US\"]}\n```\n\n### En-têtes\n\nAjoutez des en-têtes personnalisés :\n\n```toml\n[[headers]]\n  for = \"/*\"\n  [headers.values]\n    X-Frame-Options = \"DENY\"\n    X-XSS-Protection = \"1; mode=block\"\n    Content-Security-Policy = \"default-src 'self'\"\n\n[[headers]]\n  for = \"/assets/*\"\n  [headers.values]\n    Cache-Control = \"public, max-age=31536000, immutable\"\n```\n\n### Fonctions Edge\n\nExécutez du code en périphérie pour une fonctionnalité dynamique :\n\nCréez `netlify/edge-functions/hello.ts` :\n\n```typescript\nexport default async (request: Request) =\u003e {\n  return new Response(\"Bonjour depuis le bord !\")\n}\n\nexport const config = {\n  path: \"/api/hello\"\n}\n```\n\n### Tests fractionnés\n\nTestez différentes versions de vos docs :\n\n1. Allez dans Split testing\n2. Cliquez sur \"Start a test\"\n3. Sélectionnez les branches à comparer\n4. Définissez la répartition du trafic (par ex., 50/50)\n\nIdéal pour tester de nouvelles mises en page ou contenus de documentation.\n\n## Plugins de build\n\nÉtendez votre build avec des plugins Netlify :\n\n```toml\n[[plugins]]\n  package = \"@netlify/plugin-lighthouse\"\n\n[[plugins]]\n  package = \"netlify-plugin-checklinks\"\n```\n\nInstaller les plugins :\n\n```bash\nnpm install -D @netlify/plugin-lighthouse netlify-plugin-checklinks\n```\n\n## Contextes de déploiement\n\nDifférentes configurations pour différentes branches :\n\n```toml\n# Production (branche main)\n[context.production]\n  command = \"npm run build:export\"\n  [context.production.environment]\n    NODE_ENV = \"production\"\n\n# Branche de staging\n[context.staging]\n  command = \"npm run build:export\"\n  [context.staging.environment]\n    NODE_ENV = \"staging\"\n\n# Aperçus de déploiement (PRs)\n[context.deploy-preview]\n  command = \"npm run build:export -- --debug\"\n```\n\n## Optimisation des performances\n\n### Optimisation des actifs\n\nNetlify optimise automatiquement :\n- Compression d'image\n- Minification de bundle\n- Compression Brotli\n\nActivez ceci dans Build \u0026 deploy → Post processing.\n\n### Mise en cache\n\nConfigurez les en-têtes de cache :\n\n```toml\n[[headers]]\n  for = \"/_next/static/*\"\n  [headers.values]\n    Cache-Control = \"public, max-age=31536000, immutable\"\n\n[[headers]]\n  for = \"/images/*\"\n  [headers.values]\n    Cache-Control = \"public, max-age=604800\"\n```\n\n### Pré-rendu\n\nPour un meilleur SEO, activez le pré-rendu :\n\n```toml\n[[plugins]]\n  package = \"@netlify/plugin-nextjs\"\n```\n\n## Formulaires\n\nAjoutez des formulaires à votre documentation :\n\n```html\n\u003cform name=\"contact\" method=\"POST\" data-netlify=\"true\"\u003e\n  \u003cinput type=\"text\" name=\"name\" /\u003e\n  \u003cinput type=\"email\" name=\"email\" /\u003e\n  \u003ctextarea name=\"message\"\u003e\u003c/textarea\u003e\n  \u003cbutton type=\"submit\"\u003eEnvoyer\u003c/button\u003e\n\u003c/form\u003e\n```\n\nNetlify gère automatiquement les soumissions de formulaires. Voir les réponses dans l'onglet Forms.\n\n## Analytique\n\nActivez Netlify Analytics pour des informations sur les visiteurs :\n\n1. Allez dans l'onglet Analytics\n2. Cliquez sur \"Enable Analytics\"\n3. Coûte 9 $/mois (optionnel)\n\nAffiche :\n- Vues de page\n- Pages principales\n- Sources de trafic\n- Données géographiques\n\n## Intégration CI/CD\n\n### GitHub Actions + Netlify\n\nDéployez depuis GitHub Actions pour plus de contrôle :\n\n```yaml\nname: Deploy to Netlify\n\non:\n  push:\n    branches: [main]\n\njobs:\n  deploy:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n\n      - name: Setup Node\n        uses: actions/setup-node@v4\n        with:\n          node-version: '20'\n\n      - name: Install dependencies\n        run: npm ci\n\n      - name: Build\n        run: npm run build:export\n\n      - name: Deploy to Netlify\n        uses: nwtgck/actions-netlify@v2\n        with:\n          publish-dir: './out'\n          production-deploy: true\n        env:\n          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}\n          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}\n```\n\nObtenez votre jeton d'authentification et votre ID de site depuis le tableau de bord Netlify.\n\n## Dépannage\n\n### Échec du build\n\n**Vérifier les journaux de build :**\n- Allez dans Deploys\n- Cliquez sur le déploiement échoué\n- Voir le journal de déploiement\n\n**Problèmes courants :**\n- Incompatibilité de version Node (définir dans `netlify.toml`)\n- Dépendances manquantes (utilisez `npm ci` pas `npm install`)\n- Variables d'environnement non définies\n\n### Actifs 404\n\nAssurez-vous que `netlify.toml` a la redirection SPA :\n\n```toml\n[[redirects]]\n  from = \"/*\"\n  to = \"/index.html\"\n  status = 200\n```\n\n### Les fonctions ne fonctionnent pas\n\nVérifiez les journaux de fonction :\n1. Allez dans l'onglet Functions\n2. Cliquez sur votre fonction\n3. Voir les journaux\n\nAssurez-vous que le chemin de la fonction correspond à la configuration :\n\n```typescript\nexport const config = {\n  path: \"/api/hello\"  // Doit correspondre à votre route\n}\n```\n\n### Problèmes SSL de domaine personnalisé\n\n- Attendez 24 heures pour la propagation DNS\n- Vérifiez les enregistrements DNS avec `dig` ou `nslookup`\n- Vérifiez le statut HTTPS dans Domain settings\n- Essayez de re-provisionner le certificat\n\n## Restaurations\n\nRestaurez instantanément à un déploiement précédent :\n\n1. Allez dans Deploys\n2. Trouvez la version fonctionnelle\n3. Cliquez sur \"Publish deploy\"\n\nVotre site revient immédiatement. Pas d'attente pour les builds.\n\n## Surveillance\n\n### Notifications de déploiement\n\nSoyez notifié lorsque les déploiements réussissent ou échouent :\n\n1. Allez dans Site settings → Build \u0026 deploy → Deploy notifications\n2. Ajoutez une notification (Email, Slack, webhook)\n3. Choisissez les événements (déploiement commencé, réussi, échoué)\n\n### Badge de statut\n\nAjoutez un badge de statut de déploiement à votre README :\n\n```markdown\n[![Netlify Status](https://api.netlify.com/api/v1/badges/SITE_ID/deploy-status)](https://app.netlify.com/sites/SITE_NAME/deploys)\n```\n\n## Tarification\n\nLe niveau gratuit de Netlify comprend :\n- 300 minutes de build/mois\n- 100 Go de bande passante/mois\n- Sites illimités\n- Aperçus de déploiement\n- HTTPS\n- Formulaires (100 soumissions/mois)\n\nPassez à Pro (19 $/mois) pour :\n- Plus de bande passante et de minutes de build\n- Analytique\n- Collaboration d'équipe\n- Support prioritaire\n\n## Meilleures pratiques\n\n**Utiliser `netlify.toml`** - Contrôlez la version de votre configuration de build\n\n**Activer les aperçus de déploiement** - Examinez les changements avant de fusionner\n\n**Configurer les notifications** - Sachez immédiatement quand les déploiements échouent\n\n**Utiliser des variables d'environnement** - Gardez les secrets hors du code\n\n**Configurer les redirections** - Gérez correctement les changements d'URL\n\n**Surveiller l'analytique** - Comprenez comment les utilisateurs naviguent dans vos docs\n\n**Tester localement** - Exécutez `npm run build:export \u0026\u0026 npx serve out` d'abord\n\n## Prochaines étapes\n\n\u003cCardGrid cols={2}\u003e\n  \u003cCard\n    icon=\"triangle\"\n    title=\"Vercel\"\n    description=\"Déployer sur Vercel à la place\"\n    href=\"/docs/v1.0.0/deployment/vercel\"\n  /\u003e\n  \u003cCard\n    icon=\"github\"\n    title=\"GitHub Pages\"\n    description=\"Hébergement gratuit avec GitHub Pages\"\n    href=\"/docs/v1.0.0/deployment/github-pages\"\n  /\u003e\n  \u003cCard\n    icon=\"arrow-left\"\n    title=\"Aperçu du déploiement\"\n    description=\"Voir toutes les options de déploiement\"\n    href=\"/docs/v1.0.0/deployment/overview\"\n  /\u003e\n  \u003cCard\n    icon=\"zap\"\n    title=\"Performance\"\n    description=\"Optimiser votre documentation\"\n    href=\"/docs/v1.0.0/performance\"\n  /\u003e\n\u003c/CardGrid\u003e\n"])</script><script>self.__next_f.push([1,"3b:T1429,"])</script><script>self.__next_f.push([1,"\n## Fonctionnalités de contenu\n\n### Prise en charge de MDX\n\nRédigez la documentation en MDX—Markdown avec des composants React intégrés.\n\n```mdx\n# Bonjour le monde\n\nCeci est du **Markdown** avec un \u003cBadge variant=\"success\"\u003ecomposant React\u003c/Badge\u003e !\n```\n\n\u003cCallout type=\"tip\"\u003e\nMDX vous permet de créer une documentation interactive et dynamique qui va au-delà du texte statique.\n\u003c/Callout\u003e\n\n### Coloration syntaxique\n\nLes blocs de code bénéficient automatiquement de la coloration syntaxique avec numéros de ligne :\n\n```typescript\ninterface User {\n  id: string;\n  name: string;\n  email: string;\n}\n\nfunction greetUser(user: User): string {\n  return `Hello, ${user.name}!`;\n}\n```\n\nLes langages pris en charge incluent JavaScript, TypeScript, Python, Bash, JSON, CSS et bien d'autres.\n\n### Équations mathématiques\n\nRendez des équations mathématiques en utilisant KaTeX :\n\nEn ligne : \u003cMath\u003e{\"E = mc^2\"}\u003c/Math\u003e\n\nBloc :\n\u003cMath block\u003e\n  {\"\\\\int_{-\\\\infty}^{\\\\infty} e^{-x^2} dx = \\\\sqrt{\\\\pi}\"}\n\u003c/Math\u003e\n\n### Diagrammes Mermaid\n\nCréez des diagrammes à partir de texte en utilisant Mermaid :\n\n\u003cMermaid\n  chart={`\n    graph LR\n      A[Écrire MDX] --\u003e B[Construire]\n      B --\u003e C[Déployer]\n      C --\u003e D[Les utilisateurs lisent]\n  `}\n  caption=\"Flux de documentation\"\n/\u003e\n\n## Fonctionnalités de navigation\n\n### Barre latérale automatique\n\nLa barre latérale est générée automatiquement à partir de votre structure de dossiers. Utilisez `_category_.json` pour personnaliser :\n\n```json\n{\n  \"label\": \"Guides\",\n  \"position\": 2,\n  \"collapsible\": true,\n  \"collapsed\": false\n}\n```\n\n### Table des matières\n\nUne table des matières flottante est générée automatiquement à partir de vos titres. Elle met en évidence la section actuelle lorsque vous faites défiler.\n\n### Fil d'Ariane\n\nLa navigation par fil d'Ariane aide les utilisateurs à comprendre leur emplacement dans la hiérarchie de la documentation.\n\n### Sélecteur de version\n\nPrise en charge de plusieurs versions de documentation avec commutation facile :\n\n- `/docs/v1.0.0/getting-started`\n- `/docs/v2.0.0/getting-started`\n- `/docs/next/getting-started` (non publié)\n\n## Recherche\n\n### Recherche en texte intégral\n\nPropulsé par Meilisearch pour des résultats de recherche instantanés et tolérants aux fautes de frappe.\n\n- **Raccourci clavier** : Appuyez sur `⌘K` ou `Ctrl+K` pour ouvrir la recherche\n- **Tolérance aux fautes de frappe** : Trouve des résultats même avec des fautes d'orthographe\n- **Résultats surlignés** : Voyez où votre requête correspond\n\n### Indexation de recherche\n\nLa documentation est automatiquement indexée au moment de la construction pour une recherche rapide.\n\n## Thème et style\n\n### Mode sombre\n\nMode sombre automatique qui respecte les préférences du système :\n\n- Mode clair\n- Mode sombre\n- Préférence système (auto)\n\nBasculez avec le bouton dans l'en-tête.\n\n### Design personnalisable\n\nTout le style est basé sur des variables CSS et Tailwind, ce qui facilite la personnalisation :\n\n```css\n:root {\n  --primary: oklch(0.55 0.22 264.376);\n  --background: oklch(1 0 0);\n  --foreground: oklch(0.145 0 0);\n}\n```\n\n## Composants\n\n### Bibliothèque de composants riche\n\nComposants intégrés pour les modèles de documentation courants :\n\n\u003cCardGrid cols={3}\u003e\n  \u003cCard icon=\"message-square\" title=\"Callouts\" description=\"Alertes d'info, avertissement, conseil, erreur\" /\u003e\n  \u003cCard icon=\"layers\" title=\"Onglets\" description=\"Sections de contenu par onglets\" /\u003e\n  \u003cCard icon=\"list\" title=\"Étapes\" description=\"Guides étape par étape\" /\u003e\n  \u003cCard icon=\"chevrons-up-down\" title=\"Accordéon\" description=\"Contenu pliable\" /\u003e\n  \u003cCard icon=\"grid\" title=\"Cartes\" description=\"Cartes de fonctionnalités avec icônes\" /\u003e\n  \u003cCard icon=\"code\" title=\"Blocs de code\" description=\"Code avec coloration syntaxique\" /\u003e\n\u003c/CardGrid\u003e\n\nVoir la section [Composants](/docs/v1.0.0/components) pour la documentation sur chaque composant.\n\n## Expérience développeur\n\n### Rechargement à chaud\n\nLes modifications apportées aux fichiers MDX sont instantanément reflétées sans rafraîchissement complet de la page.\n\n### Validation Frontmatter\n\nLes champs Frontmatter sont validés au moment de la construction pour détecter les erreurs tôt.\n\n### Optimisation SEO\n\nBalises méta automatiques, images OpenGraph et données structurées à partir du frontmatter :\n\n- Balises de titre et de description\n- Cartes OpenGraph et Twitter\n- URL canoniques\n- Génération de plan de site\n\n### Temps de lecture\n\nCalcul automatique et affichage du temps de lecture estimé pour chaque page.\n\n## Fonctionnalités de production\n\n### Génération statique\n\nToutes les pages sont pré-rendues au moment de la construction pour une performance maximale :\n\n- Zéro JavaScript requis pour le contenu\n- Compatible avec la mise en cache en périphérie\n- Temps rapide jusqu'au premier octet (TTFB)\n\n### Performance\n\n- Score Lighthouse : 90+ (bureau)\n- Images chargées paresseusement avec Next.js Image\n- Découpage de code pour les composants\n\n### Accessibilité\n\n- Navigation au clavier\n- Prise en charge des lecteurs d'écran\n- Prise en charge du contraste élevé\n- Gestion du focus\n"])</script><script>self.__next_f.push([1,"3c:T1429,"])</script><script>self.__next_f.push([1,"\n## Fonctionnalités de contenu\n\n### Prise en charge de MDX\n\nRédigez la documentation en MDX—Markdown avec des composants React intégrés.\n\n```mdx\n# Bonjour le monde\n\nCeci est du **Markdown** avec un \u003cBadge variant=\"success\"\u003ecomposant React\u003c/Badge\u003e !\n```\n\n\u003cCallout type=\"tip\"\u003e\nMDX vous permet de créer une documentation interactive et dynamique qui va au-delà du texte statique.\n\u003c/Callout\u003e\n\n### Coloration syntaxique\n\nLes blocs de code bénéficient automatiquement de la coloration syntaxique avec numéros de ligne :\n\n```typescript\ninterface User {\n  id: string;\n  name: string;\n  email: string;\n}\n\nfunction greetUser(user: User): string {\n  return `Hello, ${user.name}!`;\n}\n```\n\nLes langages pris en charge incluent JavaScript, TypeScript, Python, Bash, JSON, CSS et bien d'autres.\n\n### Équations mathématiques\n\nRendez des équations mathématiques en utilisant KaTeX :\n\nEn ligne : \u003cMath\u003e{\"E = mc^2\"}\u003c/Math\u003e\n\nBloc :\n\u003cMath block\u003e\n  {\"\\\\int_{-\\\\infty}^{\\\\infty} e^{-x^2} dx = \\\\sqrt{\\\\pi}\"}\n\u003c/Math\u003e\n\n### Diagrammes Mermaid\n\nCréez des diagrammes à partir de texte en utilisant Mermaid :\n\n\u003cMermaid\n  chart={`\n    graph LR\n      A[Écrire MDX] --\u003e B[Construire]\n      B --\u003e C[Déployer]\n      C --\u003e D[Les utilisateurs lisent]\n  `}\n  caption=\"Flux de documentation\"\n/\u003e\n\n## Fonctionnalités de navigation\n\n### Barre latérale automatique\n\nLa barre latérale est générée automatiquement à partir de votre structure de dossiers. Utilisez `_category_.json` pour personnaliser :\n\n```json\n{\n  \"label\": \"Guides\",\n  \"position\": 2,\n  \"collapsible\": true,\n  \"collapsed\": false\n}\n```\n\n### Table des matières\n\nUne table des matières flottante est générée automatiquement à partir de vos titres. Elle met en évidence la section actuelle lorsque vous faites défiler.\n\n### Fil d'Ariane\n\nLa navigation par fil d'Ariane aide les utilisateurs à comprendre leur emplacement dans la hiérarchie de la documentation.\n\n### Sélecteur de version\n\nPrise en charge de plusieurs versions de documentation avec commutation facile :\n\n- `/docs/v1.0.0/getting-started`\n- `/docs/v2.0.0/getting-started`\n- `/docs/next/getting-started` (non publié)\n\n## Recherche\n\n### Recherche en texte intégral\n\nPropulsé par Meilisearch pour des résultats de recherche instantanés et tolérants aux fautes de frappe.\n\n- **Raccourci clavier** : Appuyez sur `⌘K` ou `Ctrl+K` pour ouvrir la recherche\n- **Tolérance aux fautes de frappe** : Trouve des résultats même avec des fautes d'orthographe\n- **Résultats surlignés** : Voyez où votre requête correspond\n\n### Indexation de recherche\n\nLa documentation est automatiquement indexée au moment de la construction pour une recherche rapide.\n\n## Thème et style\n\n### Mode sombre\n\nMode sombre automatique qui respecte les préférences du système :\n\n- Mode clair\n- Mode sombre\n- Préférence système (auto)\n\nBasculez avec le bouton dans l'en-tête.\n\n### Design personnalisable\n\nTout le style est basé sur des variables CSS et Tailwind, ce qui facilite la personnalisation :\n\n```css\n:root {\n  --primary: oklch(0.55 0.22 264.376);\n  --background: oklch(1 0 0);\n  --foreground: oklch(0.145 0 0);\n}\n```\n\n## Composants\n\n### Bibliothèque de composants riche\n\nComposants intégrés pour les modèles de documentation courants :\n\n\u003cCardGrid cols={3}\u003e\n  \u003cCard icon=\"message-square\" title=\"Callouts\" description=\"Alertes d'info, avertissement, conseil, erreur\" /\u003e\n  \u003cCard icon=\"layers\" title=\"Onglets\" description=\"Sections de contenu par onglets\" /\u003e\n  \u003cCard icon=\"list\" title=\"Étapes\" description=\"Guides étape par étape\" /\u003e\n  \u003cCard icon=\"chevrons-up-down\" title=\"Accordéon\" description=\"Contenu pliable\" /\u003e\n  \u003cCard icon=\"grid\" title=\"Cartes\" description=\"Cartes de fonctionnalités avec icônes\" /\u003e\n  \u003cCard icon=\"code\" title=\"Blocs de code\" description=\"Code avec coloration syntaxique\" /\u003e\n\u003c/CardGrid\u003e\n\nVoir la section [Composants](/docs/v1.0.0/components) pour la documentation sur chaque composant.\n\n## Expérience développeur\n\n### Rechargement à chaud\n\nLes modifications apportées aux fichiers MDX sont instantanément reflétées sans rafraîchissement complet de la page.\n\n### Validation Frontmatter\n\nLes champs Frontmatter sont validés au moment de la construction pour détecter les erreurs tôt.\n\n### Optimisation SEO\n\nBalises méta automatiques, images OpenGraph et données structurées à partir du frontmatter :\n\n- Balises de titre et de description\n- Cartes OpenGraph et Twitter\n- URL canoniques\n- Génération de plan de site\n\n### Temps de lecture\n\nCalcul automatique et affichage du temps de lecture estimé pour chaque page.\n\n## Fonctionnalités de production\n\n### Génération statique\n\nToutes les pages sont pré-rendues au moment de la construction pour une performance maximale :\n\n- Zéro JavaScript requis pour le contenu\n- Compatible avec la mise en cache en périphérie\n- Temps rapide jusqu'au premier octet (TTFB)\n\n### Performance\n\n- Score Lighthouse : 90+ (bureau)\n- Images chargées paresseusement avec Next.js Image\n- Découpage de code pour les composants\n\n### Accessibilité\n\n- Navigation au clavier\n- Prise en charge des lecteurs d'écran\n- Prise en charge du contraste élevé\n- Gestion du focus\n"])</script><script>self.__next_f.push([1,"3d:T2388,"])</script><script>self.__next_f.push([1,"\n# Configuration de la recherche\n\nSpecra prend en charge une recherche puissante en texte intégral grâce à l'intégration de MeiliSearch. Ce guide vous montre comment configurer la recherche pour votre documentation.\n\n## Options de recherche\n\nSpecra propose deux solutions de recherche :\n\n**Recherche locale** (Par défaut)\n- Fonctionne immédiatement\n- Pas de dépendances externes\n- Bon pour les sites de doc petits à moyens\n- Recherche dans le navigateur\n\n**MeiliSearch** (Recommandé pour la production)\n- Moteur de recherche ultra-rapide\n- Tolérance aux fautes de frappe\n- Résultats instantanés\n- Mieux pour les grands sites de doc\n- Nécessite un serveur séparé\n\n## Démarrage rapide avec MeiliSearch\n\n### Prérequis\n\n- Docker (configuration la plus simple) ou capacité à exécuter un serveur MeiliSearch\n- Votre site de documentation déjà configuré avec Specra\n\n### Installation\n\n\u003cSteps\u003e\n  \u003cStep title=\"Exécuter MeiliSearch avec Docker\"\u003e\n    Le moyen le plus simple de faire fonctionner MeiliSearch localement :\n\n```bash\ndocker run -d \\\n  --name meilisearch \\\n  -p 7700:7700 \\\n  -e MEILI_MASTER_KEY=\"aSampleMasterKey\" \\\n  -v $(pwd)/meili_data:/meili_data \\\n  getmeili/meilisearch:latest\n```\n\nCela démarre MeiliSearch sur `http://localhost:7700` avec une clé principale pour l'authentification.\n\n\u003cCallout type=\"warning\"\u003e\n  Utilisez une clé principale forte en production ! Cette clé d'exemple est uniquement pour le développement.\n\u003c/Callout\u003e\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Configurer Specra\"\u003e\n    Mettez à jour votre `specra.config.json` :\n\n```json\n{\n  \"search\": {\n    \"enabled\": true,\n    \"provider\": \"meilisearch\",\n    \"placeholder\": \"Rechercher dans la documentation...\",\n    \"meilisearch\": {\n      \"host\": \"http://localhost:7700\",\n      \"apiKey\": \"aSampleMasterKey\",\n      \"indexName\": \"docs\"\n    }\n  }\n}\n```\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Indexer votre contenu\"\u003e\n    Specra inclut des utilitaires d'indexation. Exécutez ceci depuis la racine de votre projet :\n\n```bash\nnpm run index:search\n```\n\nCela scanne votre dossier `docs/` et envoie tout le contenu à MeiliSearch pour l'indexation.\n\n\u003cCallout type=\"info\"\u003e\n  Réexécutez la commande d'indexation chaque fois que vous ajoutez ou mettez à jour la documentation.\n\u003c/Callout\u003e\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Tester la recherche\"\u003e\n    Démarrez votre serveur de développement :\n\n```bash\nnpm run dev\n```\n\nAppuyez sur **⌘K** (Mac) ou **Ctrl+K** (Windows/Linux) pour ouvrir le modal de recherche. Commencez à taper pour voir des résultats instantanés !\n  \u003c/Step\u003e\n\u003c/Steps\u003e\n\n## Configuration de MeiliSearch\n\n### Options de configuration\n\nTous les paramètres MeiliSearch vont dans `specra.config.json` sous la section `search` :\n\n```json\n{\n  \"search\": {\n    \"enabled\": true,\n    \"provider\": \"meilisearch\",\n    \"placeholder\": \"Rechercher docs...\",\n    \"meilisearch\": {\n      \"host\": \"http://localhost:7700\",\n      \"apiKey\": \"your-api-key\",\n      \"indexName\": \"docs\"\n    }\n  }\n}\n```\n\n**Référence des champs :**\n\n| Champ | Type | Description |\n|-------|------|-------------|\n| `enabled` | boolean | Activer/désactiver la fonctionnalité de recherche |\n| `provider` | string | \"meilisearch\" ou \"local\" |\n| `placeholder` | string | Texte indicatif dans la zone de recherche |\n| `meilisearch.host` | string | URL du serveur MeiliSearch |\n| `meilisearch.apiKey` | string | Clé API pour l'authentification |\n| `meilisearch.indexName` | string | Nom de l'index pour vos docs |\n\n### Clé de recherche vs Clé principale\n\nMeiliSearch utilise deux types de clés :\n\n**Clé principale** (développement)\n- Accès complet à toutes les opérations\n- Utilisé pour indexer le contenu\n- Ne jamais exposer dans le code côté client en production\n\n**Clé de recherche** (production)\n- Accès en lecture seule\n- Sûr à utiliser dans le navigateur\n- Générer à partir de la clé principale\n\nGénérez une clé de recherche :\n\n```bash\ncurl -X POST 'http://localhost:7700/keys' \\\n  -H 'Authorization: Bearer aSampleMasterKey' \\\n  -H 'Content-Type: application/json' \\\n  --data-binary '{\n    \"description\": \"Clé de recherche pour la documentation\",\n    \"actions\": [\"search\"],\n    \"indexes\": [\"docs\"],\n    \"expiresAt\": null\n  }'\n```\n\nUtilisez la clé retournée dans votre configuration de production.\n\n## Déploiement en production\n\n### Hébergement de MeiliSearch\n\nPour la production, vous devez héberger MeiliSearch séparément de vos docs. Options :\n\n**MeiliSearch Cloud** (Le plus simple)\n- Hébergement géré officiel\n- Commence à 0,02 $/heure\n- Sauvegardes et mises à jour automatiques\n- Visitez [meilisearch.com/cloud](https://www.meilisearch.com/cloud)\n\n**Auto-hébergé sur VPS**\n- DigitalOcean, AWS, Google Cloud, etc.\n- Plus de contrôle, nécessite une maintenance\n- Utilisez Docker ou une installation binaire\n\n**Railway / Render / Fly.io**\n- Options de déploiement en un clic disponibles\n- Bon pour les projets petits à moyens\n\n### Configuration de production\n\nMettez à jour `specra.config.json` pour la production :\n\n```json\n{\n  \"search\": {\n    \"enabled\": true,\n    \"provider\": \"meilisearch\",\n    \"meilisearch\": {\n      \"host\": \"https://your-meilisearch-domain.com\",\n      \"apiKey\": \"your-public-search-key\",\n      \"indexName\": \"docs\"\n    }\n  }\n}\n```\n\n\u003cCallout type=\"warning\"\u003e\n  Utilisez toujours une clé API de recherche uniquement en production, jamais votre clé principale !\n\u003c/Callout\u003e\n\n### Indexation dans CI/CD\n\nAutomatisez l'indexation lorsque vous déployez. Exemple GitHub Action :\n\n```yaml\nname: Index Documentation\n\non:\n  push:\n    branches: [main]\n    paths:\n      - 'docs/**'\n\njobs:\n  index:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v3\n\n      - name: Setup Node.js\n        uses: actions/setup-node@v3\n        with:\n          node-version: '18'\n\n      - name: Install dependencies\n        run: npm ci\n\n      - name: Index documentation\n        env:\n          MEILISEARCH_HOST: ${{ secrets.MEILISEARCH_HOST }}\n          MEILISEARCH_API_KEY: ${{ secrets.MEILISEARCH_MASTER_KEY }}\n        run: npm run index:search\n```\n\nStockez vos identifiants MeiliSearch en tant que secrets GitHub.\n\n## Personnalisation du comportement de recherche\n\n### Paramètres de recherche\n\nConfigurez comment MeiliSearch gère les recherches :\n\n```javascript\n// Dans votre script d'indexation\nconst settings = {\n  searchableAttributes: [\n    'title',\n    'description',\n    'content',\n    'headings'\n  ],\n  displayedAttributes: [\n    'title',\n    'description',\n    'url',\n    'breadcrumb'\n  ],\n  rankingRules: [\n    'words',\n    'typo',\n    'proximity',\n    'attribute',\n    'sort',\n    'exactness'\n  ],\n  stopWords: ['the', 'a', 'an'],\n  synonyms: {\n    'js': ['javascript'],\n    'ts': ['typescript']\n  }\n}\n```\n\n### Filtres\n\nAjoutez des filtres pour affiner les résultats de recherche :\n\n```json\n{\n  \"search\": {\n    \"meilisearch\": {\n      \"filters\": \"version = 'v1.0.0'\"\n    }\n  }\n}\n```\n\nCela affiche uniquement les résultats d'une version spécifique.\n\n## Recherche locale (Alternative)\n\nSi vous ne voulez pas exécuter MeiliSearch, utilisez la recherche locale :\n\n```json\n{\n  \"search\": {\n    \"enabled\": true,\n    \"provider\": \"local\",\n    \"placeholder\": \"Rechercher dans la documentation...\"\n  }\n}\n```\n\nRecherche locale :\n- ✅ Fonctionne immédiatement, aucune installation\n- ✅ Aucune dépendance externe\n- ✅ Gratuit\n- ❌ Moins puissant que MeiliSearch\n- ❌ Pas de tolérance aux fautes de frappe\n- ❌ Plus lent pour les grands sites de doc\n\nLa recherche locale est automatiquement construite pendant `npm run build`.\n\n## Raccourcis clavier\n\nLes utilisateurs peuvent déclencher la recherche avec :\n\n- **⌘K** ou **Ctrl+K** - Ouvrir la recherche\n- **Échap** - Fermer la recherche\n- **↑↓** - Naviguer dans les résultats\n- **Entrée** - Aller au résultat sélectionné\n\nCeux-ci fonctionnent avec les options locales et MeiliSearch.\n\n## Dépannage\n\n### La recherche n'apparaît pas\n\n**Vérifiez la configuration :**\n```json\n{\n  \"search\": {\n    \"enabled\": true  // ← Doit être true\n  }\n}\n```\n\n**Vérifiez que MeiliSearch est en cours d'exécution :**\n```bash\ncurl http://localhost:7700/health\n```\n\nDevrait renvoyer `{\"status\":\"available\"}`.\n\n### Aucun résultat de recherche\n\n**Réindexez votre contenu :**\n```bash\nnpm run index:search\n```\n\n**Vérifiez que l'index existe :**\n```bash\ncurl -X GET 'http://localhost:7700/indexes' \\\n  -H 'Authorization: Bearer aSampleMasterKey'\n```\n\n### Erreurs CORS\n\nSi vous obtenez des erreurs CORS dans la console du navigateur, configurez MeiliSearch pour autoriser votre domaine :\n\n```bash\ndocker run -d \\\n  --name meilisearch \\\n  -p 7700:7700 \\\n  -e MEILI_MASTER_KEY=\"aSampleMasterKey\" \\\n  -e MEILI_HTTP_ADDR=\"0.0.0.0:7700\" \\\n  -e MEILI_NO_ANALYTICS=true \\\n  getmeili/meilisearch:latest\n```\n\nOu définissez les en-têtes CORS dans votre proxy inverse.\n\n### Indexation lente\n\nPour les grands sites de documentation (1000+ pages) :\n\n- Indexez de manière incrémentielle (uniquement les fichiers modifiés)\n- Utilisez des requêtes par lots\n- Augmentez l'allocation de mémoire MeiliSearch\n- Exécutez l'indexation dans des tâches en arrière-plan\n"])</script><script>self.__next_f.push([1,"3e:T2388,"])</script><script>self.__next_f.push([1,"\n# Configuration de la recherche\n\nSpecra prend en charge une recherche puissante en texte intégral grâce à l'intégration de MeiliSearch. Ce guide vous montre comment configurer la recherche pour votre document docs/` et envoie tout le contenu à MeiliSearch pour l'indexation.\n\n\u003cCallout type=\"info\"\u003e\n  Réexécutez la commande d'indexation chaque fois que vous ajoutez ou mettez à jour la documentation.\n\u003c/Callout\u003e\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Tester la recherche\"\u003e\n    Démarrez votre serveur de développement :\n\n```bash\nnpm run dev\n```\n\nAppuyez sur **⌘K** (Mac) ou **Ctrl+K** (Windows/Linux) pour ouvrir le modal de recherche. Commencez à taper pour voir des résultats instantanés !\n  \u003c/Step\u003e\n\u003c/Steps\u003e\n\n## Configuration de MeiliSearch\n\n### Options de configuration\n\nTous les paramètres MeiliSearch vont dans `specra.config.json` sous la section `search` :\n\n```json\n{\n  \"search\": {\n    \"enabled\": true,\n    \"provider\": \"meilisearch\",\n    \"placeholder\": \"Rechercher docs...\",\n    \"meilisearch\": {\n      \"host\": \"http://localhost:7700\",\n      \"apiKey\": \"your-api-key\",\n      \"indexName\": \"docs\"\n    }\n  }\n}\n```\n\n**Référence des champs :**\n\n| Champ | Type | Description |\n|-------|------|-------------|\n| `enabled` | boolean | Activer/désactiver la fonctionnalité de recherche |\n| `provider` | string | \"meilisearch\" ou \"local\" |\n| `placeholder` | string | Texte indicatif dans la zone de recherche |\n| `meilisearch.host` | string | URL du serveur MeiliSearch |\n| `meilisearch.apiKey` | string | Clé API pour l'authentification |\n| `meilisearch.indexName` | string | Nom de l'index pour vos docs |\n\n### Clé de recherche vs Clé principale\n\nMeiliSearch utilise deux types de clés :\n\n**Clé principale** (développement)\n- Accès complet à toutes les opérations\n- Utilisé pour indexer le contenu\n- Ne jamais exposer dans le code côté client en production\n\n**Clé de recherche** (production)\n- Accès en lecture seule\n- Sûr à utiliser dans le navigateur\n- Générer à partir de la clé principale\n\nGénérez une clé de recherche :\n\n```bash\ncurl -X POST 'http://localhost:7700/keys' \\\n  -H 'Authorization: Bearer aSampleMasterKey' \\\n  -H 'Content-Type: application/json' \\\n  --data-binary '{\n    \"description\": \"Clé de recherche pour la documentation\",\n    \"actions\": [\"search\"],\n    \"indexes\": [\"docs\"],\n    \"expiresAt\": null\n  }'\n```\n\nUtilisez la clé retournée dans votre configuration de production.\n\n## Déploiement en production\n\n### Hébergement de MeiliSearch\n\nPour la production, vous devez héberger MeiliSearch séparément de vos docs. Options :\n\n**MeiliSearch Cloud** (Le plus simple)\n- Hébergement géré officiel\n- Commence à 0,02 $/heure\n- Sauvegardes et mises à jour automatiques\n- Visitez [meilisearch.com/cloud](https://www.meilisearch.com/cloud)\n\n**Auto-hébergé sur VPS**\n- DigitalOcean, AWS, Google Cloud, etc.\n- Plus de contrôle, nécessite une maintenance\n- Utilisez Docker ou une installation binaire\n\n**Railway / Render / Fly.io**\n- Options de déploiement en un clic disponibles\n- Bon pour les projets petits à moyens\n\n### Configuration de production\n\nMettez à jour `specra.config.json` pour la production :\n\n```json\n{\n  \"search\": {\n    \"enabled\": true,\n    \"provider\": \"meilisearch\",\n    \"meilisearch\": {\n      \"host\": \"https://your-meilisearch-domain.com\",\n      \"apiKey\": \"your-public-search-key\",\n      \"indexName\": \"docs\"\n    }\n  }\n}\n```\n\n\u003cCallout type=\"warning\"\u003e\n  Utilisez toujours une clé API de recherche uniquement en production, jamais votre clé principale !\n\u003c/Callout\u003e\n\n### Indexation dans CI/CD\n\nAutomatisez l'indexation lorsque vous déployez. Exemple GitHub Action :\n\n```yaml\nname: Index Documentation\n\non:\n  push:\n    branches: [main]\n    paths:\n      - 'docs/**'\n\njobs:\n  index:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v3\n\n      - name: Setup Node.js\n        uses: actions/setup-node@v3\n        with:\n          node-version: '18'\n\n      - name: Install dependencies\n        run: npm ci\n\n      - name: Index documentation\n        env:\n          MEILISEARCH_HOST: ${{ secrets.MEILISEARCH_HOST }}\n          MEILISEARCH_API_KEY: ${{ secrets.MEILISEARCH_MASTER_KEY }}\n        run: npm run index:search\n```\n\nStockez vos identifiants MeiliSearch en tant que secrets GitHub.\n\n## Personnalisation du comportement de recherche\n\n### Paramètres de recherche\n\nConfigurez comment MeiliSearch gère les recherches :\n\n```javascript\n// Dans votre script d'indexation\nconst settings = {\n  searchableAttributes: [\n    'title',\n    'description',\n    'content',\n    'headings'\n  ],\n  displayedAttributes: [\n    'title',\n    'description',\n    'url',\n    'breadcrumb'\n  ],\n  rankingRules: [\n    'words',\n    'typo',\n    'proximity',\n    'attribute',\n    'sort',\n    'exactness'\n  ],\n  stopWords: ['the', 'a', 'an'],\n  synonyms: {\n    'js': ['javascript'],\n    'ts': ['typescript']\n  }\n}\n```\n\n### Filtres\n\nAjoutez des filtres pour affiner les résultats de recherche :\n\n```json\n{\n  \"search\": {\n    \"meilisearch\": {\n      \"filters\": \"version = 'v1.0.0'\"\n    }\n  }\n}\n```\n\nCela affiche uniquement les résultats d'une version spécifique.\n\n## Recherche locale (Alternative)\n\nSi vous ne voulez pas exécuter MeiliSearch, utilisez la recherche locale :\n\n```json\n{\n  \"search\": {\n    \"enabled\": true,\n    \"provider\": \"local\",\n    \"placeholder\": \"Rechercher dans la documentation...\"\n  }\n}\n```\n\nRecherche locale :\n- ✅ Fonctionne immédiatement, aucune installation\n- ✅ Aucune dépendance externe\n- ✅ Gratuit\n- ❌ Moins puissant que MeiliSearch\n- ❌ Pas de tolérance aux fautes de frappe\n- ❌ Plus lent pour les grands sites de doc\n\nLa recherche locale est automatiquement construite pendant `npm run build`.\n\n## Raccourcis clavier\n\nLes utilisateurs peuvent déclencher la recherche avec :\n\n- **⌘K** ou **Ctrl+K** - Ouvrir la recherche\n- **Échap** - Fermer la recherche\n- **↑↓** - Naviguer dans les résultats\n- **Entrée** - Aller au résultat sélectionné\n\nCeux-ci fonctionnent avec les options locales et MeiliSearch.\n\n## Dépannage\n\n### La recherche n'apparaît pas\n\n**Vérifiez la configuration :**\n```json\n{\n  \"search\": {\n    \"enabled\": true  // ← Doit être true\n  }\n}\n```\n\n**Vérifiez que MeiliSearch est en cours d'exécution :**\n```bash\ncurl http://localhost:7700/health\n```\n\nDevrait renvoyer `{\"status\":\"available\"}`.\n\n### Aucun résultat de recherche\n\n**Réindexez votre contenu :**\n```bash\nnpm run index:search\n```\n\n**Vérifiez que l'index existe :**\n```bash\ncurl -X GET 'http://localhost:7700/indexes' \\\n  -H 'Authorization: Bearer aSampleMasterKey'\n```\n\n### Erreurs CORS\n\nSi vous obtenez des erreurs CORS dans la console du navigateur, configurez MeiliSearch pour autoriser votre domaine :\n\n```bash\ndocker run -d \\\n  --name meilisearch \\\n  -p 7700:7700 \\\n  -e MEILI_MASTER_KEY=\"aSampleMasterKey\" \\\n  -e MEILI_HTTP_ADDR=\"0.0.0.0:7700\" \\\n  -e MEILI_NO_ANALYTICS=true \\\n  getmeili/meilisearch:latest\n```\n\nOu définissez les en-têtes CORS dans votre proxy inverse.\n\n### Indexation lente\n\nPour les grands sites de documentation (1000+ pages) :\n\n- Indexez de manière incrémentielle (uniquement les fichiers modifiés)\n- Utilisez des requêtes par lots\n- Augmentez l'allocation de mémoire MeiliSearch\n- Exécutez l'indexation dans des tâches en arrière-plan\n"])</script><script>self.__next_f.push([1,"3f:T80d,"])</script><script>self.__next_f.push([1,"\nCette page montre la génération automatique de documentation API à partir d'une **collection Postman v2.1**.\n\nExportez votre collection Postman et déposez-la - la documentation est générée automatiquement !\n\n\u003cCallout type=\"success\" title=\"Fonctionne avec Postman !\"\u003e\nExportez simplement votre collection depuis Postman (v2.0 ou v2.1) et référencez-la ici. Aucune conversion nécessaire !\n\u003c/Callout\u003e\n\n---\n\n\u003cApiReference spec=\"/api-specs/postman-example.json\" /\u003e\n\n---\n\n## À propos de cet exemple\n\nCet exemple montre comment l'analyseur gère :\n\n- ✅ Détection du format **Collection Postman v2.x**\n- ✅ **Organisation des dossiers** (éléments imbriqués aplatis)\n- ✅ **Variables d'environnement** (interpolation `{{baseUrl}}`)\n- ✅ **Paramètres de chemin** (syntaxe `:id` préservée)\n- ✅ **Paramètres de requête** avec descriptions\n- ✅ **Corps de requête** (raw, form-data, urlencoded)\n- ✅ **Exemples de réponse** à partir de réponses enregistrées\n- ✅ **Authentification** (Bearer, API Key, Basic)\n\n## Comment utiliser votre collection Postman\n\n### Étape 1 : Exporter depuis Postman\n\n1. Ouvrez votre collection dans Postman\n2. Cliquez sur le menu à **trois points** (•••)\n3. Sélectionnez **Exporter**\n4. Choisissez **Collection v2.1** (recommandé)\n5. Enregistrez le fichier JSON\n\n### Étape 2 : Ajouter à vos documents\n\n1. **Placez le fichier** dans `/public/api-specs/`\n2. **Référencez-le** dans votre MDX :\n\n```mdx\n\u003cApiReference spec=\"/api-specs/my-collection.json\" parser=\"postman\" /\u003e\n```\n\nOu utilisez la détection automatique :\n\n```mdx\n\u003cApiReference spec=\"/api-specs/my-collection.json\" /\u003e\n```\n\n### Étape 3 : Profitez !\n\nVotre collection Postman entière est maintenant magnifiquement documentée avec :\n- Playground interactif pour les tests\n- Extraction automatique des paramètres\n- Exemples de réponse\n- Informations d'authentification\n\n\u003cCallout type=\"tip\" title=\"Conseil de pro\"\u003e\nGardez votre collection Postman à jour et réexportez-la simplement pour mettre à jour votre documentation !\n\u003c/Callout\u003e\n"])</script><script>self.__next_f.push([1,"40:T80d,"])</script><script>self.__next_f.push([1,"\nCette page montre la génération automatique de documentation API à partir d'une **collection Postman v2.1**.\n\nExportez votre collection Postman et déposez-la - la documentation est générée automatiquement !\n\n\u003cCallout type=\ h([1,"\nLes cartes créent des blocs de contenu visuellement distincts, parfaits pour les listes de fonctionnalités, les liens de navigation ou le contenu mis en évidence.\n\n## Utilisation\n\n```mdx\n\u003cCard \n  title=\"Démarrage\" \n  description=\"Apprenez les bases de notre plateforme\"\n  href=\"/docs/v1.0.0/getting-started\"\n/\u003e\n```\n\n## Exemples en direct\n\n### Carte simple\n\n\u003cCard \n  title=\"Documentation\" \n  description=\"Lisez la documentation complète pour des guides détaillés et des références API.\"\n/\u003e\n\n### Carte liée\n\n\u003cCard \n  title=\"Démarrage\" \n  description=\"Commencez votre voyage avec notre guide de démarrage rapide\"\n  href=\"/docs/v1.0.0/getting-started\"\n/\u003e\n\n### Carte avec icône\n\n\u003cCard \n  icon=\"book-open\"\n  title=\"Guides\" \n  description=\"Tutoriels étape par étape et meilleures pratiques\"\n/\u003e\n\n### Lien externe\n\n\u003cCard \n  title=\"Dépôt GitHub\" \n  description=\"Voir le code source et contribuer\"\n  href=\"https://github.com\"\n  external\n/\u003e\n\n## Grille de cartes\n\nUtilisez `CardGrid` pour afficher plusieurs cartes dans une disposition en grille responsive :\n\n```mdx\n\u003cCardGrid cols={2}\u003e\n  \u003cCard title=\"Carte 1\" description=\"Première carte\" /\u003e\n  \u003cCard title=\"Carte 2\" description=\"Deuxième carte\" /\u003e\n\u003c/CardGrid\u003e\n```\n\n\u003cCardGrid cols={2}\u003e\n  \u003cCard icon=\"rocket\" title=\"Démarrage rapide\" description=\"Lancez-vous en 5 minutes\" href=\"/docs/v1.0.0/getting-started/quickstart\" /\u003e\n  \u003cCard icon=\"book\" title=\"Guides\" description=\"Tutoriels approfondis et procédures pas à pas\" href=\"/docs/v1.0.0/guides\" /\u003e\n  \u003cCard icon=\"code\" title=\"Référence API\" description=\"Documentation API complète\" /\u003e\n  \u003cCard icon=\"github\" title=\"GitHub\" description=\"Contribuer au projet\" href=\"https://github.com\" external /\u003e\n\u003c/CardGrid\u003e\n\n## Props\n\n### Card\n\n| Prop | Type | Défaut | Description |\n|------|------|--------|-------------|\n| `title` | `string` | requis | Titre de la carte |\n| `description` | `string` | - | Texte de description de la carte |\n| `href` | `string` | - | URL du lien (rend la carte cliquable) |\n| `icon` | `string \\| ReactNode` | - | Nom de l'icône Lucide ou icône personnalisée |\n| `external` | `boolean` | `false` | Ouvre le lien dans un nouvel onglet |\n| `children` | `ReactNode` | - | Contenu personnalisé |\n\n### CardGrid\n\n| Prop | Type | Défaut | Description |\n|------|------|--------|-------------|\n| `children` | `ReactNode` | requis | Composants de carte |\n| `cols` | `1 \\| 2 \\| 3` | `2` | Nombre de colonnes |\n"])</script><script>self.__next_f.push([1,"42:T981,"])</script><script>self.__next_f.push([1,"\nLes cartes créent des blocs de contenu visuellement distincts, parfaits pour les listes de fonctionnalités, les liens de navigation ou le contenu mis en évidence.\n\n## Utilisation\n\n```mdx\n\u003cCard \n  title=\"Démarrage\" \n  description=\"Apprenez les bases de notre plateforme\"\n  href=\"/docs/v1.0.0/getting-started\"\n/\u003e\n```\n\n## Exemples en direct\n\n### Carte simple\n\n\u003cCard \n  title=\"Documentation\" \n  description=\"Lisez la documentation complète pour des guides détaillés et des références API.\"\n/\u003e\n\n### Carte liée\n\n\u003cCard \n  title=\"Démarrage\" \n  description=\"Commencez votre voyage avec notre guide de démarrage rapide\"\n  href=\"/docs/v1.0.0/getting-started\"\n/\u003e\n\n### Carte avec icône\n\n\u003cCard \n  icon=\"book-open\"\n  title=\"Guides\" \n  description=\"Tutoriels étape par étape et meilleures pratiques\"\n/\u003e\n\n### Lien externe\n\n\u003cCard \n  title=\"Dépôt GitHub\" \n  description=\"Voir le code source et contribuer\"\n  href=\"https://github.com\"\n  external\n/\u003e\n\n## Grille de cartes\n\nUtilisez `CardGrid` pour afficher plusieurs cartes dans une disposition en grille responsive :\n\n```mdx\n\u003cCardGrid cols={2}\u003e\n  \u003cCard title=\"Carte 1\" description=\"Première carte\" /\u003e\n  \u003cCard title=\"Carte 2\" description=\"Deuxième carte\" /\u003e\n\u003c/CardGrid\u003e\n```\n\n\u003cCardGrid cols={2}\u003e\n  \u003cCard icon=\"rocket\" title=\"Démarrage rapide\" description=\"Lancez-vous en 5 minutes\" href=\"/docs/v1.0.0/getting-started/quickstart\" /\u003e\n  \u003cCard icon=\"book\" title=\"Guides\" description=\"Tutoriels approfondis et procédures pas à pas\" href=\"/docs/v1.0.0/guides\" /\u003e\n  \u003cCard icon=\"code\" title=\"Référence API\" description=\"Documentation API complète\" /\u003e\n  \u003cCard icon=\"github\" title=\"GitHub\" description=\"Contribuer au projet\" href=\"https://github.com\" external /\u003e\n\u003c/CardGrid\u003e\n\n## Props\n\n### Card\n\n| Prop | Type | Défaut | Description |\n|------|------|--------|-------------|\n| `title` | `string` | requis | Titre de la carte |\n| `description` | `string` | - | Texte de description de la carte |\n| `href` | `string` | - | URL du lien (rend la carte cliquable) |\n| `icon` | `string \\| ReactNode` | - | Nom de l'icône Lucide ou icône personnalisée |\n| `external` | `boolean` | `false` | Ouvre le lien dans un nouvel onglet |\n| `children` | `ReactNode` | - | Contenu personnalisé |\n\n### CardGrid\n\n| Prop | Type | Défaut | Description |\n|------|------|--------|-------------|\n| `children` | `ReactNode` | requis | Composants de carte |\n| `cols` | `1 \\| 2 \\| 3` | `2` | Nombre de colonnes |\n"])</script><script>self.__next_f.push([1,"43:T3040,"])</script><script>self.__next_f.push([1,"\n# Configuration avancée\n\nAu-delà des bases, Specra offre des fonctionnalités puissantes comme l'analytique, la recherche, les pieds de page personnalisés, les bannières et les variables d'environnement. Ce guide couvre toutes les options de configuration avancées.\n\n## Analytique\n\nSuivez comment les utilisateurs interagissent avec votre documentation.\n\n### Google Analytics\n\n```json\n{\n  \"analytics\": {\n    \"googleAnalytics\": \"G-XXXXXXXXXX\"\n  }\n}\n```\n\nObtenez votre ID de mesure sur [Google Analytics](https://analytics.google.com).\n\n### Google Tag Manager\n\n```json\n{\n  \"analytics\": {\n    \"googleTagManager\": \"GTM-XXXXXXX\"\n  }\n}\n```\n\nPlus flexible que Google Analytics, permet un suivi personnalisé sans modification de code.\n\n### Plausible Analytics\n\nAlternative respectueuse de la vie privée à Google Analytics :\n\n```json\n{\n  \"analytics\": {\n    \"plausible\": \"docs.example.com\"\n  }\n}\n```\n\nInscrivez-vous sur [plausible.io](https://plausible.io).\n\n### Analytiques multiples\n\nUtilisez plusieurs fournisseurs simultanément :\n\n```json\n{\n  \"analytics\": {\n    \"googleAnalytics\": \"G-XXXXXXXXXX\",\n    \"plausible\": \"docs.example.com\"\n  }\n}\n```\n\n## Configuration de la recherche\n\nActivez une recherche puissante pour votre documentation.\n\n### Configuration de base de la recherche\n\n```json\n{\n  \"search\": {\n    \"enabled\": true,\n    \"placeholder\": \"Rechercher dans la documentation...\",\n    \"provider\": \"meilisearch\"\n  }\n}\n```\n\n### MeiliSearch\n\nRecherche complète avec tolérance aux fautes de frappe :\n\n```json\n{\n  \"search\": {\n    \"enabled\": true,\n    \"provider\": \"meilisearch\",\n    \"meilisearch\": {\n      \"host\": \"https://search.example.com\",\n      \"apiKey\": \"votre-clé-de-recherche\",\n      \"indexName\": \"docs\"\n    }\n  }\n}\n```\n\nVoir [Configuration de la recherche](/docs/v1.0.0/search-setup) pour la configuration complète de MeiliSearch.\n\n### Recherche locale\n\nRecherche simple sans dépendances externes :\n\n```json\n{\n  \"search\": {\n    \"enabled\": true,\n    \"provider\": \"local\",\n    \"placeholder\": \"Rechercher...\"\n  }\n}\n```\n\n**Avantages :**\n- Aucune configuration requise\n- Fonctionne hors ligne\n- Gratuit\n\n**Inconvénients :**\n- Moins puissant que MeiliSearch\n- Pas de tolérance aux fautes de frappe\n- Plus lent pour les grands sites\n\n## Configuration du pied de page\n\nPersonnalisez le pied de page de votre documentation.\n\n### Pied de page basique\n\n```json\n{\n  \"footer\": {\n    \"copyright\": \"© 2024 Ma Société. Tous droits réservés.\"\n  }\n}\n```\n\n### Pied de page complet\n\n```json\n{\n  \"footer\": {\n    \"copyright\": \"© 2024 Acme Corp. Tous droits réservés.\",\n    \"customContent\": \"\u003cp\u003eBesoin d'aide ? \u003ca href='/support'\u003eContacter le support\u003c/a\u003e\u003c/p\u003e\",\n    \"links\": [\n      {\n        \"title\": \"Produit\",\n        \"items\": [\n          { \"label\": \"Fonctionnalités\", \"href\": \"/features\" },\n          { \"label\": \"Tarifs\", \"href\": \"/pricing\" },\n          { \"label\": \"Journal des modifications\", \"href\": \"/changelog\" }\n        ]\n      },\n      {\n        \"title\": \"Ressources\",\n        \"items\": [\n          { \"label\": \"Documentation\", \"href\": \"/docs\" },\n          { \"label\": \"Référence API\", \"href\": \"/api\" },\n          { \"label\": \"Exemples\", \"href\": \"/examples\" }\n        ]\n      },\n      {\n        \"title\": \"Société\",\n        \"items\": [\n          { \"label\": \"À propos\", \"href\": \"/about\" },\n          { \"label\": \"Blog\", \"href\": \"/blog\" },\n          { \"label\": \"Carrières\", \"href\": \"/careers\" }\n        ]\n      }\n    ],\n    \"branding\": {\n      \"showBranding\": true,\n      \"logo\": \"/brand-logo.svg\",\n      \"title\": \"Propulsé par Specra\",\n      \"url\": \"https://specra.dev\"\n    }\n  }\n}\n```\n\n### Options de pied de page\n\n**copyright**\n- Avis de droit d'auteur affiché en bas\n- Prend en charge le HTML\n\n**customContent**\n- HTML personnalisé inséré dans le pied de page\n- Utilisez pour des messages supplémentaires ou des liens\n\n**links**\n- Colonnes de liens organisées\n- Chaque colonne a un titre et des éléments\n- Les éléments ont une étiquette et un href\n\n**branding**\n- Affiche la marque \"Propulsé par\"\n- Personnalisez le logo, le titre et l'URL\n- Définissez `showBranding: false` pour masquer\n\n## Configuration de la bannière\n\nAffichez des messages importants en haut de votre site.\n\n### Bannière basique\n\n```json\n{\n  \"banner\": {\n    \"enabled\": true,\n    \"message\": \"📢 La version 2.0 est maintenant disponible !\",\n    \"type\": \"info\"\n  }\n}\n```\n\n### Options de bannière\n\n```json\n{\n  \"banner\": {\n    \"enabled\": true,\n    \"message\": \"⚠️ Maintenance planifiée dimanche à 2h UTC\",\n    \"type\": \"warning\",\n    \"dismissible\": true\n  }\n}\n```\n\n**Propriétés :**\n\n| Propriété | Type | Description |\n|-----------|------|-------------|\n| `enabled` | boolean | Afficher ou masquer la bannière |\n| `message` | string | Texte de la bannière (prend en charge les émojis et le HTML) |\n| `type` | string | Style : `info`, `warning`, `success`, `error` |\n| `dismissible` | boolean | Permettre aux utilisateurs de fermer la bannière |\n\n### Types de bannières\n\n**Info (bleu) :**\n```json\n{\n  \"banner\": {\n    \"message\": \"📢 Nouvelle fonctionnalité : Le mode sombre est là !\",\n    \"type\": \"info\"\n  }\n}\n```\n\n**Avertissement (jaune) :**\n```json\n{\n  \"banner\": {\n    \"message\": \"⚠️ L'API v1 sera obsolète le 1er janv. 2025\",\n    \"type\": \"warning\"\n  }\n}\n```\n\n**Succès (vert) :**\n```json\n{\n  \"banner\": {\n    \"message\": \"✅ Tous les systèmes opérationnels\",\n    \"type\": \"success\"\n  }\n}\n```\n\n**Erreur (rouge) :**\n```json\n{\n  \"banner\": {\n    \"message\": \"🚨 Mise à jour de sécurité critique disponible\",\n    \"type\": \"error\"\n  }\n}\n```\n\n## Configuration des fonctionnalités\n\nActivez ou désactivez diverses fonctionnalités de documentation.\n\n```json\n{\n  \"features\": {\n    \"editUrl\": \"https://github.com/username/repo/edit/main/docs\",\n    \"showLastUpdated\": true,\n    \"showReadingTime\": true,\n    \"showAuthors\": false,\n    \"showTags\": true,\n    \"versioning\": true,\n    \"i18n\": false\n  }\n}\n```\n\n### Options de fonctionnalité\n\n**editUrl**\n- Lien pour modifier la source de la page\n- Apparaît en bas de chaque page\n- Utilisez GitHub, GitLab ou toute URL d'hébergement Git\n- Définissez à `false` pour désactiver\n\n**showLastUpdated**\n- Afficher quand la page a été modifiée pour la dernière fois\n- Utilise les horodatages de commit git\n- Apparaît en bas de la page\n\n**showReadingTime**\n- Estimer le temps de lecture (mots par minute)\n- Affiche \"5 min de lecture\" en haut de la page\n\n**showAuthors**\n- Afficher les auteurs de la page\n- Nécessite des informations sur l'auteur dans le frontmatter\n\n**showTags**\n- Afficher les étiquettes sur les pages\n- Nécessite des étiquettes dans le frontmatter\n\n**versioning**\n- Activer la gestion des versions de la documentation\n- Prend en charge plusieurs versions de doc (v1.0.0, v2.0.0)\n\n**i18n**\n- Activer l'internationalisation\n- Prend en charge plusieurs langues\n\n## Liens sociaux (Social Links)\n\nAjoutez des liens de réseaux sociaux à votre en-tête.\n\n```json\n{\n  \"social\": {\n    \"github\": \"https://github.com/username/repo\",\n    \"twitter\": \"https://twitter.com/username\",\n    \"discord\": \"https://discord.gg/invite\",\n    \"linkedin\": \"https://linkedin.com/company/name\",\n    \"youtube\": \"https://youtube.com/@channel\"\n  }\n}\n```\n\n### Liens sociaux personnalisés\n\nAjoutez des liens vers des plateformes non intégrées :\n\n```json\n{\n  \"social\": {\n    \"github\": \"https://github.com/username\",\n    \"custom\": [\n      {\n        \"label\": \"Slack\",\n        \"url\": \"https://slack.com/invite\",\n        \"icon\": \"slack\"\n      },\n      {\n        \"label\": \"Site web\",\n        \"url\": \"https://example.com\",\n        \"icon\": \"globe\"\n      }\n    ]\n  }\n}\n```\n\n## Variables d'environnement\n\nUtilisez des variables d'environnement dans votre configuration et le contenu MDX.\n\n### Dans la configuration\n\n```json\n{\n  \"env\": {\n    \"API_BASE_URL\": \"https://api.example.com\",\n    \"API_VERSION\": \"v1\",\n    \"CDN_URL\": \"https://cdn.example.com\",\n    \"SUPPORT_EMAIL\": \"support@example.com\"\n  }\n}\n```\n\nAccès dans MDX :\n\n```mdx\nPoint de terminaison API : {process.env.API_BASE_URL}\nVersion actuelle : {process.env.API_VERSION}\n```\n\n### Depuis les fichiers .env\n\nDéfinir les valeurs via des fichiers d'environnement :\n\n```bash\n# .env.local\nAPI_BASE_URL=https://api.example.com\nMEILISEARCH_HOST=https://search.example.com\nMEILISEARCH_API_KEY=your-key\n```\n\nRéférence dans la configuration :\n\n```json\n{\n  \"env\": {\n    \"API_BASE_URL\": \"${API_BASE_URL}\"\n  },\n  \"search\": {\n    \"meilisearch\": {\n      \"host\": \"${MEILISEARCH_HOST}\",\n      \"apiKey\": \"${MEILISEARCH_API_KEY}\"\n    }\n  }\n}\n```\n\n\u003cCallout type=\"warning\"\u003e\nNe commitez jamais de clés sensibles dans le contrôle de version. Utilisez des variables d'environnement et ajoutez `.env.local` à `.gitignore`.\n\u003c/Callout\u003e\n\n### Variables publiques vs privées\n\n**Privé (serveur uniquement) :**\n```\nMEILISEARCH_API_KEY=secret-key\nDATABASE_URL=postgres://...\n```\n\n**Public (exposé au navigateur) :**\n```\nNEXT_PUBLIC_GA_ID=G-XXXXXXXXXX\nNEXT_PUBLIC_API_URL=https://api.example.com\n```\n\nPréfixez avec `NEXT_PUBLIC_` pour rendre les variables disponibles dans le navigateur.\n\n## Configuration du thème\n\nPersonnalisez l'apparence visuelle.\n\n```json\n{\n  \"theme\": {\n    \"defaultMode\": \"system\",\n    \"respectPrefersColorScheme\": true,\n    \"primaryColor\": \"#3b82f6\",\n    \"customCss\": \"/custom.css\"\n  }\n}\n```\n\n**defaultMode**\n- `\"system\"` - Correspondre à la préférence du système d'exploitation\n- `\"light\"` - Toujours en mode clair\n- `\"dark\"` - Toujours en mode sombre\n\n**respectPrefersColorScheme**\n- Respecter la préférence de schéma de couleurs du système d'exploitation\n- Définissez à `false` pour ignorer les paramètres du système d'exploitation\n\n**primaryColor**\n- Couleur principale de la marque (code hexadécimal)\n- Utilisé pour les liens, boutons, accents\n\n**customCss**\n- Chemin vers le fichier CSS personnalisé\n- Ajoutez dans le dossier `public/`\n\nVoir [Personnalisation](/docs/v1.0.0/customization) pour un guide détaillé sur les thèmes.\n\n## Exemple complet\n\nVoici une configuration Specra entièrement configurée :\n\n```json\n{\n  \"site\": {\n    \"title\": \"Documentation Acme\",\n    \"description\": \"Docs complètes pour la plateforme Acme\",\n    \"url\": \"https://docs.acme.com\"\n  },\n  \"theme\": {\n    \"defaultMode\": \"system\",\n    \"primaryColor\": \"#6366f1\"\n  },\n  \"navigation\": {\n    \"showSidebar\": true,\n    \"showTableOfContents\": true,\n    \"tocPosition\": \"right\",\n    \"tabGroups\": [\n      { \"id\": \"guides\", \"label\": \"Guides\", \"icon\": \"book-open\" },\n      { \"id\": \"api\", \"label\": \"API\", \"icon\": \"zap\" }\n    ]\n  },\n  \"search\": {\n    \"enabled\": true,\n    \"provider\": \"meilisearch\",\n    \"meilisearch\": {\n      \"host\": \"${MEILISEARCH_HOST}\",\n      \"apiKey\": \"${MEILISEARCH_API_KEY}\",\n      \"indexName\": \"docs\"\n    }\n  },\n  \"analytics\": {\n    \"googleAnalytics\": \"G-XXXXXXXXXX\",\n    \"plausible\": \"docs.acme.com\"\n  },\n  \"social\": {\n    \"github\": \"https://github.com/acme/platform\",\n    \"twitter\": \"https://twitter.com/acme\",\n    \"discord\": \"https://discord.gg/acme\"\n  },\n  \"footer\": {\n    \"copyright\": \"© 2024 Acme Corp. Tous droits réservés.\",\n    \"links\": [\n      {\n        \"title\": \"Produit\",\n        \"items\": [\n          { \"label\": \"Fonctionnalités\", \"href\": \"/features\" },\n          { \"label\": \"Tarifs\", \"href\": \"/pricing\" }\n        ]\n      }\n    ]\n  },\n  \"banner\": {\n    \"enabled\": true,\n    \"message\": \"📢 La version 2.0 est maintenant disponible !\",\n    \"type\": \"info\",\n    \"dismissible\": true\n  },\n  \"features\": {\n    \"editUrl\": \"https://github.com/acme/platform/edit/main/docs\",\n    \"showLastUpdated\": true,\n    \"showReadingTime\": true,\n    \"showTags\": true,\n    \"versioning\": true\n  },\n  \"deployment\": {\n    \"target\": \"vercel\"\n  }\n}\n```\n\n## Prochaines étapes\n\n\u003cCardGrid cols={2}\u003e\n  \u003cCard\n    icon=\"search\"\n    title=\"Configuration de la recherche\"\n    description=\"Configurer MeiliSearch pour vos docs\"\n    href=\"/docs/v1.0.0/search-setup\"\n  /\u003e\n  \u003cCard\n    icon=\"palette\"\n    title=\"Personnalisation\"\n    description=\"Thème et style de votre documentation\"\n    href=\"/docs/v1.0.0/customization\"\n  /\u003e\n  \u003cCard\n    icon=\"rocket\"\n    title=\"Déploiement\"\n    description=\"Déployer en production\"\n    href=\"/docs/v1.0.0/deployment/overview\"\n  /\u003e\n  \u003cCard\n    icon=\"arrow-left\"\n    title=\"Aperçu de la configuration\"\n    description=\"Retour à l'aperçu de la configuration\"\n    href=\"/docs/v1.0.0/configuration/overview\"\n  /\u003e\n\u003c/CardGrid\u003e\n"])</script><script>self.__next_f.push([1,"44:T3040,"])</script><script>self.__next_f.push([1,"\n# Configuration avancée\n\nAu-delà des bases, Specra offre des fonctionnalités puissantes comme l'analytique, la recherche, les pieds de page personnalisés, les bannières et les variables d'environnement. Ce guide couvre toutes les options de configuration avancées.\n\n## Analytique\n\nSuivez comment les utilisateurs interagissent avec votre documentation.\n\n### Google Analytics\n\n```json\n{\n  \"analytics\": {\n    \"googleAnalytics\": \"G-XXXXXXXXXX\"\n  }\n}\n```\n\nObtenez votre ID de mesure sur [Google Analytics](https://analytics.google.com).\n\n### Google Tag Manager\n\n```json\n{\n  \"analytics\": {\n    \"googleTagManager\": \"GTM-XXXXXXX\"\n  }\n}\n```\n\nPlus flexible que Google Analytics, permet un suivi personnalisé sans modification de code.\n\n### Plausible Analytics\n\nAlternative
