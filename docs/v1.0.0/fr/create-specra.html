:\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"github-pages\",\n    \"basePath\": \"nom-votre-repo\",\n    \"customDomain\": false\n  }\n}\n```\n\nRemplacez `nom-votre-repo` par le nom réel de votre dépôt.\n\n\u003cCallout type=\"info\"\u003e\n  Si vous utilisez un domaine personnalisé (comme `docs.votresite.com`), définissez `customDomain: true` et laissez `basePath` vide.\n\u003c/Callout\u003e\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Construire le site statique\"\u003e\n```bash\nnpm run build:export\n```\n\nCela crée un répertoire `out/` avec votre site statique.\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Déployer avec GitHub Actions\"\u003e\n    Créez `.github/workflows/deploy.yml` :\n\n```yaml\nname: Deploy to GitHub Pages\n\non:\n  push:\n    branches: [main]\n\npermissions:\n  contents: read\n  pages: write\n  id-token: write\n\njobs:\n  build:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n\n      - name: Setup Node.js\n        uses: actions/setup-node@v4\n        with:\n          node-version: '20'\n          cache: 'npm'\n\n      - name: Install dependencies\n        run: npm ci\n\n      - name: Build site\n        run: npm run build:export\n\n      - name: Upload artifact\n        uses: actions/upload-pages-artifact@v3\n        with:\n          path: ./out\n\n  deploy:\n    needs: build\n    runs-on: ubuntu-latest\n    environment:\n      name: github-pages\n      url: ${{ steps.deployment.outputs.page_url }}\n    steps:\n      - name: Deploy to GitHub Pages\n        id: deployment\n        uses: actions/deploy-pages@v4\n```\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Activer GitHub Pages\"\u003e\n    1. Allez dans les paramètres de votre repo\n    2. Naviguez vers **Pages**\n    3. Source : **GitHub Actions**\n    4. Enregistrer\n\n    Vos docs seront en ligne à `https://username.github.io/nom-votre-repo`\n  \u003c/Step\u003e\n\u003c/Steps\u003e\n\n### Netlify\n\nUne autre excellente option d'hébergement statique :\n\n\u003cSteps\u003e\n  \u003cStep title=\"Configurer\"\u003e\n```json\n{\n  \"deployment\": {\n    \"target\": \"static\"\n  }\n}\n```\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Créer netlify.toml\"\u003e\n```toml\n[build]\n  command = \"npm run build:export\"\n  publish = \"out\"\n\n[[redirects]]\n  from = \"/*\"\n  to = \"/index.html\"\n  status = 200\n```\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Déployer\"\u003e\n    Connectez votre repo sur [netlify.com](https://netlify.com) ou utilisez la CLI :\n\n```bash\nnpm install -g netlify-cli\nnetlify deploy --prod\n```\n  \u003c/Step\u003e\n\u003c/Steps\u003e\n\n## Commandes de build\n\nDifférentes plateformes nécessitent différentes commandes de build :\n\n| Plateforme | Commande de build | Répertoire de sortie |\n|------------|-------------------|----------------------|\n| Vercel, Railway | `npm run build` | `.next` |\n| GitHub Pages | `npm run build:export` | `out` |\n| Netlify, Cloudflare Pages | `npm run build:export` | `out` |\n| Docker, VPS | `npm run build` + `npm start` | `.next` |\n\n## Configuration par plateforme\n\n### Vercel\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"vercel\"\n  }\n}\n```\n\n**Variables d'environnement** (optionnel) :\n- Aucune requise pour la configuration de base\n- Ajoutez les clés de recherche/analytique dans le tableau de bord Vercel\n\n### GitHub Pages (Pas de domaine personnalisé)\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"github-pages\",\n    \"basePath\": \"nom-repo\"\n  }\n}\n```\n\n**Pourquoi basePath ?** GitHub Pages sert depuis `username.github.io/nom-repo`, donc toutes les ressources ont besoin du préfixe `/nom-repo`.\n\n### GitHub Pages (Avec domaine personnalisé)\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"custom-domain-static\",\n    \"customDomain\": true\n  }\n}\n```\n\nAjoutez un fichier `CNAME` à `public/` :\n\n```\ndocs.votresite.com\n```\n\n### Netlify / Cloudflare Pages\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"static\"\n  }\n}\n```\n\nAucun basePath nécessaire - ils servent depuis la racine.\n\n## Pipelines CI/CD\n\n### GitHub Actions (Avancé)\n\nExemple complet avec mise en cache et indexation MeiliSearch :\n\n```yaml\nname: Build and Deploy\n\non:\n  push:\n    branches: [main]\n  pull_request:\n    branches: [main]\n\njobs:\n  build:\n    runs-on: ubuntu-latest\n\n    steps:\n      - uses: actions/checkout@v4\n\n      - name: Setup Node.js\n        uses: actions/setup-node@v4\n        with:\n          node-version: '20'\n          cache: 'npm'\n\n      - name: Cache dependencies\n        uses: actions/cache@v4\n        with:\n          path: ~/.npm\n          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}\n          restore-keys: |\n            ${{ runner.os }}-node-\n\n      - name: Install dependencies\n        run: npm ci\n\n      - name: Run linter\n        run: npm run lint\n\n      - name: Build site\n        run: npm run build:export\n        env:\n          NODE_ENV: production\n\n      - name: Index search content\n        if: github.ref == 'refs/heads/main'\n        run: npm run index:search\n        env:\n          MEILISEARCH_HOST: ${{ secrets.MEILISEARCH_HOST }}\n          MEILISEARCH_API_KEY: ${{ secrets.MEILISEARCH_MASTER_KEY }}\n\n      - name: Upload artifact\n        uses: actions/upload-pages-artifact@v3\n        with:\n          path: ./out\n\n  deploy:\n    if: github.ref == 'refs/heads/main'\n    needs: build\n    runs-on: ubuntu-latest\n    environment:\n      name: github-pages\n      url: ${{ steps.deployment.outputs.page_url }}\n    permissions:\n      pages: write\n      id-token: write\n    steps:\n      - name: Deploy to GitHub Pages\n        id: deployment\n        uses: actions/deploy-pages@v4\n```\n\n### GitLab CI/CD\n\n```yaml\n# .gitlab-ci.yml\nimage: node:20\n\ncache:\n  paths:\n    - node_modules/\n\nstages:\n  - build\n  - deploy\n\nbuild:\n  stage: build\n  script:\n    - npm ci\n    - npm run build:export\n  artifacts:\n    paths:\n      - out/\n  only:\n    - main\n\npages:\n  stage: deploy\n  dependencies:\n    - build\n  script:\n    - mkdir -p public\n    - cp -r out/* public/\n  artifacts:\n    paths:\n      - public\n  only:\n    - main\n```\n\n### Docker\n\nCréez un `Dockerfile` :\n\n```dockerfile\nFROM node:20-alpine AS builder\n\nWORKDIR /app\n\nCOPY package*.json ./\nRUN npm ci\n\nCOPY . .\nRUN npm run build\n\nFROM node:20-alpine AS runner\n\nWORKDIR /app\n\nENV NODE_ENV=production\n\nCOPY --from=builder /app/public ./public\nCOPY --from=builder /app/.next/standalone ./\nCOPY --from=builder /app/.next/static ./.next/static\n\nEXPOSE 3000\n\nCMD [\"node\", \"server.js\"]\n```\n\nConstruire et exécuter :\n\n```bash\ndocker build -t my-docs .\ndocker run -p 3000:3000 my-docs\n```\n\n## Variables d'environnement\n\nDéfinissez-les dans votre plateforme de déploiement :\n\n**Recherche (si utilisation de MeiliSearch) :**\n```bash\nMEILISEARCH_HOST=https://search.example.com\nMEILISEARCH_API_KEY=votre-clé-de-recherche\n```\n\n**Analytique (optionnel) :**\n```bash\nNEXT_PUBLIC_GA_ID=G-XXXXXXXXXX\nNEXT_PUBLIC_PLAUSIBLE_DOMAIN=docs.example.com\n```\n\n**Variables d'environnement personnalisées :**\nAccédez-y dans vos docs via le frontmatter ou MDX :\n\n```json\n{\n  \"env\": {\n    \"API_BASE_URL\": \"${API_URL}\"\n  }\n}\n```\n\n## Domaines personnalisés\n\n### Vercel\n\n1. Allez dans les paramètres de votre projet\n2. Naviguez vers Domaines\n3. Ajoutez votre domaine personnalisé\n4. Mettez à jour les enregistrements DNS comme indiqué\n\n### GitHub Pages\n\n1. Ajoutez le fichier `CNAME` à `public/` :\n```\ndocs.votresite.com\n```\n\n2. Mettez à jour `specra.config.json` :\n```json\n{\n  \"deployment\": {\n    \"customDomain\": true\n  }\n}\n```\n\n3. Configurez le DNS :\n```\nType: CNAME\nNom: docs\nValeur: username.github.io\n```\n\n### Netlify\n\n1. Allez dans les paramètres de Domaine\n2. Ajoutez un domaine personnalisé\n3. Suivez les instructions DNS\n\n## Optimisation des performances\n\n### Activer la mise en cache\n\nAjoutez des en-têtes de cache dans `next.config.mjs` :\n\n```javascript\nasync headers() {\n  return [\n    {\n      source: '/docs/:path*',\n      headers: [\n        {\n          key: 'Cache-Control',\n          value: 'public, max-age=3600, must-revalidate',\n        },\n      ],\n    },\n  ]\n}\n```\n\n### Optimisation des images\n\nUtilisez le composant Image de Next.js :\n\n```mdx\n\u003cImage\n  src=\"/images/diagram.png\"\n  alt=\"Diagramme d'architecture\"\n  width={800}\n  height={600}\n/\u003e\n```\n\n### Analyse de bundle\n\nVérifiez la taille du bundle :\n\n```bash\nnpm install --save-dev @next/bundle-analyzer\n```\n\n```javascript\n// next.config.mjs\nimport bundleAnalyzer from '@next/bundle-analyzer'\n\nconst withBundleAnalyzer = bundleAnalyzer({\n  enabled: process.env.ANALYZE === 'true',\n})\n\nexport default withBundleAnalyzer(nextConfig)\n```\n\nExécutez avec :\n```bash\nANALYZE=true npm run build\n```\n\n## Dépannage\n\n### 404 lors de l'actualisation de la page (Export Statique)\n\nAjoutez des redirections/réécritures dans la configuration de la plateforme :\n\n**Netlify :**\n```toml\n[[redirects]]\n  from = \"/*\"\n  to = \"/index.html\"\n  status = 200\n```\n\n**Vercel (vercel.json) :**\n```json\n{\n  \"rewrites\": [\n    { \"source\": \"/(.*)\", \"destination\": \"/index.html\" }\n  ]\n}\n```\n\n### Les ressources ne chargent pas (GitHub Pages)\n\nVérifiez que votr `basePath` correspond exactement au nom de votre dépôt :\n\n```json\n{\n  \"deployment\": {\n    \"basePath\": \"nom-repo-exact\"\n  }\n}\n```\n\n### Échec du build\n\nCorrections courantes :\n\n1. Effacez les dossiers `.next` et `out` :\n```bash\nrm -rf .next out node_modules\nnpm install\nnpm run build\n```\n\n2. Vérifiez la version de Node.js :\n```bash\nnode --version  # Devrait être 18+\n```\n\n3. Examinez les journaux de build pour des erreurs spécifiques\n\n## Guides spécifiques à la plateforme\n\nPlongez plus profondément dans le déploiement spécifique à la plateforme :\n\n\u003cCardGrid cols={3}\u003e\n  \u003cCard\n    icon=\"triangle\"\n    title=\"Vercel\"\n    description=\"Déployer sans configuration\"\n    href=\"/docs/v1.0.0/deployment/vercel\"\n  /\u003e\n  \u003cCard\n    icon=\"github\"\n    title=\"GitHub Pages\"\n    description=\"Hébergement gratuit pour l'open source\"\n    href=\"/docs/v1.0.0/deployment/github-pages\"\n  /\u003e\n  \u003cCard\n    icon=\"globe\"\n    title=\"Netlify\"\n    description=\"Hébergement statique avec fonctions edge\"\n    href=\"/docs/v1.0.0/deployment/netlify\"\n  /\u003e\n\u003c/CardGrid\u003e\n\n## Prochaines étapes\n\n\u003cCardGrid cols={2}\u003e\n  \u003cCard\n    icon=\"settings\"\n    title=\"Configuration\"\n    description=\"Affiner vos paramètres de déploiement\"\n    href=\"/docs/v1.0.0/configuration/deployment-config\"\n  /\u003e\n  \u003cCard\n    icon=\"zap\"\n    title=\"Performance\"\n    description=\"Optimiser vos docs pour la vitesse\"\n    href=\"/docs/v1.0.0/performance\"\n  /\u003e\n\u003c/CardGrid\u003e\n"])</script><script>self.__next_f.push([1,"21:T1e9e,"])</script><script>self.__next_f.push([1,"\nLe système de documentation API de Specra prend en charge plusieurs formats standard de l'industrie, vous permettant d'utiliser vos spécifications d'API existantes sans conversion.\n\n## Aperçu rapide\n\n\u003cdiv className=\"grid grid-cols-1 md:grid-cols-3 gap-4 not-prose my-6\"\u003e\n  \u003cdiv className=\"border border-border rounded-lg p-4\"\u003e\n    \u003ch3 className=\"text-lg font-semibold mb-2\"\u003eFormat Specra\u003c/h3\u003e\n    \u003cp className=\"text-sm text-muted-foreground mb-3\"\u003eFormat natif conçu pour la simplicité\u003c/p\u003e\n    \u003cdiv className=\"flex items-center gap-2 text-xs\"\u003e\n      \u003cspan className=\"px-2 py-1 bg-green-500/10 text-green-600 dark:text-green-400 rounded\"\u003eSimple\u003c/span\u003e\n      \u003cspan className=\"px-2 py-1 bg-blue-500/10 text-blue-600 dark:text-blue-400 rounded\"\u003eLisible\u003c/span\u003e\n    \u003c/div\u003e\n  \u003c/div\u003e\n\n  \u003cdiv className=\"border border-border rounded-lg p-4\"\u003e\n    \u003ch3 className=\"text-lg font-semibold mb-2\"\u003eOpenAPI 3.x\u003c/h3\u003e\n    \u003cp className=\"text-sm text-muted-foreground mb-3\"\u003eFormat API REST standard de l'industrie\u003c/p\u003e\n    \u003cdiv className=\"flex items-center gap-2 text-xs\"\u003e\n      \u003cspan className=\"px-2 py-1 bg-purple-500/10 text-purple-600 dark:text-purple-400 rounded\"\u003eStandard\u003c/span\u003e\n      \u003cspan className=\"px-2 py-1 bg-orange-500/10 text-orange-600 dark:text-orange-400 rounded\"\u003ePuissant\u003c/span\u003e\n    \u003c/div\u003e\n  \u003c/div\u003e\n\n  \u003cdiv className=\"border border-border rounded-lg p-4\"\u003e\n    \u003ch3 className=\"text-lg font-semibold mb-2\"\u003ePostman v2.x\u003c/h3\u003e\n    \u003cp className=\"text-sm text-muted-foreground mb-3\"\u003eExporter directement depuis Postman\u003c/p\u003e\n    \u003cdiv className=\"flex items-center gap-2 text-xs\"\u003e\n      \u003cspan className=\"px-2 py-1 bg-pink-500/10 text-pink-600 dark:text-pink-400 rounded\"\u003ePopulaire\u003c/span\u003e\n      \u003cspan className=\"px-2 py-1 bg-cyan-500/10 text-cyan-600 dark:text-cyan-400 rounded\"\u003eFacile\u003c/span\u003e\n    \u003c/div\u003e\n  \u003c/div\u003e\n\u003c/div\u003e\n\n## Comment ça marche\n\nLe système de documentation API utilise **l'auto-détection** par défaut. Référencez simplement votre fichier de spécification et le système détermine automatiquement le format :\n\n```mdx\n\u003cApiReference spec=\"/api-specs/my-api.json\" /\u003e\n```\n\nLe parseur détectera si votre fichier est :\n- ✅ Format Specra (natif)\n- ✅ OpenAPI 3.x ou Swagger 2.0\n- ✅ Collection Postman v2.0 ou v2.1\n\n## Comparaison des formats\n\n| Fonctionnalité | Specra | OpenAPI | Postman |\n|--------------|--------|---------|---------|\n| **Facile à écrire** | ⭐⭐⭐⭐⭐ | ⭐⭐⭐ | ⭐⭐⭐⭐ |\n| **Standard industriel** | ⭐⭐ | ⭐⭐⭐⭐⭐ | ⭐⭐⭐⭐ |\n| **Validation de schéma** | ⭐⭐⭐ | ⭐⭐⭐⭐⭐ | ⭐⭐ |\n| **Génération de code** | ⭐⭐ | ⭐⭐⭐⭐⭐ | ⭐⭐⭐ |\n| **Exemples** | ⭐⭐⭐⭐⭐ | ⭐⭐⭐⭐ | ⭐⭐⭐⭐⭐ |\n| **Auto-génération** | ⭐⭐ | ⭐⭐⭐⭐⭐ | ⭐⭐⭐⭐ |\n\n## Choisir un format\n\n### Utilisez le format Specra quand :\n\n- 📝 Vous rédigez la documentation à partir de zéro\n- 🎯 Vous avez besoin d'un format simple et minimal\n- 🚀 Vous voulez commencer rapidement\n- 📖 Vous documentez \u003c 20 points de terminaison\n\n**Exemple :**\n```json\n{\n  \"title\": \"My API\",\n  \"baseUrl\": \"https://api.example.com\",\n  \"endpoints\": [...]\n}\n```\n\n[Voir l'exemple Specra →](/docs/v1.0.0/api-test)\n\n---\n\n### Utilisez OpenAPI quand :\n\n- 🏢 Vous suivez les standards de l'entreprise\n- 🔧 Vous générez des spécifications à partir du code\n- 🔄 Vous partagez des spécifications entre outils\n- 📊 Vous avez besoin d'une validation de schéma détaillée\n- 🌐 Vous travaillez avec des passerelles API\n\n**Exemple :**\n```json\n{\n  \"openapi\": \"3.0.0\",\n  \"info\": {...},\n  \"paths\": {...}\n}\n```\n\n[Voir l'exemple OpenAPI →](/docs/v1.0.0/api-openapi)\n\n---\n\n### Utilisez Postman quand :\n\n- 🧪 Votre équipe utilise Postman pour les tests\n- 💾 Vous avez des collections Postman existantes\n- 🔁 Vous voulez garder la documentation synchronisée avec les tests\n- 📸 Vous avez besoin d'exemples de réponses sauvegardés\n- ⚡ Vous voulez un flux de travail d'exportation rapide\n\n**Exemple :**\n```json\n{\n  \"info\": {\n    \"schema\": \"https://schema.getpostman.com/...\"\n  },\n  \"item\": [...]\n}\n```\n\n[Voir l'exemple Postman →](/docs/v1.0.0/api-postman)\n\n## Exemples de workflow\n\n### Workflow 1 : Commencer simplement (Specra)\n\nParfait pour les nouveaux projets ou les petites API :\n\n1. **Créez un fichier JSON Specra** dans `/public/api-specs/`\n2. **Ajoutez vos points de terminaison** avec des exemples\n3. **Référencez dans MDX** :\n   ```mdx\n   \u003cApiReference spec=\"/api-specs/my-api.json\" /\u003e\n   ```\n4. **Terminé !** La documentation interactive est en ligne\n\n---\n\n### Workflow 2 : Utiliser OpenAPI existant (OpenAPI)\n\nIdéal si vous utilisez déjà OpenAPI :\n\n1. **Générez la spécification OpenAPI** à partir de votre code (par ex., FastAPI, Swagger, etc.)\n2. **Placez-la dans `/public/api-specs/`**\n3. **Référencez dans MDX** :\n   ```mdx\n   \u003cApiReference spec=\"/api-specs/openapi.json\" /\u003e\n   ```\n4. **Gardez synchronisé** en régénérant lorsque le code change\n\n---\n\n### Workflow 3 : Exporter depuis Postman (Postman)\n\nIdéal pour les équipes utilisant Postman :\n\n1. **Développez et testez** votre API dans Postman\n2. **Ajoutez des exemples de réponses** dans Postman\n3. **Exportez la collection** (format v2.1)\n4. **Placez-la dans `/public/api-specs/`**\n5. **Référencez dans MDX** :\n   ```mdx\n   \u003cApiReference spec=\"/api-specs/collection.json\" /\u003e\n   ```\n6. **Réexportez** lorsque vous mettez à jour votre collection\n\n## Approche mixte\n\nVous pouvez utiliser plusieurs formats dans le même projet :\n\n```mdx\n\u003c!-- OpenAPI généré automatiquement pour l'API principale --\u003e\n\u003cApiReference spec=\"/api-specs/main-api-openapi.json\" /\u003e\n\n\u003c!-- Collection Postman pour l'API externe --\u003e\n\u003cApiReference spec=\"/api-specs/third-party-postman.json\" /\u003e\n\n\u003c!-- Specra pour les outils internes --\u003e\n\u003cApiReference spec=\"/api-specs/internal-tools-specra.json\" /\u003e\n```\n\n## Utilisation avancée\n\n### Sélection explicite du parseur\n\nBien que l'auto-détection fonctionne bien, vous pouvez spécifier explicitement le parseur :\n\n```mdx\n\u003cApiReference spec=\"/api-specs/my-api.json\" parser=\"openapi\" /\u003e\n\u003cApiReference spec=\"/api-specs/my-api.json\" parser=\"postman\" /\u003e\n\u003cApiReference spec=\"/api-specs/my-api.json\" parser=\"specra\" /\u003e\n```\n\n### Désactiver le Playground\n\nDésactivez le terrain de jeu interactif si vous n'en avez pas besoin :\n\n```mdx\n\u003cApiReference spec=\"/api-specs/my-api.json\" showPlayground={false} /\u003e\n```\n\n### Versions multiples\n\nDocumentez plusieurs versions d'API :\n\n```mdx\n## Version 2.0 (Actuel)\n\n\u003cApiReference spec=\"/api-specs/api-v2.json\" /\u003e\n\n## Version 1.0 (Obsolète)\n\n\u003cCallout type=\"warning\"\u003e\nCette version sera abandonnée le 1er juin 2024\n\u003c/Callout\u003e\n\n\u003cApiReference spec=\"/api-specs/api-v1.json\" showPlayground={false} /\u003e\n```\n\n## Fonctionnalités communes\n\nQuel que soit le format que vous choisissez, toutes les spécifications prennent en charge :\n\n✅ **Paramètres de chemin** - Segments d'URL dynamiques (`:id`, `{id}`)\n\n✅ **Paramètres de requête** - Chaînes de requête d'URL\n\n✅ **En-têtes de requête** - En-têtes personnalisés\n\n✅ **Corps de requête** - Payloads JSON\n\n✅ **Exemples de réponses** - Exemples de réponses\n\n✅ **Codes de réponse multiples** - 200, 404, 500, etc.\n\n✅ **Authentification** - Bearer, API Key, Basic\n\n✅ **Playground interactif** - Testez les API en direct\n\n## Prochaines étapes\n\nPrêt à documenter votre API ? Choisissez un format et lancez-vous :\n\n- [Voir l'exemple de format Specra →](/docs/v1.0.0/api-test)\n- [Voir l'exemple OpenAPI →](/docs/v1.0.0/api-openapi)\n- [Voir l'exemple Postman →](/docs/v1.0.0/api-postman)\n- [En savoir plus sur les composants manuels →](/docs/v1.0.0/api-example)\n\n\u003cCallout type=\"tip\" title=\"Besoin d'aide ?\"\u003e\nConsultez [API_PARSERS.md](/API_PARSERS.md) pour une documentation technique détaillée sur le système de parseur.\n\u003c/Callout\u003e\n"])</script><script>self.__next_f.push([1,"22:T1e9e,"])</script><script>self.__next_f.push([1,"\nLe système de documentation API de Specra prend en charge plusieurs formats standard de l'industrie, vous permettant d'utiliser vos spécifications d'API existantes sans conversion.\n\n## Aperçu rapide\n\n\u003cdiv className=\"grid grid-cols-1 md:grid-cols-3 gap-4 not-prose my-6\"\u003e\n  \u003cdiv className=\"border border-border rounded-lg p-4\"\u003e\n    \u003ch3 className=\"text-lg font-semibold mb-2\"\u003eFormat Specra\u003c/h3\u003e\n    \u003cp className=\"text-sm text-muted-foreground mb-3\"\u003eFormat natif conçu pour la simplicité\u003c/p\u003e\n    \u003cdiv className=\"flex items-center gap-2 text-xs\"\u003e\n      \u003cspan className=\"px-2 py-1 bg-green-500/10 text-green-600 dark:text-green-400 rounded\"\u003eSimple\u003c/span\u003e\n      \u003cspan className=\"px-2 py-1 bg-blue-500/10 text-blue-600 dark:text-blue-400 rounded\"\u003eLisible\u003c/span\u003e\n    \u003c/div\u003e\n  \u003c/div\u003e\n\n  \u003cdiv className=\"border border-border rounded-lg p-4\"\u003e\n    \u003ch3 className=\"text-lg font-semibold mb-2\"\u003eOpenAPI 3.x\u003c/h3\u003e\n    \u003cp className=\"text-sm text-muted-foreground mb-3\"\u003eFormat API REST standard de l'industrie\u003c/p\u003e\n    \u003cdiv className=\"flex items-center gap-2 text-xs\"\u003e\n      \u003cspan className=\"px-2 py-1 bg-purple-500/10 text-purple-600 dark:text-purple-400 rounded\"\u003eStandard\u003c/span\u003e\n      \u003cspan className=\"px-2 py-1 bg-orange-500/10 text-orange-600 dark:text-orange-400 rounded\"\u003ePuissant\u003c/span\u003e\n    \u003c/div\u003e\n  \u003c/div\u003e\n\n  \u003cdiv className=\"border border-border rounded-lg p-4\"\u003e\n    \u003ch3 className=\"text-lg font-semibold mb-2\"\u003ePostman v2.x\u003c/h3\u003e\n    \u003cp className=\"text-sm text-muted-foreground mb-3\"\u003eExporter directement depuis Postman\u003c/p\u003e\n    \u003cdiv className=\"flex items-center gap-2 text-xs\"\u003e\n      \u003cspan className=\"px-2 py-1 bg-pink-500/10 text-pink-600 dark:text-pink-400 rounded\"\u003ePopulaire\u003c/span\u003e\n      \u003cspan className=\"px-2 py-1 bg-cyan-500/10 text-cyan-600 dark:text-cyan-400 rounded\"\u003eFacile\u003c/span\u003e\n    \u003c/div\u003e\n  \u003c/div\u003e\n\u003c/div\u003e\n\n## Comment ça marche\n\nLe système de documentation API utilise **l'auto-détection** par défaut. Référencez simplement votre fichier de spécification et le système détermine automatiquement le format :\n\n```mdx\n\u003cApiReference spec=\"/api-specs/my-api.json\" /\u003e\n```\n\nLe parseur détectera si votre fichier est :\n- ✅ Format Specra (natif)\n- ✅ OpenAPI 3.x ou Swagger 2.0\n- ✅ Collection Postman v2.0 ou v2.1\n\n## Comparaison des formats\n\n| Fonctionnalité | Specra | OpenAPI | Postman |\n|--------------|--------|---------|---------|\n| **Facile à écrire** | ⭐⭐⭐⭐⭐ | ⭐⭐⭐ | ⭐⭐⭐⭐ |\n| **Standard industriel** | ⭐⭐ | ⭐⭐⭐⭐⭐ | ⭐⭐⭐⭐ |\n| **Validation de schéma** | ⭐⭐⭐ | ⭐⭐⭐⭐⭐ | ⭐⭐ |\n| **Génération de code** | ⭐⭐ | ⭐⭐⭐⭐⭐ | ⭐⭐⭐ |\n| **Exemples** | ⭐⭐⭐⭐⭐ | ⭐⭐⭐⭐ | ⭐⭐⭐⭐⭐ |\n| **Auto-génération** | ⭐⭐ | ⭐⭐⭐⭐⭐ | ⭐⭐⭐⭐ |\n\n## Choisir un format\n\n### Utilisez le format Specra quand :\n\n- 📝 Vous rédigez la documentation à partir de zéro\n- 🎯 Vous avez besoin d'un format simple et minimal\n- 🚀 Vous voulez commencer rapidement\n- 📖 Vous documentez \u003c 20 points de terminaison\n\n**Exemple :**\n```json\n{\n  \"title\": \"My API\",\n  \"baseUrl\": \"https://api.example.com\",\n  \"endpoints\": [...]\n}\n```\n\n[Voir l'exemple Specra →](/docs/v1.0.0/api-test)\n\n---\n\n### Utilisez OpenAPI quand :\n\n- 🏢 Vous suivez les standards de l'entreprise\n- 🔧 Vous générez des spécifications à partir du code\n- 🔄 Vous partagez des spécifications entre outils\n- 📊 Vous avez besoin d'une validation de schéma détaillée\n- 🌐 Vous travaillez avec des passerelles API\n\n**Exemple :**\n```json\n{\n  \"openapi\": \"3.0.0\",\n  \"info\": {...},\n  \"paths\": {...}\n}\n```\n\n[Voir l'exemple OpenAPI →](/docs/v1.0.0/api-openapi)\n\n---\n\n### Utilisez Postman quand :\n\n- 🧪 Votre équipe utilise Postman pour les tests\n- 💾 Vous avez des collections Postman existantes\n- 🔁 Vous voulez garder la documentation synchronisée avec les tests\n- 📸 Vous avez besoin d'exemples de réponses sauvegardés\n- ⚡ Vous voulez un flux de travail d'exportation rapide\n\n**Exemple :**\n```json\n{\n  \"info\": {\n    \"schema\": \"https://schema.getpostman.com/...\"\n  },\n  \"item\": [...]\n}\n```\n\n[Voir l'exemple Postman →](/docs/v1.0.0/api-postman)\n\n## Exemples de workflow\n\n### Workflow 1 : Commencer simplement (Specra)\n\nParfait pour les nouveaux projets ou les petites API :\n\n1. **Créez un fichier JSON Specra** dans `/public/api-specs/`\n2. **Ajoutez vos points de terminaison** avec des exemples\n3. **Référencez dans MDX** :\n   ```mdx\n   \u003cApiReference spec=\"/api-specs/my-api.json\" /\u003e\n   ```\n4. **Terminé !** La documentation interactive est en ligne\n\n---\n\n### Workflow 2 : Utiliser OpenAPI existant (OpenAPI)\n\nIdéal si vous utilisez déjà OpenAPI :\n\n1. **Générez la spécification OpenAPI** à partir de votre code (par ex., FastAPI, Swagger, etc.)\n2. **Placez-la dans `/public/api-specs/`**\n3. **Référencez dans MDX** :\n   ```mdx\n   \u003cApiReference spec=\"/api-specs/openapi.json\" /\u003e\n   ```\n4. **Gardez synchronisé** en régénérant lorsque le code change\n\n---\n\n### Workflow 3 : Exporter depuis Postman (Postman)\n\nIdéal pour les équipes utilisant Postman :\n\n1. **Développez et testez** votre API dans Postman\n2. **Ajoutez des exemples de réponses** dans Postman\n3. **Exportez la collection** (format v2.1)\n4. **Placez-la dans `/public/api-specs/`**\n5. **Référencez dans MDX** :\n   ```mdx\n   \u003cApiReference spec=\"/api-specs/collection.json\" /\u003e\n   ```\n6. **Réexportez** lorsque vous mettez à jour votre collection\n\n## Approche mixte\n\nVous pouvez utiliser plusieurs formats dans le même projet :\n\n```mdx\n\u003c!-- OpenAPI généré automatiquement pour l'API principale --\u003e\n\u003cApiReference spec=\"/api-specs/main-api-openapi.json\" /\u003e\n\n\u003c!-- Collection Postman pour l'API externe --\u003e\n\u003cApiReference spec=\"/api-specs/third-party-postman.json\" /\u003e\n\n\u003c!-- Specra pour les outils internes --\u003e\n\u003cApiReference spec=\"/api-specs/internal-tools-specra.json\" /\u003e\n```\n\n## Utilisation avancée\n\n### Sélection explicite du parseur\n\nBien que l'auto-détection fonctionne bien, vous pouvez spécifier explicitement le parseur :\n\n```mdx\n\u003cApiReference spec=\"/api-specs/my-api.json\" parser=\"openapi\" /\u003e\n\u003cApiReference spec=\"/api-specs/my-api.json\" parser=\"postman\" /\u003e\n\u003cApiReference spec=\"/api-specs/my-api.json\" parser=\"specra\" /\u003e\n```\n\n### Désactiver le Playground\n\nDésactivez le terrain de jeu interactif si vous n'en avez pas besoin :\n\n```mdx\n\u003cApiReference spec=\"/api-specs/my-api.json\" showPlayground={false} /\u003e\n```\n\n### Versions multiples\n\nDocumentez plusieurs versions d'API :\n\n```mdx\n## Version 2.0 (Actuel)\n\n\u003cApiReference spec=\"/api-specs/api-v2.json\" /\u003e\n\n## Version 1.0 (Obsolète)\n\n\u003cCallout type=\"warning\"\u003e\nCette version sera abandonnée le 1er juin 2024\n\u003c/Callout\u003e\n\n\u003cApiReference spec=\"/api-specs/api-v1.json\" showPlayground={false} /\u003e\n```\n\n## Fonctionnalités communes\n\nQuel que soit le format que vous choisissez, toutes les spécifications prennent en charge :\n\n✅ **Paramètres de chemin** - Segments d'URL dynamiques (`:id`, `{id}`)\n\n✅ **Paramètres de requête** - Chaînes de requête d'URL\n\n✅ **En-têtes de requête** - En-têtes personnalisés\n\n✅ **Corps de requête** - Payloads JSON\n\n✅ **Exemples de réponses** - Exemples de réponses\n\n✅ **Codes de réponse multiples** - 200, 404, 500, etc.\n\n✅ **Authentification** - Bearer, API Key, Basic\n\n✅ **Playground interactif** - Testez les API en direct\n\n## Prochaines étapes\n\nPrêt à documenter votre API ? Choisissez un format et lancez-vous :\n\n- [Voir l'exemple de format Specra →](/docs/v1.0.0/api-test)\n- [Voir l'exemple OpenAPI →](/docs/v1.0.0/api-openapi)\n- [Voir l'exemple Postman →](/docs/v1.0.0/api-postman)\n- [En savoir plus sur les composants manuels →](/docs/v1.0.0/api-example)\n\n\u003cCallout type=\"tip\" title=\"Besoin d'aide ?\"\u003e\nConsultez [API_PARSERS.md](/API_PARSERS.md) pour une documentation technique détaillée sur le système de parseur.\n\u003c/Callout\u003e\n"])</script><script>self.__next_f.push([1,"23:T706,"])</script><script>self.__next_f.push([1,"\nLes badges sont de petits indicateurs d'état qui mettent en évidence des informations importantes, des catégories ou des statuts.\n\n## Utilisation\n\n```mdx\n\u003cBadge\u003eDéfaut\u003c/Badge\u003e\n\u003cBadge variant=\"success\"\u003eSuccès\u003c/Badge\u003e\n\u003cBadge variant=\"warning\"\u003eAvertissement\u003c/Badge\u003e\n\u003cBadge variant=\"error\"\u003eErreur\u003c/Badge\u003e\n\u003cBadge variant=\"info\"\u003eInfo\u003c/Badge\u003e\n```\n\n## Exemple en direct\n\n\u003cBadge\u003eDéfaut\u003c/Badge\u003e \u003cBadge variant=\"success\"\u003eSuccès\u003c/Badge\u003e \u003cBadge variant=\"warning\"\u003eAvertissement\u003c/Badge\u003e \u003cBadge variant=\"error\"\u003eErreur\u003c/Badge\u003e \u003cBadge variant=\"info\"\u003eInfo\u003c/Badge\u003e\n\n## Variantes\n\n### Défaut\n\u003cBadge\u003eBadge par défaut\u003c/Badge\u003e\n\nUtilisé pour des informations neutres ou des étiquettes générales.\n\n### Succès\n\u003cBadge variant=\"success\"\u003eTerminé\u003c/Badge\u003e\n\nIndique des opérations réussies, un statut actif ou des résultats positifs.\n\n### Avertissement\n\u003cBadge variant=\"warning\"\u003eEn attente\u003c/Badge\u003e\n\nMet en évidence les éléments qui nécessitent une attention ou sont dans un état de transition.\n\n### Erreur\n\u003cBadge variant=\"error\"\u003eÉchoué\u003c/Badge\u003e\n\nAffiche les erreurs, les problèmes critiques ou un statut négatif.\n\n### Info\n\u003cBadge variant=\"info\"\u003eNouveau\u003c/Badge\u003e\n\nFournit un contexte informatif ou met en évidence de nouvelles fonctionnalités.\n\n## Props\n\n| Prop | Type | Défaut | Description |\n|------|------|--------|-------------|\n| `children` | `ReactNode` | requis | Contenu texte du badge |\n| `variant` | `\"default\" \\| \"success\" \\| \"warning\" \\| \"error\" \\| \"info\"` | `\"default\"` | Variante de couleur |\n\n## Modèles courants\n\nUtilisez des badges en ligne avec du texte pour indiquer le statut :\n\n```mdx\nCette fonctionnalité est \u003cBadge variant=\"success\"\u003eStable\u003c/Badge\u003e et prête pour la production.\n```\n\nCette fonctionnalité est \u003cBadge variant=\"success\"\u003eStable\u003c/Badge\u003e et prête pour la production.\n"])</script><script>self.__next_f.push([1,"24:T706,"])</script><script>self.__next_f.push([1,"\nLes badges sont de petits indicateurs d'état qui mettent en évidence des informations importantes, des catégories ou des statuts.\n\n## Utilisation\n\n```mdx\n\u003cBadge\u003eDéfaut\u003c/Badge\u003e\n\u003cBadge variant=\"success\"\u003eSuccès\u003c/Badge\u003e\n\u003cBadge variant=\"warning\"\u003eAvertissement\u003c/Badge\u003e\n\u003cBadge variant=\"error\"\u003eErreur\u003c/Badge\u003e\n\u003cBadge variant=\"info\"\u003eInfo\u003c/Badge\u003e\n```\n\n## Exemple en direct\n\n\u003cBadge\u003eDéfaut\u003c/Badge\u003e \u003cBadge variant=\"success\"\u003eSuccès\u003c/Badge\u003e \u003cBadge variant=\"warning\"\u003eAvertissement\u003c/Badge\u003e \u003cBadge variant=\"error\"\u003eErreur\u003c/Badge\u003e \u003cBadge variant=\"info\"\u003eInfo\u003c/Badge\u003e\n\n## Variantes\n\n### Défaut\n\u003cBadge\u003eBadge par défaut\u003c/Badge\u003e\n\nUtilisé pour des informations neutres ou des étiquettes générales.\n\n### Succès\n\u003cBadge variant=\"success\"\u003eTerminé\u003c/Badge\u003e\n\nIndique des opérations réussies, un statut actif ou des résultats positifs.\n\n### Avertissement\n\u003cBadge variant=\"warning\"\u003eEn attente\u003c/Badge\u003e\n\nMet en évidence les éléments qui nécessitent une attention ou sont dans un état de transition.\n\n### Erreur\n\u003cBadge variant=\"error\"\u003eÉchoué\u003c/Badge\u003e\n\nAffiche les erreurs, les problèmes critiques ou un statut négatif.\n\n### Info\n\u003cBadge variant=\"info\"\u003eNouveau\u003c/Badge\u003e\n\nFournit un contexte informatif ou met en évidence de nouvelles fonctionnalités.\n\n## Props\n\n| Prop | Type | Défaut | Description |\n|------|------|--------|-------------|\n| `children` | `ReactNode` | requis | Contenu texte du badge |\n| `variant` | `\"default\" \\| \"success\" \\| \"warning\" \\| \"error\" \\| \"info\"` | `\"default\"` | Variante de couleur |\n\n## Modèles courants\n\nUtilisez des badges en ligne avec du texte pour indiquer le statut :\n\n```mdx\nCette fonctionnalité est \u003cBadge variant=\"success\"\u003eStable\u003c/Badge\u003e et prête pour la production.\n```\n\nCette fonctionnalité est \u003cBadge variant=\"success\"\u003eStable\u003c/Badge\u003e et prête pour la production.\n"])</script><script>self.__next_f.push([1,"25:T2380,"])</script><script>self.__next_f.push([1,"\n# Configuration du site\n\nLa section `site` dans `specra.config.json` contrôle l'identité, la marque et les métadonnées de base de votre site de documentation. C'est ici que vous définissez le titre, la description, le logo et d'autres propriétés fondamentales de votre site.\n\n## Configuration de base\n\nVoici une configuration de site minimale :\n\n```json\n{\n  \"site\": {\n    \"title\": \"Ma Documentation\",\n    \"description\": \"Documentation complète pour mon projet\",\n    \"url\": \"https://docs.example.com\"\n  }\n}\n```\n\nC'est tout ce dont vous avez besoin pour commencer. Specra remplit des valeurs par défaut judicieuses pour tout le reste.\n\n## Toutes les options du site\n\n### Champs requis\n\nSeul un champ est vraiment requis :\n\n```json\n{\n  \"site\": {\n    \"title\": \"Ma Documentation\"\n  }\n}\n```\n\nTout le reste est optionnel mais recommandé pour un site de documentation professionnel.\n\n### Configuration complète\n\nVoici toutes les options disponibles :\n\n```json\n{\n  \"site\": {\n    \"title\": \"Documentation Specra\",\n    \"description\": \"Construisez une belle documentation avec Specra\",\n    \"url\": \"https://docs.example.com\",\n    \"baseUrl\": \"/\",\n    \"language\": \"fr\",\n    \"organizationName\": \"Ma Société\",\n    \"projectName\": \"specra\",\n    \"activeVersion\": \"v1.0.0\",\n    \"logo\": \"/logo.svg\",\n    \"favicon\": \"/favicon.ico\",\n    \"hideTitle\": false,\n    \"hideLogo\": false\n  }\n}\n```\n\n## Référence de configuration\n\n### title\n\n**Type :** `string` (Requis)\n\nLe nom de votre site de documentation. Apparaît dans l'onglet du navigateur, l'en-tête de navigation et les aperçus des réseaux sociaux.\n\n```json\n{\n  \"site\": {\n    \"title\": \"Docs Specra\"\n  }\n}\n```\n\n\u003cCallout type=\"tip\"\u003e\nGardez-le court et clair. Cela apparaît à de nombreux endroits, y compris les onglets de navigateur où l'espace est limité.\n\u003c/Callout\u003e\n\n### description\n\n**Type :** `string`\n\nBrève description de votre documentation. Utilisé dans les balises méta SEO et les aperçus des réseaux sociaux.\n\n```json\n{\n  \"site\": {\n    \"description\": \"Guide complet pour construire de la documentation avec Specra\"\n  }\n}\n```\n\n**Meilleures pratiques :**\n- Gardez-le sous 160 caractères\n- Incluez des mots-clés pertinents\n- Soyez descriptif et spécifique\n- Concentrez-vous sur ce que les utilisateurs apprendront\n\n### url\n\n**Type :** `string`\n\nL'URL complète où votre documentation est hébergée. Utilisé pour générer des URL canoniques et des aperçus des réseaux sociaux.\n\n```json\n{\n  \"site\": {\n    \"url\": \"https://docs.example.com\"\n  }\n}\n```\n\n\u003cCallout type=\"warning\"\u003e\nIncluez le protocole (`https://`) mais pas de barre oblique finale.\n\u003c/Callout\u003e\n\n### baseUrl\n\n**Type :** `string`\n**Défaut :** `\"/\"`\n\nChemin de base pour votre site. Généralement nécessaire uniquement pour GitHub Pages sans domaine personnalisé.\n\n```json\n{\n  \"site\": {\n    \"baseUrl\": \"/\"\n  }\n}\n```\n\nPour GitHub Pages à `username.github.io/repo-name` :\n\n```json\n{\n  \"site\": {\n    \"baseUrl\": \"/repo-name/\"\n  }\n}\n```\n\n\u003cCallout type=\"info\"\u003e\nPour la plupart des déploiements (Vercel, Netlify, domaines personnalisés), gardez ceci à `\"/\"`.\n\u003c/Callout\u003e\n\n### language\n\n**Type :** `string`\n**Défaut :** `\"en\"`\n\nLa langue principale de votre documentation. Utilisé dans l'attribut HTML `lang`.\n\n```json\n{\n  \"site\": {\n    \"language\": \"en\"\n  }\n}\n```\n\nValeurs courantes : `en`, `es`, `fr`, `de`, `ja`, `zh`, `pt`, `ru`\n\n### organizationName\n\n**Type :** `string`\n\nLe nom de votre entreprise ou organisation. Utilisé dans le pied de page et les métadonnées.\n\n```json\n{\n  \"site\": {\n    \"organizationName\": \"Acme Corporation\"\n  }\n}\n```\n\n### projectName\n\n**Type :** `string`\n\nLe nom de votre projet ou produit. Utilisé dans les métadonnées et peut être référencé dans le contenu.\n\n```json\n{\n  \"site\": {\n    \"projectName\": \"specra\"\n  }\n}\n```\n\n### activeVersion\n\n**Type :** `string`\n**Défaut :** Première version trouvée dans le dossier `docs/`\n\nQuelle version de la documentation afficher par défaut.\n\n```json\n{\n  \"site\": {\n    \"activeVersion\": \"v2.0.0\"\n  }\n}\n```\n\nLes utilisateurs peuvent changer de version en utilisant le menu déroulant des versions, mais cela définit la valeur par défaut.\n\n### logo\n\n**Type :** `string` ou `object`\n\nChemin vers votre image de logo. Peut être un seul logo ou des logos séparés pour les modes clair et sombre.\n\n**Logo unique :**\n```json\n{\n  \"site\": {\n    \"logo\": \"/logo.svg\"\n  }\n}\n```\n\n**Logos séparés pour les thèmes :**\n```json\n{\n  \"site\": {\n    \"logo\": {\n      \"light\": \"/logo-light.svg\",\n      \"dark\": \"/logo-dark.svg\"\n    }\n  }\n}\n```\n\n**Meilleures pratiques :**\n- Utilisez SVG pour un rendu net à n'importe quelle taille\n- Gardez les dimensions autour de 150px de large × 40px de haut\n- Optimisez les fichiers (utilisez SVGO ou similaire)\n- Placez dans le dossier `public/`\n\n### favicon\n\n**Type :** `string`\n\nChemin vers votre favicon. Apparaît dans les onglets du navigateur et les favoris.\n\n```json\n{\n  \"site\": {\n    \"favicon\": \"/favicon.ico\"\n  }\n}\n```\n\n**Configuration recommandée :**\n```\npublic/\n├── favicon.ico          # 32×32 ICO pour les anciens navigateurs\n├── favicon-16x16.png    # 16×16 PNG\n├── favicon-32x32.png    # 32×32 PNG\n└── apple-touch-icon.png # 180×180 PNG pour iOS\n```\n\nEnsuite, référencez le principal :\n```json\n{\n  \"site\": {\n    \"favicon\": \"/favicon-32x32.png\"\n  }\n}\n```\n\n### hideTitle\n\n**Type :** `boolean`\n**Défaut :** `false`\n\nMasquer le titre du site dans la navigation de l'en-tête.\n\n```json\n{\n  \"site\": {\n    \"hideTitle\": true\n  }\n}\n```\n\nUtile lorsque votre logo inclut du texte et que vous ne voulez pas que le titre soit dupliqué.\n\n### hideLogo\n\n**Type :** `boolean`\n**Défaut :** `false`\n\nMasquer le logo dans la navigation de l'en-tête.\n\n```json\n{\n  \"site\": {\n    \"hideLogo\": true\n  }\n}\n```\n\nUtilisez ceci si vous voulez seulement afficher le texte du titre sans logo.\n\n## Exemples\n\n### Configuration minimale\n\nParfait pour commencer :\n\n```json\n{\n  \"site\": {\n    \"title\": \"Mes Docs\",\n    \"description\": \"Documentation pour mon projet\"\n  }\n}\n```\n\n### Projet Open Source\n\nPour un projet open source sur GitHub :\n\n```json\n{\n  \"site\": {\n    \"title\": \"Documentation MyLib\",\n    \"description\": \"Une bibliothèque puissante pour créer des choses géniales\",\n    \"url\": \"https://mylib.dev\",\n    \"organizationName\": \"Contributeurs MyLib\",\n    \"projectName\": \"mylib\",\n    \"logo\": \"/logo.svg\",\n    \"favicon\": \"/favicon.ico\"\n  }\n}\n```\n\n### Produit d'entreprise\n\nPour un produit commercial :\n\n```json\n{\n  \"site\": {\n    \"title\": \"Docs API Acme\",\n    \"description\": \"Référence API complète et guides pour la plateforme Acme\",\n    \"url\": \"https://docs.acme.com\",\n    \"organizationName\": \"Acme Corporation\",\n    \"projectName\": \"acme-platform\",\n    \"activeVersion\": \"v2.0.0\",\n    \"logo\": {\n      \"light\": \"/acme-logo-light.svg\",\n      \"dark\": \"/acme-logo-dark.svg\"\n    },\n    \"favicon\": \"/favicon-32x32.png\"\n  }\n}\n```\n\n### Site multilingue\n\nPour une documentation en plusieurs langues :\n\n```json\n{\n  \"site\": {\n    \"title\": \"Documentation\",\n    \"language\": \"es\",\n    \"url\": \"https://docs.example.com/es\",\n    \"logo\": \"/logo.svg\"\n  }\n}\n```\n\n## Modèles courants\n\n### Configuration GitHub Pages\n\nPour GitHub Pages sans domaine personnalisé :\n\n```json\n{\n  \"site\": {\n    \"title\": \"Mes Docs\",\n    \"url\": \"https://username.github.io/repo-name\",\n    \"baseUrl\": \"/repo-name/\"\n  }\n}\n```\n\n### Meilleures pratiques pour le logo\n\n**Pour un fond en mode clair :**\nUtilisez un logo sombre ou un logo avec de la couleur\n\n**Pour un fond en mode sombre :**\nUtilisez un logo clair/blanc ou inversez les couleurs\n\n**Exemple de configuration :**\n```json\n{\n  \"site\": {\n    \"logo\": {\n      \"light\": \"/logo-dark.svg\",\n      \"dark\": \"/logo-white.svg\"\n    }\n  }\n}\n```\n\n## Validation\n\nSpecra valide la configuration de votre site au démarrage. Erreurs courantes :\n\n**Titre manquant :**\n```\n❌ Erreur : site.title est requis\n```\n\n**URL invalide :**\n```\n❌ Erreur : site.url doit être une URL valide (inclure https://)\n```\n\n**Fichier de logo non trouvé :**\n```\n⚠️ Avertissement : Fichier de logo non trouvé à /logo.svg\n```\n\n## Variables d'environnement\n\nUtilisez des variables d'environnement pour différents environnements :\n\n```json\n{\n  \"site\": {\n    \"url\": \"${SITE_URL}\",\n    \"logo\": \"${LOGO_PATH}\"\n  }\n}\n```\n\nEnsuite, définissez-les :\n```bash\n# .env.local\nSITE_URL=https://docs.example.com\nLOGO_PATH=/logo.svg\n```\n\n## Prochaines étapes\n\n\u003cCardGrid cols={2}\u003e\n  \u003cCa om\",\n    \"organizationName\": \"Acme Corporation\",\n    \"projectName\": \"acme-platform\",\n    \"activeVersion\": \"v2.0.0\",\n    \"logo\": {\n      \"light\": \"/acme-logo-light.svg\",\n      \"dark\": \"/acme-logo-dark.svg\"\n    },\n    \"favicon\": \"/favicon-32x32.png\"\n  }\n}\n```\n\n### Site multilingue\n\nPour une documentation en plusieurs langues :\n\n```json\n{\n  \"site\": {\n    \"title\": \"Documentation\",\n    \"language\": \"es\",\n    \"url\": \"https://docs.example.com/es\",\n    \"logo\": \"/logo.svg\"\n  }\n}\n```\n\n## Modèles courants\n\n### Configuration GitHub Pages\n\nPour GitHub Pages sans domaine personnalisé :\n\n```json\n{\n  \"site\": {\n    \"title\": \"Mes Docs\",\n    \"url\": \"https://username.github.io/repo-name\",\n    \"baseUrl\": \"/repo-name/\"\n  }\n}\n```\n\n### Meilleures pratiques pour le logo\n\n**Pour un fond en mode clair :**\nUtilisez un logo sombre ou un logo avec de la couleur\n\n**Pour un fond en mode sombre :**\nUtilisez un logo clair/blanc ou inversez les couleurs\n\n**Exemple de configuration :**\n```json\n{\n  \"site\": {\n    \"logo\": {\n      \"light\": \"/logo-dark.svg\",\n      \"dark\": \"/logo-white.svg\"\n    }\n  }\n}\n```\n\n## Validation\n\nSpecra valide la configuration de votre site au démarrage. Erreurs courantes :\n\n**Titre manquant :**\n```\n❌ Erreur : site.title est requis\n```\n\n**URL invalide :**\n```\n❌ Erreur : site.url doit être une URL valide (inclure https://)\n```\n\n**Fichier de logo non trouvé :**\n```\n⚠️ Avertissement : Fichier de logo non trouvé à /logo.svg\n```\n\n## Variables d'environnement\n\nUtilisez des variables d'environnement pour différents environnements :\n\n```json\n{\n  \"site\": {\n    \"url\": \"${SITE_URL}\",\n    \"logo\": \"${LOGO_PATH}\"\n  }\n}\n```\n\nEnsuite, définissez-les :\n```bash\n# .env.local\nSITE_URL=https://docs.example.com\nLOGO_PATH=/logo.svg\n```\n\n## Prochaines étapes\n\n\u003cCardGrid cols={2}\u003e\n  \u003cCard\n    icon=\"layout\"\n    title=\"Navigation\"\n    description=\"Configurer la barre latérale, le fil d'Ariane et les groupes d'onglets\"\n    href=\"/docs/v1.0.0/configuration/navigation\"\n  /\u003e\n  \u003cCard\n    icon=\"rocket\"\n    title=\"Déploiement\"\n    description=\"Configurer la configuration de déploiement\"\n    href=\"/docs/v1.0.0/configuration/deployment-config\"\n  /\u003e\n  \u003cCard\n    icon=\"sliders\"\n    title=\"Avancé\"\n    description=\"Analytique, recherche et plus\"\n    href=\"/docs/v1.0.0/configuration/advanced\"\n  /\u003e\n  \u003cCard\n    icon=\"arrow-left\"\n    title=\"Aperçu\"\n    description=\"Retour à l'aperçu de la configuration\"\n    href=\"/docs/v1.0.0/configuration/overview\"\n  /\u003e\n\u003c/CardGrid\u003e\n"])</script><script>self.__next_f.push([1,"27:T23c8,"])</script><script>self.__next_f.push([1,"\n# Déployer sur Vercel\n\nVercel est le moyen le plus simple de déployer votre documentation Specra. Il est construit par les créateurs de Next.js, donc tout fonctionne parfaitement dès la sortie de la boîte.\n\n## Pourquoi Vercel ?\n\n- **Zéro configuration** - Détection et configuration automatiques\n- **Déploiements instantanés** - En ligne en moins de 60 secondes\n- **HTTPS automatique** - Certificats SSL inclus\n- **Réseau Edge** - Chargement rapide dans le monde entier\n- **Déploiements de prévisualisation** - Chaque push git reçoit une URL\n- **Niveau gratuit** - Limites généreuses pour les sites de documentation\n\n## Déploiement rapide\n\n\u003cSteps\u003e\n  \u003cStep title=\"Pousser sur GitHub\"\u003e\n    Si ce n'est pas déjà fait, poussez votre projet sur GitHub :\n\n```bash\ngit init\ngit add .\ngit commit -m \"Commit initial\"\ngit remote add origin https://github.com/username/repo.git\ngit push -u origin main\n```\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Importer dans Vercel\"\u003e\n    1. Allez sur [vercel.com/new](https://vercel.com/new)\n    2. Cliquez sur \"Import Git Repository\"\n    3. Sélectionnez votre dépôt de documentation\n    4. Vercel détecte automatiquement Next.js et configure tout\n\n    Aucune configuration manuelle nécessaire !\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Déployer\"\u003e\n    Cliquez sur \"Deploy\" et attendez environ 30-60 secondes.\n\n    Vous obtiendrez une URL de production comme `votre-projet.vercel.app`\n  \u003c/Step\u003e\n\u003c/Steps\u003e\n\n\u003cCallout type=\"success\"\u003e\nC'est tout ! Votre documentation est maintenant en ligne avec HTTPS automatique et CDN global.\n\u003c/Callout\u003e\n\n## Configuration\n\nVercel utilise automatiquement ces paramètres pour les projets Next.js :\n\n| Paramètre | Valeur |\n|-----------|--------|\n| Commande de build | `npm run build` |\n| Répertoire de sortie | `.next` |\n| Commande d'installation | `npm install` |\n| Version de Node | 20.x (dernière LTS) |\n\n### Remplacer les paramètres (Optionnel)\n\nSi vous avez besoin de paramètres personnalisés, créez `vercel.json` :\n\n```json\n{\n  \"buildCommand\": \"npm run build\",\n  \"outputDirectory\": \".next\",\n  \"installCommand\": \"npm ci\",\n  \"framework\": \"nextjs\",\n  \"regions\": [\"iad1\"]\n}\n```\n\n## Variables d'environnement\n\nAjoutez des variables d'environnement dans le tableau de bord Vercel :\n\n\u003cSteps\u003e\n  \u003cStep title=\"Aller aux paramètres du projet\"\u003e\n    Cliquez sur votre projet → Settings → Environment Variables\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Ajouter des variables\"\u003e\n    Ajoutez vos variables une par une :\n\n```\nMEILISEARCH_HOST=https://search.example.com\nMEILISEARCH_API_KEY=votre-clé-de-recherche\nNEXT_PUBLIC_GA_ID=G-XXXXXXXXXX\n```\n\n\u003cCallout type=\"tip\"\u003e\nLes variables commençant par `NEXT_PUBLIC_` sont exposées au navigateur. Gardez les clés sensibles sans ce préfixe.\n\u003c/Callout\u003e\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Redéployer\"\u003e\n    Les changements d'environnement nécessitent un redéploiement. Allez dans Deployments → Cliquez sur les trois points → Redeploy.\n  \u003c/Step\u003e\n\u003c/Steps\u003e\n\n## Domaine personnalisé\n\nAjoutez votre propre domaine à votre projet Vercel :\n\n\u003cSteps\u003e\n  \u003cStep title=\"Ajouter un domaine\"\u003e\n    1. Allez dans Project Settings → Domains\n    2. Entrez votre domaine (par ex., `docs.example.com`)\n    3. Cliquez sur \"Add\"\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Configurer le DNS\"\u003e\n    Vercel vous montre les enregistrements DNS à ajouter. Typiquement :\n\n**Pour sous-domaine (docs.example.com) :**\n```\nType: CNAME\nNom: docs\nValeur: cname.vercel-dns.com\n```\n\n**Pour domaine apex (example.com) :**\n```\nType: A\nNom: @\nValeur: 76.76.21.21\n```\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Attendre la vérification\"\u003e\n    La propagation DNS prend de 5 minutes à 48 heures (généralement moins d'une heure).\n\n    Vercel provisionne automatiquement un certificat SSL une fois le DNS vérifié.\n  \u003c/Step\u003e\n\u003c/Steps\u003e\n\n## Déploiements automatiques\n\nChaque push git déclenche un déploiement :\n\n**Déploiements de production :**\n- Les commits sur la branche `main` sont déployés en production\n- Met à jour votre site en direct automatiquement\n\n**Déploiements de prévisualisation :**\n- Les commits sur d'autres branches reçoivent des URL de prévisualisation\n- Les pull requests reçoivent des URL uniques pour les tests\n- Parfait pour examiner les changements avant de fusionner\n\n### URL de prévisualisation\n\nChaque déploiement de prévisualisation reçoit une URL unique :\n\n```\nvotre-projet-git-feature-branch-username.vercel.app\n```\n\nPartagez-la avec votre équipe pour examiner les changements avant la mise en ligne.\n\n## Paramètres de déploiement\n\n### Configuration de branche\n\nContrôlez quelles branches sont déployées :\n\n1. Allez dans Settings → Git\n2. Définissez la Production Branch (généralement `main`)\n3. Ectivez/désactivez les déploiements de prévisualisation pour les autres branches\n\n### Protection de déploiement\n\nProtégez les déploiements de production :\n\n```json\n{\n  \"git\": {\n    \"deploymentEnabled\": {\n      \"main\": true,\n      \"staging\": \"preview\"\n    }\n  }\n}\n```\n\n## Optimisation des performances\n\nVercel optimise automatiquement votre déploiement :\n\n- **Mise en cache Edge** - Fichiers statiques mis en cache mondialement\n- **Optimisation d'image** - Composant Image Next.js optimisé automatiquement\n- **Compression** - Compression Gzip/Brotli activée\n- **HTTP/2** - Connexions multiplexées plus rapides\n\n### Analytique\n\nActivez Vercel Analytics gratuitement :\n\n1. Allez dans l'onglet Analytics\n2. Cliquez sur \"Enable Analytics\"\n3. Ajoutez le composant Analytics à votre mise en page\n\n```tsx\n// app/layout.tsx\nimport { Analytics } from '@vercel/analytics/react'\n\nexport default function RootLayout({ children }) {\n  return (\n    \u003chtml\u003e\n      \u003cbody\u003e\n        {children}\n        \u003cAnalytics /\u003e\n      \u003c/body\u003e\n    \u003c/html\u003e\n  )\n}\n```\n\n## Intégration CI/CD\n\nVercel agit comme votre pipeline CI/CD :\n\n**Ce qui s'exécute à chaque déploiement :**\n- `npm install` (dépendances)\n- `npm run build` (build Next.js)\n- Vérifications et validations automatiques\n- Déploiement sur le réseau Edge\n\n### Intégration GitHub\n\nVercel commente les pull requests avec :\n- URL de déploiement de prévisualisation\n- Journaux de build\n- Aperçus de performance\n\n### Journaux de build\n\nVoir les journaux de build détaillés :\n1. Allez dans Deployments\n2. Cliquez sur n'importe quel déploiement\n3. Consultez la section Building pour les journaux\n\n## Dépannage\n\n### Échec du build\n\n**Vérifier la version de Node :**\nAssurez-vous d'utiliser Node 18+. Ajoutez à `package.json` :\n\n```json\n{\n  \"engines\": {\n    \"node\": \"\u003e=18.0.0\"\n  }\n}\n```\n\n**Vider le cache de build :**\n1. Allez dans Settings → General\n2. Faites défiler jusqu'à Build \u0026 Development Settings\n3. Vider le cache de build\n\n### Les variables d'environnement ne fonctionnent pas\n\n- Vérifiez les noms de variables (sensibles à la casse)\n- Préfixez les variables côté client avec `NEXT_PUBLIC_`\n- Redéployez après avoir changé les variables\n\n### Le domaine personnalisé ne fonctionne pas\n\n- Vérifiez que les enregistrements DNS sont corrects\n- Attendez la propagation DNS (vérifiez avec `dig` ou `nslookup`)\n- Assurez-vous que CNAME pointe vers `cname.vercel-dns.com`\n- Vérifiez le statut de vérification du domaine dans le tableau de bord Vercel\n\n## Déploiement Monorepo\n\nSi vos docs sont dans un monorepo :\n\n1. Définissez le Root Directory dans les paramètres du projet\n2. Pointez vers votre dossier docs (par ex., `apps/docs`)\n3. Vercel ne construit que ce répertoire\n\n```json\n{\n  \"buildCommand\": \"cd ../.. \u0026\u0026 npm run build:docs\",\n  \"outputDirectory\": \".next\"\n}\n```\n\n## Meilleures pratiques\n\n**Utiliser les déploiements de prévisualisation** - Tester les changements avant de fusionner vers main\n\n**Activer la protection de branche** - Exiger le succès du déploiement de prévisualisation avant de fusionner\n\n**Configurer les notifications** - Recevoir des alertes Slack/email pour le statut de déploiement\n\n**Surveiller l'analytique** - Suivre les pages vues et les performances\n\n**Utiliser la configuration Edge** - Stocker les drapeaux de fonctionnalité et la configuration en périphérie pour des mises à jour instantanées\n\n## Tarification\n\nLe niveau gratuit de Vercel comprend :\n- Déploiements illimités\n- 100 Go de bande passante/mois\n- HTTPS automatique\n- Déploiements de prévisualisation\n- Analytique (basique)\n\nCela est généralement suffisant pour les sites de documentation. Passez à Pro si vous avez besoin de :\n- Plus de bande passante\n- Analytique avancée\n- Protection par mot de passe\n- Support entreprise\n\n## Prochaines étapes\n\n\u003cCardGrid cols={2}\u003e\n  \u003cCard\n    icon=\"github\"\n    title=\"GitHub Pages\"\n    description=\"Déployer comme site statique sur GitHub Pages\"\n    href=\"/docs/v1.0.0/deployment/github-pages\"\n  /\u003e\n  \u003cCard\n    icon=\"globe\"\n    title=\"Netlify\"\n    description=\"Plateforme d'hébergement statique alternative\"\n    href=\"/docs/v1.0.0/deployment/netlify\"\n  /\u003e\n  \u003cCard\n    icon=\"arrow-left\"\n    title=\"Aperçu du déploiement\"\n    description=\"Retour aux options de déploiement\"\n    href=\"/docs/v1.0.0/deployment/overview\"\n  /\u003e\n  \u003cCard\n    icon=\"zap\"\n    title=\"Performance\"\n    description=\"Optimiser votre documentation\"\n    href=\"/docs/v1.0.0/performance\"\n  /\u003e\n\u003c/CardGrid\u003e\n"])</script><script>self.__next_f.push([1,"28:T23c8,"])</script><script>self.__next_f.push([1,"\n# Déployer sur Vercel\n\nVercel est le moyen le plus simple de déployer votre documentation Specra. Il est construit par les créateurs de Next.js, donc tout fonctionne parfaitement dès la sortie de la boîte.\n\n## Pourquoi Vercel ?\n\n- **Zéro configuration** - Détection et configuration automatiques\n- **Déploiements instantanés** - En ligne en moins de 60 secondes\n- **HTTPS automatique** - Certificats SSL inclus\n- **Réseau Edge** - Chargement rapide dans le monde entier\n- **Déploiements de prévisualisation** - Chaque push git reçoit une URL\n- **Niveau gratuit** - Limites généreuses pour les sites de documentation\n\n## Déploiement rapide\n\n\u003cSteps\u003e\n  \u003cStep title=\"Pousser sur GitHub\"\u003e\n    Si ce n'est pas déjà fait, poussez votre projet sur GitHub :\n\n```bash\ngit init\ngit add .\ngit commit -m \"Commit initial\"\ngit remote add origin https://github.com/username/repo.git\ngit push -u origin main\n```\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Importer dans Vercel\"\u003e\n    1. Allez sur [vercel.com/new](https://vercel.com/new)\n    2. Cliquez sur \"Import Git Repository\"\n    3. Sélectionnez votre dépôt de documentation\n    4. Vercel détecte
