tic/chunks/39f2b4ef802b0a18.js\",\"/_next/static/chunks/f99a41e049349196.js\",\"/_next/static/chunks/4faefc5fed54611f.js\"],\"Header\"]\n15:T17fc,"])</script><script>self.__next_f.push([1,"\n# Was ist Specra?\n\nSpecra ist ein modernes Dokumentations-Framework, das das Schreiben und Veröffentlichen technischer Dokumentation tatsächlich angenehm macht. Aufgebaut auf Next.js, MDX und Tailwind CSS, bietet es Ihnen das polierte Aussehen und Gefühl von Premium-Dokumentationsplattformen wie Mintlify, aber Sie hosten es selbst.\n\nWenn Sie jemals mit klobigen Dokumentationstools gekämpft oder viel zu viel für gehostete Lösungen bezahlt haben, ist Specra hier, um das zu ändern. Schreiben Sie Ihre Dokumente in Markdown, fügen Sie interaktive Komponenten hinzu, wenn Sie sie benötigen, und stellen Sie sie überall bereit, wo Sie möchten.\n\n## Warum wir Specra gebaut haben\n\nDokumentation sollte nicht schwer sein. Sie sollten sich darauf konzentrieren können, großartige Inhalte zu schreiben, und nicht mit Konfigurationsdateien ringen oder gegen Ihre Werkzeuge kämpfen müssen. Hier ist, was wir glauben:\n\n**Inhalt kommt zuerst.** Legen Sie Ihre MDX-Dateien in einen Ordner, und Specra erledigt den Rest. Kein manuelles Routing, keine Navigationseinrichtung, keine Kopfschmerzen bei der Build-Konfiguration.\n\n**Entwicklererfahrung zählt.** Hot Reload bedeutet, dass Sie Änderungen sofort sehen. TypeScript hält Sie sicher. Die Komponentenbibliothek ist da, wenn Sie sie brauchen, und unsichtbar, wenn nicht.\n\n**Leistung ist nicht verhandelbar.** Vorgerenderte Seiten, Edge-Caching, optimierte Bilder. Ihre Dokumente laden schnell, immer.\n\n**Flexibilität vor Lock-in.** Bereitstellung auf Vercel, GitHub Pages, Netlify oder überall dort, wo Node.js läuft oder statische Dateien bereitgestellt werden. Sie besitzen Ihre Inhalte und Ihre Infrastruktur.\n\n## Hauptfunktionen\n\n\u003cCardGrid cols={2}\u003e\n  \u003cCard icon=\"zap\" title=\"Blitzschnell\" description=\"Generierung statischer Seiten mit Edge-Caching. Ihre Dokumente laden in Millisekunden, nicht Sekunden.\" /\u003e\n  \u003cCard icon=\"search\" title=\"Leistungsstarke Suche\" description=\"MeiliSearch-Integration bietet Ihnen eine tippo-tolerante, sofortige Suche, die tatsächlich funktioniert.\" /\u003e\n  \u003cCard icon=\"git-branch\" title=\"Versionsverwaltung\" description=\"Liefern Sie mehrere Dokumentversionen nebeneinander aus. Perfekt für APIs und Bibliotheken mit Breaking Changes.\" /\u003e\n  \u003cCard icon=\"palette\" title=\"Schönes Theming\" description=\"Dark Mode sofort einsatzbereit. Passen Sie Farben, Schriftarten und Stile an Ihre Marke an.\" /\u003e\n  \u003cCard icon=\"code\" title=\"MDX-Komponenten\" description=\"Verwenden Sie Markdown für Inhalte, React-Komponenten für Interaktivität. Das Beste aus beiden Welten.\" /\u003e\n  \u003cCard icon=\"layout\" title=\"Smarte Navigation\" description=\"Automatisch generierte Seitenleiste aus Ihrer Dateistruktur. Einklappbare Abschnitte, Brotkrümel, Inhaltsverzeichnis.\" /\u003e\n\u003c/CardGrid\u003e\n\n## Der Stack\n\nWir haben Specra auf bewährten, modernen Technologien aufgebaut:\n\n- **Next.js 15+** mit dem App Router für optimale Leistung und Entwicklererfahrung\n- **MDX**, damit Sie Markdown mit React-Komponenten mischen können\n- **Tailwind CSS** für Styling, das sowohl leistungsstark als auch wartbar ist\n- **MeiliSearch** für eine Suche, die schnell ist und Tippfehler verzeiht\n- **TypeScript**, weil Typsicherheit Zeit und Nerven spart\n\n## Was Sie bekommen\n\nWenn Sie Specra verwenden, erhalten Sie ein komplettes Dokumentationssystem:\n\n**Reiche Inhaltskomponenten**\nCallouts, Tabs, Codeblöcke mit Syntax-Hervorhebung, Karten, Akkordeons, Schritte, Diagramme mit Mermaid, mathematische Gleichungen mit KaTeX und mehr.\n\n**Automatische Navigation**\nIhre Ordnerstruktur wird zu Ihrer Seitenleiste. Fügen Sie eine `_category_.json`-Datei hinzu, um Abschnitte anzupassen. Das war's.\n\n**Smarte Funktionen**\nLesezeitschätzungen, Zeitstempel der letzten Aktualisierung, Tag-Unterstützung, Brotkrümel, responsives Inhaltsverzeichnis mit Scroll-Tracking.\n\n**API-Dokumentation**\nGenerieren Sie schöne API-Referenzen aus OpenAPI-Spezifikationen, Postman-Sammlungen oder Specras eigenem Format. Interaktiver Playground enthalten.\n\n**Multi-Version-Support**\nPflegen Sie Dokumente für v1, v2, v3 gleichzeitig. Der Versionswechsler lässt Benutzer sofort zwischen ihnen springen.\n\n**Suche, die funktioniert**\nVolltextsuche mit Tastaturkürzeln (⌘K oder Ctrl+K). Funktioniert offline mit lokaler Suche oder skaliert mit MeiliSearch.\n\n**Theme-System**\nBeachtet Systemeinstellungen, unterstützt manuellen Dunkel/Hell-Umschalter, anpassbar über CSS-Variablen.\n\n**Produktionsbereit**\nSEO-Optimierung, Barrierefreiheit integriert, Sicherheits-Header, Leistungsüberwachung, CI/CD-Beispiele.\n\n## Wie es funktioniert\n\nSpecra folgt einer einfachen Philosophie: Sie schreiben, wir erledigen den Rest.\n\n\u003cSteps\u003e\n  \u003cStep title=\"Schreiben in MDX\"\u003e\n    Erstellen Sie `.mdx`-Dateien in Ihrem `docs/`-Ordner. Verwenden Sie Frontmatter für Metadaten. Schreiben Sie Markdown für Inhalte. Mischen Sie bei Bedarf React-Komponenten ein.\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Auto-Generierung\"\u003e\n    Specra scannt Ihre Dateien, generiert die Navigation, extrahiert Überschriften für das Inhaltsverzeichnis und richtet das Routing automatisch ein.\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Sofortige Vorschau\"\u003e\n    Starten Sie den Entwicklungsserver und sehen Sie Änderungen live, während Sie tippen. Hot Reload hält Sie im Flow.\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Überall bereitstellen\"\u003e\n    Build für Node.js-Hosting (Vercel, Railway) oder Export als statische Dateien (GitHub Pages, Netlify, Cloudflare Pages). Eine Codebasis, mehrere Bereitstellungsziele.\n  \u003c/Step\u003e\n\u003c/Steps\u003e\n\n## Wer sollte Specra verwenden?\n\nSpecra ist perfekt für:\n\n- **Open-Source-Maintainer**, die professionelle Dokumente ohne Hosting-Gebühren benötigen\n- **Startups**, die großartige Dokumentation ohne Enterprise-Preise wollen\n- **API-Entwickler**, die versionierte Dokumente und interaktive API-Referenzen benötigen\n- **Technische Redakteure**, die Markdown gegenüber WYSIWYG-Editoren bevorzugen\n- **Teams**, die wollen, dass Dokumente im selben Repo wie ihr Code leben\n\n## Bereit zu starten?\n\nSpringen Sie in den [Erste Schritte](/docs/v1.0.0/getting-started) Leitfaden und haben Sie Ihre erste Dokumentationsseite in unter 5 Minuten am Laufen.\n"])</script><script>self.__next_f.push([1,"16:T17fc,"])</script><script>self.__next_f.push([1,"\n# Was ist Specra?\n\nSpecra ist ein modernes Dokumentations-Framework, das das Schreiben und Veröffentlichen technischer Dokumentation tatsächlich angenehm macht. Aufgebaut auf Next.js, MDX und Tailwind CSS, bietet es Ihnen das polierte Aussehen und Gefühl von Premium-Dokumentationsplattformen wie Mintlify, aber Sie hosten es selbst.\n\nWenn Sie jemals mit klobigen Dokumentationstools gekämpft oder viel zu viel für gehostete Lösungen bezahlt haben, ist Specra hier, um das zu ändern. Schreiben Sie Ihre Dokumente in Markdown, fügen Sie interaktive Komponenten hinzu, wenn Sie sie benötigen, und stellen Sie sie überall bereit, wo Sie möchten.\n\n## Warum wir Specra gebaut haben\n\nDokumentation sollte nicht schwer sein. Sie sollten sich darauf konzentrieren können, großartige Inhalte zu schreiben, und nicht mit Konfigurationsdateien ringen oder gegen Ihre Werkzeuge kämpfen müssen. Hier ist, was wir glauben:\n\n**Inhalt kommt zuerst.** Legen Sie Ihre MDX-Dateien in einen Ordner, und Specra erledigt den Rest. Kein manuelles Routing, keine Navigationseinrichtung, keine Kopfschmerzen bei der Build-Konfiguration.\n\n**Entwicklererfahrung zählt.** Hot Reload bedeutet, dass Sie Änderungen sofort sehen. TypeScript hält Sie sicher. Die Komponentenbibliothek ist da, wenn Sie sie brauchen, und unsichtbar, wenn nicht.\n\n**Leistung ist nicht verhandelbar.** Vorgerenderte Seiten, Edge-Caching, optimierte Bilder. Ihre Dokumente laden schnell, immer.\n\n**Flexibilität vor Lock-in.** Bereitstellung auf Vercel, GitHub Pages, Netlify oder überall dort, wo Node.js läuft oder statische Dateien bereitgestellt werden. Sie besitzen Ihre Inhalte und Ihre Infrastruktur.\n\n## Hauptfunktionen\n\n\u003cCardGrid cols={2}\u003e\n  \u003cCard icon=\"zap\" title=\"Blitzschnell\" description=\"Generierung statischer Seiten mit Edge-Caching. Ihre Dokumente laden in Millisekunden, nicht Sekunden.\" /\u003e\n  \u003cCard icon=\"search\" title=\"Leistungsstarke Suche\" description=\"MeiliSearch-Integration bietet Ihnen eine tippo-tolerante, sofortige Suche, die tatsächlich funktioniert.\" /\u003e\n  \u003cCard icon=\"git-branch\" title=\"Versionsverwaltung\" description=\"Liefern Sie mehrere Dokumentversionen nebeneinander aus. Perfekt für APIs und Bibliotheken mit Breaking Changes.\" /\u003e\n  \u003cCard icon=\"palette\" title=\"Schönes Theming\" description=\"Dark Mode sofort einsatzbereit. Passen Sie Farben, Schriftarten und Stile an Ihre Marke an.\" /\u003e\n  \u003cCard icon=\"code\" title=\"MDX-Komponenten\" description=\"Verwenden Sie Markdown für Inhalte, React-Komponenten für Interaktivität. Das Beste aus beiden Welten.\" /\u003e\n  \u003cCard icon=\"layout\" title=\"Smarte Navigation\" description=\"Automatisch generierte Seitenleiste aus Ihrer Dateistruktur. Einklappbare Abschnitte, Brotkrümel, Inhaltsverzeichnis.\" /\u003e\n\u003c/CardGrid\u003e\n\n## Der Stack\n\nWir haben Specra auf bewährten, modernen Technologien aufgebaut:\n\n- **Next.js 15+** mit dem App Router für optimale Leistung und Entwicklererfahrung\n- **MDX**, damit Sie Markdown mit React-Komponenten mischen können\n- **Tailwind CSS** für Styling, das sowohl leistungsstark als auch wartbar ist\n- **MeiliSearch** für eine Suche, die schnell ist und Tippfehler verzeiht\n- **TypeScript**, weil Typsicherheit Zeit und Nerven spart\n\n## Was Sie bekommen\n\nWenn Sie Specra verwenden, erhalten Sie ein komplettes Dokumentationssystem:\n\n**Reiche Inhaltskomponenten**\nCallouts, Tabs, Codeblöcke mit Syntax-Hervorhebung, Karten, Akkordeons, Schritte, Diagramme mit Mermaid, mathematische Gleichungen mit KaTeX und mehr.\n\n**Automatische Navigation**\nIhre Ordnerstruktur wird zu Ihrer Seitenleiste. Fügen Sie eine `_category_.json`-Datei hinzu, um Abschnitte anzupassen. Das war's.\n\n**Smarte Funktionen**\nLesezeitschätzungen, Zeitstempel der letzten Aktualisierung, Tag-Unterstützung, Brotkrümel, responsives Inhaltsverzeichnis mit Scroll-Tracking.\n\n**API-Dokumentation**\nGenerieren Sie schöne API-Referenzen aus OpenAPI-Spezifikationen, Postman-Sammlungen oder Specras eigenem Format. Interaktiver Playground enthalten.\n\n**Multi-Version-Support**\nPflegen Sie Dokumente für v1, v2, v3 gleichzeitig. Der Versionswechsler lässt Benutzer sofort zwischen ihnen springen.\n\n**Suche, die funktioniert**\nVolltextsuche mit Tastaturkürzeln (⌘K oder Ctrl+K). Funktioniert offline mit lokaler Suche oder skaliert mit MeiliSearch.\n\n**Theme-System**\nBeachtet Systemeinstellungen, unterstützt manuellen Dunkel/Hell-Umschalter, anpassbar über CSS-Variablen.\n\n**Produktionsbereit**\nSEO-Optimierung, Barrierefreiheit integriert, Sicherheits-Header, Leistungsüberwachung, CI/CD-Beispiele.\n\n## Wie es funktioniert\n\nSpecra folgt einer einfachen Philosophie: Sie schreiben, wir erledigen den Rest.\n\n\u003cSteps\u003e\n  \u003cStep title=\"Schreiben in MDX\"\u003e\n    Erstellen Sie `.mdx`-Dateien in Ihrem `docs/`-Ordner. Verwenden Sie Frontmatter für Metadaten. Schreiben Sie Markdown für Inhalte. Mischen Sie bei Bedarf React-Komponenten ein.\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Auto-Generierung\"\u003e\n    Specra scannt Ihre Dateien, generiert die Navigation, extrahiert Überschriften für das Inhaltsverzeichnis und richtet das Routing automatisch ein.\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Sofortige Vorschau\"\u003e\n    Starten Sie den Entwicklungsserver und sehen Sie Änderungen live, während Sie tippen. Hot Reload hält Sie im Flow.\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Überall bereitstellen\"\u003e\n    Build für Node.js-Hosting (Vercel, Railway) oder Export als statische Dateien (GitHub Pages, Netlify, Cloudflare Pages). Eine Codebasis, mehrere Bereitstellungsziele.\n  \u003c/Step\u003e\n\u003c/Steps\u003e\n\n## Wer sollte Specra verwenden?\n\nSpecra ist perfekt für:\n\n- **Open-Source-Maintainer**, die professionelle Dokumente ohne Hosting-Gebühren benötigen\n- **Startups**, die großartige Dokumentation ohne Enterprise-Preise wollen\n- **API-Entwickler**, die versionierte Dokumente und interaktive API-Referenzen benötigen\n- **Technische Redakteure**, die Markdown gegenüber WYSIWYG-Editoren bevorzugen\n- **Teams**, die wollen, dass Dokumente im selben Repo wie ihr Code leben\n\n## Bereit zu starten?\n\nSpringen Sie in den [Erste Schritte](/docs/v1.0.0/getting-started) Leitfaden und haben Sie Ihre erste Dokumentationsseite in unter 5 Minuten am Laufen.\n"])</script><script>self.__next_f.push([1,"17:T233f,"])</script><script>self.__next_f.push([1,"\nSpecra bietet ein leistungsstarkes und dennoch flexibles System zur Dokumentation von REST-APIs. Egal ob Sie 5 oder 500 Endpunkte haben, wir haben alles für Sie.\n\n## Zwei Ansätze\n\n### 1. Automatisch generierte Dokumentation\n\nPerfekt für große APIs oder wenn Sie bereits Spezifikationen haben.\n\n\u003cdiv className=\"grid grid-cols-1 md:grid-cols-3 gap-4 not-prose my-6\"\u003e\n  \u003cdiv className=\"border border-border rounded-lg p-4\"\u003e\n    \u003cdiv className=\"text-2xl mb-2\"\u003e📋\u003c/div\u003e\n    \u003ch4 className=\"font-semibold mb-1\"\u003eSpecra-Format\u003c/h4\u003e\n    \u003cp className=\"text-sm text-muted-foreground\"\u003eEinfaches JSON-Format\u003c/p\u003e\n  \u003c/div\u003e\n  \u003cdiv className=\"border border-border rounded-lg p-4\"\u003e\n    \u003cdiv className=\"text-2xl mb-2\"\u003e🔧\u003c/div\u003e\n    \u003ch4 className=\"font-semibold mb-1\"\u003eOpenAPI 3.x\u003c/h4\u003e\n    \u003cp className=\"text-sm text-muted-foreground\"\u003eIndustriestandard\u003c/p\u003e\n  \u003c/div\u003e\n  \u003cdiv className=\"border border-border rounded-lg p-4\"\u003e\n    \u003cdiv className=\"text-2xl mb-2\"\u003e📮\u003c/div\u003e\n    \u003ch4 className=\"font-semibold mb-1\"\u003ePostman v2.x\u003c/h4\u003e\n    \u003cp className=\"text-sm text-muted-foreground\"\u003eExport aus Postman\u003c/p\u003e\n  \u003c/div\u003e\n\u003c/div\u003e\n\nErstellen oder exportieren Sie einfach Ihre Spezifikationsdatei und referenzieren Sie sie:\n\n```mdx\n\u003cApiReference spec=\"/api-specs/my-api.json\" /\u003e\n```\n\nDas System **erkennt automatisch** das Format und generiert schöne, interaktive Dokumentation.\n\n**Beispiele:**\n- [Specra-Format (JSONPlaceholder) →](/docs/v1.0.0/api-test)\n- [OpenAPI 3.0 Format →](/docs/v1.0.0/api-openapi)\n- [Postman-Sammlung →](/docs/v1.0.0/api-postman)\n\n[Mehr über Formate erfahren →](/docs/v1.0.0/api-formats)\n\n---\n\n### 2. Manuelle MDX-Komponenten\n\nPerfekt für kleine APIs oder wenn Sie benutzerdefinierte Layouts benötigen.\n\nVerwenden Sie einzelne Komponenten, um Ihre Dokumentation zu erstellen:\n\n```mdx\n\u003cApiEndpoint\n  method=\"GET\"\n  path=\"/api/users/:id\"\n  summary=\"Benutzer per ID abrufen\"\n\u003e\n  \u003cApiParams params={[...]} /\u003e\n  \u003cApiResponse status={200} example={{...}} /\u003e\n  \u003cApiPlayground method=\"GET\" path=\"/api/users/123\" /\u003e\n\u003c/ApiEndpoint\u003e\n```\n\n**Beispiel:**\n- [Beispiel für manuelle Komponenten →](/docs/v1.0.0/api-example)\n\n---\n\n## Schnellstart\n\n### Automatisch generiert (Empfohlen)\n\n1. **Erstellen Sie Ihre Spezifikationsdatei** (Specra, OpenAPI oder Postman)\n2. **Platzieren Sie sie in** `/public/api-specs/my-api.json`\n3. **Fügen Sie zu Ihrer MDX hinzu**:\n\n```mdx\n---\ntitle: API-Referenz\n---\n\n# Meine API-Dokumentation\n\n\u003cApiReference spec=\"/api-specs/my-api.json\" /\u003e\n```\n\nDas ist alles! Sie haben jetzt:\n- ✅ Automatisch generierte Endpunkt-Dokumentation\n- ✅ Interaktiven API-Playground\n- ✅ Einklappbare Akkordeon-Benutzeroberfläche\n- ✅ Syntax-hervorgehobene Beispiele\n- ✅ Request/Response-Schemas\n\n### Manuelle Komponenten\n\n1. **Erstellen Sie eine MDX-Datei** in `docs/`\n2. **Verwenden Sie API-Komponenten**:\n\n```mdx\n---\ntitle: API-Referenz\n---\n\n# Meine API\n\n\u003cApiEndpoint method=\"GET\" path=\"/users\" summary=\"Benutzer auflisten\"\u003e\n  \u003cApiParams\n    title=\"Query-Parameter\"\n    params={[\n      { name: \"page\", type: \"number\", description: \"Seitennummer\" }\n    ]}\n  /\u003e\n\n  \u003cApiResponse\n    status={200}\n    description=\"Erfolg\"\n    example={[{ id: 1, name: \"John\" }]}\n  /\u003e\n\n  \u003cApiPlayground\n    method=\"GET\"\n    path=\"/users\"\n    baseUrl=\"https://api.example.com\"\n  /\u003e\n\u003c/ApiEndpoint\u003e\n```\n\n## Verfügbare Komponenten\n\n### `\u003cApiReference\u003e`\n\nDokumente automatisch aus Spezifikationsdateien generieren.\n\n```tsx\n\u003cApiReference\n  spec=\"/api-specs/my-api.json\"  // Pfad zur Spezifikationsdatei\n  parser=\"auto\"                   // auto | specra | openapi | postman\n  showPlayground={true}           // Interaktiven Playground anzeigen\n/\u003e\n```\n\n### `\u003cApiEndpoint\u003e`\n\nDokumentieren Sie einen einzelnen Endpunkt (Akkordeon-Stil).\n\n```tsx\n\u003cApiEndpoint\n  method=\"GET\"              // GET | POST | PUT | PATCH | DELETE\n  path=\"/api/users/:id\"     // API-Pfad\n  summary=\"Benutzer per ID abrufen\"  // Kurze Beschreibung\n  defaultOpen={false}       // Erweitert starten?\n\u003e\n  {/* Untergeordnete Komponenten */}\n\u003c/ApiEndpoint\u003e\n```\n\n### `\u003cApiParams\u003e`\n\nParameter anzeigen (Pfad, Query, Body).\n\n```tsx\n\u003cApiParams\n  title=\"Pfadparameter\"\n  params={[\n    {\n      name: \"id\",\n      type: \"string\",\n      required: true,\n      description: \"Benutzer-ID\",\n      example: \"user_123\"\n    }\n  ]}\n/\u003e\n```\n\n### `\u003cApiResponse\u003e`\n\nAntwortbeispiele anzeigen.\n\n```tsx\n\u003cApiResponse\n  status={200}\n  description=\"Benutzer gefunden\"\n  example={{\n    id: \"user_123\",\n    name: \"John Doe\",\n    email: \"john@example.com\"\n  }}\n/\u003e\n```\n\n### `\u003cApiPlayground\u003e`\n\nInteraktives API-Testen.\n\n```tsx\n\u003cApiPlayground\n  method=\"GET\"\n  path=\"/users/:id\"\n  baseUrl=\"https://api.example.com\"\n  headers={{ \"Authorization\": \"Bearer ...\" }}\n  pathParams={[\n    { name: \"id\", type: \"string\", example: \"user_123\" }\n  ]}\n  defaultBody='{\"key\": \"value\"}'\n/\u003e\n```\n\n## Funktionen\n\n### Interaktiver Playground\n\nJeder Endpunkt enthält einen integrierten Playground, in dem Benutzer:\n- ✅ Pfadparameter bearbeiten können\n- ✅ Request-Header ändern können\n- ✅ Request-Body aktualisieren können\n- ✅ Echte API-Anfragen senden können\n- ✅ Formatierte Antworten anzeigen können\n\n### Akkordeon-UI\n\nEndpunkte sind standardmäßig einklappbar, was es einfach macht:\n- Viele Endpunkte schnell zu durchsuchen\n- Nur das zu erweitern, was Sie benötigen\n- Die Seite sauber und organisiert zu halten\n\n### Syntax-Hervorhebung\n\nAlle Codebeispiele enthalten:\n- JSON-Syntax-Hervorhebung\n- Zeilennummern\n- Kopieren-Button\n- Dark Mode Unterstützung\n\n### Authentifizierung\n\nDokumentieren Sie Ihre Auth-Anforderungen:\n- Bearer-Token\n- API-Keys\n- Basic Auth\n- Benutzerdefinierte Header\n\n## Format-Unterstützung\n\n| Format | Version | Anwendungsfall |\n|--------|---------|----------------|\n| **Specra** | 1.0 | Einfaches, benutzerdefiniertes Format für jede API |\n| **OpenAPI** | 3.x, Swagger 2.0 | Industriestandard, Code-Generierung |\n| **Postman** | Collection v2.x | Postman-Benutzer, schneller Export |\n\n[Formate vergleichen →](/docs/v1.0.0/api-formats)\n\n## Beispiele\n\n### Vollständige API (Automatisch generiert)\n\nVerwendung von JSONPlaceholder als echtes Arbeitsbeispiel:\n\n[Live-Beispiel ansehen →](/docs/v1.0.0/api-test)\n\n### OpenAPI-Spezifikation\n\nAPI-Dokumentation auf Unternehmensniveau:\n\n[OpenAPI-Beispiel ansehen →](/docs/v1.0.0/api-openapi)\n\n### Postman-Sammlung\n\nDirekt aus Postman exportiert:\n\n[Postman-Beispiel ansehen →](/docs/v1.0.0/api-postman)\n\n### Manuelle Komponenten\n\nHandgefertigt für benutzerdefinierte Anforderungen:\n\n[Manuelles Beispiel ansehen →](/docs/v1.0.0/api-example)\n\n## Best Practices\n\n### 1. Wählen Sie den richtigen Ansatz\n\n**Verwenden Sie automatisch generiert**, wenn:\n- Sie \u003e 10 Endpunkte haben\n- Sie bereits eine Spezifikationsdatei haben\n- Sie Konsistenz wünschen\n- Sie Code-Generierung benötigen\n\n**Verwenden Sie manuelle Komponenten**, wenn:\n- Sie \u003c 10 Endpunkte haben\n- Sie benutzerdefinierte Layouts benötigen\n- Sie die volle Kontrolle wünschen\n- Sie schrittweise dokumentieren\n\n### 2. Geben Sie Beispiele an\n\nFügen Sie immer realistische Beispiele hinzu:\n- Request-Bodys mit echten Daten\n- Antwortbeispiele, die der Realität entsprechen\n- Randfälle und Fehler\n- Authentifizierungsbeispiele\n\n### 3. Halten Sie es aktuell\n\n**Für automatisch generierte Dokumente:**\n- Generieren Sie Spezifikationen neu, wenn sich der Code ändert\n- Exportieren Sie Postman-Sammlungen regelmäßig neu\n- Versionieren Sie Ihre Spezifikationsdateien\n\n**Für manuelle Dokumente:**\n- Überprüfen Sie, wenn sich die API ändert\n- Testen Sie den Playground regelmäßig\n- Aktualisieren Sie Beispiele\n\n### 4. Nach Funktion organisieren\n\nGruppieren Sie verwandte Endpunkte:\n\n```mdx\n## Benutzerverwaltung\n\n\u003cApiReference spec=\"/api-specs/users.json\" /\u003e\n\n## Produktkatalog\n\n\u003cApiReference spec=\"/api-specs/products.json\" /\u003e\n\n## Bestellungen\n\n\u003cApiReference spec=\"/api-specs/orders.json\" /\u003e\n```\n\n### 5. Kontext hinzufügen\n\nErgänzen Sie mit erklärendem Text:\n\n```mdx\n## Authentifizierung\n\nAlle Endpunkte erfordern ein gültiges JWT-Token.\n\n\u003cCallout type=\"info\"\u003e\nErhalten Sie Ihren API-Schlüssel vom [Entwickler-Dashboard](https://example.com/dashboard).\n\u003c/Callout\u003e\n\n\u003cApiReference spec=\"/api-specs/my-api.json\" /\u003e\n```\n\n## Nächste Schritte\n\nBereit, Ihre API zu dokumentieren?\n\n1. **Wählen Sie Ihr Format** - [Formate vergleichen →](/docs/v1.0.0/api-formats)\n2. **Beispiele ansehen** - [Beispiele ansehen →](/docs/v1.0.0/api-test)\n3. **Starten Sie den Aufbau** - Erstellen Sie Ihre erste Spezifikationsdatei\n4. **Go live** - Stellen Sie Ihre Dokumentation bereit\n\n\u003cCallout type=\"success\" title=\"Schneller Gewinn\"\u003e\nHaben Sie eine Postman-Sammlung? Exportieren Sie sie und Sie sind in 2 Minuten fertig!\n\u003c/Callout\u003e\n\n## Ressourcen\n\n- [Leitfaden für unterstützte Formate](/docs/v1.0.0/api-formats)\n- [Specra-Format Beispiel](/docs/v1.0.0/api-test)\n- [OpenAPI Beispiel](/docs/v1.0.0/api-openapi)\n- [Postman Beispiel](/docs/v1.0.0/api-postman)\n- [Beispiel für manuelle Komponenten](/docs/v1.0.0/api-example)\n- [Technische Dokumentation zum Parser](/API_PARSERS.md)\n"])</script><script>self.__next_f.push([1,"18:T233f,"])</script><script>self.__next_f.push([1,"\nSpecra bietet ein leistungsstarkes und dennoch flexibles System zur Dokumentation von REST-APIs. Egal ob Sie 5 oder 500 Endpunkte haben, wir haben alles für Sie.\n\n## Zwei Ansätze\n\n### 1. Automatisch generierte Dokumentation\n\nPerfekt für große APIs oder wenn Sie bereits Spezifikationen haben.\n\n\u003cdiv className=\"grid grid-cols-1 md:grid-cols-3 gap-4 not-prose my-6\"\u003e\n  \u003cdiv className=\"border border-border rounded-lg p-4\"\u003e\n    \u003cdiv className=\"text-2xl mb-2\"\u003e📋\u003c/div\u003e\n    \u003ch4 className=\"font-semibold mb-1\"\u003eSpecra-Format\u003c/h4\u003e\n    \u003cp className=\"text-sm text-muted-foreground\"\u003eEinfaches JSON-Format\u003c/p\u003e\n  \u003c/div\u003e\n  \u003cdiv className=\"border border-border rounded-lg p-4\"\u003e\n    \u003cdiv className=\"text-2xl mb-2\"\u003e🔧\u003c/div\u003e\n    \u003ch4 className=\"font-semibold mb-1\"\u003eOpenAPI 3.x\u003c/h4\u003e\n    \u003cp className=\"text-sm text-muted-foreground\"\u003eIndustriestandard\u003c/p\u003e\n  \u003c/div\u003e\n  \u003cdiv className=\"border border-border rounded-lg p-4\"\u003e\n    \u003cdiv className=\"text-2xl mb-2\"\u003e📮\u003c/div\u003e\n    \u003ch4 className=\"font-semibold mb-1\"\u003ePostman v2.x\u003c/h4\u003e\n    \u003cp className=\"text-sm text-muted-foreground\"\u003eExport aus Postman\u003c/p\u003e\n  \u003c/div\u003e\n\u003c/div\u003e\n\nErstellen oder exportieren Sie einfach Ihre Spezifikationsdatei und referenzieren Sie sie:\n\n```mdx\n\u003cApiReference spec=\"/api-specs/my-api.json\" /\u003e\n```\n\nDas System **erkennt automatisch** das Format und generiert schöne, interaktive Dokumentation.\n\n**Beispiele:**\n- [Specra-Format (JSONPlaceholder) →](/docs/v1.0.0/api-test)\n- [OpenAPI 3.0 Format →](/docs/v1.0.0/api-openapi)\n- [Postman-Sammlung →](/docs/v1.0.0/api-postman)\n\n[Mehr über Formate erfahren →](/docs/v1.0.0/api-formats)\n\n---\n\n### 2. Manuelle MDX-Komponenten\n\nPerfekt für kleine APIs oder wenn Sie benutzerdefinierte Layouts benötigen.\n\nVerwenden Sie einzelne Komponenten, um Ihre Dokumentation zu erstellen:\n\n```mdx\n\u003cApiEndpoint\n  method=\"GET\"\n  path=\"/api/users/:id\"\n  summary=\"Benutzer per ID abrufen\"\n\u003e\n  \u003cApiParams params={[...]} /\u003e\n  \u003cApiResponse status={200} example={{...}} /\u003e\n  \u003cApiPlayground method=\"GET\" path=\"/api/users/123\" /\u003e\n\u003c/ApiEndpoint\u003e\n```\n\n**Beispiel:**\n- [Beispiel für manuelle Komponenten →](/docs/v1.0.0/api-example)\n\n---\n\n## Schnellstart\n\n### Automatisch generiert (Empfohlen)\n\n1. **Erstellen Sie Ihre Spezifikationsdatei** (Specra, OpenAPI oder Postman)\n2. **Platzieren Sie sie in** `/public/api-specs/my-api.json`\n3. **Fügen Sie zu Ihrer MDX hinzu**:\n\n```mdx\n---\ntitle: API-Referenz\n---\n\n# Meine API-Dokumentation\n\n\u003cApiReference spec=\"/api-specs/my-api.json\" /\u003e\n```\n\nDas ist alles! Sie haben jetzt:\n- ✅ Automatisch generierte Endpunkt-Dokumentation\n- ✅ Interaktiven API-Playground\n- ✅ Einklappbare Akkordeon-Benutzeroberfläche\n- ✅ Syntax-hervorgehobene Beispiele\n- ✅ Request/Response-Schemas\n\n### Manuelle Komponenten\n\n1. **Erstellen Sie eine MDX-Datei** in `docs/`\n2. **Verwenden Sie API-Komponenten**:\n\n```mdx\n---\ntitle: API-Referenz\n---\n\n# Meine API\n\n\u003cApiEndpoint method=\"GET\" path=\"/users\" summary=\"Benutzer auflisten\"\u003e\n  \u003cApiParams\n    title=\"Query-Parameter\"\n    params={[\n      { name: \"page\", type: \"number\", description: \"Seitennummer\" }\n    ]}\n  /\u003e\n\n  \u003cApiResponse\n    status={200}\n    description=\"Erfolg\"\n    example={[{ id: 1, name: \"John\" }]}\n  /\u003e\n\n  \u003cApiPlayground\n    method=\"GET\"\n    path=\"/users\"\n    baseUrl=\"https://api.example.com\"\n  /\u003e\n\u003c/ApiEndpoint\u003e\n```\n\n## Verfügbare Komponenten\n\n### `\u003cApiReference\u003e`\n\nDokumente automatisch aus Spezifikationsdateien generieren.\n\n```tsx\n\u003cApiReference\n  spec=\"/api-specs/my-api.json\"  // Pfad zur Spezifikationsdatei\n  parser=\"auto\"                   // auto | specra | openapi | postman\n  showPlayground={true}           // Interaktiven Playground anzeigen\n/\u003e\n```\n\n### `\u003cApiEndpoint\u003e`\n\nDokumentieren Sie einen einzelnen Endpunkt (Akkordeon-Stil).\n\n```tsx\n\u003cApiEndpoint\n  method=\"GET\"              // GET | POST | PUT | PATCH | DELETE\n  path=\"/api/users/:id\"     // API-Pfad\n  summary=\"Benutzer per ID abrufen\"  // Kurze Beschreibung\n  defaultOpen={false}       // Erweitert starten?\n\u003e\n  {/* Untergeordnete Komponenten */}\n\u003c/ApiEndpoint\u003e\n```\n\n### `\u003cApiParams\u003e`\n\nParameter anzeigen (Pfad, Query, Body).\n\n```tsx\n\u003cApiParams\n  title=\"Pfadparameter\"\n  params={[\n    {\n      name: \"id\",\n      type: \"string\",\n      required: true,\n      description: \"Benutzer-ID\",\n      example: \"user_123\"\n    }\n  ]}\n/\u003e\n```\n\n### `\u003cApiResponse\u003e`\n\nAntwortbeispiele anzeigen.\n\n```tsx\n\u003cApiResponse\n  status={200}\n  description=\"Benutzer gefunden\"\n  example={{\n    id: \"user_123\",\n    name: \"John Doe\",\n    email: \"john@example.com\"\n  }}\n/\u003e\n```\n\n### `\u003cApiPlayground\u003e`\n\nInteraktives API-Testen.\n\n```tsx\n\u003cApiPlayground\n  method=\"GET\"\n  path=\"/users/:id\"\n  baseUrl=\"https://api.example.com\"\n  headers={{ \"Authorization\": \"Bearer ...\" }}\n  pathParams={[\n    { name: \"id\", type: \"string\", example: \"user_123\" }\n  ]}\n  defaultBody='{\"key\": \"value\"}'\n/\u003e\n```\n\n## Funktionen\n\n### Interaktiver Playground\n\nJeder Endpunkt enthält einen integrierten Playground, in dem Benutzer:\n- ✅ Pfadparameter bearbeiten können\n- ✅ Request-Header ändern können\n- ✅ Request-Body aktualisieren können\n- ✅ Echte API-Anfragen senden können\n- ✅ Formatierte Antworten anzeigen können\n\n### Akkordeon-UI\n\nEndpunkte sind standardmäßig einklappbar, was es einfach macht:\n- Viele Endpunkte schnell zu durchsuchen\n- Nur das zu erweitern, was Sie benötigen\n- Die Seite sauber und organisiert zu halten\n\n### Syntax-Hervorhebung\n\nAlle Codebeispiele enthalten:\n- JSON-Syntax-Hervorhebung\n- Zeilennummern\n- Kopieren-Button\n- Dark Mode Unterstützung\n\n### Authentifizierung\n\nDokumentieren Sie Ihre Auth-Anforderungen:\n- Bearer-Token\n- API-Keys\n- Basic Auth\n- Benutzerdefinierte Header\n\n## Format-Unterstützung\n\n| Format | Version | Anwendungsfall |\n|--------|---------|----------------|\n| **Specra** | 1.0 | Einfaches, benutzerdefiniertes Format für jede API |\n| **OpenAPI** | 3.x, Swagger 2.0 | Industriestandard, Code-Generierung |\n| **Postman** | Collection v2.x | Postman-Benutzer, schneller Export |\n\n[Formate vergleichen →](/docs/v1.0.0/api-formats)\n\n## Beispiele\n\n### Vollständige API (Automatisch generiert)\n\nVerwendung von JSONPlaceholder als echtes Arbeitsbeispiel:\n\n[Live-Beispiel ansehen →](/docs/v1.0.0/api-test)\n\n### OpenAPI-Spezifikation\n\nAPI-Dokumentation auf Unternehmensniveau:\n\n[OpenAPI-Beispiel ansehen →](/docs/v1.0.0/api-openapi)\n\n### Postman-Sammlung\n\nDirekt aus Postman exportiert:\n\n[Postman-Beispiel ansehen →](/docs/v1.0.0/api-postman)\n\n### Manuelle Komponenten\n\nHandgefertigt für benutzerdefinierte Anforderungen:\n\n[Manuelles Beispiel ansehen →](/docs/v1.0.0/api-example)\n\n## Best Practices\n\n### 1. Wählen Sie den richtigen Ansatz\n\n**Verwenden Sie automatisch generiert**, wenn:\n- Sie \u003e 10 Endpunkte haben\n- Sie bereits eine Spezifikationsdatei haben\n- Sie Konsistenz wünschen\n- Sie Code-Generierung benötigen\n\n**Verwenden Sie manuelle Komponenten**, wenn:\n- Sie \u003c 10 Endpunkte haben\n- Sie benutzerdefinierte Layouts benötigen\n- Sie die volle Kontrolle wünschen\n- Sie schrittweise dokumentieren\n\n### 2. Geben Sie Beispiele an\n\nFügen Sie immer realistische Beispiele hinzu:\n- Request-Bodys mit echten Daten\n- Antwortbeispiele, die der Realität entsprechen\n- Randfälle und Fehler\n- Authentifizierungsbeispiele\n\n### 3. Halten Sie es aktuell\n\n**Für automatisch generierte Dokumente:**\n- Generieren Sie Spezifikationen neu, wenn sich der Code ändert\n- Exportieren Sie Postman-Sammlungen regelmäßig neu\n- Versionieren Sie Ihre Spezifikationsdateien\n\n**Für manuelle Dokumente:**\n- Überprüfen Sie, wenn sich die API ändert\n- Testen Sie den Playground regelmäßig\n- Aktualisieren Sie Beispiele\n\n### 4. Nach Funktion organisieren\n\nGruppieren Sie verwandte Endpunkte:\n\n```mdx\n## Benutzerverwaltung\n\n\u003cApiReference spec=\"/api-specs/users.json\" /\u003e\n\n## Produktkatalog\n\n\u003cApiReference spec=\"/api-specs/products.json\" /\u003e\n\n## Bestellungen\n\n\u003cApiReference spec=\"/api-specs/orders.json\" /\u003e\n```\n\n### 5. Kontext hinzufügen\n\nErgänzen Sie mit erklärendem Text:\n\n```mdx\n## Authentifizierung\n\nAlle Endpunkte erfordern ein gültiges JWT-Token.\n\n\u003cCallout type=\"info\"\u003e\nErhalten Sie Ihren API-Schlüssel vom [Entwickler-Dashboard](https://example.com/dashboard).\n\u003c/Callout\u003e\n\n\u003cApiReference spec=\"/api-specs/my-api.json\" /\u003e\n```\n\n## Nächste Schritte\n\nBereit, Ihre API zu dokumentieren?\n\n1. **Wählen Sie Ihr Format** - [Formate vergleichen →](/docs/v1.0.0/api-formats)\n2. **Beispiele ansehen** - [Beispiele ansehen →](/docs/v1.0.0/api-test)\n3. **Starten Sie den Aufbau** - Erstellen Sie Ihre erste Spezifikationsdatei\n4. **Go live** - Stellen Sie Ihre Dokumentation bereit\n\n\u003cCallout type=\"success\" title=\"Schneller Gewinn\"\u003e\nHaben Sie eine Postman-Sammlung? Exportieren Sie sie und Sie sind in 2 Minuten fertig!\n\u003c/Callout\u003e\n\n## Ressourcen\n\n- [Leitfaden für unterstützte Formate](/docs/v1.0.0/api-formats)\n- [Specra-Format Beispiel](/docs/v1.0.0/api-test)\n- [OpenAPI Beispiel](/docs/v1.0.0/api-openapi)\n- [Postman Beispiel](/docs/v1.0.0/api-postman)\n- [Beispiel für manuelle Komponenten](/docs/v1.0.0/api-example)\n- [Technische Dokumentation zum Parser](/API_PARSERS.md)\n"])</script><script>self.__next_f.push([1,"19:T84c,"])</script><script>self.__next_f.push([1,"\nDie Akkordeon-Komponente erstellt einklappbare Inhaltsabschnitte, ideal für FAQs, erweiterbare Menüs oder die Organisation großer Mengen an Inhalten.\n\n## Verwendung\n\n```mdx\n\u003cAccordion\u003e\n  \u003cAccordionItem title=\"Erste Frage\" defaultOpen\u003e\n    Dieser Inhalt ist standardmäßig sichtbar wegen `defaultOpen`.\n  \u003c/AccordionItem\u003e\n  \n  \u003cAccordionItem title=\"Zweite Frage\"\u003e\n    Dieser Inhalt ist standardmäßig eingeklappt.\n  \u003c/AccordionItem\u003e\n\u003c/Accordion\u003e\n```\n\n## Live-Beispiel\n\n\u003cAccordion\u003e\n  \u003cAccordionItem title=\"Was ist ein Akkordeon?\" defaultOpen\u003e\n    Ein Akkordeon ist ein UI-Muster, das es Benutzern ermöglicht, Inhaltsabschnitte zu erweitern und einzuklappen. Es ist nützlich, um Informationen in einem kompakten, scanbaren Format zu organisieren.\n  \u003c/AccordionItem\u003e\n  \n  \u003cAccordionItem title=\"Wann sollte ich Akkordeons verwenden?\"\u003e\n    Verwenden Sie Akkordeons, wenn Sie mehrere Inhaltsabschnitte haben, die Benutzer durchsuchen möchten, ohne durch alles scrollen zu müssen. Häufige Anwendungsfälle sind FAQs, Funktionslisten und Konfigurationsoptionen.\n  \u003c/AccordionItem\u003e\n  \n  \u003cAccordionItem title=\"Kann ich mehrere Elemente geöffnet haben?\"\u003e\n    Ja! Standardmäßig erlaubt das Akkordeon, dass mehrere Elemente gleichzeitig geöffnet sind. Jedes AkkordeonItem arbeitet unabhängig.\n  \u003c/AccordionItem\u003e\n\u003c/Accordion\u003e\n\n## Props\n\n### Accordion\n\n| Prop | Typ | Standard | Beschreibung |\n|------|-----|----------|--------------|\n| `children` | `ReactNode` | erforderlich | Zu rendernde AccordionItem-Komponenten |\n| `type` | `\"single\" \\| \"multiple\"` | `\"multiple\"` | Ob ein oder mehrere Elemente geöffnet sein können |\n\n### AccordionItem\n\n| Prop | Typ | Standard | Beschreibung |\n|------|-----|----------|--------------|\n| `title` | `string` | erforderlich | Der anklickbare Header-Text |\n| `children` | `ReactNode` | erforderlich | Inhalt, der angezeigt wird, wenn erweitert |\n| `defaultOpen` | `boolean` | `false` | Ob das Element erweitert startet |\n\n## Tipps\n\n\u003cCallout type=\"tip\"\u003e\nVerwenden Sie die `defaultOpen` Prop beim ersten AccordionItem, um Benutzern eine Vorschau des Inhaltsformats zu geben.\n\u003c/Callout\u003e\n"])</script><script>self.__next_f.push([1,"1a:T84c,"])</script><script>self.__next_f.push([1,"\nDie Akkordeon-Komponente erstellt einklappbare Inhaltsabschnitte, ideal für FAQs, erweiterbare Menüs oder die Organisation großer Mengen an Inhalten.\n\n## Verwendung\n\n```mdx\n\u003cAccordion\u003e\n  \u003cAccordionItem title=\"Erste Frage\" defaultOpen\u003e\n    Dieser Inhalt ist standardmäßig sichtbar wegen `defaultOpen`.\n  \u003c/AccordionItem\u003e\n  \n  \u003cAccordionItem title=\"Zweite Frage\"\u003e\n    Dieser Inhalt ist standardmäßig eingeklappt.\n  \u003c/AccordionItem\u003e\n\u003c/Accordion\u003e\n```\n\n## Live-Beispiel\n\n\u003cAccordion\u003e\n  \u003cAccordionItem title=\"Was ist ein Akkordeon?\" defaultOpen\u003e\n    Ein Akkordeon ist ein UI-Muster, das es Benutzern ermöglicht, Inhaltsabschnitte zu erweitern und einzuklappen. Es ist nützlich, um Informationen in einem kompakten, scanbaren Format zu organisieren.\n  \u003c/AccordionItem\u003e\n  \n  \u003cAccordionItem title=\"Wann sollte ich Akkordeons verwenden?\"\u003e\n    Verwenden Sie Akkordeons, wenn Sie mehrere Inhaltsabschnitte haben, die Benutzer durchsuchen möchten, ohne durch alles scrollen zu müssen. Häufige Anwendungsfälle sind FAQs, Funktionslisten und Konfigurationsoptionen.\n  \u003c/AccordionItem\u003e\n  \n  \u003cAccordionItem title=\"Kann ich mehrere Elemente geöffnet haben?\"\u003e\n    Ja! Standardmäßig erlaubt das Akkordeon, dass mehrere Elemente gleichzeitig geöffnet sind. Jedes AkkordeonItem arbeitet unabhängig.\n  \u003c/AccordionItem\u003e\n\u003c/Accordion\u003e\n\n## Props\n\n### Accordion\n\n| Prop | Typ | Standard | Beschreibung |\n|------|-----|----------|--------------|\n| `children` | `ReactNode` | erforderlich | Zu rendernde AccordionItem-Komponenten |\n| `type` | `\"single\" \\| \"multiple\"` | `\"multiple\"` | Ob ein oder mehrere Elemente geöffnet sein können |\n\n### AccordionItem\n\n| Prop | Typ | Standard | Beschreibung |\n|------|-----|----------|--------------|\n| `title` | `string` | erforderlich | Der anklickbare Header-Text |\n| `children` | `ReactNode` | erforderlich | Inhalt, der angezeigt wird, wenn erweitert |\n| `defaultOpen` | `boolean` | `false` | Ob das Element erweitert startet |\n\n## Tipps\n\n\u003cCallout type=\"tip\"\u003e\nVerwenden Sie die `defaultOpen` Prop beim ersten AccordionItem, um Benutzern eine Vorschau des Inhaltsformats zu geben.\n\u003c/Callout\u003e\n"])</script><script>self.__next_f.push([1,"1b:T1e9e,"])</script><script>self.__next_f.push([1,"\n# Konfigurationsübersicht\n\nSpecra verwendet eine einzelne Konfigurationsdatei, `specra.config.json`, die sich im Stammverzeichnis Ihres Projekts befindet. Diese Datei steuert alles, von den Website-Metadaten bis hin zu Navigations-, Design- und Bereitstellungseinstellungen.\n\n## Schnelleinstieg\n\nHier ist eine minimale Konfiguration für den Einstieg:\n\n```json\n{\n  \"site\": {\n    \"title\": \"Meine Dokumentation\",\n    \"description\": \"Dokumentation für mein Projekt\",\n    \"url\": \"https://docs.example.com\"\n  }\n}\n```\n\nDas war's! Specra füllt sinnvolle Standardwerte für alles andere aus.\n\n## Konfigurationsstruktur\n\nDie Konfigurationsdatei ist in logische Abschnitte unterteilt:\n\n\u003cCardGrid cols={2}\u003e\n  \u003cCard\n    icon=\"globe\"\n    title=\"Seiten-Konfiguration\"\n    description=\"Grundlegende Seiten-Metadaten, Branding und URLs\"\n    href=\"/docs/v1.0.0/configuration/site-config\"\n  /\u003e\n  \u003cCard\n    icon=\"layout\"\n    title=\"Navigation\"\n    description=\"Seitenleiste, Brotkrumen, Inhaltsverzeichnis und Tab-Gruppen\"\n    href=\"/docs/v1.0.0/configuration/navigation\"\n  /\u003e\n  \u003cCard\n    icon=\"rocket\"\n    title=\"Bereitstellung\"\n    description=\"Plattformspezifische Bereitstellungseinstellungen\"\n    href=\"/docs/v1.0.0/configuration/deployment-config\"\n  /\u003e\n  \u003cCard\n    icon=\"sliders\"\n    title=\"Erweiterte Optionen\"\n    description=\"Analytik, Suche, Features und Umgebungsvariablen\"\n    href=\"/docs/v1.0.0/configuration/advanced\"\n  /\u003e\n\u003c/CardGrid\u003e\n\n## Vollständiges Beispiel\n\nHier ist eine vollständige Konfiguration, die alle verfügbaren Optionen zeigt:\n\n```json\n{\n  \"$schema\": \"./node_modules/specra/config/specra.config.schema.json\",\n  \"site\": {\n    \"title\": \"Meine Docs\",\n    \"description\": \"Umfassende Dokumentation\",\n    \"url\": \"https://docs.example.com\",\n    \"baseUrl\": \"/\",\n    \"language\": \"de\",\n    \"organizationName\": \"Meine Firma\",\n    \"projectName\": \"mein-projekt\",\n    \"activeVersion\": \"v1.0.0\",\n    \"logo\": \"/logo.svg\",\n    \"favicon\": \"/favicon.ico\",\n    \"hideTitle\": false,\n    \"hideLogo\": false\n  },\n  \"theme\": {\n    \"defaultMode\": \"system\",\n    \"respectPrefersColorScheme\": true,\n    \"primaryColor\": \"#3b82f6\",\n    \"customCss\": \"/custom.css\"\n  },\n  \"navigation\": {\n    \"showSidebar\": true,\n    \"collapsibleSidebar\": true,\n    \"showBreadcrumbs\": true,\n    \"showTableOfContents\": true,\n    \"tocPosition\": \"right\",\n    \"tocMaxDepth\": 3,\n    \"tabGroups\": [\n      {\n        \"id\": \"guides\",\n        \"label\": \"Anleitungen\",\n        \"icon\": \"book-open\"\n      },\n      {\n        \"id\": \"api\",\n        \"label\": \"API-Referenz\",\n        \"icon\": \"zap\"\n      }\n    ]\n  },\n  \"social\": {\n    \"github\": \"https://github.com/username/repo\",\n    \"twitter\": \"https://twitter.com/username\",\n    \"discord\": \"https://discord.gg/invite\",\n    \"linkedin\": \"https://linkedin.com/company/name\",\n    \"youtube\": \"https://youtube.com/@channel\",\n    \"custom\": [\n      {\n        \"label\": \"Webseite\",\n        \"url\": \"https://example.com\",\n        \"icon\": \"globe\"\n      }\n    ]\n  },\n  \"search\": {\n    \"enabled\": true,\n    \"placeholder\": \"Dokumentation durchsuchen...\",\n    \"provider\": \"meilisearch\",\n    \"meilisearch\": {\n      \"host\": \"https://search.example.com\",\n      \"apiKey\": \"search-key\",\n      \"indexName\": \"docs\"\n    }\n  },\n  \"analytics\": {\n    \"googleAnalytics\": \"G-XXXXXXXXXX\",\n    \"googleTagManager\": \"GTM-XXXXXXX\",\n    \"plausible\": \"docs.example.com\"\n  },\n  \"footer\": {\n    \"copyright\": \"© 2024 Meine Firma. Alle Rechte vorbehalten.\",\n    \"customContent\": \"\u003cp\u003eBenutzerdefiniertes HTML hier\u003c/p\u003e\",\n    \"links\": [\n      {\n        \"title\": \"Produkt\",\n        \"items\": [\n          { \"label\": \"Funktionen\", \"href\": \"/features\" },\n          { \"label\": \"Preise\", \"href\": \"/pricing\" }\n        ]\n      }\n    ]\n  },\n  \"banner\": {\n    \"enabled\": true,\n    \"message\": \"📢 Version 2.0 kommt bald!\",\n    \"type\": \"info\",\n    \"dismissible\": true\n  },\n  \"features\": {\n    \"editUrl\": \"https://github.com/username/repo/edit/main/docs\",\n    \"showLastUpdated\": true,\n    \"showReadingTime\": true,\n    \"showAuthors\": false,\n    \"showTags\": true,\n    \"versioning\": true,\n    \"i18n\": false\n  },\n  \"env\": {\n    \"API_BASE_URL\": \"https://api.example.com\",\n    \"API_VERSION\": \"v1\",\n    \"CDN_URL\": \"https://cdn.example.com\"\n  },\n  \"deployment\": {\n    \"target\": \"vercel\",\n    \"basePath\": \"\",\n    \"customDomain\": false\n  }\n}\n```\n\n## TypeScript-Unterstützung\n\nFür TypeScript-Projekte können Sie `.ts`- oder `.mts`-Konfigurationsdateien verwenden:\n\n```typescript\n// specra.config.ts\nimport type { SpecraConfig } from 'specra'\n\nconst config: SpecraConfig = {\n  site: {\n    title: 'Meine Dokumentation',\n    description: 'Erstellt mit Specra',\n  },\n  // ... rest der konfig\n}\n\nexport default config\n```\n\n## IDE-Autovervollständigung\n\nDie Konfigurationsdatei enthält eine `$schema`-Eigenschaft, die Autovervollständigung in VS Code und anderen Editoren ermöglicht:\n\n```json\n{\n  \"$schema\": \"./node_modules/specra/config/specra.config.schema.json\",\n  \"site\": {\n    // Autovervollständigung funktioniert hier!\n  }\n}\n```\n\nWenn Sie tippen, schlägt Ihr Editor verfügbare Optionen vor und zeigt Beschreibungen an.\n\n## Umgebungsvariablen\n\nSie können Umgebungsvariablen in Ihrer Konfiguration verwenden:\n\n```json\n{\n  \"search\": {\n    \"meilisearch\": {\n      \"host\": \"${MEILISEARCH_HOST}\",\n      \"apiKey\": \"${MEILISEARCH_API_KEY}\"\n    }\n  }\n}\n```\n\nSetzen Sie sie dann:\n\n```bash\n# .env.local\nMEILISEARCH_HOST=https://search.example.com\nMEILISEARCH_API_KEY=your-key\n```\n\n\u003cCallout type=\"warning\"\u003e\nCommitten Sie niemals sensible API-Schlüssel in die Versionskontrolle. Verwenden Sie stattdessen Umgebungsvariablen.\n\u003c/Callout\u003e\n\n## Konfigurationsvalidierung\n\nSpecra validiert Ihre Konfiguration beim Start und zeigt hilfreiche Fehler an, wenn etwas nicht stimmt:\n\n```\n❌ Konfigurationsfehler in specra.config.json:\n   - site.url muss eine gültige URL sein\n   - navigation.tocMaxDepth muss zwischen 1 und 6 liegen\n```\n\nBeheben Sie die Fehler und starten Sie Ihren Dev-Server neu.\n\n## Standardwerte\n\nWenn Sie optionale Felder weglassen, verwendet Specra diese Standardwerte:\n\n| Feld | Standardwert |\n|------|--------------|\n| `site.baseUrl` | `\"/\"` |\n| `site.language` | `\"en\"` |\n| `theme.defaultMode` | `\"system\"` |\n| `theme.respectPrefersColorScheme` | `true` |\n| `navigation.showSidebar` | `true` |\n| `navigation.collapsibleSidebar` | `true` |\n| `navigation.showBreadcrumbs` | `true` |\n| `navigation.showTableOfContents` | `true` |\n| `navigation.tocPosition` | `\"right\"` |\n| `navigation.tocMaxDepth` | `3` |\n| `search.enabled` | `false` |\n| `features.showLastUpdated` | `true` |\n| `features.showReadingTime` | `true` |\n| `features.versioning` | `true` |\n| `deployment.target` | `\"vercel\"` |\n\n## Mehrere Umgebungen\n\nErstellen Sie umgebungsspezifische Konfigurationen:\n\n```txt\n├── specra.config.json          # Basis-Konfig\n├── specra.config.development.json\n├── specra.config.staging.json\n└── specra.config.production.json\n```\n\nLaden Sie die richtige basierend auf `NODE_ENV`:\n\n```javascript\n// Konfig basierend auf Umgebung laden\nconst config = require(`./specra.config.${process.env.NODE_ENV}.json`)\n```\n\n## Nächste Schritte\n\n te zu erstellen:\n\n\u003cTabs defaultValue=\"npm\"\u003e\n  \u003cTab label=\"npm\"\u003e\n```bash\nnpx create-specra@latest my-docs\n```\n  \u003c/Tab\u003e\n  \u003cTab label=\"yarn\"\u003e\n```bash\nyarn create specra my-docs\n```\n  \u003c/Tab\u003e\n  \u003cTab label=\"pnpm\"\u003e\n```bash\npnpm create specra my-docs\n```\n  \u003c/Tab\u003e\n\u003c/Tabs\u003e\n\nDies erstellt ein neues Verzeichnis namens `my-docs` mit allem konfiguriert und einsatzbereit.\n\n## Was erstellt wird\n\nWenn Sie `create-specra` ausführen, erhalten Sie folgendes:\n\n```txt\nmy-docs/\n├── app/\n│   ├── layout.tsx              # Root-Layout mit Specra-Setup\n│   ├── page.tsx                # Landing-Page\n│   ├── globals.css             # Globale Stile\n│   └── docs/\n│       └── [...slug]/\n│           └── page.tsx        # Dokumentationsseiten-Renderer\n├── docs/\n│   └── v1.0.0/\n│       ├── about.mdx           # Beispiel-Über-Seite\n│       ├── getting-started.mdx # Beispiel-Erste-Schritte-Anleitung\n│       └── components/         # Komponenten-Beispiele\n├── public/\n│   ├── icon-light-32x32.png   # Favicon (heller Modus)\n│   └── icon-dark-32x32.png    # Favicon (dunkler Modus)\n├── specra.config.json          # Specra-Konfiguration\n├── package.json                # Abhängigkeiten und Skripte\n├── next.config.mjs             # Next.js-Konfiguration\n├── tailwind.config.ts          # Tailwind-CSS-Konfig\n├── tsconfig.json               # TypeScript-Konfig\n├── .gitignore\n└── README.md\n```\n\n## Interaktives Setup\n\nWenn Sie `create-specra` ausführen, werden Sie möglicherweise aufgefordert zu:\n\n**Projektname** (falls nicht als Argument angegeben)\n```bash\nnpx create-specra@latest\n# Aufforderung: What is your project named?\n```\n\n**Bevorzugter Paketmanager** (falls mehrere erkannt werden)\n```bash\n# Wird fragen: Which package manager do you want to use?\n# Optionen: npm, yarn, pnpm\n```\n\nDas CLI erkennt, was auf Ihrem System verfügbar ist, und schlägt die beste Option vor.\n\n## Befehlsoptionen\n\n### Grundlegende Verwendung\n\n```bash\nnpx create-specra@latest [project-name] [options]\n```\n\n### Beispiele\n\n**Mit einem bestimmten Namen erstellen:**\n```bash\nnpx create-specra@latest my-awesome-docs\n```\n\n**Im aktuellen Verzeichnis erstellen:**\n```bash\nnpx create-specra@latest .\n```\n\n**Einen bestimmten Paketmanager verwenden:**\n```bash\nnpx create-specra@latest my-docs --use-npm\nnpx create-specra@latest my-docs --use-yarn\nnpx create-specra@latest my-docs --use-pnpm\n```\n\n## Was als Nächstes passiert\n\nNachdem das Scaffolding abgeschlossen ist, befolgen Sie diese Schritte:\n\n\u003cSteps\u003e\n  \u003cStep title=\"Navigieren Sie zu Ihrem Projekt\"\u003e\n```bash\ncd my-docs\n```\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Abhängigkeiten installieren\"\u003e\n    Das CLI installiert Abhängigkeiten nicht automatisch. Führen Sie aus:\n\n\u003cTabs defaultValue=\"npm\"\u003e\n  \u003cTab label=\"npm\"\u003e\n```bash\nnpm install\n```\n  \u003c/Tab\u003e\n  \u003cTab label=\"yarn\"\u003e\n```bash\nyarn install\n```\n  \u003c/Tab\u003e\n  \u003cTab label=\"pnpm\"\u003e\n```bash\npnpm install\n```\n  \u003c/Tab\u003e\n\u003c/Tabs\u003e\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Starten Sie den Entwicklungsserver\"\u003e\n\u003cTabs defaultValue=\"npm\"\u003e\n  \u003cTab label=\"npm\"\u003e\n```bash\nnpm run dev\n```\n  \u003c/Tab\u003e\n  \u003cTab label=\"yarn\"\u003e\n```bash\nyarn dev\n```\n  \u003c/Tab\u003e\n  \u003cTab label=\"pnpm\"\u003e\n```bash\npnpm dev\n```\n  \u003c/Tab\u003e\n\u003c/Tabs\u003e\n\n    Öffnen Sie [http://localhost:3000](http://localhost:3000), um Ihre Seite zu sehen.\n  \u003c/Step\u003e\n\u003c/Steps\u003e\n\n## Standardkonfiguration\n\nDie generierte `specra.config.json` enthält sinnvolle Standardwerte:\n\n```json\n{\n  \"site\": {\n    \"title\": \"My Documentation\",\n    \"description\": \"Documentation site built with Specra\",\n    \"url\": \"https://example.com\",\n    \"baseUrl\": \"/\",\n    \"activeVersion\": \"v1.0.0\"\n  },\n  \"theme\": {\n    \"defaultMode\": \"system\",\n    \"respectPrefersColorScheme\": true\n  },\n  \"navigation\": {\n    \"showSidebar\": true,\n    \"collapsibleSidebar\": true,\n    \"showBreadcrumbs\": true,\n    \"showTableOfContents\": true,\n    \"tocPosition\": \"right\"\n  },\n  \"features\": {\n    \"showLastUpdated\": true,\n    \"showReadingTime\": true,\n    \"versioning\": true\n  },\n  \"deployment\": {\n    \"target\": \"vercel\"\n  }\n}\n```\n\nSie können jede dieser Einstellungen anpassen. Siehe [Konfiguration](/docs/v1.0.0/configuration/overview) für alle verfügbaren Optionen.\n\n## Beispielinhalte\n\nDas erstellte Projekt enthält Beispieldokumentation, die Ihnen den Einstieg erleichtert:\n\n**Über-Seite** - Beispiel einer einfachen Informationsseite\n**Erste Schritte** - Zeigt, wie man Tutorials mit Schritten strukturiert\n**Komponenten-Beispiele** - Demonstriert alle verfügbaren MDX-Komponenten\n\nFühlen Sie sich frei, diese Seiten zu löschen oder zu ändern. Sie sind nur dazu da, Ihnen zu zeigen, was möglich ist.\n\n## Verfügbare Skripte\n\nDie generierte `package.json` enthält diese Skripte:\n\n| Skript | Befehl | Beschreibung |\n|--------|---------|-------------|\n| `dev` | `next dev` | Startet Entwicklungsserver mit Hot Reload |\n| `build` | `next build` | Build für Produktion (Vercel, Node.js-Hosting) |\n| `start` | `next start` | Startet Produktionsserver (nach `build`) |\n| `build:export` | `next build \u0026\u0026 next export` | Build statische Seite (GitHub Pages, Netlify) |\n| `lint` | `next lint` | Führt ESLint aus, um Codequalität zu prüfen |\n\n## Specra aktualisieren\n\nSo aktualisieren Sie auf die neueste Version von Specra in Ihrem Projekt:\n\n\u003cTabs defaultValue=\"npm\"\u003e\n  \u003cTab label=\"npm\"\u003e\n```bash\nnpm install specra@latest\n```\n  \u003c/Tab\u003e\n  \u003cTab label=\"yarn\"\u003e\n```bash\nyarn upgrade specra@latest\n```\n  \u003c/Tab\u003e\n  \u003cTab label=\"pnpm\"\u003e\n```bash\npnpm update specra@latest\n```\n  \u003c/Tab\u003e\n\u003c/Tabs\u003e\n\n\u003cCallout type=\"info\"\u003e\nÜberprüfen Sie das [Changelog](https://github.com/yourusername/specra/releases) auf Breaking Changes, bevor Sie Hauptversionen aktualisieren.\n\u003c/Callout\u003e\n\n## Fehlerbehebung\n\n### Befehl nicht gefunden\n\nWenn Sie \"command not found\" Fehler erhalten:\n\n**Node.js-Version prüfen:**\n```bash\nnode --version\n# Sollte 18.0.0 oder höher sein\n```\n\n**Mit vollem npx-Pfad versuchen:**\n```bash\nnpx create-specra@latest my-docs\n```\n\n### Berechtigungsfehler\n\nUnter Linux/macOS müssen Sie möglicherweise npm-Berechtigungen anpassen:\n\n```bash\nsudo chown -R $USER ~/.npm\n```\n\nOder verwenden Sie einen Node-Versionsmanager wie [nvm](https://github.com/nvm-sh/nvm).\n\n### Installation schlägt fehl\n\nWenn die Installation von Abhängigkeiten fehlschlägt:\n\n1. Löschen Sie `node_modules` und die Lock-Datei\n2. Paketmanager-Cache leeren\n3. Versuchen Sie es erneut\n\n```bash\nrm -rf node_modules package-lock.json\nnpm cache clean --force\nnpm install\n```\n\n## Nächste Schritte\n\nJetzt, da Sie eine Specra-Seite eingerichtet haben:\n\n\u003cCardGrid cols={2}\u003e\n  \u003cCard\n    icon=\"book\"\n    title=\"Schreiben Sie Ihre erste Seite\"\n    description=\"Lernen Sie, wie man Dokumentation erstellt und organisiert\"\n    href=\"/docs/v1.0.0/getting-started\"\n  /\u003e\n  \u003cCard\n    icon=\"settings\"\n    title=\"Konfigurieren Sie Ihre Seite\"\n    description=\"Passen Sie Branding, Navigation und Funktionen an\"\n    href=\"/docs/v1.0.0/configuration/overview\"\n  /\u003e\n  \u003cCard\n    icon=\"palette\"\n    title=\"Komponenten erkunden\"\n    description=\"Entdecken Sie alle verfügbaren MDX-Komponenten\"\n    href=\"/docs/v1.0.0/components\"\n  /\u003e\n  \u003cCard\n    icon=\"rocket\"\n    title=\"In Produktion bereitstellen\"\n    description=\"Versenden Sie Ihre Dokumente nach Vercel, GitHub Pages oder
