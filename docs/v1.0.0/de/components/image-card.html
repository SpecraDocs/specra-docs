0026\u0026 next export` | Build statische Seite (GitHub Pages, Netlify) |\n| `lint` | `next lint` | Führt ESLint aus, um Codequalität zu prüfen |\n\n## Specra aktualisieren\n\nSo aktualisieren Sie auf die neueste Version von Specra in Ihrem Projekt:\n\n\u003cTabs defaultValue=\"npm\"\u003e\n  \u003cTab label=\"npm\"\u003e\n```bash\nnpm install specra@latest\n```\n  \u003c/Tab\u003e\n  \u003cTab label=\"yarn\"\u003e\n```bash\nyarn upgrade specra@latest\n```\n  \u003c/Tab\u003e\n  \u003cTab label=\"pnpm\"\u003e\n```bash\npnpm update specra@latest\n```\n  \u003c/Tab\u003e\n\u003c/Tabs\u003e\n\n\u003cCallout type=\"info\"\u003e\nÜberprüfen Sie das [Changelog](https://github.com/yourusername/specra/releases) auf Breaking Changes, bevor Sie Hauptversionen aktualisieren.\n\u003c/Callout\u003e\n\n## Fehlerbehebung\n\n### Befehl nicht gefunden\n\nWenn Sie \"command not found\" Fehler erhalten:\n\n**Node.js-Version prüfen:**\n```bash\nnode --version\n# Sollte 18.0.0 oder höher sein\n```\n\n**Mit vollem npx-Pfad versuchen:**\n```bash\nnpx create-specra@latest my-docs\n```\n\n### Berechtigungsfehler\n\nUnter Linux/macOS müssen Sie möglicherweise npm-Berechtigungen anpassen:\n\n```bash\nsudo chown -R $USER ~/.npm\n```\n\nOder verwenden Sie einen Node-Versionsmanager wie [nvm](https://github.com/nvm-sh/nvm).\n\n### Installation schlägt fehl\n\nWenn die Installation von Abhängigkeiten fehlschlägt:\n\n1. Löschen Sie `node_modules` und die Lock-Datei\n2. Paketmanager-Cache leeren\n3. Versuchen Sie es erneut\n\n```bash\nrm -rf node_modules package-lock.json\nnpm cache clean --force\nnpm install\n```\n\n## Nächste Schritte\n\nJetzt, da Sie eine Specra-Seite eingerichtet haben:\n\n\u003cCardGrid cols={2}\u003e\n  \u003cCard\n    icon=\"book\"\n    title=\"Schreiben Sie Ihre erste Seite\"\n    description=\"Lernen Sie, wie man Dokumentation erstellt und organisiert\"\n    href=\"/docs/v1.0.0/getting-started\"\n  /\u003e\n  \u003cCard\n    icon=\"settings\"\n    title=\"Konfigurieren Sie Ihre Seite\"\n    description=\"Passen Sie Branding, Navigation und Funktionen an\"\n    href=\"/docs/v1.0.0/configuration/overview\"\n  /\u003e\n  \u003cCard\n    icon=\"palette\"\n    title=\"Komponenten erkunden\"\n    description=\"Entdecken Sie alle verfügbaren MDX-Komponenten\"\n    href=\"/docs/v1.0.0/components\"\n  /\u003e\n  \u003cCard\n    icon=\"rocket\"\n    title=\"In Produktion bereitstellen\"\n    description=\"Versenden Sie Ihre Dokumente nach Vercel, GitHub Pages oder Netlify\"\n    href=\"/docs/v1.0.0/deployment/overview\"\n  /\u003e\n\u003c/CardGrid\u003e\n"])</script><script>self.__next_f.push([1,"1f:T2ee5,"])</script><script>self.__next_f.push([1,"\n# Bereitstellungsübersicht\n\nSpecra basiert auf Next.js, was bedeutet, dass Sie es fast überall bereitstellen können. Dieser Leitfaden behandelt die beliebtesten Bereitstellungsoptionen und wie Sie Specra für jede konfigurieren.\n\n## Bereitstellungsziele\n\nSpecra unterstützt zwei Bereitstellungsmodi:\n\n**Standalone-Modus** (Node.js Hosting)\n- Vercel, Railway, Render, Fly.io, AWS, Google Cloud\n- Dynamische serverseitige Funktionen\n- Beste Leistung mit Edge-Caching\n- Standardkonfiguration\n\n**Statischer Export** (Statisches Hosting)\n- GitHub Pages, Netlify, Cloudflare Pages\n- Vorgerendertes HTML/CSS/JS\n- Kein Server erforderlich\n- Großartig für Open-Source-Docs\n\n## Schnelle Bereitstellung\n\n### Vercel (Empfohlen)\n\nDie einfachste Bereitstellungsoption. Ein Klick und Sie sind live:\n\n\u003cSteps\u003e\n  \u003cStep title=\"Zu GitHub pushen\"\u003e\n    Pushen Sie Ihr Projekt in ein GitHub-Repository:\n\n```bash\ngit init\ngit add .\ngit commit -m \"Initial commit\"\ngit remote add origin https://github.com/username/repo.git\ngit push -u origin main\n```\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Auf Vercel bereitstellen\"\u003e\n    Besuchen Sie [vercel.com/new](https://vercel.com/new) und importieren Sie Ihr Repository.\n\n    Vercel erkennt Next.js automatisch und verwendet die richtigen Einstellungen:\n    - Build Command: `npm run build`\n    - Output Directory: `.next`\n    - Install Command: `npm install`\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Fertig!\"\u003e\n    Ihre Seite wird in weniger als einer Minute bereitgestellt. Vercel gibt Ihnen eine URL wie `ihr-projekt.vercel.app`.\n\n    Jeder Git-Push zu main löst automatisch eine neue Bereitstellung aus.\n  \u003c/Step\u003e\n\u003c/Steps\u003e\n\n\u003cCallout type=\"success\"\u003e\n  Keine Konfiguration erforderlich! Die Standardeinstellungen von Specra funktionieren perfekt mit Vercel.\n\u003c/Callout\u003e\n\n### GitHub Pages\n\nPerfekt für Open-Source-Dokumentation:\n\n\u003cSteps\u003e\n  \u003cStep title=\"Für statischen Export konfigurieren\"\u003e\n    Aktualisieren Sie `specra.config.json`:\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"github-pages\",\n    \"basePath\": \"ihr-repo-name\",\n    \"customDomain\": false\n  }\n}\n```\n\nErsetzen Sie `ihr-repo-name` durch Ihren tatsächlichen Repository-Namen.\n\n\u003cCallout type=\"info\"\u003e\n  Wenn Sie eine benutzerdefinierte Domain verwenden (wie `docs.ihresite.com`), setzen Sie `customDomain: true` und lassen Sie `basePath` leer.\n\u003c/Callout\u003e\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Statische Seite bauen\"\u003e\n```bash\nnpm run build:export\n```\n\nDies erstellt ein `out/` Verzeichnis mit Ihrer statischen Seite.\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Mit GitHub Actions bereitstellen\"\u003e\n    Erstellen Sie `.github/workflows/deploy.yml`:\n\n```yaml\nname: Deploy to GitHub Pages\n\non:\n  push:\n    branches: [main]\n\npermissions:\n  contents: read\n  pages: write\n  id-token: write\n\njobs:\n  build:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n\n      - name: Setup Node.js\n        uses: actions/setup-node@v4\n        with:\n          node-version: '20'\n          cache: 'npm'\n\n      - name: Install dependencies\n        run: npm ci\n\n      - name: Build site\n        run: npm run build:export\n\n      - name: Upload artifact\n        uses: actions/upload-pages-artifact@v3\n        with:\n          path: ./out\n\n  deploy:\n    needs: build\n    runs-on: ubuntu-latest\n    environment:\n      name: github-pages\n      url: ${{ steps.deployment.outputs.page_url }}\n    steps:\n      - name: Deploy to GitHub Pages\n        id: deployment\n        uses: actions/deploy-pages@v4\n```\n  \u003c/Step\u003e\n\n  \u003cStep title=\"GitHub Pages aktivieren\"\u003e\n    1. Gehen Sie zu Ihren Repo-Einstellungen\n    2. Navigieren Sie zu **Pages**\n    3. Quelle: **GitHub Actions**\n    4. Speichern\n\n    Ihre Docs werden unter `https://username.github.io/repo-name` live sein\n  \u003c/Step\u003e\n\u003c/Steps\u003e\n\n### Netlify\n\nEine weitere großartige statische Hosting-Option:\n\n\u003cSteps\u003e\n  \u003cStep title=\"Konfigurieren\"\u003e\n```json\n{\n  \"deployment\": {\n    \"target\": \"static\"\n  }\n}\n```\n  \u003c/Step\u003e\n\n  \u003cStep title=\"netlify.toml erstellen\"\u003e\n```toml\n[build]\n  command = \"npm run build:export\"\n  publish = \"out\"\n\n[[redirects]]\n  from = \"/*\"\n  to = \"/index.html\"\n  status = 200\n```\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Bereitstellen\"\u003e\n    Verbinden Sie Ihr Repo auf [netlify.com](https://netlify.com) oder verwenden Sie die CLI:\n\n```bash\nnpm install -g netlify-cli\nnetlify deploy --prod\n```\n  \u003c/Step\u003e\n\u003c/Steps\u003e\n\n## Build-Befehle\n\nVerschiedene Plattformen benötigen unterschiedliche Build-Befehle:\n\n| Plattform | Build-Befehl | Ausgabeverzeichnis |\n|-----------|--------------|--------------------|\n| Vercel, Railway | `npm run build` | `.next` |\n| GitHub Pages | `npm run build:export` | `out` |\n| Netlify, Cloudflare Pages | `npm run build:export` | `out` |\n| Docker, VPS | `npm run build` + `npm start` | `.next` |\n\n## Konfiguration nach Plattform\n\n### Vercel\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"vercel\"\n  }\n}\n```\n\n**Umgebungsvariablen** (optional):\n- Keine für das Basis-Setup erforderlich\n- Fügen Sie Such-/Analytik-Schlüssel im Vercel-Dashboard hinzu\n\n### GitHub Pages (Keine benutzerdefinierte Domain)\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"github-pages\",\n    \"basePath\": \"repo-name\"\n  }\n}\n```\n\n**Warum basePath?** GitHub Pages stellt von `username.github.io/repo-name` bereit, daher benötigen alle Assets das `/repo-name` Präfix.\n\n### GitHub Pages (Mit benutzerdefinierter Domain)\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"custom-domain-static\",\n    \"customDomain\": true\n  }\n}\n```\n\nFügen Sie eine `CNAME`-Datei zu `public/` hinzu:\n\n```\ndocs.yoursite.com\n```\n\n### Netlify / Cloudflare Pages\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"static\"\n  }\n}\n```\n\nKein basePath erforderlich – sie stellen vom Root bereit.\n\n## CI/CD-Pipelines\n\n### GitHub Actions (Erweitert)\n\nVollständiges Beispiel mit Caching und MeiliSearch-Indexierung:\n\n```yaml\nname: Build and Deploy\n\non:\n  push:\n    branches: [main]\n  pull_request:\n    branches: [main]\n\njobs:\n  build:\n    runs-on: ubuntu-latest\n\n    steps:\n      - uses: actions/checkout@v4\n\n      - name: Setup Node.js\n        uses: actions/setup-node@v4\n        with:\n          node-version: '20'\n          cache: 'npm'\n\n      - name: Cache dependencies\n        uses: actions/cache@v4\n        with:\n          path: ~/.npm\n          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}\n          restore-keys: |\n            ${{ runner.os }}-node-\n\n      - name: Install dependencies\n        run: npm ci\n\n      - name: Run linter\n        run: npm run lint\n\n      - name: Build site\n        run: npm run build:export\n        env:\n          NODE_ENV: production\n\n      - name: Index search content\n        if: github.ref == 'refs/heads/main'\n        run: npm run index:search\n        env:\n          MEILISEARCH_HOST: ${{ secrets.MEILISEARCH_HOST }}\n          MEILISEARCH_API_KEY: ${{ secrets.MEILISEARCH_MASTER_KEY }}\n\n      - name: Upload artifact\n        uses: actions/upload-pages-artifact@v3\n        with:\n          path: ./out\n\n  deploy:\n    if: github.ref == 'refs/heads/main'\n    needs: build\n    runs-on: ubuntu-latest\n    environment:\n      name: github-pages\n      url: ${{ steps.deployment.outputs.page_url }}\n    permissions:\n      pages: write\n      id-token: write\n    steps:\n      - name: Deploy to GitHub Pages\n        id: deployment\n        uses: actions/deploy-pages@v4\n```\n\n### GitLab CI/CD\n\n```yaml\n# .gitlab-ci.yml\nimage: node:20\n\ncache:\n  paths:\n    - node_modules/\n\nstages:\n  - build\n  - deploy\n\nbuild:\n  stage: build\n  script:\n    - npm ci\n    - npm run build:export\n  artifacts:\n    paths:\n      - out/\n  only:\n    - main\n\npages:\n  stage: deploy\n  dependencies:\n    - build\n  script:\n    - mkdir -p public\n    - cp -r out/* public/\n  artifacts:\n    paths:\n      - public\n  only:\n    - main\n```\n\n### Docker\n\nErstellen Sie ein `Dockerfile`:\n\n```dockerfile\nFROM node:20-alpine AS builder\n\nWORKDIR /app\n\nCOPY package*.json ./\nRUN npm ci\n\nCOPY . .\nRUN npm run build\n\nFROM node:20-alpine AS runner\n\nWORKDIR /app\n\nENV NODE_ENV=production\n\nCOPY --from=builder /app/public ./public\nCOPY --from=builder /app/.next/standalone ./\nCOPY --from=builder /app/.next/static ./.next/static\n\nEXPOSE 3000\n\nCMD [\"node\", \"server.js\"]\n```\n\nErstellen und ausführen:\n\n```bash\ndocker build -t my-docs .\ndocker run -p 3000:3000 my-docs\n```\n\n## Umgebungsvariablen\n\nSetzen Sie diese in Ihrer Bereitstellungsplattform:\n\n**Suche (wenn MeiliSearch verwendet wird):**\n```bash\nMEILISEARCH_HOST=https://search.example.com\nMEILISEARCH_API_KEY=ihr-such-schluessel\n```\n\n**Analytik (optional):**\n```bash\nNEXT_PUBLIC_GA_ID=G-XXXXXXXXXX\nNEXT_PUBLIC_PLAUSIBLE_DOMAIN=docs.example.com\n```\n\n**Benutzerdefinierte Umgebungsvariablen:**\nGreifen Sie in Ihren Docs über Frontmatter oder MDX darauf zu:\n\n```json\n{\n  \"env\": {\n    \"API_BASE_URL\": \"${API_URL}\"\n  }\n}\n```\n\n## Benutzerdefinierte Domains\n\n### Vercel\n\n1. Gehen Sie zu Ihren Projekteinstellungen\n2. Navigieren Sie zu Domains\n3. Fügen Sie Ihre benutzerdefinierte Domain hinzu\n4. Aktualisieren Sie DNS-Einträge wie angezeigt\n\n### GitHub Pages\n\n1. Fügen Sie `CNAME`-Datei zu `public/` hinzu:\n```\ndocs.yoursite.com\n```\n\n2. Aktualisieren Sie `specra.config.json`:\n```json\n{\n  \"deployment\": {\n    \"customDomain\": true\n  }\n}\n```\n\n3. Konfigurieren Sie DNS:\n```\nTyp: CNAME\nName: docs\nWert: username.github.io\n```\n\n### Netlify\n\n1. Gehen Sie zu Domain-Einstellungen\n2. Benutzerdefinierte Domain hinzufügen\n3. Folgen Sie den DNS-Anweisungen\n\n## Leistungsoptimierung\n\n### Caching aktivieren\n\nFügen Sie Cache-Header in `next.config.mjs` hinzu:\n\n```javascript\nasync headers() {\n  return [\n    {\n      source: '/docs/:path*',\n      headers: [\n        {\n          key: 'Cache-Control',\n          value: 'public, max-age=3600, must-revalidate',\n        },\n      ],\n    },\n  ]\n}\n```\n\n### Bildoptimierung\n\nVerwenden Sie die Next.js Image-Komponente:\n\n```mdx\n\u003cImage\n  src=\"/images/diagram.png\"\n  alt=\"Architekturdiagramm\"\n  width={800}\n  height={600}\n/\u003e\n```\n\n### Bundle-Analyse\n\nBundle-Größe überprüfen:\n\n```bash\nnpm install --save-dev @next/bundle-analyzer\n```\n\n```javascript\n// next.config.mjs\nimport bundleAnalyzer from '@next/bundle-analyzer'\n\nconst withBundleAnalyzer = bundleAnalyzer({\n  enabled: process.env.ANALYZE === 'true',\n})\n\nexport default withBundleAnalyzer(nextConfig)\n```\n\nAusführen mit:\n```bash\nANALYZE=true npm run build\n```\n\n## Fehlerbehebung\n\n### 404 beim Aktualisieren der Seite (Statischer Export)\n\nFügen Sie Redirects/Rewrites in der Plattformkonfiguration hinzu:\n\n**Netlify:**\n```toml\n[[redirects]]\n  from = \"/*\"\n  to = \"/index.html\"\n  status = 200\n```\n\n**Vercel (vercel.json):**\n```json\n{\n  \"rewrites\": [\n    { \"source\": \"/(.*)\", \"destination\": \"/index.html\" }\n  ]\n}\n```\n\n### Assets laden nicht (GitHub Pages)\n\nÜberprüfen Sie, ob Ihr `basePath` exakt mit Ihrem Repo-Namen übereinstimmt:\n\n```json\n{\n  \"deployment\": {\n    \"basePath\": \"exakter-repo-name\"\n  }\n}\n```\n\n### Build fehlgeschlagen\n\nHäufige Lösungen:\n\n1. `.next` und `out` Ordner löschen:\n```bash\nrm -rf .next out node_modules\nnpm install\nnpm run build\n```\n\n2. Node.js Version überprüfen:\n```bash\nnode --version  # Sollte 18+ sein\n```\n\n3. Build-Logs auf spezifische Fehler überprüfen\n\n## Plattformspezifische Leitfäden\n\nTauchen Sie tiefer in die plattformspezifische Bereitstellung ein:\n\n\u003cCardGrid cols={3}\u003e\n  \u003cCard\n    icon=\"triangle\"\n    title=\"Vercel\"\n    description=\"Bereitstellen ohne Konfiguration\"\n    href=\"/docs/v1.0.0/deployment/vercel\"\n  /\u003e\n  \u003cCard\n    icon=\"github\"\n    title=\"GitHub Pages\"\n    description=\"Kostenloses Hosting für Open Source\"\n    href=\"/docs/v1.0.0/deployment/github-pages\"\n  /\u003e\n  \u003cCard\n    icon=\"globe\"\n    title=\"Netlify\"\n    description=\"Statisches Hosting mit Edge-Funktionen\"\n    href=\"/docs/v1.0.0/deployment/netlify\"\n  /\u003e\n\u003c/CardGrid\u003e\n\n## Nächste Schritte\n\n\u003cCardGrid cols={2}\u003e\n  \u003cCard\n    icon=\"settings\"\n    title=\"Konfiguration\"\n    description=\"Ihre Bereitstellungseinstellungen feinabstimmen\"\n    href=\"/docs/v1.0.0/configuration/deployment-config\"\n  /\u003e\n  \u003cCard\n    icon=\"zap\"\n    title=\"Leistung\"\n    description=\"Ihre Docs für Geschwindigkeit optimieren\"\n    href=\"/docs/v1.0.0/performance\"\n  /\u003e\n\u003c/CardGrid\u003e\n"])</script><script>self.__next_f.push([1,"20:T2ee5,"])</script><script>self.__next_f.push([1,"\n# Bereitstellungsübersicht\n\nSpecra basiert auf Next.js, was bedeutet, dass Sie es fast überall bereitstellen können. Dieser Leitfaden behandelt die beliebtesten Bereitstellungsoptionen und wie Sie Specra für jede konfigurieren.\n\n## Bereitstellungsziele\n\nSpecra unterstützt zwei Bereitstellungsmodi:\n\n**Standalone-Modus** (Node.js Hosting)\n- Vercel, Railway, Render, Fly.io, AWS, Google Cloud\n- Dynamische serverseitige Funktionen\n- Beste Leistung mit Edge-Caching\n- Standardkonfiguration\n\n**Statischer Export** (Statisches Hosting)\n- GitHub Pages, Netlify, Cloudflare Pages\n- Vorgerendertes HTML/CSS/JS\n- Kein Server erforderlich\n- Großartig für Open-Source-Docs\n\n## Schnelle Bereitstellung\n\n### Vercel (Empfohlen)\n\nDie einfachste Bereitstellungsoption. Ein Klick und Sie sind live:\n\n\u003cSteps\u003e\n  \u003cStep title=\"Zu GitHub pushen\"\u003e\n    Pushen Sie Ihr Projekt in ein GitHub-Repository:\n\n```bash\ngit init\ngit add .\ngit commit -m \"Initial commit\"\ngit remote add origin https://github.com/username/repo.git\ngit push -u origin main\n```\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Auf Vercel bereitstellen\"\u003e\n    Besuchen Sie [vercel.com/new](https://vercel.com/new) und importieren Sie Ihr Repository.\n\n    Vercel erkennt Next.js automatisch und verwendet die richtigen Einstellungen:\n    - Build Command: `npm run build`\n    - Output Directory: `.next`\n    - Install Command: `npm install`\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Fertig!\"\u003e\n    Ihre Seite wird in weniger als einer Minute bereitgestellt. Vercel gibt Ihnen eine URL wie `ihr-projekt.vercel.app`.\n\n    Jeder Git-Push zu main löst automatisch eine neue Bereitstellung aus.\n  \u003c/Step\u003e\n\u003c/Steps\u003e\n\n\u003cCallout type=\"success\"\u003e\n  Keine Konfiguration erforderlich! Die Standardeinstellungen von Specra funktionieren perfekt mit Vercel.\n\u003c/Callout\u003e\n\n### GitHub Pages\n\nPerfekt für Open-Source-Dokumentation:\n\n\u003cSteps\u003e\n  \u003cStep title=\"Für statischen Export konfigurieren\"\u003e\n    Aktualisieren Sie `specra.config.json`:\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"github-pages\",\n    \"basePath\": \"ihr-repo-name\",\n    \"customDomain\": false\n  }\n}\n```\n\nErsetzen Sie `ihr-repo-name` durch Ihren tatsächlichen Repository-Namen.\n\n\u003cCallout type=\"info\"\u003e\n  Wenn Sie eine benutzerdefinierte Domain verwenden (wie `docs.ihresite.com`), setzen Sie `customDomain: true` und lassen Sie `basePath` leer.\n\u003c/Callout\u003e\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Statische Seite bauen\"\u003e\n```bash\nnpm run build:export\n```\n\nDies erstellt ein `out/` Verzeichnis mit Ihrer statischen Seite.\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Mit GitHub Actions bereitstellen\"\u003e\n    Erstellen Sie `.github/workflows/deploy.yml`:\n\n```yaml\nname: Deploy to GitHub Pages\n\non:\n  push:\n    branches: [main]\n\npermissions:\n  contents: read\n  pages: write\n  id-token: write\n\njobs:\n  build:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n\n      - name: Setup Node.js\n        uses: actions/setup-node@v4\n        with:\n          node-version: '20'\n          cache: 'npm'\n\n      - name: Install dependencies\n        run: npm ci\n\n      - name: Build site\n        run: npm run build:export\n\n      - name: Upload artifact\n        uses: actions/upload-pages-artifact@v3\n        with:\n          path: ./out\n\n  deploy:\n    needs: build\n    runs-on: ubuntu-latest\n    environment:\n      name: github-pages\n      url: ${{ steps.deployment.outputs.page_url }}\n    steps:\n      - name: Deploy to GitHub Pages\n        id: deployment\n        uses: actions/deploy-pages@v4\n```\n  \u003c/Step\u003e\n\n  \u003cStep title=\"GitHub Pages aktivieren\"\u003e\n    1. Gehen Sie zu Ihren Repo-Einstellungen\n    2. Navigieren Sie zu **Pages**\n    3. Quelle: **GitHub Actions**\n    4. Speichern\n\n    Ihre Docs werden unter `https://username.github.io/repo-name` live sein\n  \u003c/Step\u003e\n\u003c/Steps\u003e\n\n### Netlify\n\nEine weitere großartige statische Hosting-Option:\n\n\u003cSteps\u003e\n  \u003cStep title=\"Konfigurieren\"\u003e\n```json\n{\n  \"deployment\": {\n    \"target\": \"static\"\n  }\n}\n```\n  \u003c/Step\u003e\n\n  \u003cStep title=\"netlify.toml erstellen\"\u003e\n```toml\n[build]\n  command = \"npm run build:export\"\n  publish = \"out\"\n\n[[redirects]]\n  from = \"/*\"\n  to = \"/index.html\"\n  status = 200\n```\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Bereitstellen\"\u003e\n    Verbinden Sie Ihr Repo auf [netlify.com](https://netlify.com) oder verwenden Sie die CLI:\n\n```bash\nnpm install -g netlify-cli\nnetlify deploy --prod\n```\n  \u003c/Step\u003e\n\u003c/Steps\u003e\n\n## Build-Befehle\n\nVerschiedene Plattformen benötigen unterschiedliche Build-Befehle:\n\n| Plattform | Build-Befehl | Ausgabeverzeichnis |\n|-----------|--------------|--------------------|\n| Vercel, Railway | `npm run build` | `.next` |\n| GitHub Pages | `npm run build:export` | `out` |\n| Netlify, Cloudflare Pages | `npm run build:export` | `out` |\n| Docker, VPS | `npm run build` + `npm start` | `.next` |\n\n## Konfiguration nach Plattform\n\n### Vercel\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"vercel\"\n  }\n}\n```\n\n**Umgebungsvariablen** (optional):\n- Keine für das Basis-Setup erforderlich\n- Fügen Sie Such-/Analytik-Schlüssel im Vercel-Dashboard hinzu\n\n### GitHub Pages (Keine benutzerdefinierte Domain)\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"github-pages\",\n    \"basePath\": \"repo-name\"\n  }\n}\n```\n\n**Warum basePath?** GitHub Pages stellt von `username.github.io/repo-name` bereit, daher benötigen alle Assets das `/repo-name` Präfix.\n\n### GitHub Pages (Mit benutzerdefinierter Domain)\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"custom-domain-static\",\n    \"customDomain\": true\n  }\n}\n```\n\nFügen Sie eine `CNAME`-Datei zu `public/` hinzu:\n\n```\ndocs.yoursite.com\n```\n\n### Netlify / Cloudflare Pages\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"static\"\n  }\n}\n```\n\nKein basePath erforderlich – sie stellen vom Root bereit.\n\n## CI/CD-Pipelines\n\n### GitHub Actions (Erweitert)\n\nVollständiges Beispiel mit Caching und MeiliSearch-Indexierung:\n\n```yaml\nname: Build and Deploy\n\non:\n  push:\n    branches: [main]\n  pull_request:\n    branches: [main]\n\njobs:\n  build:\n    runs-on: ubuntu-latest\n\n    steps:\n      - uses: actions/checkout@v4\n\n      - name: Setup Node.js\n        uses: actions/setup-node@v4\n        with:\n          node-version: '20'\n          cache: 'npm'\n\n      - name: Cache dependencies\n        uses: actions/cache@v4\n        with:\n          path: ~/.npm\n          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}\n          restore-keys: |\n            ${{ runner.os }}-node-\n\n      - name: Install dependencies\n        run: npm ci\n\n      - name: Run linter\n        run: npm run lint\n\n      - name: Build site\n        run: npm run build:export\n        env:\n          NODE_ENV: production\n\n      - name: Index search content\n        if: github.ref == 'refs/heads/main'\n        run: npm run index:search\n        env:\n          MEILISEARCH_HOST: ${{ secrets.MEILISEARCH_HOST }}\n          MEILISEARCH_API_KEY: ${{ secrets.MEILISEARCH_MASTER_KEY }}\n\n      - name: Upload artifact\n        uses: actions/upload-pages-artifact@v3\n        with:\n          path: ./out\n\n  deploy:\n    if: github.ref == 'refs/heads/main'\n    needs: build\n    runs-on: ubuntu-latest\n    environment:\n      name: github-pages\n      url: ${{ steps.deployment.outputs.page_url }}\n    permissions:\n      pages: write\n      id-token: write\n    steps:\n      - name: Deploy to GitHub Pages\n        id: deployment\n        uses: actions/deploy-pages@v4\n```\n\n### GitLab CI/CD\n\n```yaml\n# .gitlab-ci.yml\nimage: node:20\n\ncache:\n  paths:\n    - node_modules/\n\nstages:\n  - build\n  - deploy\n\nbuild:\n  stage: build\n  script:\n    - npm ci\n    - npm run build:export\n  artifacts:\n    paths:\n      - out/\n  only:\n    - main\n\npages:\n  stage: deploy\n  dependencies:\n    - build\n  script:\n    - mkdir -p public\n    - cp -r out/* public/\n  artifacts:\n    paths:\n      - public\n  only:\n    - main\n```\n\n### Docker\n\nErstellen Sie ein `Dockerfile`:\n\n```dockerfile\nFROM node:20-alpine AS builder\n\nWORKDIR /app\n\nCOPY package*.json ./\nRUN npm ci\n\nCOPY . .\nRUN npm run build\n\nFROM node:20-alpine AS runner\n\nWORKDIR /app\n\nENV NODE_ENV=production\n\nCOPY --from=builder /app/public ./public\nCOPY --from=builder /app/.next/standalone ./\nCOPY --from=builder /app/.next/static ./.next/static\n\nEXPOSE 3000\n\nCMD [\"node\", \"server.js\"]\n```\n\nErstellen und ausführen:\n\n```bash\ndocker build -t my-docs .\ndocker run -p 3000:3000 my-docs\n```\n\n## Umgebungsvariablen\n\nSetzen Sie diese in Ihrer Bereitstellungsplattform:\n\n**Suche (wenn MeiliSearch verwendet wird):**\n```bash\nMEILISEARCH_HOST=https://search.example.com\nMEILISEARCH_API_KEY=ihr-such-schluessel\n```\n\n**Analytik (optional):**\n```bash\nNEXT_PUBLIC_GA_ID=G-XXXXXXXXXX\nNEXT_PUBLIC_PLAUSIBLE_DOMAIN=docs.example.com\n```\n\n**Benutzerdefinierte Umgebungsvariablen:**\nGreifen Sie in Ihren Docs über Frontmatter oder MDX darauf zu:\n\n```json\n{\n  \"env\": {\n    \"API_BASE_URL\": \"${API_URL}\"\n  }\n}\n```\n\n## Benutzerdefinierte Domains\n\n### Vercel\n\n1. Gehen Sie zu Ihren Projekteinstellungen\n2. Navigieren Sie zu Domains\n3. Fügen Sie Ihre benutzerdefinierte Domain hinzu\n4. Aktualisieren Sie DNS-Einträge wie angezeigt\n\n### GitHub Pages\n\n1. Fügen Sie `CNAME`-Datei zu `public/` hinzu:\n```\ndocs.yoursite.com\n```\n\n2. Aktualisieren Sie `specra.config.json`:\n```json\n{\n  \"deployment\": {\n    \"customDomain\": true\n  }\n}\n```\n\n3. Konfigurieren Sie DNS:\n```\nTyp: CNAME\nName: docs\nWert: username.github.io\n```\n\n### Netlify\n\n1. Gehen Sie zu Domain-Einstellungen\n2. Benutzerdefinierte Domain hinzufügen\n3. Folgen Sie den DNS-Anweisungen\n\n## Leistungsoptimierung\n\n### Caching aktivieren\n\nFügen Sie Cache-Header in `next.config.mjs` hinzu:\n\n```javascript\nasync headers() {\n  return [\n    {\n      source: '/docs/:path*',\n      headers: [\n        {\n          key: 'Cache-Control',\n          value: 'public, max-age=3600, must-revalidate',\n        },\n      ],\n    },\n  ]\n}\n```\n\n### Bildoptimierung\n\nVerwenden Sie die Next.js Image-Komponente:\n\n```mdx\n\u003cImage\n  src=\"/images/diagram.png\"\n  alt=\"Architekturdiagramm\"\n  width={800}\n  height={600}\n/\u003e\n```\n\n### Bundle-Analyse\n\nBundle-Größe überprüfen:\n\n```bash\nnpm install --save-dev @next/bundle-analyzer\n```\n\n```javascript\n// next.config.mjs\nimport bundleAnalyzer from '@next/bundle-analyzer'\n\nconst withBundleAnalyzer = bundleAnalyzer({\n  enabled: process.env.ANALYZE === 'true',\n})\n\nexport default withBundleAnalyzer(nextConfig)\n```\n\nAusführen mit:\n```bash\nANALYZE=true npm run build\n```\n\n## Fehlerbehebung\n\n### 404 beim Aktualisieren der Seite (Statischer Export)\n\nFügen Sie Redirects/Rewrites in der Plattformkonfiguration hinzu:\n\n**Netlify:**\n```toml\n[[redirects]]\n  from = \"/*\"\n  to = \"/index.html\"\n  status = 200\n```\n\n**Vercel (vercel.json):**\n```json\n{\n  \"rewrites\": [\n    { \"source\": \"/(.*)\", \"destination\": \"/index.html\" }\n  ]\n}\n```\n\n### Assets laden nicht (GitHub Pages)\n\nÜberprüfen Sie, ob Ihr `basePath` exakt mit Ihrem Repo-Namen übereinstimmt:\n\n```json\n{\n  \"deployment\": {\n    \"basePath\": \"exakter-repo-name\"\n  }\n}\n```\n\n### Build fehlgeschlagen\n\nHäufige Lösungen:\n\n1. `.next` und `out` Ordner löschen:\n```bash\nrm -rf .next out node_modules\nnpm install\nnpm run build\n```\n\n2. Node.js Version überprüfen:\n```bash\nnode --version  # Sollte 18+ sein\n```\n\n3. Build-Logs auf spezifische Fehler überprüfen\n\n## Plattformspezifische Leitfäden\n\nTauchen Sie tiefer in die plattformspezifische Bereitstellung ein:\n\n\u003cCardGrid cols={3}\u003e\n  \u003cCard\n    icon=\"triangle\"\n    title=\"Vercel\"\n    description=\"Bereitstellen ohne Konfiguration\"\n    href=\"/docs/v1.0.0/deployment/vercel\"\n  /\u003e\n  \u003cCard\n    icon=\"github\"\n    title=\"GitHub Pages\"\n    description=\"Kostenloses Hosting für Open Source\"\n    href=\"/docs/v1.0.0/deployment/github-pages\"\n  /\u003e\n  \u003cCard\n    icon=\"globe\"\n    title=\"Netlify\"\n    description=\"Statisches Hosting mit Edge-Funktionen\"\n    href=\"/docs/v1.0.0/deployment/netlify\"\n  /\u003e\n\u003c/CardGrid\u003e\n\n## Nächste Schritte\n\n\u003cCardGrid cols={2}\u003e\n  \u003cCard\n    icon=\"settings\"\n    title=\"Konfiguration\"\n    description=\"Ihre Bereitstellungseinstellungen feinabstimmen\"\n    href=\"/docs/v1.0.0/configuration/deployment-config\"\n  /\u003e\n  \u003cCard\n    icon=\"zap\"\n    title=\"Leistung\"\n    description=\"Ihre Docs für Geschwindigkeit optimieren\"\n    href=\"/docs/v1.0.0/performance\"\n  /\u003e\n\u003c/CardGrid\u003e\n"])</script><script>self.__next_f.push([1,"21:T1d6a,"])</script><script>self.__next_f.push([1,"\nDas API-Dokumentationssystem von Specra unterstützt mehrere Industriestandard-Formate, sodass Sie Ihre bestehenden API-Spezifikationen ohne Konvertierung verwenden können.\n\n## Schneller Überblick\n\n\u003cdiv className=\"grid grid-cols-1 md:grid-cols-3 gap-4 not-prose my-6\"\u003e\n  \u003cdiv className=\"border border-border rounded-lg p-4\"\u003e\n    \u003ch3 className=\"text-lg font-semibold mb-2\"\u003eSpecra-Format\u003c/h3\u003e\n    \u003cp className=\"text-sm text-muted-foreground mb-3\"\u003eNatives Format, auf Einfachheit ausgelegt\u003c/p\u003e\n    \u003cdiv className=\"flex items-center gap-2 text-xs\"\u003e\n      \u003cspan className=\"px-2 py-1 bg-green-500/10 text-green-600 dark:text-green-400 rounded\"\u003eEinfach\u003c/span\u003e\n      \u003cspan className=\"px-2 py-1 bg-blue-500/10 text-blue-600 dark:text-blue-400 rounded\"\u003eLesbar\u003c/span\u003e\n    \u003c/div\u003e\n  \u003c/div\u003e\n\n  \u003cdiv className=\"border border-border rounded-lg p-4\"\u003e\n    \u003ch3 className=\"text-lg font-semibold mb-2\"\u003eOpenAPI 3.x\u003c/h3\u003e\n    \u003cp className=\"text-sm text-muted-foreground mb-3\"\u003eIndustriestandard REST-API-Format\u003c/p\u003e\n    \u003cdiv className=\"flex items-center gap-2 text-xs\"\u003e\n      \u003cspan className=\"px-2 py-1 bg-purple-500/10 text-purple-600 dark:text-purple-400 rounded\"\u003eStandard\u003c/span\u003e\n      \u003cspan className=\"px-2 py-1 bg-orange-500/10 text-orange-600 dark:text-orange-400 rounded\"\u003eMächtig\u003c/span\u003e\n    \u003c/div\u003e\n  \u003c/div\u003e\n\n  \u003cdiv className=\"border border-border rounded-lg p-4\"\u003e\n    \u003ch3 className=\"text-lg font-semibold mb-2\"\u003ePostman v2.x\u003c/h3\u003e\n    \u003cp className=\"text-sm text-muted-foreground mb-3\"\u003eDirekt aus Postman exportieren\u003c/p\u003e\n    \u003cdiv className=\"flex items-center gap-2 text-xs\"\u003e\n      \u003cspan className=\"px-2 py-1 bg-pink-500/10 text-pink-600 dark:text-pink-400 rounded\"\u003eBeliebt\u003c/span\u003e\n      \u003cspan className=\"px-2 py-1 bg-cyan-500/10 text-cyan-600 dark:text-cyan-400 rounded\"\u003eEinfach\u003c/span\u003e\n    \u003c/div\u003e\n  \u003c/div\u003e\n\u003c/div\u003e\n\n## Wie es funktioniert\n\nDas API-Dokumentationssystem verwendet standardmäßig **automatische Erkennung**. Referenzieren Sie einfach Ihre Spezifikationsdatei und das System ermittelt das Format automatisch:\n\n```mdx\n\u003cApiReference spec=\"/api-specs/my-api.json\" /\u003e\n```\n\nDer Parser erkennt, ob Ihre Datei ist:\n- ✅ Specra-Format (nativ)\n- ✅ OpenAPI 3.x oder Swagger 2.0\n- ✅ Postman Collection v2.0 oder v2.1\n\n## Format-Vergleich\n\n| Feature | Specra | OpenAPI | Postman |\n|---------|--------|---------|---------|\n| **Einfach zu schreiben** | ⭐⭐⭐⭐⭐ | ⭐⭐⭐ | ⭐⭐⭐⭐ |\n| **Industriestandard** | ⭐⭐ | ⭐⭐⭐⭐⭐ | ⭐⭐⭐⭐ |\n| **Schema-Validierung** | ⭐⭐⭐ | ⭐⭐⭐⭐⭐ | ⭐⭐ |\n| **Code-Generierung** | ⭐⭐ | ⭐⭐⭐⭐⭐ | ⭐⭐⭐ |\n| **Beispiele** | ⭐⭐⭐⭐⭐ | ⭐⭐⭐⭐ | ⭐⭐⭐⭐⭐ |\n| **Auto-Generierung** | ⭐⭐ | ⭐⭐⭐⭐⭐ | ⭐⭐⭐⭐ |\n\n## Ein Format wählen\n\n### Verwenden Sie das Specra-Format, wenn:\n\n- 📝 Dokumente von Grund auf neu schreiben\n- 🎯 Ein einfaches, minimales Format benötigen\n- 🚀 Schnell starten wollen\n- 📖 Weniger als 20 Endpunkte dokumentieren\n\n**Beispiel:**\n```json\n{\n  \"title\": \"My API\",\n  \"baseUrl\": \"https://api.example.com\",\n  \"endpoints\": [...]\n}\n```\n\n[Specra-Beispiel ansehen →](/docs/v1.0.0/api-test)\n\n---\n\n### Verwenden Sie OpenAPI, wenn:\n\n- 🏢 Unternehmensstandards folgen\n- 🔧 Spezifikationen aus Code generieren\n- 🔄 Spezifikationen über Tools hinweg teilen\n- 📊 Detaillierte Schema-Validierung benötigen\n- 🌐 Mit API-Gateways arbeiten\n\n**Beispiel:**\n```json\n{\n  \"openapi\": \"3.0.0\",\n  \"info\": {...},\n  \"paths\": {...}\n}\n```\n\n[OpenAPI-Beispiel ansehen →](/docs/v1.0.0/api-openapi)\n\n---\n\n### Verwenden Sie Postman, wenn:\n\n- 🧪 Ihr Team Postman zum Testen verwendet\n- 💾 Bestehende Postman-Sammlungen haben\n- 🔁 Dokumente synchron mit Tests halten wollen\n- 📸 Gespeicherte Antwortbeispiele benötigen\n- ⚡ Schnellen Export-Workflow wollen\n\n**Beispiel:**\n```json\n{\n  \"info\": {\n    \"schema\": \"https://schema.getpostman.com/...\"\n  },\n  \"item\": [...]\n}\n```\n\n[Postman-Beispiel ansehen →](/docs/v1.0.0/api-postman)\n\n## Workflow-Beispiele\n\n### Workflow 1: Einfach starten (Specra)\n\nPerfekt für neue Projekte oder kleine APIs:\n\n1. **Erstellen Sie eine Specra JSON-Datei** in `/public/api-specs/`\n2. **Fügen Sie Ihre Endpunkte hinzu** mit Beispielen\n3. **Referenz in MDX**:\n   ```mdx\n   \u003cApiReference spec=\"/api-specs/my-api.json\" /\u003e\n   ```\n4. **Fertig!** Interaktive Dokumente sind live\n\n---\n\n### Workflow 2: Bestehendes OpenAPI verwenden (OpenAPI)\n\nGroßartig, wenn Sie bereits OpenAPI verwenden:\n\n1. **Generieren Sie die OpenAPI-Spezifikation** aus Ihrem Code (z.B. FastAPI, Swagger, etc.)\n2. **Platzieren Sie sie in `/public/api-specs/`**\n3. **Referenz in MDX**:\n   ```mdx\n   \u003cApiReference spec=\"/api-specs/openapi.json\" /\u003e\n   ```\n4. **Synchron halten**, indem Sie bei Codeänderungen neu generieren\n\n---\n\n### Workflow 3: Export aus Postman (Postman)\n\nIdeal für Teams, die Postman verwenden:\n\n1. **Entwickeln und testen** Sie Ihre API in Postman\n2. **Fügen Sie Antwortbeispiele hinzu** in Postman\n3. **Exportieren Sie die Sammlung** (Format v2.1)\n4. **Platzieren Sie sie in `/public/api-specs/`**\n5. **Referenz in MDX**:\n   ```mdx\n   \u003cApiReference spec=\"/api-specs/collection.json\" /\u003e\n   ```\n6. **Neu exportieren**, wenn Sie Ihre Sammlung aktualisieren\n\n## Gemischter Ansatz\n\nSie können mehrere Formate im selben Projekt verwenden:\n\n```mdx\n\u003c!-- Automatisch generiertes OpenAPI für die Haupt-API --\u003e\n\u003cApiReference spec=\"/api-specs/main-api-openapi.json\" /\u003e\n\n\u003c!-- Postman-Sammlung für externe API --\u003e\n\u003cApiReference spec=\"/api-specs/third-party-postman.json\" /\u003e\n\n\u003c!-- Specra für interne Tools --\u003e\n\u003cApiReference spec=\"/api-specs/internal-tools-specra.json\" /\u003e\n```\n\n## Erweiterte Nutzung\n\n### Explizite Parser-Auswahl\n\nWährend die automatische Erkennung gut funktioniert, können Sie den Parser explizit angeben:\n\n```mdx\n\u003cApiReference spec=\"/api-specs/my-api.json\" parser=\"openapi\" /\u003e\n\u003cApiReference spec=\"/api-specs/my-api.json\" parser=\"postman\" /\u003e\n\u003cApiReference spec=\"/api-specs/my-api.json\" parser=\"specra\" /\u003e\n```\n\n### Playground deaktivieren\n\nSchalten Sie den interaktiven Spielplatz aus, wenn Sie ihn nicht benötigen:\n\n```mdx\n\u003cApiReference spec=\"/api-specs/my-api.json\" showPlayground={false} /\u003e\n```\n\n### Mehrere Versionen\n\nDokumentieren Sie mehrere API-Versionen:\n\n```mdx\n## Version 2. 03eStabil\u003c/Badge\u003e und bereit für die Produktion.\n```\n\nDiese Funktion ist \u003cBadge variant=\"success\"\u003eStabil\u003c/Badge\u003e und bereit für die Produktion.\n"])</script><script>self.__next_f.push([1,"25:T22b1,"])</script><script>self.__next_f.push([1,"\n# Seiten-Konfiguration\n\nDer Abschnitt `site` in `specra.config.json` steuert die Identität, das Branding und die grundlegenden Metadaten Ihrer Dokumentationsseite. Hier definieren Sie den Titel, die Beschreibung, das Logo und andere grundlegende Eigenschaften Ihrer Website.\n\n## Grundkonfiguration\n\nHier ist eine minimale Seitenkonfiguration:\n\n```json\n{\n  \"site\": {\n    \"title\": \"Meine Dokumentation\",\n    \"description\": \"Umfassende Dokumentation für mein Projekt\",\n    \"url\": \"https://docs.example.com\"\n  }\n}\n```\n\nDas ist alles, was Sie für den Einstieg benötigen. Specra füllt sinnvolle Standardwerte für alles andere aus.\n\n## Alle Seitenoptionen\n\n### Erforderliche Felder\n\nNur ein Feld ist wirklich erforderlich:\n\n```json\n{\n  \"site\": {\n    \"title\": \"Meine Dokumentation\"\n  }\n}\n```\n\nAlles andere ist optional, wird aber für eine professionelle Docs-Seite empfohlen.\n\n### Vollständige Konfiguration\n\nHier ist jede verfügbare Option:\n\n```json\n{\n  \"site\": {\n    \"title\": \"Specra Dokumentation\",\n    \"description\": \"Erstellen Sie schöne Dokumentation mit Specra\",\n    \"url\": \"https://docs.example.com\",\n    \"baseUrl\": \"/\",\n    \"language\": \"en\",\n    \"organizationName\": \"Meine Firma\",\n    \"projectName\": \"specra\",\n    \"activeVersion\": \"v1.0.0\",\n    \"logo\": \"/logo.svg\",\n    \"favicon\": \"/favicon.ico\",\n    \"hideTitle\": false,\n    \"hideLogo\": false\n  }\n}\n```\n\n## Konfigurationsreferenz\n\n### title\n\n**Typ:** `string` (Erforderlich)\n\nDer Name Ihrer Dokumentationsseite. Erscheint im Browser-Tab, in der Navigationskopfzeile und in Social-Media-Vorschauen.\n\n```json\n{\n  \"site\": {\n    \"title\": \"Specra Docs\"\n  }\n}\n```\n\n\u003cCallout type=\"tip\"\u003e\nHalten Sie es kurz und klar. Dies erscheint an vielen Stellen, einschließlich Browser-Tabs, wo der Platz begrenzt ist.\n\u003c/Callout\u003e\n\n### description\n\n**Typ:** `string`\n\nKurze Beschreibung Ihrer Dokumentation. Wird in SEO-Meta-Tags und Social-Media-Vorschauen verwendet.\n\n```json\n{\n  \"site\": {\n    \"description\": \"Vollständiger Leitfaden zur Erstellung von Dokumentation mit Specra\"\n  }\n}\n```\n\n**Best Practices:**\n- Halten Sie es unter 160 Zeichen\n- Fügen Sie relevante Schlüsselwörter hinzu\n- Seien Sie beschreibend und spezifisch\n- Konzentrieren Sie sich darauf, was Benutzer lernen werden\n\n### url\n\n**Typ:** `string`\n\nDie vollständige URL, unter der Ihre Dokumentation gehostet wird. Wird zur Erstellung kanonischer URLs und Social-Media-Vorschauen verwendet.\n\n```json\n{\n  \"site\": {\n    \"url\": \"https://docs.example.com\"\n  }\n}\n```\n\n\u003cCallout type=\"warning\"\u003e\nFügen Sie das Protokoll (`https://`) ein, aber keinen nachgestellten Schrägstrich.\n\u003c/Callout\u003e\n\n### baseUrl\n\n**Typ:** `string`\n**Standard:** `\"/\"`\n\nBasispfad für Ihre Seite. Normalerweise nur für GitHub Pages ohne benutzerdefinierte Domain erforderlich.\n\n```json\n{\n  \"site\": {\n    \"baseUrl\": \"/\"\n  }\n}\n```\n\nFür GitHub Pages unter `username.github.io/repo-name`:\n\n```json\n{\n  \"site\": {\n    \"baseUrl\": \"/repo-name/\"\n  }\n}\n```\n\n\u003cCallout type=\"info\"\u003e\nFür die meisten Bereitstellungen (Vercel, Netlify, benutzerdefinierte Domains) behalten Sie dies als `\"/\"` bei.\n\u003c/Callout\u003e\n\n### language\n\n**Typ:** `string`\n**Standard:** `\"en\"`\n\nDie primäre Sprache Ihrer Dokumentation. Wird im HTML `lang` Attribut verwendet.\n\n```json\n{\n  \"site\": {\n    \"language\": \"en\"\n  }\n}\n```\n\nHäufige Werte: `en`, `es`, `fr`, `de`, `ja`, `zh`, `pt`, `ru`\n\n### organizationName\n\n**Typ:** `string`\n\nIhr Firmen- oder Organisationsname. Wird im Footer und in Metadaten verwendet.\n\n```json\n{\n  \"site\": {\n    \"organizationName\": \"Acme Corporation\"\n  }\n}\n```\n\n### projectName\n\n**Typ:** `string`\n\nDer Name Ihres Projekts oder Produkts. Wird in Metadaten verwendet und kann im Inhalt referenziert werden.\n\n```json\n{\n  \"site\": {\n    \"projectName\": \"specra\"\n  }\n}\n```\n\n### activeVersion\n\n**Typ:** `string`\n**Standard:** Erste Version im `docs/` Ordner gefunden\n\nWelche Dokumentationsversion standardmäßig angezeigt werden soll.\n\n```json\n{\n  \"site\": {\n    \"activeVersion\": \"v2.0.0\"\n  }\n}\n```\n\nBenutzer können Versionen über das Versions-Dropdown wechseln, aber dies setzt den Standard.\n\n### logo\n\n**Typ:** `string` oder `object`\n\nPfad zu Ihrem Logo-Bild. Kann ein einzelnes Logo oder separate Logos für helle und dunkle Modi sein.\n\n**Einzelnes Logo:**\n```json\n{\n  \"site\": {\n    \"logo\": \"/logo.svg\"\n  }\n}\n```\n\n**Separate Logos für Themes:**\n```json\n{\n  \"site\": {\n    \"logo\": {\n      \"light\": \"/logo-light.svg\",\n      \"dark\": \"/logo-dark.svg\"\n    }\n  }\n}\n```\n\n**Best Practices:**\n- Verwenden Sie SVG für gestochen scharfe Darstellung in jeder Größe\n- Halten Sie Abmessungen um 150px Breite × 40px Höhe\n- Optimieren Sie Dateien (verwenden Sie SVGO oder ähnlich)\n- Platzieren Sie sie im `public/` Ordner\n\n### favicon\n\n**Typ:** `string`\n\nPfad zu Ihrem Favicon. Erscheint in Browser-Tabs und Lesezeichen.\n\n```json\n{\n  \"site\": {\n    \"favicon\": \"/favicon.ico\"\n  }\n}\n```\n\n**Empfohlenes Setup:**\n```\npublic/\n├── favicon.ico          # 32×32 ICO für ältere Browser\n├── favicon-16x16.png    # 16×16 PNG\n├── favicon-32x32.png    # 32×32 PNG\n└── apple-touch-icon.png # 180×180 PNG für iOS\n```\n\nDann referenzieren Sie das Haupt-Favicon:\n```json\n{\n  \"site\": {\n    \"favicon\": \"/favicon-32x32.png\"\n  }\n}\n```\n\n### hideTitle\n\n**Typ:** `boolean`\n**Standard:** `false`\n\nDen Seitentitel in der Header-Navigation ausblenden.\n\n```json\n{\n  \"site\": {\n    \"hideTitle\": true\n  }\n}\n```\n\nNützlich, wenn Ihr Logo Text enthält und Sie den Titel nicht dupliziert haben möchten.\n\n### hideLogo\n\n**Typ:** `boolean`\n**Standard:** `false`\n\nDas Logo in der Header-Navigation ausblenden.\n\n```json\n{\n  \"site\": {\n    \"hideLogo\": true\n  }\n}\n```\n\nVerwenden Sie dies, wenn Sie nur den Texttitel ohne ein Logo anzeigen möchten.\n\n## Beispiele\n\n### Minimales Setup\n\nPerfekt für den Einstieg:\n\n```json\n{\n  \"site\": {\n    \"title\": \"Meine Docs\",\n    \"description\": \"Dokumentation für mein Projekt\"\n  }\n}\n```\n\n### Open Source Projekt\n\nFür ein Open-Source-Projekt auf GitHub:\n\n```json\n{\n  \"site\": {\n    \"title\": \"MyLib Dokumentation\",\n    \"description\": \"Eine leistungsstarke Bibliothek zum Erstellen toller Dinge\",\n    \"url\": \"https://mylib.dev\",\n    \"organizationName\": \"MyLib Contributors\",\n    \"projectName\": \"mylib\",\n    \"logo\": \"/logo.svg\",\n    \"favicon\": \"/favicon.ico\"\n  }\n}\n```\n\n### Firmenprodukt\n\nFür ein kommerzielles Produkt:\n\n```json\n{\n  \"site\": {\n    \"title\": \"Acme API Docs\",\n    \"description\": \"Vollständige API-Referenz und Anleitungen für Acme Plattform\",\n    \"url\": \"https://docs.acme.com\",\n    \"organizationName\": \"Acme Corporation\",\n    \"projectName\": \"acme-platform\",\n    \"activeVersion\": \"v2.0.0\",\n    \"logo\": {\n      \"light\": \"/acme-logo-light.svg\",\n      \"dark\": \"/acme-logo-dark.svg\"\n    },\n    \"favicon\": \"/favicon-32x32.png\"\n  }\n}\n```\n\n### Mehrsprachige Seite\n\nFür Dokumentation in mehreren Sprachen:\n\n```json\n{\n  \"site\": {\n    \"title\": \"Dokumentation\",\n    \"language\": \"es\",\n    \"url\": \"https://docs.example.com/es\",\n    \"logo\": \"/logo.svg\"\n  }\n}\n```\n\n## Häufige Muster\n\n### GitHub Pages Setup\n\nFür GitHub Pages ohne benutzerdefinierte Domain:\n\n```json\n{\n  \"site\": {\n    \"title\": \"Meine Docs\",\n    \"url\": \"https://username.github.io/repo-name\",\n    \"baseUrl\": \"/repo-name/\"\n  }\n}\n```\n\n### Logo Best Practices\n\n**Für Hintergrund im hellen Modus:**\nVerwenden Sie ein dunkles Logo oder ein Logo mit Farbe\n\n**Für Hintergrund im dunklen Modus:**\nVerwenden Sie ein helles/weißes Logo oder invertieren Sie Farben\n\n**Beispiel-Setup:**\n```json\n{\n  \"site\": {\n    \"logo\": {\n      \"light\": \"/logo-dark.svg\",\n      \"dark\": \"/logo-white.svg\"\n    }\n  }\n}\n```\n\n## Validierung\n\nSpecra validiert Ihre Seitenkonfiguration beim Start. Häufige Fehler:\n\n**Fehlender Titel:**\n```\n❌ Fehler: site.title ist erforderlich\n```\n\n**Ungültige URL:**\n```\n❌ Fehler: site.url muss eine gültige URL sein (inklusive https://)\n```\n\n**Logo-Datei nicht gefunden:**\n```\n⚠️ Warnung: Logo-Datei nicht gefunden unter /logo.svg\n```\n\n## Umgebungsvariablen\n\nVerwenden Sie Umgebungsvariablen für verschiedene Umgebungen:\n\n```json\n{\n  \"site\": {\n    \"url\": \"${SITE_URL}\",\n    \"logo\": \"${LOGO_PATH}\"\n  }\n}\n```\n\nDann setzen Sie sie:\n```bash\n# .env.local\nSITE_URL=https://docs.example.com\nLOGO_PATH=/logo.svg\n```\n\n## Nächste Schritte\n\n\u003cCardGrid cols={2}\u003e\n  \u003cCard\n    icon=\"layout\"\n    title=\"Navigation\"\n    description=\"Seitenleiste, Brotkrumen und Tab-Gruppen konfigurieren\"\n    href=\"/docs/v1.0.0/configuration/navigation\"\n  /\u003e\n  \u003cCard\n    icon=\"rocket\"\n    title=\"Bereitstellung\"\n    description=\"Bereitstellungskonfiguration einrichten\"\n    href=\"/docs/v1.0.0/configuration/deployment-config\"\n  /\u003e\n  \u003cCard\n    icon=\"sliders\"\n    title=\"Erweitert\"\n    description=\"Analytik, Suche und mehr\"\n    href=\"/docs/v1.0.0/configuration/advanced\"\n  /\u003e\n  \u003cCard\n    icon=\"arrow-left\"\n    title=\"Übersicht\"\n    description=\"Zurück zur Konfigurationsübersicht\"\n    href=\"/docs/v1.0.0/configuration/overview\"\n  /\u003e\n\u003c/CardGrid\u003e\n"])</s \n\u003c/Callout\u003e\n\n### description\n\n**Typ:** `string`\n\nKurze Beschreibung Ihrer Dokumentation. Wird in SEO-Meta-Tags und Social-Media-Vorschauen verwendet.\n\n```json\n{\n  \"site\": {\n    \"description\": \"Vollständiger Leitfaden zur Erstellung von Dokumentation mit Specra\"\n  }\n}\n```\n\n**Best Practices:**\n- Halten Sie es unter 160 Zeichen\n- Fügen Sie relevante Schlüsselwörter hinzu\n- Seien Sie beschreibend und spezifisch\n- Konzentrieren Sie sich darauf, was Benutzer lernen werden\n\n### url\n\n**Typ:** `string`\n\nDie vollständige URL, unter der Ihre Dokumentation gehostet wird. Wird zur Erstellung kanonischer URLs und Social-Media-Vorschauen verwendet.\n\n```json\n{\n  \"site\": {\n    \"url\": \"https://docs.example.com\"\n  }\n}\n```\n\n\u003cCallout type=\"warning\"\u003e\nFügen Sie das Protokoll (`https://`) ein, aber keinen nachgestellten Schrägstrich.\n\u003c/Callout\u003e\n\n### baseUrl\n\n**Typ:** `string`\n**Standard:** `\"/\"`\n\nBasispfad für Ihre Seite. Normalerweise nur für GitHub Pages ohne benutzerdefinierte Domain erforderlich.\n\n```json\n{\n  \"site\": {\n    \"baseUrl\": \"/\"\n  }\n}\n```\n\nFür GitHub Pages unter `username.github.io/repo-name`:\n\n```json\n{\n  \"site\": {\n    \"baseUrl\": \"/repo-name/\"\n  }\n}\n```\n\n\u003cCallout type=\"info\"\u003e\nFür die meisten Bereitstellungen (Vercel, Netlify, benutzerdefinierte Domains) behalten Sie dies als `\"/\"` bei.\n\u003c/Callout\u003e\n\n### language\n\n**Typ:** `string`\n**Standard:** `\"en\"`\n\nDie primäre Sprache Ihrer Dokumentation. Wird im HTML `lang` Attribut verwendet.\n\n```json\n{\n  \"site\": {\n    \"language\": \"en\"\n  }\n}\n```\n\nHäufige Werte: `en`, `es`, `fr`, `de`, `ja`, `zh`, `pt`, `ru`\n\n### organizationName\n\n**Typ:** `string`\n\nIhr Firmen- oder Organisationsname. Wird im Footer und in Metadaten verwendet.\n\n```json\n{\n  \"site\": {\n    \"organizationName\": \"Acme Corporation\"\n  }\n}\n```\n\n### projectName\n\n**Typ:** `string`\n\nDer
