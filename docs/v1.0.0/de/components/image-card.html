n\" description=\"Ausführliche Tutorials und Walkthroughs\" href=\"/docs/v1.0.0/guides\" /\u003e\n  \u003cCard icon=\"code\" title=\"API Referenz\" description=\"Vollständige API-Dokumentation\" /\u003e\n  \u003cCard icon=\"github\" title=\"GitHub\" description=\"Am Projekt mitwirken\" href=\"https://github.com\" external /\u003e\n\u003c/CardGrid\u003e\n\n## Props\n\n### Card\n\n| Prop | Typ | Standard | Beschreibung |\n|------|-----|----------|--------------|\n| `title` | `string` | erforderlich | Kartentitel |\n| `description` | `string` | - | Kartenbeschreibungstext |\n| `href` | `string` | - | Link-URL (macht Karte anklickbar) |\n| `icon` | `string \\| ReactNode` | - | Lucide-Icon-Name oder eigenes Icon |\n| `external` | `boolean` | `false` | Öffnet Link in neuem Tab |\n| `children` | `ReactNode` | - | Eigener Inhalt |\n\n### CardGrid\n\n| Prop | Typ | Standard | Beschreibung |\n|------|-----|----------|--------------|\n| `children` | `ReactNode` | erforderlich | Kartenkomponenten |\n| `cols` | `1 \\| 2 \\| 3` | `2` | Anzahl der Spalten |\n"])</script><script>self.__next_f.push([1,"42:T939,"])</script><script>self.__next_f.push([1,"\nKarten erstellen visuell abgegrenzte Inhaltsblöcke, perfekt für Feature-Listen, Navigationslinks oder hervorgehobene Inhalte.\n\n## Verwendung\n\n```mdx\n\u003cCard \n  title=\"Erste Schritte\" \n  description=\"Lernen Sie die Grundlagen unserer Plattform\"\n  href=\"/docs/v1.0.0/getting-started\"\n/\u003e\n```\n\n## Live-Beispiele\n\n### Einfache Karte\n\n\u003cCard \n  title=\"Dokumentation\" \n  description=\"Lesen Sie die vollständige Dokumentation für detaillierte Anleitungen und API-Referenzen.\"\n/\u003e\n\n### Verlinkte Karte\n\n\u003cCard \n  title=\"Erste Schritte\" \n  description=\"Beginnen Sie Ihre Reise mit unserem Schnellstart-Leitfaden\"\n  href=\"/docs/v1.0.0/getting-started\"\n/\u003e\n\n### Karte mit Icon\n\n\u003cCard \n  icon=\"book-open\"\n  title=\"Anleitungen\" \n  description=\"Schritt-für-Schritt-Tutorials und Best Practices\"\n/\u003e\n\n### Externer Link\n\n\u003cCard \n  title=\"GitHub Repository\" \n  description=\"Quellcode ansehen und mitwirken\"\n  href=\"https://github.com\"\n  external\n/\u003e\n\n## Karten-Raster\n\nVerwenden Sie `CardGrid`, um mehrere Karten in einem responsiven Rasterlayout anzuzeigen:\n\n```mdx\n\u003cCardGrid cols={2}\u003e\n  \u003cCard title=\"Karte 1\" description=\"Erste Karte\" /\u003e\n  \u003cCard title=\"Karte 2\" description=\"Zweite Karte\" /\u003e\n\u003c/CardGrid\u003e\n```\n\n\u003cCardGrid cols={2}\u003e\n  \u003cCard icon=\"rocket\" title=\"Schnellstart\" description=\"Starten Sie in 5 Minuten\" href=\"/docs/v1.0.0/getting-started/quickstart\" /\u003e\n  \u003cCard icon=\"book\" title=\"Anleitungen\" description=\"Ausführliche Tutorials und Walkthroughs\" href=\"/docs/v1.0.0/guides\" /\u003e\n  \u003cCard icon=\"code\" title=\"API Referenz\" description=\"Vollständige API-Dokumentation\" /\u003e\n  \u003cCard icon=\"github\" title=\"GitHub\" description=\"Am Projekt mitwirken\" href=\"https://github.com\" external /\u003e\n\u003c/CardGrid\u003e\n\n## Props\n\n### Card\n\n| Prop | Typ | Standard | Beschreibung |\n|------|-----|----------|--------------|\n| `title` | `string` | erforderlich | Kartentitel |\n| `description` | `string` | - | Kartenbeschreibungstext |\n| `href` | `string` | - | Link-URL (macht Karte anklickbar) |\n| `icon` | `string \\| ReactNode` | - | Lucide-Icon-Name oder eigenes Icon |\n| `external` | `boolean` | `false` | Öffnet Link in neuem Tab |\n| `children` | `ReactNode` | - | Eigener Inhalt |\n\n### CardGrid\n\n| Prop | Typ | Standard | Beschreibung |\n|------|-----|----------|--------------|\n| `children` | `ReactNode` | erforderlich | Kartenkomponenten |\n| `cols` | `1 \\| 2 \\| 3` | `2` | Anzahl der Spalten |\n"])</script><script>self.__next_f.push([1,"43:T2de6,"])</script><script>self.__next_f.push([1,"\n# Erweiterte Konfiguration\n\nÜber die Grundlagen hinaus bietet Specra leistungsstarke Funktionen wie Analytik, Suche, benutzerdefinierte Footer, Banner und Umgebungsvariablen. Dieser Leitfaden behandelt alle erweiterten Konfigurationsoptionen.\n\n## Analytik\n\nVerfolgen Sie, wie Benutzer mit Ihrer Dokumentation interagieren.\n\n### Google Analytics\n\n```json\n{\n  \"analytics\": {\n    \"googleAnalytics\": \"G-XXXXXXXXXX\"\n  }\n}\n```\n\nErhalten Sie Ihre Mess-ID von [Google Analytics](https://analytics.google.com).\n\n### Google Tag Manager\n\n```json\n{\n  \"analytics\": {\n    \"googleTagManager\": \"GTM-XXXXXXX\"\n  }\n}\n```\n\nFlexibler als Google Analytics, ermöglicht benutzerdefiniertes Tracking ohne Codeänderungen.\n\n### Plausible Analytics\n\nDatenschutzfreundliche Alternative zu Google Analytics:\n\n```json\n{\n  \"analytics\": {\n    \"plausible\": \"docs.example.com\"\n  }\n}\n```\n\nRegistrieren Sie sich unter [plausible.io](https://plausible.io).\n\n### Mehrere Analytik-Dienste\n\nVerwenden Sie mehrere Anbieter gleichzeitig:\n\n```json\n{\n  \"analytics\": {\n    \"googleAnalytics\": \"G-XXXXXXXXXX\",\n    \"plausible\": \"docs.example.com\"\n  }\n}\n```\n\n## Suchkonfiguration\n\nAktivieren Sie leistungsstarke Suche für Ihre Dokumentation.\n\n### Grundlegendes Such-Setup\n\n```json\n{\n  \"search\": {\n    \"enabled\": true,\n    \"placeholder\": \"Dokumentation durchsuchen...\",\n    \"provider\": \"meilisearch\"\n  }\n}\n```\n\n### MeiliSearch\n\nVoll funktionsfähige Suche mit Tippfehlertoleranz:\n\n```json\n{\n  \"search\": {\n    \"enabled\": true,\n    \"provider\": \"meilisearch\",\n    \"meilisearch\": {\n      \"host\": \"https://search.example.com\",\n      \"apiKey\": \"ihr-such-schluessel\",\n      \"indexName\": \"docs\"\n    }\n  }\n}\n```\n\nSiehe [Such-Setup](/docs/v1.0.0/search-setup) für die vollständige MeiliSearch-Konfiguration.\n\n### Lokale Suche\n\nEinfache Suche ohne externe Abhängigkeiten:\n\n```json\n{\n  \"search\": {\n    \"enabled\": true,\n    \"provider\": \"local\",\n    \"placeholder\": \"Suchen...\"\n  }\n}\n```\n\n**Vorteile:**\n- Keine Einrichtung erforderlich\n- Funktioniert offline\n- Kostenlos\n\n**Nachteile:**\n- Weniger leistungsstark als MeiliSearch\n- Keine Tippfehlertoleranz\n- Langsamer bei großen Seiten\n\n## Footer-Konfiguration\n\nPassen Sie Ihren Dokumentations-Footer an.\n\n### Einfacher Footer\n\n```json\n{\n  \"footer\": {\n    \"copyright\": \"© 2024 Meine Firma. Alle Rechte vorbehalten.\"\n  }\n}\n```\n\n### Vollständiger Footer\n\n```json\n{\n  \"footer\": {\n    \"copyright\": \"© 2024 Acme Corp. Alle Rechte vorbehalten.\",\n    \"customContent\": \"\u003cp\u003eBrauchen Sie Hilfe? \u003ca href='/support'\u003eKontaktieren Sie den Support\u003c/a\u003e\u003c/p\u003e\",\n    \"links\": [\n      {\n        \"title\": \"Produkt\",\n        \"items\": [\n          { \"label\": \"Funktionen\", \"href\": \"/features\" },\n          { \"label\": \"Preise\", \"href\": \"/pricing\" },\n          { \"label\": \"Änderungsprotokoll\", \"href\": \"/changelog\" }\n        ]\n      },\n      {\n        \"title\": \"Ressourcen\",\n        \"items\": [\n          { \"label\": \"Dokumentation\", \"href\": \"/docs\" },\n          { \"label\": \"API-Referenz\", \"href\": \"/api\" },\n          { \"label\": \"Beispiele\", \"href\": \"/examples\" }\n        ]\n      },\n      {\n        \"title\": \"Firma\",\n        \"items\": [\n          { \"label\": \"Über uns\", \"href\": \"/about\" },\n          { \"label\": \"Blog\", \"href\": \"/blog\" },\n          { \"label\": \"Karriere\", \"href\": \"/careers\" }\n        ]\n      }\n    ],\n    \"branding\": {\n      \"showBranding\": true,\n      \"logo\": \"/brand-logo.svg\",\n      \"title\": \"Powered by Specra\",\n      \"url\": \"https://specra.dev\"\n    }\n  }\n}\n```\n\n### Footer-Optionen\n\n**copyright**\n- Urheberrechtshinweis, der unten angezeigt wird\n- Unterstützt HTML\n\n**customContent**\n- Benutzerdefiniertes HTML, das in den Footer eingefügt wird\n- Verwenden Sie dies für zusätzliche Nachrichten oder Links\n\n**links**\n- Organisierte Link-Spalten\n- Jede Spalte hat einen Titel und Elemente\n- Elemente haben Label und href\n\n**branding**\n- Zeigt \"Powered by\"-Branding an\n- Passen Sie Logo, Titel und URL an\n- Setzen Sie `showBranding: false`, um es auszublenden\n\n## Banner-Konfiguration\n\nZeigen Sie wichtige Nachrichten oben auf Ihrer Website an.\n\n### Einfaches Banner\n\n```json\n{\n  \"banner\": {\n    \"enabled\": true,\n    \"message\": \"📢 Version 2.0 ist jetzt verfügbar!\",\n    \"type\": \"info\"\n  }\n}\n```\n\n### Banner-Optionen\n\n```json\n{\n  \"banner\": {\n    \"enabled\": true,\n    \"message\": \"⚠️ Geplante Wartung am Sonntag um 2 Uhr UTC\",\n    \"type\": \"warning\",\n    \"dismissible\": true\n  }\n}\n```\n\n**Eigenschaften:**\n\n| Eigenschaft | Typ | Beschreibung |\n|-------------|-----|--------------|\n| `enabled` | boolean | Banner anzeigen oder ausblenden |\n| `message` | string | Banner-Text (unterstützt Emojis und HTML) |\n| `type` | string | Stil: `info`, `warning`, `success`, `error` |\n| `dismissible` | boolean | Benutzern erlauben, das Banner zu schließen |\n\n### Banner-Typen\n\n**Info (blau):**\n```json\n{\n  \"banner\": {\n    \"message\": \"📢 Neue Funktion: Dark Mode ist da!\",\n    \"type\": \"info\"\n  }\n}\n```\n\n**Warnung (gelb):**\n```json\n{\n  \"banner\": {\n    \"message\": \"⚠️ API v1 wird am 1. Jan. 2025 veraltet sein\",\n    \"type\": \"warning\"\n  }\n}\n```\n\n**Erfolg (grün):**\n```json\n{\n  \"banner\": {\n    \"message\": \"✅ Alle Systeme betriebsbereit\",\n    \"type\": \"success\"\n  }\n}\n```\n\n**Fehler (rot):**\n```json\n{\n  \"banner\": {\n    \"message\": \"🚨 Kritisches Sicherheitsupdate verfügbar\",\n    \"type\": \"error\"\n  }\n}\n```\n\n## Features-Konfiguration\n\nAktivieren oder deaktivieren Sie verschiedene Dokumentationsfunktionen.\n\n```json\n{\n  \"features\": {\n    \"editUrl\": \"https://github.com/username/repo/edit/main/docs\",\n    \"showLastUpdated\": true,\n    \"showReadingTime\": true,\n    \"showAuthors\": false,\n    \"showTags\": true,\n    \"versioning\": true,\n    \"i18n\": false\n  }\n}\n```\n\n### Feature-Optionen\n\n**editUrl**\n- Link zum Bearbeiten der Seitenquelle\n- Erscheint am Ende jeder Seite\n- Verwenden Sie GitHub, GitLab oder eine beliebige Git-Hosting-URL\n- Setzen Sie `false` zum Deaktivieren\n\n**showLastUpdated**\n- Anzeigen, wann die Seite zuletzt geändert wurde\n- Verwendet Git-Commit-Zeitstempel\n- Erscheint am Ende der Seite\n\n**showReadingTime**\n- Lesezeit schätzen (Wörter pro Minute)\n- Zeigt \"5 Min. Lesezeit\" oben auf der Seite an\n\n**showAuthors**\n- Seitenautoren anzeigen\n- Erfordert Autoreninformationen im Frontmatter\n\n**showTags**\n- Tags auf Seiten anzeigen\n- Erfordert Tags im Frontmatter\n\n**versioning**\n- Dokumentationsversionierung aktivieren\n- Unterstützt mehrere Dok-Versionen (v1.0.0, v2.0.0)\n\n**i18n**\n- Internationalisierung aktivieren\n- Unterstützt mehrere Sprachen\n\n## Soziale Links (Social Links)\n\nFügen Sie Social-Media-Links zu Ihrem Header hinzu.\n\n```json\n{\n  \"social\": {\n    \"github\": \"https://github.com/username/repo\",\n    \"twitter\": \"https://twitter.com/username\",\n    \"discord\": \"https://discord.gg/invite\",\n    \"linkedin\": \"https://linkedin.com/company/name\",\n    \"youtube\": \"https://youtube.com/@channel\"\n  }\n}\n```\n\n### Benutzerdefinierte soziale Links\n\nFügen Sie Links zu Plattformen hinzu, die nicht eingebaut sind:\n\n```json\n{\n  \"social\": {\n    \"github\": \"https://github.com/username\",\n    \"custom\": [\n      {\n        \"label\": \"Slack\",\n        \"url\": \"https://slack.com/invite\",\n        \"icon\": \"slack\"\n      },\n      {\n        \"label\": \"Webseite\",\n        \"url\": \"https://example.com\",\n        \"icon\": \"globe\"\n      }\n    ]\n  }\n}\n```\n\n## Umgebungsvariablen\n\nVerwenden Sie Umgebungsvariablen in Ihrer Konfiguration und im MDX-Inhalt.\n\n### In der Konfiguration\n\n```json\n{\n  \"env\": {\n    \"API_BASE_URL\": \"https://api.example.com\",\n    \"API_VERSION\": \"v1\",\n    \"CDN_URL\": \"https://cdn.example.com\",\n    \"SUPPORT_EMAIL\": \"support@example.com\"\n  }\n}\n```\n\nZugriff in MDX:\n\n```mdx\nAPI-Endpunkt: {process.env.API_BASE_URL}\nAktuelle Version: {process.env.API_VERSION}\n```\n\n### Aus .env-Dateien\n\nWerte über Umgebungsdateien setzen:\n\n```bash\n# .env.local\nAPI_BASE_URL=https://api.example.com\nMEILISEARCH_HOST=https://search.example.com\nMEILISEARCH_API_KEY=your-key\n```\n\nReferenz in der Konfiguration:\n\n```json\n{\n  \"env\": {\n    \"API_BASE_URL\": \"${API_BASE_URL}\"\n  },\n  \"search\": {\n    \"meilisearch\": {\n      \"host\": \"${MEILISEARCH_HOST}\",\n      \"apiKey\": \"${MEILISEARCH_API_KEY}\"\n    }\n  }\n}\n```\n\n\u003cCallout type=\"warning\"\u003e\nCommitten Sie niemals sensible Schlüssel in die Versionskontrolle. Verwenden Sie Umgebungsvariablen und fügen Sie `.env.local` zu `.gitignore` hinzu.\n\u003c/Callout\u003e\n\n### Öffentliche vs. Private Variablen\n\n**Privat (nur Server):**\n```\nMEILISEARCH_API_KEY=secret-key\nDATABASE_URL=postgres://...\n```\n\n**Öffentlich (im Browser verfügbar):**\n```\nNEXT_PUBLIC_GA_ID=G-XXXXXXXXXX\nNEXT_PUBLIC_API_URL=https://api.example.com\n```\n\nPräfixen Sie mit `NEXT_PUBLIC_`, um Variablen im Browser verfügbar zu machen.\n\n## Theme-Konfiguration\n\nPassen Sie das visuelle Erscheinungsbild an.\n\n```json\n{\n  \"theme\": {\n    \"defaultMode\": \"system\",\n    \"respectPrefersColorScheme\": true,\n    \"primaryColor\": \"#3b82f6\",\n    \"customCss\": \"/custom.css\"\n  }\n}\n```\n\n**defaultMode**\n- `\"system\"` - An OS-Präferenz anpassen\n- `\"light\"` - Immer heller Modus\n- `\"dark\"` - Immer dunkler Modus\n\n**respectPrefersColorScheme**\n- OS-Farbschema-Präferenz beachten\n- Setzen Sie `false`, um OS-Einstellungen zu ignorieren\n\n**primaryColor**\n- Hauptmarkenfarbe (Hex-Code)\n- Verwendet für Links, Buttons, Akzente\n\n**customCss**\n- Pfad zur benutzerdefinierten CSS-Datei\n- Fügen Sie in den `public/`-Ordner hinzu\n\nSiehe [Anpassung](/docs/v1.0.0/customization) für einen detaillierten Theming-Leitfaden.\n\n## Vollständiges Beispiel\n\nHier ist ein vollständig konfiguriertes Specra-Setup:\n\n```json\n{\n  \"site\": {\n    \"title\": \"Acme Dokumentation\",\n    \"description\": \"Vollständige Docs für Acme Plattform\",\n    \"url\": \"https://docs.acme.com\"\n  },\n  \"theme\": {\n    \"defaultMode\": \"system\",\n    \"primaryColor\": \"#6366f1\"\n  },\n  \"navigation\": {\n    \"showSidebar\": true,\n    \"showTableOfContents\": true,\n    \"tocPosition\": \"right\",\n    \"tabGroups\": [\n      { \"id\": \"guides\", \"label\": \"Anleitungen\", \"icon\": \"book-open\" },\n      { \"id\": \"api\", \"label\": \"API\", \"icon\": \"zap\" }\n    ]\n  },\n  \"search\": {\n    \"enabled\": true,\n    \"provider\": \"meilisearch\",\n    \"meilisearch\": {\n      \"host\": \"${MEILISEARCH_HOST}\",\n      \"apiKey\": \"${MEILISEARCH_API_KEY}\",\n      \"indexName\": \"docs\"\n    }\n  },\n  \"analytics\": {\n    \"googleAnalytics\": \"G-XXXXXXXXXX\",\n    \"plausible\": \"docs.acme.com\"\n  },\n  \"social\": {\n    \"github\": \"https://github.com/acme/platform\",\n    \"twitter\": \"https://twitter.com/acme\",\n    \"discord\": \"https://discord.gg/acme\"\n  },\n  \"footer\": {\n    \"copyright\": \"© 2024 Acme Corp. Alle Rechte vorbehalten.\",\n    \"links\": [\n      {\n        \"title\": \"Produkt\",\n        \"items\": [\n          { \"label\": \"Funktionen\", \"href\": \"/features\" },\n          { \"label\": \"Preise\", \"href\": \"/pricing\" }\n        ]\n      }\n    ]\n  },\n  \"banner\": {\n    \"enabled\": true,\n    \"message\": \"📢 Version 2.0 ist jetzt verfügbar!\",\n    \"type\": \"info\",\n    \"dismissible\": true\n  },\n  \"features\": {\n    \"editUrl\": \"https://github.com/acme/platform/edit/main/docs\",\n    \"showLastUpdated\": true,\n    \"showReadingTime\": true,\n    \"showTags\": true,\n    \"versioning\": true\n  },\n  \"deployment\": {\n    \"target\": \"vercel\"\n  }\n}\n```\n\n## Nächste Schritte\n\n\u003cCardGrid cols={2}\u003e\n  \u003cCard\n    icon=\"search\"\n    title=\"Such-Setup\"\n    description=\"MeiliSearch für Ihre Docs konfigurieren\"\n    href=\"/docs/v1.0.0/search-setup\"\n  /\u003e\n  \u003cCard\n    icon=\"palette\"\n    title=\"Anpassung\"\n    description=\"Theming und Styling Ihrer Dokumentation\"\n    href=\"/docs/v1.0.0/customization\"\n  /\u003e\n  \u003cCard\n    icon=\"rocket\"\n    title=\"Bereitstellung\"\n    description=\"In Produktion bereitstellen\"\n    href=\"/docs/v1.0.0/deployment/overview\"\n  /\u003e\n  \u003cCard\n    icon=\"arrow-left\"\n    title=\"Konfigurationsübersicht\"\n    description=\"Zurück zur Konfigurationsübersicht\"\n    href=\"/docs/v1.0.0/configuration/overview\"\n  /\u003e\n\u003c/CardGrid\u003e\n"])</script><script>self.__next_f.push([1,"44:T2de6,"])</script><script>self.__next_f.push([1,"\n# Erweiterte Konfiguration\n\nÜber die Grundlagen hinaus bietet Specra leistungsstarke Funktionen wie Analytik, Suche, benutzerdefinierte Footer, Banner und Umgebungsvariablen. Dieser Leitfaden behandelt alle erweiterten Konfigurationsoptionen.\n\n## Analytik\n\nVerfolgen Sie, wie Benutzer mit Ihrer Dokumentation interagieren.\n\n### Google Analytics\n\n```json\n{\n  \"analytics\": {\n    \"googleAnalytics\": \"G-XXXXXXXXXX\"\n  }\n}\n```\n\nErhalten Sie Ihre Mess-ID von [Google Analytics](https://analytics.google.com).\n\n### Google Tag Manager\n\n```json\n{\n  \"analytics\": {\n    \"googleTagManager\": \"GTM-XXXXXXX\"\n  }\n}\n```\n\nFlexibler als Google Analytics, ermöglicht benutzerdefiniertes Tracking ohne Codeänderungen.\n\n### Plausible Analytics\n\nDatenschutzfreundliche Alternative zu Google Analytics:\n\n```json\n{\n  \"analytics\": {\n    \"plausible\": \"docs.example.com\"\n  }\n}\n```\n\nRegistrieren Sie sich unter [plausible.io](https://plausible.io).\n\n### Mehrere Analytik-Dienste\n\nVerwenden Sie mehrere Anbieter gleichzeitig:\n\n```json\n{\n  \"analytics\": {\n    \"googleAnalytics\": \"G-XXXXXXXXXX\",\n    \"plausible\": \"docs.example.com\"\n  }\n}\n```\n\n## Suchkonfiguration\n\nAktivieren Sie leistungsstarke Suche für Ihre Dokumentation.\n\n### Grundlegendes Such-Setup\n\n```json\n{\n  \"search\": {\n    \"enabled\": true,\n    \"placeholder\": \"Dokumentation durchsuchen...\",\n    \"provider\": \"meilisearch\"\n  }\n}\n```\n\n### MeiliSearch\n\nVoll funktionsfähige Suche mit Tippfehlertoleranz:\n\n```json\n{\n  \"search\": {\n    \"enabled\": true,\n    \"provider\": \"meilisearch\",\n    \"meilisearch\": {\n      \"host\": \"https://search.example.com\",\n      \"apiKey\": \"ihr-such-schluessel\",\n      \"indexName\": \"docs\"\n    }\n  }\n}\n```\n\nSiehe [Such-Setup](/docs/v1.0.0/search-setup) für die vollständige MeiliSearch-Konfiguration.\n\n### Lokale Suche\n\nEinfache Suche ohne externe Abhängigkeiten:\n\n```json\n{\n  \"search\": {\n    \"enabled\": true,\n    \"provider\": \"local\",\n    \"placeholder\": \"Suchen...\"\n  }\n}\n```\n\n**Vorteile:**\n- Keine Einrichtung erforderlich\n- Funktioniert offline\n- Kostenlos\n\n**Nachteile:**\n- Weniger leistungsstark als MeiliSearch\n- Keine Tippfehlertoleranz\n- Langsamer bei großen Seiten\n\n## Footer-Konfiguration\n\nPassen Sie Ihren Dokumentations-Footer an.\n\n### Einfacher Footer\n\n```json\n{\n  \"footer\": {\n    \"copyright\": \"© 2024 Meine Firma. Alle Rechte vorbehalten.\"\n  }\n}\n```\n\n### Vollständiger Footer\n\n```json\n{\n  \"footer\": {\n    \"copyright\": \"© 2024 Acme Corp. Alle Rechte vorbehalten.\",\n    \"customContent\": \"\u003cp\u003eBrauchen Sie Hilfe? \u003ca href='/support'\u003eKontaktieren Sie den Support\u003c/a\u003e\u003c/p\u003e\",\n    \"links\": [\n      {\n        \"title\": \"Produkt\",\n        \"items\": [\n          { \"label\": \"Funktionen\", \"href\": \"/features\" },\n          { \"label\": \"Preise\", \"href\": \"/pricing\" },\n          { \"label\": \"Änderungsprotokoll\", \"href\": \"/changelog\" }\n        ]\n      },\n      {\n        \"title\": \"Ressourcen\",\n        \"items\": [\n          { \"label\": \"Dokumentation\", \"href\": \"/docs\" },\n          { \"label\": \"API-Referenz\", \"href\": \"/api\" },\n          { \"label\": \"Beispiele\", \"href\": \"/examples\" }\n        ]\n      },\n      {\n        \"title\": \"Firma\",\n        \"items\": [\n          { \"label\": \"Über uns\", \"href\": \"/about\" },\n          { \"label\": \"Blog\", \"href\": \"/blog\" },\n          { \"label\": \"Karriere\", \"href\": \"/careers\" }\n        ]\n      }\n    ],\n    \"branding\": {\n      \"showBranding\": true,\n      \"logo\": \"/brand-logo.svg\",\n      \"title\": \"Powered by Specra\",\n      \"url\": \"https://specra.dev\"\n    }\n  }\n}\n```\n\n### Footer-Optionen\n\n**copyright**\n- Urheberrechtshinweis, der unten angezeigt wird\n- Unterstützt HTML\n\n**customContent**\n- Benutzerdefiniertes HTML, das in den Footer eingefügt wird\n- Verwenden Sie dies für zusätzliche Nachrichten oder Links\n\n**links**\n- Organisierte Link-Spalten\n- Jede Spalte hat einen Titel und Elemente\n- Elemente haben Label und href\n\n**branding**\n- Zeigt \"Powered by\"-Branding an\n- Passen Sie Logo, Titel und URL an\n- Setzen Sie `showBranding: false`, um es auszublenden\n\n## Banner-Konfiguration\n\nZeigen Sie wichtige Nachrichten oben auf Ihrer Website an.\n\n### Einfaches Banner\n\n```json\n{\n  \"banner\": {\n    \"enabled\": true,\n    \"message\": \"📢 Version 2.0 ist jetzt verfügbar!\",\n    \"type\": \"info\"\n  }\n}\n```\n\n### Banner-Optionen\n\n```json\n{\n  \"banner\": {\n    \"enabled\": true,\n    \"message\": \"⚠️ Geplante Wartung am Sonntag um 2 Uhr UTC\",\n    \"type\": \"warning\",\n    \"dismissible\": true\n  }\n}\n```\n\n**Eigenschaften:**\n\n| Eigenschaft | Typ | Beschreibung |\n|-------------|-----|--------------|\n| `enabled` | boolean | Banner anzeigen oder ausblenden |\n| `message` | string | Banner-Text (unterstützt Emojis und HTML) |\n| `type` | string | Stil: `info`, `warning`, `success`, `error` |\n| `dismissible` | boolean | Benutzern erlauben, das Banner zu schließen |\n\n### Banner-Typen\n\n**Info (blau):**\n```json\n{\n  \"banner\": {\n    \"message\": \"📢 Neue Funktion: Dark Mode ist da!\",\n    \"type\": \"info\"\n  }\n}\n```\n\n**Warnung (gelb):**\n```json\n{\n  \"banner\": {\n    \"message\": \"⚠️ API v1 wird am 1. Jan. 2025 veraltet sein\",\n    \"type\": \"warning\"\n  }\n}\n```\n\n**Erfolg (grün):**\n```json\n{\n  \"banner\": {\n    \"message\": \"✅ Alle Systeme betriebsbereit\",\n    \"type\": \"success\"\n  }\n}\n```\n\n**Fehler (rot):**\n```json\n{\n  \"banner\": {\n    \"message\": \"🚨 Kritisches Sicherheitsupdate verfügbar\",\n    \"type\": \"error\"\n  }\n}\n```\n\n## Features-Konfiguration\n\nAktivieren oder deaktivieren Sie verschiedene Dokumentationsfunktionen.\n\n```json\n{\n  \"features\": {\n    \"editUrl\": \"https://github.com/username/repo/edit/main/docs\",\n    \"showLastUpdated\": true,\n    \"showReadingTime\": true,\n    \"showAuthors\": false,\n    \"showTags\": true,\n    \"versioning\": true,\n    \"i18n\": false\n  }\n}\n```\n\n### Feature-Optionen\n\n**editUrl**\n- Link zum Bearbeiten der Seitenquelle\n- Erscheint am Ende jeder Seite\n- Verwenden Sie GitHub, GitLab oder eine beliebige Git-Hosting-URL\n- Setzen Sie `false` zum Deaktivieren\n\n**showLastUpdated**\n- Anzeigen, wann die Seite zuletzt geändert wurde\n- Verwendet Git-Commit-Zeitstempel\n- Erscheint am Ende der Seite\n\n**showReadingTime**\n- Lesezeit schätzen (Wörter pro Minute)\n- Zeigt \"5 Min. Lesezeit\" oben auf der Seite an\n\n**showAuthors**\n- Seitenautoren anzeigen\n- Erfordert Autoreninformationen im Frontmatter\n\n**showTags**\n- Tags auf Seiten anzeigen\n- Erfordert Tags im Frontmatter\n\n**versioning**\n- Dokumentationsversionierung aktivieren\n- Unterstützt mehrere Dok-Versionen (v1.0.0, v2.0.0)\n\n**i18n**\n- Internationalisierung aktivieren\n- Unterstützt mehrere Sprachen\n\n## Soziale Links (Social Links)\n\nFügen Sie Social-Media-Links zu Ihrem Header hinzu.\n\n```json\n{\n  \"social\": {\n    \"github\": \"https://github.com/username/repo\",\n    \"twitter\": \"https://twitter.com/username\",\n    \"discord\": \"https://discord.gg/invite\",\n    \"linkedin\": \"https://linkedin.com/company/name\",\n    \"youtube\": \"https://youtube.com/@channel\"\n  }\n}\n```\n\n### Benutzerdefinierte soziale Links\n\nFügen Sie Links zu Plattformen hinzu, die nicht eingebaut sind:\n\n```json\n{\n  \"social\": {\n    \"github\": \"https://github.com/username\",\n    \"custom\": [\n      {\n        \"label\": \"Slack\",\n        \"url\": \"https://slack.com/invite\",\n        \"icon\": \"slack\"\n      },\n      {\n        \"label\": \"Webseite\",\n        \"url\": \"https://example.com\",\n        \"icon\": \"globe\"\n      }\n    ]\n  }\n}\n```\n\n## Umgebungsvariablen\n\nVerwenden Sie Umgebungsvariablen in Ihrer Konfiguration und im MDX-Inhalt.\n\n### In der Konfiguration\n\n```json\n{\n  \"env\": {\n    \"API_BASE_URL\": \"https://api.example.com\",\n    \"API_VERSION\": \"v1\",\n    \"CDN_URL\": \"https://cdn.example.com\",\n    \"SUPPORT_EMAIL\": \"support@example.com\"\n  }\n}\n```\n\nZugriff in MDX:\n\n```mdx\nAPI-Endpunkt: {process.env.API_BASE_URL}\nAktuelle Version: {process.env.API_VERSION}\n```\n\n### Aus .env-Dateien\n\nWerte über Umgebungsdateien setzen:\n\n```bash\n# .env.local\nAPI_BASE_URL=https://api.example.com\nMEILISEARCH_HOST=https://search.example.com\nMEILISEARCH_API_KEY=your-key\n```\n\nReferenz in der Konfiguration:\n\n```json\n{\n  \"env\": {\n    \"API_BASE_URL\": \"${API_BASE_URL}\"\n  },\n  \"search\": {\n    \"meilisearch\": {\n      \"host\": \"${MEILISEARCH_HOST}\",\n      \"apiKey\": \"${MEILISEARCH_API_KEY}\"\n    }\n  }\n}\n```\n\n\u003cCallout type=\"warning\"\u003e\nCommitten Sie niemals sensible Schlüssel in die Versionskontrolle. Verwenden Sie Umgebungsvariablen und fügen Sie `.env.local` zu `.gitignore` hinzu.\n\u003c/Callout\u003e\n\n### Öffentliche vs. Private Variablen\n\n**Privat (nur Server):**\n```\nMEILISEARCH_API_KEY=secret-key\nDATABASE_URL=postgres://...\n```\n\n**Öffentlich (im Browser verfügbar):**\n```\nNEXT_PUBLIC_GA_ID=G-XXXXXXXXXX\nNEXT_PUBLIC_API_URL=https://api.example.com\n```\n\nPräfixen Sie mit `NEXT_PUBLIC_`, um Variablen im Browser verfügbar zu machen.\n\n## Theme-Konfiguration\n\nPassen Sie das visuelle Erscheinungsbild an.\n\n```json\n{\n  \"theme\": {\n    \"defaultMode\": \"system\",\n    \"respectPrefersColorScheme\": true,\n    \"primaryColor\": \"#3b82f6\",\n    \"customCss\": \"/custom.css\"\n  }\n}\n```\n\n**defaultMode**\n- `\"system\"` - An OS-Präferenz anpassen\n- `\"light\"` - Immer heller Modus\n- `\"dark\"` - Immer dunkler Modus\n\n**respectPrefersColorScheme**\n- OS-Farbschema-Präferenz beachten\n- Setzen Sie `false`, um OS-Einstellungen zu ignorieren\n\n**primaryColor**\n- Hauptmarkenfarbe (Hex-Code)\n- Verwendet für Links, Buttons, Akzente\n\n**customCss**\n- Pfad zur benutzerdefinierten CSS-Datei\n- Fügen Sie in den `public/`-Ordner hinzu\n\nSiehe [Anpassung](/docs/v1.0.0/customization) für einen detaillierten Theming-Leitfaden.\n\n## Vollständiges Beispiel\n\nHier ist ein vollständig konfiguriertes Specra-Setup:\n\n```json\n{\n  \"site\": {\n    \"title\": \"Acme Dokumentation\",\n    \"description\": \"Vollständige Docs für Acme Plattform\",\n    \"url\": \"https://docs.acme.com\"\n  },\n  \"theme\": {\n    \"defaultMode\": \"system\",\n    \"primaryColor\": \"#6366f1\"\n  },\n  \"navigation\": {\n    \"showSidebar\": true,\n    \"showTableOfContents\": true,\n    \"tocPosition\": \"right\",\n    \"tabGroups\": [\n      { \"id\": \"guides\", \"label\": \"Anleitungen\", \"icon\": \"book-open\" },\n      { \"id\": \"api\", \"label\": \"API\", \"icon\": \"zap\" }\n    ]\n  },\n  \"search\": {\n    \"enabled\": true,\n    \"provider\": \"meilisearch\",\n    \"meilisearch\": {\n      \"host\": \"${MEILISEARCH_HOST}\",\n      \"apiKey\": \"${MEILISEARCH_API_KEY}\",\n      \"indexName\": \"docs\"\n    }\n  },\n  \"analytics\": {\n    \"googleAnalytics\": \"G-XXXXXXXXXX\",\n    \"plausible\": \"docs.acme.com\"\n  },\n  \"social\": {\n    \"github\": \"https://github.com/acme/platform\",\n    \"twitter\": \"https://twitter.com/acme\",\n    \"discord\": \"https://discord.gg/acme\"\n  },\n  \"footer\": {\n    \"copyright\": \"© 2024 Acme Corp. Alle Rechte vorbehalten.\",\n    \"links\": [\n      {\n        \"title\": \"Produkt\",\n        \"items\": [\n          { \"label\": \"Funktionen\", \"href\": \"/features\" },\n          { \"label\": \"Preise\", \"href\": \"/pricing\" }\n        ]\n      }\n    ]\n  },\n  \"banner\": {\n    \"enabled\": true,\n    \"message\": \"📢 Version 2.0 ist jetzt verfügbar!\",\n    \"type\": \"info\",\n    \"dismissible\": true\n  },\n  \"features\": {\n    \"editUrl\": \"https://github.com/acme/platform/edit/main/docs\",\n    \"showLastUpdated\": true,\n    \"showReadingTime\": true,\n    \"showTags\": true,\n    \"versioning\": true\n  },\n  \"deployment\": {\n    \"target\": \"vercel\"\n  }\n}\n```\n\n## Nächste Schritte\n\n\u003cCardGrid cols={2}\u003e\n  \u003cCard\n    icon=\"search\"\n    title=\"Such-Setup\"\n    description=\"MeiliSearch für Ihre Docs konfigurieren\"\n    href=\"/docs/v1.0.0/search-setup\"\n  /\u003e\n  \u003cCard\n    icon=\"palette\"\n    title=\"Anpassung\"\n    description=\"Theming und Styling Ihrer Dokumentation\"\n    href=\"/docs/v1.0.0/customization\"\n  /\u003e\n  \u003cCard\n    icon=\"rocket\"\n    title=\"Bereitstellung\"\n    description=\"In Produktion bereitstellen\"\n    href=\"/docs/v1.0.0/deployment/overview\"\n  /\u003e\n  \u003cCard\n    icon=\"arrow-left\"\n    title=\"Konfigurationsübersicht\"\n    description=\"Zurück zur Konfigurationsübersicht\"\n    href=\"/docs/v1.0.0/configuration/overview\"\n  /\u003e\n\u003c/CardGrid\u003e\n"])</script><script>self.__next_f.push([1,"45:T11b3,"])</script><script>self.__next_f.push([1,"\n# Theming \u0026 Anpassung\n\nMachen Sie Specra zu Ihrem eigenen. Dieser Leitfaden deckt alles ab, von einfachen Farbänderungen bis hin zu komplett benutzerdefiniertem Styling.\n\n## Schnelle Anpassung\n\nDer schnellste Weg, Ihre Dokumente anzupassen, ist über die `specra.config.json`.\n\n### Markenfarben\n\nSetzen Sie Ihre Primärfarbe passend zu Ihrer Marke:\n\n```json\n{\n  \"theme\": {\n    \"primaryColor\": \"#3b82f6\"\n  }\n}\n```\n\nSpecra generiert automatisch alle Farbvariationen (Hover-Zustände, Fokusringe usw.) aus diesem einzigen Wert.\n\n### Dark Mode Einstellungen\n\nSteuern Sie, wie der Dark Mode funktioniert:\n\n```json\n{\n  \"theme\": {\n    \"defaultMode\": \"system\",\n    \"respectPrefersColorScheme\": true\n  }\n}\n```\n\n**Optionen für `defaultMode`:**\n- `\"system\"` - Bevorzugung des Betriebssystems respektieren (empfohlen)\n- `\"light\"` - Immer im hellen Modus starten\n- `\"dark\"` - Immer im dunklen Modus starten\n\nSetzen Sie `respectPrefersColorScheme` auf `false`, um OS-Einstellungen zu ignorieren und nur Ihren Standard zu verwenden.\n\n### Logos\n\nFügen Sie Ihr Logo für helle und dunkle Modi hinzu:\n\n```json\n{\n  \"site\": {\n    \"logo\": {\n      \"light\": \"/logo-light.svg\",\n      \"dark\": \"/logo-dark.svg\"\n    }\n  }\n}\n```\n\nOder verwenden Sie ein einzelnes Logo für beide:\n\n```json\n{\n  \"site\": {\n    \"logo\": \"/logo.svg\"\n  }\n}\n```\n\nPlatzieren Sie Logo-Dateien im `public/`-Verzeichnis.\n\n## Benutzerdefiniertes CSS\n\nFür tiefergehende Anpassungen fügen Sie benutzerdefiniertes CSS hinzu.\n\n### Methode 1: Benutzerdefinierte CSS-Datei\n\nErstellen Sie eine CSS-Datei und referenzieren Sie sie in der Konfiguration:\n\n**1. Erstellen Sie `/public/custom.css`:**\n\n```css\n:root {\n  --font-heading: 'Inter', system-ui, sans-serif;\n  --border-radius: 12px;\n}\n\n.doc-content h1 {\n  font-size: 3rem;\n  color: var(--color-primary);\n}\n\n.sidebar {\n  background: linear-gradient(to bottom, #f8f9fa, #ffffff);\n}\n```\n\n**2. Referenzieren Sie in der Konfiguration ist:**\n\n```json\n{\n  \"theme\": {\n    \"customCss\": \"/custom.css\"\n  }\n}\n```\n\n### Methode 2: Globale Stile\n\nBearbeiten Sie `app/globals.css` direkt für mehr Kontrolle:\n\n```css\n@tailwind base;\n@tailwind components;\n@tailwind utilities;\n\n@layer base {\n  :root {\n    /* Ihre benutzerdefinierten Eigenschaften */\n    --radius: 0.75rem;\n  }\n}\n\n@layer components {\n  /* Ihre benutzerdefinierten Komponentenstile */\n  .custom-card {\n    @apply rounded-lg border border-gray-200 p-4;\n  }\n}\n```\n\n## CSS-Variablen Referenz\n\nSpecra verwendet CSS-Variablen für das Theming. Überschreiben Sie diese, um das Aussehen anzupassen:\n\n### Farben\n\n```css\n:root {\n  /* Primäre Markenfarbe */\n  --color-primary: #3b82f6;\n  --color-primary-hover: #2563eb;\n  --color-primary-light: #dbeafe;\n\n  /* Hintergrundfarben */\n  --color-bg: #ffffff;\n  --color-bg-secondary: #f9fafb;\n  --color-bg-tertiary: #f3f4f6;\n\n  /* Textfarben */\n  --color-text: #111827;\n  --color-text-secondary: #6b7280;\n  --color-text-tertiary: #9ca3af;\n\n  /* Rahmenfarben */\n  --color-border: #e5e7eb;\n  --color-border-hover: #d1d5db;\n\n  /* Codeblock-Farben */\n  --color-code-bg: #f3f4f6;\n  --color-code-text: #1f2937;\n}\n```\n\n### Typografie\n\n```css\n:root {\n  /* Schriftfamilien */\n  --font-sans: system-ui, -apple-system, sans-serif;\n  --font-mono: 'JetBrains Mono', 'Fira Code', monospace;\n  --font-heading: var(--font-sans);\n\n  /* Schriftgrößen */\n  --text-xs: 0.75rem;\n  --text-sm: 0.875rem;\n  --text-base: 1rem;\n}\n```\n\n### Abstände\n\n```css\n:root {\n  /* Border Radius */\n  --radius-sm: 0.25rem;\n  --radius: 0.5rem;\n  --radius-md: 0.75rem;\n  --radius-lg: 1rem;\n  --radius-xl: 1.5rem;\n}\n```\n\n## Benutzerdefinierte Schriftarten\n\n### Verwendung von Google Fonts\n\n**1. Schriftart zu Ihrem Layout hinzufügen:**\n\n```tsx\n// app/layout.tsx\nimport { Inter, JetBrains_Mono } from 'next/font/google'\n\nconst inter = Inter({ subsets: ['latin'] })\nconst jetbrainsMono = JetBrains_Mono({ subsets: ['latin'] })\n\nexport default function RootLayout({ children }) {\n  return (\n    \u003chtml lang=\"en\" className={`${inter.className}`}\u003e\n      \u003cbody\u003e{children}\u003c/body\u003e\n    \u003c/html\u003e\n  )\n}\n```\n\n**2. CSS-Variablen aktualisieren:**\n\n```css\n:root {\n  --font-sans: 'Inter', system-ui, sans-serif;\n  --font-mono: 'JetBrains Mono', monospace;\n}\n```\n\n### Verwendung lokaler Schriftarten\n\nPlatzieren Sie Schriftdateien in `public/fonts/` und laden Sie sie:\n\n```css\n@font-face {\n  font-family: 'CustomFont';\n  src: url('/fonts/custom-font.woff2') format('woff2');\n  font-weight: 400;\n  font-style: normal;\n  font-display: swap;\n}\n\n:root {\n  --font-sans: 'CustomFont', system-ui, sans-serif;\n}\n```\n"])</script><script>self.__next_f.push([1,"46:T11b3,"])</script><script>self.__next_f.push([1,"\n# Theming \u0026 Anpassung\n\nMachen Sie Specra zu Ihrem eigenen. Dieser Leitfaden deckt alles ab, von einfachen Farbänderungen bis hin zu komplett benutzerdefiniertem Styling.\n\n## Schnelle Anpassung\n\nDer schnellste Weg, Ihre Dokumente anzupassen, ist über die `specra.config.json`.\n\n### Markenfarben\n\nSetzen Sie Ihre Primärfarbe passend zu Ihrer Marke:\n\n```json\n{\n  \"theme\": {\n    \"primaryColor\": \"#3b82f6\"\n  }\n}\n```\n\nSpecra generiert automatisch alle Farbvariationen (Hover-Zustände, Fokusringe usw.) aus diesem einzigen Wert.\n\n### Dark Mode Einstellungen\n\nSteuern Sie, wie der Dark Mode funktioniert:\n\n```json\n{\n  \"theme\": {\n    \"defaultMode\": \"system\",\n    \"respectPrefersColorScheme\": true\n  }\n}\n```\n\n**Optionen für `defaultMode`:**\n- `\"system\"` - Bevorzugung des Betriebssystems respektieren (empfohlen)\n- `\"light\"` - Immer im hellen Modus starten\n- `\"dark\"` - Immer im dunklen Modus starten\n\nSetzen Sie `respectPrefersColorScheme` auf `false`, um OS-Einstellu p\"\u003e\nSpalten stapeln sich automatisch auf Mobilgeräten. Die `sm`, `md`, `lg` und `xl` Breakpoints ermöglichen es Ihnen zu steuern, wie Inhalte bei verschiedenen Bildschirmgrößen umfließen.\n\u003c/Callout\u003e\n"])</script><script>self.__next_f.push([1,"4d:T1500,"])</script><script>self.__next_f.push([1,"\n## Caching-System\n\n### In-Memory Caching\n\nDas System verwendet eine intelligente Caching-Schicht für teure Dateisystemoperationen:\n\n- **Versionslisten-Caching**: Gecached für 5 Sekunden in Dev, 60 Sekunden in Produktion\n- **Dokumentlisten-Caching**: Pro-Version-Caching mit automatischer Invalidierung\n- **Einzel-Dokument-Caching**: Geschlüsselt nach Version und Slug\n\nDer Cache wird automatisch invalidiert, wenn sich MDX- oder Konfigurationsdateien im Entwicklungsmodus ändern.\n\n### Cache-Statistiken\n\nIm Entwicklungsmodus werden Cache-Operationen in der Konsole protokolliert:\n\n```\n✅ [Cache] hit: getAllDocs:v1.0.0\n❌ [Cache] miss: getDocBySlug:v1.0.0:configuration\n⏱️  getDocBySlug(configuration): 45.23ms\n```\n\n## Hot Reload\n\n### Echtzeit-Updates\n\nDas System überwacht Ihr `docs/`-Verzeichnis auf Änderungen und aktualisiert die Seite automatisch, wenn Sie speichern:\n\n- Überwacht `.mdx`-Dateien auf Inhaltsänderungen\n- Überwacht `_category_.json`-Dateien auf Navigations-Updates\n- Verwendet Server-Sent Events (SSE) für effiziente Kommunikation\n- Nur im Entwicklungsmodus aktiv\n\n### Wie es funktioniert\n\n1. Datei-Watcher überwacht das `docs/`-Verzeichnis rekursiv\n2. Wenn sich eine Datei ändert, sendet die API ein Ereignis an den Browser\n3. Der Browser löst eine weiche Aktualisierung aus, um den Inhalt neu zu laden\n4. Cache wird für betroffene Dateien invalidiert\n\n## Statische Generierung\n\n### Optimierter Build-Prozess\n\nDer Build-Prozess verwendet zwischengespeicherte Daten, um `generateStaticParams` zu beschleunigen:\n\n```typescript\nexport async function generateStaticParams() {\n  const versions = getCachedVersions()  // Gecached\n  const params = []\n\n  for (const version of versions) {\n    const docs = await getCachedAllDocs(version)  // Gecached\n    for (const doc of docs) {\n      params.push({\n        version,\n        slug: doc.slug.split(\"/\").filter(Boolean),\n      })\n    }\n  }\n\n  return params\n}\n```\n\n### Leistungstipps\n\nFür große Dokumentationsseiten (1000+ Dateien):\n\n1. **Ordnerorganisation verwenden**: Organisieren Sie Dokumente in logische Ordner, um die Cache-Lokalität zu verbessern\n2. **Entwurfsmodus aktivieren**: Markieren Sie unvollständige Dokumente mit `draft: true`, um sie von Produktions-Builds auszuschließen\n3. **Bilder optimieren**: Verwenden Sie Next.js Image-Optimierung für Screenshots und Diagramme\n4. **Build-Zeiten überwachen**: Beobachten Sie die Leistungsprotokolle während der Entwicklung\n\n## Entwicklungsmodus-Funktionen\n\n### Leistungsprotokollierung\n\nWenn Sie `npm run dev` ausführen, sehen Sie detaillierte Leistungsmetriken:\n\n```\n⏱️  getAllDocs(v1.0.0): 234.56ms\n⏱️  getDocBySlug(getting-started): 12.34ms\n💾 Memory Usage: { rss: '156MB', heapTotal: '89MB', heapUsed: '67MB' }\n```\n\n### Debug-Dienstprogramme\n\nDas System enthält hilfreiche Debugging-Tools (nur Dev-Modus):\n\n- **PerfTimer**: Dauer von Operationen messen\n- **logCacheOperation**: Cache-Treffer/Fehlschläge verfolgen\n- **logMemoryUsage**: Speichernutzung überwachen\n- **debugLog**: Komplexe Objekte schön drucken\n\n## Produktionsoptimierungen\n\n### Statische Seitenerstellung (SSG)\n\nAlle Dokumentationsseiten werden zur Build-Zeit vorgerendert:\n\n- Null Server-Side Rendering Overhead\n- Sofortige Seitenladezeiten\n- Exzellente SEO-Leistung\n- CDN-freundliche statische Assets\n\n### Bundle-Optimierung\n\n- Server-Komponenten standardmäßig (minimales JavaScript)\n- Client-Komponenten nur wo nötig (Tabs, Theme-Switcher)\n- Automatisches Code-Splitting pro Route\n- Tree-Shaking von ungenutzten Abhängigkeiten\n\n## Leistung überwachen\n\n### Build-Analyse\n\nÜberwachen Sie Ihre Build-Ausgabe auf Leistungserkenntnisse:\n\n```bash\nnpm run build\n```\n\nAchten Sie auf:\n- Generierungszeit statischer Seiten\n- Anzahl generierter Seiten\n- Warnungen zur Bundle-Größe\n\n### Entwicklungsmetriken\n\nBeobachten Sie während der Entwicklung die Konsole auf:\n- Cache-Treffer/Fehlschlag-Verhältnisse (sollten sich mit der Zeit verbessern)\n- Dateioparationszeiten (langsame Operationen identifizieren)\n- Speichernutzungsmuster (Speicherlecks erkennen)\n\n## Best Practices\n\n1. **Dateien organisiert halten**: Logische Ordnerstruktur verbessert Caching\n2. **Frontmatter weise nutzen**: Nur notwendige Metadaten hinzufügen\n3. **Inhalte optimieren**: Große Dateien (\u003e1MB) sollten aufgeteilt werden\n4. **Cache überwachen**: Hohe Fehlraten weisen auf Caching-Probleme hin\n5. **Saubere Builds**: Gelegentlich `.next/` für frische Builds löschen\n\n## Fehlerbehebung\n\n### Langsame Build-Zeiten\n\nWenn Builds langsam sind:\n\n1. Prüfen Sie auf extrem große MDX-Dateien (\u003e5MB)\n2. Reduzieren Sie die Anzahl der gleichzeitig generierten Seiten\n3. Cache leeren: `.next/` und `node_modules/.cache/` löschen\n4. Abhängigkeiten auf neueste Versionen aktualisieren\n\n### Hot Reload funktioniert nicht\n\nWenn Änderungen nicht reflektiert werden:\n\n1. Prüfen Sie, ob Sie im Entwicklungsmodus sind (`npm run dev`)\n2. Suchen Sie nach Fehlern in der Browser-Konsole\n3. Überprüfen Sie, ob der `/api/mdx-watch` Endpunkt antwortet\n4. Hard Refresh des Browsers (Cmd+Shift+R oder Ctrl+Shift+R)\n\n### Speicherprobleme\n\nBei hoher Speichernutzung:\n\n1. Prüfen Sie auf Zirkelbezüge in der Dokumentation\n2. Überwachen Sie die Cache-Größe mit `getCacheStats()`\n3. Reduzieren Sie `CACHE_TTL` in `lib/mdx-cache.ts`\n4. Leeren Sie Caches manuell mit `clearAllCaches()`\n"])</script><script>self.__next_f.push([1,"4e:T1500,"])</script><script>self.__next_f.push([1,"\n## Caching-System\n\n### In-Memory Caching\n\nDas System verwendet eine intelligente Caching-Schicht für cVideo \n  src=\"/videos/demo.mp4\"\n  caption=\"Produktdemo\"\n  controls\n  poster=\"/videos/poster.jpg\"\n/\u003e\n```\n\n## Live-Beispiele\n\n### YouTube Embed\n\n\u003cVideo \n  src=\"https://youtu.be/puRFmqfVlLk\"\n  caption=\"YouTube Video-Embed Beispiel\"\n  muted\n  autoplay\n/\u003e\n\n## Props\n\n| Prop | Typ | Standard | Beschreibung |\n|------|-----|----------|--------------|\n| `src` | `string` | erforderlich | Video-URL (YouTube, Vimeo oder lokaler Pfad) |\n| `caption` | `string` | - | Bildunterschrift unter dem Video |\n| `autoplay` | `boolean` | `false` | Automatische Wiedergabe beim Laden |\n| `loop` | `boolean` | `false` | Video-Wiedergabe in Schleife |\n| `muted` | `boolean` | `false` | Video-Audio stummschalten |\n| `controls` | `boolean` | `true` | Video-Steuerelemente anzeigen |\n| `poster` | `string` | - | Vorschaubild-URL (nur lokale Videos) |\n\n## Unterstützte Plattformen\n\n### YouTube\n\nUnterstützt verschiedene YouTube-URL-Formate:\n- `https://www.youtube.com/watch?v=VIDEO_ID`\n- `https://youtu.be/VIDEO_ID`\n\n### Vimeo\n\nUnterstützt Vimeo-URLs:\n- `https://vimeo.com/VIDEO_ID`\n\n### Lokale Dateien\n\nUnterstützt Standard-Videoformate:\n- MP4 (`.mp4`)\n- WebM (`.webm`)\n- Ogg (`.ogg`)\n\n## Tipps\n\n\u003cCallout type=\"warning\"\u003e\nAutoplay wird oft von Browsern blockiert, es sei denn, das Video ist auch stummgeschaltet. Für automatisch abspielende Videos verwenden Sie sowohl `autoplay` als auch `muted`:\n\n```mdx\n\u003cVideo src=\"/videos/animation.mp4\" autoplay muted loop /\u003e\n```\n\u003c/Callout\u003e\n\n\u003cCallout type=\"tip\"\u003e\nVerwenden Sie die `poster` Prop für lokale Videos, um ein Vorschaubild anzuzeigen, bevor das Video geladen wird.\n\u003c/Callout\u003e\n"])</script><script>self.__next_f.push([1,"62:T756,"])</script><script>self.__next_f.push([1,"\nDie Video-Komponente bindet Videos von lokalen Dateien oder beliebten Plattformen wie YouTube und Vimeo ein.\n\n## Verwendung\n\n### YouTube Video\n\n```mdx\n\  ermöglichen es Ihnen, Ihre Dokumentation in verschiedene Bereiche zu organisieren, die über Tabs oben auf Ihren Dokumentationsseiten zugänglich sind. Dies ist besonders nützlich, um verschiedene Arten von Inhalten wie SDK-Docs, API-Referenzen und Anleitungen zu trennen.\n\n## Übersicht\n\nTab-Gruppen bieten eine sticky Navigationsleiste, die:\n- Sich unter dem Header befindet\n- Seitenleisteninhalte basierend auf dem aktiven Tab filtert\n- Über die Seitennavigation hinweg bestehen bleibt\n- Icons von Lucide React unterstützt\n- Die automatisch generierte Seitenleistenstruktur beibehält\n\n## Konfiguration\n\nDefinieren Sie Tab-Gruppen in Ihrer `specra.config.json`:\n\n```json\n{\n  \"navigation\": {\n    \"tabGroups\": [\n      {\n        \"id\": \"sdk\",\n        \"label\": \"SDK Dokumentation\",\n        \"icon\": \"code\"\n      },\n      {\n        \"id\": \"api\",\n        \"label\": \"API Referenz\",\n        \"icon\": \"zap\"\n      },\n      {\n        \"id\": \"guides\",\n        \"label\": \"Anleitungen\",\n        \"icon\": \"book-open\"\n      }\n    ]\n  }\n}\n```\n\n### Tab-Gruppen-Eigenschaften\n\n| Eigenschaft | Typ | Erforderlich | Beschreibung |\n|-------------|-----|--------------|--------------|\n| `id` | string | Ja | Eindeutiger Bezeichner für die Tab-Gruppe |\n| `label` | string | Ja | Anzeigetext für den Tab |\n| `icon` | string | Nein | Lucide-Icon-Name (z.B. \"code\", \"zap\", \"book-open\") |\n\n## Inhalte zu Tabs zuweisen\n\nEs gibt zwei Möglichkeiten, Inhalte Tab-Gruppen zuzuweisen:\n\n### 1. Zuweisung auf Dateiebene\n\nFügen Sie `tab_group` zum Frontmatter Ihrer MDX-Dateien hinzu:\n\n```mdx\n---\ntitle: Erste Schritte\ndescription: Schnellstartanleitung\ntab_group: guides\n---\n\n# Erste Schritte\n\nIhr Inhalt hier...\n```\n\n### 2. Zuweisung auf Ordnerebene\n\nFügen Sie `tab_group` zu Ihrer `_category_.json`-Datei hinzu, um alle Dateien in diesem Ordner zuzuweisen:\n\n```json\n{\n  \"label\": \"Komponenten\",\n  \"position\": 2,\n  \"collapsible\": true,\n  \"collapsed\": false,\n  \"icon\": \"grid\",\n  \"tab_group\": \"sdk\"\n}\n```\n\nAlle Dateien in diesem Ordner erben automatisch die `sdk` Tab-Gruppe.\n\n## Verhalten und Regeln\n\n### Standard-Tab-Zuweisung\n\nDateien ohne angegebene `tab_group` erscheinen automatisch in der **ersten Tab-Gruppe**, die in Ihrer Konfiguration definiert ist.\n\n### Priorität\n\n`tab_group` auf Dateiebene im Frontmatter hat Vorrang vor der Zuweisung auf Ordnerebene aus `_category_.json`.\n\n### Tab-Persistenz\n\nDer aktive Tab bleibt bestehen, wenn:\n- Zwischen Seiten innerhalb derselben Tab-Gruppe navigiert wird\n- Tabs manuell gewechselt werden\n- Links zu Seiten in verschiedenen Tab-Gruppen angeklickt werden (Tab wechselt automatisch)\n\n### Initiale Tab-Auswahl\n\nWenn Sie auf einer Seite landen:\n- Der Tab wechselt automatisch passend zur Gruppe der Seite\n- Beim Neuladen der Seite spiegelt der Tab die Gruppe der aktuellen Seite wider\n- Manuelle Tab-Auswahl bleibt erhalten, wenn innerhalb derselben Gruppe navigiert wird\n\n## Best Practices\n\n### 1. Logische Gruppierung\n\nGruppieren Sie verwandte Inhalte zusammen:\n- **SDK/Bibliotheks-Docs**: Installation, Konfiguration, API-Referenz\n- **API-Docs**: REST-Endpunkte, GraphQL-Schemas, Webhooks\n- **Anleitungen**: Tutorials, How-tos, Best Practices\n\n### 2. Konsistente Benennung\n\nVerwenden Sie klare, prägnante Labels:\n- ✅ \"SDK Dokumentation\", \"API Referenz\", \"Anleitungen\"\n- ❌ \"Docs1\", \"Abschnitt A\", \"Sonstiges\"\n\n### 3. Aussagekräftige Icons\n\nWählen Sie Icons, die den Inhalt repräsentieren:\n- `code` für SDK/Bibliotheksdokumentation\n- `zap` für API-Referenzen\n- `book-open` für Anleitungen und Tutorials\n- `rocket` für Erste-Schritte-Inhalte\n\n### 4. Tab-Anzahl begrenzen\n\nHalten Sie die Anzahl der Tabs überschaubar:\n- **Empfohlen**: 2-4 Tabs\n- **Maximum**: 5-6 Tabs\n- Zu viele Tabs können Benutzer überfordern\n\n## Beispiele\n\n### Beispiel 1: Einfache SDK + API Aufteilung\n\n```json\n{\n  \"navigation\": {\n    \"tabGroups\": [\n      {\n        \"id\": \"sdk\",\n        \"label\": \"SDK\",\n        \"icon\": \"code\"\n      },\n      {\n        \"id\": \"api\",\n        \"label\": \"API\",\n        \"icon\": \"zap\"\n      }\n    ]\n  }\n}\n```\n\n### Beispiel 2: Umfassende Dokumentation\n\n```json\n{\n  \"navigation\": {\n    \"tabGroups\": [\n      {\n        \"id\": \"getting-started\",\n        \"label\": \"Erste Schritte\",\n        \"icon\": \"rocket\"\n      },\n      {\n        \"id\": \"sdk\",\n        \"label\": \"SDK Referenz\",\n        \"icon\": \"code\"\n      },\n      {\n        \"id\": \"api\",\n        \"label\": \"API Referenz\",\n        \"icon\": \"server\"\n      },\n      {\n        \"id\": \"guides\",\n        \"label\": \"Anleitungen\",\n        \"icon\": \"book-open\"\n      }\n    ]\n  }\n}\n```\n\n## Erweiterte Nutzung\n\n### Verschachtelte Ordner\n\nTab-Gruppen funktionieren nahtlos mit verschachtelten Ordnerstrukturen:\n\n```txt\ndocs/v1.0.0/\n├── components/              # tab_group: sdk\n│   ├── _category_.json\n│   ├── button.mdx\n│   └── input.mdx\n├── api/                     # tab_group: api\n│   ├── _category_.json\n│   ├── authentication.mdx\n│   └── endpoints.mdx\n└── guides/                  # tab_group: guides\n    ├── _category_.json\n    └── quickstart.mdx       # Kann mit Dateiebene tab_group überschreiben\n```\n\n### Gemischte Tab-Gruppen im selben Ordner\n\nSie können Dateien im selben Ordner haben, die zu verschiedenen Tabs gehören:\n\n```txt\ndocs/v1.0.0/\n├── _category_.json          # Standard: tab_group: sdk\n├── overview.mdx             # Erbt: sdk\n├── api-overview.mdx         # Override: tab_group: api\n└── tutorial.mdx             # Override: tab_group: guides\n```\n\n## Fehlerbehebung\n\n### Tab wird nicht angezeigt\n\n**Problem**: Tab-Gruppe definiert, aber nicht sichtbar\n\n**Lösungen**:\n- Stellen Sie sicher, dass mindestens eine Datei dieser Tab-Gruppe zugewiesen ist\n- Überprüfen Sie, ob die Tab-Gruppen-`id` in Konfiguration und Frontmatter exakt übereinstimmt\n- Verifizieren Sie, dass `navigation.tabGroups` in `specra.config.json` definiert ist\n\n### Inhalt erscheint im falschen Tab\n\n**Problem**: Seite erscheint unter falschem Tab\n\n**Lösungen**:\n- Überprüfen Sie das Frontmatter auf Dateiebene auf `tab_group` Override\n- Verifizieren Sie, dass `_category_.json` auf Ordnerebene die korrekte `tab_group` hat\n- Denken Sie daran: Frontmatter hat Vorrang vor `_category_.json`\n\n### Tab bleibt nicht bestehen\n\n**Problem**: Tab wird beim Navigieren zurückgesetzt\n\n**Lösungen**:\n- Dies ist das erwartete Verhalten, wenn zu einer Seite in einer anderen Tab-Gruppe navigiert wird\n- Der Tab wechselt automatisch passend zur Gruppe der aktuellen Seite\n- Manuelle Auswahl bleibt nur bestehen, wenn innerhalb derselben Tab-Gruppe navigiert wird\n"])</script><script>self.__next_f.push([1,"64:T19df,"])</script><script>self.__next_f.push([1,"\nTab-Gruppen ermöglichen es Ihnen, Ihre Dokumentation in verschiedene Bereiche zu organisieren, die über Tabs oben auf Ihren Dokumentationsseiten zugänglich sind. Dies ist besonders nützlich, um verschiedene Arten von Inhalten wie SDK-Docs, API-Referenzen und Anleitungen zu trennen.\n\n## Übersicht\n\nTab-Gruppen bieten eine sticky Navigationsleiste, die:\n- Sich unter dem Header befindet\n- Seitenleisteninhalte basierend auf dem aktiven Tab filtert\n- Über die Seitennavigation hinweg bestehen bleibt\n- Icons von Lucide React unterstützt\n- Die automatisch generierte Seitenleistenstruktur beibehält\n\n## Konfiguration\n\nDefinieren Sie Tab-Gruppen in Ihrer `specra.config.json`:\n\n```json\n{\n  \"navigation\": {\n    \"tabGroups\": [\n      {\n        \"id\": \"sdk\",\n        \"label\": \"SDK Dokumentation\",\n        \"icon\": \"code\"\n      },\n      {\n        \"id\": \"api\",\n        \"label\": \"API Referenz\",\n        \"icon\": \"zap\"\n      },\n      {\n        \"id\": \"guides\",\n        \"label\": derselben Gruppe navigiert wird\n\n## Best Practices\n\n### 1. Logische Gruppierung\n\nGruppieren Sie verwandte Inhalte zusammen:\n- **SDK/Bibliotheks-Docs**: Installation, Konfiguration, API-Referenz\n- **API-Docs**: REST-Endpunkte, GraphQL-Schemas, Webhooks\n- **Anleitungen**: Tutorials, How-tos, Best Practices\n\n### 2. Konsistente Benennung\n\nVerwenden Sie klare, prägnante Labels:\n- ✅ \"SDK Dokumentation\", \"API Referenz\", \"Anleitungen\"\n- ❌ \"Docs1\", \"Abschnitt A\", \"Sonstiges\"\n\n### 3. Aussagekräftige Icons\n\nWählen Sie Icons, die den Inhalt repräsentieren:\n- `code` für SDK/Bibliotheksdokumentation\n- `zap` für API-Referenzen\n- `book-open` für Anleitungen und Tutorials\n- `rocket` für Erste-Schritte-Inhalte\n\n### 4. Tab-Anzahl begrenzen\n\nHalten Sie die Anzahl der Tabs überschaubar:\n- **Empfohlen**: 2-4 Tabs\n- **Maximum**: 5-6 Tabs\n- Zu viele Tabs können Benutzer überfordern\n\n## Beispiele\n\n### Beispiel 1: Einfache SDK + API Aufteilung\n\n```json\n{\n  \"navigation\": {\n    \"tabGroups\": [\n      {\n        \"id\": \"sdk\",\n        \"label\": \"SDK\",\n        \"icon\": \"code\"\n      },\n      {\n        \"id\": \"api\",\n        \"label\": \"API\",\n        \"icon\": \"zap\"\n      }\n    ]\n  }\n}\n```\n\n### Beispiel 2: Umfassende Dokumentation\n\n```json\n{\n  \"navigation\": {\n    \"tabGroups\": [\n      {\n        \"id\": \"getting-started\",\n        \"label\": \"Erste Schritte\",\n        \"icon\": \"rocket\"\n      },\n      {\n        \"id\": \"sdk\",\n        \"label\": \"SDK Referenz\",\n        \"icon\": \"code\"\n      },\n      {\n        \"id\": \"api\",\n        \"label\": \"API Referenz\",\n        \"icon\": \"server\"\n      },\n      {\n        \"id\": \"guides\",\n        \"label\": \"Anleitungen\",\n        \"icon\": \"book-open\"\n      }\n    ]\n  }\n}\n```\n\n## Erweiterte Nutzung\n\n### Verschachtelte Ordner\n\nTab-Gruppen funktionieren nahtlos mit verschachtelten Ordnerstrukturen:\n\n```txt\ndocs/v1.0.0/\n├── components/              # tab_group: sdk\n│   ├── _category_.json\n│   ├── button.mdx\n│   └── input.mdx\n├── api/                     # tab_group: api\n│   ├── _category_.json\n│   ├── authentication.mdx\n│   └── endpoints.mdx\n└── guides/                  # tab_group: guides\n    ├── _category_.json\n    └── quickstart.mdx       # Kann mit Dateiebene tab_group überschreiben\n```\n\n### Gemischte Tab-Gruppen im selben Ordner\n\nSie können Dateien im selben Ordner haben, die zu verschiedenen Tabs gehören:\n\n```txt\ndocs/v1.0.0/\n├── _category_.json          # Standard: tab_group: sdk\n├── overview.mdx             # Erbt: sdk\n├── api-overview.mdx         # Override: tab_group: api\n└── tutorial.mdx             # Override: tab_group: guides\n```\n\n## Fehlerbehebung\n\n### Tab wird nicht angezeigt\n\n**Problem**: Tab-Gruppe definiert, aber nicht sichtbar\n\n**Lösungen**:\n- Stellen Sie sicher, dass mindestens eine Datei dieser Tab-Gruppe zugewiesen ist\n- Überprüfen Sie, ob die Tab-Gruppen-`id` in Konfiguration und Frontmatter exakt übereinstimmt\n- Verifizieren Sie, dass `navigation.tabGroups` in `specra.config.json` definiert ist\n\n### Inhalt erscheint im falschen Tab\n\n**Problem**: Seite erscheint unter falschem Tab\n\n**Lösungen**:\n- Überprüfen Sie das Frontmatter auf Dateiebene auf `tab_group` Override\n- Verifizieren Sie, dass `_category_.json` auf Ordnerebene die korrekte `tab_group` hat\n- Denken Sie daran: Frontmatter hat Vorrang vor `_category_.json`\n\n### Tab bleibt nicht bestehen\n\n**Problem**: Tab wird beim Navigieren zurückgesetzt\n\n**Lösungen**:\n- Dies ist das erwartete Verhalten, wenn zu einer Seite in einer anderen Tab-Gruppe navigiert wird\n- Der Tab wechselt automatisch passend zur Gruppe der aktuellen Seite\n- Manuelle Auswahl bleibt nur bestehen, wenn innerhalb derselben Tab-Gruppe navigiert wird\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$9\",null,{\"fallback\":[\"$\",\"$L12\",null,{}],\"children\":[[\"$\",\"$L13\",null,
