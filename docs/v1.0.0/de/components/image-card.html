Pages bereitstellen\n\nGitHub Pages bietet kostenloses Hosting für statische Websites und ist damit perfekt für Open-Source-Dokumentation geeignet. Stellen Sie direkt aus Ihrem Repository mit GitHub Actions bereit.\n\n## Warum GitHub Pages?\n\n- **Kostenloses Hosting** - Keine Kosten für öffentliche Repositories\n- **Benutzerdefinierte Domains** - Verwenden Sie Ihre eigene Domain\n- **HTTPS inklusive** - Automatische SSL-Zertifikate\n- **Git-basiert** - Bereitstellung aus Ihrem Repository\n- **Versionskontrolle** - Vollständige Historie Ihrer Docs\n- **Community-Vertrauen** - Vertraute Plattform für Entwickler\n\n## Voraussetzungen\n\n- GitHub-Repository (öffentlich oder privat)\n- Specra-Dokumentationsprojekt\n- Git lokal installiert\n\n## Konfiguration\n\nKonfigurieren Sie Specra zunächst für den statischen Export.\n\n### Ohne benutzerdefinierte Domain\n\nFür URLs wie `username.github.io/repo-name`:\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"github-pages\",\n    \"basePath\": \"repo-name\",\n    \"customDomain\": false\n  }\n}\n```\n\n\u003cCallout type=\"warning\" title=\"Wichtig\"\u003e\nDer `basePath` muss exakt mit Ihrem Repository-Namen übereinstimmen. GitHub Pages stellt von `username.github.io/repo-name` bereit, daher benötigen alle Assets dieses Präfix.\n\u003c/Callout\u003e\n\n### Mit benutzerdefinierter Domain\n\nFür benutzerdefinierte Domains wie `docs.example.com`:\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"custom-domain-static\",\n    \"basePath\": \"\",\n    \"customDomain\": true\n  }\n}\n```\n\nErstellen Sie auch `public/CNAME` mit Ihrer Domain:\n\n```txt\ndocs.example.com\n```\n\n## Bereitstellungsmethoden\n\nWählen Sie Ihre bevorzugte Bereitstellungsmethode:\n\n### Methode 1: GitHub Actions (Empfohlen)\n\nAutomatische Bereitstellung bei jedem Push zu main.\n\n\u003cSteps\u003e\n  \u003cStep title=\"Workflow-Datei erstellen\"\u003e\n    Erstellen Sie `.github/workflows/deploy.yml`:\n\n```yaml\nname: Deploy to GitHub Pages\n\non:\n  push:\n    branches: [main]\n\npermissions:\n  contents: read\n  pages: write\n  id-token: write\n\nconcurrency:\n  group: \"pages\"\n  cancel-in-progress: false\n\njobs:\n  build:\n    runs-on: ubuntu-latest\n    steps:\n      - name: Checkout\n        uses: actions/checkout@v4\n\n      - name: Setup Node\n        uses: actions/setup-node@v4\n        with:\n          node-version: '20'\n          cache: 'npm'\n\n      - name: Install dependencies\n        run: npm ci\n\n      - name: Build site\n        run: npm run build:export\n        env:\n          NODE_ENV: production\n\n      - name: Upload artifact\n        uses: actions/upload-pages-artifact@v3\n        with:\n          path: ./out\n\n  deploy:\n    needs: build\n    runs-on: ubuntu-latest\n    environment:\n      name: github-pages\n      url: ${{ steps.deployment.outputs.page_url }}\n    steps:\n      - name: Deploy to GitHub Pages\n        id: deployment\n        uses: actions/deploy-pages@v4\n```\n  \u003c/Step\u003e\n\n  \u003cStep title=\"GitHub Pages aktivieren\"\u003e\n    1. Gehen Sie zu Repository Settings → Pages\n    2. Source: **GitHub Actions**\n    3. Speichern\n\n    Es muss kein Branch ausgewählt werden – der Workflow übernimmt die Bereitstellung.\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Pushen und Bereitstellen\"\u003e\n```bash\ngit add .\ngit commit -m \"Add GitHub Pages deployment\"\ngit push\n```\n\nlhre Seite wird automatisch bereitgestellt! Überprüfen Sie den Actions-Tab auf Fortschritt.\n  \u003c/Step\u003e\n\u003c/Steps\u003e\n\n### Methode 2: Manuelle Bereitstellung\n\nManuell bereitstellen mit dem `gh-pages` Paket.\n\n\u003cSteps\u003e\n  \u003cStep title=\"gh-pages installieren\"\u003e\n```bash\nnpm install --save-dev gh-pages\n```\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Deploy-Skript hinzufügen\"\u003e\n    Aktualisieren Sie `package.json`:\n\n```json\n{\n  \"scripts\": {\n    \"deploy\": \"npm run build:export \u0026\u0026 gh-pages -d out\"\n  }\n}\n```\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Bereitstellen\"\u003e\n```bash\nnpm run deploy\n```\n\nDies baut Ihre Seite und pusht den `out`-Ordner zum `gh-pages`-Branch.\n  \u003c/Step\u003e\n\n  \u003cStep title=\"GitHub Pages aktivieren\"\u003e\n    1. Gehen Sie zu Settings → Pages\n    2. Source: Deploy from a branch\n    3. Branch: `gh-pages` / `/ (root)`\n    4. Speichern\n  \u003c/Step\u003e\n\u003c/Steps\u003e\n\n## Benutzerdefinierte Domain-Einrichtung\n\nVerwenden Sie Ihre eigene Domain mit GitHub Pages:\n\n\u003cSteps\u003e\n  \u003cStep title=\"CNAME-Datei hinzufügen\"\u003e\n    Erstellen Sie `public/CNAME`:\n\n```\ndocs.example.com\n```\n\nKonfiguration aktualisieren:\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"custom-domain-static\",\n    \"customDomain\": true,\n    \"basePath\": \"\"\n  }\n}\n```\n  \u003c/Step\u003e\n\n  \u003cStep title=\"DNS konfigurieren\"\u003e\n    Fügen Sie DNS-Einträge bei Ihrem Domain-Provider hinzu:\n\n**Für Subdomain (docs.example.com):**\n```\nTyp: CNAME\nName: docs\nWert: username.github.io\n```\n\n**Für Apex-Domain (example.com):**\n```\nTyp: A\nName: @\nWert: 185.199.108.153\nWert: 185.199.109.153\nWert: 185.199.110.153\nWert: 185.199.111.153\n```\n\n\u003cCallout type=\"tip\"\u003e\nVerwenden Sie eine Subdomain wie `docs.example.com` – es ist einfacher als das Setup der Apex-Domain.\n\u003c/Callout\u003e\n  \u003c/Step\u003e\n\n  \u003cStep title=\"HTTPS aktivieren\"\u003e\n    Nachdem DNS propagiert wurde (kann bis zu 24 Stunden dauern):\n\n1. Gehen Sie zu Settings → Pages\n2. Aktivieren Sie \"Enforce HTTPS\"\n3. GitHub stellt automatisch ein SSL-Zertifikat bereit\n  \u003c/Step\u003e\n\u003c/Steps\u003e\n\n## Erweiterte GitHub Actions\n\n### Mit Suchindexierung\n\nIndexieren Sie Ihre Docs in MeiliSearch während der Bereitstellung:\n\n```yaml\njobs:\n  build:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n\n      - name: Setup Node\n        uses: actions/setup-node@v4\n        with:\n          node-version: '20'\n          cache: 'npm'\n\n      - name: Install dependencies\n        run: npm ci\n\n      - name: Build site\n        run: npm run build:export\n\n      - name: Index search\n        run: npm run index:search\n        env:\n          MEILISEARCH_HOST: ${{ secrets.MEILISEARCH_HOST }}\n          MEILISEARCH_API_KEY: ${{ secrets.MEILISEARCH_MASTER_KEY }}\n\n      - name: Upload artifact\n        uses: actions/upload-pages-artifact@v3\n        with:\n          path: ./out\n```\n\nFügen Sie Secrets unter Settings → Secrets and variables → Actions hinzu.\n\n### Bei Tag bereitstellen\n\nNur bereitstellen, wenn Sie ein Release-Tag erstellen:\n\n```yaml\non:\n  push:\n    tags:\n      - 'v*'\n```\n\nErstellen und pushen Sie ein Tag zum Bereitstellen:\n\n```bash\ngit tag v1.0.0\ngit push origin v1.0.0\n```\n\n### Mehrere Umgebungen\n\nVerschiedene Branches auf verschiedenen GitHub Pages-Seiten bereitstellen:\n\n```yaml\non:\n  push:\n    branches:\n      - main\n      - staging\n\njobs:\n  build:\n    runs-on: ubuntu-latest\n    steps:\n      # ... build steps ...\n\n      - name: Deploy to production\n        if: github.ref == 'refs/heads/main'\n        uses: actions/deploy-pages@v4\n\n      - name: Deploy to staging\n        if: github.ref == 'refs/heads/staging'\n        # Auf ein anderes Repo oder Branch bereitstellen\n```\n\n## Fehlerbehebung\n\n### 404-Fehler bei Routen\n\nStatische Exporte unterstützen dynamisches Routing nicht auf die gleiche Weise. Stellen Sie sicher, dass alle Routen vorgerendert sind.\n\n**Lösung:** Fügen Sie eine 404.html hinzu, die auf index umleitet:\n\n```html\n\u003c!DOCTYPE html\u003e\n\u003chtml\u003e\n  \u003chead\u003e\n    \u003cmeta http-equiv=\"refresh\" content=\"0;url=/\" /\u003e\n  \u003c/head\u003e\n  \u003cbody\u003e\n    Redirecting...\n  \u003c/body\u003e\n\u003c/html\u003e\n```\n\n### Assets laden nicht\n\nÜberprüfen Sie Ihre `basePath`-Konfiguration:\n\n```bash\n# Ihre Seite anzeigen\nopen https://username.github.io/repo-name\n\n# Überprüfen, ob Assets geladen werden von\nhttps://username.github.io/repo-name/_next/...\n```\n\nWenn Assets 404 zurückgeben, verifizieren Sie:\n- `basePath` in der Konfiguration stimmt exakt mit dem Repo-Namen überein\n- Sie verwenden `npm run build:export` nicht `npm run build`\n\n### Benutzerdefinierte Domain funktioniert nicht\n\n**DNS-Verbreitung überprüfen:**\n```bash\ndig docs.example.com\n# Sollte CNAME zu username.github.io anzeigen\n```\n\n**CNAME-Datei überprüfen:**\n- Muss im `public/` Ordner sein\n- Enthält nur Ihre Domain, kein Protokoll\n- Kein nachgestellter Schrägstrich\n\n**Häufige Probleme:**\n- DNS noch nicht propagiert (warten Sie bis zu 24 Stunden)\n- CNAME-Datei fehlt oder falsch\n- Domainverifizierung in GitHub-Einstellungen fehlgeschlagen\n\n### Build schlägt in Actions fehl\n\n**Logs anzeigen:**\n1. Gehen Sie zum Actions-Tab\n2. Klicken Sie auf den fehlgeschlagenen Workflow\n3. Erweitern Sie den Build-Schritt, um Fehler zu sehen\n\n**Häufige Lösungen:**\n- Node-Version im Workflow erhöhen\n- npm-Cache leeren: `npm ci --cache .npm`\n- Auf fehlende Abhängigkeiten prüfen\n\n## Leistungs-Tipps\n\n### Caching aktivieren\n\nCachen Sie node_modules für schnellere Builds:\n\n```yaml\n- name: Setup Node\n  uses: actions/setup-node@v4\n  with:\n    node-version: '20'\n    cache: 'npm'\n```\n\n### Bilder optimieren\n\nOptimieren Sie Bilder vor dem Committen:\n\n```bash\nnpm install -D imagemin-cli\n\n# Alle Bilder optimieren\nnpx imagemin public/images/* --out-dir=public/images\n```\n\n### Bundle-Größe reduzieren\n\nÜberprüfen Sie, was in Ihrem Bundle enthalten ist:\n\n```bash\nnpm install -D @next/bundle-analyzer\n\nANALYZE=true npm run build:export\n```\n\n## Limits\n\nGitHub Pages hat einige Limits:\n\n- **Repository-Größe:** 1GB empfohlen\n- **Seitengröße:** 1GB veröffentlichte Seite\n- **Bandbreite:** 100GB/Monat Soft-Limit\n- **Builds:** 10 pro Stunde\n\nDiese Limits sind für Dokumentationsseiten großzügig.\n\n## Migration von anderen Plattformen\n\n### Von Vercel\n\n1. Aktualisieren Sie den `deployment`-Abschnitt in `specra.config.json`\n2. Führen Sie `npm run build:export` lokal zum Testen aus\n3. Richten Sie den GitHub Actions-Workflow ein\n4. Pushen, um die Bereitstellung auszulösen\n\n### Von Netlify\n\nGleicher Prozess wie Vercel. Die statische Ausgabe funktioniert auf beiden Plattformen.\n\n## Best Practices\n\n**GitHub Actions verwenden** - Automatische Bereitstellung bei jedem Push\n\n**Versionieren Sie Ihre Docs** - Verwenden Sie Git-Tags für Dokumentationsversionen\n\n**Lokal testen** - Führen Sie `npm run build:export \u0026\u0026 npx serve out` vor dem Pushen aus\n\n**Builds überwachen** - Richten Sie Benachrichtigungen für fehlgeschlagene Bereitstellungen ein\n\n**Benutzerdefinierte Domain verwenden** - Professionelles Erscheinungsbild und stabile URLs\n\n**HTTPS aktivieren** - Immer HTTPS aus Sicherheitsgründen erzwingen\n\n## Nächste Schritte\n\n\u003cCardGrid cols={2}\u003e\n  \u003cCard\n    icon=\"triangle\"\n    title=\"Vercel\"\n    description=\"Auf Vercel für dynamische Features bereitstellen\"\n    href=\"/docs/v1.0.0/deployment/vercel\"\n  /\u003e\n  \u003cCard\n    icon=\"globe\"\n    title=\"Netlify\"\n    description=\"Alternative statische Hosting-Plattform\"\n    href=\"/docs/v1.0.0/deployment/netlify\"\n  /\u003e\n  \u003cCard\n    icon=\"arrow-left\"\n    title=\"Bereitstellungsübersicht\"\n    description=\"Alle Bereitstellungsoptionen ansehen\"\n    href=\"/docs/v1.0.0/deployment/overview\"\n  /\u003e\n  \u003cCard\n    icon=\"settings\"\n    title=\"Konfiguration\"\n    description=\"Bereitstellungseinstellungen konfigurieren\"\n    href=\"/docs/v1.0.0/configuration/overview\"\n  /\u003e\n\u003c/CardGrid\u003e\n"])</script><script>self.__next_f.push([1,"30:T2a35,"])</script><script>self.__next_f.push([1,"\n# Auf GitHub Pages bereitstellen\n\nGitHub Pages bietet kostenloses Hosting für statische Websites und ist damit perfekt für Open-Source-Dokumentation geeignet. Stellen Sie direkt aus Ihrem Repository mit GitHub Actions bereit.\n\n## Warum GitHub Pages?\n\n- **Kostenloses Hosting** - Keine Kosten für öffentliche Repositories\n- **Benutzerdefinierte Domains** - Verwenden Sie Ihre eigene Domain\n- **HTTPS inklusive** - Automatische SSL-Zertifikate\n- **Git-basiert** - Bereitstellung aus Ihrem Repository\n- **Versionskontrolle** - Vollständige Historie Ihrer Docs\n- **Community-Vertrauen** - Vertraute Plattform für Entwickler\n\n## Voraussetzungen\n\n- GitHub-Repository (öffentlich oder privat)\n- Specra-Dokumentationsprojekt\n- Git lokal installiert\n\n## Konfiguration\n\nKonfigurieren Sie Specra zunächst für den statischen Export.\n\n### Ohne benutzerdefinierte Domain\n\nFür URLs wie `username.github.io/repo-name`:\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"github-pages\",\n    \"basePath\": \"repo-name\",\n    \"customDomain\": false\n  }\n}\n```\n\n\u003cCallout type=\"warning\" title=\"Wichtig\"\u003e\nDer `basePath` muss exakt mit Ihrem Repository-Namen übereinstimmen. GitHub Pages stellt von `username.github.io/repo-name` bereit, daher benötigen alle Assets dieses Präfix.\n\u003c/Callout\u003e\n\n### Mit benutzerdefinierter Domain\n\nFür benutzerdefinierte Domains wie `docs.example.com`:\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"custom-domain-static\",\n    \"basePath\": \"\",\n    \"customDomain\": true\n  }\n}\n```\n\nErstellen Sie auch `public/CNAME` mit Ihrer Domain:\n\n```txt\ndocs.example.com\n```\n\n## Bereitstellungsmethoden\n\nWählen Sie Ihre bevorzugte Bereitstellungsmethode:\n\n### Methode 1: GitHub Actions (Empfohlen)\n\nAutomatische Bereitstellung bei jedem Push zu main.\n\n\u003cSteps\u003e\n  \u003cStep title=\"Workflow-Datei erstellen\"\u003e\n    Erstellen Sie `.github/workflows/deploy.yml`:\n\n```yaml\nname: Deploy to GitHub Pages\n\non:\n  push:\n    branches: [main]\n\npermissions:\n  contents: read\n  pages: write\n  id-token: write\n\nconcurrency:\n  group: \"pages\"\n  cancel-in-progress: false\n\njobs:\n  build:\n    runs-on: ubuntu-latest\n    steps:\n      - name: Checkout\n        uses: actions/checkout@v4\n\n      - name: Setup Node\n        uses: actions/setup-node@v4\n        with:\n          node-version: '20'\n          cache: 'npm'\n\n      - name: Install dependencies\n        run: npm ci\n\n      - name: Build site\n        run: npm run build:export\n        env:\n          NODE_ENV: production\n\n      - name: Upload artifact\n        uses: actions/upload-pages-artifact@v3\n        with:\n          path: ./out\n\n  deploy:\n    needs: build\n    runs-on: ubuntu-latest\n    environment:\n      name: github-pages\n      url: ${{ steps.deployment.outputs.page_url }}\n    steps:\n      - name: Deploy to GitHub Pages\n        id: deployment\n        uses: actions/deploy-pages@v4\n```\n  \u003c/Step\u003e\n\n  \u003cStep title=\"GitHub Pages aktivieren\"\u003e\n    1. Gehen Sie zu Repository Settings → Pages\n    2. Source: **GitHub Actions**\n    3. Speichern\n\n    Es muss kein Branch ausgewählt werden – der Workflow übernimmt die Bereitstellung.\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Pushen und Bereitstellen\"\u003e\n```bash\ngit add .\ngit commit -m \"Add GitHub Pages deployment\"\ngit push\n```\n\nlhre Seite wird automatisch bereitgestellt! Überprüfen Sie den Actions-Tab auf Fortschritt.\n  \u003c/Step\u003e\n\u003c/Steps\u003e\n\n### Methode 2: Manuelle Bereitstellung\n\nManuell bereitstellen mit dem `gh-pages` Paket.\n\n\u003cSteps\u003e\n  \u003cStep title=\"gh-pages installieren\"\u003e\n```bash\nnpm install --save-dev gh-pages\n```\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Deploy-Skript hinzufügen\"\u003e\n    Aktualisieren Sie `package.json`:\n\n```json\n{\n  \"scripts\": {\n    \"deploy\": \"npm run build:export \u0026\u0026 gh-pages -d out\"\n  }\n}\n```\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Bereitstellen\"\u003e\n```bash\nnpm run deploy\n```\n\nDies baut Ihre Seite und pusht den `out`-Ordner zum `gh-pages`-Branch.\n  \u003c/Step\u003e\n\n  \u003cStep title=\"GitHub Pages aktivieren\"\u003e\n    1. Gehen Sie zu Settings → Pages\n    2. Source: Deploy from a branch\n    3. Branch: `gh-pages` / `/ (root)`\n    4. Speichern\n  \u003c/Step\u003e\n\u003c/Steps\u003e\n\n## Benutzerdefinierte Domain-Einrichtung\n\nVerwenden Sie Ihre eigene Domain mit GitHub Pages:\n\n\u003cSteps\u003e\n  \u003cStep title=\"CNAME-Datei hinzufügen\"\u003e\n    Erstellen Sie `public/CNAME`:\n\n```\ndocs.example.com\n```\n\nKonfiguration aktualisieren:\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"custom-domain-static\",\n    \"customDomain\": true,\n    \"basePath\": \"\"\n  }\n}\n```\n  \u003c/Step\u003e\n\n  \u003cStep title=\"DNS konfigurieren\"\u003e\n    Fügen Sie DNS-Einträge bei Ihrem Domain-Provider hinzu:\n\n**Für Subdomain (docs.example.com):**\n```\nTyp: CNAME\nName: docs\nWert: username.github.io\n```\n\n**Für Apex-Domain (example.com):**\n```\nTyp: A\nName: @\nWert: 185.199.108.153\nWert: 185.199.109.153\nWert: 185.199.110.153\nWert: 185.199.111.153\n```\n\n\u003cCallout type=\"tip\"\u003e\nVerwenden Sie eine Subdomain wie `docs.example.com` – es ist einfacher als das Setup der Apex-Domain.\n\u003c/Callout\u003e\n  \u003c/Step\u003e\n\n  \u003cStep title=\"HTTPS aktivieren\"\u003e\n    Nachdem DNS propagiert wurde (kann bis zu 24 Stunden dauern):\n\n1. Gehen Sie zu Settings → Pages\n2. Aktivieren Sie \"Enforce HTTPS\"\n3. GitHub stellt automatisch ein SSL-Zertifikat bereit\n  \u003c/Step\u003e\n\u003c/Steps\u003e\n\n## Erweiterte GitHub Actions\n\n### Mit Suchindexierung\n\nIndexieren Sie Ihre Docs in MeiliSearch während der Bereitstellung:\n\n```yaml\njobs:\n  build:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n\n      - name: Setup Node\n        uses: actions/setup-node@v4\n        with:\n          node-version: '20'\n          cache: 'npm'\n\n      - name: Install dependencies\n        run: npm ci\n\n      - name: Build site\n        run: npm run build:export\n\n      - name: Index search\n        run: npm run index:search\n        env:\n          MEILISEARCH_HOST: ${{ secrets.MEILISEARCH_HOST }}\n          MEILISEARCH_API_KEY: ${{ secrets.MEILISEARCH_MASTER_KEY }}\n\n      - name: Upload artifact\n        uses: actions/upload-pages-artifact@v3\n        with:\n          path: ./out\n```\n\nFügen Sie Secrets unter Settings → Secrets and variables → Actions hinzu.\n\n### Bei Tag bereitstellen\n\nNur bereitstellen, wenn Sie ein Release-Tag erstellen:\n\n```yaml\non:\n  push:\n    tags:\n      - 'v*'\n```\n\nErstellen und pushen Sie ein Tag zum Bereitstellen:\n\n```bash\ngit tag v1.0.0\ngit push origin v1.0.0\n```\n\n### Mehrere Umgebungen\n\nVerschiedene Branches auf verschiedenen GitHub Pages-Seiten bereitstellen:\n\n```yaml\non:\n  push:\n    branches:\n      - main\n      - staging\n\njobs:\n  build:\n    runs-on: ubuntu-latest\n    steps:\n      # ... build steps ...\n\n      - name: Deploy to production\n        if: github.ref == 'refs/heads/main'\n        uses: actions/deploy-pages@v4\n\n      - name: Deploy to staging\n        if: github.ref == 'refs/heads/staging'\n        # Auf ein anderes Repo oder Branch bereitstellen\n```\n\n## Fehlerbehebung\n\n### 404-Fehler bei Routen\n\nStatische Exporte unterstützen dynamisches Routing nicht auf die gleiche Weise. Stellen Sie sicher, dass alle Routen vorgerendert sind.\n\n**Lösung:** Fügen Sie eine 404.html hinzu, die auf index umleitet:\n\n```html\n\u003c!DOCTYPE html\u003e\n\u003chtml\u003e\n  \u003chead\u003e\n    \u003cmeta http-equiv=\"refresh\" content=\"0;url=/\" /\u003e\n  \u003c/head\u003e\n  \u003cbody\u003e\n    Redirecting...\n  \u003c/body\u003e\n\u003c/html\u003e\n```\n\n### Assets laden nicht\n\nÜberprüfen Sie Ihre `basePath`-Konfiguration:\n\n```bash\n# Ihre Seite anzeigen\nopen https://username.github.io/repo-name\n\n# Überprüfen, ob Assets geladen werden von\nhttps://username.github.io/repo-name/_next/...\n```\n\nWenn Assets 404 zurückgeben, verifizieren Sie:\n- `basePath` in der Konfiguration stimmt exakt mit dem Repo-Namen überein\n- Sie verwenden `npm run build:export` nicht `npm run build`\n\n### Benutzerdefinierte Domain funktioniert nicht\n\n**DNS-Verbreitung überprüfen:**\n```bash\ndig docs.example.com\n# Sollte CNAME zu username.github.io anzeigen\n```\n\n**CNAME-Datei überprüfen:**\n- Muss im `public/` Ordner sein\n- Enthält nur Ihre Domain, kein Protokoll\n- Kein nachgestellter Schrägstrich\n\n**Häufige Probleme:**\n- DNS noch nicht propagiert (warten Sie bis zu 24 Stunden)\n- CNAME-Datei fehlt oder falsch\n- Domainverifizierung in GitHub-Einstellungen fehlgeschlagen\n\n### Build schlägt in Actions fehl\n\n**Logs anzeigen:**\n1. Gehen Sie zum Actions-Tab\n2. Klicken Sie auf den fehlgeschlagenen Workflow\n3. Erweitern Sie den Build-Schritt, um Fehler zu sehen\n\n**Häufige Lösungen:**\n- Node-Version im Workflow erhöhen\n- npm-Cache leeren: `npm ci --cache .npm`\n- Auf fehlende Abhängigkeiten prüfen\n\n## Leistungs-Tipps\n\n### Caching aktivieren\n\nCachen Sie node_modules für schnellere Builds:\n\n```yaml\n- name: Setup Node\n  uses: actions/setup-node@v4\n  with:\n    node-version: '20'\n    cache: 'npm'\n```\n\n### Bilder optimieren\n\nOptimieren Sie Bilder vor dem Committen:\n\n```bash\nnpm install -D imagemin-cli\n\n# Alle Bilder optimieren\nnpx imagemin public/images/* --out-dir=public/images\n```\n\n### Bundle-Größe reduzieren\n\nÜberprüfen Sie, was in Ihrem Bundle enthalten ist:\n\n```bash\nnpm install -D @next/bundle-analyzer\n\nANALYZE=true npm run build:export\n```\n\n## Limits\n\nGitHub Pages hat einige Limits:\n\n- **Repository-Größe:** 1GB empfohlen\n- **Seitengröße:** 1GB veröffentlichte Seite\n- **Bandbreite:** 100GB/Monat Soft-Limit\n- **Builds:** 10 pro Stunde\n\nDiese Limits sind für Dokumentationsseiten großzügig.\n\n## Migration von anderen Plattformen\n\n### Von Vercel\n\n1. Aktualisieren Sie den `deployment`-Abschnitt in `specra.config.json`\n2. Führen Sie `npm run build:export` lokal zum Testen aus\n3. Richten Sie den GitHub Actions-Workflow ein\n4. Pushen, um die Bereitstellung auszulösen\n\n### Von Netlify\n\nGleicher Prozess wie Vercel. Die statische Ausgabe funktioniert auf beiden Plattformen.\n\n## Best Practices\n\n**GitHub Actions verwenden** - Automatische Bereitstellung bei jedem Push\n\n**Versionieren Sie Ihre Docs** - Verwenden Sie Git-Tags für Dokumentationsversionen\n\n**Lokal testen** - Führen Sie `npm run build:export \u0026\u0026 npx serve out` vor dem Pushen aus\n\n**Builds überwachen** - Richten Sie Benachrichtigungen für fehlgeschlagene Bereitstellungen ein\n\n**Benutzerdefinierte Domain verwenden** - Professionelles Erscheinungsbild und stabile URLs\n\n**HTTPS aktivieren** - Immer HTTPS aus Sicherheitsgründen erzwingen\n\n## Nächste Schritte\n\n\u003cCardGrid cols={2}\u003e\n  \u003cCard\n    icon=\"triangle\"\n    title=\"Vercel\"\n    description=\"Auf Vercel für dynamische Features bereitstellen\"\n    href=\"/docs/v1.0.0/deployment/vercel\"\n  /\u003e\n  \u003cCard\n    icon=\"globe\"\n    title=\"Netlify\"\n    description=\"Alternative statische Hosting-Plattform\"\n    href=\"/docs/v1.0.0/deployment/netlify\"\n  /\u003e\n  \u003cCard\n    icon=\"arrow-left\"\n    title=\"Bereitstellungsübersicht\"\n    description=\"Alle Bereitstellungsoptionen ansehen\"\n    href=\"/docs/v1.0.0/deployment/overview\"\n  /\u003e\n  \u003cCard\n    icon=\"settings\"\n    title=\"Konfiguration\"\n    description=\"Bereitstellungseinstellungen konfigurieren\"\n    href=\"/docs/v1.0.0/configuration/overview\"\n  /\u003e\n\u003c/CardGrid\u003e\n"])</script><script>self.__next_f.push([1,"31:T293a,"])</script><script>self.__next_f.push([1,"\n# Inhalte schreiben in Specra\n\nSpecra verwendet MDX (Markdown + JSX) für die Dokumentation, was Ihnen die Einfachheit von Markdown mit der Kraft von React-Komponenten bietet. Dieser Leitfaden deckt alles ab, was Sie benötigen, um großartige Dokumentation zu schreiben.\n\n## MDX-Grundlagen\n\nMDX-Dateien sehen wie reguläres Markdown aus, lassen Sie aber React-Komponenten überall in Ihrem Inhalt verwenden.\n\n### Standard-Markdown\n\nAlle Standard-Markdown-Syntax funktioniert wie erwartet:\n\n**Überschriften:**\n```markdown\n# Überschrift 1\n## Überschrift 2\n### Überschrift 3\n```\n\n**Textformatierung:**\n```markdown\n**Fetter Text**\n*Kursiver Text*\n~~Durchgestrichen~~\n`Inline-Code`\n```\n\n**Listen:**\n```markdown\n- Ungeordnete Liste\n- Ein weiteres Element\n  - Verschachteltes Element\n\n1. Geordnete Liste\n2. Zweites Element\n   1. Verschachteltes geordnetes Element\n```\n\n**Links und Bilder:**\n```markdown\n[Linktext](https://example.com)\n![Alt-Text](/images/photo.png)\n```\n\n**Codeblöcke:**\n````markdown\n```javascript\nfunction hello() {\n  console.log(\"Hallo, Welt!\")\n}\n```\n````\n\n**Tabellen:**\n```markdown\n| Spalte 1 | Spalte 2 | Spalte 3 |\n|----------|----------|----------|\n| Daten 1  | Daten 2  | Daten 3  |\n| Mehr     | Info     | Hier     |\n```\n\n**Zitate:**\n```markdown\n\u003e Dies ist ein Zitat.\n\u003e Es kann mehrere Zeilen umfassen.\n```\n\n**Horizontale Linien:**\n```markdown\n---\n```\n\n## Verwendung von Komponenten\n\nKomponenten werden mit JSX-Syntax direkt in Ihrem MDX verwendet:\n\n```mdx\n\u003cCallout type=\"info\"\u003e\n  Dies ist eine Callout-Komponente!\n\u003c/Callout\u003e\n```\n\nAlle Komponenten sind automatisch verfügbar - keine Importe erforderlich.\n\n### Komponenten-Beispiele\n\n**Leser auf wichtige Informationen hinweisen:**\n```mdx\n\u003cCallout type=\"warning\"\u003e\n  Stellen Sie sicher, dass Sie Ihre Daten sichern, bevor Sie fortfahren.\n\u003c/Callout\u003e\n```\n\n**Getabbte Inhalte erstellen:**\n```mdx\n\u003cTabs defaultValue=\"option1\"\u003e\n  \u003cTab label=\"Option 1\"\u003e\n    Inhalt für den ersten Tab\n  \u003c/Tab\u003e\n  \u003cTab label=\"Option 2\"\u003e\n    Inhalt für den zweiten Tab\n  \u003c/Tab\u003e\n\u003c/Tabs\u003e\n```\n\n**Benutzer durch Schritte führen:**\n```mdx\n\u003cSteps\u003e\n  \u003cStep title=\"Abhängigkeiten installieren\"\u003e\n    Führen Sie `npm install` aus, um zu beginnen.\n  \u003c/Step\u003e\n  \u003cStep title=\"Konfigurieren Sie Ihre App\"\u003e\n    Bearbeiten Sie die Konfigurationsdatei mit Ihren Einstellungen.\n  \u003c/Step\u003e\n\u003c/Steps\u003e\n```\n\nSiehe den Abschnitt [Komponenten](/docs/v1.0.0/components) für alle verfügbaren Komponenten.\n\n## Inhaltsorganisation\n\n### Best Practices für die Dateistruktur\n\nOrganisieren Sie Dateien logisch, um Inhalte leicht auffindbar zu machen:\n\n```txt\ndocs/v1.0.0/\n├── getting-started.mdx         # Top-Level: wesentliche Seiten\n├── installation.mdx\n├── guides/                     # Verwandte Inhalte gruppieren\n│   ├── _category_.json\n│   ├── basics.mdx\n│   ├── advanced.mdx\n│   └── examples/              # Weitere Verschachtelung für Unterthemen\n│       ├── _category_.json\n│       ├── example-1.mdx\n│       └── example-2.mdx\n└── api/\n    ├── _category_.json\n    └── reference.mdx\n```\n\n**Tipps:**\n- Behalten Sie die oberste Ebene für kritische Seiten, die Benutzer zuerst benötigen\n- Verwenden Sie Ordner, um verwandte Inhalte zu gruppieren\n- Begrenzen Sie die Verschachtelung auf maximal 2-3 Ebenen\n- Benennen Sie Dateien beschreibend (`authentication.mdx` nicht `auth.mdx`)\n\n### Seitenreihenfolge steuern\n\nVerwenden Sie `sidebar_position` im Frontmatter, um die Reihenfolge zu steuern:\n\n```mdx\n---\ntitle: Installation\nsidebar_position: 1\n---\n```\n\nNiedrigere Zahlen erscheinen zuerst. Seiten ohne Position werden alphabetisch sortiert.\n\nFür Ordner verwenden Sie `_category_.json`:\n\n```json\n{\n  \"label\": \"Erste Schritte\",\n  \"position\": 1\n}\n```\n\n## Schreibstil-Tipps\n\nGute Dokumentation ist klar, prägnant und hilfreich. Hier sind einige Tipps:\n\n### Seien Sie klar und direkt\n\n**Gut:**\n\u003e Klicken Sie auf die Schaltfläche \"Speichern\", um Ihre Änderungen zu speichern.\n\n**Schlecht:**\n\u003e Sie könnten in Erwägung ziehen, auf die mit \"Speichern\" beschriftete Schaltfläche zu klicken, wenn Sie Ihre Modifikationen im Speicher behalten möchten.\n\n### Verwenden Sie Aktiv\n\n**Gut:**\n\u003e Das System validiert Ihre Eingabe.\n\n**Schlecht:**\n\u003e Ihre Eingabe wird vom System validiert.\n\n### Zeigen, nicht nur erzählen\n\nFügen Sie Beispiele zu jedem Konzept hinzu:\n\n```mdx\n## Verwendung von Umgebungsvariablen\n\nZugriff auf Umgebungsvariablen in Ihrer Konfiguration:\n\n```json\n{\n  \"env\": {\n    \"API_URL\": \"https://api.example.com\"\n  }\n}\n```\n\nDann referenzieren Sie sie in Ihrem MDX:\n\n```mdx\nDie API ist verfügbar unter {process.env.API_URL}\n```\n```\n\n### Langen Inhalt aufteilen\n\nVerwenden Sie Überschriften, Listen, Callouts und Komponenten, um visuelle Unterbrechungen zu schaffen:\n\n```mdx\n## Konfigurationsoptionen\n\nEs gibt mehrere Möglichkeiten, die Authentifizierung zu konfigurieren:\n\n### API-Schlüssel\n\nAPI-Schlüssel sind einfach, aber weniger sicher.\n\n\u003cCallout type=\"warning\"\u003e\n  Committen Sie niemals API-Schlüssel in die Versionskontrolle.\n\u003c/Callout\u003e\n\n### OAuth 2.0\n\nOAuth bietet bessere Sicherheit für benutzerorientierte Apps.\n\n\u003cSteps\u003e\n  \u003cStep title=\"Registrieren Sie Ihre App\"\u003e\n    Erstellen Sie eine App im Provider-Dashboard.\n  \u003c/Step\u003e\n  \u003cStep title=\"Callback-URL konfigurieren\"\u003e\n    Setzen Sie Ihre Redirect-URI in den App-Einstellungen.\n  \u003c/Step\u003e\n\u003c/Steps\u003e\n```\n\n## Arbeiten mit Bildern\n\n### Bilder hinzufügen\n\nPlatzieren Sie Bilder im `public/`-Ordner:\n\n```txt\npublic/\n├── images/\n│   ├── screenshot.png\n│   └── diagram.svg\n```\n\nReferenzieren Sie sie in MDX:\n\n```mdx\n![Dashboard-Screenshot](/images/screenshot.png)\n```\n\n### Bild-Best-Practices\n\n**Verwenden Sie beschreibenden Alt-Text:**\n```mdx\n![Login-Formular mit E-Mail- und Passwortfeldern](/images/login.png)\n```\n\n**Optimieren Sie Bildgrößen:**\n- Verwenden Sie WebP-Format, wenn möglich\n- Komprimieren Sie Bilder vor dem Hinzufügen zum Repo\n- Halten Sie Bilder unter 500KB\n\n**Verwenden Sie die Image-Komponente für erweiterte Funktionen:**\n```mdx\n\u003cImage\n  src=\"/images/hero.png\"\n  alt=\"Hero-Bild\"\n  caption=\"Die Haupt-Dashboard-Ansicht\"\n  width={800}\n  height={400}\n/\u003e\n```\n\n## Code-Beispiele\n\n### Syntax-Hervorhebung\n\nGeben Sie die Sprache nach den öffnenden Backticks an:\n\n````markdown\n```javascript\nconst greeting = \"Hallo, Welt!\"\nconsole.log(greeting)\n```\n\n```python\ndef greet():\n    print(\"Hallo, Welt!\")\n```\n\n```bash\nnpm install specra\n```\n````\n\nUnterstützte Sprachen umfassen: javascript, typescript, python, bash, json, yaml, markdown, html, css und viele mehr.\n\n### Zeilen hervorheben\n\nHeben Sie bestimmte Zeilen hervor, um Aufmerksamkeit zu erregen:\n\n````markdown\n```javascript {2,4-6}\nfunction calculateTotal(items) {\n  const subtotal = items.reduce((sum, item) =\u003e sum + item.price, 0)\n  const tax = subtotal * 0.1\n  const shipping = 5.99\n  const total = subtotal + tax + shipping\n  return total\n}\n```\n````\n\n### Dateinamen\n\nZeigen Sie an, zu welcher Datei der Code gehört:\n\n````markdown\n```javascript title=\"src/utils.js\"\nexport function formatDate(date) {\n  return date.toLocaleDateString()\n}\n```\n````\n\n### Verwendung der CodeBlock-Komponente\n\nFür mehr Kontrolle:\n\n```mdx\n\u003cCodeBlock\n  language=\"javascript\"\n  title=\"src/app.js\"\n  highlightLines={[3, 5]}\n  showLineNumbers={true}\n\u003e\n{`function app() {\n  const config = loadConfig()\n  const server = createServer(config)\n  server.listen(3000)\n  console.log(\"Server running\")\n}`}\n\u003c/CodeBlock\u003e\n```\n\n## Link und Navigation\n\n### Interne Links\n\nLink zu anderen Seiten in Ihren Docs:\n\n```mdx\nSiehe den [Konfigurationsleitfaden](/docs/v1.0.0/configuration/overview) für Details.\n```\n\nVerwenden Sie relative Pfade vom entationssystem.\n\n\u003cCallout type=\"info\" title=\"Automatische Erkennung\"\u003e\nDie `ApiReference`-Komponente erkennt automatisch das OpenAPI-Format, wenn Sie `parser=\"auto\"` verwenden (Standard).\n\u003c/Callout\u003e\n\n---\n\n\u003cApiReference spec=\"/api-specs/openapi-example.json\" /\u003e\n\n---\n\n## Über dieses Beispiel\n\nDieses Beispiel zeigt, wie der Parser umgeht mit:\n\n- ✅ **OpenAPI 3.0 Format** Erkennung\n- ✅ **Schema-Referenzen** (`$ref`) Auflösung\n- ✅ **Pfadparameter** (`{id}` konvertiert zu `:id`)\n- ✅ **Request/Response-Schemas** mit Beispielen\n- ✅ **Sicherheitsschemata** (Bearer-Token, API-Keys)\n- ✅ **Mehrere Antwortcodes** (Erfolg und Fehler)\n\n## Verwendung Ihrer eigenen OpenAPI-Spezifikation\n\nSo verwenden Sie Ihre eigene OpenAPI-Spezifikation:\n\n1. **Platzieren Sie Ihre Spezifikationsdatei** im Verzeichnis `/public/api-specs/`\n2. **Referenzieren Sie sie in Ihrer MDX**-Datei:\n\n```mdx\n\u003cApiReference spec=\"/api-specs/your-api.json\" parser=\"openapi\" /\u003e\n```\n\nOder lassen Sie es automatisch erkennen:\n\n```mdx\n\u003cApiReference spec=\"/api-specs/your-api.json\" /\u003e\n```\n\nDer Parser unterstützt sowohl **OpenAPI 3.x** als auch **Swagger 2.0** Formate.\n35:T1d1b,"])</script><script>self.__next_f.push([1,"\n# Callout\n\nCallouts ziehen Aufmerksamkeit auf wichtige Informationen in Ihrer Dokumentation. Sie kommen in verschiedenen Stilen, um verschiedene Arten von Nachrichten zu übermitteln, von hilfreichen Tipps bis hin zu kritischen Warnungen.\n\n## Grundlegende Verwendung\n\n\u003cTabs defaultValue=\"Preview\"\u003e\n  \u003cTab label=\"Vorschau\"\u003e\n\u003cCallout type=\"info\"\u003e\n  Dies ist eine hilfreiche Information für den Leser.\n\u003c/Callout\u003e\n  \u003c/Tab\u003e\n  \u003cTab label=\"Code\"\u003e\n```mdx\n\u003cCallout type=\"info\"\u003e\n  Dies ist eine hilfreiche Information für den Leser.\n\u003c/Callout\u003e\n```\n  \u003c/Tab\u003e\n\u003c/Tabs\u003e\n\n## Callout-Typen\n\nSpecra enthält sieben Callout-Typen, jeder mit eigenem Styling:\n\n### Info\n\n\u003cTabs defaultValue=\"Preview\"\u003e\n  \u003cTab label=\"Vorschau\"\u003e\n\u003cCallout type=\"info\"\u003e\n  Bietet zusätzlichen Kontext oder hilfreiche Informationen, die das Verständnis verbessern.\n\u003c/Callout\u003e\n  \u003c/Tab\u003e\n  \u003cTab label=\"Code\"\u003e\n```mdx\n\u003cCallout type=\"info\"\u003e\n  Bietet zusätzlichen Kontext oder hilfreiche Informationen.\n\u003c/Callout\u003e\n```\n  \u003c/Tab\u003e\n\u003c/Tabs\u003e\n\n### Hinweis (Note)\n\n\u003cTabs defaultValue=\"Preview\"\u003e\n  \u003cTab label=\"Vorschau\"\u003e\n\u003cCallout type=\"note\"\u003e\n  Hebt wichtige Details hervor, die dem Leser bewusst sein sollten.\n\u003c/Callout\u003e\n  \u003c/Tab\u003e\n  \u003cTab label=\"Code\"\u003e\n```mdx\n\u003cCallout type=\"note\"\u003e\n  Hebt wichtige Details hervor, die dem Leser bewusst sein sollten.\n\u003c/Callout\u003e\n```\n  \u003c/Tab\u003e\n\u003c/Tabs\u003e\n\n### Tipp (Tip)\n\n\u003cTabs defaultValue=\"Preview\"\u003e\n  \u003cTab label=\"Vorschau\"\u003e\n\u003cCallout type=\"tip\"\u003e\n  Bietet Vorschläge für eine bessere Nutzung oder Best Practices.\n\u003c/Callout\u003e\n  \u003c/Tab\u003e\n  \u003cTab label=\"Code\"\u003e\n```mdx\n\u003cCallout type=\"tip\"\u003e\n  Bietet Vorschläge für eine bessere Nutzung oder Best Practices.\n\u003c/Callout\u003e\n```\n  \u003c/Tab\u003e\n\u003c/Tabs\u003e\n\n### Warnung (Warning)\n\n\u003cTabs defaultValue=\"Preview\"\u003e\n  \u003cTab label=\"Vorschau\"\u003e\n\u003cCallout type=\"warning\"\u003e\n  Warnt Benutzer vor potenziellen Problemen oder Breaking Changes.\n\u003c/Callout\u003e\n  \u003c/Tab\u003e\n  \u003cTab label=\"Code\"\u003e\n```mdx\n\u003cCallout type=\"warning\"\u003e\n  Warnt Benutzer vor potenziellen Problemen oder Breaking Changes.\n\u003c/Callout\u003e\n```\n  \u003c/Tab\u003e\n\u003c/Tabs\u003e\n\n### Erfolg (Success)\n\n\u003cTabs defaultValue=\"Preview\"\u003e\n  \u003cTab label=\"Vorschau\"\u003e\n\u003cCallout type=\"success\"\u003e\n  Bestätigt positive Ergebnisse oder erfolgreich abgeschlossene Aktionen.\n\u003c/Callout\u003e\n  \u003c/Tab\u003e\n  \u003cTab label=\"Code\"\u003e\n```mdx\n\u003cCallout type=\"success\"\u003e\n  Bestätigt positive Ergebnisse oder erfolgreich abgeschlossene Aktionen.\n\u003c/Callout\u003e\n```\n  \u003c/Tab\u003e\n\u003c/Tabs\u003e\n\n### Fehler (Error)\n\n\u003cTabs defaultValue=\"Preview\"\u003e\n  \u003cTab label=\"Vorschau\"\u003e\n\u003cCallout type=\"error\"\u003e\n  Hebt kritische Probleme hervor oder Dinge, die Benutzer vermeiden sollten.\n\u003c/Callout\u003e\n  \u003c/Tab\u003e\n  \u003cTab label=\"Code\"\u003e\n```mdx\n\u003cCallout type=\"error\"\u003e\n  Hebt kritische Probleme hervor oder Dinge, die Benutzer vermeiden sollten.\n\u003c/Callout\u003e\n```\n  \u003c/Tab\u003e\n\u003c/Tabs\u003e\n\n### Gefahr (Danger)\n\n\u003cTabs defaultValue=\"Preview\"\u003e\n  \u003cTab label=\"Vorschau\"\u003e\n\u003cCallout type=\"danger\"\u003e\n  Warnt vor potenziell destruktiven oder irreversiblen Aktionen.\n\u003c/Callout\u003e\n  \u003c/Tab\u003e\n  \u003cTab label=\"Code\"\u003e\n```mdx\n\u003cCallout type=\"danger\"\u003e\n  Warnt vor potenziell destruktiven oder irreversiblen Aktionen.\n\u003c/Callout\u003e\n```\n  \u003c/Tab\u003e\n\u003c/Tabs\u003e\n\n## Props\n\n| Prop | Typ | Standard | Beschreibung |\n|------|-----|----------|--------------|\n| `type` | `string` | `\"info\"` | Callout-Stil: `info`, `note`, `tip`, `warning`, `success`, `error` oder `danger` |\n| `children` | `ReactNode` | Erforderlich | Der Inhalt innerhalb des Callouts |\n\n## Erweiterte Beispiele\n\n### Mehrzeiliger Inhalt\n\nCallouts können beliebigen MDX-Inhalt enthalten, einschließlich formatiertem Text, Listen und Code:\n\n\u003cTabs defaultValue=\"Preview\"\u003e\n  \u003cTab label=\"Vorschau\"\u003e\n\u003cCallout type=\"warning\"\u003e\n  **Wichtige Überlegungen vor der Bereitstellung:**\n\n  - Sichern Sie Ihre Datenbank\n  - Testen Sie zuerst in der Staging-Umgebung\n  - Benachrichtigen Sie Ihr Team über Ausfallzeiten\n\n  Führen Sie `npm run db:backup` aus, um ein Backup zu erstellen.\n\u003c/Callout\u003e\n  \u003c/Tab\u003e\n  \u003cTab label=\"Code\"\u003e\n```mdx\n\u003cCallout type=\"warning\"\u003e\n  **Wichtige Überlegungen vor der Bereitstellung:**\n\n  - Sichern Sie Ihre Datenbank\n  - Testen Sie zuerst in der Staging-Umgebung\n  - Benachrichtigen Sie Ihr Team über Ausfallzeiten\n\n  Führen Sie `npm run db:backup` aus, um ein Backup zu erstellen.\n\u003c/Callout\u003e\n```\n  \u003c/Tab\u003e\n\u003c/Tabs\u003e\n\n### Verschachtelte Komponenten\n\nSie können andere Komponenten innerhalb von Callouts verschachteln:\n\n\u003cTabs defaultValue=\"Preview\"\u003e\n  \u003cTab label=\"Vorschau\"\u003e\n\u003cCallout type=\"info\"\u003e\n  **Profi-Tipp:** Verwenden Sie Codeblöcke, um Beispiele zu zeigen\n\n  \u003cTabs defaultValue=\"js\"\u003e\n    \u003cTab label=\"JavaScript\"\u003e\n      console.log(\"Hallo!\")\n    \u003c/Tab\u003e\n    \u003cTab label=\"Python\"\u003e\n      print(\"Hallo!\")\n    \u003c/Tab\u003e\n  \u003c/Tabs\u003e\n\u003c/Callout\u003e\n  \u003c/Tab\u003e\n  \u003cTab label=\"Code\"\u003e\n```mdx\n\u003cCallout type=\"info\"\u003e\n  **Profi-Tipp:** Verwenden Sie Codeblöcke, um Beispiele zu zeigen\n\n  \u003cTabs defaultValue=\"js\"\u003e\n    \u003cTab label=\"JavaScript\"\u003e\n      console.log(\"Hallo!\")\n    \u003c/Tab\u003e\n    \u003cTab label=\"Python\"\u003e\n      print(\"Hallo!\")\n    \u003c/Tab\u003e\n  \u003c/Tabs\u003e\n\u003c/Callout\u003e\n```\n  \u003c/Tab\u003e\n\u003c/Tabs\u003e\n\n## GitHub-Style Alerts\n\nBevorzugen Sie Markdown-Syntax? Specra unterstützt auch GitHub-Style Alert-Syntax unter Verwendung von Blockquotes:\n\n\u003cTabs defaultValue=\"Preview\"\u003e\n  \u003cTab label=\"Vorschau\"\u003e\n\u003e [!NOTE]\n\u003e Dies ist ein Hinweis mit GitHub-Style Syntax.\n\n\u003e [!TIP]\n\u003e Dies ist ein Tipp mit Blockquote-Syntax.\n\n\u003e [!WARNING]\n\u003e Dies ist eine Warnmeldung.\n  \u003c/Tab\u003e\n  \u003cTab label=\"Code\"\u003e\n```markdown\n\u003e [!NOTE]\n\u003e Dies ist ein Hinweis mit GitHub-Style Syntax.\n\n\u003e [!TIP]\n\u003e Dies ist ein Tipp mit Blockquote-Syntax.\n\n\u003e [!WARNING]\n\u003e Dies ist eine Warnmeldung.\n```\n  \u003c/Tab\u003e\n\u003c/Tabs\u003e\n\n**Unterstützte Alert-Typen:**\n- `[!NOTE]` - Dasselbe wie type=\"note\"\n- `[!TIP]` - Dasselbe wie type=\"tip\"\n- `[!IMPORTANT]` - Dasselbe wie type=\"warning\"\n- `[!WARNING]` - Dasselbe wie type=\"warning\"\n- `[!CAUTION]` - Dasselbe wie type=\"danger\"\n\n## Wann welcher Typ zu verwenden ist\n\n**Info** - Zusätzlicher Kontext, der das Verständnis verbessert\n- \"Sie können dies auch über die CLI erreichen\"\n- \"Diese Funktion ist in v2.0 und später verfügbar\"\n\n**Note** - Wichtige Informationen, die nicht übersprungen werden sollten\n- \"Diese Einstellung betrifft alle Benutzer in Ihrer Organisation\"\n- \"Änderungen werden nach dem Server-Neustart wirksam\"\n\n**Tip** - Best Practices und hilfreiche Vorschläge\n- \"Für bessere Leistung aktivieren Sie Caching\"\n- \"Verwenden Sie TypeScript für bessere Autovervollständigung\"\n\n**Warning** - Potenzielle Probleme oder Breaking Changes\n- \"Dies wird Ihr Datenbankschema ändern\"\n- \"Veraltet in v3.0, verwenden Sie stattdessen newMethod()\"\n\n**Success** - Positive Bestätigungen\n- \"Setup abgeschlossen! Ihre Seite ist bereit\"\n- \"Alle Tests erfolgreich bestanden\"\n\n**Error** - Kritische Probleme, die vermieden werden sollten\n- \"Legen Sie Ihren API-Schlüssel nicht im Client-Code offen\"\n- \"Dieser Vorgang kann nicht rückgängig gemacht werden\"\n\n**Danger** - Destruktive oder irreversible Aktionen\n- \"Dies wird dauerhaft alle Daten löschen\"\n- \"Fortfahren wird alle Zugriffstoken widerrufen\"\n\n## Barrierefreiheit\n\nCallouts sind semantisch und barrierefrei:\n\n- Verwendet geeignete ARIA-Rollen\n- Screenreader-freundlich\n- Tastaturnavigierbar\n- Farbkontrastkonform (WCAG AA)\n- Icons sind dekorativ mit passendem Alt-Text\n\n## Verwandte Komponenten\n\n\u003cCardGrid cols={3}\u003e\n  \u003cCard icon=\"square\" title=\"Card\" href=\"/docs/v1.0.0/components/card\" /\u003e\n  \u003cCard icon=\"message-square\" title=\"Badge\" href=\"/docs/v1.0.0/components/badge\" /\u003e\n  \u003cCard icon=\"layers\" title=\"Akkordeon\" href=\"/docs/v1.0.0/components/accordion\" /\u003e\n\u003c/CardGrid\u003e\n"])</script><script>self.__next_f.push([1,"36:T1d1b,"])</script><script>self.__next_f.push([1,"\n# Callout\n\nCallouts ziehen Aufmerksamkeit auf wichtige Informationen in Ihrer Dokumentation. Sie kommen in verschiedenen Stilen, um verschiedene Arten von Nachrichten zu übermitteln, von hilfreichen Tipps bis hin zu kritischen Warnungen.\n\n## Grundlegende Verwendung\n\n\u003cTabs defaultValue=\"Preview\"\u003e\n  \u003cTab label=\"Vorschau\"\u003e\n\u003cCallout type=\"info\"\u003e\n  Dies ist eine hilfreiche Information für den Leser.\n\u003c/Callout\u003e\n  \u003c/Tab\u003e\n  \u003cTab label=\"Code\"\u003e\n```mdx\n\u003cCallout type=\"info\"\u003e\n  Dies ist eine hilfreiche Information für den Leser.\n\u003c/Callout\u003e\n```\n  \u003c/Tab\u003e\n\u003c/Tabs\u003e\n\n## Callout-Typen\n\nSpecra enthält sieben Callout-Typen, jeder mit eigenem Styling:\n\n### Info\n\n\u003cTabs defaultValue=\"Preview\"\u003e\n  \u003cTab label=\"Vorschau\"\u003e\n\u003cCallout type=\"info\"\u003e\n  Bietet zusätzlichen Kontext oder hilfreiche Informationen, die das Verständnis verbessern.\n\u003c/Callout\u003e\n  \u003c/Tab\u003e\n  \u003cTab label=\"Code\"\u003e\n```mdx\n\u003cCallout type=\"info\"\u003e\n  Bietet zusätzlichen Kontext oder hilfreiche Informationen.\n\u003c/Callout\u003e\n```\n  \u003c/Tab\u003e\n\u003c/Tabs\u003e\n\n### Hinweis (Note)\n\n\u003cTabs defaultValue=\"Preview\"\u003e\n  \u003cTab label=\"Vorschau\"\u003e\n\u003cCallout type=\"note\"\u003e\n  Hebt wichtige Details hervor, die dem Leser bewuss
