ideLogo\n\n**Typ:** `boolean`\n**Standard:** `false`\n\nDas Logo in der Header-Navigation ausblenden.\n\n```json\n{\n  \"site\": {\n    \"hideLogo\": true\n  }\n}\n```\n\nVerwenden Sie dies, wenn Sie nur den Texttitel ohne ein Logo anzeigen möchten.\n\n## Beispiele\n\n### Minimales Setup\n\nPerfekt für den Einstieg:\n\n```json\n{\n  \"site\": {\n    \"title\": \"Meine Docs\",\n    \"description\": \"Dokumentation für mein Projekt\"\n  }\n}\n```\n\n### Open Source Projekt\n\nFür ein Open-Source-Projekt auf GitHub:\n\n```json\n{\n  \"site\": {\n    \"title\": \"MyLib Dokumentation\",\n    \"description\": \"Eine leistungsstarke Bibliothek zum Erstellen toller Dinge\",\n    \"url\": \"https://mylib.dev\",\n    \"organizationName\": \"MyLib Contributors\",\n    \"projectName\": \"mylib\",\n    \"logo\": \"/logo.svg\",\n    \"favicon\": \"/favicon.ico\"\n  }\n}\n```\n\n### Firmenprodukt\n\nFür ein kommerzielles Produkt:\n\n```json\n{\n  \"site\": {\n    \"title\": \"Acme API Docs\",\n    \"description\": \"Vollständige API-Referenz und Anleitungen für Acme Plattform\",\n    \"url\": \"https://docs.acme.com\",\n    \"organizationName\": \"Acme Corporation\",\n    \"projectName\": \"acme-platform\",\n    \"activeVersion\": \"v2.0.0\",\n    \"logo\": {\n      \"light\": \"/acme-logo-light.svg\",\n      \"dark\": \"/acme-logo-dark.svg\"\n    },\n    \"favicon\": \"/favicon-32x32.png\"\n  }\n}\n```\n\n### Mehrsprachige Seite\n\nFür Dokumentation in mehreren Sprachen:\n\n```json\n{\n  \"site\": {\n    \"title\": \"Dokumentation\",\n    \"language\": \"es\",\n    \"url\": \"https://docs.example.com/es\",\n    \"logo\": \"/logo.svg\"\n  }\n}\n```\n\n## Häufige Muster\n\n### GitHub Pages Setup\n\nFür GitHub Pages ohne benutzerdefinierte Domain:\n\n```json\n{\n  \"site\": {\n    \"title\": \"Meine Docs\",\n    \"url\": \"https://username.github.io/repo-name\",\n    \"baseUrl\": \"/repo-name/\"\n  }\n}\n```\n\n### Logo Best Practices\n\n**Für Hintergrund im hellen Modus:**\nVerwenden Sie ein dunkles Logo oder ein Logo mit Farbe\n\n**Für Hintergrund im dunklen Modus:**\nVerwenden Sie ein helles/weißes Logo oder invertieren Sie Farben\n\n**Beispiel-Setup:**\n```json\n{\n  \"site\": {\n    \"logo\": {\n      \"light\": \"/logo-dark.svg\",\n      \"dark\": \"/logo-white.svg\"\n    }\n  }\n}\n```\n\n## Validierung\n\nSpecra validiert Ihre Seitenkonfiguration beim Start. Häufige Fehler:\n\n**Fehlender Titel:**\n```\n❌ Fehler: site.title ist erforderlich\n```\n\n**Ungültige URL:**\n```\n❌ Fehler: site.url muss eine gültige URL sein (inklusive https://)\n```\n\n**Logo-Datei nicht gefunden:**\n```\n⚠️ Warnung: Logo-Datei nicht gefunden unter /logo.svg\n```\n\n## Umgebungsvariablen\n\nVerwenden Sie Umgebungsvariablen für verschiedene Umgebungen:\n\n```json\n{\n  \"site\": {\n    \"url\": \"${SITE_URL}\",\n    \"logo\": \"${LOGO_PATH}\"\n  }\n}\n```\n\nDann setzen Sie sie:\n```bash\n# .env.local\nSITE_URL=https://docs.example.com\nLOGO_PATH=/logo.svg\n```\n\n## Nächste Schritte\n\n\u003cCardGrid cols={2}\u003e\n  \u003cCard\n    icon=\"layout\"\n    title=\"Navigation\"\n    description=\"Seitenleiste, Brotkrumen und Tab-Gruppen konfigurieren\"\n    href=\"/docs/v1.0.0/configuration/navigation\"\n  /\u003e\n  \u003cCard\n    icon=\"rocket\"\n    title=\"Bereitstellung\"\n    description=\"Bereitstellungskonfiguration einrichten\"\n    href=\"/docs/v1.0.0/configuration/deployment-config\"\n  /\u003e\n  \u003cCard\n    icon=\"sliders\"\n    title=\"Erweitert\"\n    description=\"Analytik, Suche und mehr\"\n    href=\"/docs/v1.0.0/configuration/advanced\"\n  /\u003e\n  \u003cCard\n    icon=\"arrow-left\"\n    title=\"Übersicht\"\n    description=\"Zurück zur Konfigurationsübersicht\"\n    href=\"/docs/v1.0.0/configuration/overview\"\n  /\u003e\n\u003c/CardGrid\u003e\n"])</script><script>self.__next_f.push([1,"27:T2293,"])</script><script>self.__next_f.push([1,"\n# Auf Vercel bereitstellen\n\nVercel ist der einfachste Weg, Ihre Specra-Dokumentation bereitzustellen. Es wurde von den Schöpfern von Next.js entwickelt, sodass alles sofort perfekt funktioniert.\n\n## Warum Vercel?\n\n- **Keine Konfiguration** - Automatische Erkennung und Einrichtung\n- **Sofortige Bereitstellungen** - Live in weniger als 60 Sekunden\n- **Automatisches HTTPS** - SSL-Zertifikate inklusive\n- **Edge-Netzwerk** - Schnelles Laden weltweit\n- **Vorschau-Bereitstellungen** - Jeder Git-Push erhält eine URL\n- **Kostenlose Stufe** - Großzügige Limits für Dokumentationsseiten\n\n## Schnelle Bereitstellung\n\n\u003cSteps\u003e\n  \u003cStep title=\"Zu GitHub pushen\"\u003e\n    Falls Sie es noch nicht getan haben, pushen Sie Ihr Projekt zu GitHub:\n\n```bash\ngit init\ngit add .\ngit commit -m \"Initial commit\"\ngit remote add origin https://github.com/username/repo.git\ngit push -u origin main\n```\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Zu Vercel importieren\"\u003e\n    1. Gehen Sie zu [vercel.com/new](https://vercel.com/new)\n    2. Klicken Sie auf \"Import Git Repository\"\n    3. Wählen Sie Ihr Dokumentations-Repository aus\n    4. Vercel erkennt Next.js automatisch und konfiguriert alles\n\n    Keine manuelle Konfiguration erforderlich!\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Bereitstellen\"\u003e\n    Klicken Sie auf \"Deploy\" und warten Sie etwa 30-60 Sekunden.\n\n    Sie erhalten eine Produktions-URL wie `ihr-projekt.vercel.app`\n  \u003c/Step\u003e\n\u003c/Steps\u003e\n\n\u003cCallout type=\"success\"\u003e\nDas war's! Ihre Dokumentation ist jetzt live mit automatischem HTTPS und globalem CDN.\n\u003c/Callout\u003e\n\n## Konfiguration\n\nVercel verwendet automatisch diese Einstellungen für Next.js-Projekte:\n\n| Einstellung | Wert |\n|-------------|------|\n| Build Command | `npm run build` |\n| Output Directory | `.next` |\n| Install Command | `npm install` |\n| Node Version | 20.x (latest LTS) |\n\n### Einstellungen überschreiben (Optional)\n\nWenn Sie benutzerdefinierte Einstellungen benötigen, erstellen Sie `vercel.json`:\n\n```json\n{\n  \"buildCommand\": \"npm run build\",\n  \"outputDirectory\": \".next\",\n  \"installCommand\": \"npm ci\",\n  \"framework\": \"nextjs\",\n  \"regions\": [\"iad1\"]\n}\n```\n\n## Umgebungsvariablen\n\nFügen Sie Umgebungsvariablen im Vercel-Dashboard hinzu:\n\n\u003cSteps\u003e\n  \u003cStep title=\"Zu Systemeinstellungen gehen\"\u003e\n    Klicken Sie auf Ihr Projekt → Settings → Environment Variables\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Variablen hinzufügen\"\u003e\n    Fügen Sie Ihre Variablen einzeln hinzu:\n\n```\nMEILISEARCH_HOST=https://search.example.com\nMEILISEARCH_API_KEY=ihr-such-schluessel\nNEXT_PUBLIC_GA_ID=G-XXXXXXXXXX\n```\n\n\u003cCallout type=\"tip\"\u003e\nVariablen, die mit `NEXT_PUBLIC_` beginnen, sind für den Browser sichtbar. Halten Sie sensible Schlüssel ohne dieses Präfix.\n\u003c/Callout\u003e\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Neu bereitstellen\"\u003e\n    Umgebungsänderungen erfordern eine neue Bereitstellung. Gehen Sie zu Deployments → Klicken Sie auf die drei Punkte → Redeploy.\n  \u003c/Step\u003e\n\u003c/Steps\u003e\n\n## Benutzerdefinierte Domain\n\nFügen Sie Ihre eigene Domain zu Ihrem Vercel-Projekt hinzu:\n\n\u003cSteps\u003e\n  \u003cStep title=\"Domain hinzufügen\"\u003e\n    1. Gehen Sie zu Project Settings → Domains\n    2. Geben Sie Ihre Domain ein (z.B. `docs.example.com`)\n    3. Klicken Sie auf \"Add\"\n  \u003c/Step\u003e\n\n  \u003cStep title=\"DNS konfigurieren\"\u003e\n    Vercel zeigt Ihnen die hinzuzufügenden DNS-Einträge. Typischerweise:\n\n**Für Subdomain (docs.example.com):**\n```\nTyp: CNAME\nName: docs\nWert: cname.vercel-dns.com\n```\n\n**Für Apex-Domain (example.com):**\n```\nTyp: A\nName: @\nWert: 76.76.21.21\n```\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Auf Verifizierung warten\"\u003e\n    Die DNS-Verbreitung dauert 5 Minuten bis 48 Stunden (normalerweise unter einer Stunde).\n\n    Vercel stellt automatisch ein SSL-Zertifikat bereit, sobald DNS verifiziert ist.\n  \u003c/Step\u003e\n\u003c/Steps\u003e\n\n## Automatische Bereitstellungen\n\nJeder Git-Push löst eine Bereitstellung aus:\n\n**Produktions-Bereitstellungen:**\n- Commits zum `main`-Branch werden live geschaltet\n- Aktualisiert Ihre Live-Site automatisch\n\n**Vorschau-Bereitstellungen:**\n- Commits zu anderen Branches erhalten Vorschau-URLs\n- Pull Requests erhalten eindeutige URLs zum Testen\n- Perfekt zum Überprüfen von Änderungen vor dem Zusammenführen\n\n### Vorschau-URLs\n\nJede Vorschau-Bereitstellung erhält eine eindeutige URL:\n\n```\nihr-projekt-git-feature-branch-username.vercel.app\n```\n\nTeilen Sie diese mit Ihrem Team, um Änderungen zu überprüfen, bevor sie live gehen.\n\n## Bereitstellungseinstellungen\n\n### Branch-Konfiguration\n\nSteuern Sie, welche Branches bereitgestellt werden:\n\n1. Gehen Sie zu Settings → Git\n2. Setzen Sie Production Branch (normalerweise `main`)\n3. Aktivieren/deaktivieren Sie Vorschau-Bereitstellungen für andere Branches\n\n### Bereitstellungsschutz\n\nSchützen Sie Produktions-Bereitstellungen:\n\n```json\n{\n  \"git\": {\n    \"deploymentEnabled\": {\n      \"main\": true,\n      \"staging\": \"preview\"\n    }\n  }\n}\n```\n\n## Leistungsoptimierung\n\nVercel optimiert Ihre Bereitstellung automatisch:\n\n- **Edge-Caching** - Statische Dateien weltweit zwischengespeichert\n- **Bildoptimierung** - Next.js Image-Komponente automatisch optimiert\n- **Kompression** - Gzip/Brotli-Kompression aktiviert\n- **HTTP/2** - Schnellere gemultiplexte Verbindungen\n\n### Analytik\n\nAktivieren Sie Vercel Analytics kostenlos:\n\n1. Gehen Sie zum Analytics-Tab\n2. Klicken Sie auf \"Enable Analytics\"\n3. Fügen Sie die Analytics-Komponente zu Ihrem Layout hinzu\n\n```tsx\n// app/layout.tsx\nimport { Analytics } from '@vercel/analytics/react'\n\nexport default function RootLayout({ children }) {\n  return (\n    \u003chtml\u003e\n      \u003cbody\u003e\n        {children}\n        \u003cAnalytics /\u003e\n      \u003c/body\u003e\n    \u003c/html\u003e\n  )\n}\n```\n\n## CI/CD-Integration\n\nVercel fungiert als Ihre CI/CD-Pipeline:\n\n**Was bei jeder Bereitstellung läuft:**\n- `npm install` (Abhängigkeiten)\n- `npm run build` (Next.js Build)\n- Automatische Überprüfungen und Validierungen\n- Bereitstellung im Edge-Netzwerk\n\n### GitHub-Integration\n\nVercel kommentiert Pull Requests mit:\n- Vorschau-Bereitstellungs-URL\n- Build-Logs\n- Leistungseinblicke\n\n### Build-Logs\n\nDetaillierte Build-Logs anzeigen:\n1. Gehen Sie zu Deployments\n2. Klicken Sie auf eine beliebige Bereitstellung\n3. Sehen Sie sich den Building-Abschnitt für Logs an\n\n## Fehlerbehebung\n\n### Build fehlgeschlagen\n\n**Node-Version überprüfen:**\nStellen Sie sicher, dass Sie Node 18+ verwenden. Zu `package.json` hinzufügen:\n\n```json\n{\n  \"engines\": {\n    \"node\": \"\u003e=18.0.0\"\n  }\n}\n```\n\n**Build-Cache leeren:**\n1. Gehen Sie zu Settings → General\n2. Scrollen Sie zu Build \u0026 Development Settings\n3. Build-Cache leeren\n\n### Umgebungsvariablen funktionieren nicht\n\n- Variablennamen überprüfen (Groß-/Kleinschreibung beachten)\n- Clientseitige Variablen mit `NEXT_PUBLIC_` präfixen\n- Nach Änderung von Variablen neu bereitstellen\n\n### Benutzerdefinierte Domain funktioniert nicht\n\n- Überprüfen Sie, ob DNS-Einträge korrekt sind\n- Warten Sie auf DNS-Verbreitung (überprüfen Sie mit `dig` oder `nslookup`)\n- Stellen Sie sicher, dass CNAME auf `cname.vercel-dns.com` zeigt\n- Überprüfen Sie den Domain-Verifizierungsstatus im Vercel-Dashboard\n\n## Monorepo-Bereitstellung\n\nWenn sich Ihre Docs in einem Monorepo befinden:\n\n1. Setzen Sie Root Directory in den Projekteinstellungen\n2. Verweisen Sie auf Ihren Docs-Ordner (z.B. `apps/docs`)\n3. Vercel baut nur dieses Verzeichnis\n\n```json\n{\n  \"buildCommand\": \"cd ../.. \u0026\u0026 npm run build:docs\",\n  \"outputDirectory\": \".next\"\n}\n```\n\n## Best Practices\n\n**Vorschau-Bereitstellungen verwenden** - Änderungen testen, bevor sie in main zusammengeführt werden\n\n**Branch-Schutz aktivieren** - Vorschau-Bereitstellungserfolg vor dem Zusammenführen erfordern\n\n**Benachrichtigungen einrichten** - Slack/E-Mail-Warnungen für Bereitstellungsstatus erhalten\n\n**Analytik überwachen** - Seitenaufrufe und Leistung verfolgen\n\n**Edge-Konfiguration verwenden** - Feature-Flags und Konfiguration am Edge für sofortige Updates speichern\n\n## Preise\n\nDie kostenlose Stufe von Vercel beinhaltet:\n- Unbegrenzte Bereitstellungen\n- 100GB Bandbreite/Monat\n- Automatisches HTTPS\n- Vorschau-Bereitstellungen\n- Analytik (Basis)\n\nDies reicht normalerweise für Dokumentationsseiten aus. Upgrade auf Pro, wenn erforderlich:\n- Mehr Bandbreite\n- Erweiterte Analytik\n- Passwortschutz\n- Enterprise-Support\n\n## Nächste Schritte\n\n\u003cCardGrid cols={2}\u003e\n  \u003cCard\n    icon=\"github\"\n    title=\"GitHub Pages\"\n    description=\"Als statische Seite auf GitHub Pages bereitstellen\"\n    href=\"/docs/v1.0.0/deployment/github-pages\"\n  /\u003e\n  \u003cCard\n    icon=\"globe\"\n    title=\"Netlify\"\n    description=\"Alternative statische Hosting-Plattform\"\n    href=\"/docs/v1.0.0/deployment/netlify\"\n  /\u003e\n  \u003cCard\n    icon=\"arrow-left\"\n    title=\"Bereitstellungsübersicht\"\n    description=\"Zurück zu Bereitstellungsoptionen\"\n    href=\"/docs/v1.0.0/deployment/overview\"\n  /\u003e\n  \u003cCard\n    icon=\"zap\"\n    title=\"Leistung\"\n    description=\"Ihre Dokumentation optimieren\"\n    href=\"/docs/v1.0.0/performance\"\n  /\u003e\n\u003c/CardGrid\u003e\n"])</script><script>self.__next_f.push([1,"28:T2293,"])</script><script>self.__next_f.push([1,"\n# Auf Vercel bereitstellen\n\nVercel ist der einfachste Weg, Ihre Specra-Dokumentation bereitzustellen. Es wurde von den Schöpfern von Next.js entwickelt, sodass alles sofort perfekt funktioniert.\n\n## Warum Vercel?\n\n- **Keine Konfiguration** - Automatische Erkennung und Einrichtung\n- **Sofortige Bereitstellungen** - Live in weniger als 60 Sekunden\n- **Automatisches HTTPS** - SSL-Zertifikate inklusive\n- **Edge-Netzwerk** - Schnelles Laden weltweit\n- **Vorschau-Bereitstellungen** - Jeder Git-Push erhält eine URL\n- **Kostenlose Stufe** - Großzügige Limits für Dokumentationsseiten\n\n## Schnelle Bereitstellung\n\n\u003cSteps\u003e\n  \u003cStep title=\"Zu GitHub pushen\"\u003e\n    Falls Sie es noch nicht getan haben, pushen Sie Ihr Projekt zu GitHub:\n\n```bash\ngit init\ngit add .\ngit commit -m \"Initial commit\"\ngit remote add origin https://github.com/username/repo.git\ngit push -u origin main\n```\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Zu Vercel importieren\"\u003e\n    1. Gehen Sie zu [vercel.com/new](https://vercel.com/new)\n    2. Klicken Sie auf \"Import Git Repository\"\n    3. Wählen Sie Ihr Dokumentations-Repository aus\n    4. Vercel erkennt Next.js automatisch und konfiguriert alles\n\n    Keine manuelle Konfiguration erforderlich!\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Bereitstellen\"\u003e\n    Klicken Sie auf \"Deploy\" und warten Sie etwa 30-60 Sekunden.\n\n    Sie erhalten eine Produktions-URL wie `ihr-projekt.vercel.app`\n  \u003c/Step\u003e\n\u003c/Steps\u003e\n\n\u003cCallout type=\"success\"\u003e\nDas war's! Ihre Dokumentation ist jetzt live mit automatischem HTTPS und globalem CDN.\n\u003c/Callout\u003e\n\n## Konfiguration\n\nVercel verwendet automatisch diese Einstellungen für Next.js-Projekte:\n\n| Einstellung | Wert |\n|-------------|------|\n| Build Command | `npm run build` |\n| Output Directory | `.next` |\n| Install Command | `npm install` |\n| Node Version | 20.x (latest LTS) |\n\n### Einstellungen überschreiben (Optional)\n\nWenn Sie benutzerdefinierte Einstellungen benötigen, erstellen Sie `vercel.json`:\n\n```json\n{\n  \"buildCommand\": \"npm run build\",\n  \"outputDirectory\": \".next\",\n  \"installCommand\": \"npm ci\",\n  \"framework\": \"nextjs\",\n  \"regions\": [\"iad1\"]\n}\n```\n\n## Umgebungsvariablen\n\nFügen Sie Umgebungsvariablen im Vercel-Dashboard hinzu:\n\n\u003cSteps\u003e\n  \u003cStep title=\"Zu Systemeinstellungen gehen\"\u003e\n    Klicken Sie auf Ihr Projekt → Settings → Environment Variables\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Variablen hinzufügen\"\u003e\n    Fügen Sie Ihre Variablen einzeln hinzu:\n\n```\nMEILISEARCH_HOST=https://search.example.com\nMEILISEARCH_API_KEY=ihr-such-schluessel\nNEXT_PUBLIC_GA_ID=G-XXXXXXXXXX\n```\n\n\u003cCallout type=\"tip\"\u003e\nVariablen, die mit `NEXT_PUBLIC_` beginnen, sind für den Browser sichtbar. Halten Sie sensible Schlüssel ohne dieses Präfix.\n\u003c/Callout\u003e\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Neu bereitstellen\"\u003e\n    Umgebungsänderungen erfordern eine neue Bereitstellung. Gehen Sie zu Deployments → Klicken Sie auf die drei Punkte → Redeploy.\n  \u003c/Step\u003e\n\u003c/Steps\u003e\n\n## Benutzerdefinierte Domain\n\nFügen Sie Ihre eigene Domain zu Ihrem Vercel-Projekt hinzu:\n\n\u003cSteps\u003e\n  \u003cStep title=\"Domain hinzufügen\"\u003e\n    1. Gehen Sie zu Project Settings → Domains\n    2. Geben Sie Ihre Domain ein (z.B. `docs.example.com`)\n    3. Klicken Sie auf \"Add\"\n  \u003c/Step\u003e\n\n  \u003cStep title=\"DNS konfigurieren\"\u003e\n    Vercel zeigt Ihnen die hinzuzufügenden DNS-Einträge. Typischerweise:\n\n**Für Subdomain (docs.example.com):**\n```\nTyp: CNAME\nName: docs\nWert: cname.vercel-dns.com\n```\n\n**Für Apex-Domain (example.com):**\n```\nTyp: A\nName: @\nWert: 76.76.21.21\n```\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Auf Verifizierung warten\"\u003e\n    Die DNS-Verbreitung dauert 5 Minuten bis 48 Stunden (normalerweise unter einer Stunde).\n\n    Vercel stellt automatisch ein SSL-Zertifikat bereit, sobald DNS verifiziert ist.\n  \u003c/Step\u003e\n\u003c/Steps\u003e\n\n## Automatische Bereitstellungen\n\nJeder Git-Push löst eine Bereitstellung aus:\n\n**Produktions-Bereitstellungen:**\n- Commits zum `main`-Branch werden live geschaltet\n- Aktualisiert Ihre Live-Site automatisch\n\n**Vorschau-Bereitstellungen:**\n- Commits zu anderen Branches erhalten Vorschau-URLs\n- Pull Requests erhalten eindeutige URLs zum Testen\n- Perfekt zum Überprüfen von Änderungen vor dem Zusammenführen\n\n### Vorschau-URLs\n\nJede Vorschau-Bereitstellung erhält eine eindeutige URL:\n\n```\nihr-projekt-git-feature-branch-username.vercel.app\n```\n\nTeilen Sie diese mit Ihrem Team, um Änderungen zu überprüfen, bevor sie live gehen.\n\n## Bereitstellungseinstellungen\n\n### Branch-Konfiguration\n\nSteuern Sie, welche Branches bereitgestellt werden:\n\n1. Gehen Sie zu Settings → Git\n2. Setzen Sie Production Branch (normalerweise `main`)\n3. Aktivieren/deaktivieren Sie Vorschau-Bereitstellungen für andere Branches\n\n### Bereitstellungsschutz\n\nSchützen Sie Produktions-Bereitstellungen:\n\n```json\n{\n  \"git\": {\n    \"deploymentEnabled\": {\n      \"main\": true,\n      \"staging\": \"preview\"\n    }\n  }\n}\n```\n\n## Leistungsoptimierung\n\nVercel optimiert Ihre Bereitstellung automatisch:\n\n- **Edge-Caching** - Statische Dateien weltweit zwischengespeichert\n- **Bildoptimierung** - Next.js Image-Komponente automatisch optimiert\n- **Kompression** - Gzip/Brotli-Kompression aktiviert\n- **HTTP/2** - Schnellere gemultiplexte Verbindungen\n\n### Analytik\n\nAktivieren Sie Vercel Analytics kostenlos:\n\n1. Gehen Sie zum Analytics-Tab\n2. Klicken Sie auf \"Enable Analytics\"\n3. Fügen Sie die Analytics-Komponente zu Ihrem Layout hinzu\n\n```tsx\n// app/layout.tsx\nimport { Analytics } from '@vercel/analytics/react'\n\nexport default function RootLayout({ children }) {\n  return (\n    \u003chtml\u003e\n      \u003cbody\u003e\n        {children}\n        \u003cAnalytics /\u003e\n      \u003c/body\u003e\n    \u003c/html\u003e\n  )\n}\n```\n\n## CI/CD-Integration\n\nVercel fungiert als Ihre CI/CD-Pipeline:\n\n**Was bei jeder Bereitstellung läuft:**\n- `npm install` (Abhängigkeiten)\n- `npm run build` (Next.js Build)\n- Automatische Überprüfungen und Validierungen\n- Bereitstellung im Edge-Netzwerk\n\n### GitHub-Integration\n\nVercel kommentiert Pull Requests mit:\n- Vorschau-Bereitstellungs-URL\n- Build-Logs\n- Leistungseinblicke\n\n### Build-Logs\n\nDetaillierte Build-Logs anzeigen:\n1. Gehen Sie zu Deployments\n2. Klicken Sie auf eine beliebige Bereitstellung\n3. Sehen Sie sich den Building-Abschnitt für Logs an\n\n## Fehlerbehebung\n\n### Build fehlgeschlagen\n\n**Node-Version überprüfen:**\nStellen Sie sicher, dass Sie Node 18+ verwenden. Zu `package.json` hinzufügen:\n\n```json\n{\n  \"engines\": {\n    \"node\": \"\u003e=18.0.0\"\n  }\n}\n```\n\n**Build-Cache leeren:**\n1. Gehen Sie zu Settings → General\n2. Scrollen Sie zu Build \u0026 Development Settings\n3. Build-Cache leeren\n\n### Umgebungsvariablen funktionieren nicht\n\n- Variablennamen überprüfen (Groß-/Kleinschreibung beachten)\n- Clientseitige Variablen mit `NEXT_PUBLIC_` präfixen\n- Nach Änderung von Variablen neu bereitstellen\n\n### Benutzerdefinierte Domain funktioniert nicht\n\n- Überprüfen Sie, ob DNS-Einträge korrekt sind\n- Warten Sie auf DNS-Verbreitung (überprüfen Sie mit `dig` oder `nslookup`)\n- Stellen Sie sicher, dass CNAME auf `cname.vercel-dns.com` zeigt\n- Überprüfen Sie den Domain-Verifizierungsstatus im Vercel-Dashboard\n\n## Monorepo-Bereitstellung\n\nWenn sich Ihre Docs in einem Monorepo befinden:\n\n1. Setzen Sie Root Directory in den Projekteinstellungen\n2. Verweisen Sie auf Ihren Docs-Ordner (z.B. `apps/docs`)\n3. Vercel baut nur dieses Verzeichnis\n\n```json\n{\n  \"buildCommand\": \"cd ../.. \u0026\u0026 npm run build:docs\",\n  \"outputDirectory\": \".next\"\n}\n```\n\n## Best Practices\n\n**Vorschau-Bereitstellungen verwenden** - Änderungen testen, bevor sie in main zusammengeführt werden\n\n**Branch-Schutz aktivieren** - Vorschau-Bereitstellungserfolg vor dem Zusammenführen erfordern\n\n**Benachrichtigungen einrichten** - Slack/E-Mail-Warnungen für Bereitstellungsstatus erhalten\n\n**Analytik überwachen** - Seitenaufrufe und Leistung verfolgen\n\n**Edge-Konfiguration verwenden** - Feature-Flags und Konfiguration am Edge für sofortige Updates speichern\n\n## Preise\n\nDie kostenlose Stufe von Vercel beinhaltet:\n- Unbegrenzte Bereitstellungen\n- 100GB Bandbreite/Monat\n- Automatisches HTTPS\n- Vorschau-Bereitstellungen\n- Analytik (Basis)\n\nDies reicht normalerweise für Dokumentationsseiten aus. Upgrade auf Pro, wenn erforderlich:\n- Mehr Bandbreite\n- Erweiterte Analytik\n- Passwortschutz\n- Enterprise-Support\n\n## Nächste Schritte\n\n\u003cCardGrid cols={2}\u003e\n  \u003cCard\n    icon=\"github\"\n    title=\"GitHub Pages\"\n    description=\"Als statische Seite auf GitHub Pages bereitstellen\"\n    href=\"/docs/v1.0.0/deployment/github-pages\"\n  /\u003e\n  \u003cCard\n    icon=\"globe\"\n    title=\"Netlify\"\n    description=\"Alternative statische Hosting-Plattform\"\n    href=\"/docs/v1.0.0/deployment/netlify\"\n  /\u003e\n  \u003cCard\n    icon=\"arrow-left\"\n    title=\"Bereitstellungsübersicht\"\n    description=\"Zurück zu Bereitstellungsoptionen\"\n    href=\"/docs/v1.0.0/deployment/overview\"\n  /\u003e\n  \u003cCard\n    icon=\"zap\"\n    title=\"Leistung\"\n    description=\"Ihre Dokumentation optimieren\"\n    href=\"/docs/v1.0.0/performance\"\n  /\u003e\n\u003c/CardGrid\u003e\n"])</script><script>self.__next_f.push([1,"29:T17bd,"])</script><script>self.__next_f.push([1,"\n# Erste Schritte mit Specra\n\nDieser Leitfaden bringt Sie in weniger als 5 Minuten von Null auf eine voll funktionsfähige Dokumentationsseite. Wir behandeln die Installation, die grundlegende Konfiguration und das Schreiben Ihrer ersten Seite.\n\n## Voraussetzungen\n\nBevor Sie beginnen, stellen Sie sicher, dass Sie Folgendes haben:\n- **Node.js 18 oder höher** (prüfen mit `node --version`)\n- Einen Paketmanager: **npm** (kommt mit Node.js), **yarn** oder **pnpm**\n- Einen Code-Editor (VS Code empfohlen für MDX-Unterstützung)\n\n## Installation\n\nDer schnellste Weg zum Einstieg ist die Verwendung von `create-specra`, unserem Scaffolding-Tool, das alles für Sie einrichtet.\n\n\u003cSteps\u003e\n  \u003cStep title=\"Erstellen Sie Ihr Projekt\"\u003e\n    Führen Sie den Erstellbefehl mit Ihremjektnamen aus:\n\n    \u003cTabs defaultValue=\"npm\"\u003e\n      \u003cTab label=\"npm\"\u003e\n```bash\nnpx create-specra@latest my-docs\n```\n      \u003c/Tab\u003e\n      \u003cTab label=\"yarn\"\u003e\n```bash\nyarn create specra my-docs\n```\n      \u003c/Tab\u003e\n      \u003cTab label=\"pnpm\"\u003e\n```bash\npnpm create specra my-docs\n```\n      \u003c/Tab\u003e\n    \u003c/Tabs\u003e\n\n    Dies erstellt ein neues Verzeichnis namens `my-docs` mit allen Dateien, die Sie für den Einstieg benötigen.\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Navigieren und Installieren\"\u003e\n    Wechseln Sie in Ihr neues Projekt und installieren Sie Abhängigkeiten:\n\n    \u003cTabs defaultValue=\"npm\"\u003e\n      \u003cTab label=\"npm\"\u003e\n```bash\ncd my-docs\nnpm install\n```\n      \u003c/Tab\u003e\n      \u003cTab label=\"yarn\"\u003e\n```bash\ncd my-docs\nyarn install\n```\n      \u003c/Tab\u003e\n      \u003cTab label=\"pnpm\"\u003e\n```bash\ncd my-docs\npnpm install\n```\n      \u003c/Tab\u003e\n    \u003c/Tabs\u003e\n\n    Die Installation dauert je nach Internetverbindung in der Regel 30-60 Sekunden.\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Starten Sie den Entwicklungs-Server\"\u003e\n    Starten Sie den Entwicklungsserver:\n\n    \u003cTabs defaultValue=\"npm\"\u003e\n      \u003cTab label=\"npm\"\u003e\n```bash\nnpm run dev\n```\n      \u003c/Tab\u003e\n      \u003cTab label=\"yarn\"\u003e\n```bash\nyarn dev\n```\n      \u003c/Tab\u003e\n      \u003cTab label=\"pnpm\"\u003e\n```bash\npnpm dev\n```\n      \u003c/Tab\u003e\n    \u003c/Tabs\u003e\n\n    Öffnen Sie [http://localhost:3000](http://localhost:3000) in Ihrem Browser. Sie sollten Ihre Dokumentationsseite mit Beispielinhalten sehen!\n\n    \u003cCallout type=\"success\"\u003e\n    Der Entwicklungsserver enthält Hot Reload. Bearbeiten Sie eine beliebige MDX-Datei und beobachten Sie, wie Ihre Änderungen sofort erscheinen.\n    \u003c/Callout\u003e\n  \u003c/Step\u003e\n\u003c/Steps\u003e\n\n## Projektstruktur\n\nNach dem Ausführen von `create-specra`, hier ist, was Sie erhalten:\n\n```txt\nmy-docs/\n├── app/                     # Next.js App Router\n│   ├── layout.tsx           # Root-Layout mit Specra-Providern\n│   ├── page.tsx             # Startseite\n│   └── docs/                # Dokumentations-Routen\n│       └── [...slug]/       # Dynamische Catch-All-Route\n│           └── page.tsx     # Doc-Seiten-Renderer\n├── docs/                    # Ihre Dokumentationsinhalte\n│   └── v1.0.0/             # Versionsordner\n│       ├── about.mdx\n│       ├── getting-started.mdx\n│       └── guides/         # Ordner-Gruppierung\n│           ├── _category_.json\n│           └── writing.mdx\n├── public/                  # Statische Assets (Bilder, Icons)\n├── specra.config.json      # Specra-Konfiguration\n├── package.json\n├── next.config.mjs         # Next.js-Konfiguration\n└── tailwind.config.ts      # Tailwind-Konfiguration\n```\n\n\u003cCallout type=\"info\"\u003e\n**Wichtig:** Alle Dokumentationsdateien müssen die Erweiterung `.mdx` verwenden, nicht `.md`. MDX ermöglicht es Ihnen, React-Komponenten neben Markdown zu verwenden.\n\u003c/Callout\u003e\n\n## Ihre erste Dokumentationsseite\n\nLassen Sie uns Ihre erste benutzerdefinierte Dokumentationsseite erstellen.\n\n\u003cSteps\u003e\n  \u003cStep title=\"Neue Datei erstellen\"\u003e\n    Erstellen Sie in `docs/v1.0.0/` eine Datei namens `hello.mdx`:\n\n```mdx\n---\ntitle: Hallo Specra\ndescription: Meine erste Dokumentationsseite\nsidebar_position: 3\n---\n\n# Hallo Specra!\n\nDies ist meine erste Dokumentationsseite. Ich kann **fetten Text**,\n*kursiven Text* und sogar [Links](https://specra.dev) verwenden.\n\n## Funktionen, die ich liebe\n\n- Schneller Hot Reload\n- Schöne Komponenten\n- Einfache Dateistruktur\n- Null Konfiguration erforderlich\n```\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Ihre Seite ansehen\"\u003e\n    Speichern Sie die Datei und besuchen Sie [http://localhost:3000/docs/v1.0.0/hello](http://localhost:3000/docs/v1.0.0/hello)\n\n    Sie sollten Ihre neue Seite in der Seitenleiste sehen und schön im Hauptinhaltsbereich gerendert.\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Eine Komponente hinzufügen\"\u003e\n    Lassen Sie es uns mit einer Callout-Komponente interessanter machen:\n\n```mdx\n---\ntitle: Hallo Specra\ndescription: Meine erste Dokumentationsseite\nsidebar_position: 3\n---\n\n# Hallo Specra!\n\nDies ist meine erste Dokumentationsseite.\n\n\u003cCallout type=\"success\"\u003e\n  Ich habe gerade eine interaktive Komponente zu meinem Markdown hinzugefügt! Keine Importe erforderlich.\n\u003c/Callout\u003e\n\n## Nächste Schritte\n\nBereit, mehr zu lernen? Schauen Sie sich den Abschnitt [Komponenten](/docs/v1.0.0/components) an.\n```\n\n    Speichern Sie und sehen Sie zu, wie es sofort aktualisiert wird. Beachten Sie, dass Sie die Callout-Komponente nicht importieren mussten - sie ist automatisch in allen Ihren MDX-Dateien verfügbar.\n  \u003c/Step\u003e\n\u003c/Steps\u003e\n\n## Nächste Schritte\n\nSie haben jetzt eine funktionierende Specra-Seite und kennen die Grundlagen der Seitenerstellung. Hier geht es weiter:\n\n\u003cCardGrid cols={2}\u003e\n  \u003cCard icon=\"settings\" title=\"Konfigurieren Sie Ihre Seite\" description=\"Passen Sie Branding, Navigation und Funktionen an\" href=\"/docs/v1.0.0/configuration/overview\" /\u003e\n  \u003cCard icon=\"palette\" title=\"Komponenten erkunden\" description=\"Erfahren Sie mehr über alle verfügbaren UI-Komponenten\" href=\"/docs/v1.0.0/components\" /\u003e\n  \u003cCard icon=\"rocket\" title=\"Bereitstellen\" description=\"Versenden Sie Ihre Dokumentation in die Produktion\" href=\"/docs/v1.0.0/deployment/overview\" /\u003e\n  \u003cCard icon=\"zap\" title=\"Erweiterte Funktionen\" description=\"Versionierung, Suche, API-Docs und mehr\" href=\"/docs/v1.0.0/features\" /\u003e\n\u003c/CardGrid\u003e\n"])</script><script>self.__next_f.push([1,"2a:T17bd,"])</script><script>self.__next_f.push([1,"\n# Erste Schritte mit Specra\n\nDieser Leitfaden bringt Sie in weniger als 5 Minuten von Null auf eine voll funktionsfähige Dokumentationsseite. Wir behandeln die Installation, die grundlegende Konfiguration und das Schreiben Ihrer ersten Seite.\n\n## Voraussetzungen\n\nBevor Sie beginnen, stellen Sie sicher, dass Sie Folgendes haben:\n- **Node.js 18 oder höher** (prüfen mit `node --version`)\n- Einen Paketmanager: **npm** (kommt mit Node.js), **yarn** oder **pnpm**\n- Einen Code-Editor (VS Code empfohlen für MDX-Unterstützung)\n\n## Installation\n\nDer schnellste Weg zum Einstieg ist die Verwendung von `create-specra`, unserem Scaffolding-Tool, das alles für Sie einrichtet.\n\n\u003cSteps\u003e\n  \u003cStep title=\"Erstellen Sie Ihr Projekt\"\u003e\n    Führen Sie den Erstellbefehl mit Ihremjektnamen aus:\n\n    \u003cTabs defaultValue=\"npm\"\u003e\n      \u003cTab label=\"npm\"\u003e\n```bash\nnpx create-specra@latest my-docs\n```\n      \u003c/Tab\u003e\n      \u003cTab label=\"yarn\"\u003e\n```bash\nyarn create specra my-docs\n```\n      \u003c/Tab\u003e\n      \u003cTab label=\"pnpm\"\u003e\n```bash\npnpm create specra my-docs\n```\n      \u003c/Tab\u003e\n    \u003c/Tabs\u003e\n\n    Dies erstellt ein neues Verzeichnis namens `my-docs` mit allen Dateien, die Sie für den Einstieg benötigen.\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Navigieren und Installieren\"\u003e\n    Wechseln Sie in Ihr neues Projekt und installieren Sie Abhängigkeiten:\n\n    \u003cTabs defaultValue=\"npm\"\u003e\n      \u003cTab label=\"npm\"\u003e\n```bash\ncd my-docs\nnpm install\n```\n      \u003c/Tab\u003e\n      \u003cTab label=\"yarn\"\u003e\n```bash\ncd my-docs\nyarn install\n```\n      \u003c/Tab\u003e\n      \u003cTab label=\"pnpm\"\u003e\n```bash\ncd my-docs\npnpm install\n```\n      \u003c/Tab\u003e\n    \u003c/Tabs\u003e\n\n    Die Installation dauert je nach Internetverbindung in der Regel 30-60 Sekunden.\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Starten Sie den Entwicklungs-Server\"\u003e\n    Starten Sie den Entwicklungsserver:\n\n    \u003cTabs defaultValue=\"npm\"\u003e\n      \u003cTab label=\"npm\"\u003e\n```bash\nnpm run dev\n```\n      \u003c/Tab\u003e\n      \u003cTab label=\"yarn\"\u003e\n```bash\nyarn dev\n```\n      \u003c/Tab\u003e\n      \u003cTab label=\"pnpm\"\u003e\n```bash\npnpm dev\n```\n      \u003c/Tab\u003e\n    \u003c/Tabs\u003e\n\n    Öffnen Sie [http://localhost:3000](http://localhost:3000) in Ihrem Browser. Sie sollten Ihre Dokumentationsseite mit Beispielinhalten sehen!\n\n    \u003cCallout type=\"success\"\u003e\n    Der Entwicklungsserver enthält Hot Reload. Bearbeiten Sie eine beliebige MDX-Datei und beobachten Sie, wie Ihre Änderungen sofort erscheinen.\n    \u003c/Callout\u003e\n  \u003c/Step\u003e\n\u003c/Steps\u003e\n\n## Projektstruktur\n\nNach dem Ausführen von `create-specra`, hier ist, was Sie erhalten:\n\n```txt\nmy-docs/\n├── app/                     # Next.js App Router\n│   ├── layout.tsx           # Root-Layout mit Specra-Providern\n│   ├── page.tsx             # Startseite\n│   └── docs/                # Dokumentations-Routen\n│       └── [...slug]/       # Dynamische Catch-All-Route\n│           └── page.tsx     # Doc-Seiten-Renderer\n├── docs/                    # Ihre Dokumentationsinhalte\n│   └── v1.0.0/             # Versionsordner\n│       ├── about.mdx\n│       ├── getting-started.mdx\n│       └── guides/         # Ordner-Gruppierung\n│           ├── _category_.json\n│           └── writing.mdx\n├── public/                  # Statische Assets (Bilder, Icons)\n├── specra.config.json      # Specra-Konfiguration\n├── package.json\n├── next.config.mjs         # Next.js-Konfiguration\n└── tailwind.config.ts      # Tailwind-Konfiguration\n```\n\n\u003cCallout type=\"info\"\u003e\n**Wichtig:** Alle Dokumentationsdateien müssen die Erweiterung `.mdx` verwenden, nicht `.md`. MDX ermöglicht es Ihnen, React-Komponenten neben Markdown zu verwenden.\n\u003c/Callout\u003e\n\n## Ihre erste Dokumentationsseite\n\nLassen Sie uns Ihre erste benutzerdefinierte Dokumentationsseite erstellen.\n\n\u003cSteps\u003e\n  \u003cStep title=\"Neue Datei erstellen\"\u003e\n    Erstellen Sie in `docs/v1.0.0/` eine Datei namens `hello.mdx`:\n\n```mdx\n---\ntitle: Hallo Specra\ndescription: Meine erste Dokumentationsseite\nsidebar_position: 3\n---\n\n# Hallo Specra!\n\nDies ist meine erste Dokumentationsseite. Ich kann **fetten Text**,\n*kursiven Text* und sogar [Links](https://specra.dev) verwenden.\n\n## Funktionen, die ich liebe\n\n- Schneller Hot Reload\n- Schöne Komponenten\n- Einfache Dateistruktur\n- Null Konfiguration erforderlich\n```\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Ihre Seite ansehen\"\u003e\n    Speichern Sie die Datei und besuchen Sie [http://localhost:3000/docs/v1.0.0/hello](http://localhost:3000/docs/v1.0.0/hello)\n\n    Sie sollten Ihre neue Seite in der Seitenleiste sehen und schön im Hauptinhaltsbereich gerendert.\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Eine Komponente hinzufügen\"\u003e\n    Lassen Sie es uns mit einer Callout-Komponente interessanter machen:\n\n```mdx\n---\ntitle: Hallo Specra\ndescription: Meine erste Dokumentationsseite\nsidebar_position: 3\n---\n\n# Hallo Specra!\n\nDies ist meine erste Dokumentationsseite.\n\n\u003cCallout type=\"success\"\u003e\n  Ich habe gerade eine interaktive Komponente zu meinem Markdown hinzugefügt! Keine Importe erforderlich.\n\u003c/Callout\u003e\n\n## Nächste Schritte\n\nBereit, mehr zu lernen? Schauen Sie sich den Abschnitt [Komponenten](/docs/v1.0.0/components) an.\n```\n\n    Speichern Sie und sehen Sie zu, wie es sofort aktualisiert wird. Beachten Sie, dass Sie die Callout-Komponente nicht importieren mussten - sie ist automatisch in allen Ihren MDX-Dateien verfügbar.\n  \u003c/Step\u003e\n\u003c/Steps\u003e\n\n## Nächste Schritte\n\nSie haben jetzt eine funktionierende Specra-Seite und kennen die Grundlagen der Seitenerstellung. Hier geht es weiter:\n\n\u003cCardGrid cols={2}\u003e\n  \u003cCard icon=\"settings\" title=\"Konfigurieren Sie Ihre Seite\" description=\"Passen Sie Branding, Navigation und Funktionen an\" href=\"/docs/v1.0.0/configuration/overview\" /\u003e\n  \u003cCard icon=\"palette\" title=\"Komponenten erkunden\" description=\"Erfahren Sie mehr über alle verfügbaren UI-Komponenten\" href=\"/docs/v1.0.0/components\" /\u003e\n  \u003cCard icon=\"rocket\" title=\"Bereitstellen\" description=\"Versenden Sie Ihre Dokumentation in die Produktion\" href=\"/docs/v1.0.0/deployment/overview\" /\u003e\n  \u003cCard icon=\"zap\" title=\"Erweiterte Funktionen\" description=\"Versionierung, Suche, API-Docs und mehr\" href=\"/docs/v1.0.0/features\" /\u003e\n\u003c/CardGrid\u003e\n"])</script><script>self.__next_f.push([1,"2b:T936,"])</script><script>self.__next_f.push([1,"\nDiese Seite demonstriert die `\u003cApiReference\u003e`-Komponente unter Verwendung einer echten öffentlichen API ([JSONPlaceholder](https://jsonplaceholder.typicode.com/)).\n\nAlle untenstehenden Endpunkte sind **voll funktionsfähig** und können mit dem interaktiven Playground getestet werden!\n\n\u003cCallout type=\"info\"\u003e\nDiese API ist kostenlos und erfordert keine Authentifizierung. Perfekt zum Testen!\n\u003c/Callout\u003e\n\n---\n\n\u003cApiReference spec=\"/api-specs/test-api.json\" showPlayground={true} /\u003e\n\n---\n\n## Probieren Sie es selbst\n\n1. **Erweitern Sie einen beliebigen Endpunkt**, indem Sie darauf klicken\n2. **Scrollen Sie zum Playground** am Ende jedes Endpunkts\n3. **Klicken Sie auf \"Request senden\"**, um die API live zu testen\n4. **Sehen Sie sich die Antwort** im JSON-Viewer an\n\n## Über JSONPlaceholder\n\n[JSONPlaceholder](https://jsonplaceholder.typicode.com/) ist eine kostenlose gefälschte REST-API zum Testen und Prototyping. Es ist perfekt für:\n\n- Testen von API-Dokumentationstools (wie diesem!)\n- Frontend-Entwicklung\n- Lernen von HTTP-Methoden\n- Prototyping von Anwendungen\n\n\u003cCallout type=\"success\" title=\"Profi-Tipp\"\u003e\nVersuchen Sie, den Request-Body in den POST/PUT/PATCH-Endpunkten zu ändern, und sehen Sie, wie sich die Antwort ändert!\n\u003c/Callout\u003e\n\n## Beispiel-Integration\n\nSo könnten Sie diese API in einer echten Anwendung verwenden:\n\n```javascript\n// Alle Beiträge abrufen\nasync function getPosts() {\n  const response = await fetch('https://jsonplaceholder.typicode.com/posts?_limit=5');\n  const posts = await response.json();\n  return posts;\n}\n\n// Einen neuen Beitrag erstellen\nasync function createPost(title, body) {\n  const response = await fetch('https://jsonplaceholder.typicode.com/posts', {\n    method: 'POST',\n    headers: { 'Content-Type': 'application/json' },\n    body: JSON.stringify({\n      title,\n      body,\n      userId: 1\n    })\n  });\n  return await response.json();\n}\n\n// Verwendung\nconst posts = await getPosts();\nconsole.log(posts);\n\nconst newPost = await createPost('My Title', 'My Content');\nconsole.log(newPost);\n```\n\n## Nächste Schritte\n\n- Schauen Sie sich das [Beispiel für manuelle API-Dokumentation](/docs/v1.0.0/api-example) an\n- Erfahren Sie mehr über das [Erstellen Ihrer eigenen API-Spezifikation](/docs/v1.0.0/api-auto-generated)\n- Lesen Sie den vollständigen [API-Dokumentationsleitfaden](/API_DOCUMENTATION.md)\n"])</script><script>self.__next_f.push([1,"2c:T936,"])</script><script>self.__next_f.push([1,"\nDiese Seite demonstriert die `\u003cApiReference\u003e`-Komponente unter Verwendung einer echten öffentlichen API ([JSONPlaceholder](https://jsonplaceholder.typicode.com/)).\n\nAlle untenstehenden Endpunkte sind **voll funktionsfähig** und können mit dem interaktiven Playground getestet werden!\n\n\u003cCallout type=\"info\"\u003e\nDiese API ist kostenlos und erfordert keine Authentifizierung. Perfekt zum Testen!\n\u003c/Callout\u003e\n\n---\n\n\u003cApiReference spec=\"/api-specs/test-api.json\" showPlayground={true} /\u003e\n\n---\n\n## Probieren Sie es selbst\n\n1. **Erweitern Sie einen beliebigen Endpunkt**, indem Sie darauf klicken\n2. **Scrollen Sie zum Playground** am Ende jedes Endpunkts\n3. **Klicken Sie auf \"Request senden\"**, um die API live zu testen\n4. **Sehen Sie sich die Antwort** im JSON-Viewer an\n\n## Über JSONPlaceholder\n\n[JSONPlaceholder](https://jsonplaceholder.typicode.com/) ist eine kostenlose gefälschte REST-API zum Testen und Prototyping. Es ist perfekt für:\n\n- Testen von API-Dokumentationstools (wie diesem!)\n- Frontend-Entwicklung\n- Lernen von HTTP-Methoden\n- Prototyping von Anwendungen\n\n\u003cCallout type=\"success\" title=\"Profi-Tipp\"\u003e\nVersuchen Sie, den Request-Body in den POST/PUT/PATCH-Endpunkten zu ändern, und sehen Sie, wie sich die Antwort ändert!\n\u003c/Callout\u003e\n\n## Beispiel-Integration\n\nSo könnten Sie diese API in einer echten Anwendung verwenden:\n\n```javascript\n// Alle Beiträge abrufen\nasync function getPosts() {\n  const response = await fetch('https://jsonplaceholder.typicode.com/posts?_limit=5');\n  const posts = await response.json();\n  return posts;\n}\n\n// Einen neuen Beitrag erstellen\nasync function createPost(title, body) {\n  const response = await fetch('https://jsonplaceholder.typicode.com/posts', {\n    method: 'POST',\n    headers: { 'Content-Type': 'application/json' },\n    body: JSON.stringify({\n      title,\n      body,\n      userId: 1\n    })\n  });\n  return await response.json();\n}\n\n// Verwendung\nconst posts = await getPosts();\nconsole.log(posts);\n\nconst newPost = await createPost('My Title', 'My Content');\nconsole.log(newPost);\n```\n\n## Nächste Schritte\n\n- Schauen Sie sich das [Beispiel für manuelle API-Dokumentation](/docs/v1.0.0/api-example) an\n- Erfahren Sie mehr über das [Erstellen Ihrer eigenen API-Spezifikation](/docs/v1.0.0/api-auto-generated)\n- Lesen Sie den vollständigen [API-Dokumentationsleitfaden](/API_DOCUMENTATION.md)\n"])</script><script>self.__next_f.push([1,"2d:T26d7,"])</script><script>self.__next_f.push([1,"\n# Navigations-Konfiguration\n\nDer Abschnitt `navigation` steuert, wie sich Benutzer durch Ihre Dokumentation bewegen. Konfigurieren Sie die Seitenleiste, Brotkrumen, das Inhaltsverzeichnis und Tab-Gruppen, um ein intuitives Navigationserlebnis zu schaffen.\n\n## Grundkonfiguration\n\nHier ist ein minimales Navigations-Setup:\n\n```json\n{\n  \"navigation\": {\n    \"showSidebar\": true,\n    \"showBreadcrumbs\": true,\n    \"showTableOfContents\": true\n  }\n}\n```\n\nSpecra bietet sinnvolle Standardwerte, sodass Sie nur konfigurieren müssen, was Sie ändern möchten.\n\n## Vollständige Konfiguration\n\n```json\n{\n  \"navigation\": {\n    \"showSidebar\": true,\n    \"collapsibleSidebar\": true,\n    \"showBreadcrumbs\": true,\n    \"showTableOfContents\": true,\n    \"tocPosition\": \"right\",\n    \"tocMaxDepth\": 3,\n    \"tabGroups\": [\n      {\n        \"id\": \"guides\",\n        \"label\": \"Anleitungen\",\n        \"icon\": \"book-open\"\n      },\n      {\n        \"id\": \"api\",\n        \"label\": \"API-Referenz\",\n        \"icon\": \"zap\"\n      },\n      {\n        \"id\": \"components\",\n        \"label\": \"Komponenten\",\n        \"icon\": \"layers\"\n      }\n    ]\n  }\n}\n```\n\n## Seitenleisten-Konfiguration\n\n### showSidebar\n\n**Typ:** `boolean`\n**Standard:** `true`\n\nSeitenleisten-Navigation anzeigen oder ausblenden.\n\n```json\n{\n  \"navigation\": {\n    \"showSidebar\": true\n  }\n}\n```\n\nSetzen Sie dies auf `false`, um die Seitenleiste vollständig auszublenden. Nützlich für Landing-Pages oder Marketing-Websites.\n\n### collapsibleSidebar\n\n**Typ:** `boolean`\n**Standard:** `true`\n\nBenutzern erlauben, Seitenleisten-Abschnitte ein- und auszuklappen.\n\n```json\n{\n  \"navigation\": {\n    \"collapsibleSidebar\": true\n  }\n}\n```\n\nWenn `true`, haben Ordner-Abschnitte Pfeile zum Ein-/Ausklappen. Wenn `false`, sind alle Abschnitte immer ausgeklappt.\n\n## Brotkrumen (Breadcrumbs)\n\n### showBreadcrumbs\n\n**Typ:** `boolean`\n**Standard:** `true`\n\nBrotkrumen-Navigation oben auf jeder Seite anzeigen.\n\n```json\n{\n  \"navigation\": {\n    \"showBreadcrumbs\": true\n  }\n}\n```\n\nBrotkrumen zeigen den Ort der Seite in der Dokumentationshierarchie:\n\n```\nHome \u003e Anleitungen \u003e Erste Schritte\n```\n\n\u003cCallout type=\"tip\"\u003e\nBrotkrumen helfen Benutzern zu verstehen, wo sie sich befinden, und zu übergeordneten Abschnitten zurückzunavigieren.\n\u003c/Callout\u003e\n\n## Inhaltsverzeichnis (Table of Contents)\n\n### showTableOfContents\n\n**Typ:** `boolean`\n**Standard:** `true`\n\nDas Inhaltsverzeichnis (TOC) auf Dokumentationsseiten anzeigen.\n\n```json\n{\n  \"navigation\": {\n    \"showTableOfContents\": true\n  }\n}\n```\n\nDas TOC zeigt alle Überschriften auf der aktuellen Seite mit Links zum Scrollen zu jedem Abschnitt.\n\n### tocPosition\n\n**Typ:** `\"left\"` oder `\"right\"`\n**Standard:** `\"right\"`\n\nPositionieren Sie das Inhaltsverzeichnis auf der linken oder rechten Seite der Seite.\n\n```json\n{\n  \"navigation\": {\n    \"tocPosition\": \"right\"\n  }\n}\n```\n\n**Rechte Position (Standard):**\n- TOC erscheint in der rechten Seitenleiste\n- Traditionelles Dokumentationslayout\n- Mehr Leseraum für Inhalt\n\n**Linke Position:**\n- TOC erscheint in der linken Seitenleiste unter der Hauptnavigation\n- Kompaktes Layout\n- Weniger horizontales Scrollen auf kleineren Bildschirmen\n\n### tocMaxDepth\n\n**Typ:** `number` (1-6)\n**Standard:** `3`\n\nMaximale Überschriftsebene, die im Inhaltsverzeichnis angezeigt werden soll.\n\n```json\n{\n  \"navigation\": {\n    \"tocMaxDepth\": 3\n  }\n}\n```\n\n**Optionen:**\n- `1` - Nur H1-Überschriften\n- `2` - H1- und H2-Überschriften\n- `3` - H1-, H2- und H3-Überschriften (empfohlen)\n- `4` - Bis zu H4\n- `5` - Bis zu H5\n- `6` - Alle Überschriften\n\n\u003cCallout type=\"warning\"\u003e\nWenn dieser Wert zu hoch eingestellt wird (5 oder 6), kann das TOC überladen wirken. Die meisten Docs funktionieren am besten mit 2 oder 3.\n\u003c/Callout\u003e\n\n## Tab-Gruppen\n\nTab-Gruppen organisieren Ihre Dokumentation in logische Abschnitte mit separaten Navigations-Tabs.\n\n### Einfache Tab-Gruppen\n\n```json\n{\n  \"navigation\": {\n    \"tabGroups\": [\n      {\n        \"id\": \"guides\",\n        \"label\": \"Anleitungen\",\n        \"icon\": \"book-open\"\n      },\n      {\n        \"id\": \"api\",\n        \"label\": \"API-Referenz\",\n        \"icon\": \"zap\"\n      }\n    ]\n  }\n}\n```\n\n### Tab-Gruppen-Eigenschaften\n\nJede Tab-Gruppe hat drei Eigenschaften:\n\n**id** (erforderlich)\n- Eindeutige Kennung für die Tab-Gruppe\n- Verwendet im Seiten-Frontmatter: `tab_group: \"guides\"`\n- Kleinbuchstaben, keine Leerzeichen\n\n**label** (erforderlich)\n- Anzeigename, der im Tab angezeigt wird\n- Kann Leerzeichen und Großschreibung enthalten\n\n**icon** (optional)\n- Lucide-Icon-Name zur Anzeige neben dem Label\n- Macht Tabs visueller und leichter scanbar\n\n### Seiten zu Tab-Gruppen zuweisen\n\nGeben Sie in Ihrem MDX-Frontmatter an, zu welcher Tab-Gruppe eine Seite gehört:\n\n```mdx\n---\ntitle: Erste Schritte\ntab_group: guides\n---\n```\n\nSeiten mit demselben `tab_group`-Wert erscheinen zusammen unter diesem Tab.\n\n### Häufige Tab-Gruppen-Setups\n\n**Dokumentation + API:**\n```json\n{\n  \"tabGroups\": [\n    {\n      \"id\": \"docs\",\n      \"label\": \"Dokumentation\",\n      \"icon\": \"book\"\n    },\n    {\n      \"id\": \"api\",\n      \"label\": \"API-Referenz\",\n      \"icon\": \"code\"\n    }\n  ]\n}\n```\n\n**Anleitungen + Komponenten + API:**\n```json\n{\n  \"tabGroups\": [\n    {\n      \"id\": \"guides\",\n      \"label\": \"Anleitungen\",\n      \"icon\": \"book-open\"\n    },\n    {\n      \"id\": \"components\",\n      \"label\": \"Komponenten\",\n      \"icon\": \"layers\"\n    },\n    {\n      \"id\": \"api\",\n      \"label\": \"API\",\n      \"icon\": \"zap\"\n    }\n  ]\n}\n```\n\n**Multi-Produkt-Dokumentation:**\n```json\n{\n  \"tabGroups\": [\n    {\n      \"id\": \"platform\",\n      \"label\": \"Plattform\",\n      \"icon\": \"box\"\n    },\n    {\n      \"id\": \"mobile\",\n      \"label\": \"Mobile SDK\",\n      \"icon\": \"smartphone\"\n    },\n    {\n      \"id\": \"web\",\n      \"label\": \"Web SDK\",\n      \"icon\": \"monitor\"\n    }\n  ]\n}\n```\n\n## Verfügbare Icons\n\nSpecra verwendet Lucide-Icons. Beliebte Auswahl für Dokumentation:\n\n**Allgemein:**\n- `book` - Bücher, Dokumentation\n- `book-open` - Offenes Buch, Lesen\n- `file-text` - Dokumente, Seiten\n- `layout` - Layout, Struktur\n\n**Technisch:**\n- `code` - Code, Programmierung\n- `zap` - API, schnell, dynamisch\n- `terminal` - CLI, Befehlszeile\n- `database` - Datenbank, Dateien\n\n**UI:**\n- `layers` - Komponenten, Stack\n- `palette` - Design, Theming\n- `settings` - Konfiguration\n- `grid` - Layout-Raster\n\n**Aktionen:**\n- `rocket` - Start, Bereitstellung\n- `wrench` - Werkzeuge, Utilities\n- `shield` - Sicherheit\n- `search` - Suche, Finden\n\nDurchsuchen Sie alle Icons auf [lucide.dev](https://lucide.dev/icons/)\n\n## Seitenleisten-Organisation\n\n### Automatische Generierung\n\nSpecra generiert Ihre Seitenleiste automatisch aus Ihrer Dateistruktur:\n\n```txt\ndocs/v1.0.0/\n├── getting-started.mdx        → Erste Schritte\n├── installation.mdx           → Installation\n└── guides/                    → Anleitungen (Ordner)\n    ├── basics.mdx            →   Grundlagen\n    └── advanced.mdx          →   Fortgeschritten\n```\n\n### Reihenfolge steuern\n\nVerwenden Sie `sidebar_position` im Frontmatter, um die Seitenreihenfolge zu steuern:\n\n```mdx\n---\ntitle: Erste Schritte\nsidebar_position: 1\n---\n```\n\nNiedrigere Zahlen erscheinen zuerst. Seiten ohne Positionen werden alphabetisch sortiert.\n\n### Kategorie-Konfiguration\n\nPassen Sie das Erscheinungsbild von Ordnern mit `_category_.json` an:\n\n```json\n{\n  \"label\": \"Benutzerhandbücher\",\n  \"position\": 2,\n  \"collapsible\": true,\n  \"collapsed\": false,\n  \"icon\": \"book-open\"\n}\n```\n\nSiehe [Inhalte schreiben](/docs/v1.0.0/writing-content) für mehr zur Organisation von Inhalten.\n\n## Beispiele\n\n### Minimales Setup\n\nEinfach die Grundlagen aktivieren:\n\n```json\n{\n  \"navigation\": {\n    \"showSidebar\": true,\n    \"showBreadcrumbs\": true,\n    \"showTableOfContents\": true\n  }\n}\n```\n\n### Sauberes Layout\n\nTOC links, tiefere Überschriften:\n\n```json\n{\n  \"navigation\": {\n    \"showSidebar\": true,\n    \"collapsibleSidebar\": true,\n    \"showBreadcrumbs\": true,\n    \"showTableOfContents\": true,\n    \"tocPosition\": \"left\",\n    \"tocMaxDepth\": 4\n  }\n}\n```\n\n### Mehrteilige Dokumentation\n\nMit Tab-Gruppen für verschiedene Zielgruppen:\n\n```json\n{\n  \"navigation\": {\n    \"showSidebar\": true,\n    \"collapsibleSidebar\": true,\n    \"showBreadcrumbs\": true,\n    \"showTableOfContents\": true,\n    \"tocPosition\": \"right\",\n    \"tocMaxDepth\": 3,\n    \"tabGroups\": [\n      {\n        \"id\": \"getting-started\",\n        \"label\": \"Erste Schritte\",\n        \"icon\": \"rocket\"\n      },\n      {\n        \"id\": \"developers\",\n        \"label\": \"Entwickler\",\n        \"icon\": \"code\"\n      },\n      {\n        \"id\": \"designers\",\n        \"label\": \"Designer\",\n        \"icon\": \"palette\"\n      }\n    ]\n  }\n}\n```\n\n## Best Practices\n\n**Tab-Gruppen weise verwenden** - Erstellen Sie nicht zu viele. 3-5 Tabs Maximum funktioniert am besten.\n\n**Beschreibende Labels wählen** - Machen Sie offensichtlich, was in jedem Tab oder Abschnitt enthalten ist.\n\n**Geeignete Icons wählen** - Icons sollten den Zweck des Tabs verstärken.\n\n**tocMaxDepth angemessen setzen** - Die meisten Docs funktionieren am besten mit 2 oder 3 Ebenen.\n\n**Seitenleiste einklappbar halten** - Lassen Sie Benutzer Abschnitte ausblenden, die sie nic
