"error\"\u003e\n  Hebt kritische Probleme hervor oder Dinge, die Benutzer vermeiden sollten.\n\u003c/Callout\u003e\n```\n  \u003c/Tab\u003e\n\u003c/Tabs\u003e\n\n### Gefahr (Danger)\n\n\u003cTabs defaultValue=\"Preview\"\u003e\n  \u003cTab label=\"Vorschau\"\u003e\n\u003cCallout type=\"danger\"\u003e\n  Warnt vor potenziell destruktiven oder irreversiblen Aktionen.\n\u003c/Callout\u003e\n  \u003c/Tab\u003e\n  \u003cTab label=\"Code\"\u003e\n```mdx\n\u003cCallout type=\"danger\"\u003e\n  Warnt vor potenziell destruktiven oder irreversiblen Aktionen.\n\u003c/Callout\u003e\n```\n  \u003c/Tab\u003e\n\u003c/Tabs\u003e\n\n## Props\n\n| Prop | Typ | Standard | Beschreibung |\n|------|-----|----------|--------------|\n| `type` | `string` | `\"info\"` | Callout-Stil: `info`, `note`, `tip`, `warning`, `success`, `error` oder `danger` |\n| `children` | `ReactNode` | Erforderlich | Der Inhalt innerhalb des Callouts |\n\n## Erweiterte Beispiele\n\n### Mehrzeiliger Inhalt\n\nCallouts können beliebigen MDX-Inhalt enthalten, einschließlich formatiertem Text, Listen und Code:\n\n\u003cTabs defaultValue=\"Preview\"\u003e\n  \u003cTab label=\"Vorschau\"\u003e\n\u003cCallout type=\"warning\"\u003e\n  **Wichtige Überlegungen vor der Bereitstellung:**\n\n  - Sichern Sie Ihre Datenbank\n  - Testen Sie zuerst in der Staging-Umgebung\n  - Benachrichtigen Sie Ihr Team über Ausfallzeiten\n\n  Führen Sie `npm run db:backup` aus, um ein Backup zu erstellen.\n\u003c/Callout\u003e\n  \u003c/Tab\u003e\n  \u003cTab label=\"Code\"\u003e\n```mdx\n\u003cCallout type=\"warning\"\u003e\n  **Wichtige Überlegungen vor der Bereitstellung:**\n\n  - Sichern Sie Ihre Datenbank\n  - Testen Sie zuerst in der Staging-Umgebung\n  - Benachrichtigen Sie Ihr Team über Ausfallzeiten\n\n  Führen Sie `npm run db:backup` aus, um ein Backup zu erstellen.\n\u003c/Callout\u003e\n```\n  \u003c/Tab\u003e\n\u003c/Tabs\u003e\n\n### Verschachtelte Komponenten\n\nSie können andere Komponenten innerhalb von Callouts verschachteln:\n\n\u003cTabs defaultValue=\"Preview\"\u003e\n  \u003cTab label=\"Vorschau\"\u003e\n\u003cCallout type=\"info\"\u003e\n  **Profi-Tipp:** Verwenden Sie Codeblöcke, um Beispiele zu zeigen\n\n  \u003cTabs defaultValue=\"js\"\u003e\n    \u003cTab label=\"JavaScript\"\u003e\n      console.log(\"Hallo!\")\n    \u003c/Tab\u003e\n    \u003cTab label=\"Python\"\u003e\n      print(\"Hallo!\")\n    \u003c/Tab\u003e\n  \u003c/Tabs\u003e\n\u003c/Callout\u003e\n  \u003c/Tab\u003e\n  \u003cTab label=\"Code\"\u003e\n```mdx\n\u003cCallout type=\"info\"\u003e\n  **Profi-Tipp:** Verwenden Sie Codeblöcke, um Beispiele zu zeigen\n\n  \u003cTabs defaultValue=\"js\"\u003e\n    \u003cTab label=\"JavaScript\"\u003e\n      console.log(\"Hallo!\")\n    \u003c/Tab\u003e\n    \u003cTab label=\"Python\"\u003e\n      print(\"Hallo!\")\n    \u003c/Tab\u003e\n  \u003c/Tabs\u003e\n\u003c/Callout\u003e\n```\n  \u003c/Tab\u003e\n\u003c/Tabs\u003e\n\n## GitHub-Style Alerts\n\nBevorzugen Sie Markdown-Syntax? Specra unterstützt auch GitHub-Style Alert-Syntax unter Verwendung von Blockquotes:\n\n\u003cTabs defaultValue=\"Preview\"\u003e\n  \u003cTab label=\"Vorschau\"\u003e\n\u003e [!NOTE]\n\u003e Dies ist ein Hinweis mit GitHub-Style Syntax.\n\n\u003e [!TIP]\n\u003e Dies ist ein Tipp mit Blockquote-Syntax.\n\n\u003e [!WARNING]\n\u003e Dies ist eine Warnmeldung.\n  \u003c/Tab\u003e\n  \u003cTab label=\"Code\"\u003e\n```markdown\n\u003e [!NOTE]\n\u003e Dies ist ein Hinweis mit GitHub-Style Syntax.\n\n\u003e [!TIP]\n\u003e Dies ist ein Tipp mit Blockquote-Syntax.\n\n\u003e [!WARNING]\n\u003e Dies ist eine Warnmeldung.\n```\n  \u003c/Tab\u003e\n\u003c/Tabs\u003e\n\n**Unterstützte Alert-Typen:**\n- `[!NOTE]` - Dasselbe wie type=\"note\"\n- `[!TIP]` - Dasselbe wie type=\"tip\"\n- `[!IMPORTANT]` - Dasselbe wie type=\"warning\"\n- `[!WARNING]` - Dasselbe wie type=\"warning\"\n- `[!CAUTION]` - Dasselbe wie type=\"danger\"\n\n## Wann welcher Typ zu verwenden ist\n\n**Info** - Zusätzlicher Kontext, der das Verständnis verbessert\n- \"Sie können dies auch über die CLI erreichen\"\n- \"Diese Funktion ist in v2.0 und später verfügbar\"\n\n**Note** - Wichtige Informationen, die nicht übersprungen werden sollten\n- \"Diese Einstellung betrifft alle Benutzer in Ihrer Organisation\"\n- \"Änderungen werden nach dem Server-Neustart wirksam\"\n\n**Tip** - Best Practices und hilfreiche Vorschläge\n- \"Für bessere Leistung aktivieren Sie Caching\"\n- \"Verwenden Sie TypeScript für bessere Autovervollständigung\"\n\n**Warning** - Potenzielle Probleme oder Breaking Changes\n- \"Dies wird Ihr Datenbankschema ändern\"\n- \"Veraltet in v3.0, verwenden Sie stattdessen newMethod()\"\n\n**Success** - Positive Bestätigungen\n- \"Setup abgeschlossen! Ihre Seite ist bereit\"\n- \"Alle Tests erfolgreich bestanden\"\n\n**Error** - Kritische Probleme, die vermieden werden sollten\n- \"Legen Sie Ihren API-Schlüssel nicht im Client-Code offen\"\n- \"Dieser Vorgang kann nicht rückgängig gemacht werden\"\n\n**Danger** - Destruktive oder irreversible Aktionen\n- \"Dies wird dauerhaft alle Daten löschen\"\n- \"Fortfahren wird alle Zugriffstoken widerrufen\"\n\n## Barrierefreiheit\n\nCallouts sind semantisch und barrierefrei:\n\n- Verwendet geeignete ARIA-Rollen\n- Screenreader-freundlich\n- Tastaturnavigierbar\n- Farbkontrastkonform (WCAG AA)\n- Icons sind dekorativ mit passendem Alt-Text\n\n## Verwandte Komponenten\n\n\u003cCardGrid cols={3}\u003e\n  \u003cCard icon=\"square\" title=\"Card\" href=\"/docs/v1.0.0/components/card\" /\u003e\n  \u003cCard icon=\"message-square\" title=\"Badge\" href=\"/docs/v1.0.0/components/badge\" /\u003e\n  \u003cCard icon=\"layers\" title=\"Akkordeon\" href=\"/docs/v1.0.0/components/accordion\" /\u003e\n\u003c/CardGrid\u003e\n"])</script><script>self.__next_f.push([1,"37:T21be,"])</script><script>self.__next_f.push([1,"\n# Bereitstellungskonfiguration\n\nDer Abschnitt `deployment` teilt Specra mit, wie Ihre Dokumentation für verschiedene Hosting-Plattformen erstellt werden soll. Dies stellt sicher, dass Assets korrekt geladen werden und Ihre Website überall funktioniert, wo Sie sie bereitstellen.\n\n## Warum Bereitstellungskonfiguration wichtig ist\n\nVerschiedene Plattformen stellen Ihre Website von verschiedenen URLs bereit:\n\n- **Vercel:** `yoursite.vercel.app` (bereitgestellt von root `/`)\n- **GitHub Pages (keine benutzerdefinierte Domain):** `username.github.io/repo-name` (bereitgestellt von `/repo-name/`)\n- **Netlify:** `yoursite.netlify.app` (bereitgestellt von root `/`)\n\nSpecra muss Ihr Bereitstellungsziel kennen, um Asset-Pfade korrekt zu konfigurieren.\n\n## Grundkonfiguration\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"vercel\"\n  }\n}\n```\n\nDas ist alles, was Sie für die meisten Bereitstellungen benötigen. Specra erledigt den Rest automatisch.\n\n## Vollständige Konfiguration\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"vercel\",\n    \"basePath\": \"\",\n    \"customDomain\": false\n  }\n}\n```\n\n## Konfigurationsoptionen\n\n### target\n\n**Typ:** `string`\n**Standard:** `\"vercel\"`\n\nIhre Bereitstellungsplattform. Dies bestimmt, welchen Build-Prozess Specra verwendet.\n\n**Verfügbare Ziele:**\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"vercel\"\n  }\n}\n```\n\n**Optionen:**\n- `\"vercel\"` - Vercel, Railway, Render oder jedes Node.js-Hosting\n- `\"github-pages\"` - GitHub Pages ohne benutzerdefinierte Domain\n- `\"static\"` - Statisches Hosting (Netlify, Cloudflare Pages)\n- `\"custom-domain-static\"` - GitHub Pages mit benutzerdefinierter Domain\n\n### basePath\n\n**Typ:** `string`\n**Standard:** `\"\"`\n\nBasispfad für Ihre Website. Nur erforderlich für GitHub Pages ohne benutzerdefinierte Domain.\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"github-pages\",\n    \"basePath\": \"mein-repo\"\n  }\n}\n```\n\n**Wann basePath zu verwenden ist:**\n\n✅ **GitHub Pages ohne benutzerdefinierte Domain**\n```\nURL: username.github.io/mein-repo\nConfig: \"basePath\": \"mein-repo\"\n```\n\n❌ **GitHub Pages mit benutzerdefinierter Domain**\n```\nURL: docs.example.com\nConfig: \"basePath\": \"\"\n```\n\n❌ **Vercel, Netlify, etc.**\n```\nURL: yoursite.vercel.app\nConfig: \"basePath\": \"\"\n```\n\n\u003cCallout type=\"warning\"\u003e\nDer basePath muss exakt mit Ihrem Repository-Namen übereinstimmen. Wenn sie nicht übereinstimmen, geben Assets 404-Fehler zurück.\n\u003c/Callout\u003e\n\n### customDomain\n\n**Typ:** `boolean`\n**Standard:** `false`\n\nSetzen Sie dies auf `true`, wenn Sie eine benutzerdefinierte Domain mit GitHub Pages verwenden.\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"github-pages\",\n    \"customDomain\": true,\n    \"basePath\": \"\"\n  }\n}\n```\n\nDies weist Specra an, Assets vom Root `/` anstatt von `/repo-name/` bereitzustellen.\n\n## Plattformspezifische Konfigurationen\n\n### Vercel\n\nDie Standardkonfiguration funktioniert perfekt:\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"vercel\"\n  }\n}\n```\n\n**Build-Befehl:** `npm run build`\n**Ausgabe:** `.next` Verzeichnis\n**Kein basePath erforderlich**\n\n### GitHub Pages (Keine benutzerdefinierte Domain)\n\nFür `username.github.io/repo-name`:\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"github-pages\",\n    \"basePath\": \"repo-name\",\n    \"customDomain\": false\n  }\n}\n```\n\n**Build-Befehl:** `npm run build:export`\n**Ausgabe:** `out` Verzeichnis\n**Assets laden von:** `/repo-name/_next/...`\n\n### GitHub Pages (Mit benutzerdefinierter Domain)\n\nFür `docs.example.com`:\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"custom-domain-static\",\n    \"basePath\": \"\",\n    \"customDomain\": true\n  }\n}\n```\n\nFügen Sie auch `public/CNAME` hinzu:\n```\ndocs.example.com\n```\n\n**Build-Befehl:** `npm run build:export`\n**Ausgabe:** `out` Verzeichnis\n**Assets laden von:** `/_next/...`\n\n### Netlify\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"static\"\n  }\n}\n```\n\n**Build-Befehl:** `npm run build:export`\n**Ausgabe:** `out` Verzeichnis\n**Kein basePath erforderlich**\n\n### Cloudflare Pages\n\nDas Gleiche wie Netlify:\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"static\"\n  }\n}\n```\n\n## Wie es funktioniert\n\n### Build-Modi\n\nSpecra hat zwei Build-Modi:\n\n**1. Standalone (Node.js Hosting)**\n- Verwendet für: Vercel, Railway, Render\n- Befehl: `npm run build`\n- Ausgabe: `.next` Verzeichnis\n- Läuft als Node.js-Server\n- Unterstützt dynamische Funktionen\n\n**2. Statischer Export (Statisches Hosting)**\n- Verwendet für: GitHub Pages, Netlify, Cloudflare Pages\n- Befehl: `npm run build:export`\n- Ausgabe: `out` Verzeichnis\n- Reine HTML/CSS/JS-Dateien\n- Kein Server erforderlich\n\nDas `deployment.target` bestimmt, welcher Modus verwendet wird.\n\n### Asset-Pfad-Auflösung\n\nSpecra verwendet das `getAssetPath()`-Dienstprogramm, um Asset-URLs zu verarbeiten:\n\n```typescript\n// Passt sich automatisch basierend auf der Bereitstellungskonfiguration an\ngetAssetPath('/images/logo.png')\n\n// Vercel: /images/logo.png\n// GitHub Pages (keine benutzerdefinierte Domain): /repo-name/images/logo.png\n// GitHub Pages (benutzerdefinierte Domain): /images/logo.png\n```\n\nSie müssen sich darüber keine Sorgen machen – Specra erledigt das automatisch basierend auf Ihrer Konfiguration.\n\n## Plattformen wechseln\n\n### Von Vercel zu GitHub Pages\n\n1. Konfiguration aktualisieren:\n```json\n{\n  \"deployment\": {\n    \"target\": \"github-pages\",\n    \"basePath\": \"ihr-repo-name\"\n  }\n}\n```\n\n2. Build-Befehl ändern:\n```bash\nnpm run build:export  # anstatt npm run build\n```\n\n3. `out/`-Ordner anstelle von `.next/` bereitstellen\n\n### Von GitHub Pages zu Netlify\n\n1. Konfiguration aktualisieren:\n```json\n{\n  \"deployment\": {\n    \"target\": \"static\",\n    \"basePath\": \"\"\n  }\n}\n```\n\n2. Weiterhin `npm run build:export` verwenden\n\n3. Netlify stellt von Root bereit, also basePath entfernen\n\n## Lokal testen\n\n### Statischen Export testen\n\n```bash\nnpm run build:export\nnpx serve out\n```\n\nÖffnen Sie die angezeigte URL (normalerweise `http://localhost:3000`). Überprüfen Sie:\n- Seiten laden korrekt\n- Bilder erscheinen\n- Links funktionieren\n- Navigation funktioniert\n\n### Mit basePath testen\n\nWenn Sie basePath verwenden, testen Sie lokal mit einem Server, der diesen respektiert:\n\n```bash\nnpm run build:export\nnpx serve out -s -p 3000\n```\n\nBesuchen Sie dann `http://localhost:3000/ihr-repo-name`, um GitHub Pages zu simulieren.\n\n## Fehlerbehebung\n\n### Assets geben 404 zurück\n\n**Überprüfen, ob basePath mit Repo-Namen übereinstimmt:**\n```json\n{\n  \"deployment\": {\n    \"basePath\": \"exakter-repo-name\"  // Muss exakt übereinstimmen\n  }\n}\n```\n\n**Überprüfen, ob Sie den richtigen Build-Befehl verwenden:**\n- GitHub Pages: `npm run build:export` (nicht `npm run build`)\n- Vercel: `npm run build` (nicht `npm run build:export`)\n\n### Leere Seite nach Bereitstellung\n\n**Überprüfen, ob das Ziel korrekt ist:**\n- GitHub Pages benötigt `\"target\": \"github-pages\"`\n- Netlify benötigt `\"target\": \"static\"`\n- Vercel benötigt `\"target\": \"vercel\"`\n\n**Überprüfen, ob Bereitstellungseinstellungen mit Konfiguration übereinstimmen:**\n- Ausgabeverzeichnis sollte dem Build-Modus entsprechen\n- Build-Befehl sollte dem Ziel entsprechen\n\n### Benutzerdefinierte Domain funktioniert nicht\n\n**Sicherstellen, dass customDomain true ist:**\n```json\n{\n  \"deployment\": {\n    \"customDomain\": true,\n    \"basePath\": \"\"\n  }\n}\n```\n\n**Überprüfen, ob CNAME-Datei existiert:**\n- Muss in `public/CNAME` sein\n- Enthält nur Ihre Domain\n- Kein Protokoll, kein nachgestellter Schrägstrich\n\n## Best Practices\n\n**Konfiguration in Versionskontrolle halten** - `specra.config.json` committen, damit Bereitstellungen konsistent sind\n\n**Lokal testen vor Bereitstellung** - Verwenden Sie `npx serve out`, um statische Exporte zu testen\n\n**Umgebungsspezifische Konfigurationen verwenden** - Verschiedene Konfigurationen für Staging und Produktion falls erforderlich\n\n**Setup dokumentieren** - Fügen Sie Bereitstellungsanweisungen zu Ihrem README hinzu\n\n**Nach Plattformwechsel überprüfen** - Testen Sie, ob alles funktioniert, wenn Sie Bereitstellungsziele ändern\n\n## Nächste Schritte\n\n\u003cCardGrid cols={2}\u003e\n  \u003cCard\n    icon=\"triangle\"\n    title=\"Auf Vercel bereitstellen\"\n    description=\"Schritt-für-Schritt Vercel-Bereitstellung\"\n    href=\"/docs/v1.0.0/deployment/vercel\"\n  /\u003e\n  \u003cCard\n    icon=\"github\"\n    title=\"Auf GitHub Pages bereitstellen\"\n    description=\"GitHub Pages mit Actions\"\n    href=\"/docs/v1.0.0/deployment/github-pages\"\n  /\u003e\n  \u003cCard\n    icon=\"globe\"\n    title=\"Auf Netlify bereitstellen\"\n    description=\"Netlify-Bereitstellungsleitfaden\"\n    href=\"/docs/v1.0.0/deployment/netlify\"\n  /\u003e\n  \u003cCard\n    icon=\"arrow-left\"\n    title=\"Bereitstellungsübersicht\"\n    description=\"Alle Bereitstellungsoptionen\"\n    href=\"/docs/v1.0.0/deployment/overview\"\n  /\u003e\n\u003c/CardGrid\u003e\n"])</script><script>self.__next_f.push([1,"38:T21be,"])</script><script>self.__next_f.push([1,"\n# Bereitstellungskonfiguration\n\nDer Abschnitt `deployment` teilt Specra mit, wie Ihre Dokumentation für verschiedene Hosting-Plattformen erstellt werden soll. Dies stellt sicher, dass Assets korrekt geladen werden und Ihre Website überall funktioniert, wo Sie sie bereitstellen.\n\n## Warum Bereitstellungskonfiguration wichtig ist\n\nVerschiedene Plattformen stellen Ihre Website von verschiedenen URLs bereit:\n\n- **Vercel:** `yoursite.vercel.app` (bereitgestellt von root `/`)\n- **GitHub Pages (keine benutzerdefinierte Domain):** `username.github.io/repo-name` (bereitgestellt von `/repo-name/`)\n- **Netlify:** `yoursite.netlify.app` (bereitgestellt von root `/`)\n\nSpecra muss Ihr Bereitstellungsziel kennen, um Asset-Pfade korrekt zu konfigurieren.\n\n## Grundkonfiguration\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"vercel\"\n  }\n}\n```\n\nDas ist alles, was Sie für die meisten Bereitstellungen benötigen. Specra erledigt den Rest automatisch.\n\n## Vollständige Konfiguration\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"vercel\",\n    \"basePath\": \"\",\n    \"customDomain\": false\n  }\n}\n```\n\n## Konfigurationsoptionen\n\n### target\n\n**Typ:** `string`\n**Standard:** `\"vercel\"`\n\nIhre Bereitstellungsplattform. Dies bestimmt, welchen Build-Prozess Specra verwendet.\n\n**Verfügbare Ziele:**\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"vercel\"\n  }\n}\n```\n\n**Optionen:**\n- `\"vercel\"` - Vercel, Railway, Render oder jedes Node.js-Hosting\n- `\"github-pages\"` - GitHub Pages ohne benutzerdefinierte Domain\n- `\"static\"` - Statisches Hosting (Netlify, Cloudflare Pages)\n- `\"custom-domain-static\"` - GitHub Pages mit benutzerdefinierter Domain\n\n### basePath\n\n**Typ:** `string`\n**Standard:** `\"\"`\n\nBasispfad für Ihre Website. Nur erforderlich für GitHub Pages ohne benutzerdefinierte Domain.\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"github-pages\",\n    \"basePath\": \"mein-repo\"\n  }\n}\n```\n\n**Wann basePath zu verwenden ist:**\n\n✅ **GitHub Pages ohne benutzerdefinierte Domain**\n```\nURL: username.github.io/mein-repo\nConfig: \"basePath\": \"mein-repo\"\n```\n\n❌ **GitHub Pages mit benutzerdefinierter Domain**\n```\nURL: docs.example.com\nConfig: \"basePath\": \"\"\n```\n\n❌ **Vercel, Netlify, etc.**\n```\nURL: yoursite.vercel.app\nConfig: \"basePath\": \"\"\n```\n\n\u003cCallout type=\"warning\"\u003e\nDer basePath muss exakt mit Ihrem Repository-Namen übereinstimmen. Wenn sie nicht übereinstimmen, geben Assets 404-Fehler zurück.\n\u003c/Callout\u003e\n\n### customDomain\n\n**Typ:** `boolean`\n**Standard:** `false`\n\nSetzen Sie dies auf `true`, wenn Sie eine benutzerdefinierte Domain mit GitHub Pages verwenden.\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"github-pages\",\n    \"customDomain\": true,\n    \"basePath\": \"\"\n  }\n}\n```\n\nDies weist Specra an, Assets vom Root `/` anstatt von `/repo-name/` bereitzustellen.\n\n## Plattformspezifische Konfigurationen\n\n### Vercel\n\nDie Standardkonfiguration funktioniert perfekt:\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"vercel\"\n  }\n}\n```\n\n**Build-Befehl:** `npm run build`\n**Ausgabe:** `.next` Verzeichnis\n**Kein basePath erforderlich**\n\n### GitHub Pages (Keine benutzerdefinierte Domain)\n\nFür `username.github.io/repo-name`:\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"github-pages\",\n    \"basePath\": \"repo-name\",\n    \"customDomain\": false\n  }\n}\n```\n\n**Build-Befehl:** `npm run build:export`\n**Ausgabe:** `out` Verzeichnis\n**Assets laden von:** `/repo-name/_next/...`\n\n### GitHub Pages (Mit benutzerdefinierter Domain)\n\nFür `docs.example.com`:\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"custom-domain-static\",\n    \"basePath\": \"\",\n    \"customDomain\": true\n  }\n}\n```\n\nFügen Sie auch `public/CNAME` hinzu:\n```\ndocs.example.com\n```\n\n**Build-Befehl:** `npm run build:export`\n**Ausgabe:** `out` Verzeichnis\n**Assets laden von:** `/_next/...`\n\n### Netlify\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"static\"\n  }\n}\n```\n\n**Build-Befehl:** `npm run build:export`\n**Ausgabe:** `out` Verzeichnis\n**Kein basePath erforderlich**\n\n### Cloudflare Pages\n\nDas Gleiche wie Netlify:\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"static\"\n  }\n}\n```\n\n## Wie es funktioniert\n\n### Build-Modi\n\nSpecra hat zwei Build-Modi:\n\n**1. Standalone (Node.js Hosting)**\n- Verwendet für: Vercel, Railway, Render\n- Befehl: `npm run build`\n- Ausgabe: `.next` Verzeichnis\n- Läuft als Node.js-Server\n- Unterstützt dynamische Funktionen\n\n**2. Statischer Export (Statisches Hosting)**\n- Verwendet für: GitHub Pages, Netlify, Cloudflare Pages\n- Befehl: `npm run build:export`\n- Ausgabe: `out` Verzeichnis\n- Reine HTML/CSS/JS-Dateien\n- Kein Server erforderlich\n\nDas `deployment.target` bestimmt, welcher Modus verwendet wird.\n\n### Asset-Pfad-Auflösung\n\nSpecra verwendet das `getAssetPath()`-Dienstprogramm, um Asset-URLs zu verarbeiten:\n\n```typescript\n// Passt sich automatisch basierend auf der Bereitstellungskonfiguration an\ngetAssetPath('/images/logo.png')\n\n// Vercel: /images/logo.png\n// GitHub Pages (keine benutzerdefinierte Domain): /repo-name/images/logo.png\n// GitHub Pages (benutzerdefinierte Domain): /images/logo.png\n```\n\nSie müssen sich darüber keine Sorgen machen – Specra erledigt das automatisch basierend auf Ihrer Konfiguration.\n\n## Plattformen wechseln\n\n### Von Vercel zu GitHub Pages\n\n1. Konfiguration aktualisieren:\n```json\n{\n  \"deployment\": {\n    \"target\": \"github-pages\",\n    \"basePath\": \"ihr-repo-name\"\n  }\n}\n```\n\n2. Build-Befehl ändern:\n```bash\nnpm run build:export  # anstatt npm run build\n```\n\n3. `out/`-Ordner anstelle von `.next/` bereitstellen\n\n### Von GitHub Pages zu Netlify\n\n1. Konfiguration aktualisieren:\n```json\n{\n  \"deployment\": {\n    \"target\": \"static\",\n    \"basePath\": \"\"\n  }\n}\n```\n\n2. Weiterhin `npm run build:export` verwenden\n\n3. Netlify stellt von Root bereit, also basePath entfernen\n\n## Lokal testen\n\n### Statischen Export testen\n\n```bash\nnpm run build:export\nnpx serve out\n```\n\nÖffnen Sie die angezeigte URL (normalerweise `http://localhost:3000`). Überprüfen Sie:\n- Seiten laden korrekt\n- Bilder erscheinen\n- Links funktionieren\n- Navigation funktioniert\n\n### Mit basePath testen\n\nWenn Sie basePath verwenden, testen Sie lokal mit einem Server, der diesen respektiert:\n\n```bash\nnpm run build:export\nnpx serve out -s -p 3000\n```\n\nBesuchen Sie dann `http://localhost:3000/ihr-repo-name`, um GitHub Pages zu simulieren.\n\n## Fehlerbehebung\n\n### Assets geben 404 zurück\n\n**Überprüfen, ob basePath mit Repo-Namen übereinstimmt:**\n```json\n{\n  \"deployment\": {\n    \"basePath\": \"exakter-repo-name\"  // Muss exakt übereinstimmen\n  }\n}\n```\n\n**Überprüfen, ob Sie den richtigen Build-Befehl verwenden:**\n- GitHub Pages: `npm run build:export` (nicht `npm run build`)\n- Vercel: `npm run build` (nicht `npm run build:export`)\n\n### Leere Seite nach Bereitstellung\n\n**Überprüfen, ob das Ziel korrekt ist:**\n- GitHub Pages benötigt `\"target\": \"github-pages\"`\n- Netlify benötigt `\"target\": \"static\"`\n- Vercel benötigt `\"target\": \"vercel\"`\n\n**Überprüfen, ob Bereitstellungseinstellungen mit Konfiguration übereinstimmen:**\n- Ausgabeverzeichnis sollte dem Build-Modus entsprechen\n- Build-Befehl sollte dem Ziel entsprechen\n\n### Benutzerdefinierte Domain funktioniert nicht\n\n**Sicherstellen, dass customDomain true ist:**\n```json\n{\n  \"deployment\": {\n    \"customDomain\": true,\n    \"basePath\": \"\"\n  }\n}\n```\n\n**Überprüfen, ob CNAME-Datei existiert:**\n- Muss in `public/CNAME` sein\n- Enthält nur Ihre Domain\n- Kein Protokoll, kein nachgestellter Schrägstrich\n\n## Best Practices\n\n**Konfiguration in Versionskontrolle halten** - `specra.config.json` committen, damit Bereitstellungen konsistent sind\n\n**Lokal testen vor Bereitstellung** - Verwenden Sie `npx serve out`, um statische Exporte zu testen\n\n**Umgebungsspezifische Konfigurationen verwenden** - Verschiedene Konfigurationen für Staging und Produktion falls erforderlich\n\n**Setup dokumentieren** - Fügen Sie Bereitstellungsanweisungen zu Ihrem README hinzu\n\n**Nach Plattformwechsel überprüfen** - Testen Sie, ob alles funktioniert, wenn Sie Bereitstellungsziele ändern\n\n## Nächste Schritte\n\n\u003cCardGrid cols={2}\u003e\n  \u003cCard\n    icon=\"triangle\"\n    title=\"Auf Vercel bereitstellen\"\n    description=\"Schritt-für-Schritt Vercel-Bereitstellung\"\n    href=\"/docs/v1.0.0/deployment/vercel\"\n  /\u003e\n  \u003cCard\n    icon=\"github\"\n    title=\"Auf GitHub Pages bereitstellen\"\n    description=\"GitHub Pages mit Actions\"\n    href=\"/docs/v1.0.0/deployment/github-pages\"\n  /\u003e\n  \u003cCard\n    icon=\"globe\"\n    title=\"Auf Netlify bereitstellen\"\n    description=\"Netlify-Bereitstellungsleitfaden\"\n    href=\"/docs/v1.0.0/deployment/netlify\"\n  /\u003e\n  \u003cCard\n    icon=\"arrow-left\"\n    title=\"Bereitstellungsübersicht\"\n    description=\"Alle Bereitstellungsoptionen\"\n    href=\"/docs/v1.0.0/deployment/overview\"\n  /\u003e\n\u003c/CardGrid\u003e\n"])</script><script>self.__next_f.push([1,"39:T2e65,"])</script><script>self.__next_f.push([1,"\n# Auf Netlify bereitstellen\n\nNetlify bietet leistungsstarkes statisches Hosting mit Features wie sofortigen Rollbacks, Split-Testing und Edge-Funktionen. Es ist eine großartige Wahl für Dokumentationsseiten.\n\n## Warum Netlify?\n\n- **One-Click-Bereitstellung** - In Minuten verbinden und bereitstellen\n- **Kontinuierliche Bereitstellung** - Automatische Bereitstellung bei Git-Push\n- **Sofortige Rollbacks** - Vorherige Versionen sofort wiederherstellen\n- **Edge-Funktionen** - Code am Edge ausführen\n- **Formulare \u0026 Identität** - Integrierte Formularverarbeitung und Authentifizierung\n- **Kostenlose Stufe** - Großzügige Limits für Dokumentation\n\n## Schnelle Bereitstellung\n\n\u003cSteps\u003e\n  \u003cStep title=\"Für statischen Export konfigurieren\"\u003e\n    Aktualisieren Sie `specra.config.json`:\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"static\",\n    \"basePath\": \"\",\n    \"customDomain\": false\n  }\n}\n```\n  \u003c/Step\u003e\n\n  \u003cStep title=\"netlify.toml erstellen\"\u003e\n    Fügen Sie die Build-Konfiguration im Projektstamm hinzu:\n\n```toml\n[build]\n  command = \"npm run build:export\"\n  publish = \"out\"\n\n[build.environment]\n  NODE_VERSION = \"20\"\n\n[[redirects]]\n  from = \"/*\"\n  to = \"/index.html\"\n  status = 200\n```\n\nDies sagt Netlify, wie gebaut und was veröffentlicht werden soll.\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Bereitstellen\"\u003e\n    **Option 1: Web-Oberfläche**\n    1. Gehen Sie zu [netlify.com](https://netlify.com)\n    2. Klicken Sie auf \"Add new site\" → \"Import an existing project\"\n    3. Verbinden Sie Ihren Git-Anbieter\n    4. Wählen Sie Ihr Repository\n    5. Klicken Sie auf \"Deploy site\"\n\n**Option 2: Netlify CLI**\n```bash\nnpm install -g netlify-cli\nnetlify deploy --prod\n```\n  \u003c/Step\u003e\n\u003c/Steps\u003e\n\n\u003cCallout type=\"success\"\u003e\nIhre Seite ist jetzt unter einer Netlify-URL wie `random-name-123.netlify.app` live\n\u003c/Callout\u003e\n\n## Konfiguration\n\n### Build-Einstellungen\n\nNetlify erkennt Einstellungen automatisch, aber Sie können sie anpassen:\n\n| Einstellung | Wert |\n|-------------|------|\n| Build command | `npm run build:export` |\n| Publish directory | `out` |\n| Node version | 20 (in `netlify.toml` gesetzt) |\n\n### Umgebungsvariablen\n\nFügen Sie Umgebungsvariablen im Netlify-Dashboard hinzu:\n\n\u003cSteps\u003e\n  \u003cStep title=\"Zu Seiteneinstellungen gehen\"\u003e\n    Klicken Sie auf Ihre Seite → Site settings → Environment variables\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Variablen hinzufügen\"\u003e\n```\nMEILISEARCH_HOST=https://search.example.com\nMEILISEARCH_API_KEY=ihr-such-schluessel\nNEXT_PUBLIC_GA_ID=G-XXXXXXXXXX\n```\n\n\u003cCallout type=\"tip\"\u003e\nVariablen, die mit `NEXT_PUBLIC_` beginnen, sind für den Browser sichtbar. Halten Sie sensible Schlüssel ohne dieses Präfix.\n\u003c/Callout\u003e\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Neu bereitstellen\"\u003e\n    Gehen Sie zu Deploys → Trigger deploy → Deploy site\n  \u003c/Step\u003e\n\u003c/Steps\u003e\n\n## Benutzerdefinierte Domain\n\nFügen Sie Ihre eigene Domain zu Ihrer Netlify-Seite hinzu:\n\n\u003cSteps\u003e\n  \u003cStep title=\"Domain hinzufügen\"\u003e\n    1. Gehen Sie zu Domain settings\n    2. Klicken Sie auf \"Add custom domain\"\n    3. Geben Sie Ihre Domain ein (z.B. `docs.example.com`)\n    4. Klicken Sie auf \"Verify\"\n  \u003c/Step\u003e\n\n  \u003cStep title=\"DNS konfigurieren\"\u003e\n    **Option 1: Netlify DNS verwenden (Empfohlen)**\n    - Verweisen Sie die Nameserver Ihrer Domain auf Netlify\n    - Netlify verwaltet alle DNS-Einträge\n    - Automatisches SSL-Zertifikat\n\n**Option 2: Externes DNS verwenden**\n\nFür Subdomain:\n```\nTyp: CNAME\nName: docs\nWert: ihre-seite.netlify.app\n```\n\nFür Apex-Domain:\n```\nTyp: A\nName: @\nWert: 75.2.60.5\n```\n  \u003c/Step\u003e\n\n  \u003cStep title=\"HTTPS aktivieren\"\u003e\n    Netlify stellt automatisch ein SSL-Zertifikat von Let's Encrypt bereit.\n\n    Überprüfen Sie Domain settings → HTTPS für den Status.\n  \u003c/Step\u003e\n\u003c/Steps\u003e\n\n## Bereitstellungsvorschauen\n\nNetlify erstellt Vorschau-Bereitstellungen für jeden Pull Request:\n\n**Was Sie bekommen:**\n- Eindeutige URL für jeden PR\n- Automatische Updates bei Push\n- Bereitstellungs-Vorschau-Link in PR-Kommentaren\n- Perfekt zum Überprüfen von Änderungen\n\n### Bereitstellungsvorschauen konfigurieren\n\nSteuern Sie, wann Vorschauen erstellt werden:\n\n```toml\n[context.deploy-preview]\n  command = \"npm run build:export\"\n\n[context.branch-deploy]\n  command = \"npm run build:export\"\n```\n\n## Erweiterte Funktionen\n\n### Weiterleitungsregeln\n\nFügen Sie Weiterleitungen in `netlify.toml` hinzu:\n\n```toml\n# Alte URLs umleiten\n[[redirects]]\n  from = \"/old-page\"\n  to = \"/new-page\"\n  status = 301\n\n# SPA-Fallback\n[[redirects]]\n  from = \"/*\"\n  to = \"/index.html\"\n  status = 200\n\n# Länderbasierte Weiterleitungen\n[[redirects]]\n  from = \"/docs\"\n  to = \"/en/docs\"\n  status = 302\n  conditions = {Country = [\"US\"]}\n```\n\n### Header\n\nFügen Sie benutzerdefinierte Header hinzu:\n\n```toml\n[[headers]]\n  for = \"/*\"\n  [headers.values]\n    X-Frame-Options = \"DENY\"\n    X-XSS-Protection = \"1; mode=block\"\n    Content-Security-Policy = \"default-src 'self'\"\n\n[[headers]]\n  for = \"/assets/*\"\n  [headers.values]\n    Cache-Control = \"public, max-age=31536000, immutable\"\n```\n\n### Edge-Funktionen\n\nFühren Sie Code am Edge für dynamische Funktionalität aus:\n\nErstellen Sie `netlify/edge-functions/hello.ts`:\n\n```typescript\nexport default async (request: Request) =\u003e {\n  return new Response(\"Hallo vom Edge!\")\n}\n\nexport const config = {\n  path: \"/api/hello\"\n}\n```\n\n### Split-Testing\n\nTesten Sie verschiedene Versionen Ihrer Docs:\n\n1. Gehen Sie zu Split testing\n2. Klicken Sie auf \"Start a test\"\n3. Wählen Sie Branches zum Vergleichen\n4. Stellen Sie die Traffic-Aufteilung ein (z.B. 50/50)\n\nGroßartig zum Testen neuer Dokumentationslayouts oder Inhalte.\n\n## Build-Plugins\n\nErweitern Sie Ihren Build mit Netlify-Plugins:\n\n```toml\n[[plugins]]\n  package = \"@netlify/plugin-lighthouse\"\n\n[[plugins]]\n  package = \"netlify-plugin-checklinks\"\n```\n\nPlugins installieren:\n\n```bash\nnpm install -D @netlify/plugin-lighthouse netlify-plugin-checklinks\n```\n\n## Bereitstellungskontexte\n\nUnterschiedliche Konfigurationen für unterschiedliche Branches:\n\n```toml\n# Produktion (main branch)\n[context.production]\n  command = \"npm run build:export\"\n  [context.production.environment]\n    NODE_ENV = \"production\"\n\n# Staging branch\n[context.staging]\n  command = \"npm run build:export\"\n  [context.staging.environment]\n    NODE_ENV = \"staging\"\n\n# Bereitstellungsvorschauen (PRs)\n[context.deploy-preview]\n  command = \"npm run build:export -- --debug\"\n```\n\n## Leistungsoptimierung\n\n### Asset-Optimierung\n\nNetlify optimiert automatisch:\n- Bildkompression\n- Bundle-Minimierung\n- Brotli-Kompression\n\nAktivieren Sie dies unter Build \u0026 deploy → Post processing.\n\n### Caching\n\nKonfigurieren Sie Cache-Header:\n\n```toml\n[[headers]]\n  for = \"/_next/static/*\"\n  [headers.values]\n    Cache-Control = \"public, max-age=31536000, immutable\"\n\n[[headers]]\n  for = \"/images/*\"\n  [headers.values]\n    Cache-Control = \"public, max-age=604800\"\n```\n\n### Prerendering\n\nFür besseres SEO, aktivieren Sie Prerendering:\n\n```toml\n[[plugins]]\n  package = \"@netlify/plugin-nextjs\"\n```\n\n## Formulare\n\nFügen Sie Formulare zu Ihrer Dokumentation hinzu:\n\n```html\n\u003cform name=\"contact\" method=\"POST\" data-netlify=\"true\"\u003e\n  \u003cinput type=\"text\" name=\"name\" /\u003e\n  \u003cinput type=\"email\" name=\"email\" /\u003e\n  \u003ctextarea name=\"message\"\u003e\u003c/textarea\u003e\n  \u003cbutton type=\"submit\"\u003eSenden\u003c/button\u003e\n\u003c/form\u003e\n```\n\nNetlify verarbeitet Formulareinsendungen automatisch. Sehen Sie Antworten im Forms-Tab.\n\n## Analytik\n\nAktivieren Sie Netlify Analytics für Besuchereinblicke:\n\n1. Gehen Sie zum Analytics-Tab\n2. Klicken Sie auf \"Enable Analytics\"\n3. Kostet 9$/Monat (optional)\n\nZeigt:\n- Seitenaufrufe\n- Top-Seiten\n- Traffic-Quellen\n- Geografische Daten\n\n## CI/CD-Integration\n\n### GitHub Actions + Netlify\n\nStellen Sie über GitHub Actions für mehr Kontrolle bereit:\n\n```yaml\nname: Deploy to Netlify\n\non:\n  push:\n    branches: [main]\n\njobs:\n  deploy:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n\n      - name: Setup Node\n        uses: actions/setup-node@v4\n        with:\n          node-version: '20'\n\n      - name: Install dependencies\n        run: npm ci\n\n      - name: Build\n        run: npm run build:export\n\n      - name: Deploy to Netlify\n        uses: nwtgck/actions-netlify@v2\n        with:\n          publish-dir: './out'\n          production-deploy: true\n        env:\n          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}\n          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}\n```\n\nHolen Sie sich Ihr Auth-Token und Ihre Site-ID aus dem Netlify-Dashboard.\n\n## Fehlerbehebung\n\n### Build fehlgeschlagen\n\n**Build-Logs prüfen:**\n- Gehen Sie zu Deploys\n- Klicken Sie auf fehlgeschlagene Bereitstellung\n- Bereitstellungslog ansehen\n\n**Häufige Probleme:**\n- Node-Versions-Konflikt (in `netlify.toml` setzen)\n- Fehlende Abhängigkeiten (`npm ci` statt `npm install` verwenden)\n- Umgebungsvariablen nicht gesetzt\n\n### Assets 404\n\nStellen Sie sicher, dass `netlify.toml` die SPA-Weiterleitung hat:\n\n```toml\n[[redirects]]\n  from = \"/*\"\n  to = \"/index.html\"\n  status = 200\n```\n\n### Funktionen funktionieren nicht\n\nFunktionslogs prüfen:\n1. Gehen Sie zum Functions-Tab\n2. Klicken Sie auf Ihre Funktion\n3. Logs ansehen\n\nStellen Sie sicher, dass der Funktionspfad mit der Konfiguration übereinstimmt:\n\n```typescript\nexport const config = {\n  path: \"/api/hello\"  // Muss mit Ihrer Route übereinstimmen\n}\n```\n\n### SSL-Probleme bei benutzerdefinierter Domain\n\n- Warten Sie 24 Stunden auf DNS-Verbreitung\n- Verifizieren Sie DNS-Einträge mit `dig` oder `nslookup`\n- Überprüfen Sie den HTTPS-Status in Domain settings\n- Versuchen Sie, das Zertifikat neu bereitzustellen\n\n## Rollbacks\n\nSofortiges Rollback auf eine frühere Bereitstellung:\n\n1. Gehen Sie zu Deploys\n2. Finden Sie die funktionierende Version\n3. Klicken Sie auf \"Publish deploy\"\n\nIhre Seite wird sofort zurückgesetzt. Kein Warten auf Builds.\n\n## Überwachung\n\n### Bereitstellungsbenachrichtigungen\n\nWerden Sie benachrichtigt, wenn Bereitstellungen erfolgreich sind oder fehlschlagen:\n\n1. Gehen Sie zu Site settings → Build \u0026 deploy → Deploy notifications\n2. Benachrichtigung hinzufügen (E-Mail, Slack, Webhook)\n3. Ereignisse wählen (Bereitstellung gestartet, erfolgreich, fehlgeschlagen)\n\n### Status-Badge\n\nFügen Sie ein Bereitstellungsstatus-Badge zu Ihrer README hinzu:\n\n```markdown\n[![Netlify Status](https://api.netlify.com/api/v1/badges/SITE_ID/deploy-status)](https://app.netlify.com/sites/SITE_NAME/deploys)\n```\n\n## Preise\n\nDie kostenlose Stufe von Netlify umfasst:\n- 300 Build-Minuten/Monat\n- 100GB Bandbreite/Monat\n- Unbegrenzte Seiten\n- Bereitstellungsvorschauen\n- HTTPS\n- Formulare (100 Einsendungen/Monat)\n\nUpgrade auf Pro (19$/Monat) für:\n- Mehr Bandbreite und Build-Minuten\n- Analytik\n- Team-Zusammenarbeit\n- Prioritätssupport\n\n## Best Practices\n\n**`netlify.toml` verwenden** - Versionskontrolle Ihrer Build-Konfiguration\n\n**Bereitstellungsvorschauen aktivieren** - Änderungen vor dem Zusammenführen überprüfen\n\n**Benachrichtigungen einrichten** - Sofort wissen, wenn Bereitstellungen fehlschlagen\n\n**Umgebungsvariablen verwenden** - Geheimnisse aus dem Code halten\n\n**Weiterleitungen konfigurieren** - URL-Änderungen richtig handhaben\n\n**Analytik überwachen** - Verstehen, wie Benutzer durch Ihre Docs navigieren\n\n**Lokal testen** - Zuerst `npm run build:export \u0026\u0026 npx serve out` ausführen\n\n## Nächste Schritte\n\n\u003cCardGrid cols={2}\u003e\n  \u003cCard\n    icon=\"triangle\"\n    title=\"Vercel\"\n    description=\"Stattdessen auf Vercel bereitstellen\"\n    href=\"/docs/v1.0.0/deployment/vercel\"\n  /\u003e\n  \u003cCard\n    icon=\"github\"\n    title=\"GitHub Pages\"\n    description=\"Kostenloses Hosting mit GitHub Pages\"\n    href=\"/docs/v1.0.0/deployment/github-pages\"\n  /\u003e\n  \u003cCard\n    icon=\"arrow-left\"\n    title=\"Bereitstellungsübersicht\"\n    description=\"Alle Bereitstellungsoptionen ansehen\"\n    href=\"/docs/v1.0.0/deployment/overview\"\n  /\u003e\n  \u003cCard\n    icon=\"zap\"\n    title=\"Leistung\"\n    description=\"Optimieren Sie Ihre Dokumentation\"\n    href=\"/docs/v1.0.0/performance\"\n  /\u003e\n\u003c/CardGrid\u003e\n"])</script><script>self.__next_f.push([1,"3a:T2e65,"])</script><script>self.__next_f.push([1,"\n# Auf Netlify bereitstellen\n\nNetlify bietet leistungsstarkes statisches Hosting mit Features wie sofortigen Rollbacks, Split-Testing und Edge-Funktionen. Es ist eine großartige Wahl für Dokumentationsseiten.\n\n## Warum Netlify?\n\n- **One-Click-Bereitstellung** - In Minuten verbinden und bereitstellen\n- **Kontinuierliche Bereitstellung** - Automatische Bereitstellung bei Git-Push\n- **Sofortige Rollbacks** - Vorherige Versionen sofort wiederherstellen\n- **Edge-Funktionen** - Code am Edge ausführen\n- **Formulare \u0026 Identität** - Integrierte Formularverarbeitung und Authentifizierung\n- **Kostenlose Stufe** - Großzügige Limits für Dokumentation\n\n## Schnelle Bereitstellung\n\n\u003cSteps\u003e\n  \u003cStep title=\"Für statischen Export konfigurieren\"\u003e\n    Aktualisieren Sie `specra.config.json`:\n\n```json\n{\n  \"deployment\": {\n    \"target\": \"static\",\n    \"basePath\": \"\",\n    \"customDomain\": false\n  }\n}\n```\n  \u003c/Step\u003e\n\n  \u003cStep title=\"netlify.toml erstellen\"\u003e\n    Fügen Sie die Build-Konfiguration im Projektstamm hinzu:\n\n```toml\n[build]\n  command = \"npm run build:export\"\n  publish = \"out\"\n\n[build.environment]\n  NODE_VERSION = \"20\"\n\n[[redirects]]\n  from = \"/*\"\n  to = \"/index.html\"\n  status = 200\n```\n\nDies sagt Netlify, wie gebaut und was veröffentlicht werden soll.\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Bereitstellen\"\u003e\n    **Option 1: Web-Oberfläche**\n    1. Gehen Sie zu [netlify.com](https://netlify.com)\n    2. Klicken Sie auf \"Add new site\" → \"Import an existing project\"\n    3. Verbinden Sie Ihren Git-Anbieter\n    4. Wählen Sie Ihr Repository\n    5. Klicken Sie auf \"Deploy site\"\n\n**Option 2: Netlify CLI**\n```bash\nnpm install -g netlify-cli\nnetlify deploy --prod\n```\n  \u003c/Step\u003e\n\u003c/Steps\u003e\n\n\u003cCallout type=\"success\"\u003e\nIhre Seite ist jetzt unter einer Netlify-URL wie `random-name-123.netlify.app` live\n\u003c/Callout\u003e\n\n## Konfiguration\n\n### Build-Einstellungen\n\nNetlify erkennt Einstellungen automatisch, aber Sie können sie anpassen:\n\n| Einstellung | Wert |\n|-------------|------|\n| Build command | `npm run build:export` |\n| Publish directory | `out` |\n| Node version | 20 (in `netlify.toml` gesetzt) |\n\n### Umgebungsvariablen\n\nFügen Sie Umgebungsvariablen im Netlify-Dashboard hinzu:\n\n\u003cSteps\u003e\n  \u003cStep title=\"Zu Seiteneinstellungen gehen\"\u003e\n    Klicken Sie auf Ihre Seite → Site settings → Environment variables\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Variablen hinzufügen\"\u003e\n```\nMEILISEARCH_HOST=https://search.example.com\nMEILISEARCH_API_KEY=ihr-such-schluessel\nNEXT_PUBLIC_GA_ID=G-XXXXXXXXXX\n```\n\n\u003cCallout type=\"tip\"\u003e\nVariablen, die mit `NEXT_PUBLIC_` beginnen, sind für den Browser sichtbar. Halten Sie sensible Schlüssel ohne dieses Präfix.\n\u003c/Callout\u003e\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Neu bereitstellen\"\u003e\n    Gehen Sie zu Deploys → Trigger deploy → Deploy site\n  \u003c/Step\u003e\n\u003c/Steps\u003e\n\n## Benutzerdefinierte Domain\n\nFügen Sie Ihre eigene Domain zu Ihrer Netlify-Seite hinzu:\n\n\u003cSteps\u003e\n  \u003cStep title=\"Domain hinzufügen\"\u003e\n    1. Gehen Sie zu Domain settings\n    2. Klicken Sie auf \"Add custom domain\"\n    3. Geben Sie Ihre Domain ein (z.B. `docs.example.com`)\n    4. Klicken Sie auf \"Verify\"\n  \u003c/Step\u003e\n\n  \u003cStep title=\"DNS konfigurieren\"\u003e\n    **Option 1: Netlify DNS verwenden (Empfohlen)**\n    - Verweisen Sie die Nameserver Ihrer Domain auf Netlify\n    - Netlify verwaltet alle DNS-Einträge\n    - Automatisches SSL-Zertifikat\n\n**Option 2: Externes DNS verwenden**\n\nFür Subdomain:\n```\nTyp: CNAME\nName: docs\nWert: ihre-seite.netlify.app\n```\n\nFür Apex-Domain:\n```\nTyp: A\nName: @\nWert: 75.2.60.5\n```\n  \u003c/Step\u003e\n\n  \u003cStep title=\"HTTPS aktivieren\"\u003e\n    Netlify stellt automatisch ein SSL-Zertifikat von Let's Encrypt bereit.\n\n    Überprüfen Sie Domain settings → HTTPS für den Status.\n  \u003c/Step\u003e\n\u003c/Steps\u003e\n\n## Bereitstellungsvorschauen\n\nNetlify erstellt Vorschau-Bereitstellungen für jeden Pull Request:\n\n**Was Sie bekommen:**\n- Eindeutige URL für jeden PR\n- Automatische Updates bei Push\n- Bereitstellungs-Vorschau-Link in PR-Kommentaren\n- Perfekt zum Überprüfen von Änderungen\n\n### Bereitstellungsvorschauen terschiedliche Konfigurationen für unterschiedliche Branches:\n\n```toml\n# Produktion (main branch)\n[context.production]\n  command = \"npm run build:export\"\n  [context.production.environment]\n    NODE_ENV = \"production\"\n\n# Staging branch\n[context.staging]\n  command = \"npm run build:export\"\n  [context.staging.environment]\n    NODE_ENV = \"staging\"\n\n# Bereitstellungsvorschauen (PRs)\n[context.deploy-preview]\n  command = \"npm run build:export -- --debug\"\n```\n\n## Leistungsoptimierung\n\n### Asset-Optimierung\n\nNetlify optimiert automatisch:\n- Bildkompression\n- Bundle-Minimierung\n- Brotli-Kompression\n\nAktivieren Sie dies unter Build \u0026 deploy → Post processing.\n\n### Caching\n\nKonfigurieren Sie Cache-Header:\n\n```toml\n[[headers]]\n  for = \"/_next/static/*\"\n  [headers.values]\n    Cache-Control = \"public, max-age=31536000, immutable\"\n\n[[headers]]\n  for = \"/images/*\"\n  [headers.values]\n    Cache-Control = \"public, max-age=604800\"\n```\n\n### Prerendering\n\nFür besseres SEO, aktivieren Sie Prerendering:\n\n```toml\n[[plugins]]\n  package = \"@netlify/plugin-nextjs\"\n```\n\n## Formulare\n\nFügen Sie Formulare zu Ihrer Dokumentation hinzu:\n\n```html\n\u003cform name=\"contact\" method=\"POST\" data-netlify=\"true\"\u003e\n  \u003cinput type=\"text\" name=\"name\" /\u003e\n  \u003cinput type=\"email\" name=\"email\" /\u003e\n  \u003ctextarea name=\"message\"\u003e\u003c/textarea\u003e\n  \u003cbutton type=\"submit\"\u003eSenden\u003c/button\u003e\n\u003c/form\u003e\n```\n\nNetlify verarbeitet Formulareinsendungen automatisch. Sehen Sie Antworten im Forms-Tab.\n\n## Analytik\n\nAktivieren Sie Netlify Analytics für Besuchereinblicke:\n\n1. Gehen Sie zum Analytics-Tab\n2. Klicken Sie auf \"Enable Analytics\"\n3. Kostet 9$/Monat (optional)\n\nZeigt:\n- Seitenaufrufe\n- Top-Seiten\n- Traffic-Quellen\n- Geografische Daten\n\n## CI/CD-Integration\n\n### GitHub Actions + Netlify\n\nStellen Sie über GitHub Actions für mehr Kontrolle bereit:\n\n```yaml\nname: Deploy to Netlify\n\non:\n  push:\n    branches: [main]\n\njobs:\n  deploy:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n\n      - name: Setup Node\n        uses: actions/setup-node@v4\n        with:\n          node-version: '20'\n\n      - name: Install dependencies\n        run: npm ci\n\n      - name: Build\n        run: npm run build:export\n\n      - name: Deploy to Netlify\n        uses: nwtgck/actions-netlify@v2\n        with:\n          publish-dir: './out'\n          production-deploy: true\n        env:\n          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}\n          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}\n```\n\nHolen Sie sich Ihr Auth-Token und Ihre Site-ID aus dem Netlify-Dashboard.\n\n## Fehlerbehebung\n\n### Build fehlgeschlagen\n\n**Build-Logs prüfen:**\n- Gehen Sie zu Deploys\n- Klicken Sie auf fehlgeschlagene Bereitstellung\n- Bereitstellungslog ansehen\n\n**Häufige Probleme:**\n- Node-Versions-Konflikt (in `netlify.toml` setzen)\n- Fehlende Abhängigkeiten (`npm ci` statt `npm install` verwenden)\n- Umgebungsvariablen nicht gesetzt\n\n### Assets 404\n\nStellen Sie sicher, dass `netlify.toml` die SPA-Weiterleitung hat:\n\n```toml\n[[redirects]]\n  from = \"/*\"\n  to = \"/index.html\"\n  status = 200\n```\n\n### Funktionen funktionieren nicht\n\nFunktionslogs prüfen:\n1. Gehen Sie zum Functions-Tab\n2. Klicken Sie auf Ihre Funktion\n3. Logs ansehen\n\nStellen Sie sicher, dass der Funktionspfad mit der Konfiguration übereinstimmt:\n\n```typescript\nexport const config = {\n  path: \"/api/hello\"  // Muss mit Ihrer Route übereinstimmen\n}\n```\n\n### SSL-Probleme bei benutzerdefinierter Domain\n\n- Warten Sie 24 Stunden auf DNS-Verbreitung\n- Verifizieren Sie DNS-Einträge mit `dig` oder `nslookup`\n- Überprüfen Sie den HTTPS-Status in Domain settings\n- Versuchen Sie, das Zertifikat neu bereitzustellen\n\n## Rollbacks\n\nSofortiges Rollback auf eine frühere Bereitstellung:\n\n1. Gehen Sie zu Deploys\n2. Finden Sie die funktionierende Version\n3. Klicken Sie auf \"Publish deploy\"\n\nIhre Seite wird sofort zurückgesetzt. Kein Warten auf Builds.\n\n## Überwachung\n\n### Bereitstellungsbenachrichtigungen\n\nWerden Sie benachrichtigt, wenn Bereitstellungen erfolgreich sind oder fehlschlagen:\n\n1. Gehen Sie zu Site settings → Build \u0026 deploy → Deploy notifications\n2. Benachrichtigung hinzufügen (E-Mail, Slack, Webhook)\n3. Ereignisse wählen (Bereitstellung gestartet, erfolgreich, fehlgeschlagen)\n\n### Status-Badge\n\nFügen Sie ein Bereitstellungsstatus-Badge zu Ihrer README hinzu:\n\n```markdown\n[![Netlify Status](https://api.netlify.com/api/v1/badges/SITE_ID/deploy-status)](https://app.netlify.com/sites/SITE_NAME/deploys)\n```\n\n## Preise\n\nDie kostenlose Stufe von Netlify umfasst:\n- 300 Build-Minuten/Monat\n- 100GB Bandbreite/Monat\n- Unbegrenzte Seiten\n- Bereitstellungsvorschauen\n- HTTPS\n- Formulare (100 Einsendungen/Monat)\n\nUpgrade auf Pro (19$/Monat) für:\n- Mehr Bandbreite und Build-Minuten\n- Analytik\n- Team-Zusammenarbeit\n- Prioritätssupport\n\n## Best Practices\n\n**`netlify.toml` verwenden** - Versionskontrolle Ihrer Build-Konfiguration\n\n**Bereitstellungsvorschauen aktivieren** - Änderungen vor dem Zusammenführen überprüfen\n\n**Benachrichtigungen einrichten** - Sofort wissen, wenn Bereitstellungen fehlschlagen\n\n**Umgebungsvariablen verwenden** - Geheimnisse aus dem Code halten\n\n**Weiterleitungen konfigurieren** - URL-Änderungen richtig handhaben\n\n**Analytik überwachen** - Verstehen, wie Benutzer durch Ihre Docs navigieren\n\n**Lokal testen** - Zuerst `npm run build:export \u0026\u0026 npx serve out` ausführen\n\n## Nächste Schritte\n\n\u003cCardGrid cols={2}\u003e\n  \u003cCard\n    icon=\"triangle\"\n    title=\"Vercel\"\n    description=\"Stattdessen auf Vercel bereitstellen\"\n    href=\"/docs/v1.0.0/deployment/vercel\"\n  /\u003e\n  \u003cCard\n    icon=\"github\"\n    title=\"GitHub Pages\"\n    description=\"Kostenloses Hosting mit GitHub Pages\"\n    href=\"/docs/v1.0.0/deployment/github-pages\"\n  /\u003e\n  \u003cCard\n    icon=\"arrow-left\"\n    title=\"Bereitstellungsübersicht\"\n    description=\"Alle Bereitstellungsoptionen ansehen\"\n    href=\"/docs/v1.0.0/deployment/overview\"\n  /\u003e\n  \u003cCard\n    icon=\"zap\"\n    title=\"Leistung\"\n    description=\"Optimieren Sie Ihre Dokumentation\"\n    href=\"/docs/v1.0.0/performance\"\n  /\u003e\n\u003c/CardGrid\u003e\n"])</script><script>self.__next_f.push([1,"3b:T1233,"])</script><script>self.__next_f.push([1,"\n## Inhaltsfunktionen\n\n### MDX-Unterstützung\n\nSchreiben Sie Dokumentation in MDX – Markdown mit eingebauten React-Komponenten.\n\n```mdx\n# Hallo Welt\n\nDies ist **Markdown** mit einer \u003cBadge variant=\"success\"\u003eReact-Komponente\u003c/Badge\u003e!\n```\n\n\u003cCallout type=\"tip\"\u003e\nMDX ermöglicht es Ihnen, interaktive, dynamische Dokumentation zu erstellen, die über statischen Text hinausgeht.\n\u003c/Callout\u003e\n\n### Syntax-Hervorhebung\n\nCodeblöcke erhalten automatisch Syntax-Hervorhebung mit Zeilennummern:\n\n```typescript\ninterface User {\n  id: string;\n  name: string;\n  email: string;\n}\n\nfunction greetUser(user: User): string {\n  return `Hello, ${user.name}!`;\n}\n```\n\nUnterstützte Sprachen umfassen JavaScript, TypeScript, Python, Bash, JSON, CSS und viele mehr.\n\n### Mathematische Gleichungen\n\nRendern Sie mathematische Gleichungen mit KaTeX:\n\nInline: \u003cMath\u003e{\"E = mc^2\"}\u003c/Math\u003e\n\nBlock:\n\u003cMath block\u003e\n  {\"\\\\int_{-\\\\infty}^{\\\\infty} e^{-x^2} dx = \\\\sqrt{\\\\pi}\"}\n\u003c/Math\u003e\n\n### Mermaid-Diagramme\n\nErstellen Sie Diagramme aus Text mit Mermaid:\n\n\u003cMermaid\n  chart={`\n    graph LR\n      A[MDX schreiben] --\u003e B[Build]\n      B --\u003e C[Bereitstellen]\n      C --\u003e D[Benutzer lesen Docs]\n  `}\n  caption=\"Dokumentations-Workflow\"\n/\u003e\n\n## Navigationsfunktionen\n\n### Automatische Seitenleiste\n\nDie Seitenleiste wird automatisch aus Ihrer Ordnerstruktur generiert. Verwenden Sie `_category_.json` zum Anpassen:\n\n```json\n{\n  \"label\": \"Anleitungen\",\n  \"position\": 2,\n  \"collapsible\": true,\n  \"collapsed\": false\n}\n```\n\n### Inhaltsverzeichnis\n\nEin schwebendes Inhaltsverzeichnis wird automatisch aus Ihren Überschriften generiert. Es hebt den aktuellen Abschnitt beim Scrollen hervor.\n\n### Brotkrümel\n\nBrotkrümelnavigation hilft Benutzern, ihren Standort in der Dokumentationshierarchie zu verstehen.\n\n### Versionswechsler\n\nUnterstützung mehrerer Dokumentationsversionen mit einfachem Umschalten:\n\n- `/docs/v1.0.0/getting-started`\n- `/docs/v2.0.0/getting-started`\n- `/docs/next/getting-started` (unveröffentlicht)\n\n## Suche\n\n### Volltextsuche\n\nAngetrieben von Meilisearch für sofortige, tippo-tolerante Suchergebnisse.\n\n- **Tastaturkürzel**: Drücken Sie `⌘K` oder `Ctrl+K`, um die Suche zu öffnen\n- **Tippo-Toleranz**: Findet Ergebnisse auch bei Rechtschreibfehlern\n- **Hervorgehobene Ergebnisse**: Sehen Sie, wo Ihre Anfrage übereinstimmt\n\n### Suchindizierung\n\nDie Dokumentation wird zur Build-Zeit automatisch für eine schnelle Suche indiziert.\n\n## Theme \u0026 Styling\n\n### Dark Mode\n\nAutomatischer Dark Mode, der die Systemeinstellungen respektiert:\n\n- Heller Modus\n- Dunkler Modus\n- Systemeinstellung (auto)\n\nUmschalten mit der Schaltfläche im Header.\n\n### Anpassbares Design\n\nDas gesamte Styling basiert auf CSS-Variablen und Tailwind, was die Anpassung erleichtert:\n\n```css\n:root {\n  --primary: oklch(0.55 0.22 264.376);\n  --background: oklch(1 0 0);\n  --foreground: oklch(0.145 0 0);\n}\n```\n\n## Komponenten\n\n### Reiche Komponentenbibliothek\n\nEingebaute Komponenten für gängige Dokumentationsmuster:\n\n\u003cCardGrid cols={3}\u003e\n  \u003cCard icon=\"message-square\" title=\"Callouts\" description=\"Info, Warnung, Tipp, Fehler-Alarme\" /\u003e\n  \u003cCard icon=\"layers\" title=\"Tabs\" description=\"Getabte Inhaltsabschnitte\" /\u003e\n  \u003cCard icon=\"list\" title=\"Schritte\" description=\"Schritt-für-Schritt-Anleitungen\" /\u003e\n  \u003cCard icon=\"chevrons-up-down\" title=\"Akkordeon\" description=\"Einklappbarer Inhalt\" /\u003e\n  \u003cCard icon=\"grid\" title=\"Karten\" description=\"Feature-Karten mit Icons\" /\u003e\n  \u003cCard icon=\"code\" title=\"Code-Blöcke\" description=\"Syntax-hervorgehobener Code\" /\u003e\n\u003c/CardGrid\u003e\n\nSiehe den Abschnitt [Komponenten](/docs/v1.0.0/components) für die Dokumentation zu jeder Komponente.\n\n## Entwicklererfahrung\n\n### Hot Reload\n\nÄnderungen an MDX-Dateien werden sofort ohne vollständige Seitenaktualisierung angezeigt.\n\n### Frontmatter-Validierung\n\nFrontmatter-Felder werden zur Build-Zeit validiert, um Fehler frühzeitig zu erkennen.\n\n### SEO-Optimierung\n\nAutomatische Meta-Tags, OpenGraph-Bilder und strukturierte Daten aus Frontmatter:\n\n- Titel- und Beschreibungs-Tags\n- OpenGraph- und Twitter-Karten\n- Kanonische URLs\n- Sitemap-Generierung\n\n### Lesezeit\n\nAutomatische Berechnung und Anzeige der geschätzten Lesezeit für jede Seite.\n\n## Produktionsfunktionen\n\n### Statische Generierung\n\nAlle Seiten werden zur Build-Zeit für maximale Leistung vorgerendert:\n\n- Kein JavaScript für Inhalte erforderlich\n- Edge-Caching freundlich\n- Schnelle Time to First Byte (TTFB)\n\n### Leistung\n\n- Lighthouse-Score: 90+ (Desktop)\n- Lazy-loaded Bilder mit Next.js Image\n- Code-Splitting für Komponenten\n\n### Barrierefreiheit\n\n- Tastaturnavigation\n- Screenreader-Unterstützung\n- Hoher Kontrast Unterstützung\n- Fokus-Management\n"])</script><script>self.__next_f.push([1,"3c:T1233,"])</script><script>self.__next_f.push([1,"\n## Inhaltsfunktionen\n\n### MDX-Unterstützung\n\nSchreiben Sie Dokumentation in MDX – Markdown mit eingebauten React-Komponenten.\n\n```mdx\n# Hallo Welt\n\nDies ist **Markdown** mit einer \u003cBadge variant=\"success\"\u003eReact-Komponente\u EILI_MASTER_KEY=\"aSampleMasterKey\" \\\n  -v $(pwd)/meili_data:/meili_data \\\n  getmeili/meilisearch:latest\n```\n\nDies startet MeiliSearch auf `http://localhost:7700` mit einem Master Key zur Authentifizierung.\n\n\u003cCallout type=\"warning\"\u003e\n  Verwenden Sie einen starken Master Key in der Produktion! Dieser Beispielschlüssel ist nur für die Entwicklung.\n\u003c/Callout\u003e\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Konfigurieren Sie Specra\"\u003e\n    Aktualisieren Sie Ihre `specra.config.json`:\n\n```json\n{\n  \"search\": {\n    \"enabled\": true,\n    \"provider\": \"meilisearch\",\n    \"placeholder\": \"Suche Dokumentation...\",\n    \"meilisearch\": {\n      \"host\": \"http://localhost:7700\",\n      \"apiKey\": \"aSampleMasterKey\",\n      \"indexName\": \"docs\"\n    }\n  }\n}\n```\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Indizieren Sie Ihre Inhalte\"\u003e\n    Specra enthält Indizierungs-Utilities. Führen Sie dies im Stammverzeichnis Ihres Projekts aus:\n\n```bash\nnpm run index:search\n```\n\nDies scannt Ihren `docs/`-Ordner und sendet alle Inhalte an MeiliSearch zur Indizierung.\n\n\u003cCallout type=\"info\"\u003e\n  Führen Sie den Indizierungsbefehl erneut aus, wann immer Sie Dokumentation hinzufügen oder aktualisieren.\n\u003c/Callout\u003e\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Testen Sie die Suche\"\u003e\n    Starten Sie Ihren Entwicklungsserver:\n\n```bash\nnpm run dev\n```\n\nDrücken Sie **⌘K** (Mac) oder **Ctrl+K** (Windows/Linux), um das Suchmodal zu öffnen. Beginnen Sie zu tippen, um sofortige Ergebnisse zu sehen!\n  \u003c/Step\u003e\n\u003c/Steps\u003e\n\n## MeiliSearch-Konfiguration\n\n### Konfigurationsoptionen\n\nAlle MeiliSearch-Einstellungen befinden sich in `specra.config.json` unter dem Abschnitt `search`:\n\n```json\n{\n  \"search\": {\n    \"enabled\": true,\n    \"provider\": \"meilisearch\",\n    \"placeholder\": \"Doku durchsuchen...\",\n    \"meilisearch\": {\n      \"host\": \"http://localhost:7700\",\n      \"apiKey\": \"your-api-key\",\n      \"indexName\": \"docs\"\n    }\n  }\n}\n```\n\n**Feldreferenz:**\n\n| Feld | Typ | Beschreibung |\n|------|-----|--------------|\n| `enabled` | boolean | Suchfunktion aktivieren/deaktivieren |\n| `provider` | string | \"meilisearch\" oder \"local\" |\n| `placeholder` | string | Platzhaltertext im Suchfeld |\n| `meilisearch.host` | string | MeiliSearch Server-URL |\n| `meilisearch.apiKey` | string | API-Schlüssel zur Authentifizierung |\n| `meilisearch.indexName` | string | Indexname für Ihre Dokumente |\n\n### Suchschlüssel vs. Master Key\n\nMeiliSearch verwendet zwei Arten von Schlüsseln:\n\n**Master Key** (Entwicklung)\n- Voller Zugriff auf alle Operationen\n- Wird zum Indizieren von Inhalten verwendet\n- Niemals im clientseitigen Code in der Produktion offenlegen\n\n**Suchschlüssel** (Produktion)\n- Nur Lesezugriff\n- Sicher im Browser zu verwenden\n- Aus Master Key generieren\n\nGenerieren Sie einen Suchschlüssel:\n\n```bash\ncurl -X POST 'http://localhost:7700/keys' \\\n  -H 'Authorization: Bearer aSampleMasterKey' \\\n  -H 'Content-Type: application/json' \\\n  --data-binary '{\n    \"description\": \"Suchschlüssel für Dokumentation\",\n    \"actions\": [\"search\"],\n    \"indexes\": [\"docs\"],\n    \"expiresAt\": null\n  }'\n```\n\nVerwenden Sie den zurückgegebenen Schlüssel in Ihrer Produktionskonfiguration.\n\n## Produktionsbereitstellung\n\n### Hosting von MeiliSearch\n\nFür die Produktion müssen Sie MeiliSearch getrennt von Ihren Dokumenten hosten. Optionen:\n\n**MeiliSearch Cloud** (Einfachste)\n- Offizielles verwaltetes Hosting\n- Startet bei $0.02/Stunde\n- Automatische Backups und Updates\n- Besuchen Sie [meilisearch.com/cloud](https://www.meilisearch.com/cloud)\n\n**Selbst gehostet auf VPS**\n- DigitalOcean, AWS, Google Cloud usw.\n- Mehr Kontrolle, erfordert Wartung\n- Verwenden Sie Docker oder binäre Installation\n\n**Railway / Render / Fly.io**\n- Ein-Klick-Bereitstellungsoptionen verfügbar\n- Gut für kleine bis mittlere Projekte\n\n### Produktionskonfiguration\n\nAktualisieren Sie `specra.config.json` für die Produktion:\n\n```json\n{\n  \"search\": {\n    \"enabled\": true,\n    \"provider\": \"meilisearch\",\n    \"meilisearch\": {\n      \"host\": \"https://your-meilisearch-domain.com\",\n      \"apiKey\": \"your-public-search-key\",\n      \"indexName\": \"docs\"\n    }\n  }\n}\n```\n\n\u003cCallout type=\"warning\"\u003e\n  Verwenden Sie in der Produktion immer einen reinen Such-API-Schlüssel, niemals Ihren Master Key!\n\u003c/Callout\u003e\n\n### Indizierung in CI/CD\n\nAutomatisieren Sie die Indizierung bei der Bereitstellung. Beispiel GitHub Action:\n\n```yaml\nname: Index Documentation\n\non:\n  push:\n    branches: [main]\n    paths:\n      - 'docs/**'\n\njobs:\n  index:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v3\n\n      - name: Setup Node.js\n        uses: actions/setup-node@v3\n        with:\n          node-version: '18'\n\n      - name: Install dependencies\n        run: npm ci\n\n      - name: Index documentation\n        env:\n          MEILISEARCH_HOST: ${{ secrets.MEILISEARCH_HOST }}\n          MEILISEARCH_API_KEY: ${{ secrets.MEILISEARCH_MASTER_KEY }}\n        run: npm run index:search\n```\n\nSpeichern Sie Ihre MeiliSearch-Anmeldeinformationen als GitHub Secrets.\n\n## Anpassen des Suchverhaltens\n\n### Sucheinstellungen\n\nKonfigurieren Sie, wie MeiliSearch Suchanfragen behandelt:\n\n```javascript\n// In Ihrem Indizierungsskript\nconst settings = {\n  searchableAttributes: [\n    'title',\n    'description',\n    'content',\n    'headings'\n  ],\n  displayedAttributes: [\n    'title',\n    'description',\n    'url',\n    'breadcrumb'\n  ],\n  rankingRules: [\n    'words',\n    'typo',\n    'proximity',\n    'attribute',\n    'sort',\n    'exactness'\n  ],\n  stopWords: ['the', 'a', 'an'],\n  synonyms: {\n    'js': ['javascript'],\n    'ts': ['typescript']\n  }\n}\n```\n\n### Filter\n\nFügen Sie Filter hinzu, um Suchergebnisse einzugrenzen:\n\n```json\n{\n  \"search\": {\n    \"meilisearch\": {\n      \"filters\": \"version = 'v1.0.0'\"\n    }\n  }\n}\n```\n\nDies zeigt nur Ergebnisse aus einer bestimmten Version an.\n\n## Lokale Suche (Alternative)\n\nWenn Sie MeiliSearch nicht ausführen möchten, verwenden Sie die lokale Suche:\n\n```json\n{\n  \"search\": {\n    \"enabled\": true,\n    \"provider\": \"local\",\n    \"placeholder\": \"Dokumentation durchsuchen...\"\n  }\n}\n```\n\nLokale Suche:\n- ✅ Funktioniert sofort, keine Einrichtung\n- ✅ Keine externen Abhängigkeiten\n- ✅ Kostenlos\n- ❌ Weniger leistungsfähig als MeiliSearch\n- ❌ Keine Tippfehlertoleranz\n- ❌ Langsamer für große Dokumentationsseiten\n\nDie lokale Suche wird während `npm run build` automatisch erstellt.\n\n## Tastaturkürzel\n\nBenutzer können die Suche auslösen mit:\n\n- **⌘K** oder **Ctrl+K** - Suche öffnen\n- **Escape** - Suche schließen\n- **↑↓** - Ergebnisse navigieren\n- **Enter** - Zum ausgewählten Ergebnis gehen\n\nDiese funktionieren sowohl mit lokalen als auch mit MeiliSearch-Optionen.\n\n## Fehlerbehebung\n\n### Suche erscheint nicht\n\n**Konfiguration prüfen:**\n```json\n{\n  \"search\": {\n    \"enabled\": true  // ← Muss true sein\n  }\n}\n```\n\n**Überprüfen, ob MeiliSearch läuft:**\n```bash\ncurl http://localhost:7700/health\n```\n\nSollte `{\"status\":\"available\"}` zurückgeben.\n\n### Keine Suchergebnisse\n\n**Inhalt neu indizieren:**\n```bash\nnpm run index:search\n```\n\n**Index-Existenz prüfen:**\n```bash\ncurl -X GET 'http://localhost:7700/indexes' \\\n  -H 'Authorization: Bearer aSampleMasterKey'\n```\n\n### CORS-Fehler\n\nWenn Sie CORS-Fehler in der Browser-Konsole erhalten, konfigurieren Sie MeiliSearch so, dass es Ihre Domain zulässt:\n\n```bash\ndocker run -d \\\n  --name meilisearch \\\n  -p 7700:7700 \\\n  -e MEILI_MASTER_KEY=\"aSampleMasterKey\" \\\n  -e MEILI_HTTP_ADDR=\"0.0.0.0:7700\" \\\n  -e MEILI_NO_ANALYTICS=true \\\n  getmeili/meilisearch:latest\n```\n\nOder setzen Sie CORS-Header in Ihrem Reverse Proxy.\n\n### Langsame Indizierung\n\nFür große Dokumentationsseiten (1000+ Seiten):\n\n- Inkrementell indizieren (nur geänderte Dateien)\n- Batch-Anfragen verwenden\n- MeiliSearch-Speicherzuweisung erhöhen\n- Indizierung in Hintergrundjobs ausführen\n"])</script><script>self.__next_f.push([1,"3e:T2239,"])</script><script>self.__next_f.push([1,"\n# Einrichtung der Suche\n\nSpecra unterstützt eine leistungsstarke Volltextsuche durch MeiliSearch-Integration. Dieser Leitfaden zeigt Ihnen, wie Sie die Suche für Ihre Dokumentation einrichten und konfigurieren.\n\n## Suchoptionen\n\nSpecra bietet zwei Suchlösungen:\n\n**Lokale Suche** (Standard)\n- Funktioniert sofort\n- Keine externen Abhängigkeiten\n- Gut für kleine bis mittlere Dokumentationsseiten\n- Sucht im Browser\n\n**MeiliSearch** (Empfohlen für Produktion)\n- Blitzschnelle Suchmaschine\n- Tippfehlertoleranz\n- Sofortige Ergebnisse\n- Besser für große Dokumentationsseiten\n- Erfordert separaten Server\n\n## Schnellstart mit MeiliSearch\n\n### Voraussetzungen\n\n- Docker (einfachste Einrichtung) oder die Möglichkeit, einen MeiliSearch-Server auszuführen\n- Ihre Dokumentationsseite bereits mit Specra eingerichtet\n\n### Installation\n\n\u003cSteps\u003e\n  \u003cStep title=\"Führen Sie MeiliSearch mit Docker aus\"\u003e\n    Der einfachste Weg, MeiliSearch lokal auszuführen:\n\n```bash\ndocker run -d \\\n  --name meilisearch \\\n  -p 7700:7700 \\\n  -e MEILI_MASTER_KEY=\"aSampleMasterKey\" \\\n  -v $(pwd)/meili_data:/meili_data \\\n  getmeili/meilisearch:latest\n```\n\nDies startet MeiliSearch auf `http://localhost:7700` mit einem Master Key zur Authentifizierung.\n\n\u003cCallout type=\"warning\"\u003e\n  Verwenden Sie einen starken Master Key in der Produktion! Dieser Beispielschlüssel ist nur für die Entwicklung.\n\u003c/Callout\u003e\n  \u003c/Step\u003e\n\n  \u003cStep title=\"Konfigurieren Sie Specra\"\u003e\n    Aktualisieren Sie Ihre `specra.config.json`:\n\n```json\n{ nrichtung\n- ✅ Keine externen Abhängigkeiten\n- ✅ Kostenlos\n- ❌ Weniger leistungsfähig als MeiliSearch\n- ❌ Keine Tippfehlertoleranz\n- ❌ Langsamer für große Dokumentationsseiten\n\nDie lokale Suche wird während `npm run build` automatisch erstellt.\n\n## Tastaturkürzel\n\nBenutzer können die Suche auslösen mit:\n\n- **⌘K** oder **Ctrl+K** - Suche öffnen\n- **Escape** - Suche schließen\n- **↑↓** - Ergebnisse navigieren\n- **Enter** - Zum ausgewählten Ergebnis gehen\n\nDiese funktionieren sowohl mit lokalen als auch mit MeiliSearch-Optionen.\n\n## Fehlerbehebung\n\n### Suche erscheint nicht\n\n**Konfiguration prüfen:**\n```json\n{\n  \"search\": {\n    \"enabled\": true  // ← Muss true sein\n  }\n}\n```\n\n**Überprüfen, ob MeiliSearch läuft:**\n```bash\ncurl http://localhost:7700/health\n```\n\nSollte `{\"status\":\"available\"}` zurückgeben.\n\n### Keine Suchergebnisse\n\n**Inhalt neu indizieren:**\n```bash\nnpm run index:search\n```\n\n**Index-Existenz prüfen:**\n```bash\ncurl -X GET 'http://localhost:7700/indexes' \\\n  -H 'Authorization: Bearer aSampleMasterKey'\n```\n\n### CORS-Fehler\n\nWenn Sie CORS-Fehler in der Browser-Konsole erhalten, konfigurieren Sie MeiliSearch so, dass es Ihre Domain zulässt:\n\n```bash\ndocker run -d \\\n  --name meilisearch \\\n  -p 7700:7700 \\\n  -e MEILI_MASTER_KEY=\"aSampleMasterKey\" \\\n  -e MEILI_HTTP_ADDR=\"0.0.0.0:7700\" \\\n  -e MEILI_NO_ANALYTICS=true \\\n  getmeili/meilisearch:latest\n```\n\nOder setzen Sie CORS-Header in Ihrem Reverse Proxy.\n\n### Langsame Indizierung\n\nFür große Dokumentationsseiten (1000+ Seiten):\n\n- Inkrementell indizieren (nur geänderte Dateien)\n- Batch-Anfragen verwenden\n- MeiliSearch-Speicherzuweisung erhöhen\n- Indizierung in Hintergrundjobs ausführen\n"])</script><script>self.__next_f.push([1,"3f:T811,"])</script><script>self.__next_f.push([1,"\nDiese Seite demonstriert die automatische Generierung von API-Dokumentation aus einer **Postman Collection v2.1**.\n\nExportieren Sie Ihre Postman alisieren!\n\u003c/Callout\u003e\n"])</script><script>self.__next_f.push([1,"40:T811,"])</script><script>self.__next_f.push([1,"\nDiese Seite demonstriert die automatische Generierung von API-Dokumentation aus einer **Postman Collection v2.1**.\n\nExportieren Sie Ihre Postman-Sammlung und fügen Sie sie ein – die Dokumentation wird automatisch generiert!\n\n\u003cCallout type=\"success\" title=\"Funktioniert mit Postman!\"\u003e\nExportieren Sie einfach Ihre Sammlung aus Postman (v2.0 oder v2.1) und referenzieren Sie sie hier. Keine Konvertierung erforderlich!\n\u003c/Callout\u003e\n\n---\n\n\u003cApiReference spec=\"/api-specs/postman-example.json\" /\u003e\n\n---\n\n## Über dieses Beispiel\n\nDieses Beispiel zeigt, wie der Parser umgeht mit:\n\n- ✅ **Postman Collection v2.x** Format-Erkennung\n- ✅ **Ordnerorganisation** (verschachtelte Elemente abgeflacht)\n- ✅ **Umgebungsvariablen** (`{{baseUrl}}` Interpolation)\n- ✅ **Pfadparameter** (`:id` Syntax beibehalten)\n- ✅ **Query-Parameter** mit Beschreibungen\n- ✅ **Request-Bodys** (raw, form-data, urlencoded)\n- ✅ **Antwortbeispiele** aus gespeicherten Antworten\n- ✅ **Authentifizierung** (Bearer, API Key, Basic)\n\n## So verwenden Sie Ihre Postman-Sammlung\n\n### Schritt 1: Aus Postman exportieren\n\n1. Öffnen Sie Ihre Sammlung in Postman\n2. Klicken Sie auf das Menü mit den **drei Punkten** (•••)\n3. Wählen Sie **Export**\n4. Wählen Sie **Collection v2.1** (empfohlen)\n5. Speichern Sie die JSON-Datei\n\n### Schritt 2: Zu Ihren Dokumenten hinzufügen\n\n1. **Platzieren Sie die Datei** in `/public/api-specs/`\n2. **Referenzieren Sie sie** in Ihrem MDX:\n\n```mdx\n\u003cApiReference spec=\"/api-specs/my-collection.json\" parser=\"postman\" /\u003e\n```\n\nOder verwenden Sie die automatische Erkennung:\n\n```mdx\n\u003cApiReference spec=\"/api-specs/my-collection.json\" /\u003e\n```\n\n### Schritt 3: Viel Spaß!\n\nIhre gesamte Postman-Sammlung ist jetzt wunderschön dokumentiert mit:\n- Interaktivem Playground zum Testen\
