name: Deploy SvelteKit Documentation

on:
  push:
    branches:
      - main  # Trigger deployment when pushing to 'main' branch
#   pull_request:
#     branches:
#       - main  # Validate documentation on pull requests

jobs:
  validate:
    name: Validate Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate documentation structure
        run: |
          echo "Validating documentation..."
          if [ ! -f "svelte.config.js" ]; then
            echo "Error: SvelteKit config not found"
            exit 1
          fi
          echo "SvelteKit config found"
          echo "Documentation structure validated"

      - name: Type check
        run: npm run check
        continue-on-error: true

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: write  # Required for pushing to gh-pages branch

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build SvelteKit documentation
        run: |
          echo "Building SvelteKit documentation..."
          npm run build
          echo "Build completed"
        env:
          NODE_ENV: production

      - name: Add .nojekyll
        run: touch ./build/.nojekyll

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build  # SvelteKit adapter-static outputs to build/
          publish_branch: gh-pages
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Deploy SvelteKit documentation [skip ci]'

      - name: Deployment summary
        run: |
          echo "Documentation deployed to GitHub Pages"
          echo "View at: https://specra-docs.com"
          echo "Or: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
