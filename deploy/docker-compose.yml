version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: specra-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-specra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-specra_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-specra}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-specra}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - specra-network

  # Next.js Application
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: specra-app
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-specra}:${POSTGRES_PASSWORD:-specra_secure_password}@db:5432/${POSTGRES_DB:-specra}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Mount uploads directory if needed
      - app_uploads:/app/public/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - specra-network

networks:
  specra-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  app_uploads:
    driver: local
